# Publish Tortoise Self-Host image to GHCR (#338 D2/T4.2)
# Image: ghcr.io/daniel-ospina/tortoise-selfhost:${GITHUB_REF_NAME}
# Build + publish on tag v* or manual dispatch; smoke job verifies the image
# boots (embedded eval) and serves /health + the MCP initialize handshake.
name: Publish Self-Host Image

on:
  push:
    branches: [main]   # publishes :latest for the README quickstart
    tags: ['v*']       # publishes semver tags
    # #4223: only rebuild when a path that can actually change the image
    # changes. Without this, every merge — docs-only ones included — rebuilt
    # and pushed an identical image (~40 runs/day at 6–15 min ≈ 9h of runner
    # time). This is the exact build-input set of Dockerfile.selfhost
    # (build context `.`): its COPY directives plus the files that shape the
    # build context, and nothing else.
    #   Dockerfile.selfhost            the build recipe itself
    #   .dockerignore                  mutates the build context (it excludes
    #                                  e.g. tortoise/*.egg-info from COPY)
    #   requirements.txt               COPY'd + pip-installed (pinned deps)
    #   pyproject.toml                 COPY'd; `pip install '.[embeddings]'`
    #                                  resolves the extras from it
    #   packs/**                       COPY'd — starter pack catalog
    #   tortoise/**                    COPY'd — the package sources
    #   tests/sample_transcript.txt    COPY'd — asserted by packaging-smoke
    #   .github/workflows/publish-selfhost.yml
    #                                  self-trigger, so a change to THIS
    #                                  workflow takes effect without a manual
    #                                  dispatch (same lesson as #1118)
    # Deliberately NOT listed: uv.lock (never COPY'd and never read by the
    # build — requirements.txt is the exported artifact the Dockerfile
    # installs, so a lock-only change cannot alter the image); Dockerfile.hosted,
    # docker-compose.yml and fly.toml (different artifacts, not build inputs).
    # Tag pushes are unaffected: GitHub does not evaluate `paths` for tag
    # pushes, so every `v*` release still builds and publishes.
    paths:
      - 'Dockerfile.selfhost'
      - '.dockerignore'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'packs/**'
      - 'tortoise/**'
      - 'tests/sample_transcript.txt'
      - '.github/workflows/publish-selfhost.yml'
  workflow_dispatch:

jobs:
  # #1929 (G1 gate): the image must ship the pack catalog BEFORE publish.
  # Builds Dockerfile.selfhost from source (gha cache — the publish job
  # rebuilds incrementally) and asserts the in-container registry loads the
  # full starter set + the sample transcript. Bound derived from the
  # INSTALLED constant (4 today, 5 once #1933 merges — never hardcoded).
  packaging-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build selfhost image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: false
          # load: true — buildx's docker-container driver builds into an
          # isolated env; without load the image is never in the local
          # daemon and the `docker run` assertion below cannot find it.
          load: true
          tags: tortoise-selfhost:smoke
          cache-from: type=gha
      - name: In-container pack assertion (no boot, no secrets)
        run: |
          docker run --rm --entrypoint python tortoise-selfhost:smoke -c '
          from pathlib import Path
          from tortoise.domain_loader import _get_registry
          from tortoise.pack_state import DEFAULT_STARTER_PACKS
          bound = len(DEFAULT_STARTER_PACKS)
          reg = _get_registry()
          assert reg is not None, "registry None in container"
          assert len(reg.packs) >= bound, f"container packs {len(reg.packs)} < starter {bound}"
          assert set(reg.packs) >= set(DEFAULT_STARTER_PACKS), "wrong pack set in container"
          assert Path("/app/tests/sample_transcript.txt").exists(), "transcript missing"
          print(f"selfhost image pack smoke OK: {len(reg.packs)} >= {bound}")
          '

  build-and-publish:
    runs-on: ubuntu-latest
    # Hard gate (intentional): a publish path never ships unverified — the
    # selfhost image smoke must pass before push. Unlike deploy-hosted (which
    # has skip-pack-smoke for incident-fix deploys), a publish flake is
    # re-dispatchable at the operator's discretion; no silent bypass exists
    # here by design (code-review P2).
    needs: packaging-smoke
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/daniel-ospina/tortoise-selfhost
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Run self-host image (embedded eval) and verify
        run: |
          set -euo pipefail
          # Use the tag the build job actually published (single source of
          # truth — works for tag pushes, main pushes, and manual dispatch).
          IMG="$(echo "${{ needs.build-and-publish.outputs.image }}" | cut -d',' -f1)"
          docker run -d --name tortoise-smoke -p 18000:8000 \
            -e TORTOISE_DB_URI='' \
            -e TORTOISE_DB_PATH=/data/smoke.db \
            "$IMG"
          trap 'docker rm -f tortoise-smoke >/dev/null 2>&1 || true' EXIT

          # Wait for /health (up to 60s)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null 2>&1; then
              echo "health OK"
              break
            fi
            [ "$i" = "60" ] && { echo "::error::image never became healthy"; exit 1; }
            sleep 1
          done

          # Readiness touches the real DB path (embedded eval) — catches DB
          # misconfiguration the initialize handshake would miss.
          curl -fsS http://127.0.0.1:18000/health/ready | grep -q '"ready"' \
            || { echo "::error::health/ready not ready (embedded DB broken)"; exit 1; }
          echo "health/ready OK"

          # MCP initialize handshake (auth_mode=none — no key set, loopback smoke).
          # -L: Starlette Mount serves the sub-app at /mcp/ and 307s POST /mcp
          # → /mcp/ (trailing-slash redirect). Real MCP clients follow the
          # redirect; bare curl -fsS does not, which made this smoke fail on
          # every run since it shipped (#fix). -L mirrors client behavior.
          curl -fsSL -X POST http://127.0.0.1:18000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            | grep -q '"result"' || { echo "::error::MCP initialize handshake failed"; exit 1; }
          echo "MCP initialize OK"
