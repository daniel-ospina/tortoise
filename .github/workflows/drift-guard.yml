# drift-guard CI gate (epic #1509 P3 / issue #1531; #4174; #4764)
# Fails when a merge of the branch would not keep main's content for a path
# main moved AND the merge is conflict-free (#4174 — the conflict-free revert;
# predicate corrected by #7455). It also REPORTS how far behind origin/main the
# branch is, and since #4764 does NOT fail on that distance: the count was a
# proxy for a stale measurement, and it reddened branches that were merely
# behind (measured 2026-10-07: 24 and 21 commits behind, every other check
# green). The revert arm is unchanged and is what this gate still refuses:
# a merge that would not keep main's content. The tool fetches
# origin/main first and fails closed when freshness cannot be proven, so a
# never-fetched worktree cannot pass on a stale ref.
#
# #4174: the checkout MUST be the PR HEAD. actions/checkout's default ref on
# `pull_request` is the synthetic `refs/pull/<N>/merge` ref, which CONTAINS
# the base tip by construction — measuring it reports behind=0 and no revert
# for every PR, making the gate structurally inert. Pinning `ref` to the PR
# head is what makes the gate measure what it claims.
# Follows redis-guard.yml conventions (checkout@v4, python3 tools/).
name: drift-guard
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The closes-coherence step below reads the PR body and the base branch's PR.
  # Read-only, and it never writes (no comments, no labels, no closures).
  pull-requests: read

concurrency:
  group: drift-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    # No cap before this line → GitHub's 360m default. The step is a full-history
    # fetch plus one local tool, so a wedged fetch held a queued runner slot for
    # hours. Not a branch-protection context (it is absent from .mergify.yml and
    # from the live required set) but it is on the merge path — it refuses a
    # merge that would revert main — and it is cheap to bound.
    # Measured 2026-10-27 (40 newest runs, 2026-10-27T01:44Z..04:08Z, completed
    # only): p50 0.33m, p95 0.37m, max 0.43m (n=22). 15m is the runner-stall
    # floor. See docs/ops/ci-wall-clock.md.
    timeout-minutes: 15
    steps:
      # fetch-depth 0: counting commits behind origin/main needs full history.
      # ref: the PR HEAD (#4174) — NOT the default merge ref, which contains
      # the base and would make every measurement vacuously current.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # tools/drift-guard.py carries the inline >=3.12 guard (#5128).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The #9018 contract step: the `Closes-coherence` step below reaches `gh` for
      # every measurement, and a pool runner without it would make that step a
      # permanent UNMEASURED warning (see tests/test_runner_tool_contract.py).
      - name: Ensure gh
        run: bash .github/scripts/runner-tools.sh ensure gh
      - name: Run drift-guard
        run: python3 tools/drift-guard.py
      # ── A `Closes #N` on a NON-default base is INERT (#10597) ────────────────
      # GitHub fires a closing keyword only on a merge into the DEFAULT branch,
      # so a stacked PR's `Closes #N` closes nothing and lands nothing while the
      # PR reads MERGED and CI is green. Measured: #10568 (base `act-10465`,
      # `Closes #10541`) merged with a merge commit that is not an ancestor of
      # main, and #10541 is still open — the work only lands when #10519 merges,
      # and #10519 carries no `Closes #10541`. A one-line warning on the stacked
      # PR while it is still open is the whole instrument (#10597: "Not a new
      # gate"); stacking is legitimate, so this step WARNS and never refuses.
      # `continue-on-error` is the non-blocking guarantee, not a bypass: the
      # comment above NAMES the populating path, so the arm is never silently
      # empty, and a `gh`/API failure surfaces as an UNMEASURED annotation
      # instead of a green step.
      - name: Closes-coherence (warn only)
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `set +e` because GitHub runs `bash -e` by default: without it the
          # tool's rc=3 (inert found) aborts the script BEFORE `rc=$?`, which
          # made the UNMEASURED arm below dead code. The whole point of this
          # step is to read the code, so the read has to happen.
          set +e
          python3 tools/closes_landing.py --pr "$PR_NUMBER" --annotate \
            --repo "${{ github.repository }}"
          rc=$?
          set -e
          # ANY code the tool did not define (0 = nothing inert, 3 = inert or
          # unresolved) is UNMEASURED, not a pass: a traceback (rc=1) used to
          # print nothing and go green, indistinguishable from "no inert
          # closing refs". `rc` is named so 2 and 1 stay distinguishable.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::warning title=Closes-coherence UNMEASURED::rc=$rc — the closing-keyword check did not complete see the step log; this is NOT a pass"
          fi
          # The warnings above ARE the artifact; the step is deliberately green.
          exit 0
