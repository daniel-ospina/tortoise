# drift-guard CI gate (epic #1509 P3 / issue #1531; #4174; #4764)
# Fails when a merge of the branch would not keep main's content for a path
# main moved AND the merge is conflict-free (#4174 — the conflict-free revert;
# predicate corrected by #7455). It also REPORTS how far behind origin/main the
# branch is, and since #4764 does NOT fail on that distance: the count was a
# proxy for a stale measurement, and it reddened branches that were merely
# behind (measured 2026-10-07: 24 and 21 commits behind, every other check
# green). The revert arm is unchanged and is what this gate still refuses:
# a merge that would not keep main's content. The tool fetches
# origin/main first and fails closed when freshness cannot be proven, so a
# never-fetched worktree cannot pass on a stale ref.
#
# #4174: the checkout MUST be the PR HEAD. actions/checkout's default ref on
# `pull_request` is the synthetic `refs/pull/<N>/merge` ref, which CONTAINS
# the base tip by construction — measuring it reports behind=0 and no revert
# for every PR, making the gate structurally inert. Pinning `ref` to the PR
# head is what makes the gate measure what it claims.
# Follows redis-guard.yml conventions (checkout@v4, python3 tools/).
name: drift-guard
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    # No cap before this line → GitHub's 360m default. The step is a full-history
    # fetch plus one local tool, so a wedged fetch held a queued runner slot for
    # hours. Not a branch-protection context (it is absent from .mergify.yml and
    # from the live required set) but it is on the merge path — it refuses a
    # merge that would revert main — and it is cheap to bound.
    # Measured 2026-10-27 (40 newest runs, 2026-10-27T01:44Z..04:08Z, completed
    # only): p50 0.33m, p95 0.37m, max 0.43m (n=22). 15m is the runner-stall
    # floor. See docs/ops/ci-wall-clock.md.
    timeout-minutes: 15
    steps:
      # fetch-depth 0: counting commits behind origin/main needs full history.
      # ref: the PR HEAD (#4174) — NOT the default merge ref, which contains
      # the base and would make every measurement vacuously current.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # tools/drift-guard.py carries the inline >=3.12 guard (#5128).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run drift-guard
        run: python3 tools/drift-guard.py
