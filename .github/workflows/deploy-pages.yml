# Deploy Tortoise landing pages (premiselabs.co / tortoise.premiselabs.co) to Cloudflare Pages
name: Deploy Landing Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tortoise/onboarding/AGENT_ONBOARDING.md'
      - 'tortoise/onboarding/variants/**'
      - 'tortoise/onboarding/stage_variants.py'
      # #1118: workflow changes must self-deploy — the #1113 merge (which
      # added the dashboard job) did NOT trigger this workflow because the
      # workflow file wasn't in its own paths filter; it required manual
      # dispatch.
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage onboarding prompt + harness variants (single source of truth → deployed copies)
        # tortoise/onboarding/AGENT_ONBOARDING.md is canonical (issues #496/#540).
        # The welcome page fetches https://premiselabs.co/onboarding-prompt.md
        # (canonical) and /onboarding/<harness>.md (epic #529 variants) at runtime;
        # stage_variants.py is the single concat point — headers wrap the canonical
        # body, never fork it, so the copies can't drift.
        run: |
          python3 tortoise/onboarding/stage_variants.py --out website
          test -s website/onboarding-prompt.md
          for h in claude-code codex cursor pi; do
            test -s "website/onboarding/$h.md"
          done
      - name: Sync DNS — tortoise.premiselabs.co → premise-labs Pages project (best-effort)
        # The subdomain previously CNAME'd to the legacy tortoise-landing-v2
        # Pages project (stale content: welcome v1, no onboarding-prompt.md),
        # which is why the premise-labs custom-domain attach stayed "pending"
        # and the old PROMPT_URL fetch returned HTML (#540).
        # Best-effort: the deploy token may lack Zone:DNS edit scope (auth error
        # is tolerated — the welcome page now uses premiselabs.co which is
        # already active). Once the token gains DNS scope this repairs the
        # subdomain automatically.
        continue-on-error: true
        run: |
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=premiselabs.co" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result[0].id')
          echo "zone: $ZONE"
          REC=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=tortoise.premiselabs.co" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          REC_ID=$(echo "$REC" | jq -r '.result[0].id // empty')
          CUR=$(echo "$REC" | jq -r '.result[0].content // empty')
          echo "current: id=$REC_ID content=$CUR"
          if [ "$CUR" != "premise-labs.pages.dev" ]; then
            echo "repairing CNAME $CUR → premise-labs.pages.dev"
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$REC_ID" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"tortoise.premiselabs.co","content":"premise-labs.pages.dev","proxied":true}' \
              | jq -c '{success, errors: [.errors[].message]}'
          else
            echo "CNAME already correct"
          fi
      - name: Deploy to Cloudflare Pages (premise-labs project)
        run: |
          cd website
          npx --yes wrangler@4 pages deploy . --project-name=premise-labs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 367c7ecf27e1b1b092d04fe9915a1e56

  # ── Dashboard (app.premiselabs.co → tortoise-dashboard Pages) ──────────
  # #1112: wire the dashboard into CI — closes #1086 + #1109 (two
  # stale-bundle incidents caused by the manual-only deploy.sh). The
  # dashboard's dist/ IS committed (merges carry it); this job rebuilds +
  # redeploys it on every website/** change. Same wrangler auth pattern as
  # the premise-labs job above (no new secrets).
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/apps/dashboard/package-lock.json
      - name: Build dashboard (vite)
        run: |
          cd website/apps/dashboard
          npm ci
          npm run build
      - name: Pre-flight — token can see tortoise-dashboard project (P2-1)
        # The CLOUDFLARE_API_TOKEN may be scoped per-project; assert the
        # dashboard project is visible BEFORE deploying so a 403-scoped
        # token fails fast (loud, at the right step) instead of silently
        # skipping the deploy.
        run: |
          # No per_page param — the Pages projects endpoint REJECTS it with
          # "Invalid list options provided" (known CF issue, error 8000024;
          # the docs list it but the API doesn't accept it). Returns the
          # default page — sufficient for this account's project count.
          LIST=$(curl -s --max-time 20 "https://api.cloudflare.com/client/v4/accounts/367c7ecf27e1b1b092d04fe9915a1e56/pages/projects"             -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")
          # Diagnostic: surface the API status + a snippet so a failing
          # pre-flight is debuggable (not just 'cannot list').
          STATUS=$(echo "$LIST" | jq -r '.success // empty' 2>/dev/null || echo 'parse-error')
          if [ "$STATUS" != "true" ]; then
            echo "::error::Cloudflare API did not return success — API response (first 300 chars):"
            echo "$(echo "$LIST" | head -c 300)"
            echo "::error::CLOUDFLARE_API_TOKEN cannot list Pages projects — check the token is Account > Cloudflare Pages > Edit and was saved to the repo secret."
            exit 1
          fi
          # jq is available on ubuntu runners (the DNS-sync step uses it) and
          # is whitespace-robust vs grep on raw JSON.
          # P1 (review): jq -e on a multi-element array exits on the LAST
          # output — order-dependent false-fail. any() collapses to one
          # boolean: exit 0 iff SOME project matches.
          if ! echo "$LIST" | jq -e 'any(.result[]?; .name == "tortoise-dashboard")' >/dev/null 2>&1; then
            echo "::error::tortoise-dashboard project not in the token's visible Pages projects."
            echo "projects visible: $(echo "$LIST" | jq -r '.result[]?.name' | tr '\n' ' ' || true)"
            exit 1
          fi
          echo "tortoise-dashboard project visible — deploying"
      - name: Deploy to Cloudflare Pages (tortoise-dashboard project)
        run: |
          cd website/apps/dashboard
          npx --yes wrangler@4 pages deploy dist --project-name=tortoise-dashboard --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 367c7ecf27e1b1b092d04fe9915a1e56
      - name: Post-deploy poll (app.premiselabs.co serves the new bundle hash)
        # The failure mode of both #1086 and #1109: nothing verified the
        # dashboard deploy. Poll until the served index.html references the
        # bundle hash we JUST BUILT (build step runs before this — the
        # committed dist hash is stale by definition).
        run: |
          # P3-1: compare BOTH js and css refs — a vite CSS-only change keeps
          # the JS hash identical, so a stale page with a new JS ref would
          # false-pass on JS alone.
          EXPECTED=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.(js|css)' website/apps/dashboard/dist/index.html | sort || true)
          if [ -z "$EXPECTED" ]; then
            echo "::error::build produced no assets/index-*.js|css ref — cannot verify deploy (P4-2)"
            exit 1
          fi
          echo "expected bundle refs: $EXPECTED"
          MAX_ATTEMPTS=20
          for i in $(seq 1 $MAX_ATTEMPTS); do
            SERVED=$(curl -s --max-time 20 https://app.premiselabs.co/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.(js|css)' | sort || true)
            if [ "$SERVED" = "$EXPECTED" ]; then
              echo "dashboard deploy verified — app.premiselabs.co serves the new bundle (attempt $i)"
              exit 0
            fi
            echo "attempt $i/$MAX_ATTEMPTS: served differs from expected, retrying in 30s..."
            sleep 30
          done
          echo "::error::dashboard bundle not live after $MAX_ATTEMPTS attempts (~10 min) — expected: $EXPECTED"
          exit 1

  # ── Post-deploy verification: legal pages E2E suite (#677) ───────────
  verify-legal:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Step 1: Deploy-completion poll — after the deploy step, poll
      # https://premiselabs.co/privacy → 200 (retry ~30s × 5–10 min).
      - name: Poll deploy completion (premiselabs.co/privacy → 200)
        run: |
          MAX_ATTEMPTS=20
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://premiselabs.co/privacy)
            if [ "$STATUS" = "200" ]; then
              echo "deploy complete — premiselabs.co/privacy returned 200 (attempt $i)"
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::deploy did not complete after $MAX_ATTEMPTS attempts (~$((MAX_ATTEMPTS * 30 / 60)) min)"
              exit 1
            fi
            echo "attempt $i/$MAX_ATTEMPTS: status $STATUS, retrying in 30s..."
            sleep 30
          done

      # Step 2: DNS preflight — dig +short tortoise.premiselabs.co CNAME
      # target == premise-labs.pages.dev + root-marker curl; green ⇒ set
      # TORTISE_HOST_CHECK=1 (tortoise.* tests run); stale ⇒ leave unset
      # (skip — green-with-annotation; the premiselabs.co half remains
      # the green signal).
      - name: DNS preflight (tortoise.premiselabs.co CNAME + root-marker)
        run: |
          CNAME=$(dig +short tortoise.premiselabs.co CNAME || true)
          echo "tortoise.premiselabs.co CNAME target: ${CNAME:-<none>}"
          # Accept trailing dot (standard dig output).
          if [ "$CNAME" = "premise-labs.pages.dev." ] || [ "$CNAME" = "premise-labs.pages.dev" ]; then
            ROOT_MARKER=$(curl -s https://tortoise.premiselabs.co/ 2>/dev/null || true)
            if echo "$ROOT_MARKER" | grep -qF "Memory that makes your agents"; then
              echo "TORTISE_HOST_CHECK=1" >> "$GITHUB_ENV"
              echo "DNS preflight green — tortoise.* tests enabled"
            else
              echo "::warning::tortoise host serves root but root-marker absent — tortoise.* tests skipped"
            fi
          else
            echo "::warning::tortoise.premiselabs.co CNAME stale (got '${CNAME:-<none>}', expected premise-labs.pages.dev) — tortoise.* tests skipped"
          fi

      # Step 3: pytest — mirroring the welcome-e2e-monitor workflow
      # conventions (checkout → setup-python 3.12 → pip install -e '.[test]' →
      # playwright install --with-deps chromium → pytest).
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run legal pages E2E suite
        # test_signup_form_safety_e2e.py joined here (#801): the 429-mock test
        # intercepts requests in the browser — no real signup against prod — but
        # verifies the DEPLOYED lockout code post-deploy.
        run: python -m pytest tests/e2e/test_legal_pages.py tests/e2e/test_signup_form_safety_e2e.py -v
        env:
          RUN_LEGAL_E2E: '1'
          ALLOW_PROD: '1'
          BASE_URL: https://premiselabs.co
          TORTISE_HOST: https://tortoise.premiselabs.co

      # Step 4: Warn-only effective-date comparison — served
      # "Effective date: YYYY-MM-DD" vs deploy-commit date
      # (git log -1 --format=%cs); if either is unavailable ⇒
      # warn + skip, never fail.
      - name: Effective-date comparison (warn-only)
        if: always()
        run: |
          SERVED_DATE=$(curl -s https://premiselabs.co/privacy | grep -oP 'Effective date:\s*\K\d{4}-\d{2}-\d{2}' || true)
          DEPLOY_DATE=$(git log -1 --format=%cs 2>/dev/null || true)
          echo "served effective date: ${SERVED_DATE:-<not found>}"
          echo "deploy commit date:   ${DEPLOY_DATE:-<not found>}"
          if [ -z "$SERVED_DATE" ] || [ -z "$DEPLOY_DATE" ]; then
            echo "::warning::cannot compare effective dates (served='${SERVED_DATE:-}' deploy='${DEPLOY_DATE:-}') — skipping"
          elif [ "$SERVED_DATE" != "$DEPLOY_DATE" ]; then
            echo "::warning::served effective date ($SERVED_DATE) != deploy commit date ($DEPLOY_DATE)"
          else
            echo "effective date matches deploy commit date ($SERVED_DATE)"
          fi
