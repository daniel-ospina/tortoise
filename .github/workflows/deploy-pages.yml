# Deploy Tortoise landing pages (premiselabs.co / tortoise.premiselabs.co) to Cloudflare Pages
name: Deploy Landing Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tortoise/onboarding/AGENT_ONBOARDING.md'
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage onboarding prompt (single source of truth → deployed copy)
        # tortoise/onboarding/AGENT_ONBOARDING.md is canonical (issues #496/#540).
        # The welcome page fetches https://tortoise.premiselabs.co/onboarding-prompt.md
        # at runtime; generate the deployed copy here so the two can't drift.
        run: |
          cp tortoise/onboarding/AGENT_ONBOARDING.md website/onboarding-prompt.md
          test -s website/onboarding-prompt.md
      - name: Diag production branch
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/367c7ecf27e1b1b092d04fe9915a1e56/pages/projects/premise-labs" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" > /tmp/proj.json
          echo "production_branch: $(jq -r .result.production_branch /tmp/proj.json)"
          echo "domains: $(jq -c .result.domains /tmp/proj.json)"
          echo "latest_deployment_url: $(jq -r .result.latest_deployment.url /tmp/proj.json)"
          echo "--- deployments (last 3) ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/367c7ecf27e1b1b092d04fe9915a1e56/pages/projects/premise-labs/deployments?per_page=3" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -c '.result[] | {url, created_on, trigger: .trigger.type, branch: .deployment_trigger.branch}'
          echo "--- custom domains ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/367c7ecf27e1b1b092d04fe9915a1e56/pages/projects/premise-labs/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -c '.result[] | {name, status}'
          echo "--- DNS zone records for tortoise.premiselabs.co ---"
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=premiselabs.co" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -r '.result[0].id')
          echo "zone: $ZONE"
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?per_page=100" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -c '.result[] | select(.name | contains("tortoise")) | {id, type, name, content, proxied}'
          echo "--- legacy project tortoise-landing-v2 ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/367c7ecf27e1b1b092d04fe9915a1e56/pages/projects/tortoise-landing-v2" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | jq -c '{name: .result.name, subdomain: .result.subdomain, domains: .result.domains, production_branch: .result.production_branch, latest: .result.latest_deployment.url}'
      - name: Deploy to Cloudflare Pages (premise-labs project)
        run: |
          cd website
          npx --yes wrangler@4 pages deploy . --project-name=premise-labs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 367c7ecf27e1b1b092d04fe9915a1e56
