name: ci-check-repair

# Repair "no required check at this PR head" — the #8254 failure mode (#8375 item 1).
#
# THE DEFECT. A PR head can carry NO check run at all for one or more required
# status contexts (pricing-artifact, docs, test-isolation, license-surface,
# legal-e2e, python-ci-gate, ai-review-gate). When that happens the checks can
# never appear: `mergeStateStatus` stays BLOCKED forever and nothing on the
# server side notices. **A missing check is not a green check, and it is not a
# pending one** — it must be ACTIVELY re-triggered.
#
# WHY THE OBVIOUS TRIGGER IS WRONG. This is NOT an event-driven repair, and the
# cadence below is a poll on purpose:
#   * the condition is a STEADY STATE (a head that stays absent), not an event —
#     whatever produced it, the head is still absent an hour later, and only a
#     poll sees that;
#   * the event that matters most here is one the repair workflow cannot receive:
#     the #8254 reproduction is a PR opened by `github-actions[bot]` (ci-timing's
#     refresh job), whose `pull_request` runs GitHub creates but HOLDS — the runs
#     exist with ZERO jobs and ZERO check runs;
#   * a `pull_request`-triggered repair would race the very event it repairs (the
#     absence is only observable AFTER that event's runs have settled) and would
#     re-trigger itself.
#
# CADENCE. Every 30 minutes. A stalled PR is fully blocked, so the repair is
# worth one cheap API pass per PR; and the pass cannot thrash, because the tool
# treats a producing run that is still in flight as PENDING (a check that will
# arrive) and never re-triggers it. Re-triggering more often than a CI cycle
# (~37 min here) would only re-trigger work already in flight.
#
# WHAT IT DOES — AND DOES NOT DO. It re-runs the existing workflow runs at the
# head (same sha, same event context), and it REPORTS the cases that need a new
# PR event, which the automatic `GITHUB_TOKEN` cannot create. It never merges and
# never moves a head: `tools/ci_check_repair.py` carries no merge capability at
# all. The merge rail stays local, where the evidence lives.
#
# EXIT CODE. Non-zero when a PR needs a repair this credential cannot perform.
# That is the signal the local fallback keys on: it reads the most recent
# `ci-check-repair` run and takes over when this workflow did not succeed — the
# GitHub→local transition the issue requires to be logged and notified.
#
# `schedule` / `workflow_dispatch` ONLY. The tool is the single implementation;
# the local launcher (`tools/ci-check-repair-local.sh`) invokes the SAME file.
on:
  schedule:
    # Every 30 minutes, offset off the top of the hour. GitHub documents that
    # scheduled events are most delayed at the start of each hour ("delayed during
    # high load, especially at the start of each hour" —
    # https://docs.github.com/en/actions/how-tos/troubleshoot-workflows), so minute
    # 0 is the worst minute to ask for. A delayed fire is fine here: the next tick
    # repeats the check.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  # Read the PRs and their check runs.
  contents: read
  checks: read
  pull-requests: read
  # Re-run a workflow run at the head (POST /actions/runs/{id}/rerun).
  actions: write

concurrency:
  # Never cancel a repair in flight: the tool's close/reopen path (used only
  # under a user credential, never here) is a close→reopen PAIR, and a cancelled
  # run between the two would leave a PR closed. Serialising is enough — the pass
  # is short and idempotent.
  group: ci-check-repair
  cancel-in-progress: false

jobs:
  # NOT a branch-protection required context. It repairs and reports; it gates
  # nothing, so a red here cannot block a merge.
  repair:
    # ── HOSTED-ONLY PIN (deliberate, measured 2026-10-27) ─────────────
    # `ubuntu-latest` is served by BOTH GitHub-hosted runners AND this repo's
    # self-hosted pool — the pool advertises it WHILE the fallback is engaged
    # (`scripts/ci_runner_gate.sh`; docs/ops/ci-runner-x64.md:25), so that is a
    # CONDITIONAL property, not a standing one: measured again on 2026-10-27 with
    # the fallback disengaged, none of the nine runners carried it. Measured over
    # these four workflows' own SCHEDULED runs on 2026-10-27 (115 runs, 00:00-12:00
    # UTC, jobs classified by `runner_name`): 83 created a job - 72 served by a
    # GitHub-hosted runner, 11 by this repo's self-hosted runners (10 of them
    # `pi-runner-*`, 1 `cmux`) - and 32 never got a runner at all.
    # So the pin is not "escape a queue that is always the pool"; it removes
    # the arm that FAILS.
    #
    # The pool arm does not starve — it HANGS, and it also fails fast. Of those
    # 11 self-hosted jobs, TWO hung in `actions/checkout` and were killed at the
    # job's OWN `timeout-minutes`, with the measuring step SKIPPED, which reads
    # as a finished run that measured nothing; TWO failed in 9s/36s with the
    # payload step actually run; SEVEN completed normally (10-46s). So the pin
    # does not say "the pool never works" — it says the pool cannot be relied on
    # to MEASURE. Both cited runs are `ci-queue-health`'s, whose timeout is
    # `10`; this block is shared by four workflows with different timeouts
    # (`repair` is `15`), so it names no single job's number as its own:
    #     run 40456347720 → pi-runner-vm-2: checkout 8m40s, then cancelled
    #     run 40451686065 → pi-runner-vm-4: checkout 4m41s, then cancelled
    # (same day: 9/9 runners busy, 78 runs queued, and `ci-queue-health`
    # completed 1 of its last 8 scheduled runs — 6 cancelled, 1 pending.)
    #
    # ⛔ THE PIN IS NOT A COMPLETE FIX, and this comment must not read as one.
    # Hosted is queued too: 18 jobs were waiting on `ubuntu-24.04` with a max
    # wait of 56m, and one `ci-queue-health` job waited 65 minutes for a hosted
    # runner and then ran 15 seconds. GitHub keeps only ONE pending run per
    # concurrency group, so while a wait exceeds this workflow's cadence each
    # tick still cancels the previous PENDING tick. The pin removes the arm that
    # hangs and usually serves in minutes; the cadence/concurrency question stays
    # open and is tracked separately.
    #
    # `ubuntu-24.04` is HOSTED-ONLY for THIS job by choice, but NOT — any more —
    # because the pool cannot answer it. Since the 2026-10-29 mitigation (#6897
    # suspended; docs/ops/ci-runner-x64.md, "the label contract") the installer
    # CAN emit `…,ubuntu-24.04` under `CI_RUNNER_OS_LABEL=on|auto`
    # (tools/install-ci-runner-x64.sh; the flag defaults to `off`, so nothing
    # changes for a box that does not set it) and an ORPHANED re-registration
    # derives the same fact (tools/runner_autoscale.py) — so the premise this
    # comment was written on ("`ubuntu-24.04` is claimed by no self-hosted
    # runner") is FALSE. ⛔ WHAT DOES **NOT** HOLD IT: `_preserve_labels` still
    # DROPS a version pin on RE-registration and nothing in this tree
    # re-attaches it on that path, so a re-registered runner loses the label
    # until someone runs `--repair-labels` (which KEEPS it while the flag is
    # `on|auto`) or reinstalls. `--status`' `label-coverage` exit 5 is what makes
    # that visible; re-measure rather than trusting this text:
    # `gh api repos/<owner>/<repo>/actions/runners`. The installer never hands
    # `config.sh` a version pin with the flag off — pinned at
    # `tests/test_ci_runner_x64_install.py:228`.
    # ⛔ THE COST, STATED: GitHub's label matching is cumulative and unscoped
    # (github/docs, "Using self-hosted runners in a workflow"), so while the
    # mitigation is engaged this observer is POOL-ELIGIBLE — and a guard whose
    # job is to report on a full pool can sit in `actions/checkout` behind that
    # very backlog, then die at its own `timeout-minutes` with the measuring step
    # SKIPPED: quiet precisely during the hosted outage it exists to surface.
    # `runs-on:` cannot scope that away, because the mitigation is label-wide and
    # not leg-scoped. Keep the pin for what it still buys — on a healthy day this
    # leg lands on hosted and spends no pool slot and no fleet quota — and if the
    # mitigation becomes permanent, re-scope this leg onto a label only hosted
    # answers. Public repo, so hosted minutes are free: this spends nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # tools/ci_check_repair.py drives `gh` for the whole measurement. On a
      # pool runner without it the tool reports, honestly but uselessly,
      # `{"error": "could not run gh: [Errno 2] No such file or directory"}` and
      # exits 2 ("could not measure") — measured 2026-10-24 on
      # `pi-runner-vm-5`. A repair loop that cannot see the queue is not a
      # verdict about the queue. Provide the tool or fail NAMING it.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh
      # tools/ci_check_repair.py is stdlib-only; this pin is what supplies the
      # >=3.12 interpreter the repo's tools expect (#5128).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair PRs whose required checks never ran
        env:
          # `gh` reads the token from the ENVIRONMENT; Actions exposes it only as
          # a context (#3092 — a `gh` call with no env binding fails every time).
          GH_TOKEN: ${{ github.token }}
          # Under `GITHUB_ACTIONS=true` the tool knows the credential is the
          # automatic token, whose events do NOT create workflow runs, so it
          # reports those PRs instead of pretending a close/reopen would work.
          GITHUB_ACTIONS: "true"
        run: |
          set +e
          python3 tools/ci_check_repair.py --apply --json | tee /tmp/ci-check-repair.json
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### ci-check-repair"
            echo '```json'
            cat /tmp/ci-check-repair.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ci-check-repair exit=$rc (0 = nothing to do or repaired; 1 = needs a local fallback; 2 = could not measure)"
          exit "$rc"
