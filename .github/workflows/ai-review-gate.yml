name: ai-review-gate

# AI review evidence gate (#2055, #2982, #1224). It passes only when the PR
# body OR a PR comment carries a SIGNED AI-review evidence marker produced by
# record-review.sh, bound to this PR and repo and to EITHER the PR's current
# head sha OR its current diff:
#
# ✅ It IS a required status context as of 2026-09-29 (#5433), and an ENTRY
# condition of the Mergify queue (`- check-success=ai-review-gate` in
# .mergify.yml). Verified: live branches/main/protection/required_status_checks
# lists it — 7 contexts (pricing-artifact, docs, test-isolation, license-surface,
# legal-e2e, python-ci-gate, ai-review-gate), `strict: false`,
# `enforce_admins: false` (so an admin merge can still bypass a red) —
# and `python3 tools/mergify_config_guard.py --static` passes. The STATIC tie is
# clause (iv)'s agreement sub-check — the config's check set vs the record's
# `required_contexts` — which runs while a queue rule uses `merge` injection (the live
# mode of the `main` rule, so this tie IS active today; inert under the default `queue`
# injection, which persists no branch-protection settings of its own).
# I1 itself is the LIVE comparison (the live required set vs the config's
# check names): only `--live` reads it, and no workflow runs `--live` (admin credential),
# so the live half is a deliberate step rather than something CI can keep in sync. While a
# rule uses `merge` injection, the config and the record cannot drift apart in CI.
# Before #5433 neither was true, so the enforcers were all LOCAL
# (the rail `scripts/admin-merge.sh`, which computes the failing set and refuses on a red;
# `scripts/atomic-land.sh`; and the `review-enforcer` extension): a merge through the Mergify queue —
# or a bare `gh pr merge` — carried an unreviewed or review-invalidated tree to `main`,
# because no server-side step acted on the conclusion this check produced.
#
# ⚠️ QUALIFIED BY #3091 — this check is required, its HARNESS is not.
# `AI review gate shell harness` step of ci.yml's `repo-harnesses` job (which
# runs .github/scripts/ai-review-gate.test.sh) is
# NOT a required context, and because this workflow is `pull_request_target`, a
# PR that weakens it is evaluated by the BASE revision: with a recorded marker it
# can merge while that harness is red-but-unrequired, after which the weakened
# required check reports Success on later PRs. So the enforcement above holds
# only while the gate itself is uncompromised; detecting that is #3091's open
# item (make the harness always-run + required, or move it into a required job).
# Re-read the live API before asserting either state.
#   review recorded: reviews/<PR>.json verdict=clean @ <full-sha> (<owner/repo>) sig=<hmac>
#   review recorded: reviews/<PR>.json verdict=clean @ <full-sha> diff=<sha256> (<owner/repo>) sig=<hmac>
#   review recorded: reviews/<PR>.json verdict=clean-low @ <full-sha> diff=<sha256> (<owner/repo>) sig=<hmac>
# The verdict vocabulary is CLOSED and is `clean(-micro|-low)?` (#4755). `clean-low` is
# emitted by record-review.sh for a content-only (prose/stylesheet) diff whose linked
# issue may be standard/complex (agent-infra #1348). It must NOT become `verdict=.*`:
# an out-of-vocabulary verdict (e.g. `verdict=clean-anything`) must still fail.
#
# #1224 — THE MARKER IS READ FROM EITHER THE PR BODY OR A PR COMMENT. The body
# is a MUTABLE field and the recording party routinely rewrites it (a typo fix,
# a corrected claim, a mechanical rewrite), so ANY later, entirely legitimate
# body edit destroys a marker kept only there and reddens the check on a review
# that genuinely happened — two measured instances on 2026-09-18
# (agent-infra#1209, premise-labs#3788), and 11 of the 25 red runs in the
# 2026-09-30 gate-red sample were NO_MARKER, the population this would land in.
# The producer half (record-review.sh, agent-infra#1224) is to post the SAME
# signed marker text as an append-only PR COMMENT as well as into the body;
# this gate unions the two channels, so a body edit cannot remove the marker
# from the union. The channel is empty until a producer writes to it (see the
# #1224 "Producer status" note in docs/ai-review-gate.md), and the gate reads
# it the moment one does.
#
# ⛔ The CHANNEL is not a trust boundary and this changes NO security property.
# A comment is exactly as attacker-writable as the body, so the marker text is
# still HMAC-verified against AI_REVIEW_GATE_KEY, and the binding rules are
# untouched: rule (a) signed `@ <sha>` == the current head, rule (b) signed
# `diff=` == a live diff digest. A forged comment FAILS the HMAC; a stale
# comment FAILS rule (a) and rule (b). The union restores AVAILABILITY of
# genuine evidence, never its authenticity.
#
# ⛔ Fail closed on the comment fetch. If
# `gh api …/issues/<PR>/comments` fails (API blip, missing auth) the run must
# NOT fall back to accepting unverified comment text — `gh api` prints HTTP
# error bodies to STDOUT, so a `|| true` / unguarded capture would read an
# error body as evidence. The fetch below is wrapped in an `if`: on failure
# `comments` stays EMPTY, a warning is printed, and the BODY path is evaluated
# exactly as it was before this change. A comment can only ever ADD acceptance,
# and only after its HMAC verifies, so a network failure can never become a
# pass.
#
# Comment admission is AUTHOR-FILTERED by `PR_EVIDENCE_COMMENTS_JQ`, a jq
# constant that must stay BYTE-IDENTICAL to the producer's copy once the
# producer half of #1224 lands (record-review.sh,
# check-pipeline-compliance.sh, atomic-land.sh — see the #1224
# "Producer status" note in docs/ai-review-gate.md). On a public repo
# every GitHub user with read access can comment, so admission is narrowed to
# repo-affiliated authors (OWNER / MEMBER / COLLABORATOR). It is a NARROWING,
# not parity with the body's writer set — its known over/under-admission
# residuals are declared at the constant itself. It exists both to stop an
# arbitrary public commenter from greening this check and so that every reader
# admits the SAME evidence: a reader acting on a comment the others ignore is
# the gate/rail divergence #1224 removes. If the producer's constant changes,
# change this one in the same breath (a cross-repo contract, like the #1362
# normalization half).
#
# ⛔ The trigger is deliberately UNCHANGED — `pull_request_target` on
# [opened, synchronize, reopened, edited]. A comment alone fires
# `issue_comment`, NOT this workflow, so a marker posted ONLY as a comment is
# readable but would not re-run this check. The producer therefore keeps the
# body mirror, whose PATCH fires `edited` and re-runs this gate against BOTH
# channels. Do NOT add `issue_comment` here without re-reading the skip-footgun
# rule at the end of this header and the parsed-trigger pin in
# tests/test_ai_review_gate_contract.py (this job must stay a single,
# non-skippable evaluation), and do NOT drop the producer's body mirror — it is
# what re-triggers the read.
#
# The optional `diff=` segment (issue #2982; accepted shape per #3076) is part
# of the SIGNED text, so every regex here must accept it — a regex that does
# not rejects correctly signed evidence without ever reaching the HMAC check.
# That was #3076: correctly-signed post-#2982 markers fell through to the
# diagnostic branch and were reported as "not signed or not for <repo>", which
# trained operators/agents to merge with --admin. #3076 widened the shape on
# main; this change (#2982) puts that segment to use.
#
# What a review approves is the DIFF, not the commit sha (#2982). A sha alone
# ties the verdict to a commit identity that changes on every merge-only
# branch update (`gh pr update-branch` inserts a merge commit; the three-dot
# diff is byte-identical unless main's advancement touched a file the PR also
# changes, in which case the evidence is genuinely stale). With the `strict:
# true` protection in force at the time (#2982), that made the
# two policies jointly unsatisfiable: every update invalidated a still-correct
# verdict, so a green PR could never reach a terminal mergeable state. A marker
# is therefore accepted when EITHER:
#   (a) its signed `@ <sha>` equals the PR's current head — the normal path,
#       and the ONLY path legacy markers (no diff=) can ever use; OR
#   (b) it carries a signed `diff=<sha256>` equal to the diff hash THIS WORKFLOW
#       computes live from the GitHub REST API for this PR at check time; OR
#   (c) its REVIEWED PATCH equals this PR's live patch projection, with the
#       reviewed side reconstructed here from the marker's own signed
#       `@ <sha>` and ANCHORED on its signed `diff=` (#4255 — see below).
#
# ⛔ THE TWO DIGESTS, STATED ONCE SO THEY CANNOT BE RE-BROKEN (#4255). Both are
# sha256 over the SAME bytes — `GET /repos/<o>/<r>/pulls/<n>` with
# `Accept: application/vnd.github.v3.diff`, which is GitHub's own three-dot
# rendering (`merge-base(base, head)..head`), ALL paths, nothing excluded —
# pushed through the shared normalizer (producer: agent-infra
# `scripts/lib/diff-normalize.py`; consumer: the inline copy below).
#   BINDING digest (`diff=`) = sha256 of the normalized diff. Normalization
#     drops an entry's `index` line when that entry carries a hunk and rewrites
#     `@@ -a,b +c,d @@` to `@@ -0,<old> +0,<new> @@`, so blob ids and hunk LINE
#     NUMBERS stop mattering — but hunk CONTEXT is KEPT (#1362 D1). It is
#     therefore BASE-MOVE SENSITIVE BY DESIGN: it is the byte identity of the
#     rendered artifact, and `main` landing work in a file this PR also changes
#     rewrites the context lines around the PR's hunks.
#   PATCH digest (#1377) = sha256 of the `--patch-only` projection: blob ids,
#     hunk line numbers/counts AND hunk context are dropped; every `+`/`-` line,
#     the `diff --git`/`---`/`+++` path lines, mode/rename/binary lines and
#     whitespace pass through BYTE-EXACT, and each hunk's FRAME is kept as its
#     enclosing-scope heading (`@@ def f():`, `@@` when there is none). It is
#     the only projection that answers "did the AUTHORED change move?".
#     ⛔ IT IS NOT UNCONDITIONALLY BASE-MOVE INVARIANT (corrected after the
#     fresh review of #4255). Dropping CONTEXT and the numbers makes it
#     invariant across a base advance that only rewrites context. The HEADING
#     can still move: git derives it from the line preceding the hunk, so a base
#     advance that inserts a column-0 line ABOVE the change (any markdown/text
#     file, or a new `def` above the edited one) rewrites it. That case is
#     REFUSED — an OVER-BLOCK, i.e. the pre-#4255 verdict, never a pass. Same for
#     any base advance that re-groups the PR's hunks (one hunk becomes two). The
#     heading is kept anyway because it is what makes the projection
#     POSITION-BEARING, and a position-blind projection accepts a change that
#     was MOVED — the one direction a gate must never fail in.
# ⛔ Do NOT try to make the BINDING digest base-move invariant by dropping
# context there: it is what `diff=` means to every producer in the fleet, and
# changing it silently invalidates every marker ever signed (the #3076 shape).
# Two questions, two projections, one byte stream. A patch match is NEVER
# consulted alone: rule (c) first RE-DERIVES the binding digest of the reviewed
# side and requires it to equal the marker's own signed `diff=`, so the bytes
# compared are the bytes that marker was minted over (the same ANCHOR
# agent-infra's `patch_dimension_carry` uses) — a marker whose reconstruction
# does not reproduce its own `diff=` is refused, never guessed at.
#
# ⛔ WHAT THE ANCHOR DOES **NOT** PROVE (fresh review of #4255, P1). It proves the
# provenance of the REVIEWED bytes. It says NOTHING about the live side, so it
# cannot by itself bound the patch comparison's blind spot — an earlier version of
# this header claimed it did, and that claim was false: the reviewed hunks and the
# live hunks could be the same `+`/`-` bytes RELOCATED inside one scope, with the
# anchor reproducing perfectly (measured: `rc=0, passed via PATCH match` on a bare
# force-push that moved a reviewed line, with NO base advance at all). What bounds
# it is a SEPARATE precondition enforced in `patch_arm_ok`: the marker's own signed
# `@ sha` must be an ANCESTOR of this PR's head. A base advance by merge (what
# `gh pr update-branch` does) keeps the reviewed commit reachable, so a genuine
# carry still works; a REWRITTEN branch — force-push, rebase, amend — does not, and
# rule (c) refuses there (documented degradation: pre-#4255 behaviour).
#
# WHY (c) EXISTS: without it, a clean review cannot survive the base advancing.
# MEASURED (agent-infra#4255): one PR adds a line, `main` inserts a line inside
# that hunk's context window, the branch is refreshed — binding dfebaa86… →
# 4d4d1118…, patch b2434708… → b2434708… (identical, as THIS gate's projection renders
# it — the `f7f1d204…` this line used to quote is the PRE-frame projection's digest for
# the same bytes, which is also what agent-infra's producer still emits). Before (c),
# that PR was
# refused as "the reviewed diff changed" although not one authored byte moved,
# which is how four MERGEABLE, clean-reviewed PRs produced zero merges in one
# night (two of them re-reviewed, one aborted mid-review on "the DIFF CHANGED
# during the review", one refused on a truncated-body read).
#
# WHAT (c) DOES NOT DO. It cannot tell WHICH revision a reviewer saw — no
# acceptance rule here can; that binding is the producer's stale-sha guard's job
# (see the delegation note below). It is not a whitespace-blind match: the patch
# projection keeps whitespace BYTE-EXACT and keeps the `diff --git`/`---`/`+++`
# path lines and every mode/rename line, so an edited line, an added space, a
# RENAMED FILE (its `similarity index`/`rename from`/`rename to` lines) and a
# DELETED LINE (a `-` line) all move it. ⛔ Every one of those four is a PINNED
# digest vector in `.github/scripts/ai-review-gate.test.sh` §(t) —
# `PP_EDITED`/`PP_WS`/`PP_RENAME`/`PP_DELETED` — and each is ALSO asserted to
# differ from the reviewed digest, so no pin can pass vacuously and this sentence
# cannot drift away from the harness that backs it. (Before that was true, this
# paragraph claimed "pinned by the harness" for a rename and a deleted line that
# no fixture exercised — a coverage claim the harness did not support.)
# The fields it drops are exactly the ones a rebase
# rewrites — which is the same arm agent-infra's `merge-one.sh` has ALREADY been
# merging on since #1377 (`patch_dimension_carry`), so (c) widens no acceptance
# set relative to what the fleet already lands; it removes the requirement that
# a human re-record before the SERVER-side gate will agree with the local one.
# (b) carries a verdict across a merge-only update: the head moved, the
# reviewed diff did not.
#
# WHAT (c) COSTS, AND WHY THAT IS BOUNDED. It is consulted ONLY when (a) and (b)
# found nothing, and within that it probes only markers whose HMAC VERIFIES,
# de-duplicated on (sha,diff) and capped at PATCH_PROBE_CAP. Both bounds exist
# because each probe makes up to FOUR repo-scoped API calls (the ancestry read, the
# base sha, the reviewed diff, and the branch-side commit list) while the marker list
# comes from PR TEXT on a `pull_request_target` workflow — see the full rationale at
# the loop itself. Removing either bound re-opens the availability defect they close.
# ⛔ AND SAY WHICH CASES ACTUALLY PIN THEM — this sentence used to name four and was
# wrong in both directions (measured by the #4255 cycle-2 review): deleting the
# SIGNATURE-FIRST check reddens §(t9) twice, §(t10) twice and §(t21) — NOT (t6)/(t8)/(t22),
# which are about other guards (a THIRD review measured that deletion at §(t9)x2,
# §(t10)x1, §(t21)x1 — an earlier revision of this sentence said (t10) twice).
# And the DEDUP half is NOT pinned: deleting the in-loop (sha,diff) `case` leaves the
# suite green. It is REACHABLE, but only by two DISTINCT SIGNED records sharing
# (sha,diff) — a key-holder shape no fixture constructs — because `all_markers` is
# de-duplicated upstream on the WHOLE LINE (`awk '!seen[$0]++'`) and filtered to the
# accepted shapes. §(t26) pins the reachable end-to-end property (repeated records cost
# one probe) and says so; the `case` is kept as a belt, not a pinned bound.
#
# The signature is HMAC-SHA256 over the marker text, keyed by the
# AI_REVIEW_GATE_KEY repo secret (the agent machine holds the same key at
# ~/.pi/agent/.ai-review-gate-key). `diff=` sits INSIDE the signed text (the
# signature covers everything before " sig="), so neither a body edit nor a
# comment can forge either field. A marker without a valid signature cannot
# pass, so the gate can be satisfied neither by editing the PR body nor by
# posting a forged comment — only genuine, correctly-signed evidence passes.
#
# Fail closed — scoped to the DIFF-MATCH arm: if the live diff hash cannot be
# computed (API blip, missing gh/openssl/python3, empty diff) a STALE-SHA `diff=`
# marker is NOT accepted via rule (b) — only the sha-match path remains
# usable. A network failure never becomes a pass. Explicitly: a marker with
# diff= must never be accepted VIA THE DIFF-MATCH PATH when BOTH live diff
# hashes (normalized and raw, #1362) are empty.
#
# This does NOT gate rule (a): a HEAD-BOUND `diff=` marker (`@ sha` ==
# expected) passes on the sha-match path with both live hashes empty, because
# the sha binding alone is the stronger claim and is the pre-#2982 baseline
# (pinned by tests/test_ai_review_gate_contract.py::
# test_gate_accepts_diff_bearing_marker and harness case (d3)). Do NOT gate
# rule (a) on `[ -n "$live_diff_hash_raw" ]` to "restore fail-closed": that
# would silently kill the normal path.
#
# Diff normalization (#1362, owner ruling 2026-09-23). The digest is computed
# over a NORMALIZED diff. A base move (`git rebase`, `gh pr update-branch`)
# rewrites `index <old>..<new>` lines and `@@ -a,b +c,d @@` hunk headers even
# when every changed line is byte-identical, so a raw-bytes digest stops
# matching a still-correct verdict and forces a fresh review. Measured on
# #4841 (a real BEHIND PR): identical 137,767 bytes, exactly 6 lines differ —
# four hunk headers + two index lines — `git patch-id --stable` MATCHED, the
# raw digest DIFFERED and the PR was refused. Normalization (spec below in
# the run step, where it is applied) is ENTRY-SCOPED: it drops an `index` line
# ONLY when that entry carries a hunk (the hunk content already carries the
# change) and keeps it VERBATIM for a hunk-less entry (a binary entry, or a
# hunk-less empty-file add/delete) — the index line is a binary entry's only
# content-bearing field. Each hunk header is rewritten to
# `@@ -0,<old-count> +0,<new-count> @@<heading>`; hunk CONTENT
# and COUNTS are untouched, and `diff --git`/`---`/`+++`/mode/rename/binary
# lines and the section heading pass through unchanged (counts derive from
# content, so they move only when content moves).
#
# The producer half (agent-infra#1362, record-review.sh / its
# scripts/lib/diff-normalize.py) MUST normalize with the SAME hunk-presence
# predicate — the two halves are a signed cross-repo contract; if they
# diverge, every freshly-signed marker stops matching fleet-wide (#3076
# shape). (A binary-marker-presence predicate would diverge on a hunk-less
# NON-binary entry, e.g. an empty-file add/delete.) This gate computes BOTH
# digests from the SAME fetched bytes and
# accepts a marker whose signed `diff=` equals EITHER:
#   live_diff_hash_norm — the normalized digest (post-#1362 producers)
#   live_diff_hash_raw  — the legacy raw digest (every marker already recorded)
# The legacy arm is MANDATORY: without it every existing marker breaks and
# the check reddens fleet-wide. Consumer-first land order: this gate
# is safe to land before or after the producer and changes nothing until the
# producer starts emitting the normalized digest.
#
# ⛔ Do NOT implement this with `git patch-id`: `--stable` and the default
# both ignore whitespace, so a whitespace-only change would carry a stale
# verdict forward (a false accept). sha256 over normalized bytes does not.
#
# Delegation, stated plainly: rule (b) cannot tell WHICH revision the reviewer
# saw. It verifies only that the marker is signed and that the signed `diff=`
# equals this PR's diff at check time. The binding between a recorded sha and
# the diff actually reviewed is enforced by record-review.sh's stale-sha guard,
# not here. The producer half (agent-infra PR #767) SHIPPED and closed that gap
# producer-side (#784): in the `--force-stale` and head-fetch fail-open arms
# record-review.sh drops the diff binding (`DIFF_HASH=""`), so the marker
# degrades to the legacy sha-only shape and rule (b) cannot carry it.
# Do NOT add a
# "recorded sha is an ancestor of head" bound here: the repo's documented
# refresh path is `git rebase origin/main` (sha rewritten, three-dot diff
# byte-identical when the rebase does not reconcile main into the PR's files),
# which an ancestor bound would reject, re-creating the
# #2982 deadlock this change exists to remove.
#
# ⛔ GH_TOKEN is mandatory for any of this to work (#2982): `gh` refuses to
# run inside GitHub Actions without it. It is declared in the step env; do
# not remove it, or the live diff hash goes permanently empty and the
# diff-match path becomes dead code in production — a legitimate
# carried-forward verdict is then rejected as stale, and the diagnostic
# misreports a static misconfiguration as a transient API blip. The test
# harness asserts GH_TOKEN is declared: its stubbed `gh` bypasses the auth
# check, so no runtime case in the harness can catch this.
#
# Provenance: record-review.sh is invoked by the code-review skill only after
# its review gate converges clean, so a green check means a recorded AI review
# exists for exactly this head sha, or for a diff equal to this PR's diff at
# check time. Rule (b) cannot tell WHICH revision a reviewer saw — that binding
# is enforced producer-side (see the delegation note above), not here.
# Stale evidence (head moved AND diff changed after review) is rejected,
# forcing a re-record on the final artifact.
#
# Security: runs via pull_request_target so the workflow file is always the
# trusted main-branch copy. It NEVER checks out PR code and NEVER executes
# anything from the PR — it only reads event-payload env vars, the PR body and
# the PR's issue comments via the REST API, then computes an HMAC with the repo
# secret. No code-injection or secret-exfiltration vector. The diff is fetched
# and hashed as bytes only; it is never evaluated. Comment text is likewise
# only pattern-matched and HMAC-verified — never executed.
#
# ⛔ FUTURE EDITORS: never add `if:` conditions, path filters, or `needs:` to
# this job. A SKIPPED job reports as Success and would silently pass the check
# without any review evidence. This job must always run and evaluate the
# evidence for every AUTHOR PR. The ONE exception is the synthetic Mergify
# merge-queue batch, which has no attestation to evaluate — it is detected
# explicitly at the top of the run step (#5426). Do not widen or remove that
# guard: it requires `mergify[bot]` authorship AND the queue branch shape, so a
# contributor branch that copies the name still fails closed.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review-gate:
    runs-on: ubuntu-latest
    # REQUIRED context (`queue_conditions` check-success=ai-review-gate) with no
    # cap, so a wedged PR-body/comment read held ENTRY to the merge queue for
    # GitHub's 360m default. Measured 2026-10-27 (40 newest runs of this
    # workflow, completed only): p50 0.03m, p95 0.10m, max 0.13m over the 14 runs
    # whose job executed — 15m is the runner-stall floor, not the work. See
    # docs/ops/ci-wall-clock.md.
    timeout-minutes: 15
    steps:
      # NOTE (#1224): the step NAME is matched verbatim by
      # tests/test_ai_review_gate_contract.py (the block is selected by name, not
      # position, so it cannot drift onto a different step). It is deliberately
      # retained even though the gate now also reads PR comments.
      - name: Validate signed AI review evidence in PR body
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.event.repository.full_name }}
          # Synthetic merge-queue batch detection (#5426). Mergify's queue PR is
          # authored by `mergify[bot]` on `mergify/merge-queue/<sha>`. These two
          # are read ONLY by the not-applicable guard at the top of the run
          # step; the author-PR path never consults them.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          GATE_SECRET: ${{ secrets.AI_REVIEW_GATE_KEY }}
          # REQUIRED (#2982): `gh` REFUSES to run inside GitHub Actions unless
          # GH_TOKEN is set — verified: `env -i PATH="$PATH" GITHUB_ACTIONS=true
          # gh api …` exits with "To use GitHub CLI in a GitHub Actions workflow, set the
          # GH_TOKEN environment variable". Without this the live diff hash is
          # ALWAYS empty, acceptance rule (b) below is dead code in production,
          # and the #2982 deadlock is not actually removed. Every other
          # gh-invoking workflow in this repo sets a token (ci-timing.yml,
          # python-ci.yml, tenant-provision-monitor.yml, …); this one had none,
          # which is why the pre-existing `.body` REST fetch silently never
          # worked either (it fell back to the truncated PR_BODY env var).
          #
          # `github.token` is the least-privilege choice: it honours the
          # `permissions:` block above (contents: read, pull-requests: read),
          # which is exactly what reading a PR diff requires. This job never
          # checks out or executes PR code, so there is no exfiltration vector.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ── Synthetic merge-queue batches are not review targets (#5426) ────
          # Mergify validates a batch on a synthetic draft PR it opens as
          # `mergify[bot]` on `mergify/merge-queue/<sha>`. Its body is Mergify's
          # own banner, so it can never carry a `review recorded:` marker: the
          # attestation is bound to the AUTHOR PR's number and head
          # (reviews/<PR>.json) — a different number and a different head — and
          # a batch head is created and discarded by the queue. This step could
          # therefore only ever FAIL, reddening every queue batch. That red
          # blocks nothing: measured 2026-09-28, batch
          # `mergify/merge-queue/19ba552894` had this as its ONLY non-green
          # check and all four constituents merged via `mergify[bot]`; two more
          # batches (8c611e3e00→#5765, d3bf2fe370→#5790) merged with it red.
          # It is not a merge condition either (.mergify.yml merge_conditions
          # names only python-ci-gate). The red protects nothing and is pure
          # alarm fatigue — it is the only non-green check on some batches, and
          # competes for attention beside real failures (dashboard-js-tests,
          # python-ci-gate) on others — so report an explicit pass.
          #
          # The guard requires BOTH the queue branch shape AND `mergify[bot]`
          # authorship: a contributor branch named `mergify/merge-queue/...` is
          # not authored by the bot and still fails closed. The author-PR path
          # is unchanged.
          if [ "${PR_AUTHOR:-}" = "mergify[bot]" ] && [[ "${HEAD_REF:-}" == mergify/merge-queue/* ]]; then
            echo "::notice::Synthetic merge-queue batch ${HEAD_REF} (#${PR_NUMBER}) — a review attestation is bound to each author PR's head, not to a batch head that never existed, so there is nothing to verify here. Passing; each constituent PR is checked by its own ai-review-gate run. (#5426)"
            exit 0
          fi

          if [ -z "${GATE_SECRET:-}" ]; then
            echo "::error::AI_REVIEW_GATE_KEY repo secret is not configured — the gate cannot verify signatures."
            exit 1
          fi
          # Normalize the key (matches the producer's key-file load).
          GATE_SECRET="$(printf '%s' "$GATE_SECRET" | tr -d '[:space:]')"
          # ⛔ Re-assert AFTER normalization (#3057 review): a whitespace-only
          # secret passes the `-z` guard above and then normalizes to the EMPTY
          # string. An empty HMAC key is public — any PR author could mint a
          # marker (stale sha + the live `diff=`) and turn the check
          # green on an unreviewed diff. The guard above validates the RAW
          # value; the normalized value is what the HMAC actually uses, so it
          # must be validated too.
          if [ -z "$GATE_SECRET" ]; then
            echo "::error::AI_REVIEW_GATE_KEY normalises to an empty value (whitespace-only secret) — an empty HMAC key is public and would make this gate forgeable."
            exit 1
          fi

          # Full PR body. The env-var form truncates at ~48KB — fetch via the
          # REST API (pull-requests: read) and fall back to the env var.
          #
          # The exit status MUST be honoured. `gh api` prints HTTP error bodies
          # (JSON) to STDOUT and exits non-zero, and `--jq` is not applied on
          # the error path. Masking it with `|| true` — which is what this did
          # before #2982 made the fetch live by adding GH_TOKEN — would assign
          # that error JSON to `body`, discard the PR_BODY fallback, and report
          # "No AI review evidence found" for a PR that carries valid evidence:
          # an API blip turned into a red check with a diagnostic
          # pointing the wrong way.
          body="${PR_BODY:-}"
          # WHICH BYTES THIS RUN JUDGED (#4776). The verdict below is only falsifiable if the
          # log records the body it read: `latest recorded <sha>` named a line that could not
          # be re-checked afterwards, so a report of "a re-recorded head read as stale" could
          # not be settled either way once the PR moved on. `body_source` distinguishes the
          # LIVE body from the event-payload SNAPSHOT:
          # a snapshot is fixed at the event that queued this run, so a record posted after
          # that event is invisible to it and a red derived from one must say so rather than
          # assert staleness.
          body_source="rest-live"
          body_fallback_reason=""
          if fetched="$(gh api "repos/${REPO_NAME}/pulls/${PR_NUMBER}" --jq .body 2>/dev/null)"; then
            if [ -n "$fetched" ] && [ "$fetched" != "null" ]; then
              body="$fetched"
            else
              # The read SUCCEEDED and returned an empty body (or `null`). That is not a body
              # this run may treat as the live one, so `body` stays the event snapshot and the
              # source says so. Flipping it only in the failure arm mislabelled these bytes as
              # `rest-live`, which is the one thing this provenance exists to prevent (#4776).
              body_source="event-snapshot"
              body_fallback_reason="the REST read returned an empty body"
            fi
          else
            body_source="event-snapshot"
            body_fallback_reason="the REST read failed"
            echo "::warning::PR body fetch via the REST API failed — falling back to the event-payload PR_BODY (truncated at ~48KB; the evidence marker must lie inside the truncated prefix)."
          fi
          body_bytes="$(printf '%s' "$body" | wc -c | tr -d ' ')"
          body_digest="$(printf '%s' "$body" | openssl dgst -sha256 | awk '{print $NF}')"
          body_provenance="body=${body_source} sha256=${body_digest:0:12} bytes=${body_bytes}"
          # A snapshot cannot see a later re-record, so a negative verdict from one carries an
          # action, not a conclusion.
          body_stale_hint=""
          if [ "$body_source" = "event-snapshot" ]; then
            body_stale_hint="the LIVE body could not be used (${body_fallback_reason}), so this run judged the body captured when it was queued — a record posted since is invisible to it. Re-run this check before acting on this verdict."
          fi

          # EVERY verdict must say WHICH BYTES it judged (#4776): the same evidence
          # can read present or absent depending on which body was fetched, so a
          # verdict that omits the provenance cannot be falsified — and an
          # unfalsifiable verdict is indistinguishable from a wrong one. One helper
          # so the guarantee cannot drift branch by branch. Both channels are
          # reported: since #1224 a verdict can be driven by comment text, so
          # certifying only the body would leave the deciding bytes unnameable.
          report_body_provenance() {
            echo "::error::  ${body_provenance}"
            echo "::error::  ${comments_provenance}"
            if [ -n "$body_stale_hint" ]; then echo "::error::  ${body_stale_hint}"; fi
          }

          # ── Comment channel (#1224) ───────────────────────────────────
          # The body is a MUTABLE field: any later legitimate rewrite — a typo
          # fix, a corrected issue ref, a mechanical edit — destroys a marker
          # kept only there, reddening this check on a review that genuinely
          # happened (see the #1224 header section). So the SAME signed marker
          # is read from an append-only PR COMMENT as well. Unioning the two
          # channels restores AVAILABILITY; it changes no security property,
          # because the marker text is still HMAC-verified below.
          #
          # WHAT IS ADMITTED: PR_EVIDENCE_COMMENTS_JQ, which must stay
          # BYTE-IDENTICAL to the producer's copy once the producer half lands
          # (record-review.sh, check-pipeline-compliance.sh, atomic-land.sh —
          # see the #1224 "Producer status" note in docs/ai-review-gate.md). On a
          # public repo every user with read access can comment, so admission is
          # narrowed to repo-affiliated authors (OWNER / MEMBER /
          # COLLABORATOR). It is a NARROWING, not parity with the body's writer
          # set; its known over/under-admission residuals are declared at the
          # constant in the producer. Its other job is to keep every reader on
          # the SAME evidence — a reader acting on a comment the others ignore
          # is the gate/rail divergence #1224 removes. If the producer's
          # constant changes, change this one in the same breath.
          PR_EVIDENCE_COMMENTS_JQ='.[] | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR") | .body'

          # Fail closed (see the #1224 header section). On a failed fetch
          # `comments` stays EMPTY and a warning is printed; the body path below
          # is then evaluated EXACTLY as before this change, and a comment can
          # only ever ADD acceptance, and only after its HMAC verifies. Never
          # `|| true` this into the variable: `gh api` prints HTTP error bodies
          # to STDOUT, so an unguarded capture would read an error body as
          # comment text.
          comments=""
          comments_read=0
          if comment_bodies="$(gh api --paginate \
               "repos/${REPO_NAME}/issues/${PR_NUMBER}/comments" \
               --jq "$PR_EVIDENCE_COMMENTS_JQ" 2>/dev/null)"; then
            comments="$comment_bodies"
            comments_read=1
          else
            echo "::warning::PR comment fetch via the REST API failed — evidence carried ONLY in a comment is unavailable for this run. The PR-body path is unaffected and no unverified comment text is used."
          fi
          # Provenance for the comment side of the union, so a verdict driven by a
          # comment is as falsifiable as a body-driven one (#4776 x #1224).
          comments_bytes="$(printf '%s' "$comments" | wc -c | tr -d ' ')"
          comments_digest="$(printf '%s' "$comments" | openssl dgst -sha256 | awk '{print $NF}')"
          if [ "$comments_read" -eq 1 ]; then
            comments_provenance="comments=read sha256=${comments_digest:0:12} bytes=${comments_bytes}"
          else
            comments_provenance="comments=NOT-READ (the REST comment read failed, so only the body could be judged)"
          fi

          # A marker is acceptable when it names THIS repo, carries a valid
          # HMAC, and satisfies EITHER acceptance rule: its recorded FULL sha
          # equals the current head (rule (a)), or its signed diff= equals the
          # live diff hash (rule (b), #2982). Escape ERE metachars in the repo
          # name before interpolating.
          expected="${HEAD_SHA}"
          # Escape ERE metachars in the repo name before interpolating into
          # the patterns below (identical to the producer-side escaping).
          repo_esc="$(printf '%s' "$REPO_NAME" | sed 's/[.[\*^$()+?{|]/\\&/g')"

          # ── Diff normalization (#1362) ────────────────────────────────
          # A base move (`git rebase`, `gh pr update-branch`) rewrites the
          # `index <old>..<new>` lines and the `@@ -a,b +c,d @@` hunk headers
          # even when every changed line is byte-identical, so a digest over
          # the raw bytes stops matching a still-correct reviewed verdict.
          # Normalize before hashing (owner ruling 2026-09-23), processing the
          # diff ENTRY-SCOPED (entry boundaries are `^diff --git ` lines):
          #   1. entry contains >= 1 hunk line (`^@@ `) -> DROP the `index` line
          #      (unchanged from the ruling)
          #   2. entry contains NO hunk line (a binary entry — `^Binary files .*
          #      differ$` / `^GIT binary patch$` — or a hunk-less empty-file
          #      add/delete)                 -> KEEP the `index` line VERBATIM
          #   3. REWRITE ^@@ -([0-9]+)(,([0-9]+))? \+([0-9]+)(,([0-9]+))? @@(.*)$
          #      to `@@ -0,<old-count> +0,<new-count> @@<heading>`, each count
          #      DEFAULTING TO 1 when its group is absent (`@@ -5 +5 @@` means
          #      one line each per the unified-diff format) — EVERY entry
          #   4. every other line passes through unchanged
          #
          # The contract sentence: DROP the `index` line exactly when the hunk
          # content already carries the change.
          #
          # Why the carve-out (amendment to the 2026-09-23 ruling, per that
          # ruling's own rationale — recorded on agent-infra#1362, comment
          # 5806797023): a binary entry has NO hunks and `Binary files …
          # differ` carries no content, so the `index` line is its ONLY
          # content-bearing field. An unconditional drop made two distinct
          # binary revisions normalize IDENTICALLY: review binary v1, sign the
          # marker, swap in binary v2, and the gate ACCEPTED an
          # unreviewed binary (a fail-open). The ruling's premise is "the
          # index line is redundant with hunk content" — false precisely when
          # there is no hunk content.
          #
          # The producer half is agent-infra/scripts/lib/diff-normalize.py
          # (agent-infra#1431). This is a SIGNED cross-repo contract: both
          # halves must normalize to byte-identical output or every freshly-
          # signed marker stops matching fleet-wide (#3076 shape). The producer
          # must use the SAME hunk-presence predicate: a binary-marker-presence
          # predicate diverges on a hunk-less NON-binary entry (an empty-file
          # add/delete). The block
          # below mirrors the producer's `str.split("\n")` / `"\n".join(...)`
          # over a latin-1 decode, so the final line's trailing-newline state
          # is preserved and non-ASCII bytes round-trip exactly (an awk that
          # appends a final newline would shift the digest). Entry-scoping
          # needs has-this-entry-seen-a-hunk state, which `sed` cannot express.
          # The guard below requires `python3`; a missing/failed normalizer
          # leaves BOTH digests empty (fail closed) so a stale `diff=` marker
          # is never accepted.
          normalize_review_diff() {
            python3 -c '
          import re, sys
          _IDX = re.compile(r"^index [0-9a-f]+\.\.[0-9a-f]+( [0-7]{6})?$")
          _HUNK = re.compile(r"^@@ -([0-9]+)(,([0-9]+))? \+([0-9]+)(,([0-9]+))? @@(.*)$")
          raw = sys.stdin.buffer.read().decode("latin-1")
          out = []
          entry = []
          has_hunk = False
          def flush(lines, has_hunk):
              for line in lines:
                  if has_hunk and _IDX.match(line):
                      continue
                  m = _HUNK.match(line)
                  if m:
                      old = m.group(3) if m.group(3) is not None else "1"
                      new = m.group(6) if m.group(6) is not None else "1"
                      line = "@@ -0," + old + " +0," + new + " @@" + m.group(7)
                  out.append(line)
          for line in raw.split("\n"):
              if line.startswith("diff --git "):
                  flush(entry, has_hunk)
                  entry = []
                  has_hunk = False
              entry.append(line)
              if line.startswith("@@ "):
                  has_hunk = True
          flush(entry, has_hunk)
          sys.stdout.buffer.write("\n".join(out).encode("latin-1"))
          '
          }

          # ── The PATCH projection (#1377; consumed by acceptance rule (c), #4255) ──
          # A SECOND projection of the SAME bytes, for a DIFFERENT question: "is the
          # change the reviewer approved still the change in this branch?". It drops
          # exactly the fields a rebase/base-move rewrites while the reviewed change
          # is untouched — `index` blob ids, the `@@ … @@` LINE NUMBERS AND COUNTS,
          # and hunk CONTEXT (a leading single space) — and keeps everything else
          # VERBATIM. The hunk FRAME is kept with its enclosing-scope heading
          # (`@@ def f():`, or `@@` when the hunk has none): without it the
          # projection was POSITION-BLIND and the same `+`/`-` lines RELOCATED into
          # another function projected identically, so a force-push that only moved
          # the reviewed lines carried the verdict with no base advance at all
          # (measured by the fresh review of #4255). A relocation under the SAME
          # heading still projects the same — and ⛔ THE HEADING IS A STRING, NOT A
          # POSITION (final review of #4255, measured): two DISTINCT top-level
          # definitions with identical signature text (`def handler(event):` in two
          # places), or two duplicate headings in a driverless text file, render the
          # same frame, so a relocation between them projects IDENTICALLY. This is a
          # DECLARED residual, and it is NOT bounded by the anchor (the anchor proves
          # the reviewed side's provenance and says nothing about the live one; a flat
          # force-push that relocated a reviewed line carried with the anchor
          # reproducing perfectly). It is bounded by the TWO shape checks in
          # `patch_arm_ok` — the reviewed sha must be reachable, and everything the
          # branch gained after the review must be a merge commit — so what is left is
          # a MERGE (or a conflict resolution) that moves the author's own lines to a
          # position whose enclosing heading string matches. A position-bearing frame
          # cannot be added: the reviewed and live diffs each carry one hunk, so an
          # ordinal matches too, and a pre-image line number is exactly the
          # base-move-sensitive datum this projection exists to drop. `(t20b)` pins the
          # residual so it cannot drift back into a claim of coverage.
          #
          # ⛔ DECLARED DIVERGENCE FROM THE PRODUCER (measured 2026-11-27 against
          # agent-infra origin/main `scripts/lib/diff-normalize.py --patch-only`): the
          # producer at that head DROPS the hunk frame entirely, so the two
          # projections differ byte-wise on every hunk-bearing entry. This consumer is
          # therefore STRICTER, and the producer's verdict is a superset: where
          # `record-review.sh --check-carry` says "carry", this gate may still refuse
          # (never the reverse). `daniel-ospina/agent-infra#4261` aligns the producer
          # with this frame; until it lands, a producer-side carry can end in a red
          # gate, and the operator remedy is the one the diagnostic already prints —
          # re-record on the current head.
          # KEPT, VERBATIM: the `diff --git`/`---`/`+++` lines (so the PATH is part of the identity),
          # every mode/rename/copy/similarity line, every `+`/`-` line BYTE-EXACT
          # including whitespace, and `\ No newline at end of file` markers. An entry
          # with NO hunk is emitted WHOLE — for a binary or hunk-less entry the
          # `index` line IS the content (the 2026-09-23 amendment), so dropping
          # anything there would make two different binaries project identically.
          # ⛔ THIS IS A SIGNED CROSS-REPO CONTRACT with agent-infra's
          # `scripts/lib/diff-normalize.py --patch-only`. Same split("\n") /
          # "\n".join over a latin-1 decode, same hunk-presence predicate, same
          # entry scoping — or the consumer disagrees with every producer in the
          # fleet (the #3076 shape). Pinned by the harness's direct vector tests, FOR
          # THE CONSUMER'S OWN VECTORS ONLY — the harness never executes the producer,
          # and the divergence declared above means producer agreement is NOT what those
          # vectors prove. Producer agreement is agent-infra#4261's to prove.
          patch_projection_review_diff() {
            python3 -c '
          import re, sys
          _IDX = re.compile(r"^index [0-9a-f]+\.\.[0-9a-f]+( [0-7]{6})?$")
          _HUNK = re.compile(r"^@@ -([0-9]+)(,([0-9]+))? \+([0-9]+)(,([0-9]+))? @@(.*)$")
          raw = sys.stdin.buffer.read().decode("latin-1")
          lines = raw.split("\n")
          bounds = [i for i, l in enumerate(lines) if l.startswith("diff --git ")]
          bounds.append(len(lines))
          out = []
          def project(entry):
              if not any(l.startswith("@@ ") for l in entry):
                  return list(entry)
              kept = []
              for l in entry:
                  if _IDX.match(l):
                      continue
                  h = _HUNK.match(l)
                  if h is not None:
                      # The FRAME is kept, with its enclosing-scope heading and
                      # WITHOUT its numbers: `@@ -N,C +N,C @@ def f():` becomes
                      # `@@ def f():` (and `@@` for a heading-less hunk). Line
                      # numbers move on a base advance, the scope heading does
                      # not — so this costs nothing on the carry it exists for,
                      # and it refuses a change RELOCATED into another scope.
                      kept.append("@@" + h.group(7))
                      continue
                  if l.startswith(" "):
                      continue
                  kept.append(l)
              return kept
          start = 0
          for end in bounds:
              out.extend(project(lines[start:end]))
              start = end
          sys.stdout.buffer.write("\n".join(out).encode("latin-1"))
          '
          }

          # ── Live diff hashes (#2982, #1362) ───────────────────────────
          # The reviewed artifact is the PR's three-dot diff. The producer
          # (record-review.sh) keys its evidence to a sha256 over these same
          # bytes: GET the pull with `Accept: application/vnd.github.v3.diff`
          # and hash the response file. Never compute this from a local
          # `git diff` — local output would not byte-match the API's, the two
          # sides would disagree, and every diff= marker would fail closed.
          #
          # TWO digests are computed from the SAME bytes:
          #   live_diff_hash_norm — sha256 over the NORMALIZED diff (new)
          #   live_diff_hash_raw  — sha256 over the RAW diff (legacy)
          # A marker's signed diff= is accepted when it equals EITHER, so this
          # gate is safe to land before or after the producer half.
          #
          # Fail closed: when the diff cannot be fetched BOTH stay empty and a
          # marker carrying diff= is NOT accepted (see the candidate filter
          # below) — a transient API failure must not become a bypass.
          #
          # Hash the FILES, not a command-substitution round-trip: `x="$(cmd)"`
          # strips trailing newlines and would change the digest. Each temp
          # file holds exactly the bytes it names.
          #
          # `python3` is the normalizer's tool and is part of the guard: if it
          # is missing BOTH digests stay empty (fail closed). A normalizer that
          # FAILS likewise clears BOTH — the gate must not silently fall back
          # to the weaker legacy arm when the signed-contract half is broken.
          live_diff_hash_norm=""
          live_diff_hash_raw=""
          live_patch_hash=""
          if command -v gh >/dev/null 2>&1 && command -v openssl >/dev/null 2>&1 \
             && command -v python3 >/dev/null 2>&1; then
            live_diff_tmp="$(mktemp)"
            if gh api -H "Accept: application/vnd.github.v3.diff" \
                 "repos/${REPO_NAME}/pulls/${PR_NUMBER}" > "$live_diff_tmp" 2>/dev/null \
               && [ -s "$live_diff_tmp" ]; then
              live_diff_hash_raw="$(openssl dgst -sha256 < "$live_diff_tmp" | awk '{print $NF}')"
              live_diff_norm_tmp="$(mktemp)"
              if normalize_review_diff < "$live_diff_tmp" > "$live_diff_norm_tmp"; then
                live_diff_hash_norm="$(openssl dgst -sha256 < "$live_diff_norm_tmp" | awk '{print $NF}')"
              else
                live_diff_hash_norm=""
                live_diff_hash_raw=""
              fi
              rm -f "$live_diff_norm_tmp"
              # The PATCH projection of the SAME fetched bytes, for rule (c).
              # Computed here so the gate parses the live diff ONCE; it is left
              # EMPTY when the normalizer half above failed, because a broken
              # signed-contract half must not leave a weaker arm (rule (c))
              # standing on its own — the same fail-closed posture as (b).
              if [ -n "$live_diff_hash_norm" ]; then
                live_patch_tmp="$(mktemp)"
                if patch_projection_review_diff < "$live_diff_tmp" > "$live_patch_tmp" \
                   && [ -s "$live_patch_tmp" ]; then
                  live_patch_hash="$(openssl dgst -sha256 < "$live_patch_tmp" | awk '{print $NF}')"
                fi
                rm -f "$live_patch_tmp"
              fi
            fi
            rm -f "$live_diff_tmp"
          fi
          [[ "$live_diff_hash_norm" =~ ^[0-9a-f]{64}$ ]] || live_diff_hash_norm=""
          [[ "$live_diff_hash_raw" =~ ^[0-9a-f]{64}$ ]] || live_diff_hash_raw=""
          [[ "$live_patch_hash" =~ ^[0-9a-f]{64}$ ]] || live_patch_hash=""

          # ── Accepted marker shapes (#3076, #2982) ───────────────────────
          # record-review.sh signs the marker text and appends " sig=<hmac>".
          # BOTH of these are signed, so BOTH must be accepted — the optional
          # " diff=<64hex>" segment is inside the HMAC input:
          #   … verdict=clean @ <40hex> (<owner/repo>) sig=<64hex>             (legacy)
          #   … verdict=clean @ <40hex> diff=<64hex> (<owner/repo>) sig=<64hex> (#2982)
          #   … verdict=clean-low @ <40hex> diff=<64hex> (<owner/repo>) sig=<64hex> (#4755)
          # A regex missing the optional diff= segment rejects every
          # correctly-signed post-#2982 marker WITHOUT ever reaching the HMAC
          # check. That was #3076: the gate fell through to the diagnostic
          # branch and reported the misleading "not signed or not for <repo>",
          # which trained operators/agents to merge with --admin.
          #
          # sha_ok_re is the #3076 shape BOUND TO THE CURRENT HEAD — acceptance
          # rule (a), and the ONLY path a legacy marker (no diff=) can ever
          # use. marker_re is the same shape with an UNBOUND 40-hex sha, needed
          # to enumerate candidates for rule (b): the diff-keyed carry-forward
          # arm (#2982) accepts a STALE `@ sha` iff its signed diff= equals the
          # live diff hash.
          sha_ok_re="^review recorded: reviews/${PR_NUMBER}\.json verdict=clean(-micro|-low)? @ ${expected}( diff=[0-9a-f]{64})? \(${repo_esc}\) sig=[0-9a-f]{64}$"
          marker_re="^review recorded: reviews/${PR_NUMBER}\.json verdict=clean(-micro|-low)? @ [0-9a-f]{40}( diff=[0-9a-f]{64})? \(${repo_esc}\) sig=[0-9a-f]{64}$"

          # Which evidence channel a matched line came from (#1224). The
          # diagnostics below must say WHERE a rejected marker was found, or
          # an operator cannot tell a stale rejected marker that came from a
          # comment from one that came from the body. A line present in BOTH
          # is reported as the PR body (its canonical channel); such a line
          # is byte-identical signed text in either channel.
          marker_channel() { # <line>
            # Here-string, not a pipeline: this step runs under `shell: bash` (which is
            # `-eo pipefail`), and $body is an un-truncated REST-fetched PR body — a
            # >64 KiB body makes `grep` exit at its first match and the writer take
            # SIGPIPE, so the `if` takes the ELSE branch while the line IS present.
            # The guard cannot see this: it selects shell FILES, and this is embedded YAML.
            if grep -Fxq -- "$1" <<<"$body"; then
              printf 'PR body'
            else
              printf 'PR comment'
            fi
          }

          # Union BOTH channels: PR body ∪ eligible PR comments (#1224). The
          # marker text is the same in either, so a body edit that removes the
          # body copy cannot remove the marker from the union. Channel
          # membership never changes WHICH marker verifies — the loop below
          # still HMAC-verifies and the binding rules are untouched.
          body_markers="$(printf '%s\n' "$body" | grep -E "$marker_re" || true)"
          comment_markers="$(printf '%s\n' "$comments" | grep -E "$marker_re" || true)"
          all_markers="$(printf '%s\n%s\n' "$body_markers" "$comment_markers" \
            | sed '/^$/d' | awk '!seen[$0]++')"

          # Keep only markers acceptable by EITHER rule:
          #   (a) recorded sha == current head (legacy + normal case) — the
          #       exact sha_ok_re shape, or
          #   (b) a signed diff=<hash> equal to EITHER live diff digest — the
          #       normalized digest (#1362) or the legacy raw digest. A
          #       STALE-SHA diff= marker is never kept via THIS rule when BOTH
          #       live hashes are empty (fail closed: an API blip must not
          #       become a bypass). Rule (a) above is unaffected — a
          #       HEAD-BOUND diff= marker still passes with no live hash.
          # The HMAC is verified separately, below, before any is accepted.
          candidates=""
          candidates_via_patch=0
          if [ -n "$all_markers" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              m_diff="$(printf '%s' "$line" | sed -nE 's/^.* @ [0-9a-f]{40} diff=([0-9a-f]{64}) \(.*$/\1/p')"
              if printf '%s' "$line" | grep -qE "$sha_ok_re"; then
                candidates="${candidates}${line}"$'\n'
              elif [ -n "$m_diff" ] && [ -n "$live_diff_hash_norm$live_diff_hash_raw" ] \
                   && { [ "$m_diff" = "$live_diff_hash_norm" ] || [ "$m_diff" = "$live_diff_hash_raw" ]; }; then
                candidates="${candidates}${line}"$'\n'
              fi
            done <<< "$all_markers"
            candidates="$(printf '%s' "$candidates" | sed '/^$/d')"
          fi

          # ── Acceptance rule (c): the PATCH projection (#4255) ────────────
          # Reached ONLY when rules (a) and (b) found nothing, so the green path
          # pays nothing for it (no extra API call on an ordinary PR).
          #
          # WHAT IT ANSWERS: "is the change this marker attests the change this PR
          # still makes?" — comparing the PATCH projections defined in the header,
          # not the rendered bytes. This is the only rule that survives a base
          # advance, because the binding digest keeps hunk context by design.
          #
          # HOW THE REVIEWED SIDE IS OBTAINED — and why that is sound. It is NOT
          # taken from the PR body and NOT taken from the marker's `diff=` on
          # trust: the gate asks GitHub for the diff at the marker's OWN SIGNED
          # `@ <sha>` against the PR's CURRENT base (`compare/<base>...<sha>`,
          # GitHub's three-dot rendering of that pair), re-derives the BINDING
          # digest of those bytes, and requires it to equal the marker's signed
          # `diff=`. That is the ANCHOR: if the reconstruction does not reproduce
          # the marker's own digest — a moved merge base, a rewritten reviewed
          # commit, a divergence between renderings — the rule REFUSES rather than
          # comparing a patch against bytes of unknown provenance. Only then is
          # the patch projection of that reconstructed artifact compared with the
          # live patch projection computed above.
          #
          # FAIL CLOSED, EVERY WAY: no live patch digest (an API blip or a broken
          # normalizer) → no rule (c); the base sha unreadable → no rule (c); the
          # compare fetch failing or answering no `diff --git` → no rule (c); the
          # anchor mismatch → no rule (c). A transient failure can therefore only
          # leave the pre-#4255 behaviour (red), never become a pass.
          #
          # ⛔ IT CANNOT WEAKEN HEAD BINDING. `@ <sha>` is signed, so the reviewed
          # head is the marker's own claim; the anchor proves the bytes; nothing
          # here mints or extends evidence, and rule (a) still governs every
          # head-bound marker.
          marker_sig_ok() { # <marker line> -> 0 iff its trailing HMAC verifies
            # ONE verifier, and its ONLY caller set is every place that decides
            # "is this marker signed": the rule-(c) probe below AND the acceptance
            # loop that follows it (which CALLS this function rather than repeating
            # the pipeline). If the two carried separate copies they could drift, and
            # an edit here would silently cover only one of them — a marker probed as
            # signed and then rejected as unsigned (or the reverse).
            # Pure local work — no API call, no secret printed.
            local line="$1" sig computed
            [[ "$line" == *" sig="* ]] || return 1
            sig="${line##* sig=}"
            computed="$(printf '%s' "${line% sig=*}" | openssl dgst -sha256 -hmac "$GATE_SECRET" | awk '{print $NF}')"
            [ "$computed" = "$sig" ]
          }

          # ⛔ THE PROBE COUNT IS BOUNDED BY EVIDENCE, NOT BY BODY BYTES (#4255
          # review). `all_markers` is ATTACKER-SUPPLIED TEXT: the comment channel
          # is narrowed to OWNER|MEMBER|COLLABORATOR, but the PR BODY is not
          # narrowed at all, and this workflow is `pull_request_target` BY DESIGN,
          # so a fork PR's body reaches the loop below. A marker LINE is ~257 bytes,
          # so a 64 KiB body holds ~254 of them, and probing each one costs up to FOUR
          # repo-scoped `gh api` calls (the ancestry read, the base sha, the branch-side
          # commit list, and the reviewed diff) against the
          # 1,000-request/hour-PER-REPOSITORY `GITHUB_TOKEN` budget that every
          # workflow in this repo shares. `ai-review-gate` is the Mergify queue's
          # ENTRY condition (#5433), so exhausting that budget would red the merge
          # path for EVERY PR until the window resets — an availability defect on
          # the one path whose cheapness the harness pins. Two independent bounds,
          # both cheap: the signature is verified FIRST (only a key holder can mint
          # a marker that reaches a probe, so the fan-out is proportional to GENUINE
          # evidence), and the probes are capped + de-duplicated on (sha,diff) as a
          # backstop. Neither can ever ACCEPT anything: a probe that does not run
          # only leaves rule (c) refusing, i.e. the pre-#4255 verdict.
          PATCH_PROBE_CAP=8

          patch_arm_ok() { # <marker line> -> 0 iff its reviewed PATCH == this PR's live PATCH
            local line="$1" p_sha="" p_diff="" p_base="" p_rel="" p_rt="" p_anchor="" p_patch=""
            local p_row="" p_total="0" p_seen="0" p_added="" p_bside="" p_tok="" p_psha="" p_np=""
            p_sha="$(printf '%s' "$line" | sed -nE 's/^.* @ ([0-9a-f]{40}).*$/\1/p')"
            p_diff="$(printf '%s' "$line" | sed -nE 's/^.* diff=([0-9a-f]{64}) \(.*$/\1/p')"
            [ "${#p_sha}" -eq 40 ] && [ "${#p_diff}" -eq 64 ] || return 1
            # A HEAD-BOUND marker is rule (a)'s; (c) exists only for a stale sha.
            [ "$p_sha" != "$expected" ] || return 1
            [ -n "$live_patch_hash" ] || return 1
            command -v gh >/dev/null 2>&1 || return 1
            command -v python3 >/dev/null 2>&1 || return 1
            # ⛔ RULE (c) IS FOR A BASE ADVANCE — NOT FOR NEW AUTHORED COMMITS, AND NOT
            # FOR A REWRITTEN BRANCH (fresh review of #4255; TWO cycles to get right).
            # It answers "did the REVIEWED change move?", which is NOT the same question
            # as "is this the change that was reviewed?". Two measured false passes, and
            # the shape that remains legal:
            #   (a) a bare FORCE-PUSH that keeps the reviewed `+`/`-` lines and moves
            #       them inside one scope. Measured `rc=0`, `passed via PATCH match`,
            #       with NO base advance at all. The ANCHOR does not bound this — it
            #       proves the REVIEWED bytes' provenance and says nothing about the
            #       live side, so the earlier header claim that it did was false.
            #   (b) an ORDINARY COMMIT on top of the reviewed sha that relocates the
            #       same lines inside one scope: still `ahead`, still carried. So
            #       reachability ALONE is not enough either.
            #   ✅ the legal shape: the base was merged in. Then EVERY commit the branch
            #       gained after the review is a MERGE commit.
            # Hence two questions, both answered from compare JSON (parsed here rather
            # than with `--jq`, so the harness stub serves a document instead of
            # emulating jq): (1) `ahead` — the reviewed commit is reachable from the
            # head, which rules out a rewrite; (2) every head-side commit that is NOT
            # reachable from the BASE is a merge commit — which rules out a new authored
            # commit. Both refuse on anything unreadable or truncated, so a transient
            # failure can only NARROW rule (c), never widen it.
            p_base="$(gh api "repos/${REPO_NAME}/pulls/${PR_NUMBER}" --jq .base.sha 2>/dev/null || true)"
            [[ "$p_base" =~ ^[0-9a-f]{40}$ ]] || return 1
            p_row="$(gh api "repos/${REPO_NAME}/compare/${p_sha}...${expected}" \
              --jq '[.status, (.total_commits // 0), ([.commits[]?] | length), ([.commits[]? | (.sha[0:12] + ":" + (((.parents // []) | length) | tostring))] | join(" "))] | @tsv' \
              2>/dev/null || true)"
            # An EMPTY parse is a READ FAILURE, not a rewrite: say so, or the operator is
            # sent to buy a 20–40 minute review for an API blip.
            if [ -z "$p_row" ]; then patch_ancestry_unreadable=1; return 1; fi
            IFS="$(printf '\t')" read -r p_rel p_total p_seen p_added <<< "$p_row"
            if [ "$p_rel" != "ahead" ]; then patch_rewritten=1; return 1; fi
            # A truncated page could hide the commit this guard exists to find.
            [ "${p_total:-0}" = "${p_seen:-0}" ] || { patch_ancestry_unreadable=1; return 1; }
            if [ -n "$p_added" ]; then
              # `compare/<base>...<head>` lists ONLY head-side commits (base ones are
              # excluded by construction), so membership in it is what separates "the
              # author pushed this" from "the base brought it in".
              p_bside="$(gh api "repos/${REPO_NAME}/compare/${p_base}...${expected}" \
                --jq '[(.total_commits // 0), ([.commits[]?] | length), ([.commits[]? | .sha[0:12]] | join(" "))] | @tsv' \
                2>/dev/null || true)"
              if [ -z "$p_bside" ]; then patch_ancestry_unreadable=1; return 1; fi
              IFS="$(printf '\t')" read -r p_btotal p_bcount p_bshas <<< "$p_bside"
              # ⛔ THE SAME RULE AS THE REVIEWED SIDE, EXACTLY (final review of #4255): a
              # count that does not match the returned page means a sha is MISSING, and a
              # missing branch-side sha makes the loop below `continue` — i.e. an AUTHORED
              # commit would be treated as one the base brought in, which is the failure
              # this whole guard exists to prevent. A bare `<= 250` was asymmetric with the
              # reviewed-side check and could not catch it.
              [ "${p_btotal:-0}" = "${p_bcount:-x}" ] || { patch_ancestry_unreadable=1; return 1; }
              for p_tok in $p_added; do
                p_psha="${p_tok%%:*}"
                p_np="${p_tok##*:}"
                case " $p_bshas " in
                  *"${p_psha}"*) ;;
                  *) continue ;;   # reachable from the base: merged in, not authored here
                esac
                [ "${p_np:-0}" -ge 2 ] || { patch_newcommit=1; return 1; }
              done
            fi
            p_rt="$(mktemp)"
            if ! gh api -H "Accept: application/vnd.github.v3.diff" \
                   "repos/${REPO_NAME}/compare/${p_base}...${p_sha}" > "$p_rt" 2>/dev/null \
               || [ ! -s "$p_rt" ] \
               || ! grep -qE '^diff --git ' "$p_rt"; then
              rm -f "$p_rt"; return 1
            fi
            p_anchor="$(normalize_review_diff < "$p_rt" | openssl dgst -sha256 | awk '{print $NF}')"
            if [ "$p_anchor" != "$p_diff" ]; then rm -f "$p_rt"; return 1; fi
            # ⛔ `[ -s ]` ON EACH PROJECTION'S OWN OUTPUT, as the producer does
            # (`record-review.sh`'s `diff_identity_pair` hashes through a temp file and
            # refuses a zero-byte one). Hashing the PIPELINE is not equivalent: a
            # projection that exits 0 and prints nothing hashes to the CONSTANT
            # `e3b0c442…`, which is non-empty and 64-hex — so it would satisfy every
            # shape check below and compare EQUAL to an empty projection on the other
            # side instead of refusing. (A `-z` test on the HASH cannot catch that; the
            # value is not empty.)
            p_patch_fn_out="$p_rt.proj"
            patch_projection_review_diff < "$p_rt" > "$p_patch_fn_out" 2>/dev/null || true
            if [ ! -s "$p_patch_fn_out" ]; then rm -f "$p_rt" "$p_patch_fn_out"; return 1; fi
            p_patch="$(openssl dgst -sha256 < "$p_patch_fn_out" | awk '{print $NF}')"
            rm -f "$p_patch_fn_out"
            rm -f "$p_rt"
            [[ "$p_patch" =~ ^[0-9a-f]{64}$ ]] || return 1
            if [ "$p_patch" != "$live_patch_hash" ]; then
              # The anchor REPRODUCED, so these are the marker's own reviewed bytes —
              # and the authored change still differs. Either the author changed it (a
              # fresh review is owed) or the base advance rewrote the hunk's enclosing
              # scope heading (the DECLARED over-block, which costs a review for a diff
              # nobody changed). The gate cannot tell them apart from here, so the
              # warning names both instead of asserting one.
              patch_diff_rejected=1
              return 1
            fi
            return 0
          }
          patch_sig_rejected=0
          patch_shape_rejected=0
          patch_probe_capped=0
          patch_rewritten=0
          patch_newcommit=0
          patch_ancestry_unreadable=0
          patch_diff_rejected=0
          if [ -z "$candidates" ] && [ -n "$all_markers" ]; then
            patch_probes=0
            patch_probe_keys="|"
            # NEWEST FIRST. `all_markers` is body-then-comment order, so its LAST
            # entry is the most recently recorded re-review. Iterating in reverse
            # means the CAP can only drop the OLDEST records — a cap that skipped
            # the newest would refuse exactly the marker a fresh re-review just
            # wrote, which is the opposite of what a carry is for.
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              # ⛔ SIGNATURE BEFORE THE PROBE (the fan-out bound above). A marker
              # that cannot verify is not evidence and must cost ZERO API calls.
              if ! marker_sig_ok "$line"; then
                # ⛔ TWO DIFFERENT DIAGNOSES — do not conflate them. Only a marker
                # carrying BOTH the 40-hex `@ sha` and the 64-hex `diff=` is one a
                # probe could ever anchor on, so only for THAT marker is a correct
                # key the thing that would have made it probed. A legacy marker has
                # no digest to anchor on (no key helps: it must be re-recorded), and
                # a HEAD-BOUND one is rule (a)'s, not rule (c)'s. Counting either as
                # a key failure sends the operator to re-mint a key that is fine.
                p_sha_bad="$(printf '%s' "$line" | sed -nE 's/^.* @ ([0-9a-f]{40}).*$/\1/p')"
                p_diff_bad="$(printf '%s' "$line" | sed -nE 's/^.* diff=([0-9a-f]{64}) \(.*$/\1/p')"
                if [ "${#p_sha_bad}" -eq 40 ] && [ "${#p_diff_bad}" -eq 64 ] \
                   && [ "$p_sha_bad" != "$expected" ]; then
                  patch_sig_rejected=$((patch_sig_rejected + 1))
                else
                  patch_shape_rejected=$((patch_shape_rejected + 1))
                fi
                continue
              fi
              # De-duplicate on the (sha,diff) pair: the same record repeated in
              # both channels (and any decoy echo of it) is probed once.
              p_key="$(printf '%s' "$line" | sed -nE 's/^.*@ ([0-9a-f]{40}) diff=([0-9a-f]{64}) \(.*$/\1 \2/p')"
              [ -n "$p_key" ] || continue
              case "$patch_probe_keys" in
                *"|${p_key}|"*) continue ;;
              esac
              if [ "$patch_probes" -ge "$PATCH_PROBE_CAP" ]; then
                patch_probe_capped=1
                continue
              fi
              patch_probe_keys="${patch_probe_keys}${p_key}|"
              patch_probes=$((patch_probes + 1))
              if patch_arm_ok "$line"; then
                candidates="${candidates}${line}"$'\n'
                candidates_via_patch=1
              fi
            done <<< "$(printf '%s\n' "$all_markers" | awk 'NF{a[NR]=$0} END{for(i=NR;i>0;i--) print a[i]}')"
            candidates="$(printf '%s' "$candidates" | sed '/^$/d')"
            if [ "$patch_probe_capped" -eq 1 ]; then
              echo "::warning::AI review rule (c): stopped after ${PATCH_PROBE_CAP} distinct SIGNED patch probes (newest first); older recorded review records were not compared. This can only REFUSE evidence, never accept it — re-record on the current head if the carry matters."
            fi
            # ⛔ THREE DIFFERENT DIAGNOSES, because they lead to three different
            # actions. Conflating them is how an operator buys a 20–40 minute review
            # for an API blip, or hunts a base advance that already matches.
            if [ -z "$candidates" ]; then
              if [ "$patch_rewritten" -eq 1 ]; then
                echo "::warning::AI review rule (c): the recorded review's commit is NOT an ancestor of this PR's head — the branch was REWRITTEN (force-push / rebase / amend) rather than advanced onto a new base. A carried review would approve a history this branch no longer has, so rule (c) refuses: re-record a fresh review on the current head."
              fi
              if [ "$patch_newcommit" -eq 1 ]; then
                echo "::warning::AI review rule (c): this branch gained a NON-MERGE commit after the reviewed sha, so the PR's own content changed after the review — rule (c) carries a review across a base advance only, never across new authored commits. Re-record a fresh review on the current head."
              fi
              if [ "$patch_ancestry_unreadable" -eq 1 ]; then
                echo "::warning::AI review rule (c): could not READ this PR's commit graph (the compare API answered nothing usable, or truncated it), so the base-advance precondition could not be checked and rule (c) refused. This is a FAIL-CLOSED refusal, not evidence that the review is stale: re-run this job before re-recording."
              fi
              if [ "$patch_diff_rejected" -eq 1 ]; then
                echo "::warning::AI review rule (c): the reviewed bytes were reproduced (the ANCHOR held) but the authored change still differs. Either content changed after the review (a fresh review IS owed), or a base advance rewrote the hunk's enclosing-scope heading — a DECLARED over-block, documented in docs/ai-review-gate.md, which costs a review for a diff nobody changed."
              fi
            fi
          fi

          # ── Verify the HMAC over the marker text, which INCLUDES diff= ────
          # Pass if ANY candidate (decoy lines / accumulated re-reviews) has a
          # valid signature, and take the first that does. A marker is accepted
          # only after its signature verifies, so neither the sha nor the
          # diff= field can be forged by editing the PR body.
          marker=""
          marker_chan=""
          accepted_via_diff=0
          accepted_via_patch=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # SAME verifier as the probe above — one HMAC pipeline, one meaning of
            # "signed" (see marker_sig_ok). Not re-derived here on purpose.
            if marker_sig_ok "$line"; then
              marker="$line"
              marker_chan="$(marker_channel "$line")"
              m_sha="$(printf '%s' "$line" | sed -E 's/^review recorded: .* @ ([0-9a-f]{40}).*$/\1/')"
              [ "$m_sha" = "$expected" ] || accepted_via_diff=1
              break
            fi
          done <<< "$candidates"

          if [ -z "$marker" ] && [ -n "$candidates" ]; then
            # Right shape, right repo, and EITHER head-bound or diff-matched,
            # signed — but no HMAC verifies. Either the recording key is not
            # the repo secret, or
            # the signed text differs from the text reconstructed here. Print
            # sha256 prefixes of both candidate reconstructions (hashes only —
            # no secret material) so the operator can tell WHICH, instead of
            # guessing between "fix the key" and "fix the marker shape".
            echo "::error::AI review marker HMAC mismatch — the signature of every candidate evidence marker (head-bound or diff-matched) does not verify against AI_REVIEW_GATE_KEY."
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              text="${line% sig=*}"
              text_sha="$(printf '%s' "$text" | openssl dgst -sha256 | awk '{print $NF}')"
              echo "::error::  text-from-pr-body-or-comment sha256=${text_sha:0:12}  (found in $(marker_channel "$line"))"
              # The same fields WITHOUT the diff= segment — the legacy text an
              # older record-review.sh would have signed. If the recorder's
              # signed text hashes to THIS prefix, the two sides disagree on
              # the marker shape, not on the key.
              legacy_text="$(printf '%s' "$text" | sed -E 's/ diff=[0-9a-f]{64}( \(.*\))$/\1/')"
              if [ "$legacy_text" != "$text" ]; then
                legacy_sha="$(printf '%s' "$legacy_text" | openssl dgst -sha256 | awk '{print $NF}')"
                echo "::error::  legacy-shape-image sha256=${legacy_sha:0:12}  (same fields, diff= segment removed)"
              fi
            done <<< "$candidates"
            echo "::error::Compare on the recording machine: printf '%s' '<the exact signed marker text>' | openssl dgst -sha256"
            echo "::error::Same text + different hash → the recording key is not AI_REVIEW_GATE_KEY. Different text → producer/gate marker-shape drift."
            report_body_provenance
            echo "::error::Re-record on the final head once resolved:"
            echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
            exit 1
          fi

          if [ -z "$marker" ]; then
            # No acceptable marker. Classify WHY — the operator must not have
            # to guess between "re-record", "fix the repo field", and "fix the
            # key". Priority: unsigned → wrong repo → malformed → stale.
            if [ "${patch_sig_rejected:-0}" -gt 0 ]; then
              # Rule (c) probes SIGNED markers only (the fan-out bound above), so
              # a STALE-sha diff= marker with a BAD signature reaches this branch
              # instead of the HMAC-mismatch diagnostic. Name it, or the stale
              # verdict below blames the DIFF for what is a KEY problem.
              echo "::error::${patch_sig_rejected} STALE-sha evidence marker(s) carried BOTH the 40-hex @ sha and the diff= that rule (c) anchors on, but their signature did NOT verify against AI_REVIEW_GATE_KEY — so rule (c) did not probe them. If the authored change is unchanged since the review, the recording KEY is the problem — not the diff."
            fi
            if [ "${patch_shape_rejected:-0}" -gt 0 ]; then
              # The other class, and it must NOT get the key advice: without a
              # `diff=` there is no digest to anchor on, so no key would have made
              # these probeable. Telling the operator to fix the key here costs a
              # key rotation and still leaves the gate red.
              echo "::error::${patch_shape_rejected} evidence marker(s) failed the signature check AND lack the shape rule (c) could anchor on (a 40-hex @ sha that is NOT this head, plus a 64-hex diff=) — no recording key would have made them probeable. Fixing the key cannot carry these: re-record on the current head."
            fi
            # Union both channels here too (#1224): the classification below
            # (unsigned / wrong-repo / malformed / stale) must work when the
            # markers came from EITHER channel, or a comment-carried failure
            # would be misreported as "no evidence at all".
            all_lines="$(printf '%s\n%s\n' \
              "$(printf '%s\n' "$body" | grep -E "^review recorded: reviews/${PR_NUMBER}\.json verdict=clean(-micro|-low)? @ " || true)" \
              "$(printf '%s\n' "$comments" | grep -E "^review recorded: reviews/${PR_NUMBER}\.json verdict=clean(-micro|-low)? @ " || true)" \
              | sed '/^$/d' | awk '!seen[$0]++')"

            if [ -z "$all_lines" ]; then
              # Name the scope ACTUALLY searched, exactly as the stale verdict
              # below does: with the comment read failed, "body or comments"
              # would assert an inspection that never happened (#1224).
              if [ "$comments_read" -eq 1 ]; then
                echo "::error::No AI review evidence found in PR #${PR_NUMBER} body or comments."
              else
                echo "::error::No AI review evidence found in PR #${PR_NUMBER} body."
                echo "::error::NOTE: the PR comment fetch failed in this run, so comment-carried evidence could not be examined — re-run this job once the API is reachable before concluding the evidence is absent."
              fi
              report_body_provenance
              echo "::error::The code-review gate requires a recorded AI review. Run:"
              echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
              exit 1
            fi

            head_unsigned=""
            head_unsigned_chan=""
            head_wrong_repo=""
            head_wrong_repo_chan=""
            head_malformed=""
            head_malformed_chan=""
            latest_sha=""
            latest_raw=""
            latest_chan=""
            # `latest_cand_raw`/`latest_cand_chan` are the LAST CANDIDATE — a line carrying
            # a well-formed sha. `latest_raw`/`latest_chan` are the last line READ, which may
            # be a sha-less one: naming THAT line's channel in the stale verdict would point
            # at the wrong channel and hide the diff= explanation below (#1224 x #4776).
            latest_cand_raw=""
            latest_cand_chan=""
            # EVERY candidate marker's binding, in body-then-comment order (#4776; #1224
            # unions the two channels). `latest_sha` is the LAST sha-bearing line, which is
            # not the newest RECORD — reporting it as "latest recorded" was the misleading
            # label. The full list is what lets the next reader see that no candidate is bound
            # to the head, instead of inferring that a record was lost.
            candidate_shas=""
            candidate_n=0
            candidate_nosha=0
            candidate_nosha_note=""
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              latest_raw="$line"
              latest_chan="$(marker_channel "$line")"
              # Per-line sha. A line with NO well-formed 40-hex sha must not
              # inherit the previous line's sha (it would then be attributed to
              # the current head and misclassified).
              line_sha=""
              if [[ "$line" =~ @\ ([0-9a-f]{40}) ]]; then line_sha="${BASH_REMATCH[1]}"; fi
              if [ -n "$line_sha" ]; then
                latest_sha="$line_sha"
                latest_cand_raw="$line"
                latest_cand_chan="$(marker_channel "$line")"
                candidate_n=$((candidate_n + 1))
                candidate_shas="${candidate_shas:+$candidate_shas }${line_sha:0:12}"
              else
                candidate_nosha=$((candidate_nosha + 1))
              fi
              [ -n "$line_sha" ] && [ "$line_sha" = "$expected" ] || continue
              # "Unsigned" means the line carries NO 'sig=' token at all. A line
              # that HAS one but fails the canonical shape (trailing whitespace /
              # CRLF / junk after the sig / a damaged delimiter / non-hex sig) is
              # MALFORMED, not unsigned — reporting those as "unsigned" is the
              # same misleading-diagnostic trap #3076 is about.
              if [[ "$line" != *"sig="* ]]; then
                if [ -z "$head_unsigned" ]; then
                  head_unsigned="$line"
                  head_unsigned_chan="$(marker_channel "$line")"
                fi
                continue
              fi
              # Extract the repo ONLY when the text matches the marker grammar
              # (so a trailing parenthetical on a damaged line is not mistaken
              # for the repo). Group 3 is the repo segment.
              l_text="${line% sig=*}"
              l_repo=""
              if [[ "$l_text" =~ ^review\ recorded:\ reviews/[0-9]+\.json\ verdict=clean(-micro|-low)?\ @\ [0-9a-f]{40}(\ diff=[0-9a-f]{64})?\ \(([^()]*)\)$ ]]; then
                l_repo="${BASH_REMATCH[3]}"
              fi
              if [ -n "$l_repo" ] && [ "$l_repo" != "$REPO_NAME" ]; then
                if [ -z "$head_wrong_repo" ]; then
                  head_wrong_repo="$l_repo"
                  head_wrong_repo_chan="$(marker_channel "$line")"
                fi
              else
                if [ -z "$head_malformed" ]; then
                  head_malformed="$line"
                  head_malformed_chan="$(marker_channel "$line")"
                fi
              fi
            done <<< "$all_lines"

            if [ -n "$head_unsigned" ]; then
              echo "::error::AI review evidence for the current head is UNSIGNED — the marker carries no 'sig=<hmac>' segment, and both the PR body and its comments are writable, so it cannot be trusted (found in ${head_unsigned_chan})."
              echo "::error::  marker=${head_unsigned}"
              report_body_provenance
              echo "::error::Re-record with a record-review.sh that has AI_REVIEW_GATE_KEY configured:"
              echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
              exit 1
            fi
            if [ -n "$head_wrong_repo" ]; then
              echo "::error::AI review evidence for the current head exists but was recorded for '${head_wrong_repo}', not '${REPO_NAME}' — evidence is bound to the repo it was recorded for (found in ${head_wrong_repo_chan})."
              report_body_provenance
              echo "::error::Re-record against this repo:"
              echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
              exit 1
            fi
            if [ -n "$head_malformed" ]; then
              m_sha="$(printf '%s' "${head_malformed% sig=*}" | openssl dgst -sha256 | awk '{print $NF}')"
              echo "::error::AI review evidence for the current head carries a signature but its marker text is not a shape this gate accepts — malformed marker (producer/gate contract drift, or a damaged line) (found in ${head_malformed_chan})."
              echo "::error::  expected: review recorded: reviews/<PR>.json verdict=clean(-micro|-low)? @ <40-hex-sha>[ diff=<64-hex>] (<owner/repo>) sig=<64-hex>"
              echo "::error::  sha256=${m_sha:0:12}"
              echo "::error::  marker=${head_malformed}"
              report_body_provenance
              echo "::error::Re-record on the final head:"
              echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
              exit 1
            fi
            if [ -z "$latest_sha" ]; then
              echo "::error::AI review evidence in PR #${PR_NUMBER} carries no well-formed 40-hex recorded sha — it cannot be bound to this head (found in ${latest_chan})."
              echo "::error::  marker=${latest_raw}"
              report_body_provenance
              echo "::error::Re-record on the final head:"
              echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
              exit 1
            fi
            # The marker is bound to a head this gate no longer accepts. Two
            # distinct causes remain, and naming the wrong one wastes a debug
            # cycle: the marker may be for ANOTHER REPO (reporting that as a
            # stale/diff divergence prints two byte-identical hashes — #3057's
            # k2), or the reviewed diff changed / could not be hashed (#2982).
            # Extract the repo ONLY from a line that IS a well-formed marker.
            # A trailing ` (text) sig=<hex>` on an otherwise-malformed line
            # (`@ not-a-sha`) must not hijack this branch and misattribute the
            # cause — that would suppress the accurate stale/diff diagnostic on
            # a check (review finding, #3057).
            latest_repo=""
            if [[ "$latest_raw" =~ ^review\ recorded:\ reviews/[0-9]+\.json\ verdict=clean(-micro|-low)?\ @\ [0-9a-f]{40}(\ diff=[0-9a-f]{64})?\ \(([^()]*)\)(\ sig=[0-9a-f]{64})?$ ]]; then
              latest_repo="${BASH_REMATCH[3]}"
            fi
            if [ -n "$latest_repo" ] && [ "$latest_repo" != "$REPO_NAME" ]; then
              echo "::error::AI review evidence was found for ${latest_repo}, not for ${REPO_NAME} (this PR's repo) — evidence is bound to the repo it was recorded for and cannot be accepted here (found in ${latest_cand_chan})."
              report_body_provenance
              echo "::error::Re-record for this repo:"
              echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
              exit 1
            fi
            # Name the scope ACTUALLY searched: with the comment read failed,
            # claiming the comments carry no bound marker would assert an
            # inspection that never happened (#1224). The provenance line says
            # `comments=NOT-READ` in that case.
            if [ "$comments_read" -eq 1 ]; then
              echo "::error::AI review evidence is stale: NO marker in this PR's body or its admitted comments is bound to ${expected} (the last candidate it read was found in ${latest_cand_chan})."
            else
              echo "::error::AI review evidence is stale: NO marker in this PR's body is bound to ${expected} (the last candidate it read was found in ${latest_cand_chan})."
              echo "::error::NOTE: the PR comment fetch failed in this run, so comment-carried evidence could not be examined — re-run this job once the API is reachable before concluding no record exists."
            fi
            if [ "$candidate_nosha" -gt 0 ]; then
              candidate_nosha_note="; ${candidate_nosha} with no 40-hex sha"
            fi
            echo "::error::  candidate marker(s): ${candidate_n} with a well-formed sha (bound to: ${candidate_shas})${candidate_nosha_note}"
            report_body_provenance
            echo "::error::  head expected: ${expected}"
            # A diff= marker that would have carried forward but was not
            # acceptable: say exactly why — this is the #2982 diff-match path
            # failing. A diff= marker is NEVER accepted without a live hash to
            # match (an API blip must not become a bypass).
            # From the last CANDIDATE, not the last line read: a trailing sha-less
            # line would otherwise suppress this explanation entirely (#1224 x #4776).
            latest_diff="$(printf '%s' "$latest_cand_raw" | sed -nE 's/^.* diff=([0-9a-f]{64}) \(.*$/\1/p')"
            if [ -n "$latest_diff" ]; then
              if [ -z "$live_diff_hash_norm$live_diff_hash_raw" ]; then
                echo "::error::The stale marker carries diff=${latest_diff}, but the live diff hash could not be computed for this PR — failing closed. A diff= marker is never accepted without a live hash to match (an API blip must not become a bypass)."
                echo "::error::Re-run this job once the API is reachable; the evidence itself may still be valid."
              else
                echo "::error::The stale marker's diff=${latest_diff} does not match this PR's current diff hash (normalized=${live_diff_hash_norm:-unavailable}, raw=${live_diff_hash_raw:-unavailable}) — the reviewed diff changed, so the verdict does not carry forward."
              fi
            fi
            echo "::error::Re-run the code-review skill after the latest push, then re-record:"
            echo "::error::  record-review.sh ${PR_NUMBER} ${HEAD_SHA} clean ${REPO_NAME}"
            exit 1
          fi

          if [ "$accepted_via_diff" -eq 1 ] && [ "$candidates_via_patch" -eq 1 ]; then
            # Rule (c) (#4255): the candidate set came from the PATCH comparison,
            # so a stale-sha acceptance here means the authored change is the one
            # the reviewer approved even though the rendered diff moved.
            accepted_via_patch=1
          fi
          if [ "$accepted_via_patch" -eq 1 ]; then
            echo "AI review gate passed via PATCH match: the verdict recorded against a previous head carries forward because the change this PR AUTHORED is byte-identical (the rendered diff moved — hunk context and line numbers — which is what a base advance does; every reviewed +/- line, path and whitespace is unchanged). The marker's @ sha is stale; its signed diff= was reproduced from that sha against the current base (the ANCHOR), and the patch projection matched rule (c)."
            echo "AI review gate passed: ${marker% sig=*} (marker found in ${marker_chan})"
          elif [ "$accepted_via_diff" -eq 1 ]; then
            # New (#2982) diagnostic: explain WHY a stale-sha marker passed.
            # Name which digest matched (#1362) so a legacy-vs-normalized
            # carry-forward is legible in the log.
            accepted_diff="$(printf '%s' "$marker" | sed -nE 's/^.* diff=([0-9a-f]{64}) \(.*$/\1/p')"
            matched_digest="raw"
            if [ "$accepted_diff" = "$live_diff_hash_norm" ]; then matched_digest="normalized"; fi
            echo "AI review gate passed via diff match: the verdict recorded against a previous head carries forward because this PR's diff is unchanged (diff=${accepted_diff}, matched the ${matched_digest} digest). The marker's @ sha is stale; the signed diff= field is the reviewed artifact."
            echo "AI review gate passed: ${marker% sig=*} (marker found in ${marker_chan})"
          else
            echo "AI review gate passed: ${marker% sig=*} (marker found in ${marker_chan})"
          fi
