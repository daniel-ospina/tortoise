name: Token Perms
on:
  workflow_dispatch:
jobs:
  perms:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== token list (accounts) ==="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -m json.tool 2>&1 | head -40
