# Post-merge validation (#559)
#
# Closes the "done means merged, not verified" gap: every PR merged into main
# runs the test suite against the merged head and posts the result on the PR.
# On FAIL it also flags the linked issue (parsed from "Closes #N" in the PR
# body) so an issue can never be silently 'done' while its change is red.
#
# Warn-only by design (mirrors post-deploy-verify): it detects problems and
# makes them visible; it does not roll back. The issue stays open until the
# failure is resolved and re-validated.
#
# Note: runs the embedded-FalkorDBLite suite. Tests needing a live FalkorDB
# self-skip via _skip_if_no_falkor. A per-test timeout turns any hang into a
# fast, visible failure instead of a 6h CI budget burn.
#
# #1439: the validate job excludes config/ci-surfaces.yml `slow_files:` (the
# 21 files python-ci.yml's test-slow job already covers on the same merge
# commit) from the pytest run — post-merge ≈ python-ci's fast gate (~28-32m
# incl. setup vs the 60m cap) instead of re-running the full suite (measured
# 58m31s of pytest, run 32104818556 — cancelled at the cap on every merge).
# The HF model cache/pre-cache + offline pins and the stale-redislite-orphan
# reap are ported from python-ci's test job for the same reliability parity.
# #1430: the tests step carries an in-step watchdog (mirrors python-ci.yml's
# test job, the #798 mode) — a runner-level kill can never lose the summary
# silently: the step always re-prints the tail + pass/fail counts + real exit
# code, with a WATCHDOG banner on timeout kills. Warn-only, no gate impact.

name: Post-merge validation

on:
  pull_request:
    types: [closed]

concurrency:
  group: postmerge-validation
  cancel-in-progress: false

# The comment step posts on the PR and the linked issue — the default
# read-only token for pull_request events cannot do that.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # pyproject requires-python >= 3.12 (mirrors python-ci.yml)
      - name: Install
        run: |
          set -o pipefail  # don't let `tail` mask a pip failure
          # pytest-asyncio: tests/test_github_indexer.py uses @pytest.mark.asyncio
          # (mirrors the python-ci.yml '.[test,embeddings]' surface, #493).
          pip install -e '.[embeddings]' falkordblite pytest pytest-timeout pytest-asyncio 2>&1 | tail -2
      - name: Clean stale redislite orphans (issue #1005 tempdir pollution)
        # Leaky shared runners accumulate redislite tempdirs from every
        # failed embedded-redis run — discover() then skips its stale-socket
        # walk (>5000 entries), so the reaper chaos tests fail with
        # "orphan not cleaned". Reap strays before the suite. Best-effort.
        # (#1439 parity port from python-ci's test job.)
        run: |
          pkill -f "redis-server unixsocket" || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (all-MiniLM-L6-v2)
        # ~90MB; persisted so the pre-cache step below is a no-op on
        # subsequent runs and CI never re-downloads from huggingface.co.
        # Same repo-wide key as python-ci — its runs already populate this
        # cache, so post-merge restores it with zero download on most merges.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v1-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v1-${{ runner.os }}-
      - name: Pre-cache embedding model (all-MiniLM-L6-v2)
        # Best-effort: when the model is already cached (actions/cache
        # restore) this is a no-op. When the download succeeds, the suite
        # exercises the real embedding path. When it fails (HF unreachable
        # from runner — observed: "couldn't connect to huggingface.co"),
        # the runtime already degrades gracefully to TF-IDF fallback
        # (embeddings.py catches load failure), so a failed download is a
        # WARNING, never a job failure.
        # #964: a hung HF download (stalled TCP, no error raised) would
        # otherwise stall the step for the full job cap with no output —
        # step-level timeout bounds it; continue-on-error turns the timeout
        # into a warning, not a failure. #1211-class: on HF-unreachable
        # runners, tight retries (3 × 5s backoff) fail fast so the suite
        # falls back to TF-IDF instead of burning the watchdog budget.
        # (#1439 parity port from python-ci's test job.)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import os, time
          os.environ["HF_HUB_OFFLINE"] = "1"
          from sentence_transformers import SentenceTransformer
          try:
              SentenceTransformer("all-MiniLM-L6-v2")
              print("embedding model: cached, no download needed")
          except Exception:
              print("embedding model: not cached — downloading (with retries)")
              del os.environ["HF_HUB_OFFLINE"]
              for attempt in range(1, 4):
                  try:
                      SentenceTransformer("all-MiniLM-L6-v2")
                      print("embedding model: downloaded")
                      break
                  except Exception as e:
                      print(f"download attempt {attempt}/3 failed: {e}")
                      if attempt == 3:
                          raise
                      time.sleep(5 * attempt)
          EOF
      - name: Run tests (embedded suite, per-test timeout)
        id: tests
        run: |
          set +e
          # #1430: in-step watchdog + guaranteed summary (the #798 mode).
          # Transplants python-ci.yml's proven block: a shell-level `timeout`
          # (SIGINT, then SIGKILL 10s later if pytest ignores INT mid-test)
          # instead of relying on the runner's job-level kill, which cancels
          # the step and loses the summary silently. After the kill the step
          # CONTINUES: re-prints the log tail, prints pass/fail counts and
          # the real exit code. 50m in-step + ~2-6m setup < 60m job cap (a
          # literal 60m in-step would fire AFTER the runner kill — the #798
          # death mode again). The suite is over budget today (#1439) — #1439
          # excludes the slow files below, so the WATCHDOG banner firing is
          # the honest-red exception (HF outage, loaded runner), never silent.
          # Warn-only workflow — no gate impact.
          # NB: `set +e` is load-bearing — GitHub runs steps under
          # bash -eo pipefail; without it, timeout's 124 aborts the step
          # BEFORE the tail/banner/exit-code print (silent #798, again).
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' /tmp/pmv-pytest.log 2>/dev/null || true)
              f=$(grep -c ' FAILED' /tmp/pmv-pytest.log 2>/dev/null || true)
              echo "HEARTBEAT: pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          # 90s per-test -> 300s: 90 false-killed test_control_plane's ~90s
          # setup in python-ci (#798) — test_control_plane is in slow_files,
          # so post-merge does NOT run it anymore (#1439).
          # --durations=15 shows the slowest 15 tests in the tail.
          # tests/e2e stays excluded (dedicated e2e jobs; no browsers here).
          # #1439: SLOW_IGNORES drops the 21 slow files (config/ci-surfaces.yml
          # slow_files — single source of truth, same yaml.safe_load read as
          # python-ci's changes job). Runtime read = drift-proof: a slow file
          # added to the manifest auto-excludes here; one removed auto-re-enters.
          # Unquoted $SLOW_IGNORES word-splits into --ignore flags; empty
          # (missing key) falls back to the full suite.
          SLOW_IGNORES=$(python3 -c "import yaml; m=yaml.safe_load(open('config/ci-surfaces.yml')); print(' '.join('--ignore=tests/'+f for f in m.get('slow_files', [])))")
          timeout -s INT -k 10 50m stdbuf -oL python -m pytest tests/ -v --timeout=300 -p no:cacheprovider -m 'not track_b' --ignore=tests/e2e $SLOW_IGNORES --maxfail=20 -rfE --durations=15 > /tmp/pmv-pytest.log 2>&1
          rc=$?
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 300 /tmp/pmv-pytest.log
          # 124 = timeout SIGINT kill; 137 = -k 10 SIGKILL after pytest
          # ignored INT mid-test; 2 = pytest's own SIGINT summary — the
          # count banner must print for all three (#880).
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' /tmp/pmv-pytest.log)
            failed=$(grep -c ' FAILED' /tmp/pmv-pytest.log)
            errored=$(grep -c ' ERROR' /tmp/pmv-pytest.log)
            echo "==================== WATCHDOG: pytest killed after 50m ($passed passed, $failed failed, $errored errored so far) — last test lines above ===================="
          fi
          echo "==================== pytest exit code: $rc ===================="
          # #1438: the comment step needs the REAL exit code (not just the
          # binary step outcome) to distinguish a watchdog-kill timeout
          # (rc 124/137/2) from a real test failure (rc 1). Written on every
          # path — before the final `exit $rc` re-raises the real status.
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          # #1439 parity with python-ci's test job: deterministic embeddings —
          # the model is pre-cached above; tests must NEVER reach
          # huggingface.co mid-suite (shared runner IPs get 429-rate-limited,
          # stalling embedding loads up to 30s each).
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        env:
          # github-script v7 does not expose `steps` in the JS scope (and
          # rejects undeclared `with:` inputs) — pass the tests step's outcome
          # AND its real exit code via expression-evaluated env vars instead.
          # The exit code is what turns the binary pass/fail into the tri-state
          # verdict (#1438): a watchdog kill (rc 124/137/2) or a runner
          # cancellation is a timeout, not a breakage.
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TESTS_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        with:
          script: |
            // #1438 tri-state verdict — the logic lives in a plain-CJS module
            // under .github/scripts so the contract is unit-tested
            // (tests/test_postmerge_verdict.py) instead of living untestable
            // inside the github-script block. The module's CLI dry-run mode
            // mirrors exactly this call: verdict + comment body + flag decision.
            const { computeVerdict, buildCommentBody, shouldFlagLinkedIssue } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/postmerge-verdict.js`);
            const pr = context.payload.pull_request;
            const verdict = computeVerdict(process.env.TESTS_OUTCOME, process.env.TESTS_EXIT_CODE);
            const body = buildCommentBody(verdict, {
              sha8: pr.merge_commit_sha.slice(0, 8),
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
            if (shouldFlagLinkedIssue(verdict)) {
              // Flag the linked issue ("Closes #N" / "Fixes #N" in the body)
              // — only a REAL failure implies the change is bad. A timeout
              // never flags the issue (#1438 indicator a).
              const m = (pr.body || '').match(/(?:closes|fixes|resolves)\s+#(\d+)/i);
              if (m) {
                await github.rest.issues.createComment({
                  issue_number: parseInt(m[1], 10),
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `⚠️ The PR that closed this issue (#${pr.number}) **failed post-merge validation** — see run ${context.runId}. Keeping this visible until the failure is resolved; the issue is not considered done.`,
                });
              }
            }
      - name: Fail the check
        if: steps.tests.outcome == 'failure'
        run: exit 1
