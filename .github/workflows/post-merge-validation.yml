# Post-merge validation (#559)
#
# Closes the "done means merged, not verified" gap: every push to main runs
# the test suite against the pushed head and posts the result on the merged
# PR. On FAIL it also flags the linked issue (parsed from "Closes #N" in the
# PR body) so an issue can never be silently 'done' while its change is red.
#
# Warn-only by design (mirrors post-deploy-verify): it detects problems and
# makes them visible; it does not roll back. The issue stays open until the
# failure is resolved and re-validated.
#
# Note: runs the embedded-FalkorDBLite suite. Tests needing a live FalkorDB
# self-skip via _skip_if_no_falkor. A per-test timeout turns any hang into a
# fast, visible failure instead of a 6h CI budget burn.
#
# #1439: the validate job excludes config/ci-surfaces.yml `slow_files:` (the
# 21 files python-ci.yml's test-slow job already covers on the same merge
# commit) from the pytest run — post-merge ≈ python-ci's fast gate (~28-32m
# incl. setup vs the 60m cap) instead of re-running the full suite (measured
# 58m31s of pytest, run 32104818556 — cancelled at the cap on every merge).
# The HF model cache/pre-cache + offline pins and the stale-redislite-orphan
# reap are ported from python-ci's test job for the same reliability parity.
# #1430: the tests step carries an in-step watchdog (mirrors python-ci.yml's
# test job, the #798 mode) — a runner-level kill can never lose the summary
# silently: the step always re-prints the tail + pass/fail counts + real exit
# code, with a WATCHDOG banner on timeout kills. Warn-only, no gate impact.
#
# #1474: sound-dedup vs python-ci's push-to-main full run. This workflow used
# to trigger on pull_request:closed and re-run the FULL suite on every merged
# tree — but python-ci.yml already validates the same tree with the full
# matrix on push:main. The naive skip (PR-CI-green + tree-equal) is WRONG
# (PR CI is a tiered subset on a different install), so this workflow now:
#   - triggers on push:main (the merged tree, github.sha) instead,
#   - polls the python-ci push-run conclusion for the SAME tree via the API
#     (actions: read; event=push + head_sha=full SHA — the head_sha filter
#     returns 0 results for abbreviated SHAs, verified 2026-08-19),
#   - SKIPS the redundant pytest run (only comments "covered" + reports
#     success — the aggregator pattern) when that run is completed+success,
#   - FALLS OPEN to the full run on any other state (failure/cancelled/
#     queued/in_progress past the 110-min poll cap/run never appearing/API
#     error/no PR attribution) — the #1438 tri-state verdict + #559 issue
#     flag contract is preserved byte-for-byte on the fall-open path.
# PR/issue attribution moves off the (absent-on-push) pull_request payload to
# the merge commit message + PR fetch, parsed by .github/scripts/
# postmerge-dedup.js (unit-tested, tests/test_postmerge_dedup.py).
#
# #1474 gate polarity (P1, verifier-found): every suite/comment gate below
# tests `skip != 'true'`, NOT `== 'false'` — if the dedup-check job fails
# outside its try/catch, its outputs are EMPTY strings, and `'' != 'true'`
# evaluates true (full run = fall-open). The `== 'false'` polarity would make
# `'' == 'false'` false and silently skip the whole suite → a false-green
# check with zero tests. Only the skip-path comment gates on `== 'true'`.

name: Post-merge validation

on:
  push:
    branches: [main]

concurrency:
  group: postmerge-validation
  cancel-in-progress: false

# The comment steps post on the PR and the linked issue — the default
# read-only token for push events cannot do that. `actions: read` is new
# (#1474): the dedup-check job lists python-ci's workflow runs via the API.
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  dedup-check:
    # #1474: sound-dedup gate. Decides whether python-ci's push-to-main full
    # run on THIS tree (event=push, head_sha=github.sha) has already concluded
    # green. NEVER fails the workflow: every exception inside the script falls
    # open (skip=false → validate runs the full suite).
    runs-on: ubuntu-latest
    timeout-minutes: 120  # poll cap is 110m (queue wait + ~55m suite); script timeouts inside
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      pr_number: ${{ steps.dedup.outputs.pr_number }}
      issue_number: ${{ steps.dedup.outputs.issue_number }}
      push_run_id: ${{ steps.dedup.outputs.push_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}  # deterministic — a mid-run main advance must not move the tree
      - name: Dedup decision — poll python-ci push run on same tree
        id: dedup
        uses: actions/github-script@v7
        env:
          POLL_INTERVAL_MS: "30000"
          POLL_CAP_MS: "6600000"   # 110 min: push runs serialize (shared group, no cancel), so
                                   # our run can sit in queue (~55m) before its suite (~55m) starts
          EMPTY_GRACE_POLLS: "5"   # run-creation race is seconds; 5 empty polls (2.5 min) means
                                   # the run will never appear (broken/disabled python-ci.yml) → fall open
        with:
          script: |
            const { parsePrNumberFromMergeMessage, parseIssueNumberFromBody, dedupDecision } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/postmerge-dedup.js`);
            const { owner, repo } = context.repo;
            const sha = context.sha;  // full 40-char pushed SHA (head_sha filter requires it)
            const interval = parseInt(process.env.POLL_INTERVAL_MS || '30000', 10);
            const cap = parseInt(process.env.POLL_CAP_MS || '6600000', 10);
            const emptyGrace = parseInt(process.env.EMPTY_GRACE_POLLS || '5', 10);
            const out = { skip: 'false', pr_number: '', issue_number: '', push_run_id: '' };
            try {
              // 1) PR attribution — best-effort; only affects comment/flag, NEVER the skip decision.
              const headMsg = context.payload.head_commit && context.payload.head_commit.message;
              const prNumber = headMsg ? parsePrNumberFromMergeMessage(headMsg) : null;
              if (prNumber) {
                const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                // Tree-attribution guard: only trust the PR if the merged tree IS the pushed tree.
                if (pr.data.merge_commit_sha === sha) {
                  out.pr_number = String(prNumber);
                  const issue = parseIssueNumberFromBody(pr.data.body || '');
                  if (issue) out.issue_number = String(issue);
                }
              }
              // 2) Poll python-ci's push run for this exact tree.
              const deadline = Date.now() + cap;
              let emptyPolls = 0;
              let pushRun = null;
              while (Date.now() < deadline) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner, repo,
                  workflow_id: 'python-ci.yml',
                  event: 'push',           // filters out pull_request + schedule runs
                  head_sha: sha,
                  per_page: 100,  # #1474 review P3: a SHA with >10 reruns must still see the newest run
                });
                const candidates = (runs.data && runs.data.workflow_runs) || [];
                if (candidates.length === 0) {
                  // Run not listed yet (creation race) → keep polling; if it never
                  // appears within the grace, fall open instead of burning the cap.
                  if (++emptyPolls >= emptyGrace) break;
                  await new Promise(r => setTimeout(r, interval));
                  continue;
                }
                emptyPolls = 0;
                candidates.sort((a, b) => b.id - a.id);  // re-runs supersede (max id wins)
                pushRun = candidates[0];
                if (pushRun.status === 'completed') break;
                await new Promise(r => setTimeout(r, interval));
              }
              if (pushRun && pushRun.status === 'completed') {
                out.push_run_id = String(pushRun.id);
                out.skip = dedupDecision(pushRun.status, pushRun.conclusion) ? 'true' : 'false';
              }
              // else: poll cap or empty-grace exhausted → skip stays 'false' (fall open).
            } catch (err) {
              core.warning(`post-merge dedup fell open (error: ${err.message})`);
            }
            for (const [k, v] of Object.entries(out)) core.setOutput(k, v);

  validate:
    # #1474: this job is the check branch protection tracks. `if: always()` +
    # `needs: dedup-check`: if dedup-check itself fails, the suite still runs
    # (all gates below use `skip != 'true'` → empty outputs fall open).
    needs: dedup-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # #1474 review (P1): checkout MUST run unconditionally FIRST — the
      # skip-comment step requires postmerge-dedup.js from the workspace, and
      # the skip path never ran checkout before (empty runner -> MODULE_NOT_FOUND
      # -> red check + no comment on the primary path).
      - uses: actions/checkout@v4
      # #1474 skip path — python-ci's push run on this tree was green; only
      # comment "covered" (aggregator reports success; no second pytest run).
      - name: Skip — covered by python-ci push run (no re-run)
        if: needs.dedup-check.outputs.skip == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.dedup-check.outputs.pr_number }}
          PUSH_RUN_ID: ${{ needs.dedup-check.outputs.push_run_id }}
        with:
          script: |
            // #1474: post-merge elides the redundant run. The branch-protection
            // check stays green (this step succeeds); the covered-comment makes
            // the skip visible on the PR. No PR attribution (direct push) →
            // no-op: the python-ci push run still validated the tree.
            const { buildSkipCommentBody } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/postmerge-dedup.js`);
            const prNumber = process.env.PR_NUMBER;
            if (!prNumber) {
              core.info('no PR attribution (direct push?) — covered-comment skipped; the push run already validated this tree');
            } else {
              const body = buildSkipCommentBody({
                sha8: context.sha.slice(0, 8),
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                pushRunId: process.env.PUSH_RUN_ID,
              });
              await github.rest.issues.createComment({
                issue_number: parseInt(prNumber, 10),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
      - uses: actions/setup-python@v5
        if: needs.dedup-check.outputs.skip != 'true'
        with:
          python-version: '3.12'  # pyproject requires-python >= 3.12 (mirrors python-ci.yml)
      - name: Install
        if: needs.dedup-check.outputs.skip != 'true'
        run: |
          set -o pipefail  # don't let `tail` mask a pip failure
          # pytest-asyncio: tests/test_github_indexer.py uses @pytest.mark.asyncio
          # (mirrors the python-ci.yml '.[test,embeddings]' surface, #493).
          pip install -e '.[embeddings]' falkordblite pytest pytest-timeout pytest-asyncio 2>&1 | tail -2
      - name: Clean stale redislite orphans (issue #1005 tempdir pollution)
        if: needs.dedup-check.outputs.skip != 'true'
        # Leaky shared runners accumulate redislite tempdirs from every
        # failed embedded-redis run — discover() then skips its stale-socket
        # walk (>5000 entries), so the reaper chaos tests fail with
        # "orphan not cleaned". Reap strays before the suite. Best-effort.
        # (#1439 parity port from python-ci's test job.)
        run: |
          pkill -f "redis-server unixsocket" || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        if: needs.dedup-check.outputs.skip != 'true'
        # ~130MB; persisted so the pre-cache step below is a no-op on
        # subsequent runs and CI never re-downloads from huggingface.co.
        # Same repo-wide key as python-ci (#1349 T10 — v2 holds bge-small;
        # the v1 cache holds all-MiniLM-L6-v2 and must never serve bge runs).
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Pre-cache embedding model (BAAI/bge-small-en-v1.5)
        if: needs.dedup-check.outputs.skip != 'true'
        # Best-effort: when the model is already cached (actions/cache
        # restore) this is a no-op. When the download succeeds, the suite
        # exercises the real embedding path. When it fails (HF unreachable
        # from runner — observed: "couldn't connect to huggingface.co"),
        # the runtime already degrades gracefully to TF-IDF fallback
        # (embeddings.py catches load failure), so a failed download is a
        # WARNING, never a job failure.
        # #964: a hung HF download (stalled TCP, no error raised) would
        # otherwise stall the step for the full job cap with no output —
        # step-level timeout bounds it; continue-on-error turns the timeout
        # into a warning, not a failure. #1211-class: on HF-unreachable
        # runners, tight retries (3 × 5s backoff) fail fast so the suite
        # falls back to TF-IDF instead of burning the watchdog budget.
        # (#1439 parity port from python-ci's test job.)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python - <<'EOF'
          import os, time
          # #1349 T10: pinned revision (VULN-001) — matches python-ci.
          MODEL = "BAAI/bge-small-en-v1.5"
          REVISION = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
          os.environ["HF_HUB_OFFLINE"] = "1"
          from sentence_transformers import SentenceTransformer
          try:
              SentenceTransformer(MODEL, revision=REVISION)
              print("embedding model: cached, no download needed")
          except Exception:
              print("embedding model: not cached — downloading (with retries)")
              del os.environ["HF_HUB_OFFLINE"]
              for attempt in range(1, 4):
                  try:
                      SentenceTransformer(MODEL, revision=REVISION)
                      print("embedding model: downloaded")
                      break
                  except Exception as e:
                      print(f"download attempt {attempt}/3 failed: {e}")
                      if attempt == 3:
                          raise
                      time.sleep(5 * attempt)
          EOF
      - name: Run tests (embedded suite, per-test timeout)
        id: tests
        if: needs.dedup-check.outputs.skip != 'true'
        run: |
          set +e
          # #1430: in-step watchdog + guaranteed summary (the #798 mode).
          # Transplants python-ci.yml's proven block: a shell-level `timeout`
          # (SIGINT, then SIGKILL 10s later if pytest ignores INT mid-test)
          # instead of relying on the runner's job-level kill, which cancels
          # the step and loses the summary silently. After the kill the step
          # CONTINUES: re-prints the log tail, prints pass/fail counts and
          # the real exit code. 50m in-step + ~2-6m setup < 60m job cap (a
          # literal 60m in-step would fire AFTER the runner kill — the #798
          # death mode again). The suite is over budget today (#1439) — #1439
          # excludes the slow files below, so the WATCHDOG banner firing is
          # the honest-red exception (HF outage, loaded runner), never silent.
          # Warn-only workflow — no gate impact.
          # NB: `set +e` is load-bearing — GitHub runs steps under
          # bash -eo pipefail; without it, timeout's 124 aborts the step
          # BEFORE the tail/banner/exit-code print (silent #798, again).
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' /tmp/pmv-pytest.log 2>/dev/null || true)
              f=$(grep -c ' FAILED' /tmp/pmv-pytest.log 2>/dev/null || true)
              echo "HEARTBEAT: pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          # 90s per-test -> 300s: 90 false-killed test_control_plane's ~90s
          # setup in python-ci (#798) — test_control_plane is in slow_files,
          # so post-merge does NOT run it anymore (#1439).
          # --durations=15 shows the slowest 15 tests in the tail.
          # tests/e2e stays excluded (dedicated e2e jobs; no browsers here).
          # #1439: SLOW_IGNORES drops the 21 slow files (config/ci-surfaces.yml
          # slow_files — single source of truth, same yaml.safe_load read as
          # python-ci's changes job). Runtime read = drift-proof: a slow file
          # added to the manifest auto-excludes here; one removed auto-re-enters.
          # Unquoted $SLOW_IGNORES word-splits into --ignore flags; empty
          # (missing key) falls back to the full suite.
          SLOW_IGNORES=$(python3 -c "import yaml; m=yaml.safe_load(open('config/ci-surfaces.yml')); print(' '.join('--ignore=tests/'+f for f in m.get('slow_files', [])))")
          timeout -s INT -k 10 50m stdbuf -oL python -m pytest tests/ -v --timeout=300 -p no:cacheprovider -m 'not track_b' --ignore=tests/e2e $SLOW_IGNORES --maxfail=20 -rfE --durations=15 > /tmp/pmv-pytest.log 2>&1
          rc=$?
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 300 /tmp/pmv-pytest.log
          # 124 = timeout SIGINT kill; 137 = -k 10 SIGKILL after pytest
          # ignored INT mid-test; 2 = pytest's own SIGINT summary — the
          # count banner must print for all three (#880).
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' /tmp/pmv-pytest.log)
            failed=$(grep -c ' FAILED' /tmp/pmv-pytest.log)
            errored=$(grep -c ' ERROR' /tmp/pmv-pytest.log)
            echo "==================== WATCHDOG: pytest killed after 50m ($passed passed, $failed failed, $errored errored so far) — last test lines above ===================="
          fi
          echo "==================== pytest exit code: $rc ===================="
          # #1438: the comment step needs the REAL exit code (not just the
          # binary step outcome) to distinguish a watchdog-kill timeout
          # (rc 124/137/2) from a real test failure (rc 1). Written on every
          # path — before the final `exit $rc` re-raises the real status.
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          # #1439 parity with python-ci's test job: deterministic embeddings —
          # the model is pre-cached above; tests must NEVER reach
          # huggingface.co mid-suite (shared runner IPs get 429-rate-limited,
          # stalling embedding loads up to 30s each).
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
      - name: Comment result on PR
        if: always() && needs.dedup-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          # github-script v7 does not expose `steps` in the JS scope (and
          # rejects undeclared `with:` inputs) — pass the tests step's outcome
          # AND its real exit code via expression-evaluated env vars instead.
          # The exit code is what turns the binary pass/fail into the tri-state
          # verdict (#1438): a watchdog kill (rc 124/137/2) or a runner
          # cancellation is a timeout, not a breakage.
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TESTS_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          # #1474: on push:main there is no pull_request payload — attribution
          # comes from the dedup-check job (merge commit message + PR fetch).
          PR_NUMBER: ${{ needs.dedup-check.outputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.dedup-check.outputs.issue_number }}
        with:
          script: |
            // #1438 tri-state verdict — the logic lives in a plain-CJS module
            // under .github/scripts so the contract is unit-tested
            // (tests/test_postmerge_verdict.py) instead of living untestable
            // inside the github-script block. The module's CLI dry-run mode
            // mirrors exactly this call: verdict + comment body + flag decision.
            // #1474: inputs unchanged — only the PR/issue numbers now come from
            // the dedup-check job outputs instead of context.payload.pull_request.
            const { computeVerdict, buildCommentBody, shouldFlagLinkedIssue } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/postmerge-verdict.js`);
            const prNumber = process.env.PR_NUMBER;
            const verdict = computeVerdict(process.env.TESTS_OUTCOME, process.env.TESTS_EXIT_CODE);
            if (!prNumber) {
              // #1474: no PR attribution (direct push to main, non-merge commit)
              // — nothing to comment on; the check outcome + run log remain the
              // signal. A comment here would 4xx on an empty issue_number and
              // spuriously red the check despite green tests.
              core.info(`verdict ${verdict} computed but no PR to comment on (direct push?)`);
            } else {
              const body = buildCommentBody(verdict, {
                sha8: context.sha.slice(0, 8),
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.createComment({
                issue_number: parseInt(prNumber, 10),
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
            if (shouldFlagLinkedIssue(verdict)) {
              // Flag the linked issue ("Closes #N" / "Fixes #N" in the body)
              // — only a REAL failure implies the change is bad. A timeout
              // never flags the issue (#1438 indicator a).
              const issueNumber = process.env.ISSUE_NUMBER;
              if (issueNumber) {
                await github.rest.issues.createComment({
                  issue_number: parseInt(issueNumber, 10),
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `⚠️ The PR that closed this issue (#${prNumber}) **failed post-merge validation** — see run ${context.runId}. Keeping this visible until the failure is resolved; the issue is not considered done.`,
                });
              } else {
                core.warning('verdict failed but no linked issue was parsed — issue flag skipped');
              }
            }
      - name: Fail the check
        if: steps.tests.outcome == 'failure'
        run: exit 1
