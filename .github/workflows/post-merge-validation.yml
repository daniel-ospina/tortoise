# Post-merge validation (#559)
#
# Closes the "done means merged, not verified" gap: every PR merged into main
# runs the test suite against the merged head and posts the result on the PR.
# On FAIL it also flags the linked issue (parsed from "Closes #N" in the PR
# body) so an issue can never be silently 'done' while its change is red.
#
# Warn-only by design (mirrors post-deploy-verify): it detects problems and
# makes them visible; it does not roll back. The issue stays open until the
# failure is resolved and re-validated.
#
# Note: runs the embedded-FalkorDBLite suite. Tests needing a live FalkorDB
# self-skip via _skip_if_no_falkor. A per-test timeout turns any hang into a
# fast, visible failure instead of a 6h CI budget burn.

name: Post-merge validation

on:
  pull_request:
    types: [closed]

concurrency:
  group: postmerge-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -e '.[embeddings]' falkordblite pytest pytest-timeout 2>&1 | tail -2
      - name: Run tests (embedded suite, per-test timeout)
        id: tests
        run: |
          # 90s per-test: embedded redislite EP tests take ~25-40s locally and
          # slower on CI runners. Still a hang detector — just not a speed gate.
          python -m pytest tests/ -q --timeout=90 2>&1 | tail -25
          # pytest exits nonzero on failure — capture for the comment step
          exit $?
      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const passed = steps.tests.outcome === 'success';
            const body = passed
              ? `✅ **Post-merge validation PASSED** — merge ${pr.merge_commit_sha.slice(0, 8)} verified on main.`
              : `❌ **Post-merge validation FAILED** — the merged change broke the test suite (see run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). The linked issue must NOT be considered done until this is resolved.`;
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
            if (!passed) {
              // Flag the linked issue ("Closes #N" / "Fixes #N" in the body)
              const m = (pr.body || '').match(/(?:closes|fixes|resolves)\s+#(\d+)/i);
              if (m) {
                await github.rest.issues.createComment({
                  issue_number: parseInt(m[1], 10),
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `⚠️ The PR that closed this issue (#${pr.number}) **failed post-merge validation** — see run ${context.runId}. Keeping this visible until the failure is resolved; the issue is not considered done.`,
                });
              }
            }
      - name: Fail the check
        if: steps.tests.outcome == 'failure'
        run: exit 1
