# closes-coherence — a `Closes #N` on a NON-default base is INERT (#10597), and a `Closes #N` that
# claims only SOME of the issue's own rows still closes the whole issue (#13946)
#
# GitHub fires a closing keyword only on a merge into the DEFAULT branch, so a
# stacked PR's `Closes #N` closes nothing and lands nothing while the PR reads
# MERGED and CI is green. Measured: #10568 (base `act-10465`, `Closes #10541`)
# merged with a merge commit that is not an ancestor of main, and #10541 is
# still open — the work only lands when #10519 merges, and #10519 carries no
# `Closes #10541`. A one-line warning on the stacked PR while it is still open
# is the whole instrument (#10597: "Not a new gate"); stacking is legitimate, so
# this job WARNS and never refuses.
#
# ⚠️ WHY THIS IS ITS OWN WORKFLOW rather than a step in `drift-guard.yml`, where
# the instrument was first mounted: `drift-guard.yml` is `disabled_manually`
# (measured 2026-11-03 — `gh api
# repos/<owner>/<repo>/actions/workflows/drift-guard.yml` reports
# `state=disabled_manually`, `updated_at=2026-10-29T02:33:12Z`, and the last run
# for the workflow is `cancelled` from 2026-10-29T02:28Z, while dozens of
# `pull_request` events have fired since). A step on a disabled workflow never
# executes, so the instrument was inert while the PR was green — the exact
# failure #10597 exists to remove (#10634 review P1). Re-enabling drift-guard is
# its own reviewed decision (it restores an unrelated merge-path gate, and
# `finding-provenance` was disabled in the same window); mounting an advisory
# step on a workflow that RUNS is not. A newly added workflow is `active` on
# creation, which is why the step lives here and not there.
# The pin that keeps a future re-mount off a disabled host is
# `tests/test_runner_tool_contract.py::test_an_advisory_mount_is_not_on_a_disabled_workflow`.
name: closes-coherence
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The step reads the PR body and the PRs opened against its base branch.
  # Read-only, and it never writes (no comments, no labels, no closures).
  pull-requests: read
  # #13946: the second step reads the CLOSED ISSUE's own body and comments (its row
  # headings, its `## Satisfies` tick state), which is the `issues` resource, not
  # `pull-requests`. Read-only for the same reason.
  issues: read

concurrency:
  group: closes-coherence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closes-coherence:
    # PINNED TO THE FLEET'S x64 POOL (owner decision 2026-11-18): these housekeeping
    # jobs were queueing on the hosted pool while 18 self-hosted runners sat idle (21 online,
    # 3 busy — the measured figures; the date and the runs are on the decision comment).
    # `runs-on` is AND semantics, so `[self-hosted, self-hosted-x64]` selects every x64
    # runner and no ARM64 VM (ci.yml:1611 states the same spelling for the same reason).
    # The #9018 tool contract below is what makes this safe ON a pool runner: `ensure gh`
    # fails CLOSED, so a box without `gh` reds this leg instead of silently skipping the
    # measurement (`tests/test_runner_tool_contract.py`).
    runs-on: [self-hosted, self-hosted-x64]
    # The tool bounds its own `gh` calls (60s each, 300s per run) so the run
    # cannot outlive this cap; 10m is the runner-stall floor the rest of the tree
    # uses (docs/ops/ci-wall-clock.md), not a measured wall clock — this job
    # spends its time in a handful of read-only API calls.
    timeout-minutes: 10
    steps:
      # The PR HEAD, not the synthetic merge ref: the tool reads the PR body
      # through `gh` and the tool itself from this checkout, and the head is what
      # the body describes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The #9018 contract step: the advisory step below reaches `gh` for EVERY
      # measurement. `ensure gh` fails CLOSED, so on a pool runner without it THIS
      # step reds the job (it has no `continue-on-error`), before the advisory
      # step could report UNMEASURED — which is why the contract step is required
      # here rather than optional.
      - name: Ensure gh
        run: bash .github/scripts/runner-tools.sh ensure gh
      - name: Closes-coherence (warn only)
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `set +e` because GitHub runs `bash -e` by default: without it the
          # tool's rc=3 (inert found) aborts the script BEFORE `rc=$?`, which
          # made the UNMEASURED arm below dead code. The whole point of this
          # step is to read the code, so the read has to happen.
          set +e
          python3 tools/closes_landing.py --pr "$PR_NUMBER" --annotate \
            --repo "${{ github.repository }}"
          rc=$?
          set -e
          # ANY code the tool did not define (0 = nothing inert, 3 = inert or
          # unresolved) is UNMEASURED, not a pass: a traceback (rc=1) used to
          # print nothing and go green, indistinguishable from "no inert
          # closing refs". `rc` is named so 2 and 1 stay distinguishable.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::warning title=Closes-coherence UNMEASURED::rc=$rc — the closing-keyword check did not complete see the step log; this is NOT a pass"
          fi
          # The warnings above ARE the artifact; the step is deliberately green.
          exit 0
      # ⛔ #13946: A ROW-SCOPED `Closes` STILL CLOSES THE WHOLE ISSUE, AND NOTHING READ THE QUALIFIER.
      #
      # Measured 2026-11-20: PR #13886 opened with `Closes #13036 (row V2 only).` and GitHub closed
      # the six-row capstone one second after the squash-merge (`bd020ff45b`, `closedAt
      # 06:36:50Z`) with five rows never measured and the evidence document the issue requires
      # absent from `origin/main`. It was reopened by hand. GitHub's closing grammar has no notion of
      # partial scope, so the fix is a reader — `tools/issue_process_lint.py --arm pr-partial-close`
      # compares the rows the PR CLAIMS against the rows the ISSUE declares (or its `## Satisfies`
      # tick state), and names the ones that would be closed unmeasured.
      #
      # ⚠️ WARN-ONLY, ON THIS WORKFLOW, FOR THE REASONS STATED ABOVE FOR THE OTHER STEP: a `Closes`
      # with a qualifier is the author's judgement (`#10597`: "Not a new gate"), and a step mounted on
      # the `disabled_manually` `drift-guard.yml` would be inert while the PR read green.
      # ⛔ `--arm pr-partial-close` AND NOT THE DEFAULT: the default runs BOTH PR-side arms, and
      # arm 1's measured false-positive population (36 % of live open PRs) is exactly why it was never
      # put on an every-PR surface. Mounting the default here would publish arm 1 too.
      #
      # ⛔ WHEN THE ISSUE DECLARES NOTHING THIS ARM CAN READ, IT SAYS SO IN A COUNT AND IS NOT A PASS.
      # At this head 0 of the 30 newest open issues carry a `## Satisfies` checklist and 1 declares ≥2
      # row headings, so `UNANSWERABLE` is the dominant outcome — the `::notice` line carries that
      # number precisely so a green step is never read as "every close was checked and correct".
      - name: Partial-close scope (warn only)
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `set +e` for the same reason as the step above: GitHub runs `bash -e`, so without it the
          # tool's rc=3 (a finding) aborts the script before `rc=$?` and the UNMEASURED arm below
          # becomes dead code.
          set +e
          python3 tools/issue_process_lint.py --pr "$PR_NUMBER" --arm pr-partial-close \
            --annotate --repo "${{ github.repository }}"
          rc=$?
          set -e
          # ANY code the tool did not define (0 = nothing flagged, 3 = findings) is UNMEASURED, not a
          # pass: a traceback (rc=1) used to print nothing and go green, indistinguishable from "no
          # partial close found". `rc` is named so 2 and 1 stay distinguishable.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::warning title=Partial-close scope UNMEASURED::rc=$rc — the closing-scope check did not complete see the step log; this is NOT a pass"
          fi
          # The warnings above ARE the artifact; the step is deliberately green.
          exit 0
