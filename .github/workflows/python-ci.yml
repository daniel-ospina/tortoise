name: Python CI

# Pre-merge Python test gate (#746).
#
# Replaces the previous broken symlink (`.github/workflows/python-ci.yml` →
# `agent-infra/templates/.github/workflows/python-ci.yml`), which resolved to
# a path that does NOT exist in this checkout. GitHub silently ignored the
# invalid symlink, so NO pre-merge Python suite ran — the full suite only
# ran post-merge, warn-only (post-merge-validation.yml). That is why the P0
# membership-status bug (#740) would have merged green.
#
# Self-contained on purpose (fix #555): no reusable-workflow call and no
# `scripts/`/`agent-infra` symlinks — both resolve to paths that are broken
# on the runner.
#
# Runs the full embedded-FalkorDBLite suite (tests needing a live FalkorDB
# self-skip via _skip_if_no_falkor).
#
# #798 — why the suite now ALWAYS ends with output (it used to die silently):
#   The full suite takes ~45-55 min on a GitHub runner but the job had
#   timeout-minutes: 30, so the runner killed pytest mid-suite at ~64%
#   with NO pass/fail summary (0 green runs in ~200). Fix, five parts:
#
#   1. SPLIT into two parallel jobs so the pre-merge gate fits its budget:
#      - `test`      — everything except the known-slow files
#                      (config/ci-surfaces.yml `slow_files:` — see #1371)
#                      (primary gate, watchdog-bounded at 30 min of pytest
#                      time).
#      - `test-slow` — the slow files alone. They legitimately need a
#                      longer per-test budget (e.g. test_control_plane has
#                      a ~90s setup, test_hosted_api is 100+ slow tests),
#                      and they don't belong in the fast gate.
#      The first 12 entries come from the #647 sweep (2026-08-08),
#      re-measured on a clean machine 2026-08-09: test_github_connect /
#      test_ep_selector / test_hosted_auth / test_extractor_doc /
#      test_invites / etc. were machine-degradation artifacts (657+ leaked
#      redislite servers, #176) and stay in the fast job.
#      The last 6 (test_projection / test_search_engine_gaps / test_billing
#      / test_source_inheritance_own / test_sdk / test_cli_context) were
#      added after the first fix iteration: the fast job still exceeded its
#      40-min cap (cancelled at 38.6 min of pytest time, no output — the
#      #798 death mode again). They are the largest remaining files by
#      size/test-count (proxy for runtime; ~20% of fast-suite bytes).
#      First post-fix CI run confirmed the split + fail-fast: the job
#      stopped at 20 failures with a printed summary in 42s.
#
#   0. ENV-BROKEN FILES are excluded from the fast job (they cannot pass
#      in THIS job and would pollute every summary with noise; both are
#      tracked in #647):
#      - tests/e2e/           — browser tests; covered by the
#                               welcome-e2e-monitor workflow + ci.yml's
#                               legal-e2e job, which run
#                               `playwright install --with-deps chromium`.
#                               Without browsers they only ever ERROR here.
#      - tests/test_agent_signup.py — control-plane suite requiring a live
#                               redis on 6379, which this job (and every
#                               CI surface) lacks; adding a redis service
#                               risks port collisions with the embedded
#                               FalkorDBLite suite (default port 6379).
#
#   2. IN-STEP WATCHDOG (the part that makes the summary GUARANTEED):
#      pytest runs under `timeout -s INT -k 10 46m` INSIDE the step. A
#      runner-level timeout-minutes kill cancels the step and loses
#      everything (proven twice: the 30-min death and the 40-min death),
#      but a shell-level `timeout` kill lets the script CONTINUE: after
#      the kill (SIGINT, then SIGKILL 10s later if pytest is stuck inside
#      a test — pytest ignores INT mid-test), the step re-prints the log
#      tail, prints pass/fail counts and the real exit code, and exits.
#      The job can never end silently again: worst case it ends red with
#      "WATCHDOG: killed after 46m — N passed, M failed, last tests above".
#
#   3. Per-test --timeout=300 (was 90): turns any hang into a visible
#      failure without false-killing legitimately slow tests (the old
#      --timeout=90 could kill e.g. test_control_plane's ~90s setup).
#
#   4. --maxfail=20: on a failing run, stop early with the summary
#      already printed — red arrives faster, still actionable.
#
# Note on the remaining red: pre-existing real failures (verified locally
# on origin/main: tests/test_claim_lifecycle.py SDK-API drift, one
# tests/test_bridge_mcp.py assertion) are NOT fixed here — they belong to
# #647. The fast job now surfaces them in a clean summary instead of
# dying silently.
#
# Remaining known failures are tracked in #647 (5 real + slow files). The
# slow files are isolated in `test-slow`, so `test` can go green while the
# slow-file failures are fixed separately.

on:
  push:
    branches: [main]
  pull_request:

# #1008/#1021: the `changes` job runs the tiered selector
# (tools/ci_selection.py) — always runs, always emits the audit artifact.
# PRs run tier 1 (curated smoke) + matched-surface tests; push runs the
# full matrix. The REQUIRED check is `python-ci-gate` (branch protection AND
# the merge queue's only `merge_condition`), and it aggregates every test shard
# it stands for — including `test`, `test-slow` and `test-carve-out`. #5219: for
# as long as those three were absent from its `needs:`, the required check
# reported SUCCESS on trees whose primary suite had FAILED. Job id
# `python-ci-gate` is load-bearing: do NOT rename it or add a `name:` field.
# welcome-e2e
# (#801 live-signup monitor) lives in its own scheduled workflow.
# #2147/#2148 (2026-09-02-ci-audit F1/F2): the formerly-unconditional
# test-slow + test-carve-out legs are diff-gated on the selector's
# slow_run / carve_out_run / slow_selected outputs — docs/website-only
# PRs skip both; tier-2 PRs run only their surface's slow files. NOTE:
# config/* falls through to the core surface, so config-only PRs (the
# manifest edits) run both legs — conservative and correct.
# trunk (push) + unknown/shared-module PRs keep the full runs.
# #4367: the nightly schedule was removed — push-to-main is now the ONLY
# full-matrix trigger (tests run when the functionality they cover changes,
# not on a timer). The selector still accepts --event schedule for any
# future caller; nothing in this workflow emits that event.

concurrency:
  # Per-PR cancel only: on `pull_request` github.ref is refs/pull/N/merge so
  # a new commit cancels that PR's stale run (desired). On `push` to main the
  # ref is shared by ALL pushes — cancel-in-progress there would kill the
  # in-flight full suite every time another PR merges, so main runs must not
  # cancel each other (they queue via the shared group instead).
  group: python-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # conftest.py sets a static pepper via setdefault, but pin it here
  # so the requirement is explicit and the same across surfaces.
  TORTOISE_SECRET_PEPPER: test-static-pepper
  # #1371: opt-in fast interpreter-exit close for ephemeral embedded test
  # servers (tortoise/embedded_lifecycle.py) — kills the ~10-15 min atexit
  # teardown tail that pushed the fast gate to its watchdog ceiling.
  # conftest also sets it via setdefault (covers local + post-merge runs).
  TORTOISE_FAST_ATEXIT: "1"
  # Known-slow files (test time > ~60s each, measured on a clean machine
  # 2026-08-09 against origin/main; last 6 added by size/test-count proxy
  # after the 40-min fast-job death, see header; test_ep_sources +
  # test_sdk_group3 added 2026-08-10 by measured duration — ep_sources 140s
  # EP compute, sdk_group3 ~120-220s redislite teardown, both > 60s bar, #880).
  # #1266 (2026-08-18): 8 more moved by measured duration — the ingest/index
  # epic suites (test_index_directory 329s, test_ingest_bundle 231s, test_ingest_mode
  # 152s, test_index_cli 139s, test_ingest_validation 84s, test_flip_gate 77s) from
  # half (a) plus test_projection_lifecycle 121s + test_reaper 156s from half (b) —
  # halves rebalanced a=87/b=86; half (a) was 33:19 > 30m cap. Gate now fails
  # closed on slow-leak/unclassified/dead/imbalanced halves (see ci_selection.py).
  # Excluded from the `test` job and run in parallel in `test-slow`
  # (#798, tracked slow files: #647). #1371: the SLOW_FILES env var is gone —
  # the single source of truth is config/ci-surfaces.yml `slow_files:`;
  # #1471: test-slow's legs are committed duration-balanced lists, pinned to
  # that config by a fail-closed drift guard (union check). The push matrix
  # and env-broken exclusions are derived by the selector (#1472).
  # Env-broken in this job (tests/e2e needs browsers; test_agent_signup needs
  # a live redis on 6379) — single source is tools/ci_selection.py.

jobs:
  changes:
    # #1008/#1021: selection job — always runs, always emits the artifact.
    # Runs the tiered selector (tools/ci_selection.py): tier 1 smoke always;
    # matched surfaces on code PRs; full on push/shared/unknown.
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      full: ${{ steps.select.outputs.full }}
      surfaces: ${{ steps.select.outputs.surfaces }}
      test_files: ${{ steps.select.outputs.test_files }}
      slow_files: ${{ steps.select.outputs.slow_files }}
      # #2147/#2148 (2026-09-02-ci-audit F1/F2): the diff-gate contract for
      # the two formerly-unconditional legs — slow_run (test-slow runs),
      # carve_out_run (test-carve-out runs), slow_selected (space-joined
      # surface-matched slow leg set; full selections carry the whole set).
      slow_run: ${{ steps.select.outputs.slow_run }}
      carve_out_run: ${{ steps.select.outputs.carve_out_run }}
      slow_selected: ${{ steps.select.outputs.slow_selected }}
      matrix_a: ${{ steps.push-matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.push-matrix.outputs.matrix_b }}
      carve_out: ${{ steps.push-matrix.outputs.carve_out }}
      a_files: ${{ steps.split.outputs.a_files }}
      b_files: ${{ steps.split.outputs.b_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tiered selection
        id: select
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SEL=$(python3 tools/ci_selection.py --event "${{ github.event_name }}")
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            [ -n "$BASE" ] || BASE="origin/main"
            # #3442: ONE canonical question — the merge-base diff — asked of a
            # base commit we have PROVEN is present. The old construction took
            # this diff behind a silenced error and fell back to a two-ref diff
            # of `$BASE` directly. That fallback is a DIFFERENT question — it
            # folds in the base branch's own advances (and, with no merge base,
            # an unrelated history) — so the SAME head could select DIFFERENT
            # tests, and a swallowed failure left the changed set empty, which
            # `select()` maps to the tier-1 smoke set (full=false,
            # slow_run=false, carve_out_run=false): a SILENTLY STRIPPED suite
            # that still reports green. Both holes are closed by failing LOUDLY
            # here instead of selecting on a diff we could not compute.
            if ! git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
              echo "::error::base commit '$BASE' is not present in the checkout — refusing to select on a diff that cannot be computed (#3442)"
              exit 1
            fi
            CHANGED=$(git diff --no-renames --name-only "$BASE...HEAD")
            if [ -z "$CHANGED" ]; then
              echo "::error::'$BASE...HEAD' produced an EMPTY changed set — refusing to certify this head on the tier-1 smoke alone (#3442)"
              exit 1
            fi
            echo "changed files:"
            echo "$CHANGED"
            SEL=$(printf '%s\n' "$CHANGED" | python3 tools/ci_selection.py --changed-files - --event pull_request)
            echo "python=true" >> "$GITHUB_OUTPUT"   # tier-1 smoke runs on every PR
          fi
          echo "selection: $SEL"
          echo "full=$(echo "$SEL" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["full"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "surfaces=$(echo "$SEL" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["surfaces"]))')" >> "$GITHUB_OUTPUT"
          echo "test_files=$(echo "$SEL" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["test_files"]))')" >> "$GITHUB_OUTPUT"
          # #1371: slow files run ONLY in test-slow — single source of truth is
          # config/ci-surfaces.yml (the selector emits them on every path, so
          # this echo is safe for push too).
          echo "slow_files=$(echo "$SEL" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["slow_files"]))')" >> "$GITHUB_OUTPUT"
          # #2147/#2148: the selector emits the diff-gate keys on EVERY path
          # (full selections + tier-2 + docs-only) so these echoes are safe for
          # push too. slow_selected is space-joined BARE names (the
          # test-slow matrix format — no .py suffix) so a leg can case-match it
          # against ${{ matrix.files }} in the tier-2 shape.
          echo "slow_run=$(echo "$SEL" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["slow_run"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "carve_out_run=$(echo "$SEL" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["carve_out_run"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "slow_selected=$(echo "$SEL" | python3 -c 'import json,sys; print(" ".join(x[:-3] if x.endswith(".py") else x for x in json.load(sys.stdin)["slow_selected"]))')" >> "$GITHUB_OUTPUT"
          # #2159 review P2-1: the tier-2 slow legs case-match slow_selected's
          # BARE names against the committed leg rows (matrix.files format),
          # and this tier-2 partial shape had never run in CI when #2148
          # landed — a strip/join format drift (suffix leak, JSON array,
          # newline) would silently empty BOTH legs to a green gate. Fail the
          # changes job (red, not silent-green) if slow_run=true with an
          # empty or non-leg slow_selected.
          python3 - "$SEL" <<'EOF'
          import json, sys, yaml
          sel = json.loads(sys.argv[1])
          if sel["slow_run"]:
              wf = yaml.safe_load(open('.github/workflows/python-ci.yml'))
              legs = set()
              for i in wf['jobs']['test-slow']['strategy']['matrix']['include']:
                  legs.update(i['files'].split())
              entries = {f[:-3] if f.endswith(".py") else f for f in sel["slow_selected"]}
              bad = sorted(entries - legs)
              if bad or not entries:
                  print(f"::error::slow_selected format drift: slow_run=true entries={entries!r} not-in-legs={bad}")
                  sys.exit(1)
          EOF
      - name: Emit push matrix (#1472)
        # #1472: the push halves are DERIVED from config/ci-surfaces.yml by the
        # selector — registration in the manifest is sufficient, no manual
        # matrix edit (the old hardcoded files: lists are gone). Runs on every
        # event (the test job needs the outputs even on tier-2 PRs, where the
        # matrix rows are still evaluated).
        id: push-matrix
        run: |
          MATRIX=$(python3 tools/ci_selection.py --emit-push-matrix)
          # #1472 regression fix: emit SPACE-JOINED STRINGS (the old
          # hardcoded `files: >-` format). fromJSON(...) in the matrix
          # include yields a JS array, which renders as "Array" in the
          # shell `for f in ${{ matrix.files }}` loop (template-context
          # toString) — every full-matrix run collected tests/Array.py.
          echo "matrix_a=$(echo "$MATRIX" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["half_a"]))')" >> "$GITHUB_OUTPUT"
          echo "matrix_b=$(echo "$MATRIX" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["half_b"]))')" >> "$GITHUB_OUTPUT"
          # Epic #1647 Task 9: the embedded carve-out leg (E2E-4) — excluded
          # from both docker halves by the selector.
          echo "carve_out=$(echo "$MATRIX" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["carve_out"]))')" >> "$GITHUB_OUTPUT"
      - name: Tier-2 duration split (#1473)
        # #1473: LPT-pack the tier-2 selected files across halves a/b by
        # measured duration (config/ci-surfaces.yml durations) instead of the
        # duration-blind parity split — a heavy matched surface can no longer
        # dump most of its runtime on one half. Only on PRs with a tier-2
        # selection (full=false); the full-matrix path uses matrix.files.
        # NOTE: reads steps.select.outputs.test_files — the split runs INSIDE
        # the changes job, so `needs.changes` (the job's own output) is
        # ALWAYS empty and would crash --split with empty stdin (#1492).
        id: split
        if: github.event_name == 'pull_request' && steps.select.outputs.full == 'false'
        run: |
          SPLIT=$(echo '${{ steps.select.outputs.test_files }}' | python3 tools/ci_selection.py --split)
          echo "a_files=$(echo "$SPLIT" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["a"]))')" >> "$GITHUB_OUTPUT"
          echo "b_files=$(echo "$SPLIT" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["b"]))')" >> "$GITHUB_OUTPUT"
      # The manifest drift gate used to run HERE. It moved to its own peer job
      # (`manifest-integrity`) — #2656. Living in `changes`, which every other
      # job needs, meant one missing manifest line SKIPPED the entire test
      # matrix and hid all test signal behind a bookkeeping miss: twice on
      # 2026-09-10/11 (#2868 parity files, #2911 price-basis — the second also
      # blocked verification of the #2904 fork fix).
      #
      # The check itself is unchanged and still blocks the merge — it just no
      # longer withholds the tests. python-ci-gate lists `manifest-integrity`
      # in its needs, so a drift still reds the required aggregate check, by
      # name, while the suite runs and reports real signal.
      - name: Secrets scan (evidence artifacts, #1349)
        # Evidence commits (T8/T15/T16) must never carry live keys. The
        # provenance writer redacts (primary defense); this grep is the
        # backstop on every event. Matches key VALUES (sk-or-/sk-ant-/sk-…)
        # and env-var-name-with-assignment (OPENROUTER_API_KEY=…) — NOT the
        # bare env-var name, which legitimately appears in docs/code. Fail
        # on match; <1s.
        run: |
          if grep -rInE '(^|[^A-Za-z0-9])(sk-or-[A-Za-z0-9_-]{16,}|sk-ant-[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,})|OPENROUTER_API_KEY[[:space:]]*[=:][[:space:]]*[A-Za-z0-9_-]{16,}' \
            docs/research/2026-08-17-1349-embedder-selection/ docs/plans/2026-08-17-1349-embedder-selection.md docs/adr/ADR-009-embedder-selection.md docs/scoping/2026-08-17-1349-embedder-selection-scoping.md tests/eval/retrieval/ tests/fixtures/labeled_pairs.jsonl tools/mini_beir/ tools/longmem_eval/ 2>/dev/null; then
            echo "::error::key-like pattern found in committed evidence artifacts (redact before merge)"
            exit 1
          fi
          echo "secrets scan clean"

  manifest-integrity:
    # #2656: the manifest drift gate, as a PEER of the test matrix instead of a
    # prerequisite of it. It used to be a step inside `changes`, and every other
    # job has `needs: changes` — so a drift made GitHub mark the whole matrix
    # "skipped" (not failed: never run), which is why a one-line bookkeeping
    # miss in one lane could stop another lane's fix from being verified.
    #
    # Splitting it out keeps BOTH properties:
    #   * the tests still run, so a red run tells you about the code; and
    #   * a drift still fails loudly and still blocks the merge, because
    #     python-ci-gate (the required aggregate) lists this job in its needs.
    # Cost: one extra job (~20s: checkout + setup-python + pyyaml), against a
    # 25-minute suite that used to be silently withheld.
    #
    # Unconditional on every event (push/PR) — same as before. Needs
    # pyyaml only: tools/ci_selection.py imports it locally.
    #
    # timeout-minutes: this job now owns a network install (`pip install
    # pyyaml`) AND feeds the REQUIRED aggregate check — without a bound, a
    # stalled PyPI would hold python-ci-gate red for hours on every PR.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyyaml
        # Pinned: this job feeds the REQUIRED aggregate check, so an unpinned
        # dependency would make an upstream release a repo-wide merge blocker.
        run: pip install pyyaml==6.0.2
      - name: "Manifest integrity (drift gate, #1262)"
        # Fail-closed, ~2s. rglob (recursive) since #1349 so subdir test files
        # are drift-checked; tests/e2e/ is deliberately exempt
        # (welcome-e2e-monitor + legal-e2e + ENV_BROKEN_FILES cover those 17).
        run: python3 tools/ci_selection.py --integrity

  test:
    # #880: split into two parallel halves (matrix). The fast suite's pytest
    # session is ~28 min but the atexit teardown of ~200 leaked embedded
    # redislite servers adds 15+ min on loaded CI runners (each close has
    # 10s timeouts), pushing the single job past every watchdog we set
    # (32/36/40/46m all hit exactly at the boundary). Two parallel jobs
    # halve per-job server count (atexit ~8 min) and overlap collection —
    # wall time drops to ~max(half) ≈ 22-25 min. Watchdog 45m (raised to 55m when R3 corpus growth pushed legs past 45m)
    # (2026-08-14): on HF-unreachable/loaded runners the half + redislite
    # teardown exceeded 30m (1223 passed then watchdog kill) — 55m fits
    # under test-slow's 75m critical path.
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        half: [a, b]
        include:
          - half: a
            files: ${{ needs.changes.outputs.matrix_a }}
          - half: b
            files: ${{ needs.changes.outputs.matrix_b }}
    name: test (${{ matrix.half }})
    # Outer cap: setup (checkout+install+cache) + manifest collect-only
    # (epic #1647 Task 6 — half b gains a full-list --collect-only step
    # BEFORE pytest, off the watchdog) + watchdog (55m) + SIGINT grace
    # (10s) + tail print. Cap 65m ≈ 55m watchdog + ~5m setup + ~2m
    # collect-only + margin — the 60m cap (55m + 5m setup) would let a
    # loaded runner cancel the job mid-summary once the collect-only step
    # joins the wall (the exact #798 death mode; E2E-5's step-wall
    # measurement — the flip's purpose — must never be lost to a runner
    # kill). Divergence note: the plan's "timeout-minutes: 60, the current
    # spec" predates the collect-only step's wall cost.
    timeout-minutes: 65
    # #1436: provision live FalkorDB so the ~72 live-required tests (test_ep_directional
    # et al.) actually RUN in the fast matrix instead of silently skipping (CI was
    # green while EP tests never ran — masked #1382). Two services cover BOTH probe
    # families: the passworded docker://:falkordb@localhost:6379 URIs and the legacy
    # passwordless docker://:@localhost:16379 URIs (test_search_engine / test_ingest /
    # test_session_capture_e2e / the 16379 candidates in test_hnsw_vector_index and
    # test_integration_search). Mirrors test-concurrency-falkor's service block.
    # NO job-level TORTOISE_DB_URI: the ~600 embedded tests need the redislite default;
    # the live tests' module probes set/restore their own env. ~2-3 min added runtime
    # vs the 55m watchdog. The skip-fail guard step below fails closed if they skip.
    services:
      falkordb:
        image: falkordb/falkordb-server:latest
        env:
          # #2216: no periodic RDB snapshot in this lane. Redis refuses a second
          # fork while any child is active ("Can't fork for module: File exists"
          # - errno EEXIST, Redis' single-fork-slot rule), and FalkorDB's
          # GRAPH.COPY forks via RedisModule_Fork with 10 x 5ms retries - a
          # shorter window than a BGSAVE, so a restore/drill test landing inside
          # one fails with "GRAPH.COPY failed, could not fork" (main run
          # 34527934725, test (a): the only failure of 4905). Reproduced locally
          # 3/3 with the default config and 0/3 with this flag. Automatic
          # snapshots are worthless in a throwaway test container, and explicit
          # BGSAVE still works, so the RDB/snapshot tests are unaffected.
          # (docker-compose.yml spells the same flag --save \"\" for its
          # persistent dev container; both spellings are verified equivalent
          # under run.sh's unquoted ${REDIS_ARGS} expansion.)
          REDIS_ARGS: "--requirepass falkordb --save ''"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a falkordb ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      falkordb-legacy:
        image: falkordb/falkordb-server:latest
        env:
          # #2216: same no-periodic-snapshot rule as the passworded falkordb
          # service above (see there for the mechanism + the reproduced
          # evidence). Deliberately NO --requirepass: this is the passwordless
          # probe lane (tests use docker://:@localhost:16379/) and its
          # health-cmd is plain `redis-cli ping`.
          REDIS_ARGS: "--save ''"
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # #964: "no job activity" has two distinct causes, neither of which is a
    # missing timeout (timeouts have existed since #798/#880): (1) pytest
    # output is buffered to /tmp/pytest.log so the job log shows NOTHING for
    # 25-50 min — the heartbeat in the run step below now surfaces liveness;
    # (2) a "pending" run is the GitHub runner QUEUE (main runs serialize via
    # the concurrency group; a backlog of merges queues them) — queue wait is
    # not a job hang and cannot be fixed in-repo.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires-python >= 3.12
      - uses: actions/setup-node@v4
        # #4620: the two installed-artifact checks in
        # tests/test_pi_capture_hooks.py FAIL (rather than skip) when node is
        # absent or below the default-on type-stripping floor (22.18), so this
        # lane owns the toolchain they require instead of inheriting it from the
        # runner image — same ruling as the embedder step below and the existing
        # setup-node pin in ci.yml (whose comment records the two floors:
        # `.ts` type stripping + syntax detection is DEFAULT-ON from 22.18, and
        # this suite's `node --test` passes no `--experimental-strip-types` flag).
        with:
          node-version: '22'
      - name: Install package + test extras
        # embeddings extra required at COLLECTION time: test_gmm_proofs.py,
        # test_embeddings.py, test_cross_lens.py, test_sdk_group3.py import
        # sklearn at module scope (post-merge-validation.yml installs
        # '.[embeddings]' for the same reason).
        # uv: test_battery_corpus.py::test_builder_determinism_cross_process
        # shells out to bare `uv run` (default groups = dev included) to build
        # the corpus in subprocesses with different PYTHONHASHSEED — the runner
        # has no uv by default. Pre-warm the FULL uv project env (uv sync
        # --frozen, dev group included) so the test's `uv run` is a genuine
        # no-op instead of a cold 1-3 min sync inside its 300s subprocess
        # timeout. (--no-dev here would mismatch the bare `uv run` consumer and
        # force a dev-group re-sync in the subprocess.)
        run: |
          pip install -e '.[test,embeddings]' uv
          # #1917 (CI unblock): some ubuntu-latest runner images ship a stale
          # workspace .venv that uv refuses to touch (uv #13986 / #9423 —
          # "failed to create directory .venv: File exists"), failing every
          # PR's fast-test legs at setup. Remove it so uv sync recreates the
          # pre-warmed env (same result, tolerant of the stale dir).
          rm -rf .venv
          uv sync --frozen
      - name: Clean stale redislite orphans (issue #1005 tempdir pollution)
        # Leaky shared runners accumulate redislite tempdirs from every
        # failed embedded-redis run — discover() then skips its stale-socket
        # walk (>5000 entries), so the reaper chaos tests fail with
        # "orphan not cleaned". Reap strays before the suite. Best-effort.
        run: |
          pkill -f "redis-server unixsocket" || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        # ~130MB; persisted so the pre-cache step below is a no-op on
        # subsequent runs and CI never re-downloads from huggingface.co.
        # Cache key v2 (#1349 T10): the v1 cache holds all-MiniLM-L6-v2 and
        # must never serve bge-small runs — a v1 restore would silently
        # exercise the WRONG embedder.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Embedding model REQUIRED (BAAI/bge-small-en-v1.5) — dense retrieval leg
        # #2573: this step OWNS "the embedder is required". It exits non-zero when
        # the pinned model cannot be obtained, with a named ::warning::/::error::
        # annotation and a step-summary block — so a runner without the dense leg
        # fails HERE, by name, instead of silently running the keyword-only TF-IDF
        # fallback (tortoise/embeddings.py) and reporting a green pass.
        #
        # `continue-on-error: true` was deliberately REMOVED. That is safe because
        # the step is now genuinely able to obtain the model: the old inline probe
        # set HF_HUB_OFFLINE=1 before importing sentence_transformers, and
        # huggingface_hub freezes that variable at import, so its download retries
        # could never reach the network. With the probe scoped to
        # `local_files_only=True` a cold cache really does download (verified
        # end-to-end), so a failure here now means the model is genuinely
        # unobtainable — and the honest outcome is a red, ATTRIBUTED run rather
        # than the cascade #3760's fail-closed skip-guard would otherwise produce.
        #
        # #964: the step-level timeout still bounds a hung download (stalled TCP,
        # no error raised) that would otherwise stall the step for the full job cap.
        timeout-minutes: 6
        run: |
          python3 tools/embedder_provision.py --attempts 3 --backoff 5
      - name: Compute docker URI (epic #1647 Task 9 — P3 flip)
        # D-3=A (the P2 flip) + Task 9 Step 1 (the P3 flip): BOTH fast
        # halves run on the provisioned passworded falkordb service (above)
        # via a job-level TORTOISE_DB_URI; the embedded lane is retired from
        # the main test job (the carve-out files moved to the dedicated
        # URI-unset carve-out job — E2E-4). The matrix include cannot
        # condition on `full` (plan-review P1-7), so the URI is computed
        # run-step-local: full==true -> URI + EXPECT_URI on BOTH halves (the
        # E2E-6 tripwire signal, cycle-6 P1-2/FM-3); every other shape
        # (tier-2 PR) -> empty both, so the tripwire never fires on the
        # tier-2 shape. The URI carries a test-prefixed path (cycle-2 P1-2):
        # a path-less job URI would resolve the URI-default graph `tortoise`
        # and every URI-default DETACH DELETE would trip _assert_test_graph
        # — /tortoise_test_matrix is guard-passing.
        run: |
          URI=""
          EXPECT_URI=""
          CARVE_OUT=""
          SWEEP_TEAM_STRAYS=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            URI="docker://:falkordb@localhost:6379/tortoise_test_matrix"
            EXPECT_URI="1"
            # #1886 (issue #1884): the docker lane is a DEDICATED fresh-per-
            # job container — the journal-blind team_* stray pass is safe
            # here and stays live (opt-in only since #1884; the shared dev
            # container never sets this).
            SWEEP_TEAM_STRAYS="1"
          else
            # Tier-2 URI-less embedded shape (epic #1647 Task 10, P1-9): the
            # P4 enforcement fails URI-less runs unless CARVE_OUT=1 — tier-2
            # PR legs run the selected surface files embedded BY DESIGN (the
            # plan keeps them off the redirect), so they opt in.
            CARVE_OUT="1"
          fi
          echo "URI=$URI" >> "$GITHUB_ENV"
          echo "EXPECT_URI=$EXPECT_URI" >> "$GITHUB_ENV"
          echo "CARVE_OUT=$CARVE_OUT" >> "$GITHUB_ENV"
          echo "SWEEP_TEAM_STRAYS=$SWEEP_TEAM_STRAYS" >> "$GITHUB_ENV"
      - name: Generate coverage manifest (expected nodeids, epic #1647 Task 6/9)
        # Cycle-2 P2-12: the collect-only runs in its OWN step (off the
        # pytest step's 55m watchdog budget — the collect-only wall can
        # never ride the run). The manifest keys off the SAME space-joined
        # $FILES the run step builds (identical construction below) x the
        # same `-m 'not track_b and not live and not integration'` filter
        # (plan-review P1-7: never a re-derived matrix list; `integration` is
        # the opt-in live half's marker, #4750), so the expected set is
        # exactly what pytest will run; the skip-guard step reconciles it
        # against the junitxml (Task 3) — a vanished nodeid (deselected, file
        # dropped from $FILES, vacuous early-return) reds instead of green.
        # Task 9 Step 1 (P3): the manifest now covers BOTH halves (the P2
        # `if: matrix.half == 'b'` gate is gone — both halves are docker).
        run: |
          FILES=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          else
            if [ "${{ matrix.half }}" = "a" ]; then FILES="${{ needs.changes.outputs.a_files }}"; else FILES="${{ needs.changes.outputs.b_files }}"; fi
          fi
          if [ -z "$FILES" ]; then
            echo "no selected files for this half — no manifest (guard skips)"
            exit 0
          fi
          # Reuse contract: the skip-guard step's empty-file check reads this.
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "not track_b and not live and not integration" --output /tmp/expected-nodeids.txt
      - name: Canary producer (epic #1647 Task 9 Step 6, half b, post-merge)
        # The D-3=A instrumented streak's producer half: the fast-matrix job
        # runs PER-LEG, so exactly ONE leg must write the producer marker or
        # last-writer-wins clobbers (cycle-5 P1-7 option (b)). Gated on
        # half==b AND the post-merge trigger (push — PR runs never mutate the
        # canary artifact). The marker rides the artifact upload (below) and
        # is consumed by the canary-streak job (needs: [test], artifacts-only
        # — cycle-6 P1-7).
        if: github.event_name == 'push'
        run: |
          if [ "${{ matrix.half }}" = "b" ]; then
            python3 - <<'EOF'
          import json, os
          marker = {
              "run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              "half": "b",
              "event": "${{ github.event_name }}",
              "full": "${{ needs.changes.outputs.full }}",
          }
          with open("/tmp/canary-producer.json", "w") as fh:
              json.dump(marker, fh, indent=2)
          print("canary producer: docker half b qualified (post-merge, full="
                + marker["full"] + ")")
          EOF
          else
            echo "canary producer: half a — no producer marker (half b only)"
          fi
      - name: Run fast test suite (slow files run in the test-slow job)
        id: pytest-run
        # #798: in-step watchdog + guaranteed summary tail. pytest gets
        # SIGINT at 55m (SIGKILL 10s later if stuck inside a test — pytest
        # ignores INT mid-test); the step then prints counts + tail + real
        # exit code. The runner's own timeout-minutes is NOT what bounds
        # pytest, so a silent runner cancel is impossible.
        # #964: liveness heartbeat. pytest writes to /tmp/pytest.log (for
        # the guaranteed tail), so the job log shows no output for 25-50
        # min — previously read as "stuck in_progress". The background
        # loop below prints a progress line to the LIVE job log every 5 min
        # so GitHub surfaces activity and stall-vs-progress is visible.
        run: |
          set +e
          # Run only this half's files — collection is halved and each job
          # leaks ~half the embedded servers.
          FILES=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            # full matrix: this half's matrix.files (slow files excluded)
            for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          else
            # #1473 tier 2: selected surface files, LPT duration-balanced
            # across both halves (split computed once in the changes job).
            if [ "${{ matrix.half }}" = "a" ]; then FILES="${{ needs.changes.outputs.a_files }}"; else FILES="${{ needs.changes.outputs.b_files }}"; fi
          fi
          if [ -z "$FILES" ]; then
            echo "no selected files for this half — skipping"
            echo 0 > "${RUNNER_TEMP:-/tmp}/pytest-rc"
            # #4740: pytest never runs here, so the conftest session-end sweep
            # never writes its report. Write an explicit, honest one instead of
            # leaving the gate to parse a missing report (which must stay RED
            # for a real no-report run).
            printf '{"sweep":{"skipped":"no-pytest"}}' > "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
            exit 0
          fi
          # Epic #1647 Task 6 (plan-review P1-7): emit the run's own file
          # list for the coverage-manifest machinery (the manifest step
          # writes the same file; this write is the authoritative post-hoc
          # record the skip-guard step's empty-file gate reads).
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          # #964 heartbeat: killed when pytest exits (kill+wait below).
          # Counts are rough live liveness signals — the -r fEs summary block
          # re-lists failures, so FAILED may double-count on the last tick;
          # the authoritative numbers are the tail + WATCHDOG banner below.
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' /tmp/pytest.log 2>/dev/null || true)
              f=$(grep -c ' FAILED' /tmp/pytest.log 2>/dev/null || true)
              echo "HEARTBEAT: pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          timeout -s INT -k 10 55m stdbuf -oL python -m pytest $FILES -v --timeout=300 -p no:cacheprovider -m 'not track_b and not live and not integration' --maxfail=20 -r fEs --durations=15 --junitxml=/tmp/junit.xml -o junit_family=xunit1 > /tmp/pytest.log 2>&1
          # #1436: -v truncates skip reasons to terminal width (80 cols when
          # redirected to a file with COLUMNS unset), dropping e.g.
          # test_ep_directional's 81-char nodeid reason entirely — so the guard
          # reads the -r summary, which is never truncated. -r fEs (not "-rfE
          # then -rs"): pytest 9.1.1 replaces the report set when -r flags are
          # repeated, so a trailing -rfE would suppress the skip summary the
          # guard depends on (pinned by
          # tests/test_skip_guard.py::test_workflow_keeps_rs).
          # #1663: emit lossless junitxml (--junitxml + -o junit_family=xunit1)
          # so the coverage manifest (epic #1647 Task 3) can reconcile
          # --collect-only expected nodeids against the junitxml testcases
          # (file/line attributes only exist under junit_family=xunit1). Dormant
          # at P1 — the guard step consumes it at P2 (Task 6, half-b flip).
          # #1371: capture pytest's real exit code IMMEDIATELY (before the
          # heartbeat kill / rc write below) and persist it for the orphan
          # check — the kill-aware logic needs it to distinguish a watchdog
          # kill from a normal exit.
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 300 /tmp/pytest.log
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log || echo "(no FAILED/ERROR nodeids)"
          # #880: 124 = timeout SIGINT kill; 137 = -k 10 SIGKILL after pytest
          # ignored INT mid-test; 2 = pytest's own SIGINT summary — the count
          # banner must print for all three (previously only 124 matched,
          # so the banner never printed on the real kill path).
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' /tmp/pytest.log)
            failed=$(grep -c ' FAILED' /tmp/pytest.log)
            errored=$(grep -c ' ERROR' /tmp/pytest.log)
            echo "==================== WATCHDOG: pytest killed after 55m ($passed passed, $failed failed, $errored errored so far) — last test lines above ===================="
          fi
          echo "==================== pytest exit code: $rc ===================="
          # Epic #1647 Task 6 (cycle-5 P2-5): capture the pytest-step wall
          # ($SECONDS = seconds since THIS step's bash shell started) — the
          # E2E-5 wall-regression signal (job wall alone can hide a step
          # that silently rides the 55m watchdog). Recorded BOTH as the file
          # /tmp/step_wall.txt (the artifact contract the P3 canary
          # classifier consumes — cycle-6 P1-7: artifacts only, never a
          # $GITHUB_OUTPUT across jobs) and as steps.pytest-run.outputs.
          echo "$SECONDS" > /tmp/step_wall.txt
          echo "step_wall=$SECONDS" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          # Deterministic embeddings: the model is pre-cached above; tests
          # must NEVER reach huggingface.co mid-suite (shared runner IPs get
          # 429-rate-limited, stalling embedding loads up to 30s each).
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Epic #1647 Task 6/9: the docker flip. Task 6 flipped half b; Task 9
          # (P3) flips BOTH halves — empty only on tier-2 PRs (full=false) and
          # the carve-out job (which does not run this step). Every reader
          # treats "" as unset (is_db_uri("") is False; the redirect seam is
          # truthy-gated). EXPECT_URI is set IFF URI is set (the same gate, the
          # same branch — pinned by
          # tests/test_ci_selection.py::test_expect_uri_gated_iff_uri).
          TORTOISE_DB_URI: ${{ env.URI }}
          TORTOISE_TEST_EXPECT_URI: ${{ env.EXPECT_URI }}
          # Task 10 (P4): tier-2 URI-less legs opt into the URI-required
          # enforcement (CARVE_OUT=1 when full=false — the tier-2 embedded
          # shape). Full docker legs set URI, so CARVE_OUT is empty there.
          TORTOISE_TEST_CARVE_OUT: ${{ env.CARVE_OUT }}
          # #1987 Task 12 (P2-7/P2-9): the ask-LLM regression module runs in
          # FIXTURE mode (committed recorded-transport transcripts; no keys)
          # on the docker lane — the pre-merge check
          # (scripts/check-ask-premerge.cjs) asserts it passed in fixture
          # mode before the answer-surface merge.
          TORTOISE_ASK_LLM_REGRESSION: "1"
          # #1886: dedicated fresh-per-job docker container — keep the
          # journal-blind team_* stray pass live in CI (opt-in only; the
          # shared dev container never sets it — issue #1884).
          TORTOISE_TEST_SWEEP_TEAM_STRAYS: ${{ env.SWEEP_TEAM_STRAYS }}

      - name: Upload pytest log (measurement artifact, #1477)
        # #1477: non-gating upload so ci-timing.yml can extract per-file
        # durations (--durations=15 section) from the REAL run. if: always() +
        # continue-on-error + if-no-files-found: ignore ⇒ this step can never
        # red the gate (the early-exit path writes no /tmp/pytest.log).
        # Epic #1647 Task 6 (cycle-5 P1-7): ships the FULL artifact set the
        # P3 canary classifier consumes — pytest log + junitxml + expected
        # nodeids + step wall (the half==b tag in the artifact name is the
        # dual-lane canary tag). Task 9: the canary-producer marker rides the
        # same upload (gated to half b + post-merge by the producer step).
        # Missing files (half a has no producer marker / no manifest on the
        # empty path) are ignored per-path by the uploader.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}-${{ matrix.half }}
          path: |
            /tmp/pytest.log
            /tmp/junit.xml
            /tmp/expected-nodeids.txt
            /tmp/step_wall.txt
            /tmp/canary-producer.json
          if-no-files-found: ignore

      - name: "Skip-fail guard: live-FalkorDB tests must run, never skip (#1436)"
        # The falkordb services above make the live-required tests RUN in the
        # fast matrix. If any of them SKIP anyway (probe regression, service
        # outage, a new live test file landing here), this guard flips RED
        # instead of the historical silent-green that masked #1382 for days.
        # Gated on pytest rc==0: the failure mode we guard against is exactly
        # "pytest green + live tests skipped" — a red pytest needs no extra
        # signal. Same semantics as test-concurrency-falkor's inline guard,
        # extracted to a tested tool (tools/skip-guard.py + tests/test_skip_guard.py).
        # Epic #1647 Task 6 (half-b flip) + Task 9 (P3): BOTH halves pass
        # --manifest + --junitxml (the junitxml-reconciled coverage manifest —
        # a vanished nodeid reds, Task 3), gated on rc==0 AND non-empty $FILES
        # (the no-selected-files path writes rc=0 with no junitxml; with a
        # manifest that would false-red). The legacy line matcher remains the
        # fallback only for the empty-files shape.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            if [ -s "${RUNNER_TEMP:-/tmp}/pytest-files" ]; then
              python3 tools/skip-guard.py /tmp/pytest.log --junitxml=/tmp/junit.xml --manifest /tmp/expected-nodeids.txt
            else
              python3 tools/skip-guard.py /tmp/pytest.log
            fi
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi

      - name: Dump redislite-hygiene end-sweep decision (issue #1103)
        # pytest capture swallows the conftest print; the orphan check below
        # needs the sweep decision (other-suites / foreign-pytest flags) to
        # distinguish "real leak" from "deferred sweep false positive".
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== redislite-hygiene end-sweep decision (issue #1103) ==="
            cat "$LOG"
          else
            echo "no hygiene log at $LOG (end-sweep logger did not write)"
          fi

      - name: Assert no redislite orphans (issue #1005 / epic #1647 E2E-7)
        # Runs even when pytest failed — the orphan check is independent of
        # test outcomes. The bound is NOT a hand-picked constant: the conftest
        # session-end sweep reports what it did ({reaped, cleared, left, before})
        # and the gate binds to that report — reading the bound from `left` and
        # asserting the sweep's own accounting identity `reaped + left >= before`
        # (see .github/scripts/orphan-bound.sh, #4740). #2032: the docker lane is
        # not always ~0 by construction — the embedded-file-contract atexit race
        # leaves strays on the full matrix
        # too (trunk run 34928488659 measured 7), and that residue is what the
        # sweep's own `left` now accounts for. What this gate reds: a leak
        # that appears AFTER the sweep (COUNT > left), an accounting-identity
        # violation (reaped + left < before), a probe_failed report above a
        # measured COUNT of zero (no `left` to bind to), an error or skipped
        # report, a no_embedded_servers report above a measured COUNT of zero,
        # and an unaccounted/unreadable report. A `cleared: false` report does
        # NOT red at any measured COUNT: `cleared` reports whether the sweep's
        # TIME BUDGET sufficed — a function of runner load — not its residue
        # (#4989). A `probe_failed` report at a measured COUNT of zero is a
        # warning, not a red: there is no live residue to bound, and the
        # measured COUNT — not `cleared` — decides the verdict. It does NOT
        # independently red a residue the sweep itself
        # measures and declines to act on (a server with a live client, an
        # unconfirmed path-based server): that lands in `left` and passes at
        # COUNT == left, bounded by the sweep's own measurement (#4884).
        # #1371 kill-aware: after a WATCHDOG kill (rc 124/137/2) the
        # orphan count is a GUARANTEED kill-path artifact — SIGKILL skips atexit
        # and the conftest end-sweep — not a leak signal, so the gate downgrades
        # to a warning (the run is already red; a second red adds no signal and
        # blinds the detector on the runs where it would matter). On a normal
        # exit the strict leak gate applies unchanged.
        if: always()
        run: |
          set +e  # pgrep exits 1 on zero matches; pipefail would abort the step
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          # #4740: the count and pgrep's OWN status are read separately. A
          # `${PIPESTATUS[0]}` read after `COUNT=$(pgrep … | wc -l)` reports
          # the LAST pipeline command (`tr`, always 0), never pgrep — so a
          # failed probe would read as a measured 0 and pass. On the bare
          # assignment below `$?` IS pgrep's status: rc 0 = matches, rc 1 = no
          # matches (both real measurements); anything else is a failed probe
          # and must RED, never be read as "measured zero" (issue #1005).
          PIDS=$(pgrep -f "redislite/bin/redis-server")
          prc=$?
          [ "$prc" -le 1 ] || { echo "::error::pgrep failed rc=$prc — the orphan count is unmeasured (issue #1005)"; exit 1; }
          COUNT=$(printf '%s' "$PIDS" | wc -w | tr -d ' ')
          bash .github/scripts/orphan-bound.sh \
            --count "$COUNT" \
            --rc "$RC" \
            --hygiene "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"

  test-slow:
    needs: changes
    # #2148 (2026-09-02-ci-audit F2): diff-gated — the full committed slow
    # list used to run on EVERY PR (docs-only PR #2132 paid 29m43 + 29m08
    # runner-min for a 1-file docs change). Runs when the selector says so:
    # full selections (push to main / unknown-path or
    # shared-module PRs — the trunk backstop, NEVER dropped) or a
    # PR whose matched surfaces own slow-leg files (slow_run). Tier-2 PRs
    # run only their surface's slow files (slow_selected, intersected with
    # each leg's committed list in the manifest/run steps); docs/website/
    # config-only PRs (surfaces == [] -> slow_run == false) skip the whole
    # job — the tier-1 smoke in the `test` job still runs.
    if: needs.changes.outputs.slow_run == 'true'
    runs-on: ubuntu-latest
    # #1471: two parallel duration-balanced legs (matrix), mirroring the `test`
    # job's #880 pattern. Serial pytest was 37:44 (run 32241846147, 2026-08-19)
    # — the true critical path of every main push (last python-ci job to
    # finish). Split measured 2026-08-19 (CI --durations=15 data + header-
    # verified facts + test-count calibration): leg a ≈ 18.5m, leg b ≈ 18.3m
    # of pytest time vs ~38m serial — main-push wall-clock drops to
    # ~max(leg) ≈ 23-24m incl. setup (~40-50% cut). Separate runners = zero
    # hermeticity risk (slow files share no state across processes).
    # Each leg keeps the 75m watchdog + 5-min heartbeat + guaranteed-summary
    # tail (#798/#964); the drift-guard step pins the union of both legs to
    # config/ci-surfaces.yml `slow_files:` MINUS the epic #1647 carve-out
    # (Task 9 Step 5: the 6 slow carve-out files — test_embedded_concurrency,
    # test_flip_gate, test_hosted_backup, test_migrate_db,
    # test_projection_lifecycle, test_reaper — run in the URI-unset carve-out
    # job, never the docker slow legs) — a new slow file can never silently
    # drop out of CI. Epic #1647 Task 9 Step 5 (cycle-6 P2-8): the slow legs
    # flip to DOCKER — job-level URI (full==true only) + junitxml manifest +
    # skip-guard, mirroring the fast job's Task 6 mechanics exactly.
    strategy:
      fail-fast: false
      matrix:
        half: [a, b]
        include:
          - half: a
            files: >-
              test_about_edges test_billing test_control_plane test_dream
              test_ep_sources test_hosted_api
              test_index_cli test_indexes test_ingest_bundle test_ingest_mode
              test_projection test_sdk_group3 test_source_inheritance_own
          - half: b
            files: >-
              eval/retrieval/test_integration test_backfill_sources test_cli_context
              test_enumeration_surfaces test_event_provenance
              test_graphcopy_boolean_index_3154
              test_index_directory test_ingest test_ingest_validation
              test_mcp_http test_mcp_route_challenge test_pack_shipping_wheel
              test_sdk test_search_engine_gaps
    name: test-slow (${{ matrix.half }})
    timeout-minutes: 90
    # Epic #1647 Task 9 Step 5: the slow legs run against the provisioned
    # passworded falkordb service (same block as the fast job — both probe
    # families: 6379 passworded + 16379 passwordless legacy).
    services:
      falkordb:
        image: falkordb/falkordb-server:latest
        env:
          # #2216: no periodic RDB snapshot in this lane. Redis refuses a second
          # fork while any child is active ("Can't fork for module: File exists"
          # - errno EEXIST, Redis' single-fork-slot rule), and FalkorDB's
          # GRAPH.COPY forks via RedisModule_Fork with 10 x 5ms retries - a
          # shorter window than a BGSAVE, so a restore/drill test landing inside
          # one fails with "GRAPH.COPY failed, could not fork" (main run
          # 34527934725, test (a): the only failure of 4905). Reproduced locally
          # 3/3 with the default config and 0/3 with this flag. Automatic
          # snapshots are worthless in a throwaway test container, and explicit
          # BGSAVE still works, so the RDB/snapshot tests are unaffected.
          # (docker-compose.yml spells the same flag --save \"\" for its
          # persistent dev container; both spellings are verified equivalent
          # under run.sh's unquoted ${REDIS_ARGS} expansion.)
          REDIS_ARGS: "--requirepass falkordb --save ''"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a falkordb ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      falkordb-legacy:
        image: falkordb/falkordb-server:latest
        env:
          # #2216: same no-periodic-snapshot rule as the passworded falkordb
          # service above (see there for the mechanism + the reproduced
          # evidence). Deliberately NO --requirepass: this is the passwordless
          # probe lane (tests use docker://:@localhost:16379/) and its
          # health-cmd is plain `redis-cli ping`.
          REDIS_ARGS: "--save ''"
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires-python >= 3.12
      - name: Install package + test extras
        run: pip install -e '.[test,embeddings]' build==1.6.0
        # build pinned (#1929 code-review P2): test_pack_shipping_wheel.py's
        # sdist-rebuild gate uses `python -m build` as its primary builder —
        # the [test] extra does not pull it, and a missing builder would
        # pytest.skip the wheel gate out of CI with a green run.
      - name: Clean stale redislite orphans (issue #1005 tempdir pollution)
        # Leaky shared runners accumulate redislite tempdirs from every
        # failed embedded-redis run — discover() then skips its stale-socket
        # walk (>5000 entries), so the reaper chaos tests fail with
        # "orphan not cleaned". Reap strays before the suite. Best-effort.
        run: |
          pkill -f "redis-server unixsocket" || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        # Cache key v2 (#1349 T10): the v1 cache holds all-MiniLM-L6-v2 and
        # must never serve bge-small runs — a v1 restore would silently
        # exercise the WRONG embedder.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Embedding model REQUIRED (BAAI/bge-small-en-v1.5) — dense retrieval leg
        # #2573: same contract as the fast job — the step OWNS "the embedder is
        # required" and fails BY NAME when the pinned model cannot be obtained,
        # with a ::warning::/::error:: annotation. Without this the slow legs
        # would run the keyword-only TF-IDF fallback and could report green.
        # continue-on-error was deliberately REMOVED — see the fast job's note.
        #
        # #964: the step-level timeout still bounds a hung download (stalled TCP,
        # no error raised) that would otherwise stall the step for the full 90-min
        # job cap; a timeout now FAILS the step, which is the honest outcome.
        timeout-minutes: 10
        run: |
          python3 tools/embedder_provision.py --attempts 5 --backoff 10
      - name: Drift guard — legs cover slow_files minus carve-out (#1471)
        # #1471: the committed leg lists MUST stay the full slow-file set — a
        # new slow file added to config/ci-surfaces.yml `slow_files:` that
        # lands in neither leg silently drops coverage (the #1260/#1270 drift
        # class). Parses the workflow's own matrix include + the config and
        # fails closed. Epic #1647 Task 9 Step 5: the 6 slow carve-out files
        # are excluded from the expected union (they run in the URI-unset
        # carve-out job). Runs in both legs (<1s, yaml proven on the runner —
        # the changes job uses it on every event).
        run: |
          python3 - <<'EOF'
          import yaml
          wf = yaml.safe_load(open('.github/workflows/python-ci.yml'))
          inc = wf['jobs']['test-slow']['strategy']['matrix']['include']
          legs = {i['half']: set(i['files'].split()) for i in inc}
          cfg = {f[:-3] if f.endswith('.py') else f for f in yaml.safe_load(open('config/ci-surfaces.yml'))['slow_files']}
          carve = {f[:-3] if f.endswith('.py') else f for f in yaml.safe_load(open('config/ci-surfaces.yml'))['carve_out']}
          union = set().union(*legs.values())
          expected = cfg - carve  # slow carve-out files run in the carve-out job
          if union != expected:
              print(f"❌ test-slow leg drift: missing={sorted(expected - union)} extra={sorted(union - expected)}")
              raise SystemExit(1)
          print(f"legs cover exactly {len(expected)} slow files (union == slow_files - carve_out)")
          EOF
      - name: Compute docker URI (epic #1647 Task 9 Step 5)
        # Task 9 Step 5: the slow legs flip to docker with the SAME mechanics
        # as the fast job (cycle-6 P2-8): job-level URI (test-prefixed path,
        # full==true only) + EXPECT_URI (the E2E-6 tripwire signal). Tier-2
        # PR legs keep the embedded shape (no URI).
        run: |
          URI=""
          EXPECT_URI=""
          CARVE_OUT=""
          SWEEP_TEAM_STRAYS=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            URI="docker://:falkordb@localhost:6379/tortoise_test_matrix"
            EXPECT_URI="1"
            # #1886 (issue #1884): dedicated fresh-per-job container — the
            # journal-blind team_* stray pass is safe here and stays live
            # (opt-in only since #1884).
            SWEEP_TEAM_STRAYS="1"
          else
            CARVE_OUT="1"  # tier-2 URI-less embedded shape — the P4 opt-in (Task 10)
          fi
          echo "URI=$URI" >> "$GITHUB_ENV"
          echo "EXPECT_URI=$EXPECT_URI" >> "$GITHUB_ENV"
          echo "CARVE_OUT=$CARVE_OUT" >> "$GITHUB_ENV"
          echo "SWEEP_TEAM_STRAYS=$SWEEP_TEAM_STRAYS" >> "$GITHUB_ENV"
      - name: Generate coverage manifest (slow legs — expected nodeids, epic #1647 Task 9)
        # Cycle-6 P2-8 (int-10): the manifest runs in its OWN step BEFORE the
        # pytest step (off the 75m watchdog), using each leg's committed
        # ${{ matrix.files }} x --collect-only
        # -m 'not track_b and not live and not integration' (#4750) (the same
        # construction the run step builds) -> /tmp/expected-nodeids.txt.
        run: |
          FILES=""
          # #2148 tier-2 (slow_run == true, full == false): run only the
          # surface-matched slow files (changes.outputs.slow_selected),
          # intersected with this leg's committed list so the duration-
          # balanced partition holds. Full selections run the whole leg.
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          else
            SLOW_SEL="${{ needs.changes.outputs.slow_selected }}"
            for f in ${{ matrix.files }}; do
              case " $SLOW_SEL " in
                *" $f "*) FILES="$FILES tests/$f.py";;
              esac
            done
          fi
          if [ -z "$FILES" ]; then
            echo "no slow files for this leg — no manifest (guard skips)"
            exit 0
          fi
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "not track_b and not live and not integration" --output /tmp/expected-nodeids.txt
      - name: Run slow test suite — leg ${{ matrix.half }} (known-slow files, #647)
        # Same guaranteed-summary treatment as the fast job (#798).
        # Per-test --timeout=300: these files have tests/setups that
        # legitimately take >90s; 300s still caps any hang.
        # #964: liveness heartbeat — see the fast job's run step. pytest
        # output is buffered to /tmp/pytest.log for the guaranteed tail, so
        # the job log was silent for 30-50 min; the loop below prints
        # progress to the live job log every 5 min.
        run: |
          set +e
          # #1471: this leg's committed duration-balanced file list (measured
          # 2026-08-19, see job header); the drift guard above pins the union
          # of both legs to slow_files minus the epic #1647 carve-out.
          # #2148 tier-2: same construction as the manifest step — surface-
          # matched slow files only (full == false); full runs keep the whole
          # committed leg. The two constructions must stay identical (the
          # manifest's expected nodeids reconcile against this run's junitxml).
          FILES=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          else
            SLOW_SEL="${{ needs.changes.outputs.slow_selected }}"
            for f in ${{ matrix.files }}; do
              case " $SLOW_SEL " in
                *" $f "*) FILES="$FILES tests/$f.py";;
              esac
            done
          fi
          if [ -z "$FILES" ]; then
            echo "no slow files selected — skipping"
            echo 0 > "${RUNNER_TEMP:-/tmp}/pytest-rc"
            # #4740: pytest never runs here, so the conftest sweep never writes
            # its report — write the explicit "no-pytest" one rather than
            # leaving the orphan gate to parse a missing report.
            printf '{"sweep":{"skipped":"no-pytest"}}' > "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
            exit 0
          fi
          # Epic #1647 Task 9 (cycle-6 P2-8): the run's own file list + rc
          # (the skip-guard step's gates) — same reuse contract as the fast
          # job. The manifest step above wrote the same file.
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          # #964 heartbeat: killed when pytest exits (kill+wait below).
          # Counts are rough live liveness signals — the -r fEs summary block
          # re-lists failures, so FAILED may double-count on the last tick;
          # the authoritative numbers are the tail + WATCHDOG banner below.
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' /tmp/pytest.log 2>/dev/null || true)
              f=$(grep -c ' FAILED' /tmp/pytest.log 2>/dev/null || true)
              echo "HEARTBEAT: pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          # Epic #1647 Task 9 (cycle-6 P2-8): junitxml + -o junit_family=xunit1
          # (the authoritative observed-set source, Task 3) and -r fEs (NOT the
          # historical -rfE — pytest 9.1.1 replaces the report set on repeated
          # -r flags, and a trailing -rfE would suppress the skip summary the
          # guard depends on; pinned by
          # tests/test_ci_selection.py::test_test_slow_job_carries_junitxml_manifest_guard).
          timeout -s INT -k 10 75m stdbuf -oL python -m pytest $FILES -v --timeout=300 -p no:cacheprovider -m 'not track_b and not live and not integration' --maxfail=20 -r fEs --durations=15 --junitxml=/tmp/junit.xml -o junit_family=xunit1 > /tmp/pytest.log 2>&1
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 300 /tmp/pytest.log
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log || echo "(no FAILED/ERROR nodeids)"
          # #880: 124 = timeout SIGINT kill; 137 = -k 10 SIGKILL after pytest
          # ignored INT mid-test; 2 = pytest's own SIGINT summary — the count
          # banner must print for all three (previously only 124 matched,
          # so the banner never printed on the real kill path).
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' /tmp/pytest.log)
            failed=$(grep -c ' FAILED' /tmp/pytest.log)
            errored=$(grep -c ' ERROR' /tmp/pytest.log)
            echo "==================== WATCHDOG: pytest killed after 75m ($passed passed, $failed failed, $errored errored so far) — last test lines above ===================="
          fi
          echo "==================== pytest exit code: $rc ===================="
          exit $rc
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Epic #1647 Task 9 Step 5: the slow legs flip to docker (the same
          # gate as the fast job — full==true only; empty on tier-2 PRs).
          # Task 10 (P4): tier-2 URI-less slow legs opt in via CARVE_OUT=1
          # (the URI-required enforcement — P1-9).
          TORTOISE_DB_URI: ${{ env.URI }}
          TORTOISE_TEST_EXPECT_URI: ${{ env.EXPECT_URI }}
          TORTOISE_TEST_CARVE_OUT: ${{ env.CARVE_OUT }}
          # #1886: dedicated fresh-per-job docker container — journal-blind
          # team_* stray pass stays live in CI (opt-in only — issue #1884).
          TORTOISE_TEST_SWEEP_TEAM_STRAYS: ${{ env.SWEEP_TEAM_STRAYS }}

      - name: Skip-fail guard (slow legs, epic #1647 Task 9)
        # Cycle-6 P2-8: the same junitxml-reconciled coverage manifest as the
        # fast job — gated on rc==0 AND non-empty $FILES (the no-selected-files
        # path writes rc=0 with no junitxml; with a manifest that would
        # false-red). A vanished nodeid or a FalkorDB-reasoned skip reds.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            if [ -s "${RUNNER_TEMP:-/tmp}/pytest-files" ]; then
              python3 tools/skip-guard.py /tmp/pytest.log --junitxml=/tmp/junit.xml --manifest /tmp/expected-nodeids.txt
            else
              python3 tools/skip-guard.py /tmp/pytest.log
            fi
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi

      - name: Assert no redislite orphans (issue #1005 / epic #1647 E2E-7)
        # Same gate contract as the fast job's assert (#4740): the bound is read
        # from the conftest session-end sweep's own report
        # (.github/scripts/orphan-bound.sh), never a hand-picked constant. On a
        # docker leg the sweep reports no embedded server was ever running, so
        # the bound is structurally 0; on a tier-2 embedded leg it is the
        # sweep's own `left`. A `cleared: false` report does not red at any
        # measured COUNT: `cleared` reports whether the sweep's TIME BUDGET
        # sufficed — a function of runner load — not its residue (#4989).
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          # #4740: read the count and pgrep's OWN status separately — a
          # `${PIPESTATUS[0]}` after `COUNT=$(pgrep … | wc -l)` is the `tr`
          # status, never pgrep, so a failed probe would read as 0 and pass.
          # `$?` on the bare assignment IS pgrep's status (rc 0/1 are real
          # measurements; anything else must RED). See the fast job's note.
          PIDS=$(pgrep -f "redislite/bin/redis-server")
          prc=$?
          [ "$prc" -le 1 ] || { echo "::error::pgrep failed rc=$prc — the orphan count is unmeasured (issue #1005)"; exit 1; }
          COUNT=$(printf '%s' "$PIDS" | wc -w | tr -d ' ')
          bash .github/scripts/orphan-bound.sh \
            --count "$COUNT" \
            --rc "$RC" \
            --hygiene "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"

      - name: Upload pytest log (measurement artifact, #1477)
        # #1477: non-gating upload — same contract as the fast job's upload.
        # Epic #1647 Task 9 (cycle-6 P2-8): the junitxml + expected nodeids
        # join the artifact set (the manifest's observed-set evidence).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}
          path: |
            /tmp/pytest.log
            /tmp/junit.xml
            /tmp/expected-nodeids.txt
          if-no-files-found: ignore

  test-concurrency-falkor:
    # #942 target 2: prove concurrent-writer atomicity on the REAL FalkorDB
    # sidecar — the durable path the flipped docs now default to. Runs ONLY
    # the two live docker:// tests — never whole files (test_embedded_concurrency.py
    # is also in test-slow, and whole-file runs would start embedded redislite
    # servers against the live 6379 — the #798 collision mode). The skip-fail
    # guard turns a future skip regression RED instead of green: it matches
    # BOTH pytest 8.x output formats (-v progress: "nodeid SKIPPED (reason)";
    # -rs summary: "SKIPPED [N] tests/file.py:line").
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 15
    env:
      TORTOISE_DB_URI: "docker://:falkordb@localhost:6379/tortoise"
    services:
      falkordb:
        image: falkordb/falkordb-server:latest
        env:
          # #2216: no periodic RDB snapshot in this lane. Redis refuses a second
          # fork while any child is active ("Can't fork for module: File exists"
          # - errno EEXIST, Redis' single-fork-slot rule), and FalkorDB's
          # GRAPH.COPY forks via RedisModule_Fork with 10 x 5ms retries - a
          # shorter window than a BGSAVE, so a restore/drill test landing inside
          # one fails with "GRAPH.COPY failed, could not fork" (main run
          # 34527934725, test (a): the only failure of 4905). Reproduced locally
          # 3/3 with the default config and 0/3 with this flag. Automatic
          # snapshots are worthless in a throwaway test container, and explicit
          # BGSAVE still works, so the RDB/snapshot tests are unaffected.
          # (docker-compose.yml spells the same flag --save \"\" for its
          # persistent dev container; both spellings are verified equivalent
          # under run.sh's unquoted ${REDIS_ARGS} expansion.)
          REDIS_ARGS: "--requirepass falkordb --save ''"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a falkordb ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + test extras
        # [test,embeddings] — NOT just [test]: the pre-cache step imports
        # sentence_transformers (embeddings extra), and create_point calls
        # compute_embedding. Matches the sibling jobs exactly.
        run: pip install -e '.[test,embeddings]'
      - name: Clean stale redislite orphans (issue #1005 tempdir pollution)
        # Leaky shared runners accumulate redislite tempdirs from every
        # failed embedded-redis run — discover() then skips its stale-socket
        # walk (>5000 entries), so the reaper chaos tests fail with
        # "orphan not cleaned". Reap strays before the suite. Best-effort.
        run: |
          pkill -f "redis-server unixsocket" || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        # Sibling parity (test/test-slow both cache BEFORE pre-caching) —
        # without the restore step every run downloads ~130MB. Cache key v2
        # (#1349 T10): the v1 cache holds all-MiniLM-L6-v2 and must never
        # serve bge-small runs — a v1 restore would silently exercise the
        # WRONG embedder.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Embedding model REQUIRED (BAAI/bge-small-en-v1.5) — dense retrieval leg
        # #2573: this job runs its live seq guard through compute_embedding via
        # create_point, and — unlike the fast/slow legs — carries NO skip-guard,
        # so a missing model had NO loud signal at all here. This step is it.
        # continue-on-error was deliberately REMOVED — see the fast job's note.
        #
        # #964 (review): same hung-download guard as test/test-slow — this job's
        # 15-min cap makes a stalled download strictly worse (it would burn the
        # whole budget and cancel the run step with NO summary), so the timeout
        # now fails the step outright.
        timeout-minutes: 10
        run: |
          python3 tools/embedder_provision.py --attempts 5 --backoff 10
      - name: Run live concurrency tests (real FalkorDB sidecar)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set +e
          timeout -s INT -k 10 10m stdbuf -oL python -m pytest \
            tests/test_event_store.py::test_seq_is_monotonic_under_concurrency_live_falkor \
            tests/test_embedded_concurrency.py::test_concurrent_writers_live_falkor_no_lost_writes \
            -v -rs --timeout=300 -p no:cacheprovider --maxfail=10 -rfE --durations=15 > /tmp/pytest.log 2>&1
          rc=$?
          echo "==================== pytest summary (tail) ===================="
          tail -n 120 /tmp/pytest.log
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log || echo "(no FAILED/ERROR nodeids)"
          # Skip-fail guard: live tests must RUN here, never skip (vacuity).
          # Matches BOTH pytest output formats (-v progress: "nodeid SKIPPED";
          # -rs summary: "SKIPPED [N] tests/file.py:line").
          if grep -E '(test_seq_is_monotonic_under_concurrency_live_falkor|test_concurrent_writers_live_falkor_no_lost_writes) SKIPPED|SKIPPED \[[0-9]+\] tests/(test_event_store|test_embedded_concurrency)\.py' /tmp/pytest.log; then
            echo "❌ live tests SKIPPED — the job would be green while testing nothing"
            rc=1
          fi
          echo "==================== pytest exit code: $rc ===================="
          exit $rc
      - name: Upload pytest log (measurement artifact, #1477)
        # #1477: non-gating upload — same contract as the fast job's upload.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}
          path: /tmp/pytest.log
          if-no-files-found: ignore
      - name: Validate docker-compose.yml (ports + header edits)
        # T1 Step 6 ships with zero other verification — no workflow validates
        # compose today. ubuntu-latest has docker + the repo checked out.
        run: docker compose config -q && echo "compose config OK"
      - name: Docs-consistency guard (embedded must never be "default" again)
        # #942 T1 enforcement: the flipped onboarding surfaces must not regress.
        # Runs even when the pytest step fails (if: always()) — it is the
        # cheap gate that keeps the flip honest. Scope = the SAME 5 files as
        # T1 Step 9. EXCLUDED by design: docs/plans|epics|migrations (historical
        # records), website/docs.html (hosted sample), graph-scripts/setup.py
        # (legacy installer on a deliberately distinct port).
        if: always()
        run: |
          HITS=$(grep -rn "Embedded (default)\|recommended to start\|multi-node\|16379\|passwordless URI is\|docker://localhost:6379\|docker://:@localhost:6379" README.md docs/quickstart-selfhosted.md docs/infra-runbook.md website/self-hosted.html .env.example || true)
          if [ -n "$HITS" ]; then
            echo "❌ embedded-first/16379 leftovers in flipped onboarding docs:"
            echo "$HITS"
            exit 1
          fi
          echo "docs-consistency guard OK"

  # Whole-registry compile gate for pack manifests (epic #909, R-16).
  # Every pack PR must load the ENTIRE registry (all packs/*/manifest.yaml)
  # with zero validation errors — a broken manifest must fail CI at PR time,
  # not the shared registry at runtime. Runs on every PR (cheap: seconds).
  packs-compile:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires-python >= 3.12
      - name: Install package
        run: pip install -e .
      - name: Whole-registry compile (all packs, zero validation errors)
        run: |
          python - <<'EOF'
          from pathlib import Path
          from tortoise.pack_registry import PackRegistry

          registry = PackRegistry(Path("packs"))
          loaded = registry.load_all()
          if registry.errors:
              for ns, errs in sorted(registry.errors.items()):
                  for err in errs:
                      print(f"ERROR [{ns}]: {err}")
              raise SystemExit(
                  f"packs-compile FAILED: {len(registry.errors)} pack(s) with validation errors"
              )
          print(f"packs-compile OK: {loaded} packs loaded, 0 validation errors")
          EOF

  # #1008 queue health: REQUIRED check (branch protection). Aggregates the
  # SHORT deterministic legs so docs-only PRs (those legs skipped) still report
  # a green check. Fails iff any leg it needs failed OR was cancelled (a runner-
  # killed suite must never pass silently). NOTE: it deliberately does NOT gate
  # on the long legs (`test`, `test-slow`, `test-carve-out`) — see this job's own
  # `needs:` comment for the merge-path rationale and the disclosure that goes
  # with it. Job id is load-bearing: branch protection requires the exact check
  # name `python-ci-gate` — do NOT rename or add a `name:` field.
  # Track B job (epic #902 A8, #1058): runs ONLY the @track_b tests
  # explicitly. MUST-PASS — both Track B sentinels (_TRACK_B_FULL,
  # SENTINEL_A9) have shipped; wired into python-ci-gate's needs. The suite
  # itself is inert in default CI via -m "not track_b" + its skipifs.
  test-track-b:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # Epic #1647 Task 9 Step 5: track-b flips to docker — the track_b tests'
    # db_path SDK constructions redirect to the server lane via the seam.
    # The URI carries the test-prefixed path (P1-2) for consistency.
    env:
      TORTOISE_DB_URI: "docker://:falkordb@localhost:6379/tortoise_test_matrix"
      TORTOISE_TEST_EXPECT_URI: "1"
      # #1886 (issue #1884): dedicated fresh-per-job docker lane — the
      # journal-blind team_* stray pass is safe here and stays live
      # (opt-in only since #1884; the shared dev container never sets it).
      TORTOISE_TEST_SWEEP_TEAM_STRAYS: "1"
    services:
      falkordb:
        image: falkordb/falkordb-server:latest
        env:
          # #2216: no periodic RDB snapshot in this lane. Redis refuses a second
          # fork while any child is active ("Can't fork for module: File exists"
          # - errno EEXIST, Redis' single-fork-slot rule), and FalkorDB's
          # GRAPH.COPY forks via RedisModule_Fork with 10 x 5ms retries - a
          # shorter window than a BGSAVE, so a restore/drill test landing inside
          # one fails with "GRAPH.COPY failed, could not fork" (main run
          # 34527934725, test (a): the only failure of 4905). Reproduced locally
          # 3/3 with the default config and 0/3 with this flag. Automatic
          # snapshots are worthless in a throwaway test container, and explicit
          # BGSAVE still works, so the RDB/snapshot tests are unaffected.
          # (docker-compose.yml spells the same flag --save \"\" for its
          # persistent dev container; both spellings are verified equivalent
          # under run.sh's unquoted ${REDIS_ARGS} expansion.)
          REDIS_ARGS: "--requirepass falkordb --save ''"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a falkordb ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[test]' falkordblite 2>&1 | tail -2
      - name: Generate coverage manifest (track-b, epic #1647 Task 9)
        # The track-b run uses `-m track_b` — the manifest's collect-only
        # MUST use the same marker (never the default 'not track_b'), or the
        # expected set would not match the observed set.
        run: |
          FILES="tests/test_ingest_safety.py"
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "track_b" --output /tmp/expected-nodeids.txt
      - name: Run Track B tests (explicit marker)
        # §7: non-blocking UNTIL the sentinels flip, then MUST-PASS — both
        # Track B sentinels (_TRACK_B_FULL, SENTINEL_A9) have shipped, so
        # this job is must-pass now. Epic #1647 Task 9: junitxml + -r fEs
        # (the coverage-manifest observed-set source).
        run: |
          set +e
          timeout -s INT -k 10 20m stdbuf -oL python -m pytest \
            tests/test_ingest_safety.py -m track_b -v --timeout=300 \
            -p no:cacheprovider --maxfail=20 -r fEs --junitxml=/tmp/junit.xml \
            -o junit_family=xunit1 > /tmp/trackb.log 2>&1
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          tail -25 /tmp/trackb.log
          echo "track-b rc=$rc (must-pass — gate member)"
          exit $rc
      - name: Skip-fail guard (track-b, epic #1647 Task 9)
        # Same junitxml-reconciled manifest as the other docker surfaces — a
        # vanished track_b nodeid or a FalkorDB-reasoned skip reds.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            python3 tools/skip-guard.py /tmp/trackb.log --junitxml=/tmp/junit.xml --manifest /tmp/expected-nodeids.txt
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi
      - name: Upload track-b log (measurement artifact, #1477)
        # #1477: non-gating upload — track-b writes /tmp/trackb.log (no
        # --durations, but the PASSED/FAILED lines feed the flake signal).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}
          path: |
            /tmp/trackb.log
            /tmp/junit.xml
            /tmp/expected-nodeids.txt
          if-no-files-found: ignore

  test-carve-out:
    # Epic #1647 E2E-4 (Task 9 Step 5): the embedded carve-out's CI home —
    # the tests that run embedded BY DESIGN (recovery auto-rebuild
    # D2/D3, busy-error D11, reaper/chaos, backup-restore, migration
    # integration). URI is DELIBERATELY unset (the redirect would fire and
    # flip these files to the server lane); TORTOISE_TEST_CARVE_OUT=1 is the
    # P4 enforcement prep (Task 10 Step 1a: default pytest requires
    # TORTOISE_DB_URI unless CARVE_OUT=1 — this job is what keeps the
    # enforcement from failing the carve-out). The skip-guard's manifest mode
    # covers the set (the carve-out's redislite-availability skips are the
    # exempt reason family — E2E-4 row: "skip-guard exempts them").
    # #1988: previously gated on full==true (review finding #3) with tier-2
    # PRs running the carve-out files embedded in the fast-matrix legs — but
    # the tier-2 process exhausts its redislite spawn budget before the late
    # embedded suites (RedisLiteServerStartError). The carve-out job now runs
    # on PRs too (fresh process) and ci_selection excludes carve-out files
    # from the tier-2 legs, so the embedded files always run here.
    # #2147 (2026-09-02-ci-audit F1): the job ran on EVERY PR and push,
    # diff-unaware — a docs-only PR (#2132) paid 23m31 for the full 23-file
    # embedded set, and the job was the critical path of every main push.
    # Diff-gated on the selector's carve_out_run: full selections (push to
    # main / unknown-path or shared-module PRs — the
    # trunk backstop, NEVER dropped) or a PR whose matched
    # surfaces own carve-out files (core/api/sdk/eval — the embedded /
    # daemon / registry / guard surfaces; a carve-out TEST file change
    # selects its owning surface, so it re-runs here too). docs/website/
    # config-only PRs (surfaces == [] -> carve_out_run == false) skip. When
    # it runs it still runs the FULL carve_out leg (the embedded
    # set is one coherent E2E-4 surface — partial runs would weaken the
    # recovery/backup/migration guarantees; tier-2 legs already exclude
    # carve-out files, so this job is their only home on PRs).
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.carve_out_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TORTOISE_TEST_CARVE_OUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + test extras
        run: pip install -e '.[test,embeddings]'
      - name: Clean stale redislite orphans (issue #1005 tempdir pollution)
        run: |
          pkill -f "redis-server unixsocket" || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Generate coverage manifest (carve-out — expected nodeids, epic #1647 Task 9)
        run: |
          FILES=""
          for f in ${{ needs.changes.outputs.carve_out }}; do FILES="$FILES tests/$f.py"; done
          if [ -z "$FILES" ]; then
            echo "no carve-out files selected — no manifest (guard skips)"
            exit 0
          fi
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "not track_b and not live and not integration" --output /tmp/expected-nodeids.txt
      - name: Run carve-out suite (embedded, URI unset — E2E-4)
        # The embedded carve-out. Deliberately NO TORTOISE_DB_URI:
        # the carve-out's embedded-specific assertions (recovery, busy-error,
        # reaper, backup-restore) must run against FalkorDBLite. junitxml +
        # -r fEs (the manifest's observed-set source); pytest-rc for the
        # guard/orphan gates.
        run: |
          set +e
          FILES=""
          for f in ${{ needs.changes.outputs.carve_out }}; do FILES="$FILES tests/$f.py"; done
          if [ -z "$FILES" ]; then
            echo "no carve-out files selected — skipping"
            echo 0 > "${RUNNER_TEMP:-/tmp}/pytest-rc"
            # #4740: pytest never runs here, so the conftest sweep never writes
            # its report — write the explicit "no-pytest" one rather than
            # leaving the orphan gate to parse a missing report.
            printf '{"sweep":{"skipped":"no-pytest"}}' > "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
            exit 0
          fi
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' /tmp/pytest.log 2>/dev/null || true)
              f=$(grep -c ' FAILED' /tmp/pytest.log 2>/dev/null || true)
              echo "HEARTBEAT: carve-out pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          ulimit -n 65536 || true  # #1988: fd headroom for the embedded suites
          timeout -s INT -k 10 75m stdbuf -oL python -m pytest $FILES -v --timeout=300 -p no:cacheprovider -m 'not track_b and not live and not integration' --maxfail=20 -r fEs --durations=15 --junitxml=/tmp/junit.xml -o junit_family=xunit1 > /tmp/pytest.log 2>&1
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 200 /tmp/pytest.log
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log || echo "(no FAILED/ERROR nodeids)"
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' /tmp/pytest.log)
            failed=$(grep -c ' FAILED' /tmp/pytest.log)
            errored=$(grep -c ' ERROR' /tmp/pytest.log)
            echo "==================== WATCHDOG: carve-out pytest killed after 75m ($passed passed, $failed failed, $errored errored so far) ===================="
          fi
          echo "==================== pytest exit code: $rc ===================="
          exit $rc
      - name: Skip-fail guard (carve-out, epic #1647 E2E-4)
        # The carve-out's redislite-availability skips are the exempt reason
        # family (embedded/redislite-unavailable) — never a guard trip; a
        # vanished nodeid or a docker-availability skip still reds.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            # BOTH guards must be able to red this step. It runs under `set +e`, and a
            # `run:` block's status is its LAST command's — so an unguarded second
            # invocation silently masked the first one's failure (the #1647 coverage
            # guard's non-zero exit was discarded whenever the platform-gated guard
            # passed). Accumulate the codes and exit non-zero if EITHER failed.
            guard_rc=0
            if [ -s "${RUNNER_TEMP:-/tmp}/pytest-files" ]; then
              python3 tools/skip-guard.py /tmp/pytest.log --junitxml=/tmp/junit.xml --manifest /tmp/expected-nodeids.txt || guard_rc=1
            else
              python3 tools/skip-guard.py /tmp/pytest.log || guard_rc=1
            fi
            # #4215: the runtime half of the platform-gate guard. The manifest
            # above is regenerated from THIS tree's --collect-only, so a gate that
            # removes a test removes it from BOTH sides and the check stays green.
            # This checked-in set is frozen: the platform-gated file's tests must
            # still be COLLECTED — skipped counts, because the two darwin-gated
            # ones legitimately skip on the ubuntu runners, and a skip still
            # emits a <testcase>. A gate that hides one from collection cannot
            # spell its way out of the junitxml. --manifest-only: this lane's
            # skips are the exempt reason family, so the docker-calibrated
            # matchers must not run here.
            python3 tools/skip-guard.py /tmp/pytest.log \
              --junitxml=/tmp/junit.xml \
              --manifest config/ci-expected-nodeids/platform-gated.txt --manifest-only || guard_rc=1
            exit $guard_rc
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi
      - name: Assert no redislite orphans (issue #1005 / epic #1647 E2E-7)
        # Same gate contract as the fast/slow asserts (#4740): the bound is read
        # from the conftest session-end sweep's own report
        # (.github/scripts/orphan-bound.sh), never a hand-picked constant. The
        # carve-out runs embedded, so the sweep reports its own `left`. The
        # gate reds a leak that appears AFTER the sweep (COUNT > left), an
        # accounting-identity violation, a probe_failed report above a measured
        # COUNT of zero, an error or skipped report, a no_embedded_servers
        # report above a measured COUNT of zero, and an unaccounted/unreadable
        # report; a residue the sweep itself measures and declines to act on is
        # bounded by that measurement, not independently red (#4884). A
        # `cleared: false` report does not red at any measured COUNT: `cleared`
        # reports whether the sweep's TIME BUDGET sufficed — a function of
        # runner load — not its residue (#4989).
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          # #4740: read the count and pgrep's OWN status separately — a
          # `${PIPESTATUS[0]}` after `COUNT=$(pgrep … | wc -l)` is the `tr`
          # status, never pgrep, so a failed probe would read as 0 and pass.
          # `$?` on the bare assignment IS pgrep's status (rc 0/1 are real
          # measurements; anything else must RED). See the fast job's note.
          PIDS=$(pgrep -f "redislite/bin/redis-server")
          prc=$?
          [ "$prc" -le 1 ] || { echo "::error::pgrep failed rc=$prc — the orphan count is unmeasured (issue #1005)"; exit 1; }
          COUNT=$(printf '%s' "$PIDS" | wc -w | tr -d ' ')
          bash .github/scripts/orphan-bound.sh \
            --count "$COUNT" \
            --rc "$RC" \
            --hygiene "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
      - name: Upload carve-out log (measurement artifact, #1477)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}
          path: |
            /tmp/pytest.log
            /tmp/junit.xml
            /tmp/expected-nodeids.txt
          if-no-files-found: ignore

  test-d14-hosted-api:
    # #2188: the D14 (embedded_only) keepalive regression guards in
    # tests/test_hosted_api.py — test_make_sdk_reuses_healthy_anchor (#1470),
    # test_make_sdk_rebinds_stale_anchor (#1502), and the #2172 set
    # (test_make_sdk_concurrent_first_calls_single_anchor,
    # test_registry_anchor_reuses_healthy_anchor,
    # test_registry_anchor_concurrent_first_calls_single_anchor) — ran in NO
    # trunk CI job: the file is in slow_files (full runs execute it only in
    # the docker slow leg, which sets TORTOISE_DB_URI → the autouse D14 skip
    # hook skips them all) and the URI-less carve-out runs only the 23
    # ci-surfaces carve_out files. A future revert of _KEEPALIVE_LOCK
    # (#2172) or the anchor semantics would produce NO CI failure anywhere —
    # the race would resurface only probabilistically (#2065/#2172 flake).
    # This job runs the D14 set URI-less on every run (PR + push), ~1 min.
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TORTOISE_TEST_CARVE_OUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + test extras
        run: pip install -e '.[test,embeddings]'
      - name: Run the embedded_only marker selection (URI unset — #4164)
        # Deliberately NO TORTOISE_DB_URI (the autouse D-2 skip hook fires
        # when a URI is set and would skip every marked test); CARVE_OUT=1 is
        # the explicit URI-less opt-in.
        #
        # #4164: this job used to run `tests/test_hosted_api.py -k
        # "concurrent_first_calls or …"` — a HAND LIST of the five D14 guards.
        # A hand list covers only the marks someone remembered, and that is
        # exactly what happened: of the marked tests in files OUTSIDE the
        # carve-out set, those five ran here and the rest were collected-and-
        # skipped on every docker leg and executed NOWHERE (test_audit's
        # embedded_busy case, TestDriftCounterWiring, test_index_directory,
        # test_indexes, test_lme_m6_evidence, test_onboard_prompt_ref,
        # test_pack_state, test_session_extraction_modes). Selecting by the
        # MARKER cannot drift: a new @pytest.mark.embedded_only test in ANY
        # file — per-test, class-level, or class-body `pytestmark` — is picked
        # up by the next run without editing this step. That is also why the
        # step is pinned by tests/test_markers.py::
        # test_ci_runs_the_embedded_only_marker_selection (it fails if this
        # goes back to naming tests).
        run: |
          set -eo pipefail
          timeout -s INT -k 10 15m python -m pytest tests/ -m embedded_only \
            -v --timeout=300 -p no:cacheprovider --junitxml=/tmp/junit-d14.xml -o junit_family=xunit1 2>&1 | tee /tmp/pytest-d14.log
          # Fail-closed on a silent all-skip — the #2188 review P3-1 shape,
          # widened. The floor is 30 and the number is NOT arbitrary: the four
          # marked files that are ALREADY carve-out registered (precision_leak
          # 6 + test_hosted_api 5 + fork_slot_wedge 12 + fork_safety 4 = 27 marked,
          # of which 25 PASS on the ubuntu runner — the two darwin-gated
          # fork_safety ones skip) are the always-passing baseline, so a floor at
          # 25 would still be met by a hook broadened to skip exactly the class
          # #4164 rescues. 30 sits above that baseline (25) and below the measured
          # total, so losing the rescued class reds the job while a few legitimate
          # removals do not.
          # Measured 2026-09-20 on this tree (run 35518962357, head fd23a4033): 35
          # passed / 34 skipped (each skip exogenous — the 32 module-level gate
          # markers, and the two darwin-gated #3845 fork tests; no real test skips
          # for any other reason). The contract is that the marks RUN; the exact
          # count is free to grow.
          passed=$(grep -c ' PASSED' /tmp/pytest-d14.log || true)
          echo "embedded_only-marked tests passed: $passed"
          [ "$passed" -ge 30 ] || { echo "::error::expected >=30 embedded_only-marked tests to RUN (got $passed passed — all-skip, URI leak, a broadened hook, or the non-carve-out class lost?)"; exit 1; }
          # #4207: the floor above is a COUNT of PASSED lines, so a single
          # subtracted test leaves 34 and the step stays green — and the pin in
          # tests/test_markers.py reads this step's TEXT, so a deselecting flag
          # passed through a shell variable is invisible to it as well. Neither
          # can see a subtraction. The checked-in manifest is the FROZEN
          # known-good set: every nodeid must still appear as a junitxml
          # <testcase> (passed OR skipped) or this reds and NAMES the one that
          # vanished. Supersets are fine — a new marked test needs no edit here.
          # --manifest-only: this lane's skips are the expected state (URI unset),
          # so the docker-calibrated skip matchers would false-red every e2e
          # module (24, measured); the coverage property is what this lane owes.
          python3 tools/skip-guard.py /tmp/pytest-d14.log \
            --junitxml=/tmp/junit-d14.xml \
            --manifest config/ci-expected-nodeids/embedded-only.txt --manifest-only
      - name: Upload D14 log (measurement artifact, #2188)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-d14-hosted-api
          path: |
            /tmp/pytest-d14.log
            /tmp/junit-d14.xml
          if-no-files-found: ignore

  canary-streak:
    # Epic #1647 Task 9 Step 6 (D-3=A): the instrumented canary-drop streak.
    # Separate job (needs: [test] — the matrix jobs fan in; a step inside the
    # matrix job cannot run after both halves — cycle-5 P1-7). POST-MERGE
    # ONLY (push — PR runs never mutate the canary artifact).
    # Downloads the half-b artifact set (junitxml + expected-nodeids +
    # step_wall + the canary-producer marker), finds the PREVIOUS streak
    # artifact, runs the deterministic classifier (tools/testdb_canary_classify
    # .py — artifacts only, never a $GITHUB_OUTPUT value; cycle-6 P1-7), and
    # uploads the new streak + posts the summary. `consecutive_green >= 5`
    # flips canary_dropped — the embedded canary lane's retirement milestone
    # (the lane itself was already retired by the Task 9 Step 1 half-a flip;
    # this artifact is the record the epic's indicator #2 gate reads).
    needs: test
    # always(): WITHOUT the status-check function the implicit success()
    # would SKIP this job whenever a test leg fails/cancels — red runs would
    # never reach the classifier and the streak would freeze instead of
    # resetting (review finding #1: every reset bucket would be dead code).
    # always() + the post-merge gate = the classifier receives red runs too
    # (the half-b artifact upload is if: always() + continue-on-error, so
    # failed runs still ship their junitxml/manifest/step_wall evidence).
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download half-b artifacts (the P1-7 canary contract)
        # The half==b tag is the dual-lane canary tag (Task 6 Step 2 item 7).
        # Missing artifacts (cancelled half-b leg) are tolerated — the
        # classifier treats an absent junitxml as an infra-flake reset.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pytest-log-test-b
          path: artifacts
      - name: Download previous streak artifact (chain continuity)
        # The streak chains across post-merge runs via the previous run's
        # `testdb-canary-streak` artifact. Walk the most recent push runs
        # and take the FIRST non-current run that actually has the
        # artifact (a run before the flip has none -> try the next). The gh
        # run-list query FAILS LOUD (review finding #2: a silent query failure
        # would read as "no previous streak" and wrongly reset a real streak
        # on the next green run).
        env:
          # Epic #1647 (post-merge CI-fix): gh run list/download needs a token
          # — without GH_TOKEN the step failed with "To use GitHub CLI in a
          # GitHub Actions workflow, set the GH_TOKEN environment variable"
          # (exit 4), which red'd python-ci-gate on the merge run.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run list --workflow python-ci.yml --branch main --event push --limit 5 \
            --json databaseId --jq '.[].databaseId' > /tmp/prev-runs.txt
          set +e
          # #4367: the nightly schedule trigger was removed, so this query can
          # only ever return HISTORICAL scheduled runs. It is kept as a
          # one-time continuity bridge for the streak chain (a missing prev
          # streak resets consecutive_green to 0 per testdb_canary_classify);
          # it is `|| true`-guarded and becomes unreachable once the old
          # nightly runs age out of the run-list window.
          gh run list --workflow python-ci.yml --branch main --event schedule --limit 3 \
            --json databaseId --jq '.[].databaseId' >> /tmp/prev-runs.txt 2>/dev/null || true
          CUR="${{ github.run_id }}"
          FOUND=""
          mkdir -p prev-streak
          while read -r rid; do
            [ -z "$rid" ] && continue
            [ "$rid" = "$CUR" ] && continue
            if gh run download "$rid" -n testdb-canary-streak -D prev-streak >/dev/null 2>&1; then
              FOUND="$rid"
              break
            fi
          done < /tmp/prev-runs.txt
          if [ -n "$FOUND" ]; then
            echo "previous streak from run $FOUND"
            ls -la prev-streak/
          else
            echo "no previous streak artifact found — fresh chain"
          fi
      - name: Classify run + update the canary streak (epic #1647 Task 9 Step 6)
        # Deterministic scripted triage: junitxml + expected-nodeids + step_wall
        # + divergence-confirmation log + prev streak -> new streak. Artifacts
        # ONLY (never a steps output). The step-wall file is the MANDATORY
        # E2E-5 input (cycle-4 P2-4: a run that silently rides the 55m
        # watchdog breaks the streak like any other failure).
        run: |
          python3 tools/testdb_canary_classify.py \
            --run-id "${{ github.run_id }}" \
            --junitxml artifacts/junit.xml \
            --manifest artifacts/expected-nodeids.txt \
            --step-wall artifacts/step_wall.txt \
            --divergence-log docs/epics/2026-08-24-test-db-migration/divergence-confirmation.md \
            --producer-marker artifacts/canary-producer.json \
            --prev-streak prev-streak/testdb-canary-streak.json \
            --out config/testdb-canary-streak.json
      - name: Upload canary streak artifact
        # The next post-merge run's classifier downloads THIS artifact as its
        # previous streak — the chain.
        uses: actions/upload-artifact@v4
        with:
          name: testdb-canary-streak
          path: config/testdb-canary-streak.json
          if-no-files-found: error
      - name: Post canary-streak summary
        run: |
          {
            echo "## Canary streak (epic #1647 Task 9 Step 6)"
            echo ""
            cat config/testdb-canary-streak.json
            echo ""
            echo "consecutive_green >= 5 => canary_dropped (the embedded canary"
            echo "lane's retirement milestone; the lane itself was retired by"
            echo "the Task 9 half-a flip)."
          } >> "$GITHUB_STEP_SUMMARY"

  # The agent-facing surface expansion gate (#3863).
  #
  # No `if:`, no `paths:` filter, deliberately: this job must run on EVERY pull
  # request. A filtered gate is how a surface change slips through a docs-only
  # path, and a skipped job reports Success, so a conditional guard would
  # satisfy the required check without guarding anything.
  surface-guard:
    runs-on: ubuntu-latest
    # Sibling `manifest-integrity` documents the same decision for the same reason:
    # this job owns a network install AND feeds the REQUIRED aggregate, so without a
    # bound a stalled PyPI would hold python-ci-gate red for hours on every PR.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      # ── PIN THE TOOLING TO THE BASE REF (#4606) ───────────────────────────
      # The step below would otherwise run the CHECKOUT'S OWN copy, so a PR
      # could add a surface tool and stub the gate out in the same commit: the
      # required `surface-guard` job would go green on a rewritten gate.
      #
      # PIN THE ENFORCEMENT, NOT THE GENERATOR. `tools/surface-guard.py` is the
      # gate — it compares the declaration against the approved baseline, and it
      # is SELF-CONTAINED (its own `_read_manifest`, deliberately independent of
      # `tools/surface_manifest.py`), so nothing in the PR's tree can influence
      # it. Pinning `tools/surface_manifest.py` as well looked symmetrical and was
      # a DEADLOCK: the two steps that use it run the BASE ref's copy, so a PR
      # that FIXES that tool can never make them pass. Measured on #5192 — the
      # pin succeeded, `surface-guard` and the ordering lint passed, and the
      # render step failed against a tree whose own (fixed) renderer reproduced
      # the committed document byte-for-byte. The other two steps it feeds are a
      # lint and an artifact-consistency check, not the expansion gate.
      #
      # The pinned tool resolves `ROOT = Path(__file__).resolve().parent.parent`,
      # so the pin overwrites it IN PLACE under `tools/`: the PR's TREE stays the
      # subject of the check (that is the point — it is what might have
      # expanded), while the LOGIC that measures it comes from the protected
      # base ref and cannot be edited by the PR under test.
      #
      # On `push`/`schedule` there is no `base_ref` and the checkout IS the
      # protected ref, so `HEAD` is used. A `git show` that fails leaves `set -e`
      # to fail the step, so the pin fails CLOSED rather than silently skipping.
      - name: Pin the gate's tooling to the base ref
        run: |
          set -euo pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base=FETCH_HEAD
          else
            base=HEAD
          fi
          base_sha=$(git rev-parse "$base")
          echo "pinned surface tooling from $base ($base_sha)"
          # `tools/` itself must be a REAL directory. If the PR swaps it for a
          # symlink, `mv -f` resolves THROUGH it, the pinned copies land in the
          # PR's own tree, and each tool's `ROOT = Path(__file__).resolve().parent
          # .parent` then re-roots the entire check onto that decoy tree — while
          # every per-file assertion below still passes. Assert the CONTAINER,
          # not only the files.
          test -d tools && test ! -L tools \
            || { echo "::error::tools/ is not a real directory"; exit 1; }
          for f in tools/surface-guard.py; do
            tmp="$(mktemp)"
            # `mv -f` REPLACES the path. A plain `> "$f"` redirect FOLLOWS it, so
            # a PR that commits `tools/surface-guard.py -> /dev/null` would have
            # the pin written harmlessly into the void and the step below would
            # then run an EMPTY program, exit 0, and report success. `mv -f`
            # unlinks the link and renames over it instead. The `test` then fails
            # CLOSED if anything non-regular (or empty) survived.
            # The source is `$base_sha`, not `$base`, so the sha echoed above is
            # the sha that was actually pinned.
            git show "$base_sha:$f" > "$tmp"
            mv -f "$tmp" "$f"
            test -f "$f" && test ! -L "$f" && test -s "$f" \
              || { echo "::error::$f is not a non-empty regular file after the pin"; exit 1; }
          done
          wc -l tools/surface-guard.py tools/surface_manifest.py
      - name: The surface cannot expand without an explicit human decision
        run: python3 tools/surface-guard.py
      - name: The ordering lint (AC13)
        run: python3 tools/surface_manifest.py check
      - name: The list is generated from the manifest and cannot drift from it
        run: |
          python3 tools/surface_manifest.py render
          git diff --exit-code -- docs/product/mcp-sdk-surface.md

  # ── THE REQUIRED GATE OBSERVES EVERY SHARD IT CERTIFIES ──────────────────
  # `python-ci-gate` is a REQUIRED status check AND the only `merge_condition`
  # of the Mergify merge queue (`.mergify.yml`). Its `needs:` list IS its whole
  # claim: a leg missing from it is a leg the gate cannot block, however red the
  # run is.
  #
  # #5219: from 2026-09-24T15:25Z (#5017) until this fix, `needs:` omitted
  # `test`, `test-slow` and `test-carve-out`, so the required check reported
  # SUCCESS on a tree whose primary suite had FAILED. Measured on the MERGED
  # heads of #4838 (30c5b45) and #4633 (81401cc): `test (a)`, `test (b)` and
  # `test-carve-out` were all `completed/failure` while `python-ci-gate` was
  # `completed/success` — and both PRs merged. Across PRs at the time, the only
  # thing that separated a gate that reddened on a failing `test` from one that
  # did not was WHICH VERSION OF THIS FILE the PR head carried: heads with the
  # pre-#5017 list failed the gate, heads with the post-#5017 list passed it.
  # A gate that goes green on a red tree is worse than a slow one: the queue
  # then merges a red batch at machine speed.
  #
  # #5017 removed those three legs DELIBERATELY, to cut merge-path latency (the
  # required check's latency IS the merge path: this repo uses strict up-to-date
  # protection + GitHub SERVER-SIDE auto-merge, which fires the instant the
  # REQUIRED checks are green — not when the run finishes — so a required
  # aggregate that waits on the long legs makes every merge wait ~30 min while
  # main advances every ~20 min; measured 2026-09-24: 0/41 PRs ever CLEAN).
  # This change REVERSES that trade on the owner's call (#5219): the required
  # check must observe the shards it stands for. The latency cost is real, is
  # accepted knowingly, and is quantified by the measurements kept below.
  #
  # IF THE LATENCY MUST COME BACK, THE LEVER IS NOT THIS LIST — removing a leg
  # here re-opens #5219. In preference order: (1) add the long legs as
  # `check-success=` conditions on the QUEUE's `merge_conditions`, keeping this
  # aggregate fast for direct merges — the queue is the machine-speed consumer,
  # while a human-paced merge can at least see the advisory red on the PR;
  # (2) drop `strict: true` from branch protection — an OWNER action, not a
  # workflow edit.
  #
  # MEASURED job durations of THIS workflow (GitHub Jobs API, green push run
  # 35952913400 and green PR run 35955422523):
  #   test (a)               30.0–31.5m   ← the true critical path
  #   test-slow (b)          22.8–29.3m
  #   test (b)               18.3–27.1m
  #   test-carve-out         15.5–16.7m
  #   test-slow (a)           6.6–7.2m
  #   test-d14-hosted-api     3.3–3.6m
  #   test-concurrency-falkor 2.5–3.1m
  #   everything else         <1.2m
  # These are what the reversal above is weighed against: they are why #5017
  # removed the three >15m legs, and why re-adding them costs ~30m of
  # merge-path latency.
  #
  # THE LONG LEGS ARE NOT DELETED, AND NOT PUSH-ONLY — they run on both lanes:
  #   * pre-merge on every PR whose diff selects them, now back INSIDE this
  #     aggregate, so a failure blocks the merge (#5219), and
  #   * post-merge on every push to main, exactly as before.
  # They are deliberately NOT made push-only (skipped on PRs), even though that
  # would save their runner time, because the merge rail refuses it:
  # `scripts/admin-merge.sh` (the mandated `--admin` path) requires the PR lane
  # to have EXECUTED every test shard main's push lane executed
  # (`ADMIN_MERGE_LANE_PARITY` defaults to `require`; tortoise #4263/#4457) — a
  # `skipped` shard is not coverage. Skipping these legs on PRs would make every
  # `--admin` merge refuse `NOT COMPARABLE` and force a permanent
  # `ADMIN_MERGE_LANE_PARITY=declared-off` override.
  #
  # `canary-streak` is deliberately NOT in `needs:`: it is push-only
  # (`if: always() && github.event_name == 'push'`), so on a pull request it
  # reports only `skipped` and carries no signal. It still runs on each push,
  # alongside the long legs it depends on.
  #
  # The pins that keep this shape honest live in tests/test_ci_selection.py —
  # `test_required_gate_covers_the_long_legs` (the legs ARE in the transitive
  # closure, and are DIRECT needs, which is the property that matters) and
  # `test_drift_gate_cannot_skip_the_test_matrix` (the aggregate really EXITS
  # NON-ZERO per red leg, a leg dropped from `needs:` fails closed instead of
  # vanishing, and a `skipped` leg is forgiven only when the selector declined
  # it).
  python-ci-gate:
    if: always()
    needs: [changes, manifest-integrity, test, test-slow, test-carve-out, test-concurrency-falkor, packs-compile, test-track-b, test-d14-hosted-api, surface-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate matrix result
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "matrix results: $RESULTS"

          # 1. Any declared need that failed or was cancelled blocks the merge.
          #    `join(needs.*.result)` covers EVERY entry in `needs:`, so no leg
          #    escapes the red check by accident of ordering or naming.
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::matrix leg failed or was cancelled — merge blocked"
            exit 1
          fi

          # 2. `skipped` is NOT a pass by default. A docs-only diff legitimately
          #    skips the matrix, so a leg the SELECTOR declined may skip — but a
          #    shard the selector DID select that reports `skipped` is a lost
          #    shard, and this REQUIRED check must not certify it (#5219).
          #    `needs.<job>.result` also renders EMPTY when <job> is missing from
          #    `needs:`, so every row here fails closed on the #5219 shape too.
          #    Row form: <leg>|<result>|<the selector output that selects it>;
          #    `-` means the leg has no diff gate and must therefore always be
          #    SUCCESS (the surface guard's original explicit assertion, applied
          #    to every always-run leg).
          while IFS='|' read -r leg result selected; do
            if [ -z "$leg" ]; then continue; fi
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$selected" = "false" ]; then
              echo "  $leg: skipped by the selector (not selected for this diff)"
              continue
            fi
            echo "::error::$leg reported '$result' and the selector did not decline it (selected='$selected') — merge blocked"
            exit 1
          done <<'LEGS'
          changes|${{ needs.changes.result }}|-
          manifest-integrity|${{ needs.manifest-integrity.result }}|-
          test|${{ needs.test.result }}|${{ needs.changes.outputs.python }}
          test-slow|${{ needs.test-slow.result }}|${{ needs.changes.outputs.slow_run }}
          test-carve-out|${{ needs.test-carve-out.result }}|${{ needs.changes.outputs.carve_out_run }}
          test-concurrency-falkor|${{ needs.test-concurrency-falkor.result }}|${{ needs.changes.outputs.python }}
          packs-compile|${{ needs.packs-compile.result }}|${{ needs.changes.outputs.python }}
          test-track-b|${{ needs.test-track-b.result }}|${{ needs.changes.outputs.python }}
          test-d14-hosted-api|${{ needs.test-d14-hosted-api.result }}|-
          surface-guard|${{ needs.surface-guard.result }}|-
          LEGS
          echo "✅ every declared leg ran to success, or was declined by the selector"
