name: Python CI

# Pre-merge Python test gate (#746).
#
# Replaces the previous broken symlink (`.github/workflows/python-ci.yml` →
# `agent-infra/templates/.github/workflows/python-ci.yml`), which resolved to
# a path that does NOT exist in this checkout. GitHub silently ignored the
# invalid symlink, so NO pre-merge Python suite ran — the full suite only
# ran post-merge, warn-only (post-merge-validation.yml). That is why the P0
# membership-status bug (#740) would have merged green.
#
# Self-contained on purpose (fix #555): no reusable-workflow call and no
# `scripts/`/`agent-infra` symlinks — both resolve to paths that are broken
# on the runner.
#
# Runs the full embedded-FalkorDBLite suite (tests needing a live FalkorDB
# self-skip via _skip_if_no_falkor).
#
# #798 — why the suite now ALWAYS ends with output (it used to die silently):
#   The full suite takes ~45-55 min on a GitHub runner but the job had
#   timeout-minutes: 30, so the runner killed pytest mid-suite at ~64%
#   with NO pass/fail summary (0 green runs in ~200). Fix, five parts:
#
#   1. SPLIT into two parallel jobs so the pre-merge gate fits its budget:
#      - `test`      — everything except the known-slow files
#                      (config/ci-surfaces.yml `slow_files:` — see #1371)
#                      (primary gate, watchdog-bounded at 30 min of pytest
#                      time).
#      - `test-slow` — the slow files alone. They legitimately need a
#                      longer per-test budget (e.g. test_control_plane has
#                      a ~90s setup, test_hosted_api is 100+ slow tests),
#                      and they don't belong in the fast gate.
#      The first 12 entries come from the #647 sweep (2026-08-08),
#      re-measured on a clean machine 2026-08-09: test_github_connect /
#      test_ep_selector / test_hosted_auth / test_extractor_doc /
#      test_invites / etc. were machine-degradation artifacts (657+ leaked
#      redislite servers, #176) and stay in the fast job.
#      The last 6 (test_projection / test_search_engine_gaps / test_billing
#      / test_source_inheritance_own / test_sdk / test_cli_context) were
#      added after the first fix iteration: the fast job still exceeded its
#      40-min cap (cancelled at 38.6 min of pytest time, no output — the
#      #798 death mode again). They are the largest remaining files by
#      size/test-count (proxy for runtime; ~20% of fast-suite bytes).
#      First post-fix CI run confirmed the split + fail-fast: the job
#      stopped at 20 failures with a printed summary in 42s.
#
#   0. ENV-BROKEN FILES are excluded from the fast job (they cannot pass
#      in THIS job and would pollute every summary with noise; both are
#      tracked in #647):
#      - tests/e2e/           — browser tests; covered by the
#                               welcome-e2e-monitor workflow + ci.yml's
#                               legal-e2e job, which run
#                               `playwright install --with-deps chromium`.
#                               Without browsers they only ever ERROR here.
#      - tests/test_agent_signup.py — control-plane suite requiring a live
#                               redis on 6379, which this job (and every
#                               CI surface) lacks; adding a redis service
#                               risks port collisions with the embedded
#                               FalkorDBLite suite (default port 6379).
#
#   2. IN-STEP WATCHDOG (the part that makes the summary GUARANTEED):
#      pytest runs under `timeout -s INT -k 10 46m` INSIDE the step. A
#      runner-level timeout-minutes kill cancels the step and loses
#      everything (proven twice: the 30-min death and the 40-min death),
#      but a shell-level `timeout` kill lets the script CONTINUE: after
#      the kill (SIGINT, then SIGKILL 10s later if pytest is stuck inside
#      a test — pytest ignores INT mid-test), the step re-prints the log
#      tail, prints pass/fail counts and the real exit code, and exits.
#      The job can never end silently again: worst case it ends red with
#      "WATCHDOG: killed after 46m — N passed, M failed, last tests above".
#
#   3. Per-test --timeout=300 (was 90): turns any hang into a visible
#      failure without false-killing legitimately slow tests (the old
#      --timeout=90 could kill e.g. test_control_plane's ~90s setup).
#
#   4. --maxfail=20: on a failing run, stop early with the summary
#      already printed — red arrives faster, still actionable.
#
# Note on the remaining red: pre-existing real failures (verified locally
# on origin/main: tests/test_claim_lifecycle.py SDK-API drift, one
# tests/test_bridge_mcp.py assertion) are NOT fixed here — they belong to
# #647. The fast job now surfaces them in a clean summary instead of
# dying silently.
#
# Remaining known failures are tracked in #647 (5 real + slow files). The
# slow files are isolated in `test-slow`, so `test` can go green while the
# slow-file failures are fixed separately.

on:
  push:
    branches: [main]
  pull_request:

# #1008/#1021: the `changes` job runs the tiered selector
# (tools/ci_selection.py) — always runs, always emits the audit artifact.
# PRs run tier 1 (curated smoke) + matched-surface tests; push runs the
# full matrix. The REQUIRED check is `python-ci-gate` (branch protection AND
# the merge queue's only `merge_condition`), and it aggregates every test shard
# it stands for — including `test`, `test-slow` and `test-carve-out`. #5219: for
# as long as those three were absent from its `needs:`, the required check
# reported SUCCESS on trees whose primary suite had FAILED. Job id
# `python-ci-gate` is load-bearing: do NOT rename it or add a `name:` field.
# welcome-e2e
# (#801 live-signup monitor) lives in its own scheduled workflow.
# #2147/#2148 (2026-09-02-ci-audit F1/F2): the formerly-unconditional
# test-slow + test-carve-out legs are diff-gated on the selector's
# slow_run / carve_out_run / slow_selected outputs — docs/website-only
# PRs skip both; tier-2 PRs run only their surface's slow files. NOTE:
# config/* falls through to the core surface, so config-only PRs (the
# manifest edits) run both legs — conservative and correct.
# trunk (push) + unknown/shared-module PRs keep the full runs.
# #4367: the nightly schedule was removed — push-to-main is now the ONLY
# full-matrix trigger (tests run when the functionality they cover changes,
# not on a timer). The selector still accepts --event schedule for any
# future caller; nothing in this workflow emits that event.

concurrency:
  # Per-PR cancel only (measured 2026-10-27, docs/ops/ci-wall-clock.md).
  #
  # The group key does the work: `github.ref` is `refs/pull/N/merge` on
  # `pull_request`, so a new commit on PR N cancels PR N's stale run — and only
  # PR N's (a different PR, or any push, is a different ref, hence a different
  # group). `github.event_name` in the key keeps the PR and push arms apart, so
  # no push can cancel a PR run or the reverse.
  #
  # ⛔ WHY THE PUSH ARM IS DELIBERATELY NOT `cancel-in-progress: true`. The
  # obvious reading is "a superseded main run occupies a runner" — the
  # measurement says it does not, and that killing the one run that DOES occupy
  # one would cost coverage:
  #   * superseded PENDING push runs are already dropped by GitHub, which keeps
  #     one pending run per group even with `cancel-in-progress: false`: of the
  #     20 push-to-main runs created 2026-10-26T22:40Z..10-27T04:50Z, 17 never
  #     started a single job (18 ended `cancelled`, 1 failed, 1 still queued) and
  #     only 3 ever started one -- and one of those 3 was cancelled mid-flight,
  #     which is exactly the shape this arm would give every run. The cancelled
  #     subtotal DRIFTS as pending runs age out, so "never started a job" is the
  #     figure to quote. `Post-merge validation` shows the same shape (16 of the
  #     last 20 cancelled).
  #   * main is pushed in BURSTS, not on a 145-minute drum: measured gaps over
  #     the same 6.2 h were p50 3 min / p95 55 min / max 152 min, and one burst
  #     was 9 pushes in 8 minutes. Under `cancel-in-progress: true` nearly every
  #     main run would be killed within minutes of starting — i.e. the run that
  #     survived the pending drop is the ONLY full matrix main gets, and it is
  #     the one that would be cut.
  #   * the fallback is not equivalent. `post-merge-validation` falls open on a
  #     cancelled run (#1474) but its `validate` job EXCLUDES `tests/e2e` and
  #     `config/ci-surfaces.yml: slow_files`, so the `test-slow` legs of a
  #     superseded tree would be run NOWHERE. That is a coverage loss on main,
  #     not a capacity win: push runs are ~1 of every 18 queued python-ci runs
  #     (measured 04:10Z: 17 `pull_request`, 1 `push`).
  # The wall §1 of docs/ops/ci-wall-clock.md measures is the PR side; the lever
  # there is capacity and queue governance (tools/ci_queue_health.py, #9115).
  group: python-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # conftest.py sets a static pepper via setdefault, but pin it here
  # so the requirement is explicit and the same across surfaces.
  TORTOISE_SECRET_PEPPER: test-static-pepper
  # #1371: opt-in fast interpreter-exit close for ephemeral embedded test
  # servers (tortoise/embedded_lifecycle.py) — kills the ~10-15 min atexit
  # teardown tail that pushed the fast gate to its watchdog ceiling.
  # conftest also sets it via setdefault (covers local + post-merge runs).
  TORTOISE_FAST_ATEXIT: "1"
  # Known-slow files (test time > ~60s each, measured on a clean machine
  # 2026-08-09 against origin/main; last 6 added by size/test-count proxy
  # after the 40-min fast-job death, see header; test_ep_sources +
  # test_sdk_group3 added 2026-08-10 by measured duration — ep_sources 140s
  # EP compute, sdk_group3 ~120-220s redislite teardown, both > 60s bar, #880).
  # #1266 (2026-08-18): 8 more moved by measured duration — the ingest/index
  # epic suites (test_index_directory 329s, test_ingest_bundle 231s, test_ingest_mode
  # 152s, test_index_cli 139s, test_ingest_validation 84s, test_flip_gate 77s) from
  # half (a) plus test_projection_lifecycle 121s + test_reaper 156s from half (b) —
  # halves rebalanced a=87/b=86; half (a) was 33:19 > 30m cap. Gate now fails
  # closed on slow-leak/unclassified/dead/imbalanced halves (see ci_selection.py).
  # Excluded from the `test` job and run in parallel in `test-slow`
  # (#798, tracked slow files: #647). #1371: the SLOW_FILES env var is gone —
  # the single source of truth is config/ci-surfaces.yml `slow_files:`;
  # #9539: test-slow's legs are DERIVED from that config — LPT-packed into
  # `slow_shards` legs from the same `durations` map the fast band uses — and
  # published as `changes.outputs.slow_matrix`, so there is no committed leg
  # list to rot. `slow_file_issues`/`leg_coverage_issues` pin the pool and
  # `slow_shard_issues` pins the declaration; the drift guard in the job pins
  # the expanded legs to `slow_gating_files()` (slow_files minus carve-out minus
  # the non-gating lane) at run time. The push matrix
  # and env-broken exclusions are derived by the selector (#1472).
  # Env-broken in this job (tests/e2e needs browsers; test_agent_signup needs
  # a live redis on 6379) — single source is tools/ci_selection.py.
  # #6136 (epic #5215, owner decision D3 at docs/plans/2026-09-26-5215-merge-
  # throughput.md): the pytest-xdist worker count for the ONE shard D3
  # admits. It is consumed at exactly ONE site — the `test` job's run step —
  # and only when BOTH hold: `matrix.half == 'a'` (one shard) AND
  # TORTOISE_DB_URI is non-empty (the docker shape). No other pytest
  # invocation site reads this value.
  #
  # The URI condition is what keeps the EMBEDDED shape serial. The tier-2
  # URI gate leaves TORTOISE_DB_URI empty BY DESIGN (epic #1647 Task 10
  # P1-9), so on a tier-2 PR this very step runs the embedded redislite
  # lane — the RC5 leak surface (#2875, #3653) that D3 does not admit `-n`
  # on. That is a runtime condition on the URI, not a claim that the step
  # can never run embedded: the step shares its run block with tier-2, so a
  # comment asserting "docker only" would be false. The condition is
  # evaluated in the step and echoed there, so which shape got `-n` is
  # legible in the log rather than inferred.
  #
  # PINNED rather than `-n auto`: ubuntu-latest is 4 vCPU, and a pinned
  # count cannot silently follow a runner-class change. The shard keeps
  # PYTEST_XDIST_TESTRUNUID (xdist sets it in every worker), which is what
  # lets tests/conftest.py's E2E-7 survivor gate tell a sibling worker
  # from a genuinely concurrent suite — D3's leak-count assertion.
  #
  # Scope note: ONE shard is the isolation-bounded proof D3 admits, not the
  # full throughput lever — it cannot move the overall gate wall on its own
  # (see the run step's HONEST LIMIT note).
  PYTEST_XDIST_WORKERS: "4"

jobs:
  changes:
    # #1008/#1021: selection job — always runs, always emits the artifact.
    # Runs the tiered selector (tools/ci_selection.py): tier 1 smoke always;
    # matched surfaces on code PRs; full on push/shared/unknown.
    runs-on: ubuntu-latest
    # This job now owns a network install (pip install pyyaml, #5128) and every
    # downstream python-ci job has `needs: changes` -- without a bound, a stalled
    # PyPI marks the whole matrix `skipped` for up to the 360-minute default.
    # Mirrors manifest-integrity's bound for the same reason.
    timeout-minutes: 5
    # ⛔ #6897: this job carries NO `env:` of its own — the runner-split opt-in
    # is attached to the TWO matrix EMITTER steps instead (`push-matrix` and
    # `split` below). Job scope would reach every emitter by construction, and
    # an earlier cut of #10186 did exactly that, but this job also owns the
    # capstone pre-registration gate step: any `env:` key at job scope sits
    # ABOVE that gate and can hook its interpreter or shell, so
    # `tests/test_capstone_preregistration_9075.py::_SAFE_JOB_ENV` is empty for
    # every job and a job-scope lever reds a required fast shard (measured: 44
    # reds in that pin at head `3eaf43fda`). Step scope on BOTH emitters is the
    # shape that keeps the gate clean AND the lever live;
    # `tests/test_ci_selection.py::test_the_opt_in_reaches_every_matrix_emitter_in_the_changes_job`
    # discovers the emitters from their `run:` commands, so a third one added
    # later cannot silently miss it.
    outputs:
      python: ${{ steps.select.outputs.python }}
      full: ${{ steps.select.outputs.full }}
      surfaces: ${{ steps.select.outputs.surfaces }}
      test_files: ${{ steps.select.outputs.test_files }}
      slow_files: ${{ steps.select.outputs.slow_files }}
      # #2147/#2148 (2026-09-02-ci-audit F1/F2): the diff-gate contract for
      # the two formerly-unconditional legs — slow_run (test-slow runs),
      # carve_out_run (test-carve-out runs), slow_selected (space-joined
      # surface-matched slow leg set; full selections carry the whole set).
      slow_run: ${{ steps.select.outputs.slow_run }}
      carve_out_run: ${{ steps.select.outputs.carve_out_run }}
      slow_selected: ${{ steps.select.outputs.slow_selected }}
      # #6135: ONE derived matrix object, not per-half outputs. The `test`
      # job expands it directly (`fromJSON`), so the shard count and the leg
      # names are the selector's contract, never a workflow literal. The tier-2
      # split (PRs) OVERRIDES the push matrix with its own shards; `||` falls
      # back to the push matrix when `split` did not run (it is skipped on
      # push and on full-matrix PRs — a skipped step's output is empty).
      fast_matrix: ${{ steps.split.outputs.fast_matrix || steps.push-matrix.outputs.fast_matrix }}
      carve_out: ${{ steps.push-matrix.outputs.carve_out }}
      # W37: the carve-out pool's shard matrix. Read by `test-carve-out`
      # directly (`fromJSON`), so the shard count and the leg names are the
      # selector's contract, never a workflow literal — the same rule
      # `fast_matrix` follows. The tier-2 split does NOT override it: the
      # carve-out set is diff-GATED (`carve_out_run`) but never diff-SIZED, so
      # every run that enters this job runs exactly its three shards.
      carve_matrix: ${{ steps.push-matrix.outputs.carve_matrix }}
      # #9539: the slow pool's leg matrix. Read by `test-slow` directly
      # (`fromJSON`), so the leg count and the file partition are the selector's
      # contract, never a workflow literal — the same rule `fast_matrix` and
      # `carve_matrix` follow. The set is diff-GATED (`slow_run`) and, on
      # tier-2, diff-SCOPED (`slow_selected` intersected per leg) but never
      # diff-SIZED: every run that enters the job runs the same leg count.
      slow_matrix: ${{ steps.push-matrix.outputs.slow_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # tools/ci_selection.py carries the inline >=3.12 guard (#5128). Without
      # this pin the whole selection job refuses on an older ambient python3,
      # and every downstream python-ci job that needs: changes fails with it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The pin also switches `python3` off the runner's ambient interpreter,
      # which ships PyYAML, onto the tool-cache one, which does not --
      # ci_selection.py imports yaml locally, so the dependency must be
      # installed explicitly (same remedy as the manifest-integrity job below).
      - name: Install pyyaml
        run: pip install pyyaml==6.0.2
      - name: Tiered selection
        id: select
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SEL=$(python3 tools/ci_selection.py --event "${{ github.event_name }}")
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            [ -n "$BASE" ] || BASE="origin/main"
            # #3442: ONE canonical question — the merge-base diff — asked of a
            # base commit we have PROVEN is present. The old construction took
            # this diff behind a silenced error and fell back to a two-ref diff
            # of `$BASE` directly. That fallback is a DIFFERENT question — it
            # folds in the base branch's own advances (and, with no merge base,
            # an unrelated history) — so the SAME head could select DIFFERENT
            # tests, and a swallowed failure left the changed set empty, which
            # `select()` maps to the tier-1 smoke set (full=false,
            # slow_run=false, carve_out_run=false): a SILENTLY STRIPPED suite
            # that still reports green. Both holes are closed by failing LOUDLY
            # here instead of selecting on a diff we could not compute.
            if ! git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
              echo "::error::base commit '$BASE' is not present in the checkout — refusing to select on a diff that cannot be computed (#3442)"
              exit 1
            fi
            CHANGED=$(git diff --no-renames --name-only "$BASE...HEAD")
            if [ -z "$CHANGED" ]; then
              echo "::error::'$BASE...HEAD' produced an EMPTY changed set — refusing to certify this head on the tier-1 smoke alone (#3442)"
              exit 1
            fi
            echo "changed files:"
            echo "$CHANGED"
            SEL=$(printf '%s\n' "$CHANGED" | python3 tools/ci_selection.py --changed-files - --event pull_request)
            echo "python=true" >> "$GITHUB_OUTPUT"   # tier-1 smoke runs on every PR
          fi
          echo "selection: $SEL"
          echo "full=$(echo "$SEL" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["full"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "surfaces=$(echo "$SEL" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["surfaces"]))')" >> "$GITHUB_OUTPUT"
          echo "test_files=$(echo "$SEL" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["test_files"]))')" >> "$GITHUB_OUTPUT"
          # #1371: slow files run ONLY in test-slow — single source of truth is
          # config/ci-surfaces.yml (the selector emits them on every path, so
          # this echo is safe for push too).
          echo "slow_files=$(echo "$SEL" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["slow_files"]))')" >> "$GITHUB_OUTPUT"
          # #2147/#2148: the selector emits the diff-gate keys on EVERY path
          # (full selections + tier-2 + docs-only) so these echoes are safe for
          # push too. slow_selected is space-joined BARE names (the
          # test-slow matrix format — no .py suffix) so a leg can case-match it
          # against the matrix.files expression in the tier-2 shape.
          echo "slow_run=$(echo "$SEL" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["slow_run"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "carve_out_run=$(echo "$SEL" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["carve_out_run"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "slow_selected=$(echo "$SEL" | python3 -c 'import json,sys; print(" ".join(x[:-3] if x.endswith(".py") else x for x in json.load(sys.stdin)["slow_selected"]))')" >> "$GITHUB_OUTPUT"
          # #2159 review P2-1: the tier-2 slow legs case-match slow_selected's
          # BARE names against the derived leg rows (matrix.files format),
          # and this tier-2 partial shape had never run in CI when #2148
          # landed — a strip/join format drift (suffix leak, JSON array,
          # newline) would silently empty EVERY leg to a green gate. Fail the
          # changes job (red, not silent-green) if slow_run=true with an
          # empty or non-leg slow_selected.
          #
          # #9539: the leg set is the DERIVED pool (`slow_gating_files()`:
          # slow_files - carve_out - non-gating lane, #10194),
          # not the workflow's old committed rows — it is the same set the
          # run step's per-leg intersection can match against, and it is read
          # from the selector rather than parsed out of the workflow, so the
          # check cannot drift when the leg count changes.
          python3 - "$SEL" <<'EOF'
          import json, sys
          sys.path.insert(0, "tools")
          import ci_selection as cs
          sel = json.loads(sys.argv[1])
          if sel["slow_run"]:
              legs = set(cs.slow_leg_files(cs.load_manifest()))
              entries = {f[:-3] if f.endswith(".py") else f for f in sel["slow_selected"]}
              bad = sorted(entries - legs)
              if bad or not entries:
                  print(f"::error::slow_selected format drift: slow_run=true entries={entries!r} not-in-legs={bad}")
                  sys.exit(1)
          EOF
      - name: Emit push matrix (#1472/#6135)
        # #1472: the push shards are DERIVED from config/ci-surfaces.yml by the
        # selector — registration in the manifest is sufficient, no manual
        # matrix edit (the old hardcoded files: lists are gone). Runs on every
        # event (the test job needs the matrix even on tier-2 PRs, where the
        # split step below overrides it).
        #
        # #6897: the OPT-IN for the pool split arrives as the
        # `CI_SHARD_ROUTING` repo variable — passed to the selector HERE, at
        # STEP scope, and again on the tier-2 `split` step below (both
        # emitters carry the lever; job scope is barred because it sits above
        # the capstone gate step — see the note on this job). Resolved inside
        # the selector (`resolve_shard_routing`) rather than in an expression,
        # so the mode has exactly one implementation and
        # `tests/test_ci_selection.py` can pin it. Unset/any other value =
        # hosted-only.
        #
        # #6135: the emitted `fast_matrix` is the COMPLETE GHA matrix object
        # (`{include: [...]}`) — one entry per shard, each carrying its own
        # `files` (space-joined), `watchdog_minutes`, `watchdog_headroom` (the
        # margin that budget retains, #6145 — reported, not consumed here) and
        # `canary_producer`. The
        # shard COUNT is `config/ci-surfaces.yml::fast_shards`, and the count
        # of include rows is whatever the selector emits — nothing here counts
        # shards.
        # #6897: emitter #1 of 2 — the other is `split` below, and BOTH must
        # carry the mode or a tier-2 PR silently resolves to hosted-only.
        id: push-matrix
        env:
          CI_SHARD_ROUTING: ${{ vars.CI_SHARD_ROUTING }}
        run: |
          MATRIX=$(python3 tools/ci_selection.py --emit-push-matrix)
          # #1472 regression fix: SPACE-JOINED strings inside the matrix (the
          # old hardcoded `files: >-` format). fromJSON(...) yields a JS array,
          # which renders as "Array" in the shell `for f in the matrix.files expression`
          # loop (template-context toString) — every full-matrix run collected
          # tests/Array.py. json.dumps keeps the object on one GITHUB_OUTPUT
          # line (multi-line would need the heredoc form).
          echo "fast_matrix=$(echo "$MATRIX" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["fast_matrix"]))')" >> "$GITHUB_OUTPUT"
          # Epic #1647 Task 9: the embedded carve-out leg (E2E-4) — excluded
          # from every docker shard by the selector.
          echo "carve_out=$(echo "$MATRIX" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["carve_out"]))')" >> "$GITHUB_OUTPUT"
          # W37: the carve-out pool's matrix — the same `carve_out` set packed
          # into `config/ci-surfaces.yml::carve_shards` LPT bins. Emitted the
          # same way as `fast_matrix` (one JSON GITHUB_OUTPUT line, so the
          # template-context toString hazard above applies identically).
          echo "carve_matrix=$(echo "$MATRIX" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["carve_matrix"]))')" >> "$GITHUB_OUTPUT"
          # #9539: the slow pool's matrix — `slow_gating_files()` packed into
          # `config/ci-surfaces.yml::slow_shards` LPT bins by the same `durations`
          # map the fast band uses. Emitted like the two above (one JSON line).
          echo "slow_matrix=$(echo "$MATRIX" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["slow_matrix"]))')" >> "$GITHUB_OUTPUT"
      - name: Non-gating lanes — what this gate does NOT run (#10194)
        # #10194: a MEMBERSHIP change is invisible in a CI log unless the log
        # says what left it. "the evals aren't running" and "the evals are
        # excluded on purpose" read identically from a green run, so this prints
        # the non-gating lane (each entry → its resolved file count) and the
        # shard → file-count map the run is about to expand. A reader can then
        # SEE that `tests/eval/**` + `tests/longmem_eval/**` are absent from all
        # nine shards instead of inferring it from a total.
        #
        # Report-only on purpose: it reads the same `push_legs()` derivation the
        # matrix step above emits, and it exits 0 on every path. The gate on this
        # exclusion is the guard test (tests/test_10194_eval_suite_non_gating.py)
        # plus `--integrity`, not a log line.
        run: python3 tools/ci_selection.py --non-gating-report
      - name: Tier-2 duration split (#1473)
        # #1473/#6135: LPT-pack the tier-2 selected files across the configured
        # shard count by measured duration (config/ci-surfaces.yml durations)
        # instead of the duration-blind parity split — a heavy matched surface
        # can no longer dump most of its runtime on one shard. Only on PRs with
        # a tier-2 selection (full=false); the full-matrix path uses the push
        # matrix. The emitted shard COUNT is the configured `fast_shards` for
        # EVERY selection size — a shard with no files exits early, while a
        # MISSING shard would make the PR's leg set incomparable to main's for
        # the merge rail's lane-parity (#6135).
        # NOTE: reads steps.select.outputs.test_files — the split runs INSIDE
        # the changes job, so `needs.changes` (the job's own output) is
        # ALWAYS empty and would crash --split with empty stdin (#1492).
        # #6897: emitter #2 of 2. This output OVERRIDES the push matrix on
        # tier-2 PRs (`outputs.fast_matrix`), so without the mode here the
        # opt-in is dead on exactly the event type every PR uses — measured on
        # head `3db8f7d78`, which carried it on the push step alone.
        id: split
        if: github.event_name == 'pull_request' && steps.select.outputs.full == 'false'
        env:
          CI_SHARD_ROUTING: ${{ vars.CI_SHARD_ROUTING }}
        run: |
          SPLIT=$(echo '${{ steps.select.outputs.test_files }}' | python3 tools/ci_selection.py --split)
          echo "fast_matrix=$(echo "$SPLIT" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["fast_matrix"]))')" >> "$GITHUB_OUTPUT"
      # The manifest drift gate used to run HERE. It moved to its own peer job
      # (`manifest-integrity`) — #2656. Living in `changes`, which every other
      # job needs, meant one missing manifest line SKIPPED the entire test
      # matrix and hid all test signal behind a bookkeeping miss: twice on
      # 2026-09-10/11 (#2868 parity files, #2911 price-basis — the second also
      # blocked verification of the #2904 fork fix).
      #
      # The check itself is unchanged and still blocks the merge — it just no
      # longer withholds the tests. python-ci-gate lists `manifest-integrity`
      # in its needs, so a drift still reds the required aggregate check, by
      # name, while the suite runs and reports real signal.
      - name: "Capstone pre-registration gate — the ordering half (#9075)"
        # #9075 review r6 P1: the gate's git half was UNREACHABLE from every automated path. The
        # ordering/exemption bounds need add-commit epochs, the `test` job checks out at
        # `fetch-depth: 1` (so the gate reports them UNPROVABLE), and no workflow invoked the gate
        # at all — so a grandfathered log could be edited in place with a measurement number and
        # every gate stayed green. This step gives it the history it reads: `changes` is the one job
        # that checks out at `fetch-depth: 0`, it already owns pyyaml, and the run is ~2s.
        #
        # `--no-corpus` on purpose: the corpus half imports `tortoise` (and therefore the package
        # dependencies this job does not install). It runs in the `test` job, through
        # `tests/test_capstone_preregistration_9075.py`, which is `core`+`tier1` — and the report
        # SAYS the half was skipped (`corpus pins NOT checked`), so a partial run can never read as
        # a verified one. The step fails closed: exit 1 on an ordering violation, 2 on an
        # unreadable document/record.
        run: python3 tools/capstone_preregistration_check.py --dir docs/evidence/7949-capstone --no-corpus
      - name: Secrets scan (evidence artifacts, #1349)
        # Evidence commits (T8/T15/T16) must never carry live keys. The
        # provenance writer redacts (primary defense); this grep is the
        # backstop on every event. Matches key VALUES (sk-or-/sk-ant-/sk-…)
        # and env-var-name-with-assignment (OPENROUTER_API_KEY=…) — NOT the
        # bare env-var name, which legitimately appears in docs/code. Fail
        # on match; <1s.
        run: |
          if grep -rInE '(^|[^A-Za-z0-9])(sk-or-[A-Za-z0-9_-]{16,}|sk-ant-[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,})|OPENROUTER_API_KEY[[:space:]]*[=:][[:space:]]*[A-Za-z0-9_-]{16,}' \
            docs/research/2026-08-17-1349-embedder-selection/ docs/plans/2026-08-17-1349-embedder-selection.md docs/adr/ADR-009-embedder-selection.md docs/scoping/2026-08-17-1349-embedder-selection-scoping.md tests/eval/retrieval/ tests/fixtures/labeled_pairs.jsonl tools/mini_beir/ tools/longmem_eval/ 2>/dev/null; then
            echo "::error::key-like pattern found in committed evidence artifacts (redact before merge)"
            exit 1
          fi
          echo "secrets scan clean"

  manifest-integrity:
    # #2656: the manifest drift gate, as a PEER of the test matrix instead of a
    # prerequisite of it. It used to be a step inside `changes`, and every other
    # job has `needs: changes` — so a drift made GitHub mark the whole matrix
    # "skipped" (not failed: never run), which is why a one-line bookkeeping
    # miss in one lane could stop another lane's fix from being verified.
    #
    # Splitting it out keeps BOTH properties:
    #   * the tests still run, so a red run tells you about the code; and
    #   * a drift still fails loudly and still blocks the merge, because
    #     python-ci-gate (the required aggregate) lists this job in its needs.
    # Cost: one extra job (~20s: checkout + setup-python + pyyaml), against a
    # 25-minute suite that used to be silently withheld.
    #
    # Unconditional on every event (push/PR) — same as before. Needs
    # pyyaml only: tools/ci_selection.py imports it locally.
    #
    # timeout-minutes: this job now owns a network install (`pip install
    # pyyaml`) AND feeds the REQUIRED aggregate check — without a bound, a
    # stalled PyPI would hold python-ci-gate red for hours on every PR.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyyaml
        # Pinned: this job feeds the REQUIRED aggregate check, so an unpinned
        # dependency would make an upstream release a repo-wide merge blocker.
        run: pip install pyyaml==6.0.2
      - name: "Manifest integrity (drift gate, #1262)"
        # Fail-closed, ~2s. rglob (recursive) since #1349 so subdir test files
        # are drift-checked; tests/e2e/ is deliberately exempt
        # (welcome-e2e-monitor + legal-e2e + ENV_BROKEN_FILES cover those 17).
        run: python3 tools/ci_selection.py --integrity
      - name: "Mergify protection invariants (config guard, #5215)"
        # #5215 Task 4: the merge-throughput plan's safety contract is mechanical.
        # This runs the static clauses (i)-(viii) the plan's §3 asserts — exit 0
        # SATISFIED, 1 DIVERGED, 2 UNAVAILABLE. Fail-closed: an unrecognised
        # injection mode, a duplicate YAML key, an unresolvable workflow parse, or
        # an absent gate record is NEVER a pass. It is REQUIRED from its landing
        # commit (no continue-on-error, no soak): its clauses are green on the
        # current tree, so a red here is a real divergence, not a rollout problem.
        # A wrong clause is fixed by an ordinary PR (edit the clause body; the
        # clause inventory is unchanged), never by `--admin` (§2.2 T-K).
        #
        # A DIRECT invocation with no shell operator, so a non-zero exit
        # propagates (§11.1: `|| true` / `; exit 0` would make the criterion
        # vacuous). The step-shape contract is pinned in
        # tests/test_mergify_config_guard.py::test_mutation_removing_the_guard_step_would_remove_the_enforcement.
        run: python3 tools/mergify_config_guard.py --static
      - name: "Registry integrity (union merge fails closed, #5373)"
        # `config/ci-surfaces.yml` and `config/surface-manifest.yml` carry
        # `merge=union` in .gitattributes: two lanes appending a new entry to the same
        # anchor no longer produce a manual conflict, and union is a git BUILT-IN, so
        # no clone needs driver config. But union is LINE-level and will just as
        # happily emit a duplicate mapping key or a duplicate entry — and
        # `yaml.safe_load` silently keeps the LAST duplicate, so no existing consumer
        # can see it. This step is the validator that pairing requires: a duplicate
        # key, a duplicate entry, or a malformed document FAILS here. Fail-closed,
        # <1s, no dependency beyond the pyyaml installed above.
        run: python3 tools/registry_integrity.py

      - name: "Required-set sync (#6144)"
        # The required-status-check set is declared in three places — live
        # branch protection, `.mergify.yml`'s `queue_conditions` /
        # `merge_conditions`, and the declarative branch-protection mirror — and
        # nothing read two of them. (The mirror is named INDIRECTLY on purpose:
        # I11's undeclared-reader scan is a BYTE scan, so naming its path in a
        # comment here is indistinguishable from a tool that READS it, and the
        # fix for that is not to exempt this workflow — which would blind the
        # scan to a real reader added to it later — but to not spell the path in
        # prose.) `.mergify.yml` stated the invariant in a COMMENT with a
        # hand-maintained "Last reconciled …" line; a comment cannot fail.
        #
        # Hosted in THIS job because it is the same class of check as the
        # manifest drift gate beside it: a cheap, unconditional, fail-closed
        # assertion about repo config, whose red must block a merge. It adds
        # no new required context and no new workflow — it rides the aggregate
        # that is already required.
        #
        # Offline by default (no `--live`: reading branch protection needs
        # admin scope, and `GITHUB_TOKEN` cannot). `--live` is the owner/rail
        # check. Exit 2 = could not measure, which is NOT a pass.
        run: python3 .github/scripts/check-required-set.py

      - name: "Harness single source — operations/orchestrator-harness/ is a POINTER (#8246)"
        # `operations/orchestrator-harness/` was retired to a pointer at
        # agent-infra/scripts/orchestrator-harness/ (see its README). Measured 2026-10-19, before
        # consolidation, the SAME eight files existed in three copies that had all diverged — this
        # repo's was behind on five and AHEAD on `lane.sh`, and every fix had to be hand-applied in
        # 3-4 places.
        #
        # ⛔ ENFORCED HERE, NOT IN A WORKFLOW OF ITS OWN (review finding — the fail-open). The guard
        # used to live in `.github/workflows/harness-single-source.yml`, which was wrong on two
        # counts: (1) a PATH-SCOPED workflow can never be a required context — it does not run at
        # all on a PR that touches none of its paths, so a `check-success=` gate on it would block
        # every unrelated merge, which is why it was in neither branch protection nor `.mergify.yml`
        # and a red on it blocked nothing; and (2) a new workflow also moves
        # `tools/mergify_config_guard.py`'s gate digest for no enforcement gain. Hosted in THIS job
        # for the same reason the required-set sync above is: it is a cheap, unconditional,
        # fail-closed assertion about repo state whose red must block a merge, and it rides the
        # aggregate (`python-ci-gate`) that is already required. No branch-protection change, no new
        # required context, no new workflow.
        #
        # The NON-VACUITY arms are not decoration: a guard nobody has seen fire is indistinguishable
        # from a guard that cannot fire, and this one had a real fail-open (a failed `git ls-files`
        # read as an empty directory and printed "ok"). Each arm below exits 2 today if the guard
        # regresses to its pre-fix behaviour, so the arms are pinned from both sides.
        run: |
          set -euo pipefail
          # 1) The intended state.
          bash tools/check-harness-fork.sh operations/orchestrator-harness

          # 2) A planted script is REFUSED (1).
          printf '#!/bin/sh\n' > operations/orchestrator-harness/lane.sh
          rc=0
          bash tools/check-harness-fork.sh operations/orchestrator-harness || rc=$?
          rm -f operations/orchestrator-harness/lane.sh
          [ "$rc" -eq 1 ] || { echo "FAIL: a reappearing harness script must exit 1, got $rc"; exit 1; }

          # 3) A missing pointer directory is UNKNOWN (2), not a pass.
          rc=0
          bash tools/check-harness-fork.sh /nonexistent-retired-path || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: an uncheckable location must exit 2, got $rc"; exit 1; }

          # 4) AN UNREADABLE INDEX IS UNKNOWN (2), NOT AN EMPTY DIRECTORY. This is the fail-open the
          #    review reproduced: `git ls-files … 2>/dev/null` with the exit status ignored printed
          #    "ok: … a pointer, not a copy" and exited 0 over a directory full of harness scripts.
          printf 'garbage' > /tmp/harness-guard-index
          rc=0
          GIT_INDEX_FILE=/tmp/harness-guard-index bash tools/check-harness-fork.sh \
            operations/orchestrator-harness || rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL: a broken index must exit 2 (never a pass), got $rc"; exit 1; }

          # 5) NON-CANONICAL SPELLINGS of the same CLEAN directory must not read as a fork. Each of
          #    these exited 1 before the normalisation, naming the deliberately allowed
          #    `merge-one.sh` as a fork — a false block an operator typing a trailing slash would hit.
          for d in ./operations/orchestrator-harness operations/orchestrator-harness/ \
                   "$PWD/operations/orchestrator-harness"; do
            rc=0
            bash tools/check-harness-fork.sh "$d" || rc=$?
            [ "$rc" -eq 0 ] || { echo "FAIL: '$d' is the clean pointer but exited $rc"; exit 1; }
          done

          # 6) The pointer still names a LIVE location, so a rename of the canonical path is caught
          #    here instead of by a confused operator. Not a content comparison — tortoise CI has no
          #    business cloning agent-infra on every PR.
          grep -q 'agent-infra.*scripts/orchestrator-harness' operations/orchestrator-harness/README.md \
            || { echo "FAIL: the pointer no longer names agent-infra/scripts/orchestrator-harness/"; exit 1; }

  test:
    # #880: split into parallel shards (matrix). #6135: the COUNT is
    # `config/ci-surfaces.yml::fast_shards` and the shape is the selector's
    # `fast_matrix` output — this job carries no literal shard list.
    # The fast suite's pytest
    # session is ~28 min but the atexit teardown of ~200 leaked embedded
    # redislite servers adds 15+ min on loaded CI runners (each close has
    # 10s timeouts), pushing the single job past every watchdog we set
    # (32/36/40/46m all hit exactly at the boundary). Two parallel jobs
    # halve per-job server count (atexit ~8 min) and overlap collection —
    # wall time drops to ~max(half) ≈ 22-25 min. Watchdog 45m (raised to 55m when R3 corpus growth pushed legs past 45m)
    # (2026-08-14): on HF-unreachable/loaded runners the half + redislite
    # teardown exceeded 30m (1223 passed then watchdog kill) — 55m fits
    # under test-slow's 60m outer cap.
    needs: changes
    if: needs.changes.outputs.python == 'true'
    # ── #6897: the fast matrix CAN split across both runner classes ──────────
    # ⛔ OFF BY DEFAULT. The pool is **fallback-only** by recorded decision
    # (`docs/ops/ci-runner-x64.md` -> "Contradiction test",
    # `scripts/ci_runner_gate.sh:1-30`): jobs landing on local hardware compete
    # with the agent fleet and the Tortoise graph. An earlier cut of this change
    # made the pool a PRIMARY class for 4 of 9 gated shards by default, which is
    # an adoption over that decision — so the split is now an explicit opt-in
    # and the default is main's behaviour, verbatim.
    #
    # WHY THE DEFAULT STAYS OFF, measured (PR #10186 review, 2026-10-30):
    # run 40981781885 on MAIN (plain `ubuntu-latest`) saw the pool win 5 of 9
    # legs by the fallback race and **5 of 5 die at their watchdog**, while 4 of
    # 4 hosted legs passed in 10-12 m of a 20 m budget; the x64 cells measured
    # ~2.7x hosted at job level, not the 1.16x an older run suggested. On head
    # 5a2ae6aa1 (run 40986603502) 3 of 4 pool legs failed — and two of those
    # were not budget kills but `redis.exceptions.ConnectionError: Error 111 ...
    # localhost:6379`, i.e. the pool host not serving the FalkorDB every
    # docker-lane shard needs. A class that cannot complete the work is not
    # capacity. Changing that default is #6897's decision to reopen, not this
    # diff's to take.
    #
    # THE LEVER: `CI_SHARD_ROUTING` (Settings -> Variables) is read by the
    # `changes` job and resolved in `tools/ci_selection.py` (ONE place, so it is
    # unit-tested rather than living in a shell expression).
    # `CI_SHARD_ROUTING=pool-split` opts IN: odd shards -> `[self-hosted,
    # self-hosted-x64]` (x64 ONLY — 4.46x hosted on the ARM64 VMs vs far less on
    # the x64 cells, 654 common testcases, run 40238275534 vs 40249711042), even
    # shards + the LAST one stay on `ubuntu-latest`. Unset, empty, `hosted-only`,
    # or anything unrecognised -> EVERY row is `ubuntu-latest`, which is exactly
    # what main does. That is deliberate: a typo or an unavailable `vars` must
    # fail SAFE, never onto the contended class.
    #
    # The last shard is the `canary_producer` the streak compares across runs, so
    # it keeps the label it has always used in either mode.
    #
    # ⛔ NAMED RESIDUAL (opt-in mode only, and not fixed here): the split's
    # non-pool rows are `ubuntu-latest`, which on this repo is NOT hosted-only —
    # `scripts/ci_runner_gate.sh` attaches it to the self-hosted pool as a
    # FALLBACK, and #6897 measured it attached while GitHub-hosted was healthy.
    # That fired for real on head 5a2ae6aa1: `test (i)` — the CANARY — was taken
    # by `pi-runner-vm-5` (ARM64) and killed at 32 m 12 s. `ubuntu-24.04` is the
    # hosted-only label that would close it, and moving the hosted half to it is
    # a separate decision (it also drops the outage fallback and breaks
    # comparability with the canary streak's history) — filed on #6897, not
    # taken here. In the DEFAULT mode this residual is main's own, unchanged.
    #
    # `runs-on` has no logic of its own: it parses the per-row `runner` the
    # selector emitted, so the mode cannot drift between the two — there is no
    # second place to edit.
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      # #6135: the WHOLE matrix is the selector's output — the shard count
      # (`config/ci-surfaces.yml::fast_shards`) and the leg names are derived,
      # and neither is written here. `include` rows carry `half` (the positional
      # letter label), `files` (space-joined bare names), `watchdog_minutes`
      # (per-leg budget), `watchdog_headroom` (the margin that budget retains,
      # #6145) and `canary_producer` (the one shard whose artifacts
      # feed the canary streak). The labels MUST stay a, b, c, … — the merge
      # rail's lane-parity is a name subtraction, so an S-adding diff has to be
      # a SUPERSET of main's `test (a)`, `test (b)`.
      # #6897: rows also carry `runner` — the `runs-on` label array as a JSON
      # string, consumed ONLY by this job's `runs-on` above. Under the default
      # (`hosted-only`) every row carries `["ubuntu-latest"]`, so this job is
      # main's, row for row; the split appears only when an operator opts in
      # with `CI_SHARD_ROUTING=pool-split`.
      matrix: ${{ fromJSON(needs.changes.outputs.fast_matrix) }}
    name: test (${{ matrix.half }})
    # Outer cap: setup (checkout+install+cache) + manifest collect-only
    # (epic #1647 Task 6 — every shard runs a full-list --collect-only step
    # BEFORE pytest, off the watchdog) + the shard's watchdog + SIGINT grace
    # (10s) + tail print.
    # #6135: the OUTER cap is not the watchdog. The per-shard watchdog is the
    # `timeout -s INT -k 10 ${{ matrix.watchdog_minutes }}m` in the pytest step,
    # sized to that shard's own packed estimate — a 6.6-minute shard is killed
    # at the floor (`WATCHDOG_FLOOR_MIN`, currently 19m), not 55m, so a hung small
    # shard cannot hold the required aggregate red for the old budget. ⛔ The
    # floor is DERIVED in `tools/ci_selection.py`: read it there rather than
    # trusting this comment, because restating a fixed number as a fact is how
    # the previous "15m" here went stale when the floor moved.
    #
    # #6142: the last-failed PRE-PHASE adds a second bounded pytest run before
    # the gating one, so this outer cap must cover
    # ~7m setup + <=10m pre-phase + the shard's own watchdog + ~10s grace +
    # tail. 90m covers that worst case with margin, so the gating run can never
    # be cut short by the runner cap on a push that carries last-failed state
    # (the pre-phase's own 10m watchdog bounds the extra wall — see the run
    # step). This outer cap therefore bounds SETUP plus the pre-phase, not a
    # fixed 55m gating budget.
    timeout-minutes: 90
    # ⛔ PER-RUNNER ARTIFACT PATHS, NOT `/tmp/...` (measured 2026-10-25).
    #
    # Every pytest artifact this job writes used to be a GLOBAL literal under
    # `/tmp`. On a GitHub-hosted runner that is harmless — the VM is the job's.
    # On this repo it is NOT: `scripts/ci_runner_gate.sh` attaches
    # `ubuntu-latest` to the self-hosted pool, and several runner INSTALLS on one
    # host share ONE `/tmp` (measured: a `pi-runner-vm-2` job's own shell ran
    # under `/home/…/actions-runner-2`, while its `tail /tmp/pytest.log` printed
    # an `actions-runner-4` session header — another job's file), so a
    # concurrently scheduled leg truncates and interleaves this one's log.
    #
    # Three consequences, all observed on run 40238275534 and its siblings:
    #   * the heartbeat counter is another leg's (`test (g)` reported
    #     `433 passed` → `21 passed` → `416 passed` on consecutive ticks, which
    #     one pytest session cannot do);
    #   * a WATCHDOG kill's `grep -c PASSED` counts, its tail and the
    #     `pytest-attribution.sh` in-flight list describe a DIFFERENT shard, so
    #     the leg cannot name what it was doing when it died;
    #   * #7815's skip-fail guard reads `expected-nodeids.txt` / `junit.xml`
    #     written by another job, and reports a manifest mismatch that belongs to
    #     no test this leg ran.
    #
    # `runner.temp` is `<runner_install>/_work/_temp`, and a self-hosted runner
    # executes ONE job at a time, so this is per-JOB unique even when the host is
    # shared. It is what `.github/scripts/pytest-attribution.sh` names as the
    # durable fix for its own "NAMED RESIDUAL" (its three ownership signals
    # exist only because the path is global).
    #
    # The rc / files / hygiene reports next to these already moved to
    # `${RUNNER_TEMP}`; this finishes the migration for the artifacts the
    # verdict and the guards are read from.
    #
    # ⛔ NOT AS A JOB-LEVEL `env:` BLOCK. `runner` is not an available context
    # at `jobs.<job_id>.env` (the allowlist there is github, needs, strategy,
    # matrix, vars, secrets, inputs), so `${{ runner.temp }}` is rejected by
    # actionlint on all six lines. The consequence is NOT a mis-pathed
    # artifact — it is #6253's case: GitHub refuses the WHOLE file, so the run
    # has ZERO jobs and zero check-runs, and the required `python-ci-gate` is
    # ABSENT rather than red on that head (measured on this PR's own earlier
    # head: runs 40273900256 / 40274365152, `total_count: 0`). The paths are
    # therefore resolved in the FIRST step of the job below, from `$RUNNER_TEMP`
    # (the shell's alias of the same value, which IS available in a step), and
    # published to every later step through `$GITHUB_ENV`: shell steps read
    # `$PYTEST_LOG`, the quoted heredocs read `os.environ[...]` (a quoted
    # heredoc does not expand), and the `upload-artifact` `path:` lists use
    # `${{ runner.temp }}` directly, because `jobs.<job_id>.steps.with` DOES
    # allow the `runner` context.
    # #1436: provision live FalkorDB so the ~72 live-required tests (test_ep_directional
    # et al.) actually RUN in the fast matrix instead of silently skipping (CI was
    # green while EP tests never ran — masked #1382). Two services cover BOTH probe
    # families: the passworded docker://:falkordb@localhost:6379 URIs and the legacy
    # passwordless docker://:@localhost:16379 URIs (test_search_engine / test_ingest /
    # test_session_capture_e2e / the 16379 candidates in test_hnsw_vector_index and
    # test_integration_search). Unlike test-concurrency-falkor / test-track-b —
    # which carry only the passworded service — this job keeps BOTH, now started
    # on ephemeral host ports instead of a `services:` block (#6673).
    # NO job-level TORTOISE_DB_URI: the ~600 embedded tests need the redislite default;
    # the live tests' probes read the provisioned ports from tests/_live_utils.py.
    # Cost, MEASURED on main run 36736931554 across all nine shards: 5-14s each
    # (a=5 b=7 c=14 d=13 e=8 f=13 g=8 h=8 i=8). That is the composite action
    # below — NOT a `services:` block. A much larger per-shard figure stood
    # here and described the runner-side `initialize_containers` cost of the OLD
    # `services:` block; #6673 removed that block but left the figure behind,
    # and W15 then read it as a live cost and priced it into a shard-isolation
    # proposal — #6785 holds the measurement that refuted it.
    # Isolating the docker-seam files into their own shard is therefore NOT
    # worth doing: the saving is bounded by that ~9s, while concentrating their
    # ~317s of measured duration risks a NEW long pole (the nine shards ran
    # 163-523s in that same run, so the packer's estimate already spreads 3x).
    # The skip-fail guard step below fails closed if they skip.
    # #6673: the two FalkorDB services used to be declared HERE as a `services:`
    # block on the fixed host ports 6379:6379 / 16379:6379. They are now started
    # by `.github/actions/falkordb-provision` (see the first FalkorDB step
    # below) on EPHEMERAL host ports, because every self-hosted runner on this
    # host shares ONE Docker daemon: a fixed host port is a single global
    # namespace, so two services jobs overlapping made the second container's
    # `docker start` fail with "Bind for 0.0.0.0:6379 failed: port is already
    # allocated" — which aborts the RUNNER in its `initialize_containers`
    # pre-step and reds the job in ~9s with ZERO tests run (a false red).
    # The image pin, the `--requirepass falkordb --save ''` REDIS_ARGS pair, the
    # passwordless legacy lane and the health gate all moved with it. The two
    # probe families are unchanged; the ports are now
    # $TORTOISE_TEST_DOCKER_PORT (passworded) and $TORTOISE_TEST_LEGACY_PORT
    # (legacy), read by tests/_live_utils.py.
    # #964: "no job activity" has two distinct causes, neither of which is a
    # missing timeout (timeouts have existed since #798/#880): (1) pytest
    # output is buffered to this job's own `$PYTEST_LOG` (`<runner.temp>/
    # pytest.log` since #10028) so the job log shows NOTHING for
    # 25-50 min — the heartbeat in the run step below now surfaces liveness;
    # (2) a "pending" run is the GitHub runner QUEUE (main runs serialize via
    # the concurrency group; a backlog of merges queues them) — queue wait is
    # not a job hang and cannot be fixed in-repo.
    steps:
      # ⛔ FIRST STEP ON PURPOSE. Every later step reads these six variables,
      # and `$GITHUB_ENV` only reaches SUBSEQUENT steps — so this has to run
      # before anything that names a pytest artifact. `RUNNER_TEMP` is set by
      # the runner for every step; failing closed on it (rather than falling
      # back to `/tmp`) is the whole point of the change: a silent `/tmp`
      # fallback is indistinguishable from the bug being fixed.
      - name: Resolve per-job pytest artifact paths (#10028)
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:?RUNNER_TEMP is not set — refusing to fall back to a host-global /tmp artifact path}"
          {
            echo "PYTEST_LOG=$base/pytest.log"
            echo "PYTEST_JUNIT=$base/junit.xml"
            echo "PYTEST_JUNIT_LF=$base/junit-lf.xml"
            echo "PYTEST_MANIFEST=$base/expected-nodeids.txt"
            echo "PYTEST_STEP_WALL=$base/step_wall.txt"
            echo "PYTEST_CANARY=$base/canary-producer.json"
          } >> "$GITHUB_ENV"
          echo "pytest artifacts for this job are under $base (per-job, not the host /tmp)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires-python >= 3.12
      - uses: actions/setup-node@v4
        # #4620: the two installed-artifact checks in
        # tests/test_pi_capture_hooks.py FAIL (rather than skip) when node is
        # absent or below the default-on type-stripping floor (22.18), so this
        # lane owns the toolchain they require instead of inheriting it from the
        # runner image — same ruling as the embedder step below and the existing
        # setup-node pin in ci.yml (whose comment records the two floors:
        # `.ts` type stripping + syntax detection is DEFAULT-ON from 22.18, and
        # this suite's `node --test` passes no `--experimental-strip-types` flag).
        with:
          node-version: '22'
      - name: Cache uv + pip dependency caches (#7612)
        # #7612: the runners are EPHEMERAL (ubuntu-latest) and nothing cached the
        # dependency caches, so every job resolved and downloaded its deps from
        # cold on every run. This step sits BEFORE install-cpu-torch so that the
        # LARGER cold download is served from cache too (torch: 140 wheels,
        # ~3.2 GB, 93-219s per job, per that action's own measurement) — not just
        # the `Install package + test extras` step it originally targeted
        # (measured 26-47s x 16 expanded instances, run 37547203551).
        # Why this cannot change what CI catches: a warm cache only supplies
        # already-downloaded artifacts. In THIS job `uv sync --frozen` still runs
        # afterwards and enforces uv.lock, so the installed versions are
        # unchanged. Reverting this step costs wall-clock only.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: uv-pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-pip-${{ runner.os }}-
      - uses: ./.github/actions/install-cpu-torch
      - name: Install package + test extras
        # embeddings extra required at COLLECTION time: test_gmm_proofs.py,
        # test_embeddings.py, test_cross_lens.py, test_sdk_group3.py import
        # sklearn at module scope (post-merge-validation.yml installs
        # '.[embeddings]' for the same reason).
        # uv: test_battery_corpus.py::test_builder_determinism_cross_process
        # shells out to bare `uv run` (default groups = dev included) to build
        # the corpus in subprocesses with different PYTHONHASHSEED — the runner
        # has no uv by default. Pre-warm the FULL uv project env (uv sync
        # --frozen, dev group included) so the test's `uv run` is a genuine
        # no-op instead of a cold 1-3 min sync inside its 300s subprocess
        # timeout. (--no-dev here would mismatch the bare `uv run` consumer and
        # force a dev-group re-sync in the subprocess.)
        run: |
          pip install -e '.[test,embeddings]' uv
          # #1917 (CI unblock): some ubuntu-latest runner images ship a stale
          # workspace .venv that uv refuses to touch (uv #13986 / #9423 —
          # "failed to create directory .venv: File exists"), failing every
          # PR's fast-test legs at setup. Remove it so uv sync recreates the
          # pre-warmed env (same result, tolerant of the stale dir).
          rm -rf .venv
          uv sync --frozen
      - name: Reap ABANDONED redislite litter (#1005 / #3653)
        # #1005: leaky runners accumulate redislite tempdirs from every failed
        # embedded-redis run — discover() then skips its stale-socket walk
        # (>5000 entries), so the reaper chaos tests fail with "orphan not
        # cleaned". Reap strays before the suite.
        # #3653: it used to be `pkill -f "redis-server unixsocket"`, which
        # matches EVERY redislite on the box. This matrix runs up to four such
        # legs per workflow and its own orphan gate has measured ten other live
        # suites on one host (`other_suites=10`), so a leg that started later
        # killed a concurrent leg's live instance — redislite unlinks its socket
        # on that SIGTERM, and the victim then reddened with "redis.socket … No
        # such file or directory" on a diff it never touched. The replacement
        # reaps only on a PROOF that no running leg can own the server (its
        # socket dir is gone, or it is older than the widest leg watchdog) and
        # KEEPS every case it cannot measure.
        # Best-effort like the find below: a cleanup that cannot run must not red
        # a leg, and a leak it fails to reap is the orphan gate's to report.
        run: |
          python3 .github/scripts/reap-redislite-orphans.py --apply || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        # ~130MB; persisted so the pre-cache step below is a no-op on
        # subsequent runs and CI never re-downloads from huggingface.co.
        # Cache key v2 (#1349 T10): the v1 cache holds all-MiniLM-L6-v2 and
        # must never serve bge-small runs — a v1 restore would silently
        # exercise the WRONG embedder.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Embedding model REQUIRED (BAAI/bge-small-en-v1.5) — dense retrieval leg
        # #2573: this step OWNS "the embedder is required". It exits non-zero when
        # the pinned model cannot be obtained, with a named ::warning::/::error::
        # annotation and a step-summary block — so a runner without the dense leg
        # fails HERE, by name, instead of silently running the keyword-only TF-IDF
        # fallback (tortoise/embeddings.py) and reporting a green pass.
        #
        # `continue-on-error: true` was deliberately REMOVED. That is safe because
        # the step is now genuinely able to obtain the model: the old inline probe
        # set HF_HUB_OFFLINE=1 before importing sentence_transformers, and
        # huggingface_hub freezes that variable at import, so its download retries
        # could never reach the network. With the probe scoped to
        # `local_files_only=True` a cold cache really does download (verified
        # end-to-end), so a failure here now means the model is genuinely
        # unobtainable — and the honest outcome is a red, ATTRIBUTED run rather
        # than the cascade #3760's fail-closed skip-guard would otherwise produce.
        #
        # #964: the step-level timeout still bounds a hung download (stalled TCP,
        # no error raised) that would otherwise stall the step for the full job cap.
        env:
          # #7359: the watchdog only DUMPS (exit=False) — it cannot fail a run. Below the
          # cap so the dump lands before the runner's kill; above the `--attempts N
          # --backoff S` budget so it does not fire during legitimate retry sleeps.
          TORTOISE_EMBEDDER_WATCHDOG_S: "330"
        timeout-minutes: 6
        run: |
          exec python3 tools/embedder_provision.py --attempts 3 --backoff 5
      - name: Provision FalkorDB services on ephemeral host ports (#6673)
        # #6673: replaced this job's `services:` block. The assigned ports land
        # in $TORTOISE_TEST_DOCKER_PORT / $TORTOISE_TEST_LEGACY_PORT, which
        # tests/_live_utils.py turns into the two probe-family URIs. `uri_graph`
        # is deliberately EMPTY here: the ~600 embedded tests need the redislite
        # default, so this job must not hand the whole suite a URI. Paired with
        # the teardown step at the end of the job.
        uses: ./.github/actions/falkordb-provision
      - name: Compute docker URI (epic #1647 Task 9 — P3 flip)
        # D-3=A (the P2 flip) + Task 9 Step 1 (the P3 flip): BOTH fast
        # halves run on the provisioned passworded falkordb service (above)
        # via a job-level TORTOISE_DB_URI; the embedded lane is retired from
        # the main test job (the carve-out files moved to the dedicated
        # URI-unset carve-out job — E2E-4). The matrix include cannot
        # condition on `full` (plan-review P1-7), so the URI is computed
        # run-step-local: full==true -> URI + EXPECT_URI on BOTH halves (the
        # E2E-6 tripwire signal, cycle-6 P1-2/FM-3); every other shape
        # (tier-2 PR) -> empty both, so the tripwire never fires on the
        # tier-2 shape. The URI carries a test-prefixed path (cycle-2 P1-2):
        # a path-less job URI would resolve the URI-default graph `tortoise`
        # and every URI-default DETACH DELETE would trip _assert_test_graph
        # — /tortoise_test_matrix is guard-passing.
        run: |
          URI=""
          EXPECT_URI=""
          CARVE_OUT=""
          SWEEP_TEAM_STRAYS=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            URI="docker://:falkordb@localhost:${TORTOISE_TEST_DOCKER_PORT:?the #6673 provision step did not export it}/tortoise_test_matrix"
            EXPECT_URI="1"
            # #1886 (issue #1884): the docker lane is a DEDICATED fresh-per-
            # job container — the journal-blind team_* stray pass is safe
            # here and stays live (opt-in only since #1884; the shared dev
            # container never sets this).
            SWEEP_TEAM_STRAYS="1"
          else
            # Tier-2 URI-less embedded shape (epic #1647 Task 10, P1-9): the
            # P4 enforcement fails URI-less runs unless CARVE_OUT=1 — tier-2
            # PR legs run the selected surface files embedded BY DESIGN (the
            # plan keeps them off the redirect), so they opt in.
            CARVE_OUT="1"
          fi
          echo "URI=$URI" >> "$GITHUB_ENV"
          echo "EXPECT_URI=$EXPECT_URI" >> "$GITHUB_ENV"
          echo "CARVE_OUT=$CARVE_OUT" >> "$GITHUB_ENV"
          echo "SWEEP_TEAM_STRAYS=$SWEEP_TEAM_STRAYS" >> "$GITHUB_ENV"
      - name: Generate coverage manifest (expected nodeids, epic #1647 Task 6/9)
        # Cycle-2 P2-12: the collect-only runs in its OWN step (off the
        # pytest step's watchdog budget (per shard: matrix.watchdog_minutes) — the collect-only wall can
        # never ride the run). The manifest keys off the SAME space-joined
        # $FILES the run step builds (identical construction below) x the
        # same `-m 'not track_b and not live and not integration'` filter
        # (plan-review P1-7: never a re-derived matrix list; `integration` is
        # the opt-in live half's marker, #4750), so the expected set is
        # exactly what pytest will run; the skip-guard step reconciles it
        # against the junitxml (Task 3) — a vanished nodeid (deselected, file
        # dropped from $FILES, vacuous early-return) reds instead of green.
        # Task 9 Step 1 (P3): the manifest now covers BOTH halves (the P2
        # `if: matrix.half == 'b'` gate is gone — both halves are docker).
        run: |
          FILES=""
          # #6135: ONE source — this shard's own `matrix.files`, whatever the
          # event. The push shards and the tier-2 split are emitted in the same
          # matrix shape, so the old full/tier-2 branch (and the a/b
          # conditionals it needed) has nothing left to select on.
          for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          if [ -z "$FILES" ]; then
            echo "no selected files for this shard — no manifest (guard skips)"
            exit 0
          fi
          # Reuse contract: the skip-guard step's empty-file check reads this.
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "not track_b and not live and not integration" --output "$PYTEST_MANIFEST"
        env:
          # `--emit-manifest` spawns `pytest --collect-only` as a SUBPROCESS, so
          # it inherits THIS step's env. A file gating itself on the DB URI skips
          # itself at import without it, so it contributed NO expected nodeids
          # while the run step below — which sets the URI — still executed it.
          # skip-guard reconciles in ONE direction (every expected nodeid must
          # appear; extra junit entries are fine), so the omission was silent.
          # Measured on one fast leg of the 2-shard layout then in place:
          # emit-manifest 8229 (main) -> 8400 (with the URI), +171, that leg's
          # share. Across the fast surface the URI-gated files hold 196 nodeids
          # in total — a property of the files, not of how they are sharded.
          # Only the DB URI can change collection: EXPECT_URI/CARVE_OUT are read
          # by session-scoped fixtures, which do not run under --collect-only.
          TORTOISE_DB_URI: ${{ env.URI }}
      - name: Canary producer (epic #1647 Task 9 Step 6, producer shard, post-merge)
        # The D-3=A instrumented streak's producer: the fast-matrix job runs
        # PER-LEG, so exactly ONE leg must write the producer marker or
        # last-writer-wins clobbers (cycle-5 P1-7 option (b)). Gated on the
        # matrix's `canary_producer` flag (the LAST shard, set by the selector)
        # AND the post-merge trigger (push — PR runs never mutate the canary
        # artifact). #6135: the gate is a ROLE, not a name — `half == 'b'`
        # stopped existing the moment the shard count rose. The marker rides
        # the artifact upload (below) and is consumed by the canary-streak job
        # (needs: [test], artifacts-only — cycle-6 P1-7).
        if: github.event_name == 'push'
        run: |
          if [ "${{ matrix.canary_producer }}" = "true" ]; then
            # #6135: the shard's watchdog reaches the marker through the ENV,
            # never as an unquoted GitHub expression in the embedded python —
            # that is invalid Python and the column-zero guard reds on it.
            # NOTE: this comment must not contain template syntax. GitHub
            # evaluates expressions over the ENTIRE `run` scalar, comments
            # included, so a literal expression here fails workflow validation
            # and the job never starts (no check-run is produced at all).
            SHARD_WATCHDOG_MINUTES=${{ matrix.watchdog_minutes }} python3 - <<'EOF'
          import json, os
          marker = {
              "run_id": int(os.environ.get("GITHUB_RUN_ID", "0") or 0),
              # `half` is EVIDENCE (which shard produced it); `producer` is the
              # qualification the classifier reads — the label is not a gate.
              "half": "${{ matrix.half }}",
              "producer": True,
              # #6135: this shard's watchdog budget — the canary's step-wall
              # gate follows the per-shard budget, not the retired global 55m.
              "watchdog_minutes": int(os.environ.get(
                  "SHARD_WATCHDOG_MINUTES", "0") or 0),
              "event": "${{ github.event_name }}",
              "full": "${{ needs.changes.outputs.full }}",
          }
          with open(os.environ["PYTEST_CANARY"], "w") as fh:
              json.dump(marker, fh, indent=2)
          print("canary producer: docker shard " + marker["half"] + " qualified (post-merge, full="
                + marker["full"] + ")")
          EOF
          else
            echo "canary producer: shard ${{ matrix.half }} — no producer marker (producer shard only)"
          fi
      - name: Restore pytest last-failed state (#6142)
        # #6142: persist .pytest_cache across runs of the SAME PR so the
        # fast-fail pre-phase below can re-run the tests that failed on the
        # previous push, instead of re-paying the full 33-39 min half to learn
        # the same thing. Keyed per (job, matrix half, PR ref) so state can
        # never bleed between the two halves or between PRs; the exact key is
        # unique per push (github.sha) and restore-keys picks the most recent
        # entry for this ref. A missing/empty cache is the fail-OPEN case: the
        # pre-phase is skipped and the FULL set runs — never the other way.
        # PR-only: `main` must always run the full set (see the pre-phase guard).
        # continue-on-error: a cache-SERVICE error (transport/503) must never
        # fail this step — the implicit success() would then skip the entire
        # test run and red the job with ZERO tests executed. A miss/empty
        # cache is the fail-open case the pre-phase already handles.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .pytest_cache
          key: pytest-lastfailed-${{ github.job }}-${{ matrix.half }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            pytest-lastfailed-${{ github.job }}-${{ matrix.half }}-${{ github.ref_name }}-

      - name: Provide rsync for the deploy-step tests (#7026)
        # Only the shard that OWNS tests/test_pages_bindings.py depends on
        # rsync: unguarded, every other shard's green would ride on apt/sudo
        # health on a host whose only relation to that file is that the
        # scheduler placed the job there. The install itself — and why the tool
        # is needed at all — lives in the shared action.
        if: contains(matrix.files, 'test_pages_bindings')
        uses: ./.github/actions/ensure-rsync
      - name: Run fast test suite (slow files run in the test-slow job)
        id: pytest-run
        # #798: in-step watchdog + guaranteed summary tail. pytest gets
        # SIGINT at ITS SHARD'S watchdog (SIGKILL 10s later if stuck inside a
        # test — pytest ignores INT mid-test); the step then prints counts +
        # tail + real exit code. The runner's own timeout-minutes is NOT what
        # bounds pytest, so a silent runner cancel is impossible.
        # #6135: the budget is PER-SHARD (`matrix.watchdog_minutes`, derived
        # from the shard's own packed estimate) — the old literal 55m meant a
        # hung 6.6-minute shard was detected ~8× later than it should be.
        # #6142 keeps that invariant: the last-failed pre-phase below has its
        # OWN 10m watchdog (never the shard's gating one) and the job cap is
        # sized for setup + pre-phase + gating, so the gating run always keeps
        # its full shard budget.
        # #964: liveness heartbeat. pytest writes to $PYTEST_LOG (for
        # the guaranteed tail), so the job log shows no output for 25-50
        # min — previously read as "stuck in_progress". The background
        # loop below prints a progress line to the LIVE job log every 5 min
        # so GitHub surfaces activity and stall-vs-progress is visible.
        #
        # ── WHICH RUNNER CLASS CARRIES THIS LEG (measured 2026-10-25) ────
        # A watchdog kill on the self-hosted pool is a CLASS kill, not a test
        # verdict, and it currently costs a triage cycle to establish that:
        # 35 of the 52 red self-hosted legs across the last 39 Python CI runs
        # ended in a watchdog kill (24 × rc137 + 11 × rc124), and per-test cost
        # on the SAME nodeids splits by CLASS — arm64 legs 4.46x hosted (sum
        # 4.05x), x64 cells 1.16x (sum 1.45x), over 654 common testcases across
        # run 40238275534 vs hosted 40249711042. There is NO single pool-wide
        # ratio, so the figures are named per class rather than as "~4x": the
        # x64 cells are only ~1.2x and a blanket number would mispredict them.
        # Stating the class up front, and again on the kill banner, is what lets
        # a reader (and the merge rail) attribute the red without opening a
        # 10k-line log.
        #
        # This is EVIDENCE, never a gate: it emits, it does not decide. The leg
        # still runs, and its status is still pytest's own rc.
        #
        # ⛔ These lines are YAML comments ON PURPOSE, not script comments: a
        # `run:` script is capped at 21000 bytes (#6253) and this step sat 140
        # bytes under it, so rationale kept inside the script is what pushed the
        # file over and made GitHub refuse it (zero jobs, `python-ci-gate`
        # ABSENT rather than red). YAML comments are not counted at all.
        run: |
          set +e
          # Run only this shard's files — collection is divided, and each job
          # leaks only its own share of the embedded servers (#6135).
          FILES=""
          # #6135: this shard's own `matrix.files` — the push shards
          # (full matrix) and the tier-2 LPT split are the same shape, so one
          # loop covers both. No `full`/`a`/`b` branching is left to drift.
          for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          if [ -z "$FILES" ]; then
            echo "no selected files for this shard — skipping"
            echo 0 > "${RUNNER_TEMP:-/tmp}/pytest-rc"
            # #4740: pytest never runs here, so the conftest session-end sweep
            # never writes its report. Write an explicit, honest one instead of
            # leaving the gate to parse a missing report (which must stay RED
            # for a real no-report run).
            printf '{"sweep":{"skipped":"no-pytest"}}' > "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
            exit 0
          fi
          # Epic #1647 Task 6 (plan-review P1-7): emit the run's own file
          # list for the coverage-manifest machinery (the manifest step
          # writes the same file; this write is the authoritative post-hoc
          # record the skip-guard step's empty-file gate reads).
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          # WHICH RUNNER CLASS CARRIES THIS LEG: the rationale and the measured
          # per-class figures live in this step's YAML comment above, not here —
          # a `run:` script is capped at 21000 bytes (#6253), and 16 lines of
          # rationale at this point is what took the file over that cap.
          RUNNER_CLASS="${RUNNER_ENVIRONMENT:-unknown}"
          RUNNER_IDENTITY="${RUNNER_NAME:-unknown}/${RUNNER_OS:-unknown}-${RUNNER_ARCH:-unknown}"
          echo "runner class: $RUNNER_CLASS ($RUNNER_IDENTITY); artifact paths under ${RUNNER_TEMP:-/tmp}"
          if [ "$RUNNER_CLASS" = "self-hosted" ]; then
            echo "::warning title=leg is on the self-hosted pool::this leg runs on $RUNNER_IDENTITY, not a GitHub-hosted runner. Measured population (2026-10-25, 654 common nodeids, run 40238275534 vs 40249711042): pool arm64 legs run 4.46x hosted per test (sum 4.05x), x64 cells 1.16x (sum 1.45x). So a WATCHDOG kill here is UNINFORMATIVE about the diff until the same commit is re-run on a class that can meet the budget — a kill that REPRODUCES on a hosted re-run is about the diff. Any test failure this leg DOES report is real."
          fi
          # #964 heartbeat: killed when pytest exits (kill+wait below).
          # Counts are rough live liveness signals — the -r fEs summary block
          # re-lists failures, so FAILED may double-count on the last tick;
          # the authoritative numbers are the tail + WATCHDOG banner below.
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' "$PYTEST_LOG" 2>/dev/null || true)
              f=$(grep -c ' FAILED' "$PYTEST_LOG" 2>/dev/null || true)
              echo "HEARTBEAT: pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          # #6136 (epic #5215, owner decision D3): xdist is admitted for ONE
          # shard, on the DOCKER shape only. The decision is made HERE, at
          # the point of use, so both limits are enforced by the command that
          # actually runs — not by a comment claiming them.
          #   * one shard — `matrix.half == "a"` ONLY, of the fast job's NINE
          #     shards (`a`..`i`; the count comes from
          #     `tools/ci_selection.load_manifest()["fast_shards"]`, not from a
          #     comment). The other shards stay serial: the serial legs are the
          #     control that keeps a flake attributable, and bounding the
          #     fan-out to ONE shard is what D3 admits. Shard (a) is the one
          #     admitted because the plan's throughput case
          #     (docs/plans/2026-09-26-5215-merge-throughput.md §2.2 T-I)
          #     argued it on the longest leg.
          #     HONEST LIMIT: this parallelises ONE of the fast job's NINE
          #     shards, so the job's wall becomes max(shard a / speedup, the
          #     slowest serial shard) and the OVERALL gate wall may still be
          #     the serial `test-slow` legs. One shard is not claimed to reach
          #     the <10 min target on its own — it is the isolation-bounded
          #     proof D3 admits, not the full throughput lever.
          #   * docker shape — TORTOISE_DB_URI non-empty. On a tier-2 PR the
          #     URI gate above leaves it empty and this SAME step runs the
          #     embedded redislite lane — the RC5 leak surface (#2875,
          #     #3653) D3 does not admit `-n` on. Enforced by the `-n` test
          #     below, not assumed; the branch that ran is echoed so which
          #     shape got `-n` is legible in the job log.
          #   * `--dist loadscope`, NOT loadfile: xdist groups test FUNCTIONS
          #     by module and test METHODS by class, and distributes whole
          #     groups, so a module's functions and its fixtures stay on one
          #     worker while files still parallelise. The guarantee is per
          #     GROUP, not per module: a module whose tests are split across
          #     classes reaches the workers as one group PER CLASS, so its
          #     intra-module ordering is NOT preserved across classes (from
          #     #6269 review F3 — the earlier wording claimed the module
          #     stayed whole, which is only true for function-only modules).
          #     D3 names loadscope specifically for that group-scoping.
          #   * leak count — per-worker resources come for free (each worker
          #     is its own process: its own TORTOISE_TEST_SESSION nonce,
          #     journal and active-suite marker), and the E2E-7 survivor gate
          #     in tests/conftest.py is now sibling-worker-aware, so it
          #     asserts the OWNED leak count PER WORKER rather than once per
          #     job. Every output contract the steps below read is
          #     xdist-safe: the -r fEs summary (`^FAILED ` nodeids, the
          #     skip-guard's reason source) is printed unprefixed by the
          #     controller, `grep -c ' PASSED'` still counts, and the
          #     junitxml the coverage manifest reconciles is aggregated.
          # `-n 0` is xdist's serial mode (no worker subprocesses; every
          # session fixture runs in the main process — verified against the
          # pinned pytest-xdist 3.8.0 with `--dist loadscope`), so the
          # command line carries the flag unconditionally while the EFFECTIVE
          # worker count is 0 everywhere except the one admitted shard. That
          # keeps the whole decision on the single line a reader (and the
          # workflow pin in tests/test_ci_selection.py) inspects.
          XDIST_WORKERS=0
          # ⛔ DISABLED 2026-10-06 — the `-n` admission made `test (a)` RED on main.
          # Evidence: on 3bbb61c26, shard `a` FAILED while shards (b)-(i) ALL PASSED,
          # and `a` is the only shard that had `-n`. Failing test:
          # tests/test_migration_drift_gate.py::test_duplicate_branch_flags_out_of_order_after_rename
          # (AssertionError). That file is NOT touched by #6269 and PASSES 3/3 SERIAL on
          # the same commit — so the parallelism, not the code under test, is the trigger.
          # Mechanism: the module keeps a module-global mutable fixture dir
          # (`FIXTURES = _tmp()`, tests/test_migration_drift_gate.py:32) and
          # `_write_fixture_migrations` DELETES every `*.sql` in it (:39-40) while
          # `_stub_curl` rewrites `stub-curl.sh` in the same directory (:48) — shared
          # mutable state that a concurrent worker can trip. NOT PROVEN to be the exact
          # trigger; re-admit `-n` only WITH a shard-level run under `-n` as the gate.
          # The guard below is kept INTACT and inert rather than deleted, so re-admitting
          # is a one-line change and the D3 shape (one shard + docker shape only) is
          # preserved for whoever fixes the isolation.
          if false && [ "${{ matrix.half }}" = "a" ] && [ -n "${TORTOISE_DB_URI:-}" ]; then
            XDIST_WORKERS="$PYTEST_XDIST_WORKERS"
          fi
          echo "#6136 xdist: -n $XDIST_WORKERS --dist loadscope (half=${{ matrix.half }} uri=${TORTOISE_DB_URI:-<unset>})"
          # #6142: last-failed FAST-FAIL pre-phase. On a PR whose PREVIOUS
          # push left a non-empty .pytest_cache/v/cache/lastfailed (restored
          # above), re-run ONLY those tests first. A known failure that still
          # fails reds the job in ~1 min instead of re-paying the full half.
          #
          # SAFETY (#4164 — the pre-merge selection must not be narrowed):
          # this pre-phase never gates a GREEN result on its own. When it
          # passes — or when there is no last-failed state, or the state names
          # no test in THIS half (explicit nodeids, see below) — the FULL set
          # runs unchanged as phase 2. Every path that can reach green still
          # runs the complete half, and the skip-guard manifest (which pins the
          # full expected nodeid set) still reconciles.
          #
          # The nodeids are passed EXPLICITLY (not via pytest's `--lf`): the
          # `--lf` plugin FALLS BACK to running the whole selection when the
          # restored keys intersect nothing collected (verified against pytest's
          # LFPlugin), which on the tier-2 shape — where the half is re-split per
          # push — would run the full half in the pre-phase AND again in phase 2.
          # rc 4/5 ("no tests ran": a nodeid vanished or the marker deselected
          # it) is NOT a failure — it falls through to the full run, the
          # fail-OPEN direction the issue requires.
          #
          # RESIDUAL (#6142): when this pre-phase fails, this half did
          # NOT run the tests outside the last-failed set, so the `FAILED`
          # nodeids printed below are a SUBSET of the half. The merge rail
          # (`scripts/ci-failure-set.sh` → `admin-merge.sh`) reads that as the
          # head's complete failure set and could exempt a persisting main-side
          # failure while a NEW failure goes unrun. The normal merge path does
          # re-assert the gate on the composed tree — the Mergify queue runs
          # `merge_conditions: check-success=python-ci-gate` on the queue
          # branch (`.mergify.yml`), whose ref has no cached lastfailed and
          # whose push event never runs this pre-phase; the marker line below
          # is the hook for the rail follow-up. The cache
          # provider stays enabled on BOTH phases so phase 2 writes the new
          # lastfailed set the next push reads; `main` never runs the pre-phase.
          # That is why the gating run below carries no `-p no:cacheprovider`
          # (main's copy of that line did): dropping it on the GATING run is the
          # point — a phase that cannot write the new lastfailed set would make
          # the next push's pre-phase re-run a stale set.
          # The nodeids are read one-per-line into a bash ARRAY: parametrized
          # nodeids contain spaces (`test_x[case one]`), so an unquoted word
          # list would word-split into a pytest UsageError (rc 4) and the
          # optimization would silently never apply to spaced ids.
          LF_RC=0
          LF_NODEIDS=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -s .pytest_cache/v/cache/lastfailed ]; then
            while IFS= read -r LF_NID; do LF_NODEIDS+=("$LF_NID"); done < <(printf '%s' "$FILES" | python3 -c 'import json,sys; files=set(sys.stdin.read().split()); d=json.load(open(".pytest_cache/v/cache/lastfailed")); print("\n".join(n for n in d if n.split("::",1)[0] in files))' 2>/dev/null || true)
          fi
          if [ -n "${LF_NODEIDS[*]}" ]; then
            echo "last-failed fast-fail: re-running ${#LF_NODEIDS[@]} test(s) that failed on the previous push"
            # Its OWN watchdog (10m), NOT the shard's gating watchdog
            # (`matrix.watchdog_minutes`): a handful of last-failed tests must
            # never eat the gating run's budget.
            timeout -s INT -k 10 10m stdbuf -oL python -m pytest "${LF_NODEIDS[@]}" -v --timeout=300 -m 'not track_b and not live and not integration' --maxfail=20 -r fEs --durations=15 --junitxml="$PYTEST_JUNIT_LF" -o junit_family=xunit1 > "$PYTEST_LOG" 2>&1
            LF_RC=$?
            echo "last-failed fast-fail phase: rc=$LF_RC"
            # #6142 P2: rc 4 means pytest could not FIND one of the nodeids and
            # aborted the whole pre-phase (zero tests ran) — and LFPlugin KEEPS a
            # cache entry it never collected, so without pruning one renamed or
            # re-parametrized test would silently disable the fast-fail for that
            # half on every later push. Prune exactly the nodeids pytest reported
            # as missing; the full run below still runs either way (fail-open).
            if [ "$LF_RC" -eq 4 ]; then
              python3 - <<'LF_PRUNE'
          import json, os, pathlib, re, sys

          # pytest names what it could not collect, and NEITHER shape is a
          # `lastfailed` key:
          #   not found: /abs/path/tests/test_a.py::test_gone      (renamed test)
          #   file or directory not found: tests/test_a.py::test_x (renamed file)
          # — the first is resolved ABSOLUTE while the keys are repo-relative, and
          # a vanished PARAMETRIZED id loses its `[param]` suffix (pytest says
          # `…::test_p`, not `…::test_p[c two]`). So comparing the log verbatim
          # against a key matches nothing and prunes nothing — which is how the
          # first cut of this fix shipped, silently. Normalise BOTH sides.
          try:
              log = pathlib.Path(os.environ["PYTEST_LOG"]).read_text(errors="replace")
          except OSError:
              sys.exit(0)
          root = os.path.realpath(os.getcwd())
          gone = set()
          for token in re.findall(r"not found:\s*(\S+)", log):
              path, _, names = token.partition("::")
              rel = os.path.relpath(os.path.realpath(path), root)
              if rel.split(os.sep, 1)[0] == "..":
                  continue  # outside the invocation dir — not one of ours
              gone.add(f"{rel}::{names}" if names else rel)
          if not gone:
              sys.exit(0)
          cache = pathlib.Path(".pytest_cache/v/cache/lastfailed")
          try:
              data = json.loads(cache.read_text() or "{}")
          except (OSError, ValueError):
              sys.exit(0)
          if not isinstance(data, dict):
              sys.exit(0)
          # A vanished nodeid also covers the parametrized keys pytest named
          # without their suffix. Dropping one costs at most a lost
          # optimization (the full half still runs); KEEPING one costs the
          # fast-fail itself.
          kept = {k: v for k, v in data.items()
                  if k not in gone and k.split("[", 1)[0] not in gone}
          if len(kept) == len(data):
              sys.exit(0)
          if kept:
              cache.write_text(json.dumps(kept))
              print(f"last-failed fast-fail: pruned {len(data) - len(kept)} vanished nodeid(s)")
          else:
              # Nothing left to fast-fail on: remove the file so the guard's
              # `-s` test skips the pre-phase. An empty `{}` would instead run
              # the WHOLE half here and again in the gating run.
              cache.unlink()
              print(f"last-failed fast-fail: pruned all {len(data)} vanished nodeid(s); cache removed")
          LF_PRUNE
            fi
            # FAIL-OPEN on 0 (passed — the full half still runs), 4/5 (nothing
            # collected: a nodeid vanished or the marker deselected it) and
            # 2/124/137 (interrupted, or the PRE-PHASE watchdog fired — 10m on
            # a handful of tests is not a verdict, so the full run decides, and
            # the job cap is sized to hold it). Anything else — 1 (a real
            # failure), 3 (internal error) — is a failing pre-phase.
            if [ "$LF_RC" -ne 0 ] && [ "$LF_RC" -ne 2 ] && [ "$LF_RC" -ne 4 ] && [ "$LF_RC" -ne 5 ] && [ "$LF_RC" -ne 124 ] && [ "$LF_RC" -ne 137 ]; then
              echo "==================== pytest summary (last-failed, tail) ===================="
              tail -n 200 "$PYTEST_LOG"
              # #3470: EVERY `/tmp/*.log` tail in these workflows reports through
              # the reporter, and the pre-phase is no exception — omitting this
              # call is exactly the silent-omission hole #3470 exists to close
              # (and `tests/test_pytest_attribution.py` reds on it by design,
              # because this leg's failure set is a SUBSET of the half).
              # One definition: pytest-attribution.sh.
              bash .github/scripts/pytest-attribution.sh --log "$PYTEST_LOG" --rc "$LF_RC"
              echo "==================== pytest failure nodeids ===================="
              grep -E '^(FAILED|ERROR) ' "$PYTEST_LOG" || echo "(no FAILED/ERROR nodeids)"
              echo "ci-selection: last-failed-subset (#6142) — this half ran only its previous failures; the FULL half did NOT run in this job"
              echo "$LF_RC" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
              kill $HB_PID 2>/dev/null || true
              wait $HB_PID 2>/dev/null || true
              echo "$SECONDS" > "$PYTEST_STEP_WALL"
              echo "step_wall=$SECONDS" >> "$GITHUB_OUTPUT"
              echo "==================== pytest exit code: $LF_RC (last-failed fast-fail) ===================="
              exit $LF_RC
            fi
            if [ "$LF_RC" -eq 2 ] || [ "$LF_RC" -eq 124 ] || [ "$LF_RC" -eq 137 ]; then
              passed=$(grep -c ' PASSED' "$PYTEST_LOG")
              failed=$(grep -c ' FAILED' "$PYTEST_LOG")
              errored=$(grep -c ' ERROR' "$PYTEST_LOG")
              echo "==================== WATCHDOG: last-failed pre-phase interrupted/killed (rc=$LF_RC; $passed passed, $failed failed, $errored errored) — inconclusive, falling through to the FULL half ===================="
            fi
          fi
          timeout -s INT -k 10 ${{ matrix.watchdog_minutes }}m stdbuf -oL python -m pytest $FILES -n "$XDIST_WORKERS" --dist loadscope -v --timeout=300 -m 'not track_b and not live and not integration' --maxfail=20 -r fEs --durations=15 --junitxml="$PYTEST_JUNIT" -o junit_family=xunit1 > "$PYTEST_LOG" 2>&1
          # #1436: -v truncates skip reasons to terminal width (80 cols when
          # redirected to a file with COLUMNS unset), dropping e.g.
          # test_ep_directional's 81-char nodeid reason entirely — so the guard
          # reads the -r summary, which is never truncated. -r fEs (not "-rfE
          # then -rs"): pytest 9.1.1 replaces the report set when -r flags are
          # repeated, so a trailing -rfE would suppress the skip summary the
          # guard depends on (pinned by
          # tests/test_skip_guard.py::test_workflow_keeps_rs).
          # #1663: emit lossless junitxml (--junitxml + -o junit_family=xunit1)
          # so the coverage manifest (epic #1647 Task 3) can reconcile
          # --collect-only expected nodeids against the junitxml testcases
          # (file/line attributes only exist under junit_family=xunit1). Dormant
          # at P1 — the guard step consumes it at P2 (Task 6, half-b flip).
          # #1371: capture pytest's real exit code IMMEDIATELY (before the
          # heartbeat kill / rc write below) and persist it for the orphan
          # check — the kill-aware logic needs it to distinguish a watchdog
          # kill from a normal exit.
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 300 "$PYTEST_LOG"
          # #3470: the `tail -n` above is a LINE-COUNT window, not a result —
          # post-summary interpreter-exit noise fills it and pushes BOTH the
          # session summary and the `-r fEs` report above the cut, so the log
          # stops saying whether the leg finished. Read the summary from the
          # FULL log instead, and name the INCOMPLETE case out loud so an
          # unattributable leg is a NAMED failure rather than a silent gap in
          # the #3467 failure set. One definition: pytest-attribution.sh.
          bash .github/scripts/pytest-attribution.sh --log "$PYTEST_LOG" --rc "$rc"
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' "$PYTEST_LOG" || echo "(no FAILED/ERROR nodeids)"
          # #880: 124 = timeout SIGINT kill; 137 = -k 10 SIGKILL after pytest
          # ignored INT mid-test; 2 = pytest's own SIGINT summary — the count
          # banner must print for all three (previously only 124 matched,
          # so the banner never printed on the real kill path).
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' "$PYTEST_LOG")
            failed=$(grep -c ' FAILED' "$PYTEST_LOG")
            errored=$(grep -c ' ERROR' "$PYTEST_LOG")
            echo "==================== WATCHDOG: pytest killed after ${{ matrix.watchdog_minutes }}m ($passed passed, $failed failed, $errored errored so far) on runner class '$RUNNER_CLASS' ($RUNNER_IDENTITY) — last test lines above ===================="
            if [ "$RUNNER_CLASS" = "self-hosted" ]; then
              echo "(killed by its own budget on the self-hosted pool — uninformative about the diff, and NOT a pass: a hosted re-run of this same commit is what decides it, and a kill that reproduces THERE is about the diff)"
            fi
          fi
          echo "==================== pytest exit code: $rc ===================="
          # Epic #1647 Task 6 (cycle-5 P2-5): capture the pytest-step wall
          # ($SECONDS = seconds since THIS step's bash shell started) — the
          # E2E-5 wall-regression signal (job wall alone can hide a step
          # that silently rides the shard's watchdog). Recorded BOTH as the file
          # $PYTEST_STEP_WALL (the artifact contract the P3 canary
          # classifier consumes — cycle-6 P1-7: artifacts only, never a
          # $GITHUB_OUTPUT across jobs) and as steps.pytest-run.outputs.
          echo "$SECONDS" > "$PYTEST_STEP_WALL"
          echo "step_wall=$SECONDS" >> "$GITHUB_OUTPUT"
          exit $rc
        env:
          # Deterministic embeddings: the model is pre-cached above; tests
          # must NEVER reach huggingface.co mid-suite (shared runner IPs get
          # 429-rate-limited, stalling embedding loads up to 30s each).
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Epic #1647 Task 6/9: the docker flip. Task 6 flipped half b; Task 9
          # (P3) flips BOTH halves — empty only on tier-2 PRs (full=false) and
          # the carve-out job (which does not run this step). Every reader
          # treats "" as unset (is_db_uri("") is False; the redirect seam is
          # truthy-gated). EXPECT_URI is set IFF URI is set (the same gate, the
          # same branch — pinned by
          # tests/test_ci_selection.py::test_expect_uri_gated_iff_uri).
          TORTOISE_DB_URI: ${{ env.URI }}
          TORTOISE_TEST_EXPECT_URI: ${{ env.EXPECT_URI }}
          # Task 10 (P4): tier-2 URI-less legs opt into the URI-required
          # enforcement (CARVE_OUT=1 when full=false — the tier-2 embedded
          # shape). Full docker legs set URI, so CARVE_OUT is empty there.
          TORTOISE_TEST_CARVE_OUT: ${{ env.CARVE_OUT }}
          # #1987 Task 12 (P2-7/P2-9): the ask-LLM regression module runs in
          # FIXTURE mode (committed recorded-transport transcripts; no keys)
          # on the docker lane — the pre-merge check
          # (scripts/check-ask-premerge.cjs) asserts it passed in fixture
          # mode before the answer-surface merge.
          TORTOISE_ASK_LLM_REGRESSION: "1"
          # #1886: dedicated fresh-per-job docker container — keep the
          # journal-blind team_* stray pass live in CI (opt-in only; the
          # shared dev container never sets it — issue #1884).
          TORTOISE_TEST_SWEEP_TEAM_STRAYS: ${{ env.SWEEP_TEAM_STRAYS }}

      - name: Save pytest last-failed state (#6142)
        # Persist the state the pre-phase reads on the NEXT push. `always()`
        # so a RED run's failures are saved (that is the whole point). A
        # re-run of the same sha cannot reserve an existing key, so the save is
        # dropped and the PREVIOUSLY saved state is retained — conservative:
        # at worst the next push re-runs a test that now passes.
        # continue-on-error keeps that non-gating.
        # PR-only: only a PR retry reads this state.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .pytest_cache
          key: pytest-lastfailed-${{ github.job }}-${{ matrix.half }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload pytest log (measurement artifact, #1477)
        # #1477: non-gating upload so ci-timing.yml can extract per-file
        # durations (--durations=15 section) from the REAL run. if: always() +
        # continue-on-error + if-no-files-found: ignore ⇒ this step can never
        # red the gate (the early-exit path writes no $PYTEST_LOG).
        # Epic #1647 Task 6 (cycle-5 P1-7): ships the FULL artifact set the
        # P3 canary classifier consumes — pytest log + junitxml + expected
        # nodeids + step wall. #6135: the artifact name is per-SHARD
        # (`pytest-log-test-<label>`); the classifier no longer reads it — it
        # reads the fixed-name `pytest-canary-producer` uploaded below by the
        # producer shard alone. The canary-producer marker rides both uploads
        # (the producer step is gated by `matrix.canary_producer` + post-merge).
        # Missing files (non-producer shards have no marker / no manifest on the
        # empty path) are ignored per-path by the uploader.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}-${{ matrix.half }}
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/expected-nodeids.txt
            ${{ runner.temp }}/step_wall.txt
            ${{ runner.temp }}/canary-producer.json
          if-no-files-found: ignore

      - name: Upload canary-producer artifacts (producer shard only, #6135)
        # The canary-streak job consumes ONE shard's junit + expected-nodeids +
        # step_wall + producer marker, but it cannot know that shard's LABEL and
        # must not hardcode it — the old literal `pytest-log-test-b` download
        # broke the instant the shard count rose. This fixed-name copy is
        # written by the producer shard alone (matrix.canary_producer).
        # Deliberately NOT named `pytest-log-*`: ci-timing.yml downloads
        # `pattern: pytest-log-*` and would count these durations twice.
        if: always() && matrix.canary_producer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-canary-producer
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/expected-nodeids.txt
            ${{ runner.temp }}/step_wall.txt
            ${{ runner.temp }}/canary-producer.json
          if-no-files-found: ignore

      - name: "Skip-fail guard: live-FalkorDB tests must run, never skip (#1436)"
        # The falkordb services above make the live-required tests RUN in the
        # fast matrix. If any of them SKIP anyway (probe regression, service
        # outage, a new live test file landing here), this guard flips RED
        # instead of the historical silent-green that masked #1382 for days.
        # Gated on pytest rc==0: the failure mode we guard against is exactly
        # "pytest green + live tests skipped" — a red pytest needs no extra
        # signal. Same semantics as test-concurrency-falkor's inline guard,
        # extracted to a tested tool (tools/skip-guard.py + tests/test_skip_guard.py).
        # Epic #1647 Task 6 (half-b flip) + Task 9 (P3): BOTH halves pass
        # --manifest + --junitxml (the junitxml-reconciled coverage manifest —
        # a vanished nodeid reds, Task 3), gated on rc==0 AND non-empty $FILES
        # (the no-selected-files path writes rc=0 with no junitxml; with a
        # manifest that would false-red). The legacy line matcher remains the
        # fallback only for the empty-files shape.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            if [ -s "${RUNNER_TEMP:-/tmp}/pytest-files" ]; then
              python3 tools/skip-guard.py "$PYTEST_LOG" --junitxml="$PYTEST_JUNIT" --manifest "$PYTEST_MANIFEST"
            else
              python3 tools/skip-guard.py "$PYTEST_LOG"
            fi
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi

      - name: Dump redislite-hygiene end-sweep decision (issue #1103)
        # pytest capture swallows the conftest print; the orphan check below
        # needs the sweep decision (other-suites / foreign-pytest flags) to
        # distinguish "real leak" from "deferred sweep false positive".
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== redislite-hygiene end-sweep decision (issue #1103) ==="
            cat "$LOG"
          else
            echo "no hygiene log at $LOG (end-sweep logger did not write)"
          fi

      - name: Dump tolerated tempdir-cleanup leaks (issue #7735)
        # Same capture trap as #1103 above: a PASSING test's `logger.warning` is
        # discarded by pytest capture (measured on the fast job's flags — 0
        # occurrences in $PYTEST_LOG and 0 in the junit XML), so the
        # ENOTEMPTY teardown leaks tolerated by `TemporaryDirectory.cleanup`
        # are mirrored to an artifact at session end. The writer MERGES by path
        # so a future xdist admission cannot truncate a peer's record wholesale
        # (a same-instant write can still drop one entry) — INERT today: CI is
        # serial (`XDIST_WORKERS=0`), so a single
        # session owns the path. Informational: the step never fails the job.
        # Every job listed in _LEAK_SURFACED_JOBS carries this step (pinned by
        # tests/test_tmpdir_hygiene.py::test_suite_jobs_surface_the_tolerated_leak).
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/tempdir-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== tolerated tempdir-cleanup leaks (issue #7735) ==="
            cat "$LOG"
          else
            echo "no tolerated tempdir-cleanup leak recorded at $LOG"
          fi

      - name: Assert no redislite orphans (issue #1005 / epic #1647 E2E-7)
        # Runs even when pytest failed — the orphan check is independent of
        # test outcomes. The bound is NOT a hand-picked constant: the conftest
        # session-end sweep reports what it did
        # ({reaped, exited, cleared, left, before})
        # and the gate binds to that report — reading the bound from `left` and
        # asserting the sweep's own accounting identity
        # `reaped + exited + left >= before`
        # (see .github/scripts/orphan-bound.sh, #4740; `exited` is #6984 — the
        # servers the sweep OBSERVED to exit on their own, so a self-shutdown
        # is not read as a broken sweep). #2032: the docker lane is
        # not always ~0 by construction — the embedded-file-contract atexit race
        # leaves strays on the full matrix
        # too (trunk run 34928488659 measured 7), and that residue is what the
        # sweep's own `left` now accounts for. #1005: every count-based red is
        # applied to servers ATTRIBUTED to this run — those whose argv carries a
        # socket path under one of the run's own session temp roots — because
        # `COUNT` is a host-wide pgrep and `left` a snapshot from one pytest
        # process. What this gate reds: this run's OWN servers growing after the
        # sweep measured them (own_now > own_left), an accounting-identity
        # violation (reaped + exited + left < before), a probe_failed report
        # with an attributed residue above zero (no `left` to bind to), an error
        # or skipped report, a no_embedded_servers report with an attributed
        # own_now above zero, and a report that is unaccounted, unreadable or
        # UNATTRIBUTABLE (no usable `own_roots`). The HOST-WIDE count above
        # `left` is NOT a verdict: it is a `::warning::` that names the
        # attribution, because on the self-hosted pool it includes every other
        # job's servers. A `cleared: false` report does
        # NOT red at any measured COUNT: `cleared` reports whether the sweep's
        # TIME BUDGET sufficed — a function of runner load — not its residue
        # (#4989). A `probe_failed` report with no attributed server is a
        # warning, not a red: there is no live residue to bound, and the
        # measured attribution — not `cleared` — decides the verdict. It does NOT
        # independently red a residue the sweep itself
        # measures and declines to act on (a server with a live client, an
        # unconfirmed path-based server): that lands in `left`/`own_left` and
        # passes at own_now == own_left, bounded by the sweep's own measurement
        # (#4884).
        # #1371 kill-aware: after a WATCHDOG kill (rc 124/137/2) the
        # orphan count is a GUARANTEED kill-path artifact — SIGKILL skips atexit
        # and the conftest end-sweep — not a leak signal, so the gate downgrades
        # to a warning (the run is already red; a second red adds no signal and
        # blinds the detector on the runs where it would matter). On a normal
        # exit the strict leak gate applies unchanged.
        if: always()
        run: |
          set +e  # pgrep exits 1 on zero matches; pipefail would abort the step
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          # #4740: the count and pgrep's OWN status are read separately. A
          # `${PIPESTATUS[0]}` read after `COUNT=$(pgrep … | wc -l)` reports
          # the LAST pipeline command (`tr`, always 0), never pgrep — so a
          # failed probe would read as a measured 0 and pass. On the bare
          # assignment below `$?` IS pgrep's status: rc 0 = matches, rc 1 = no
          # matches (both real measurements); anything else is a failed probe
          # and must RED, never be read as "measured zero" (issue #1005).
          PIDS=$(pgrep -f "redislite/bin/redis-server")
          prc=$?
          [ "$prc" -le 1 ] || { echo "::error::pgrep failed rc=$prc — the orphan count is unmeasured (issue #1005)"; exit 1; }
          COUNT=$(printf '%s' "$PIDS" | wc -w | tr -d ' ')
          # #1005 (epic #1647 E2E-7): hand the gate the counted servers' argv,
          # so it can say WHICH of them live under this run's own session temp
          # root. `COUNT` alone is host-wide — on the self-hosted pool every
          # concurrent job's servers appear in it — and comparing that to the
          # sweep's snapshot redded PASSING runs (9 counted vs left=8; 22 vs
          # 14). A `ps` failure here is a FAILED probe, never an empty
          # measurement: the attribution would silently degrade to "someone
          # else's servers" and hide a real residue.
          ARGV="${RUNNER_TEMP:-/tmp}/redislite-orphan-argv.txt"
          : > "$ARGV"
          if [ -n "$PIDS" ]; then
            # `pgrep` prints one pid per line; GNU `ps` refuses a `-p` list with
            # newlines in it ("process ID list syntax error") while BSD `ps`
            # tolerates them — measured, so the separator is normalised to a
            # comma list both accept. Without this the Linux legs write an EMPTY
            # argv file and every counted server would read as unattributable.
            PIDLIST=$(printf '%s' "$PIDS" | tr -s '[:space:]' ',' |
              sed 's/^,*//; s/,$//')
            # A whitespace-only probe normalises to an EMPTY list, which GNU ps
            # rejects ("list of process IDs must follow -p") — there is nothing
            # to attribute, so do not call it.
            if [ -n "$PIDLIST" ]; then
              ps -ww -o pid=,args= -p "$PIDLIST" > "$ARGV" 2>/dev/null
              arc=$?
              # #10255 review 1 (P1): `ps -p <list>` exits 1 when NO listed pid
              # matched — measured on procps-ng 4.0.4 (`ps -p 1` → 0,
              # `ps -p 999999` → 1, `ps -p 1,999999` → 0), and the procps man
              # page publishes no exit-status contract at all, so `-eq 0` was
              # an assumption the tool never made. That rc is a COMPLETED
              # measurement of an empty population, not a failed probe: this
              # read sits inside the residue's shutdown window, which the
              # gate's own header documents as normal (a server the sweep
              # still saw exits in the ~0.05s before this later probe), and
              # every counted server exiting in between is most likely exactly
              # at COUNT 1-2. Failing the job there reds a passing run that
              # leaked nothing, with a message that blames attribution and
              # sends the reader after a residue that does not exist. Only a
              # real probe failure (rc>1, a missing `ps`, a timeout) reds. On
              # the benign path the (truncated) file stays empty, so the gate
              # reads own_now=0 — below every `own_left`, i.e. never a red.
              [ "$arc" -le 1 ] || { echo "::error::ps failed rc=$arc — the orphan count cannot be attributed to this run (issue #1005)"; exit 1; }
            fi
          fi
          bash .github/scripts/orphan-bound.sh \
            --count "$COUNT" \
            --rc "$RC" \
            --hygiene "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json" \
            --argv "$ARGV"

      - name: Stop FalkorDB services (#6673)
        # Last step + always(): a failed or cancelled job must not leave a
        # FalkorDB container holding memory on the runner host.
        if: always()
        uses: ./.github/actions/falkordb-teardown

  test-slow:
    needs: changes
    # #2148 (2026-09-02-ci-audit F2): diff-gated — the full committed slow
    # list used to run on EVERY PR (docs-only PR #2132 paid 29m43 + 29m08
    # runner-min for a 1-file docs change). Runs when the selector says so:
    # full selections (push to main / unknown-path or
    # shared-module PRs — the trunk backstop, NEVER dropped) or a
    # PR whose matched surfaces own slow-leg files (slow_run). Tier-2 PRs
    # run only their surface's slow files (slow_selected, intersected with
    # each leg's committed list in the manifest/run steps); docs/website/
    # config-only PRs (surfaces == [] -> slow_run == false) skip the whole
    # job — the tier-1 smoke in the `test` job still runs.
    if: needs.changes.outputs.slow_run == 'true'
    # ⛔ VERSION-PINNED HOSTED LABEL, NOT `ubuntu-latest` (measured 2026-10-19).
    #
    # `ubuntu-latest` is NOT "GitHub-hosted" on this repo: `scripts/ci_runner_gate.sh`
    # re-attaches `ubuntu-latest` to the self-hosted ARM64 pool (`pi-runner-vm-*`)
    # as a FALLBACK whenever GitHub-hosted looks unhealthy, so the same
    # `runs-on: ubuntu-latest` resolves to a ~2x slower class, run to run.
    #
    # MEASURED, run 39309984832 (main, 2026-10-19T19:19Z): `test-slow (a)` won the
    # race for `pi-runner-vm-2`, executed **39.6 min of test time** (1561 testcases
    # in its own junit artifact) and was STILL RUNNING when its 40m in-step watchdog
    # fired (`rc=137`, "WATCHDOG: pytest killed after 40m"). The job then read 42.1m
    # and concluded `failure`, so this leg's wall became main's critical path
    # (`ci_crit_med`/`ci_crit_max` = 42.1m, up from 22.6m) and the REQUIRED
    # `python-ci-gate` went red naming this leg. The same leg finishes in ~21-22m on
    # a hosted runner — which is what the committed 18.9m leg weight and the 40m
    # budget were measured against.
    # ⚠️ What this pin does NOT claim: that run was ALSO red for real, independent
    # reasons — three fast shards on GITHUB-HOSTED runners (test (c), test (a),
    # test (e)) failed in the pytest step with genuine FAILED nodeids (exit code 1,
    # 8-11 min, well inside their budgets), and this leg's own partial junit records
    # 1 failure. The pin removes THIS leg's kill and the critical-path inflation it
    # caused; it does not turn that run green.
    #
    # Why ROUTING and not a raised timeout: the 40m budget clears the heavier
    # DERIVED leg (7.58m, #9539 — see the job header below) by 5.3x, i.e. 2.6x the
    # `WATCHDOG_HEADROOM` policy floor (2.0x, a 15.2m minimum). The literal is not
    # the constraint here; the RUNNER CLASS is. Sizing the budget for the pool
    # instead would need >=79m (2 x 39.6m), past
    # `WATCHDOG_CEILING_MIN` (55m) and past this job's own 60m outer cap — and a
    # budget built for the slowest class would also let a genuinely hung HOSTED leg
    # hold the REQUIRED aggregate red for 55m, the regression #6135/#6145 exists to
    # prevent. This leg cannot be carried by the pool inside the policy, so it must
    # not be schedulable onto it.
    #
    # `ubuntu-24.04` is claimed by NO self-hosted runner (the pool carries
    # `self-hosted,Linux,ARM64,self-hosted-arm64` plus, only while the fallback is
    # attached, `ubuntu-latest`) — the same pin, and the same reasoning, as
    # `workflow-lint` (#7867) and finding-provenance.
    # Cost when GitHub-hosted is healthy: none — the pool only wins these jobs while
    # the fallback label is attached. During a real GitHub-hosted outage these two
    # legs WAIT for a hosted runner (the aggregate stays pending — "not answered
    # yet") instead of being killed into a false red on the class that cannot finish
    # them, while the fast matrix keeps using the pool.
    #
    # ✅ EXPLICIT WHEN OPTED IN (#6897, the change this paragraph belongs to —
    # it is not yet on main): under the default (`hosted-only`) `test` behaves
    # EXACTLY as this header describes — every leg is `ubuntu-latest`, and the
    # pool can take it through the fallback race, which is main's exposure
    # carried over unchanged and worth nothing new. The split only appears when
    # an operator sets `CI_SHARD_ROUTING=pool-split`, and then `test`'s
    # `runs-on` reads the selector's per-row `runner`: odd shards name
    # `[self-hosted, self-hosted-x64]` EXPLICITLY (they cannot be resolved by the
    # ARM64 class the `ubuntu-latest` fallback attaches, which is the class the
    # margin below was measured on) while even shards keep `ubuntu-latest` — the
    # SAME label, and the same residual ambiguity, that this header describes.
    # Do not read "explicit" as "the fast matrix is now class-safe": even in
    # opt-in mode the non-pool rows are not, and they include shards (c) and (e)
    # — the two measured below at ~78%/~91% of the 20m budget on the ARM64 VMs.
    # It fired for real on head 5a2ae6aa1: `test (i)`, the CANARY, was taken by
    # `pi-runner-vm-5` (ARM64) and killed at 32m12s of a 30m budget. Closing THAT
    # needs `ubuntu-24.04` on those rows, which also drops the outage fallback
    # this gate exists for: a capacity decision, not a CI-hygiene one, filed on
    # #6897. Kept here as the record of why THIS job is version-pinned: a 9.72m
    # committed estimate against a 20m budget, and the pool consumed 17.3m and
    # 19.9m of JOB wall on shards (c) and (e) in the two other main runs measured
    # that evening (39327442614, 39304878787) — ~78% and ~91% of the 20m pytest
    # budget after ~1.7m of setup, on the ARM64 VMs. Pinning THIS leg would remove
    # the fallback the gate exists for. The measurement is filed on #6897.
    # Do NOT change it back to `ubuntu-latest`, and never to `self-hosted`.
    runs-on: ubuntu-24.04
    # #1471: parallel duration-balanced legs (matrix), mirroring the `test`
    # job's #880 pattern. Serial pytest was 37:44 (run 32241846147, 2026-08-19)
    # — the true critical path of every main push (last python-ci job to
    # finish). Two legs cut it to ~max(leg) ≈ 23-24m incl. setup, and #9539
    # takes the same split further by DERIVING the leg count: the pool is
    # 37.9m of measured test time and the legs run one serial pytest process
    # each, so `max(leg)` ≈ pool/legs, and `config/ci-surfaces.yml::slow_shards`
    # is the lever that holds the projection under the 10m CI guideline.
    # Separate runners = zero hermeticity risk (slow files share no state
    # across processes).
    # Each leg keeps the 40m watchdog + 5-min heartbeat + guaranteed-summary
    # tail (#798/#964); the drift-guard step pins the union of the EXPANDED
    # legs to config/ci-surfaces.yml `slow_files:` MINUS the epic #1647
    # carve-out (Task 9 Step 5: the slow carve-out files — the members of
    # `slow_files` that are also in `carve_out` — run in the URI-unset
    # carve-out job, never the docker slow legs) — a new slow file can never
    # silently drop out of CI. Epic #1647 Task 9 Step 5 (cycle-6 P2-8): the
    # slow legs flip to DOCKER — job-level URI (full==true only) + junitxml
    # manifest + skip-guard, mirroring the fast job's Task 6 mechanics exactly.
    strategy:
      fail-fast: false
      # #9539: the legs are DERIVED, not committed. `changes` publishes
      # `slow_matrix` (tools/ci_selection.slow_matrix_include) and this job
      # expands it, exactly like `test`'s `fast_matrix` and `test-carve-out`'s
      # `carve_matrix` — so the leg count is `config/ci-surfaces.yml::slow_shards`
      # and the partition is an LPT pack of `slow_gating_files()` (slow_files -
      # carve-out - non-gating lane, #10194) off the
      # committed `durations` map. Nothing here counts legs or lists files.
      #
      # WHY THE COUNT, MEASURED (5 newest completed main runs, 2026-10-21: ids
      # 39689444666, 39681820673, 39677764388, 39669581544, 39660153113). The
      # pool is 37.05m of test time from the legs' own junit (37.88m on the
      # map), run as ONE serial pytest process per leg. The two legs were
      # already LPT-optimal — per-file medians pack to 18.52/18.52, observed
      # medians 18.25 (a) / 18.80 (b), and the per-run imbalance FLIPS SIGN
      # (run 39689444666: a 12.29m vs b 20.40m; run 39681820673: a 19.79m vs
      # b 16.30m) — so rebalancing is not the lever, and setup is only 1.9–2.1m
      # of a ~20.5m leg. 2 legs cannot fit a 37.9m pool in 10m at ANY split:
      # the best a split can do is pool/2 = 18.9m. 5 legs = ceil(37.88 / (10m
      # guideline - 2m setup)), i.e. 7.58m of test + ~2.0m setup = 9.58m
      # projected wall. `test_slow_shards_are_duration_packed_and_meet_the_wall_target`
      # reds when the projection leaves the guideline, and
      # `test_slow_shards_declaration_is_fail_closed` pins the config contract.
      matrix: ${{ fromJSON(needs.changes.outputs.slow_matrix) }}
    name: test-slow (${{ matrix.half }})
    # #3239: OUTER cap, strictly above the in-step watchdog below — that kill
    # is the one that PRINTS the pass/fail counts (#798); a runner-level cap
    # that fires first cancels the step and loses them. The LITERALS here and
    # below are deliberately unchanged by #9539: the leg count moved from 2 to
    # 5, so the heavier leg fell from 18.95m to 7.58m (DERIVED — the figures on
    # this header are the derivation, nothing below restates them), and 40m/60m
    # still clear it (5.3x / 7.9x — the `WATCHDOG_HEADROOM` floor is 2.0x).
    # Tightening them to the derived per-leg budget is a failure-path change,
    # not the wall change this PR makes; it stays with the same follow-up that
    # owns the per-leg `matrix.watchdog_minutes` wiring the fast and carve-out
    # bands already use (both of those ARE derived, so this asymmetry is
    # visible here rather than implied).
    #
    # The two literals were sized for the OLDER, heavier legs and the guard has
    # re-derived them twice: #6137 moved 43 files into these legs (2.84m →
    # 16.21m committed), and #9017 re-cut the rows from a MEASURED map (18.95m /
    # 18.93m) after a 6.4:1 split drift. That drift is the reason #9539 replaces
    # both committed rows with a derivation instead of another manual re-cut.
    #
    # #798 is an ORDER constraint, not just a magnitude: the in-step watchdog is
    # started INSIDE the job, after the off-watchdog pre-phase, while this cap is
    # measured from job start. So the cap must clear setup + pre-phase + the
    # watchdog, or the runner kills the step before pytest can print its counts
    # — exactly the loss the ORDER invariant exists to prevent.
    # The cap must therefore clear the pre-phase on the path where the watchdog
    # has to fire. That path is NOT bounded: the ONLY pre-pytest step in this
    # job carrying its own `timeout-minutes` is `Embedding model REQUIRED` (10m)
    # — checkout, the CPU install, the drift guard, the FalkorDB provision and
    # the coverage-manifest `--collect-only` step are all UNBOUNDED. So the sum
    # is only as firm as its named parts: the `test` job's own stated `~7m
    # setup` constant (see above), a <=10m embedder, the 40m watchdog and the
    # ~10s grace the job's SIGINT tail is written for come to ~57m. 60m clears
    # that, and the 2m it adds over the smallest integer that would (58m) is the
    # only room the unbounded collect-only step gets. No gate enforces any of
    # it:
    # `test_every_bounded_pytest_job_caps_above_its_watchdog` compares the two
    # literals and cannot see the pre-phase at all. The clearance is therefore
    # slack, not proven — which is the opposite of a licence to lower the number.
    # 45m — the value this PR first used — and 40m on main both left 5m for
    # setup alone, so the watchdog could never fire.
    timeout-minutes: 60
    # Epic #1647 Task 9 Step 5: the slow legs run against the provisioned
    # passworded falkordb service (same block as the fast job — both probe
    # families: 6379 passworded + 16379 passwordless legacy).
    # #6673: the two FalkorDB services used to be declared HERE as a `services:`
    # block on the fixed host ports 6379:6379 / 16379:6379. They are now started
    # by `.github/actions/falkordb-provision` (see the first FalkorDB step
    # below) on EPHEMERAL host ports, because every self-hosted runner on this
    # host shares ONE Docker daemon: a fixed host port is a single global
    # namespace, so two services jobs overlapping made the second container's
    # `docker start` fail with "Bind for 0.0.0.0:6379 failed: port is already
    # allocated" — which aborts the RUNNER in its `initialize_containers`
    # pre-step and reds the job in ~9s with ZERO tests run (a false red).
    # The image pin, the `--requirepass falkordb --save ''` REDIS_ARGS pair, the
    # passwordless legacy lane and the health gate all moved with it. The two
    # probe families are unchanged; the ports are now
    # $TORTOISE_TEST_DOCKER_PORT (passworded) and $TORTOISE_TEST_LEGACY_PORT
    # (legacy), read by tests/_live_utils.py.
    steps:
      # ⛔ FIRST STEP ON PURPOSE — same contract as the fast job's (#10028)
      # and as `test-concurrency-falkor`'s (#10280).
      # This job was the UN-MIGRATED half: `pytest-rc`, `pytest-files` and the
      # redislite/tempdir hygiene reports had already moved to `${RUNNER_TEMP}`,
      # but the three artifacts the VERDICT and the guards are read from were
      # still the host-global `/tmp/pytest.log` / `/tmp/junit.xml` /
      # `/tmp/expected-nodeids.txt`. `.github/scripts/pytest-attribution.sh`
      # named that exact residue in its own "NAMED RESIDUAL" header, whose STATUS
      # paragraph records THIS job as migrated (2026-10-29). The header's residual
      # paragraph names the legs that still write the host-global literals —
      # `test-track-b`, `test-carve-out` and `test-d14-hosted-api` here, plus the
      # warn-only `validate` job in `post-merge-validation.yml` — the deliberate
      # residual carried by #10280. That list is DERIVED and pinned by
      # `tests/test_pytest_attribution.py::test_the_residual_header_is_scoped_to_the_legs_that_still_are_residuals`,
      # so read it there rather than trusting this comment's copy of it.
      #
      # MEASURED (run 40808264676, `test-slow (a)`): the leg's own manifest
      # declared **367** expected nodeids, its own run reported
      # `365 passed, 2 skipped` (= 367) in 2378.86s, and its own
      # `pytest exit code: 0` banner printed — a fully GREEN leg — yet the job
      # still concluded `failure`, because a sibling leg's `> /tmp/pytest.log`
      # truncated the file between this leg's `tail` and its attribution read.
      # `pytest-attribution.sh` therefore printed `STALE session summary (NOT
      # this leg's verdict)` / `INCOMPLETE` under that exit code.
      #
      # The same sharing made legs (b) and (e) print FAILED nodeids for
      # `tests/test_epic903_fixtures.py`, `tests/test_epic903_scheduler.py` and
      # `tests/test_graph_diagnostics.py` — files whose only progress line in
      # those legs' logs is `tests/test_ci_selection.py`, i.e. tests they never
      # ran — and made the #964 heartbeat DECREASE inside a "single" session
      # (444 passed -> 353 passed). The six nodeids genuinely belong to legs (c)
      # and (d), which do run those files; neither of those legs' own sets is
      # recoverable from the tail.
      #
      # ⛔ THE VERDICT ITSELF IS THE ARTIFACT THAT CAN BE ANOTHER LEG'S, and it
      # needs no kill to go wrong. MEASURED on THIS PR (run 40921262252,
      # `test-slow (a)`, job 123636659746, head 80c15dfe9): pytest exited **0**
      # with `814 passed, 3 skipped`, and the leg still redded in the
      # `Skip-fail guard` step — `850 expected nodeid(s) absent from the
      # junitxml testcases` — because `/tmp/expected-nodeids.txt` held a
      # CO-TENANT's manifest (its `… and 800 more` list is
      # `tests/test_capture_session.py` and
      # `tests/test_3311_multilabel_status_vocab.py`, files this leg never ran)
      # while `/tmp/junit.xml` held this leg's. The log this run uploaded proves
      # the sharing independently: its FIRST 5 KB carry a FOREIGN session header
      # (`…-- /opt/gh-runner-x64/…`) while this job's own env says
      # `pythonLocation: /opt/gh-runner-x64-2/…`, and a 62 KB NUL HOLE
      # (offsets 5304..67993) sits where this leg's progress lines used to be.
      # Both are registrations on ONE host (`gh api …/actions/runners` lists
      # `self-hosted,Linux,X64,self-hosted-x64,ubuntu-24.04` for each — which is
      # also why this job's `runs-on: ubuntu-24.04` did not keep it off the pool;
      # that routing drift is #10289, not this change).
      #
      # `runner.temp` is `<runner_install>/_work/_temp`, and a runner executes one
      # job at a time, so this is per-JOB unique even when several runner installs
      # share one `/tmp`. Failing closed on `RUNNER_TEMP` — never falling back to
      # `/tmp` — is the whole point: a silent fallback is indistinguishable from
      # the bug being fixed.
      #
      # ⛔ NOT a job-level `env:` block: `runner` is not an allowed context at
      # `jobs.<job_id>.env`, and `${{ runner.temp }}` there makes actionlint
      # reject the WHOLE file (#6253: zero jobs, zero check-runs, and the
      # required `python-ci-gate` ABSENT rather than red). `steps.<id>.with` DOES
      # allow the `runner` context, which is why the upload below uses it.
      - name: Resolve per-job pytest artifact paths (#10028)
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:?RUNNER_TEMP is not set — refusing to fall back to a host-global /tmp artifact path}"
          {
            echo "PYTEST_LOG=$base/pytest.log"
            echo "PYTEST_JUNIT=$base/junit.xml"
            echo "PYTEST_MANIFEST=$base/expected-nodeids.txt"
          } >> "$GITHUB_ENV"
          echo "pytest artifacts for this leg are under $base (per-job, not the host /tmp)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires-python >= 3.12
      - name: Cache pip dependency caches (#7612)
        # #7612: ephemeral runners, no dependency cache — every job downloaded
        # its wheels cold on every run. Placed BEFORE install-cpu-torch so torch
        # (140 wheels, ~3.2 GB) is served from the cache as well.
        # Coverage-neutral: this job is pip-only — it never reads uv.lock, so
        # there is no lock enforcement here to weaken (a pre-existing property,
        # documented in .github/actions/install-cpu-torch/action.yml). pip's
        # cache is content-addressed: it can only serve the artifact for the URL
        # pip already resolved, never substitute a different version.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - uses: ./.github/actions/install-cpu-torch
      - name: Install package + test extras
        run: pip install -e '.[test,embeddings]' build==1.6.0
        # build pinned (#1929 code-review P2): test_pack_shipping_wheel.py's
        # sdist-rebuild gate uses `python -m build` as its primary builder —
        # the [test] extra does not pull it, and a missing builder would
        # pytest.skip the wheel gate out of CI with a green run.
      - name: Reap ABANDONED redislite litter (#1005 / #3653)
        # #1005: leaky runners accumulate redislite tempdirs from every failed
        # embedded-redis run — discover() then skips its stale-socket walk
        # (>5000 entries), so the reaper chaos tests fail with "orphan not
        # cleaned". Reap strays before the suite.
        # #3653: it used to be `pkill -f "redis-server unixsocket"`, which
        # matches EVERY redislite on the box. This matrix runs up to four such
        # legs per workflow and its own orphan gate has measured ten other live
        # suites on one host (`other_suites=10`), so a leg that started later
        # killed a concurrent leg's live instance — redislite unlinks its socket
        # on that SIGTERM, and the victim then reddened with "redis.socket … No
        # such file or directory" on a diff it never touched. The replacement
        # reaps only on a PROOF that no running leg can own the server (its
        # socket dir is gone, or it is older than the widest leg watchdog) and
        # KEEPS every case it cannot measure.
        # Best-effort like the find below: a cleanup that cannot run must not red
        # a leg, and a leak it fails to reap is the orphan gate's to report.
        run: |
          python3 .github/scripts/reap-redislite-orphans.py --apply || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        # Cache key v2 (#1349 T10): the v1 cache holds all-MiniLM-L6-v2 and
        # must never serve bge-small runs — a v1 restore would silently
        # exercise the WRONG embedder.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Embedding model REQUIRED (BAAI/bge-small-en-v1.5) — dense retrieval leg
        # #2573: same contract as the fast job — the step OWNS "the embedder is
        # required" and fails BY NAME when the pinned model cannot be obtained,
        # with a ::warning::/::error:: annotation. Without this the slow legs
        # would run the keyword-only TF-IDF fallback and could report green.
        # continue-on-error was deliberately REMOVED — see the fast job's note.
        #
        # #964: the step-level timeout still bounds a hung download (stalled TCP,
        # no error raised) that would otherwise stall the step for this job's
        # full 60m cap; a timeout now FAILS the step, which is the honest outcome.
        env:
          # #7359: the watchdog only DUMPS (exit=False) — it cannot fail a run. Below the
          # cap so the dump lands before the runner's kill; above the `--attempts N
          # --backoff S` budget so it does not fire during legitimate retry sleeps.
          TORTOISE_EMBEDDER_WATCHDOG_S: "570"
        timeout-minutes: 10
        run: |
          exec python3 tools/embedder_provision.py --attempts 5 --backoff 10
      - name: Drift guard — the expanded legs cover the gating slow pool (#1471/#9539/#10194)
        # #1471: the legs MUST cover the full slow-file set — a new slow file
        # added to config/ci-surfaces.yml `slow_files:` that lands in no leg
        # silently drops coverage (the #1260/#1270 drift class). Epic #1647 Task
        # 9 Step 5: the slow carve-out files are excluded from the expected set
        # (they run in the URI-unset carve-out job).
        #
        # #9539: the check now reads the MATRIX THIS RUN ACTUALLY EXPANDED
        # (`needs.changes.outputs.slow_matrix`, the derived artifact) instead of
        # parsing committed rows out of the workflow — there are no rows to
        # parse any more. That keeps the check pointed at what runs: a producer
        # that emitted a shard set diverging from the config pool (a packer
        # regression, a dropped bin, a duplicate) still reds here, and it reds
        # on the artifact rather than on a second derivation of the same thing.
        run: |
          MATRIX='${{ needs.changes.outputs.slow_matrix }}' python3 - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "tools")
          import ci_selection as cs
          raw = os.environ.get("MATRIX", "").strip()
          if not raw:
              # The `changes` job publishes this on every event; an empty value
              # means the derivation step failed or the output was dropped. Say
              # so by name instead of dying inside json.loads (#9539).
              print("❌ test-slow leg drift: changes.outputs.slow_matrix is EMPTY "
                    "— the selector's derivation did not publish a leg set")
              raise SystemExit(1)
          inc = json.loads(raw)["include"]
          legs = {i["half"]: i["files"].split() for i in inc}
          if not inc or not all(legs.values()):
              print(f"❌ test-slow leg drift: empty leg set {legs}")
              raise SystemExit(1)
          flat = [f for fs in legs.values() for f in fs]
          union, expected = set(flat), set(cs.slow_leg_files(cs.load_manifest()))
          dupes = sorted({f for f in flat if flat.count(f) > 1})
          if dupes:
              print(f"❌ test-slow leg drift: file(s) in more than one leg: {dupes}")
              raise SystemExit(1)
          if union != expected:
              print(f"❌ test-slow leg drift: missing={sorted(expected - union)} extra={sorted(union - expected)}")
              raise SystemExit(1)
          print(f"{len(legs)} legs cover exactly {len(expected)} slow files "
                f"(union == slow_gating_files(): slow_files - carve_out - "
                f"non-gating lane, no duplicates)")
          EOF
      - name: Provision FalkorDB services on ephemeral host ports (#6673)
        # #6673: replaced this job's `services:` block — same mechanics as the
        # fast job (see there). `uri_graph` stays empty: the slow legs set their
        # own `URI` below, and a job-wide TORTOISE_DB_URI would leak the server
        # lane into the embedded files this leg runs. Paired with the teardown
        # step at the end of the job.
        uses: ./.github/actions/falkordb-provision
      - name: Compute docker URI (epic #1647 Task 9 Step 5)
        # Task 9 Step 5: the slow legs flip to docker with the SAME mechanics
        # as the fast job (cycle-6 P2-8): job-level URI (test-prefixed path,
        # full==true only) + EXPECT_URI (the E2E-6 tripwire signal). Tier-2
        # PR legs keep the embedded shape (no URI).
        run: |
          URI=""
          EXPECT_URI=""
          CARVE_OUT=""
          SWEEP_TEAM_STRAYS=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            URI="docker://:falkordb@localhost:${TORTOISE_TEST_DOCKER_PORT:?the #6673 provision step did not export it}/tortoise_test_matrix"
            EXPECT_URI="1"
            # #1886 (issue #1884): dedicated fresh-per-job container — the
            # journal-blind team_* stray pass is safe here and stays live
            # (opt-in only since #1884).
            SWEEP_TEAM_STRAYS="1"
          else
            CARVE_OUT="1"  # tier-2 URI-less embedded shape — the P4 opt-in (Task 10)
          fi
          echo "URI=$URI" >> "$GITHUB_ENV"
          echo "EXPECT_URI=$EXPECT_URI" >> "$GITHUB_ENV"
          echo "CARVE_OUT=$CARVE_OUT" >> "$GITHUB_ENV"
          echo "SWEEP_TEAM_STRAYS=$SWEEP_TEAM_STRAYS" >> "$GITHUB_ENV"
      - name: Generate coverage manifest (slow legs — expected nodeids, epic #1647 Task 9)
        # Cycle-6 P2-8 (int-10): the manifest runs in its OWN step BEFORE the
        # pytest step (off the 40m watchdog), using each leg's DERIVED
        # `matrix.files` expression x --collect-only
        # -m 'not track_b and not live and not integration' (#4750) (the same
        # construction the run step builds) -> $PYTEST_MANIFEST (per-job since
        # the #10028 migration; it was the host-global /tmp/expected-nodeids.txt).
        run: |
          FILES=""
          # #2148 tier-2 (slow_run == true, full == false): run only the
          # surface-matched slow files (changes.outputs.slow_selected),
          # intersected with this leg's DERIVED list (#9539) so the duration-
          # balanced partition holds. Full selections run the whole leg.
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          else
            SLOW_SEL="${{ needs.changes.outputs.slow_selected }}"
            for f in ${{ matrix.files }}; do
              case " $SLOW_SEL " in
                *" $f "*) FILES="$FILES tests/$f.py";;
              esac
            done
          fi
          if [ -z "$FILES" ]; then
            echo "no slow files for this leg — no manifest (guard skips)"
            exit 0
          fi
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "not track_b and not live and not integration" --output "$PYTEST_MANIFEST"
        env:
          # Same defect class as the fast matrix's manifest step (see above): the
          # collect must see what the run sees, or the expected set silently omits
          # nodeids the run then executes. NO file in `slow_files` gates on the DB
          # URI today — all 70 collect the identical 4495 nodeids with and
          # without it (62 of the 70 are across the two legs; measured 2026-10-08
          # with this step's own `skip-guard.py --emit-manifest`) — so this
          # changes nothing now. It keeps
          # the step's stated contract true if one is relocated here, which is
          # exactly how the fast job's hole appeared.
          # Deliberately NOT on the carve-out job, which is URI-unset by design.
          TORTOISE_DB_URI: ${{ env.URI }}
      - name: Run slow test suite — leg ${{ matrix.half }} (known-slow files, #647)
        # Same guaranteed-summary treatment as the fast job (#798).
        # Per-test --timeout=300: these files have tests/setups that
        # legitimately take >90s; 300s still caps any hang.
        # #964: liveness heartbeat — see the fast job's run step. pytest
        # output is buffered to $PYTEST_LOG (per-job, `<runner.temp>/pytest.log`
        # since the #10028 migration; it was the host-global /tmp/pytest.log) for
        # the guaranteed tail, so
        # the job log was silent for 30-50 min; the loop below prints
        # progress to the live job log every 5 min.
        run: |
          set +e
          # #9539: this leg's DERIVED duration-balanced file list — the
          # `slow_matrix` row `changes` published (LPT off the committed
          # `durations` map); the drift guard above pins the union of the
          # expanded legs to slow_files minus the epic #1647 carve-out.
          # #2148 tier-2: same construction as the manifest step — surface-
          # matched slow files only (full == false); full runs keep the whole
          # leg. The two constructions must stay identical (the
          # manifest's expected nodeids reconcile against this run's junitxml).
          FILES=""
          if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          else
            SLOW_SEL="${{ needs.changes.outputs.slow_selected }}"
            for f in ${{ matrix.files }}; do
              case " $SLOW_SEL " in
                *" $f "*) FILES="$FILES tests/$f.py";;
              esac
            done
          fi
          if [ -z "$FILES" ]; then
            echo "no slow files selected — skipping"
            echo 0 > "${RUNNER_TEMP:-/tmp}/pytest-rc"
            # #4740: pytest never runs here, so the conftest sweep never writes
            # its report — write the explicit "no-pytest" one rather than
            # leaving the orphan gate to parse a missing report.
            printf '{"sweep":{"skipped":"no-pytest"}}' > "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
            exit 0
          fi
          # Epic #1647 Task 9 (cycle-6 P2-8): the run's own file list + rc
          # (the skip-guard step's gates) — same reuse contract as the fast
          # job. The manifest step above wrote the same file.
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          # #964 heartbeat: killed when pytest exits (kill+wait below).
          # Counts are rough live liveness signals — the -r fEs summary block
          # re-lists failures, so FAILED may double-count on the last tick;
          # the authoritative numbers are the tail + WATCHDOG banner below.
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' "$PYTEST_LOG" 2>/dev/null || true)
              f=$(grep -c ' FAILED' "$PYTEST_LOG" 2>/dev/null || true)
              echo "HEARTBEAT: pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          # Epic #1647 Task 9 (cycle-6 P2-8): junitxml + -o junit_family=xunit1
          # (the authoritative observed-set source, Task 3) and -r fEs (NOT the
          # historical -rfE — pytest 9.1.1 replaces the report set on repeated
          # -r flags, and a trailing -rfE would suppress the skip summary the
          # guard depends on; pinned by
          # tests/test_ci_selection.py::test_test_slow_job_carries_junitxml_manifest_guard).
          # #3239: the in-step watchdog must CLEAR the leg's committed weight
          # by tools/ci_selection.WATCHDOG_HEADROOM — the same floor the fast
          # shards derive their budget from. Since #9539 the legs are DERIVED
          # (`slow_gating_files()` LPT-packed into `slow_shards` = 5, #10194), so the
          # heavier leg carries the DERIVED weight, not a committed row. That
          # weight MOVES: 7.58m when this budget was argued, 5.72m after #10194
          # took the non-gating lane out of the pool. Read the live number from
          # `python3 tools/ci_selection.py --non-gating-report` (it prints every
          # leg's file count and estimated seconds) — do NOT quote one here, that
          # is how this paragraph went stale the first time.
          # This literal 40m is 6.99x that weight today, i.e. 3.5x the 2.0x
          # minimum the headroom floor requires (11.44m today; the floor itself
          # is `WATCHDOG_HEADROOM x heavier leg`, so it moves with the pool); it
          # was 10m
          # when the committed weight was 2.84m (the measured pytest step
          # was 4.70m, which does not enter the headroom arithmetic). The 40m/60m
          # pair is deliberately NOT derived from the leg weight — tightening it
          # belongs with the per-leg `matrix.watchdog_minutes` follow-up. Re-deriving
          # the budget when the leg set moves is
          # the whole point of `test_slow_leg_bounds_clear_the_committed_work`,
          # which reds here if this literal stops clearing the committed work.
          timeout -s INT -k 10 40m stdbuf -oL python -m pytest $FILES -v --timeout=300 -p no:cacheprovider -m 'not track_b and not live and not integration' --maxfail=20 -r fEs --durations=15 --junitxml="$PYTEST_JUNIT" -o junit_family=xunit1 > "$PYTEST_LOG" 2>&1
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 300 "$PYTEST_LOG"
          # #3470: the `tail -n` above is a LINE-COUNT window, not a result —
          # post-summary interpreter-exit noise fills it and pushes BOTH the
          # session summary and the `-r fEs` report above the cut, so the log
          # stops saying whether the leg finished. Read the summary from the
          # FULL log instead, and name the INCOMPLETE case out loud so an
          # unattributable leg is a NAMED failure rather than a silent gap in
          # the #3467 failure set. One definition: pytest-attribution.sh.
          bash .github/scripts/pytest-attribution.sh --log "$PYTEST_LOG" --rc "$rc"
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' "$PYTEST_LOG" || echo "(no FAILED/ERROR nodeids)"
          # #880: 124 = timeout SIGINT kill; 137 = -k 10 SIGKILL after pytest
          # ignored INT mid-test; 2 = pytest's own SIGINT summary — the count
          # banner must print for all three (previously only 124 matched,
          # so the banner never printed on the real kill path).
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' "$PYTEST_LOG")
            failed=$(grep -c ' FAILED' "$PYTEST_LOG")
            errored=$(grep -c ' ERROR' "$PYTEST_LOG")
            echo "==================== WATCHDOG: pytest killed after 40m ($passed passed, $failed failed, $errored errored so far) — last test lines above ===================="
          fi
          echo "==================== pytest exit code: $rc ===================="
          exit $rc
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Epic #1647 Task 9 Step 5: the slow legs flip to docker (the same
          # gate as the fast job — full==true only; empty on tier-2 PRs).
          # Task 10 (P4): tier-2 URI-less slow legs opt in via CARVE_OUT=1
          # (the URI-required enforcement — P1-9).
          TORTOISE_DB_URI: ${{ env.URI }}
          TORTOISE_TEST_EXPECT_URI: ${{ env.EXPECT_URI }}
          TORTOISE_TEST_CARVE_OUT: ${{ env.CARVE_OUT }}
          # #1886: dedicated fresh-per-job docker container — journal-blind
          # team_* stray pass stays live in CI (opt-in only — issue #1884).
          TORTOISE_TEST_SWEEP_TEAM_STRAYS: ${{ env.SWEEP_TEAM_STRAYS }}

      - name: Skip-fail guard (slow legs, epic #1647 Task 9)
        # Cycle-6 P2-8: the same junitxml-reconciled coverage manifest as the
        # fast job — gated on rc==0 AND non-empty $FILES (the no-selected-files
        # path writes rc=0 with no junitxml; with a manifest that would
        # false-red). A vanished nodeid or a FalkorDB-reasoned skip reds.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            if [ -s "${RUNNER_TEMP:-/tmp}/pytest-files" ]; then
              python3 tools/skip-guard.py "$PYTEST_LOG" --junitxml="$PYTEST_JUNIT" --manifest "$PYTEST_MANIFEST"
            else
              python3 tools/skip-guard.py "$PYTEST_LOG"
            fi
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi

      - name: Dump tolerated tempdir-cleanup leaks (issue #7735)
        # Same capture trap as #1103 above: a PASSING test's `logger.warning` is
        # discarded by pytest capture (measured on the fast job's flags — 0
        # occurrences in /tmp/pytest.log and 0 in the junit XML), so the
        # ENOTEMPTY teardown leaks tolerated by `TemporaryDirectory.cleanup`
        # are mirrored to an artifact at session end. The writer MERGES by path
        # so a future xdist admission cannot truncate a peer's record wholesale
        # (a same-instant write can still drop one entry) — INERT today: CI is
        # serial (`XDIST_WORKERS=0`), so a single
        # session owns the path. Informational: the step never fails the job.
        # Every job listed in _LEAK_SURFACED_JOBS carries this step (pinned by
        # tests/test_tmpdir_hygiene.py::test_suite_jobs_surface_the_tolerated_leak).
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/tempdir-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== tolerated tempdir-cleanup leaks (issue #7735) ==="
            cat "$LOG"
          else
            echo "no tolerated tempdir-cleanup leak recorded at $LOG"
          fi

      - name: Assert no redislite orphans (issue #1005 / epic #1647 E2E-7)
        # Same gate contract as the fast job's assert (#4740): the bound is read
        # from the conftest session-end sweep's own report
        # (.github/scripts/orphan-bound.sh), never a hand-picked constant. On a
        # docker leg the sweep reports no embedded server was ever running, so
        # the bound is structurally 0; on a tier-2 embedded leg it is the
        # sweep's own post-sweep count of THIS RUN's servers (`own_left`), and
        # every count-based red is applied to the servers attributed to this run
        # (#1005) — a host-wide `COUNT` above `left` is a `::warning::`, never a
        # verdict. A `cleared: false` report does not red at any
        # measured COUNT: `cleared` reports whether the sweep's TIME BUDGET
        # sufficed — a function of runner load — not its residue (#4989).
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          # #4740: read the count and pgrep's OWN status separately — a
          # `${PIPESTATUS[0]}` after `COUNT=$(pgrep … | wc -l)` is the `tr`
          # status, never pgrep, so a failed probe would read as 0 and pass.
          # `$?` on the bare assignment IS pgrep's status (rc 0/1 are real
          # measurements; anything else must RED). See the fast job's note.
          PIDS=$(pgrep -f "redislite/bin/redis-server")
          prc=$?
          [ "$prc" -le 1 ] || { echo "::error::pgrep failed rc=$prc — the orphan count is unmeasured (issue #1005)"; exit 1; }
          COUNT=$(printf '%s' "$PIDS" | wc -w | tr -d ' ')
          # #1005 (epic #1647 E2E-7): hand the gate the counted servers' argv,
          # so it can say WHICH of them live under this run's own session temp
          # root. `COUNT` alone is host-wide — on the self-hosted pool every
          # concurrent job's servers appear in it — and comparing that to the
          # sweep's snapshot redded PASSING runs (9 counted vs left=8; 22 vs
          # 14). A `ps` failure here is a FAILED probe, never an empty
          # measurement: the attribution would silently degrade to "someone
          # else's servers" and hide a real residue.
          ARGV="${RUNNER_TEMP:-/tmp}/redislite-orphan-argv.txt"
          : > "$ARGV"
          if [ -n "$PIDS" ]; then
            # `pgrep` prints one pid per line; GNU `ps` refuses a `-p` list with
            # newlines in it ("process ID list syntax error") while BSD `ps`
            # tolerates them — measured, so the separator is normalised to a
            # comma list both accept. Without this the Linux legs write an EMPTY
            # argv file and every counted server would read as unattributable.
            PIDLIST=$(printf '%s' "$PIDS" | tr -s '[:space:]' ',' |
              sed 's/^,*//; s/,$//')
            # A whitespace-only probe normalises to an EMPTY list, which GNU ps
            # rejects ("list of process IDs must follow -p") — there is nothing
            # to attribute, so do not call it.
            if [ -n "$PIDLIST" ]; then
              ps -ww -o pid=,args= -p "$PIDLIST" > "$ARGV" 2>/dev/null
              arc=$?
              # #10255 review 1 (P1): `ps -p <list>` exits 1 when NO listed pid
              # matched — measured on procps-ng 4.0.4 (`ps -p 1` → 0,
              # `ps -p 999999` → 1, `ps -p 1,999999` → 0), and the procps man
              # page publishes no exit-status contract at all, so `-eq 0` was
              # an assumption the tool never made. That rc is a COMPLETED
              # measurement of an empty population, not a failed probe: this
              # read sits inside the residue's shutdown window, which the
              # gate's own header documents as normal (a server the sweep
              # still saw exits in the ~0.05s before this later probe), and
              # every counted server exiting in between is most likely exactly
              # at COUNT 1-2. Failing the job there reds a passing run that
              # leaked nothing, with a message that blames attribution and
              # sends the reader after a residue that does not exist. Only a
              # real probe failure (rc>1, a missing `ps`, a timeout) reds. On
              # the benign path the (truncated) file stays empty, so the gate
              # reads own_now=0 — below every `own_left`, i.e. never a red.
              [ "$arc" -le 1 ] || { echo "::error::ps failed rc=$arc — the orphan count cannot be attributed to this run (issue #1005)"; exit 1; }
            fi
          fi
          bash .github/scripts/orphan-bound.sh \
            --count "$COUNT" \
            --rc "$RC" \
            --hygiene "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json" \
            --argv "$ARGV"

      - name: Upload pytest log (measurement artifact, #1477)
        # #1477: non-gating upload — same contract as the fast job's upload.
        # Epic #1647 Task 9 (cycle-6 P2-8): the junitxml + expected nodeids
        # join the artifact set (the manifest's observed-set evidence).
        #
        # #6263: the name MUST carry the leg. `github.job` is the BASE job id for
        # every matrix leg, so the bare form uploads ONE name from both halves.
        # ci-timing.yml then downloads by pattern with `merge-multiple` unset
        # (false), which places same-named artifacts in ONE directory — leg (b)'s
        # `pytest.log` overwrites leg (a)'s, and the durations map silently
        # measures one half of the slow shard. The `test` job above already
        # carries its leg and is the in-file precedent.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}-${{ matrix.half }}
          # #10028: the per-JOB paths resolved in this job's FIRST step, NOT the
          # host-global `/tmp/...` literals four sibling legs share. Uploading by
          # the literal path is how one leg's artifact silently replaced
          # another's (the same defect #6263 fixed in the artifact NAME).
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/expected-nodeids.txt
          if-no-files-found: ignore

      - name: Stop FalkorDB services (#6673)
        if: always()
        uses: ./.github/actions/falkordb-teardown

  test-concurrency-falkor:
    # #942 target 2: prove concurrent-writer atomicity on the REAL FalkorDB
    # sidecar — the durable path the flipped docs now default to. Runs ONLY
    # the two live docker:// tests — never whole files (test_embedded_concurrency.py
    # is also in test-slow, and whole-file runs would start embedded redislite
    # servers against the live 6379 — the #798 collision mode). The skip-fail
    # guard turns a future skip regression RED instead of green: it matches
    # BOTH pytest 8.x output formats (-v progress: "nodeid SKIPPED (reason)";
    # -rs summary: "SKIPPED [N] tests/file.py:line").
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 15
    # #6673: TORTOISE_DB_URI is no longer a job-level literal — the host port is
    # assigned at runtime — so the provision step below exports it
    # (`uri_graph: tortoise`), and the teardown step at the end of the job
    # removes the container.
    # #6673: the passworded FalkorDB service used to be declared HERE as a
    # `services:` block on the fixed host port 6379:6379 (this job starts the
    # passworded service only — it passes `legacy: "false"`). It is now started
    # by `.github/actions/falkordb-provision` (see the first FalkorDB step
    # below) on EPHEMERAL host ports, because every self-hosted runner on this
    # host shares ONE Docker daemon: a fixed host port is a single global
    # namespace, so two services jobs overlapping made the second container's
    # `docker start` fail with "Bind for 0.0.0.0:6379 failed: port is already
    # allocated" — which aborts the RUNNER in its `initialize_containers`
    # pre-step and reds the job in ~9s with ZERO tests run (a false red).
    # The image pin, the `--requirepass falkordb --save ''` REDIS_ARGS pair and
    # the health gate moved with it. The probe family is unchanged; the port is
    # now $TORTOISE_TEST_DOCKER_PORT, read by tests/_live_utils.py.
    #
    # ⛔ PER-JOB PYTEST ARTIFACTS (first step, #10280). This leg was one of the
    # six #10280 names as still writing host-global `/tmp` artifacts, and it bit
    # on THIS job (run 40884374618, job 123539933295): the live-concurrency step
    # wrote `/tmp/pytest.log`, a co-tenant job on the same self-hosted host
    # truncated it mid-run, and this leg's own `tail` and `pytest-attribution.sh`
    # then read `tests/test_backfill_sources.py` / `tests/test_billing.py` —
    # files it never runs — so it reported "test leg INCOMPLETE — no pytest
    # summary; failure set unobservable" and the rail could attribute nothing.
    # The inverse direction is worse and equally reachable: the skip-fail guard
    # below greps this file for its three nodeids, so a peer's log makes a leg
    # that ran NOTHING look certified. `$GITHUB_ENV` only reaches SUBSEQUENT
    # steps, hence first, and it FAILS CLOSED on a missing `RUNNER_TEMP` — a
    # silent `/tmp` fallback is indistinguishable from the bug it fixes.
    steps:
      # #10280: this leg's log is PER-JOB. `/tmp` is ONE namespace across every
      # runner install on a shared self-hosted host, so a `/tmp/pytest.log`
      # literal is truncated and interleaved by whatever else the pool is running;
      # the counts, the tail and the reporter's ownership proof then describe a
      # co-tenant's session. `RUNNER_TEMP` is per-runner, and a runner runs one job
      # at a time, so it is per-job. Same resolver shape as the `test` job's
      # (#10028); it fails closed rather than falling back to the host `/tmp`.
      - name: Resolve per-job pytest artifact paths (#10280)
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:?RUNNER_TEMP is not set — refusing to fall back to a host-global /tmp artifact path}"
          echo "PYTEST_LOG=$base/pytest.log" >> "$GITHUB_ENV"
          echo "pytest artifacts for this job are under $base (per-job, not the host /tmp)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip dependency caches (#7612)
        # #7612: ephemeral runners, no dependency cache — every job downloaded
        # its wheels cold on every run. Placed BEFORE install-cpu-torch so torch
        # (140 wheels, ~3.2 GB) is served from the cache as well.
        # Coverage-neutral: pip-only job, no uv.lock to enforce; pip's cache is
        # content-addressed and cannot substitute a different version.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - uses: ./.github/actions/install-cpu-torch
      - name: Install package + test extras
        # [test,embeddings] — NOT just [test]: the pre-cache step imports
        # sentence_transformers (embeddings extra), and create_point calls
        # compute_embedding. Matches the sibling jobs exactly.
        run: pip install -e '.[test,embeddings]'
      - name: Reap ABANDONED redislite litter (#1005 / #3653)
        # #1005: leaky runners accumulate redislite tempdirs from every failed
        # embedded-redis run — discover() then skips its stale-socket walk
        # (>5000 entries), so the reaper chaos tests fail with "orphan not
        # cleaned". Reap strays before the suite.
        # #3653: it used to be `pkill -f "redis-server unixsocket"`, which
        # matches EVERY redislite on the box. This matrix runs up to four such
        # legs per workflow and its own orphan gate has measured ten other live
        # suites on one host (`other_suites=10`), so a leg that started later
        # killed a concurrent leg's live instance — redislite unlinks its socket
        # on that SIGTERM, and the victim then reddened with "redis.socket … No
        # such file or directory" on a diff it never touched. The replacement
        # reaps only on a PROOF that no running leg can own the server (its
        # socket dir is gone, or it is older than the widest leg watchdog) and
        # KEEPS every case it cannot measure.
        # Best-effort like the find below: a cleanup that cannot run must not red
        # a leg, and a leak it fails to reap is the orphan gate's to report.
        run: |
          python3 .github/scripts/reap-redislite-orphans.py --apply || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        # Sibling parity (test/test-slow both cache BEFORE pre-caching) —
        # without the restore step every run downloads ~130MB. Cache key v2
        # (#1349 T10): the v1 cache holds all-MiniLM-L6-v2 and must never
        # serve bge-small runs — a v1 restore would silently exercise the
        # WRONG embedder.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Embedding model REQUIRED (BAAI/bge-small-en-v1.5) — dense retrieval leg
        # #2573: this job runs its live seq guard through compute_embedding via
        # create_point, and — unlike the fast/slow legs — carries NO skip-guard,
        # so a missing model had NO loud signal at all here. This step is it.
        # continue-on-error was deliberately REMOVED — see the fast job's note.
        #
        # #964 (review): same hung-download guard as test/test-slow — this job's
        # 15-min cap makes a stalled download strictly worse (it would burn the
        # whole budget and cancel the run step with NO summary), so the timeout
        # now fails the step outright.
        env:
          # #7359: the watchdog only DUMPS (exit=False) — it cannot fail a run. Below the
          # cap so the dump lands before the runner's kill; above the `--attempts N
          # --backoff S` budget so it does not fire during legitimate retry sleeps.
          TORTOISE_EMBEDDER_WATCHDOG_S: "570"
        timeout-minutes: 10
        run: |
          exec python3 tools/embedder_provision.py --attempts 5 --backoff 10
      - name: Provision FalkorDB services on ephemeral host ports (#6673)
        # #6673: replaced this job's `services:` block. `uri_graph` is set here
        # because this job's TORTOISE_DB_URI used to be the fixed-port literal
        # (the live tests run against the real sidecar by definition).
        # `legacy: "false"` preserves the original shape exactly: this job's
        # `services:` block declared ONLY the passworded service, so it never
        # had a passwordless legacy container to probe.
        uses: ./.github/actions/falkordb-provision
        with:
          uri_graph: tortoise
          legacy: "false"
      - name: Run live concurrency tests (real FalkorDB sidecar)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set +e
          timeout -s INT -k 10 10m stdbuf -oL python -m pytest \
            tests/test_event_store.py::test_seq_is_monotonic_under_concurrency_live_falkor \
            tests/test_event_store.py::test_next_seq_ceiling_is_atomic_across_workers_live_falkor \
            tests/test_embedded_concurrency.py::test_concurrent_writers_live_falkor_no_lost_writes \
            -v -rs --timeout=300 -p no:cacheprovider --maxfail=10 -rfE --durations=15 > "$PYTEST_LOG" 2>&1
          rc=$?
          echo "==================== pytest summary (tail) ===================="
          tail -n 120 "$PYTEST_LOG"
          # #3470: the `tail -n` above is a LINE-COUNT window, not a result —
          # post-summary interpreter-exit noise fills it and pushes BOTH the
          # session summary and the `-r fEs` report above the cut, so the log
          # stops saying whether the leg finished. Read the summary from the
          # FULL log instead, and name the INCOMPLETE case out loud so an
          # unattributable leg is a NAMED failure rather than a silent gap in
          # the #3467 failure set. One definition: pytest-attribution.sh.
          bash .github/scripts/pytest-attribution.sh --log "$PYTEST_LOG" --rc "$rc"
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' "$PYTEST_LOG" || echo "(no FAILED/ERROR nodeids)"
          # Skip-fail guard: live tests must RUN here, never skip (vacuity).
          # Matches BOTH pytest output formats (-v progress: "nodeid SKIPPED";
          # -rs summary: "SKIPPED [N] tests/file.py:line").
          # This grep is WHY the log must be this job's OWN (#10280): a peer's
          # log would certify a leg that ran nothing.
          if grep -E '(test_seq_is_monotonic_under_concurrency_live_falkor|test_next_seq_ceiling_is_atomic_across_workers_live_falkor|test_concurrent_writers_live_falkor_no_lost_writes) SKIPPED|SKIPPED \[[0-9]+\] tests/(test_event_store|test_embedded_concurrency)\.py' "$PYTEST_LOG"; then
            echo "❌ live tests SKIPPED — the job would be green while testing nothing"
            rc=1
          fi
          echo "==================== pytest exit code: $rc ===================="
          exit $rc
      - name: Dump tolerated tempdir-cleanup leaks (issue #7735)
        # Same capture trap as #1103 above: a PASSING test's `logger.warning` is
        # discarded by pytest capture (measured on the fast job's flags — 0
        # occurrences in /tmp/pytest.log and 0 in the junit XML), so the
        # ENOTEMPTY teardown leaks tolerated by `TemporaryDirectory.cleanup`
        # are mirrored to an artifact at session end. The writer MERGES by path
        # so a future xdist admission cannot truncate a peer's record wholesale
        # (a same-instant write can still drop one entry) — INERT today: CI is
        # serial (`XDIST_WORKERS=0`), so a single
        # session owns the path. Informational: the step never fails the job.
        # Every job listed in _LEAK_SURFACED_JOBS carries this step (pinned by
        # tests/test_tmpdir_hygiene.py::test_suite_jobs_surface_the_tolerated_leak).
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/tempdir-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== tolerated tempdir-cleanup leaks (issue #7735) ==="
            cat "$LOG"
          else
            echo "no tolerated tempdir-cleanup leak recorded at $LOG"
          fi
      - name: Upload pytest log (measurement artifact, #1477)
        # #1477: non-gating upload — same contract as the fast job's upload.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}
          # #10280: `runner.temp` (not /tmp) — the runner context IS allowed in
          # `steps.<id>.with`, which is why the upload reads the path here rather
          # than from a job-level `env:` block (see the #6253 note on test-slow).
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: ignore
      - name: Validate docker-compose.yml (ports + header edits)
        # T1 Step 6 ships with zero other verification — no workflow validates
        # compose today. ubuntu-latest has docker + the repo checked out.
        run: docker compose config -q && echo "compose config OK"
      - name: Docs-consistency guard (embedded must never be "default" again)
        # #942 T1 enforcement: the flipped onboarding surfaces must not regress.
        # Runs even when the pytest step fails (if: always()) — it is the
        # cheap gate that keeps the flip honest. Scope = the SAME 5 files as
        # T1 Step 9. EXCLUDED by design: docs/plans|epics|migrations (historical
        # records), website/docs.html (hosted sample), graph-scripts/setup.py
        # (legacy installer on a deliberately distinct port).
        if: always()
        run: |
          HITS=$(grep -rn "Embedded (default)\|recommended to start\|multi-node\|16379\|passwordless URI is\|docker://localhost:6379\|docker://:@localhost:6379" README.md docs/quickstart-selfhosted.md docs/infra-runbook.md website/self-hosted.html .env.example || true)
          if [ -n "$HITS" ]; then
            echo "❌ embedded-first/16379 leftovers in flipped onboarding docs:"
            echo "$HITS"
            exit 1
          fi
          echo "docs-consistency guard OK"

      - name: Stop FalkorDB services (#6673)
        if: always()
        uses: ./.github/actions/falkordb-teardown

  # Whole-registry compile gate for pack manifests (epic #909, R-16).
  # Every pack PR must load the ENTIRE registry (all packs/*/manifest.yaml)
  # with zero validation errors — a broken manifest must fail CI at PR time,
  # not the shared registry at runtime. Runs on every PR (cheap: seconds).
  packs-compile:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # #3239 shape: this job is one of `python-ci-gate`'s needs and carried NO
    # outer cap, so GitHub's 360m default applied — a wedged `pip install -e .`
    # (network) or a hung pack load withheld the REQUIRED check for six hours.
    # Measured 2026-10-27 (60 newest completed python-ci.yml runs,
    # first-step→last-step, completed jobs only): p50 0.60m, p95 0.76m,
    # max 0.80m over the 19 runs whose job actually executed. 15m is the
    # runner-stall floor the required-path jobs share, not a thin bound — the
    # same floor `test-track-b` took in #3239 (measured max 1.15m there).
    # The figures and the command that produced them live in
    # docs/ops/ci-wall-clock.md.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires-python >= 3.12
      - name: Install package
        run: pip install -e .
      - name: Whole-registry compile (all packs, zero validation errors)
        run: |
          python - <<'EOF'
          from pathlib import Path
          from tortoise.pack_registry import PackRegistry

          registry = PackRegistry(Path("packs"))
          loaded = registry.load_all()
          if registry.errors:
              for ns, errs in sorted(registry.errors.items()):
                  for err in errs:
                      print(f"ERROR [{ns}]: {err}")
              raise SystemExit(
                  f"packs-compile FAILED: {len(registry.errors)} pack(s) with validation errors"
              )
          print(f"packs-compile OK: {loaded} packs loaded, 0 validation errors")
          EOF

  # Track B job (epic #902 A8, #1058): runs ONLY the @track_b tests
  # explicitly. MUST-PASS — both Track B sentinels (_TRACK_B_FULL,
  # SENTINEL_A9) have shipped; wired into python-ci-gate's needs. The suite
  # itself is inert in default CI via -m "not track_b" + its skipifs.
  test-track-b:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # #3239: this job carried NO outer cap, so GitHub's 360m default applied —
    # a hung Track B leg could withhold the REQUIRED python-ci-gate for six
    # hours. Measured 2026-09-30 (60 newest completed runs): pytest-step max
    # 0.08m, job max 1.15m — 10m is a floor, not a measurement-thin bound.
    timeout-minutes: 10
    # Epic #1647 Task 9 Step 5: track-b flips to docker — the track_b tests'
    # db_path SDK constructions redirect to the server lane via the seam.
    # The URI carries the test-prefixed path (P1-2) for consistency.
    env:
      # #6673: TORTOISE_DB_URI is exported by the provision step below
      # (`uri_graph: tortoise_test_matrix`) — it cannot be a job-level literal
      # any more because the host port is assigned at runtime.
      TORTOISE_TEST_EXPECT_URI: "1"
      # #1886 (issue #1884): dedicated fresh-per-job docker lane — the
      # journal-blind team_* stray pass is safe here and stays live
      # (opt-in only since #1884; the shared dev container never sets it).
      TORTOISE_TEST_SWEEP_TEAM_STRAYS: "1"
    # #6673: the passworded FalkorDB service used to be declared HERE as a
    # `services:` block on the fixed host port 6379:6379 (this job starts the
    # passworded service only — it passes `legacy: "false"`). It is now started
    # by `.github/actions/falkordb-provision` (see the first FalkorDB step
    # below) on EPHEMERAL host ports, because every self-hosted runner on this
    # host shares ONE Docker daemon: a fixed host port is a single global
    # namespace, so two services jobs overlapping made the second container's
    # `docker start` fail with "Bind for 0.0.0.0:6379 failed: port is already
    # allocated" — which aborts the RUNNER in its `initialize_containers`
    # pre-step and reds the job in ~9s with ZERO tests run (a false red).
    # The image pin, the `--requirepass falkordb --save ''` REDIS_ARGS pair and
    # the health gate moved with it. The probe family is unchanged; the port is
    # now $TORTOISE_TEST_DOCKER_PORT, read by tests/_live_utils.py.
    steps:
      # #10280: this leg's three pytest artifacts are PER-JOB. `/tmp` is ONE
      # namespace across every runner install on a shared self-hosted host, so a
      # `/tmp/expected-nodeids.txt` written by a concurrent leg IS this job's
      # manifest — which is how this required check reds with no test failing:
      # run 40990582554 wrote `4 expected nodeids -> /tmp/expected-nodeids.txt`
      # and then reconciled its 4 testcases against a `test-carve-out` leg's
      # register `616 expected nodeid(s) absent` (the leg's 616-nodeid emit landed
      # on the same host 11s earlier). `RUNNER_TEMP` is per-runner, and a runner
      # runs one job at a time, so it is per-job. Same resolver shape as the
      # `test` job's (#10028); it fails closed rather than falling back to `/tmp`.
      - name: Resolve per-job pytest artifact paths (#10280)
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:?RUNNER_TEMP is not set — refusing to fall back to a host-global /tmp artifact path}"
          {
            echo "PYTEST_LOG=$base/pytest.log"
            echo "PYTEST_JUNIT=$base/junit.xml"
            echo "PYTEST_MANIFEST=$base/expected-nodeids.txt"
          } >> "$GITHUB_ENV"
          echo "pytest artifacts for this job are under $base (per-job, not the host /tmp)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[test]' falkordblite 2>&1 | tail -2
      - name: Provision FalkorDB services on ephemeral host ports (#6673)
        # #6673: replaced this job's `services:` block (same mechanics as the
        # fast job). `uri_graph` is set because this job's TORTOISE_DB_URI used
        # to be the fixed-port literal — the track_b tests redirect onto the
        # server lane by definition. `legacy: "false"` preserves the original
        # shape: this job's `services:` block declared ONLY the passworded
        # service (legacy probes skip there, as before). Paired with the
        # teardown step below.
        uses: ./.github/actions/falkordb-provision
        with:
          uri_graph: tortoise_test_matrix
          legacy: "false"
      - name: Generate coverage manifest (track-b, epic #1647 Task 9)
        # The track-b run uses `-m track_b` — the manifest's collect-only
        # MUST use the same marker (never the default 'not track_b'), or the
        # expected set would not match the observed set.
        run: |
          FILES="tests/test_ingest_safety.py"
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "track_b" --output "$PYTEST_MANIFEST"
      - name: Run Track B tests (explicit marker)
        # §7: non-blocking UNTIL the sentinels flip, then MUST-PASS — both
        # Track B sentinels (_TRACK_B_FULL, SENTINEL_A9) have shipped, so
        # this job is must-pass now. Epic #1647 Task 9: junitxml + -r fEs
        # (the coverage-manifest observed-set source).
        run: |
          set +e
          # #3239: 5m (was 20m) — the measured pytest step is 0.08m; the
          # in-step kill must stay BELOW the job's 10m outer cap (#798).
          timeout -s INT -k 10 5m stdbuf -oL python -m pytest \
            tests/test_ingest_safety.py -m track_b -v --timeout=300 \
            -p no:cacheprovider --maxfail=20 -r fEs --junitxml="$PYTEST_JUNIT" \
            -o junit_family=xunit1 > "$PYTEST_LOG" 2>&1
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          # #3470: a BLIND `tail -25` is a LINE-COUNT window, not a result —
          # post-summary interpreter-exit noise fills it and pushes BOTH the
          # session summary and the `-r fEs` report above the cut. This leg is
          # a must-pass gate member whose log the rail reads (its capture is
          # `gh run view --log-failed`, across EVERY job), and it carries no
          # FAILED/ERROR nodeid grep, so the tail was its ONLY attribution
          # channel. Read the summary from the FULL log instead, and name the
          # INCOMPLETE case out loud. One definition: pytest-attribution.sh.
          tail -25 "$PYTEST_LOG"
          bash .github/scripts/pytest-attribution.sh --log "$PYTEST_LOG" --rc "$rc"
          echo "track-b rc=$rc (must-pass — gate member)"
          exit $rc
      - name: Skip-fail guard (track-b, epic #1647 Task 9)
        # Same junitxml-reconciled manifest as the other docker surfaces — a
        # vanished track_b nodeid or a FalkorDB-reasoned skip reds.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            python3 tools/skip-guard.py "$PYTEST_LOG" --junitxml="$PYTEST_JUNIT" --manifest "$PYTEST_MANIFEST"
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi
      - name: Dump tolerated tempdir-cleanup leaks (issue #7735)
        # Same capture trap as #1103 above: a PASSING test's `logger.warning` is
        # discarded by pytest capture (measured on the fast job's flags — 0
        # occurrences in /tmp/pytest.log and 0 in the junit XML), so the
        # ENOTEMPTY teardown leaks tolerated by `TemporaryDirectory.cleanup`
        # are mirrored to an artifact at session end. The writer MERGES by path
        # so a future xdist admission cannot truncate a peer's record wholesale
        # (a same-instant write can still drop one entry) — INERT today: CI is
        # serial (`XDIST_WORKERS=0`), so a single
        # session owns the path. Informational: the step never fails the job.
        # Every job listed in _LEAK_SURFACED_JOBS carries this step (pinned by
        # tests/test_tmpdir_hygiene.py::test_suite_jobs_surface_the_tolerated_leak).
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/tempdir-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== tolerated tempdir-cleanup leaks (issue #7735) ==="
            cat "$LOG"
          else
            echo "no tolerated tempdir-cleanup leak recorded at $LOG"
          fi
      - name: Upload track-b log (measurement artifact, #1477)
        # #1477: non-gating upload — track-b writes $PYTEST_LOG (no
        # --durations, but the PASSED/FAILED lines feed the flake signal).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.job }}
          # #10280: `runner.temp`, not the host `/tmp` — the second half of the
          # same migration (the paths above are per-job; naming the old literals
          # here would upload whatever a co-tenant left behind).
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/expected-nodeids.txt
          if-no-files-found: ignore

      - name: Stop FalkorDB services (#6673)
        if: always()
        uses: ./.github/actions/falkordb-teardown

  test-carve-out:
    # Epic #1647 E2E-4 (Task 9 Step 5): the embedded carve-out's CI home —
    # the tests that run embedded BY DESIGN (recovery auto-rebuild
    # D2/D3, busy-error D11, reaper/chaos, backup-restore, migration
    # integration). URI is DELIBERATELY unset (the redirect would fire and
    # flip these files to the server lane); TORTOISE_TEST_CARVE_OUT=1 is the
    # P4 enforcement prep (Task 10 Step 1a: default pytest requires
    # TORTOISE_DB_URI unless CARVE_OUT=1 — this job is what keeps the
    # enforcement from failing the carve-out). The skip-guard's manifest mode
    # covers the set (the carve-out's redislite-availability skips are the
    # exempt reason family — E2E-4 row: "skip-guard exempts them").
    # #1988: previously gated on full==true (review finding #3) with tier-2
    # PRs running the carve-out files embedded in the fast-matrix legs — but
    # the tier-2 process exhausts its redislite spawn budget before the late
    # embedded suites (RedisLiteServerStartError). The carve-out job now runs
    # on PRs too (fresh process) and ci_selection excludes carve-out files
    # from the tier-2 legs, so the embedded files always run here.
    # #2147 (2026-09-02-ci-audit F1): the job ran on EVERY PR and push,
    # diff-unaware — a docs-only PR (#2132) paid 23m31 for the full 23-file
    # embedded set, and the job was the critical path of every main push.
    # Diff-gated on the selector's carve_out_run: full selections (push to
    # main / unknown-path or shared-module PRs — the
    # trunk backstop, NEVER dropped) or a PR whose matched
    # surfaces own carve-out files (core/api/sdk/eval — the embedded /
    # daemon / registry / guard surfaces; a carve-out TEST file change
    # selects its owning surface, so it re-runs here too). docs/website/
    # config-only PRs (surfaces == [] -> carve_out_run == false) skip. When it
    # runs, the FULL carve_out leg runs ACROSS ITS SHARDS: the selector packs
    # the embedded set into `carve_shards` LPT bins and each leg executes one
    # bin, so the leg's coverage is the union over the shards — pinned as an
    # exact partition by tests/test_ci_selection.py. (The embedded set is one
    # coherent E2E-4 surface, and tier-2 legs already exclude carve-out files,
    # so its shards are their only home on PRs. A per-JOB full run is no longer
    # the contract.)
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.carve_out_run == 'true'
    runs-on: ubuntu-latest
    # W37: the carve-out pool. Until now this was ONE unsharded job and it was
    # the CI critical path — p50 16.9m of a median 18.6m run wall (91%), while
    # the fast band was already split nine ways, so the wall was
    # `max(9 fast shards, 1 carve-out)` and the carve-out was the maximand.
    # The set is packed by the selector into `carve_shards` LPT bins
    # (`config/ci-surfaces.yml`), exactly as the fast band is.
    # `fail-fast: false` is load-bearing: with the default, the first red shard
    # CANCELS the others, so the failure set the admin-merge rail derives from
    # this job's logs (`scripts/ci-failure-set.sh`) would be partial and the
    # rail would refuse as unattributable instead of comparing (#4453).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.carve_matrix) }}
    # ⛔ The BARE `test-carve-out` is shard 0's name (`suffix == ''`), NOT
    # `test-carve-out (a)`. The merge rail's lane-parity subtracts main's job
    # names from the PR's, and an unadopted main holds the bare name — so
    # suffixing shard 0 would make the PR's shard set a RENAME rather than a
    # superset and would refuse every merge until it landed. The selector
    # guarantees the bare-first shape; `test_carve_out_matrix_keeps_the_bare_
    # name` pins it.
    name: test-carve-out${{ matrix.suffix }}
    # #3239/W37: OUTER cap, strictly above the in-step per-shard watchdog
    # (#798: the in-step kill is the one that prints the counts). It was 45m
    # when ONE job carried the whole 16.02m step; now each shard carries
    # `${{ matrix.watchdog_minutes }}`m (floor-clamped — 19m at 3 shards, since
    # the 53 carve-out files sum to 1158.1s and `carve_shards: 3` puts ~6.43m on
    # each, under `WATCHDOG_FLOOR_MIN`'s `est x 2`), so the cap only has
    # to back THAT — and lowering it 45m -> 30m TIGHTENS the stale-head
    # exposure #3239 is about rather than loosening it. Both directions are
    # derived, not chosen: `test_every_bounded_pytest_job_caps_above_its_
    # watchdog` asserts cap > the LARGEST emitted shard watchdog, and
    # `test_carve_out_shard_bounds_clear_the_committed_work_without_dwarfing_it`
    # asserts cap <= 3x that watchdog (and <= 3x the measured step).
    timeout-minutes: 30
    env:
      TORTOISE_TEST_CARVE_OUT: "1"
    steps:
      # #10280: this shard's three pytest artifacts are PER-JOB. The legs of this
      # matrix run CONCURRENTLY, and on a shared self-hosted host `/tmp` is ONE
      # namespace across every runner install — so the literals here let a sibling
      # SHARD of this very job truncate this shard's log and overwrite its
      # manifest/junit (`test-slow`'s measured false reds, #10028; `test-track-b`'s
      # false red was this job's own manifest being read, run 40990582554).
      # `RUNNER_TEMP` is per-runner, and a runner runs one job at a time, so it is
      # per-job. Same resolver shape as the `test` job's (#10028); it fails closed
      # rather than falling back to the host `/tmp`.
      - name: Resolve per-job pytest artifact paths (#10280)
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:?RUNNER_TEMP is not set — refusing to fall back to a host-global /tmp artifact path}"
          {
            echo "PYTEST_LOG=$base/pytest.log"
            echo "PYTEST_JUNIT=$base/junit.xml"
            echo "PYTEST_MANIFEST=$base/expected-nodeids.txt"
          } >> "$GITHUB_ENV"
          echo "pytest artifacts for this shard are under $base (per-job, not the host /tmp)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip dependency caches (#7612)
        # #7612: ephemeral runners, no dependency cache — every job downloaded
        # its wheels cold on every run. Placed BEFORE install-cpu-torch so torch
        # (140 wheels, ~3.2 GB) is served from the cache as well.
        # Coverage-neutral: pip-only job, no uv.lock to enforce; pip's cache is
        # content-addressed and cannot substitute a different version.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - uses: ./.github/actions/install-cpu-torch
      - name: Install package + test extras
        run: pip install -e '.[test,embeddings]'
      - name: Reap ABANDONED redislite litter (#1005 / #3653)
        # #1005: leaky runners accumulate redislite tempdirs from every failed
        # embedded-redis run — discover() then skips its stale-socket walk
        # (>5000 entries), so the reaper chaos tests fail with "orphan not
        # cleaned". Reap strays before the suite.
        # #3653: it used to be `pkill -f "redis-server unixsocket"`, which
        # matches EVERY redislite on the box. This matrix runs up to four such
        # legs per workflow and its own orphan gate has measured ten other live
        # suites on one host (`other_suites=10`), so a leg that started later
        # killed a concurrent leg's live instance — redislite unlinks its socket
        # on that SIGTERM, and the victim then reddened with "redis.socket … No
        # such file or directory" on a diff it never touched. The replacement
        # reaps only on a PROOF that no running leg can own the server (its
        # socket dir is gone, or it is older than the widest leg watchdog) and
        # KEEPS every case it cannot measure.
        # Best-effort like the find below: a cleanup that cannot run must not red
        # a leg, and a leak it fails to reap is the orphan gate's to report.
        run: |
          python3 .github/scripts/reap-redislite-orphans.py --apply || true
          TMPD=$(python3 -c "import tempfile;print(tempfile.gettempdir())")
          find "$TMPD" -maxdepth 1 -type d -name "tmp*" -mmin +30 -exec rm -rf {} + 2>/dev/null || true
          echo "tempdir cleaned"
      - name: Cache HF embedding model (BAAI/bge-small-en-v1.5)
        # #4387: the carve-out job runs test_longmem_runner.py, which exercises
        # the dense leg — so it provisions the embedder OFFLINE like the `test`,
        # `test-slow` and `test-concurrency-falkor` jobs. Its BUDGET is the two
        # long-running siblings' (`--attempts 5 --backoff 10` under a 10-minute
        # cap), not `test`'s tighter `--attempts 3 --backoff 5` under 6 minutes.
        # Without the cache AND the offline pair on the pytest step, an uncached
        # load does not fail fast: with the suite-wide egress guard installed it
        # RETRIES against huggingface.co rather than resolving DNS, and
        # test_longmem_runner.py re-attempts the load per test — so the shard is
        # killed by the 15m watchdog with 0 failures (rc=124) instead of
        # reporting a failure the merge rail can read; and a load that merely
        # FAILS skips the dense assertion and trips the skip-guard's
        # embedder-unavailable family (#2573). Same v2 key as the other jobs,
        # so the cache is shared and a warm restore is a no-op.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embedding-cache-v2-${{ runner.os }}
          restore-keys: |
            hf-embedding-cache-v2-${{ runner.os }}-
      - name: Embedding model REQUIRED (BAAI/bge-small-en-v1.5) — dense retrieval leg
        # #4387: hoisted from the `test`/`test-slow`/`test-concurrency-falkor`
        # jobs for the same reason as the cache above — the carve-out lane runs
        # the dense leg, so the model must be PRESENT before the offline pytest
        # step, otherwise those assertions skip and the skip-guard reds.
        # The command and cap are the two long-running siblings' (see above).
        # 10 minutes, matching the two `--attempts 5 --backoff 10` siblings
        # (test-slow, test-concurrency-falkor): five attempts sleep 100s of
        # backoff before the final probe, which does not fit the `test` job's
        # tighter `--attempts 3 --backoff 5` budget under a 6-minute cap.
        env:
          # #7359: the watchdog only DUMPS (exit=False) — it cannot fail a run. Below the
          # cap so the dump lands before the runner's kill; above the `--attempts N
          # --backoff S` budget so it does not fire during legitimate retry sleeps.
          TORTOISE_EMBEDDER_WATCHDOG_S: "570"
        timeout-minutes: 10
        run: |
          exec python3 tools/embedder_provision.py --attempts 5 --backoff 10
      - name: Generate coverage manifest (carve-out — expected nodeids, epic #1647 Task 9)
        run: |
          FILES=""
          for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          if [ -z "$FILES" ]; then
            echo "no carve-out files selected — no manifest (guard skips)"
            exit 0
          fi
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          python3 tools/skip-guard.py --emit-manifest "$FILES" --marker "not track_b and not live and not integration" --output "$PYTEST_MANIFEST"
      - name: Run carve-out suite (embedded, URI unset — E2E-4)
        # The embedded carve-out. Deliberately NO TORTOISE_DB_URI:
        # the carve-out's embedded-specific assertions (recovery, busy-error,
        # reaper, backup-restore) must run against FalkorDBLite. junitxml +
        # -r fEs (the manifest's observed-set source); pytest-rc for the
        # guard/orphan gates.
        env:
          # #4387: the same deterministic-embeddings pair the four
          # embedder-provisioning pytest steps carry (see the `test` job's step
          # env). This job was the one PROVISIONING lane WITHOUT it — the two
          # other lanes that carry neither are track-b and d14, and neither
          # provisions — and that gap is why its shards died on the 15m
          # watchdog with 0 failures (rc=124): see this job's cache step above
          # for the mechanism. The request/backoff/test counts observed on the
          # pre-`pytest_configure` revision are deliberately NOT restated here or
          # in the test that guards this step — multiple copies of a measured
          # figure in the tree is what drifts.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set +e
          FILES=""
          for f in ${{ matrix.files }}; do FILES="$FILES tests/$f.py"; done
          if [ -z "$FILES" ]; then
            echo "no carve-out files selected — skipping"
            echo 0 > "${RUNNER_TEMP:-/tmp}/pytest-rc"
            # #4740: pytest never runs here, so the conftest sweep never writes
            # its report — write the explicit "no-pytest" one rather than
            # leaving the orphan gate to parse a missing report.
            printf '{"sweep":{"skipped":"no-pytest"}}' > "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json"
            exit 0
          fi
          echo "$FILES" > "${RUNNER_TEMP:-/tmp}/pytest-files"
          ( while true; do
              sleep 300
              p=$(grep -c ' PASSED' "$PYTEST_LOG" 2>/dev/null || true)
              f=$(grep -c ' FAILED' "$PYTEST_LOG" 2>/dev/null || true)
              echo "HEARTBEAT: carve-out pytest still running — $p passed, $f failed so far"
            done ) &
          HB_PID=$!
          ulimit -n 65536 || true  # #1988: fd headroom for the embedded suites
          # #3239 history: this literal was 35m = 2x the then-measured pytest
          # step (max 16.02m over the 60 newest completed runs) —
          # tools/ci_selection.WATCHDOG_HEADROOM, the factor #6135 already
          # validated for the fast shards. Before that it was 75m, 4.7x the
          # work, so a hang inside pytest ran the long pole for an hour+ on
          # the old budget.
          # #3239/W37: the watchdog is now the SHARD's own budget
          # (`${{ matrix.watchdog_minutes }}`m, derived by
          # `tools/ci_selection.shard_watchdog_minutes` from the shard's packed
          # LPT estimate), not a literal for the whole set. A per-shard budget
          # is what lets 3 shards be bounded meaningfully; the inherited literal
          # bounded all of them by the SUM, which is the wall this change exists
          # to remove. The outer `timeout-minutes` stays a literal and must
          # clear this value — `test_every_bounded_pytest_job_caps_above_its_
          # watchdog` re-derives that from the emitted matrix.
          timeout -s INT -k 10 ${{ matrix.watchdog_minutes }}m stdbuf -oL python -m pytest $FILES -v --timeout=300 -p no:cacheprovider -m 'not track_b and not live and not integration' --maxfail=20 -r fEs --durations=15 --junitxml="$PYTEST_JUNIT" -o junit_family=xunit1 > "$PYTEST_LOG" 2>&1
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}/pytest-rc"
          kill $HB_PID 2>/dev/null || true
          wait $HB_PID 2>/dev/null || true
          echo "==================== pytest summary (tail) ===================="
          tail -n 200 "$PYTEST_LOG"
          # #3470: the `tail -n` above is a LINE-COUNT window, not a result —
          # post-summary interpreter-exit noise fills it and pushes BOTH the
          # session summary and the `-r fEs` report above the cut, so the log
          # stops saying whether the leg finished. Read the summary from the
          # FULL log instead, and name the INCOMPLETE case out loud so an
          # unattributable leg is a NAMED failure rather than a silent gap in
          # the #3467 failure set. One definition: pytest-attribution.sh.
          bash .github/scripts/pytest-attribution.sh --log "$PYTEST_LOG" --rc "$rc"
          # Emit the FAILED/ERROR nodeids explicitly. Under `-v` the
          # `short test summary info` block sits far from the end (a ~10.8k
          # line log puts the FAILED lines ~2.4k lines back), so the tail
          # above can omit every nodeid. The admin-merge rail
          # (scripts/ci-failure-set.sh) derives the head's failure SET from
          # THIS job log, so without the nodeids it sees an unattributable
          # failure and refuses — a refusal, not a comparison (#4453).
          echo "==================== pytest failure nodeids ===================="
          grep -E '^(FAILED|ERROR) ' "$PYTEST_LOG" || echo "(no FAILED/ERROR nodeids)"
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 2 ]; then
            passed=$(grep -c ' PASSED' "$PYTEST_LOG")
            failed=$(grep -c ' FAILED' "$PYTEST_LOG")
            errored=$(grep -c ' ERROR' "$PYTEST_LOG")
            echo "==================== WATCHDOG: carve-out shard pytest killed after ${{ matrix.watchdog_minutes }}m ($passed passed, $failed failed, $errored errored so far) ===================="
          fi
          echo "==================== pytest exit code: $rc ===================="
          exit $rc
      - name: "Temp-dir guard tests (TMPDIR unset — the GitHub-runner spelling condition, #3776)"
        # #3776: `ubuntu-latest` leaves `$TMPDIR` unset, so on the runner
        # `tempfile.gettempdir()` falls back to `/tmp`, while a dev box (macOS)
        # sets `/var/folders/...`. The temp-dir guards are spelling-sensitive
        # pre-filters — `tools/tmpdir_sweep.py::_FORBIDDEN_ROOTS` stores BOTH the
        # raw and the realpath spelling of every unbounded root precisely because
        # a guard that matches only one of them fails OPEN, and a fail-open
        # refusal is silent (the check simply never fires). Nothing in this
        # workflow sets `TMPDIR`, so the runner is in the right condition today;
        # pinning it here makes that DELIBERATE, so a future step that exports
        # `TMPDIR` cannot move this lane out of the environment the guard is
        # deployed in without reddening this step.
        #
        # #3776's literal path — `tests/test_tmpdir_isolation.py` — lives only on
        # the CLOSED branch `fix/3752-tmpdir-isolation` (PR #3763) and does NOT
        # exist on `main`; naming it here would red every run. `tests/_tmpdir_hygiene.py`
        # is the file #3752's re-scoped delivery (PR #6379) extends with the
        # gettempdir-spelling guard, so this invocation starts covering that
        # guard's raw-fallback path the day it lands. `test_tmpdir_hygiene_4096.py`
        # (the AST fixture-leak guard) is deliberately NOT included: it is not a
        # spelling pre-filter and already runs in the fast pool.
        #
        # `if: always()`: this is independent evidence — a red embedded suite above
        # must not hide whether the guard still holds under the runner condition.
        if: always()
        run: env -u TMPDIR python -m pytest tests/test_tmpdir_hygiene.py tests/test_tmpdir_sweep.py -q -rs -p no:cacheprovider
      - name: Skip-fail guard (carve-out, epic #1647 E2E-4)
        # The carve-out's redislite-availability skips are the exempt reason
        # family (embedded/redislite-unavailable) — never a guard trip; a
        # vanished nodeid or a docker-availability skip still reds.
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          if [ "$RC" = "0" ]; then
            # BOTH guards must be able to red this step. It runs under `set +e`, and a
            # `run:` block's status is its LAST command's — so an unguarded second
            # invocation silently masked the first one's failure (the #1647 coverage
            # guard's non-zero exit was discarded whenever the platform-gated guard
            # passed). Accumulate the codes and exit non-zero if EITHER failed.
            guard_rc=0
            if [ -s "${RUNNER_TEMP:-/tmp}/pytest-files" ]; then
              python3 tools/skip-guard.py "$PYTEST_LOG" --junitxml="$PYTEST_JUNIT" --manifest "$PYTEST_MANIFEST" || guard_rc=1
            else
              python3 tools/skip-guard.py "$PYTEST_LOG" || guard_rc=1
            fi
            # #4215: the runtime half of the platform-gate guard. The manifest
            # above is regenerated from THIS tree's --collect-only, so a gate that
            # removes a test removes it from BOTH sides and the check stays green.
            # This checked-in set is frozen: the platform-gated file's tests must
            # still be COLLECTED — skipped counts, because the two darwin-gated
            # ones legitimately skip on the ubuntu runners, and a skip still
            # emits a <testcase>. A gate that hides one from collection cannot
            # spell its way out of the junitxml. --manifest-only: this lane's
            # skips are the exempt reason family, so the docker-calibrated
            # matchers must not run here.
            #
            # W37: this committed set is REPO-LEVEL — it spans the whole
            # carve-out — but the job now runs ONE SHARD of that set, so
            # comparing the whole file against one shard's junitxml reports a
            # false red for every nodeid living in a sibling shard. It did
            # exactly that on the sharding PR: the 4 `test_fork_safety_3845.py`
            # nodeids (lines 23-26) are owned by shard (c), so shards 0 and (b)
            # reddened on a run whose pytest was fully green.
            #
            # Scope it to the files THIS shard runs. The guarantee is
            # unchanged, not weakened: the union over shards still requires
            # every nodeid in the committed set EXACTLY ONCE, enforced by the
            # shard that actually runs the file. A shard owning none of them
            # has nothing to require — and the guard prints the filtered count
            # (and says so explicitly when the requirement is empty) rather
            # than passing quietly.
            # ⛔ THE MANIFEST IS PASSED VERBATIM — the shard filter is `--scope`,
            # NOT a grep-derived temp file. A `--manifest` that is a DERIVED set is
            # a frozen contract the tree can silently redefine (the #4207 defect),
            # and tests/test_ci_guard_invocation.py asserts `--manifest` resolves to
            # a COMMITTED frozen path — correctly, by EXECUTING this step and
            # reading the argv it actually received, so a skipped invocation or a
            # temp-file manifest reads as "this frozen set is enforced by nothing".
            #
            # `--scope` narrows which of the frozen nodeids THIS shard must
            # observe. A shard owning none requires none and passes — the
            # legitimate case the old `else "nothing to require here"` branch was
            # papering over, while ALSO exiting 0 when the frozen file itself had
            # been deleted. The guard's own empty-manifest check still fails closed
            # on the frozen set, so deletion can no longer pass quietly, and its
            # `--scope` line names the filtered count and says so when the
            # required subset is empty, so a wrong scope is visible not silent.
            if [ ! -r config/ci-expected-nodeids/platform-gated.txt ]; then
              echo "::error::the frozen platform-gated manifest is missing or unreadable — refusing to certify an unaccounted-for empty requirement (a gate whose output can authorise a bypass fails CLOSED)"
              exit 1
            fi
            SCOPE=""
            for f in ${{ matrix.files }}; do SCOPE="$SCOPE tests/$f.py"; done
            python3 tools/skip-guard.py "$PYTEST_LOG" \
              --junitxml="$PYTEST_JUNIT" \
              --manifest config/ci-expected-nodeids/platform-gated.txt \
              --scope "$SCOPE" --manifest-only || guard_rc=1
            exit $guard_rc
          else
            echo "pytest rc=$RC — skip guard skipped (job already red)"
          fi
      - name: Dump tolerated tempdir-cleanup leaks (issue #7735)
        # Same capture trap as #1103 above: a PASSING test's `logger.warning` is
        # discarded by pytest capture (measured on the fast job's flags — 0
        # occurrences in /tmp/pytest.log and 0 in the junit XML), so the
        # ENOTEMPTY teardown leaks tolerated by `TemporaryDirectory.cleanup`
        # are mirrored to an artifact at session end. The writer MERGES by path
        # so a future xdist admission cannot truncate a peer's record wholesale
        # (a same-instant write can still drop one entry) — INERT today: CI is
        # serial (`XDIST_WORKERS=0`), so a single
        # session owns the path. Informational: the step never fails the job.
        # Every job listed in _LEAK_SURFACED_JOBS carries this step (pinned by
        # tests/test_tmpdir_hygiene.py::test_suite_jobs_surface_the_tolerated_leak).
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/tempdir-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== tolerated tempdir-cleanup leaks (issue #7735) ==="
            cat "$LOG"
          else
            echo "no tolerated tempdir-cleanup leak recorded at $LOG"
          fi

      - name: Assert no redislite orphans (issue #1005 / epic #1647 E2E-7)
        # Same gate contract as the fast/slow asserts (#4740): the bound is read
        # from the conftest session-end sweep's own report
        # (.github/scripts/orphan-bound.sh), never a hand-picked constant. The
        # carve-out runs embedded, so the sweep reports its own `left` — and
        # #1005 applies every count-based red to the servers ATTRIBUTED to this
        # run (own_now vs own_left), never to the host-wide `COUNT`. The
        # gate reds this run's own servers growing after the sweep
        # (own_now > own_left), an accounting-identity violation, a probe_failed
        # report with an attributed residue above zero, an error or skipped
        # report, a no_embedded_servers report with an attributed own_now above
        # zero, and a report that is unaccounted, unreadable or unattributable
        # (no usable `own_roots`); a host-wide `COUNT` above `left` is a
        # `::warning::` diagnostic; a residue the sweep itself measures and
        # declines to act on is
        # bounded by that measurement, not independently red (#4884). A
        # `cleared: false` report does not red at any measured COUNT: `cleared`
        # reports whether the sweep's TIME BUDGET sufficed — a function of
        # runner load — not its residue (#4989).
        if: always()
        run: |
          set +e
          RC=""
          [ -f "${RUNNER_TEMP:-/tmp}/pytest-rc" ] && RC=$(cat "${RUNNER_TEMP:-/tmp}/pytest-rc")
          # #4740: read the count and pgrep's OWN status separately — a
          # `${PIPESTATUS[0]}` after `COUNT=$(pgrep … | wc -l)` is the `tr`
          # status, never pgrep, so a failed probe would read as 0 and pass.
          # `$?` on the bare assignment IS pgrep's status (rc 0/1 are real
          # measurements; anything else must RED). See the fast job's note.
          PIDS=$(pgrep -f "redislite/bin/redis-server")
          prc=$?
          [ "$prc" -le 1 ] || { echo "::error::pgrep failed rc=$prc — the orphan count is unmeasured (issue #1005)"; exit 1; }
          COUNT=$(printf '%s' "$PIDS" | wc -w | tr -d ' ')
          # #1005 (epic #1647 E2E-7): hand the gate the counted servers' argv,
          # so it can say WHICH of them live under this run's own session temp
          # root. `COUNT` alone is host-wide — on the self-hosted pool every
          # concurrent job's servers appear in it — and comparing that to the
          # sweep's snapshot redded PASSING runs (9 counted vs left=8; 22 vs
          # 14). A `ps` failure here is a FAILED probe, never an empty
          # measurement: the attribution would silently degrade to "someone
          # else's servers" and hide a real residue.
          ARGV="${RUNNER_TEMP:-/tmp}/redislite-orphan-argv.txt"
          : > "$ARGV"
          if [ -n "$PIDS" ]; then
            # `pgrep` prints one pid per line; GNU `ps` refuses a `-p` list with
            # newlines in it ("process ID list syntax error") while BSD `ps`
            # tolerates them — measured, so the separator is normalised to a
            # comma list both accept. Without this the Linux legs write an EMPTY
            # argv file and every counted server would read as unattributable.
            PIDLIST=$(printf '%s' "$PIDS" | tr -s '[:space:]' ',' |
              sed 's/^,*//; s/,$//')
            # A whitespace-only probe normalises to an EMPTY list, which GNU ps
            # rejects ("list of process IDs must follow -p") — there is nothing
            # to attribute, so do not call it.
            if [ -n "$PIDLIST" ]; then
              ps -ww -o pid=,args= -p "$PIDLIST" > "$ARGV" 2>/dev/null
              arc=$?
              # #10255 review 1 (P1): `ps -p <list>` exits 1 when NO listed pid
              # matched — measured on procps-ng 4.0.4 (`ps -p 1` → 0,
              # `ps -p 999999` → 1, `ps -p 1,999999` → 0), and the procps man
              # page publishes no exit-status contract at all, so `-eq 0` was
              # an assumption the tool never made. That rc is a COMPLETED
              # measurement of an empty population, not a failed probe: this
              # read sits inside the residue's shutdown window, which the
              # gate's own header documents as normal (a server the sweep
              # still saw exits in the ~0.05s before this later probe), and
              # every counted server exiting in between is most likely exactly
              # at COUNT 1-2. Failing the job there reds a passing run that
              # leaked nothing, with a message that blames attribution and
              # sends the reader after a residue that does not exist. Only a
              # real probe failure (rc>1, a missing `ps`, a timeout) reds. On
              # the benign path the (truncated) file stays empty, so the gate
              # reads own_now=0 — below every `own_left`, i.e. never a red.
              [ "$arc" -le 1 ] || { echo "::error::ps failed rc=$arc — the orphan count cannot be attributed to this run (issue #1005)"; exit 1; }
            fi
          fi
          bash .github/scripts/orphan-bound.sh \
            --count "$COUNT" \
            --rc "$RC" \
            --hygiene "${RUNNER_TEMP:-/tmp}/redislite-hygiene-end.json" \
            --argv "$ARGV"
      - name: Upload carve-out log (measurement artifact, #1477)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # PER-LEG: `github.job` is the BASE id for every matrix leg, so the
          # bare form collides across shards (upload-artifact@v4 409s, and the
          # step is continue-on-error, so the logs disappear silently).
          # NOT `matrix.suffix` — it carries a leading space and parentheses.
          name: pytest-log-${{ github.job }}-${{ matrix.label }}
          # #10280: `runner.temp`, not the host `/tmp` — naming the literals here
          # would upload whatever a co-tenant shard left behind.
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/expected-nodeids.txt
          if-no-files-found: ignore

  test-d14-hosted-api:
    # #2188: the D14 (embedded_only) keepalive regression guards in
    # tests/test_hosted_api.py — test_make_sdk_reuses_healthy_anchor (#1470),
    # test_make_sdk_rebinds_stale_anchor (#1502), and the #2172 set
    # (test_make_sdk_concurrent_first_calls_single_anchor,
    # test_registry_anchor_reuses_healthy_anchor,
    # test_registry_anchor_concurrent_first_calls_single_anchor) — ran in NO
    # trunk CI job: the file is in slow_files (full runs execute it only in
    # the docker slow leg, which sets TORTOISE_DB_URI → the autouse D14 skip
    # hook skips them all) and the URI-less carve-out runs only the
    # ci-surfaces carve_out files. A future revert of _KEEPALIVE_LOCK
    # (#2172) or the anchor semantics would produce NO CI failure anywhere —
    # the race would resurface only probabilistically (#2065/#2172 flake).
    # This job runs the D14 set URI-less on every run (PR + push); measured
    # whole-job p50 4.71m / p95 7.23m / max 8.03m (docs/ops/ci-wall-clock.md).
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    # #10182: the cap must cover EVERY step this job runs — `actions/cache`
    # saves `~/.cache/pip` as a POST-step on a cache miss, and that save is
    # charged against this timeout like any other step.
    #
    # Measured (run 40587081433, job 122533023160): the marker selection PASSED
    # and the D14 artifact uploaded; then the cache save tarred 3.6 GB (3m24s)
    # and was still uploading it — `Sent 2348810240 of 3608530109 (65.1%)` —
    # when the old 20m ceiling elapsed at 01:20:19. The job reported
    # `cancelled`, which `python-ci-gate` reads as red BY DESIGN (#5219: a
    # cancelled leg certifies nothing), so a job whose work was green reddened
    # a REQUIRED check on a diff that touches three Markdown files.
    #
    # The arithmetic that forces the raise is the job's OWN in-step cap, not
    # this run's duration: `timeout … 15m` (below) + ~1m setup/install + ~9m
    # for a cold save ≈ 25m against a 20m ceiling. On measured norms the margin
    # is thinner than it looks — whole-job p50 4.71m / p95 7.23m / max 8.03m
    # (docs/ops/ci-wall-clock.md) is measured over `success`/`failure` jobs
    # only, so it CANNOT see a save that ran to cancellation; against a ~9m
    # save that leaves ~3m, and this run's test step had already spent 12m32s
    # of its own 15m cap.
    #
    # What this does NOT fix, and no job cap can: the in-step `15m` cap
    # SIGINT-kills the step (pytest-attribution then emits INCOMPLETE) instead
    # of letting it finish, and this run was within 2m28s of that — 9m11s of
    # its 12m32s was COLLECTION (01:00:53 → 01:10:04) against a 221s norm for
    # the whole step (docs/ci-timing.md). Tracked in #10212. Raising this number
    # stops the cache SAVE from being the term that reds the gate; it does not
    # make the shared-HOME pip cache small, which is why the save is 3.6 GB.
    timeout-minutes: 40
    env:
      TORTOISE_TEST_CARVE_OUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip dependency caches (#7612)
        # #7612: this job is the FIFTH install-cpu-torch site and the first pass
        # missed it, so it still resolved and downloaded the full torch/extras
        # set cold on every run — the saving the PR claims was partial here.
        # Same key shape as the other pip-only sites, so it SHARES their cache
        # and a warm restore is a no-op. Coverage-neutral: pip's cache is
        # content-addressed and cannot substitute a different version, and
        # install-cpu-torch still fails loudly if the uv.lock pin drifts.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - uses: ./.github/actions/install-cpu-torch
      - name: Install package + test extras
        run: pip install -e '.[test,embeddings]'
      - name: Run the embedded_only marker selection (URI unset — #4164)
        # Deliberately NO TORTOISE_DB_URI (the autouse D-2 skip hook fires
        # when a URI is set and would skip every marked test); CARVE_OUT=1 is
        # the explicit URI-less opt-in.
        #
        # #4164: this job used to run `tests/test_hosted_api.py -k
        # "concurrent_first_calls or …"` — a HAND LIST of the five D14 guards.
        # A hand list covers only the marks someone remembered, and that is
        # exactly what happened: of the marked tests in files OUTSIDE the
        # carve-out set, those five ran here and the rest were collected-and-
        # skipped on every docker leg and executed NOWHERE (test_audit's
        # embedded_busy case, TestDriftCounterWiring, test_index_directory,
        # test_indexes, test_lme_m6_evidence, test_onboard_prompt_ref,
        # test_pack_state, test_session_extraction_modes). Selecting by the
        # MARKER cannot drift: a new @pytest.mark.embedded_only test in ANY
        # file — per-test, class-level, or class-body `pytestmark` — is picked
        # up by the next run without editing this step. That is also why the
        # step is pinned by tests/test_markers.py::
        # test_ci_runs_the_embedded_only_marker_selection (it fails if this
        # goes back to naming tests).
        run: |
          set -eo pipefail
          # #3470: the log is captured through `tee`, so this leg needs the SAME
          # attribution every `tail -n` leg gets — without it a D14 leg killed at its
          # 15m watchdog emits no INCOMPLETE marker and its unobservable failure set
          # is indistinguishable from a clean leg, on a job `python-ci-gate` needs.
          rc=0
          timeout -s INT -k 10 15m python -m pytest tests/ -m embedded_only \
            -v --timeout=300 -p no:cacheprovider --junitxml=/tmp/junit-d14.xml -o junit_family=xunit1 2>&1 | tee /tmp/pytest-d14.log || rc=$?
          bash .github/scripts/pytest-attribution.sh --log /tmp/pytest-d14.log --rc "$rc"
          [ "$rc" -eq 0 ] || exit "$rc"
          # Fail-closed on a silent all-skip — the #2188 review P3-1 shape,
          # widened. The floor is 30 and the number is NOT arbitrary: the four
          # marked files that are ALREADY carve-out registered (precision_leak
          # 6 + test_hosted_api 5 + fork_slot_wedge 12 + fork_safety 4 = 27 marked,
          # of which 25 PASS on the ubuntu runner — the two darwin-gated
          # fork_safety ones skip) are the always-passing baseline, so a floor at
          # 25 would still be met by a hook broadened to skip exactly the class
          # #4164 rescues. 30 sits above that baseline (25) and below the measured
          # total, so losing the rescued class reds the job while a few legitimate
          # removals do not.
          # Measured 2026-09-20 on this tree (run 35518962357, head fd23a4033): 35
          # passed / 34 skipped (each skip exogenous — the 32 module-level gate
          # markers, and the two darwin-gated #3845 fork tests; no real test skips
          # for any other reason). The contract is that the marks RUN; the exact
          # count is free to grow.
          passed=$(grep -c ' PASSED' /tmp/pytest-d14.log || true)
          echo "embedded_only-marked tests passed: $passed"
          [ "$passed" -ge 30 ] || { echo "::error::expected >=30 embedded_only-marked tests to RUN (got $passed passed — all-skip, URI leak, a broadened hook, or the non-carve-out class lost?)"; exit 1; }
          # #4207: the floor above is a COUNT of PASSED lines, so a single
          # subtracted test leaves 34 and the step stays green — and the pin in
          # tests/test_markers.py reads this step's TEXT, so a deselecting flag
          # passed through a shell variable is invisible to it as well. Neither
          # can see a subtraction. The checked-in manifest is the FROZEN
          # known-good set: every nodeid must still appear as a junitxml
          # <testcase> (passed OR skipped) or this reds and NAMES the one that
          # vanished. Supersets are fine — a new marked test needs no edit here.
          # --manifest-only: this lane's skips are the expected state (URI unset),
          # so the docker-calibrated skip matchers would false-red every e2e
          # module (24, measured); the coverage property is what this lane owes.
          python3 tools/skip-guard.py /tmp/pytest-d14.log \
            --junitxml=/tmp/junit-d14.xml \
            --manifest config/ci-expected-nodeids/embedded-only.txt --manifest-only
      - name: Dump tolerated tempdir-cleanup leaks (issue #7735)
        # Same capture trap as #1103 above: a PASSING test's `logger.warning` is
        # discarded by pytest capture (measured on the fast job's flags — 0
        # occurrences in /tmp/pytest.log and 0 in the junit XML), so the
        # ENOTEMPTY teardown leaks tolerated by `TemporaryDirectory.cleanup`
        # are mirrored to an artifact at session end. The writer MERGES by path
        # so a future xdist admission cannot truncate a peer's record wholesale
        # (a same-instant write can still drop one entry) — INERT today: CI is
        # serial (`XDIST_WORKERS=0`), so a single
        # session owns the path. Informational: the step never fails the job.
        # Every job listed in _LEAK_SURFACED_JOBS carries this step (pinned by
        # tests/test_tmpdir_hygiene.py::test_suite_jobs_surface_the_tolerated_leak).
        if: always()
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/tempdir-hygiene-end.json"
          if [ -f "$LOG" ]; then
            echo "=== tolerated tempdir-cleanup leaks (issue #7735) ==="
            cat "$LOG"
          else
            echo "no tolerated tempdir-cleanup leak recorded at $LOG"
          fi
      - name: Upload D14 log (measurement artifact, #2188)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-d14-hosted-api
          path: |
            /tmp/pytest-d14.log
            /tmp/junit-d14.xml
          if-no-files-found: ignore

  canary-streak:
    # Epic #1647 Task 9 Step 6 (D-3=A): the instrumented canary-drop streak.
    # Separate job (needs: [test] — the matrix jobs fan in; a step inside the
    # matrix job cannot run after every shard — cycle-5 P1-7). POST-MERGE
    # ONLY (push — PR runs never mutate the canary artifact).
    # Downloads the producer shard's artifact set (junitxml + expected-nodeids +
    # step_wall + the canary-producer marker), finds the PREVIOUS streak
    # artifact, runs the deterministic classifier (tools/testdb_canary_classify
    # .py — artifacts only, never a $GITHUB_OUTPUT value; cycle-6 P1-7), and
    # uploads the new streak + posts the summary. `consecutive_green >= 5`
    # flips canary_dropped — the embedded canary lane's retirement milestone
    # (the lane itself was already retired by the Task 9 Step 1 half-a flip;
    # this artifact is the record the epic's indicator #2 gate reads).
    needs: test
    # always(): WITHOUT the status-check function the implicit success()
    # would SKIP this job whenever a test leg fails/cancels — red runs would
    # never reach the classifier and the streak would freeze instead of
    # resetting (review finding #1: every reset bucket would be dead code).
    # always() + the post-merge gate = the classifier receives red runs too
    # (the producer shard's artifact upload is if: always() + continue-on-error, so
    # failed runs still ship their junitxml/manifest/step_wall evidence).
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # This job calls `gh` (below, and via actions that shell out to it).
      # `runs-on: ubuntu-latest` names a GitHub-hosted IMAGE, but the fallback
      # pool carries that same label on a bare runner whose service PATH is a
      # minimal non-login one — where `gh` is simply absent. Measured
      # 2026-10-24: `canary-streak` died `line 2: gh: command not found` /
      # `exit code 127` on `pi-runner-vm-5`, which reads as a test failure and
      # is not one. This step provides the tool or fails NAMING it.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh
      - name: Download producer-shard artifacts (the P1-7 canary contract)
        # #6135: the fixed-name artifact written by the producer shard (the
        # matrix's `canary_producer`, positionally the last one). It replaced
        # the literal `pytest-log-test-b`, which stopped naming a real leg the
        # moment the shard count rose. Missing artifacts (a cancelled producer
        # leg) are tolerated — the classifier treats an absent junitxml as an
        # infra-flake reset.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pytest-canary-producer
          path: artifacts
      - name: Download previous streak artifact (chain continuity)
        # The streak chains across post-merge runs via the previous run's
        # `testdb-canary-streak` artifact. Walk the most recent push runs
        # and take the FIRST non-current run that actually has the
        # artifact (a run before the flip has none -> try the next). The gh
        # run-list query FAILS LOUD (review finding #2: a silent query failure
        # would read as "no previous streak" and wrongly reset a real streak
        # on the next green run).
        env:
          # Epic #1647 (post-merge CI-fix): gh run list/download needs a token
          # — without GH_TOKEN the step failed with "To use GitHub CLI in a
          # GitHub Actions workflow, set the GH_TOKEN environment variable"
          # (exit 4), which red'd python-ci-gate on the merge run.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run list --workflow python-ci.yml --branch main --event push --limit 5 \
            --json databaseId --jq '.[].databaseId' > /tmp/prev-runs.txt
          set +e
          # #4367: the nightly schedule trigger was removed, so this query can
          # only ever return HISTORICAL scheduled runs. It is kept as a
          # one-time continuity bridge for the streak chain (a missing prev
          # streak resets consecutive_green to 0 per testdb_canary_classify);
          # it is `|| true`-guarded and becomes unreachable once the old
          # nightly runs age out of the run-list window.
          gh run list --workflow python-ci.yml --branch main --event schedule --limit 3 \
            --json databaseId --jq '.[].databaseId' >> /tmp/prev-runs.txt 2>/dev/null || true
          CUR="${{ github.run_id }}"
          FOUND=""
          mkdir -p prev-streak
          while read -r rid; do
            [ -z "$rid" ] && continue
            [ "$rid" = "$CUR" ] && continue
            if gh run download "$rid" -n testdb-canary-streak -D prev-streak >/dev/null 2>&1; then
              FOUND="$rid"
              break
            fi
          done < /tmp/prev-runs.txt
          if [ -n "$FOUND" ]; then
            echo "previous streak from run $FOUND"
            ls -la prev-streak/
          else
            echo "no previous streak artifact found — fresh chain"
          fi
      - name: Classify run + update the canary streak (epic #1647 Task 9 Step 6)
        # Deterministic scripted triage: junitxml + expected-nodeids + step_wall
        # + divergence-confirmation log + prev streak -> new streak. Artifacts
        # ONLY (never a steps output). The step-wall file is the MANDATORY
        # E2E-5 input (cycle-4 P2-4: a run that silently rides the shard's
        # watchdog breaks the streak like any other failure).
        run: |
          python3 tools/testdb_canary_classify.py \
            --run-id "${{ github.run_id }}" \
            --junitxml artifacts/junit.xml \
            --manifest artifacts/expected-nodeids.txt \
            --step-wall artifacts/step_wall.txt \
            --divergence-log docs/epics/2026-08-24-test-db-migration/divergence-confirmation.md \
            --producer-marker artifacts/canary-producer.json \
            --prev-streak prev-streak/testdb-canary-streak.json \
            --out config/testdb-canary-streak.json
      - name: Upload canary streak artifact
        # The next post-merge run's classifier downloads THIS artifact as its
        # previous streak — the chain.
        uses: actions/upload-artifact@v4
        with:
          name: testdb-canary-streak
          path: config/testdb-canary-streak.json
          if-no-files-found: error
      - name: Post canary-streak summary
        run: |
          {
            echo "## Canary streak (epic #1647 Task 9 Step 6)"
            echo ""
            cat config/testdb-canary-streak.json
            echo ""
            echo "consecutive_green >= 5 => canary_dropped (the embedded canary"
            echo "lane's retirement milestone; the lane itself was retired by"
            echo "the Task 9 half-a flip)."
          } >> "$GITHUB_STEP_SUMMARY"

  # The agent-facing surface expansion gate (#3863).
  #
  # No `if:`, no `paths:` filter, deliberately: this job must run on EVERY pull
  # request. A filtered gate is how a surface change slips through a docs-only
  # path, and a skipped job reports Success, so a conditional guard would
  # satisfy the required check without guarding anything.
  surface-guard:
    runs-on: ubuntu-latest
    # Sibling `manifest-integrity` documents the same decision for the same reason:
    # this job owns a network install AND feeds the REQUIRED aggregate, so without a
    # bound a stalled PyPI would hold python-ci-gate red for hours on every PR.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      # ── PIN THE TOOLING TO THE BASE REF (#4606) ───────────────────────────
      # The step below would otherwise run the CHECKOUT'S OWN copy, so a PR
      # could add a surface tool and stub the gate out in the same commit: the
      # required `surface-guard` job would go green on a rewritten gate.
      #
      # PIN THE ENFORCEMENT, NOT THE GENERATOR. `tools/surface-guard.py` is the
      # gate — it compares the declaration against the frozen baseline, and it
      # is SELF-CONTAINED (its own `_read_manifest`, deliberately independent of
      # `tools/surface_manifest.py`), so nothing in the PR's tree can influence
      # it. Pinning `tools/surface_manifest.py` as well looked symmetrical and was
      # a DEADLOCK: the two steps that use it run the BASE ref's copy, so a PR
      # that FIXES that tool can never make them pass. Measured on #5192 — the
      # pin succeeded, `surface-guard` and the ordering lint passed, and the
      # render step failed against a tree whose own (fixed) renderer reproduced
      # the committed document byte-for-byte. The other two steps it feeds are a
      # lint and an artifact-consistency check, not the expansion gate.
      #
      # The pinned tool resolves `ROOT = Path(__file__).resolve().parent.parent`,
      # so the pin overwrites it IN PLACE under `tools/`: the PR's TREE stays the
      # subject of the check (that is the point — it is what might have
      # expanded), while the LOGIC that measures it comes from the protected
      # base ref and cannot be edited by the PR under test.
      #
      # On `push`/`schedule` there is no `base_ref` and the checkout IS the
      # protected ref, so `HEAD` is used. A `git show` that fails leaves `set -e`
      # to fail the step, so the pin fails CLOSED rather than silently skipping.
      - name: Pin the gate's tooling to the base ref
        run: |
          set -euo pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base=FETCH_HEAD
          else
            base=HEAD
          fi
          base_sha=$(git rev-parse "$base")
          echo "pinned surface tooling from $base ($base_sha)"
          # `tools/` itself must be a REAL directory. If the PR swaps it for a
          # symlink, `mv -f` resolves THROUGH it, the pinned copies land in the
          # PR's own tree, and each tool's `ROOT = Path(__file__).resolve().parent
          # .parent` then re-roots the entire check onto that decoy tree — while
          # every per-file assertion below still passes. Assert the CONTAINER,
          # not only the files.
          test -d tools && test ! -L tools \
            || { echo "::error::tools/ is not a real directory"; exit 1; }
          for f in tools/surface-guard.py; do
            tmp="$(mktemp)"
            # `mv -f` REPLACES the path. A plain `> "$f"` redirect FOLLOWS it, so
            # a PR that commits `tools/surface-guard.py -> /dev/null` would have
            # the pin written harmlessly into the void and the step below would
            # then run an EMPTY program, exit 0, and report success. `mv -f`
            # unlinks the link and renames over it instead. The `test` then fails
            # CLOSED if anything non-regular (or empty) survived.
            # The source is `$base_sha`, not `$base`, so the sha echoed above is
            # the sha that was actually pinned.
            git show "$base_sha:$f" > "$tmp"
            mv -f "$tmp" "$f"
            test -f "$f" && test ! -L "$f" && test -s "$f" \
              || { echo "::error::$f is not a non-empty regular file after the pin"; exit 1; }
          done
          wc -l tools/surface-guard.py tools/surface_manifest.py
      - name: The surface cannot expand without an explicit human decision
        run: python3 tools/surface-guard.py
      - name: The ordering lint (AC13)
        run: python3 tools/surface_manifest.py check
      - name: The list is generated from the manifest and cannot drift from it
        run: |
          python3 tools/surface_manifest.py render
          git diff --exit-code -- docs/product/mcp-sdk-surface.md
      # ── THE TARGET COMPLIANCE GAP, SURFACED BUT NOT GATING (#4185) ─────────
      # The gap between the live surface and the owner-approved target is genuine
      # (the target is documented in `docs/product/canonical-mcp-tools.md` and declared
      # in `tortoise/__all__.py`; this comment deliberately does not restate the counts,
      # so it cannot go stale), so a REQUIRED check would red `main` and block every
      # unrelated merge while the migration is in flight. But a check nobody runs
      # reports to nobody: this step prints the numbers and the deltas on EVERY
      # run, and `continue-on-error` keeps it informational. The `::error::`
      # annotation still shows up on the run page, so the gap stays visible.
      - name: Surface target compliance (informational, #4185)
        continue-on-error: true
        run: python3 tools/surface-target-check.py

  # ── THE REQUIRED GATE OBSERVES EVERY SHARD IT CERTIFIES ──────────────────
  # `python-ci-gate` is a REQUIRED status check AND the only `merge_condition`
  # of the Mergify merge queue (`.mergify.yml`). Its `needs:` list IS its whole
  # claim: a leg missing from it is a leg the gate cannot block, however red the
  # run is.
  #
  # #5219: from 2026-09-24T15:25Z (#5017) until this fix, `needs:` omitted
  # `test`, `test-slow` and `test-carve-out`, so the required check reported
  # SUCCESS on a tree whose primary suite had FAILED. Measured on the MERGED
  # heads of #4838 (30c5b45) and #4633 (81401cc): `test (a)`, `test (b)` and
  # `test-carve-out` were all `completed/failure` while `python-ci-gate` was
  # `completed/success` — and both PRs merged. Across PRs at the time, the only
  # thing that separated a gate that reddened on a failing `test` from one that
  # did not was WHICH VERSION OF THIS FILE the PR head carried: heads with the
  # pre-#5017 list failed the gate, heads with the post-#5017 list passed it.
  # A gate that goes green on a red tree is worse than a slow one: the queue
  # then merges a red batch at machine speed.
  #
  # #5017 removed those three legs DELIBERATELY, to cut merge-path latency (the
  # required check's latency IS the merge path: this repo uses strict up-to-date
  # protection + GitHub SERVER-SIDE auto-merge, which fires the instant the
  # REQUIRED checks are green — not when the run finishes — so a required
  # aggregate that waits on the long legs makes every merge wait ~30 min while
  # main advances every ~20 min; measured 2026-09-24: 0/41 PRs ever CLEAN).
  # This change REVERSES that trade on the owner's call (#5219): the required
  # check must observe the shards it stands for. The latency cost is real, is
  # accepted knowingly, and is quantified by the measurements kept below.
  #
  # IF THE LATENCY MUST COME BACK, THE LEVER IS NOT THIS LIST — removing a leg
  # here re-opens #5219. In preference order: (1) add the long legs as
  # `check-success=` conditions on the QUEUE's `merge_conditions`, keeping this
  # aggregate fast for direct merges — the queue is the machine-speed consumer,
  # while a human-paced merge can at least see the advisory red on the PR;
  # (2) drop `strict: true` from branch protection — an OWNER action, not a
  # workflow edit.
  #
  # MEASURED job durations of THIS workflow (GitHub Jobs API, green push run
  # 35952913400 and green PR run 35955422523):
  #   test (a)               30.0–31.5m   ← the true critical path
  #   test-slow (b)          22.8–29.3m
  #   test (b)               18.3–27.1m
  #   test-carve-out         15.5–16.7m
  #   test-slow (a)           6.6–7.2m
  #   test-d14-hosted-api     3.3–3.6m
  #   test-concurrency-falkor 2.5–3.1m
  #   everything else         <1.2m
  # These are what the reversal above is weighed against: they are why #5017
  # removed the three >15m legs, and why re-adding them costs ~30m of
  # merge-path latency.
  # ⚠️ That table is the PRE-#9539 shape. Re-measured on 5 completed main runs
  # (2026-10-21, ids in `test-slow`'s matrix comment): test-slow was 14.2–23.0m
  # across its two legs and is the pole now that the fast band is split nine
  # ways; #9539 packs the same 37.9m pool into 5 derived legs (~9.6m
  # projected). Do not re-read the two `test-slow` rows as today's numbers.
  #
  # THE LONG LEGS ARE NOT DELETED, AND NOT PUSH-ONLY — they run on both lanes:
  #   * pre-merge on every PR whose diff selects them, now back INSIDE this
  #     aggregate, so a failure blocks the merge (#5219), and
  #   * post-merge on every push to main, exactly as before.
  # They are deliberately NOT made push-only (skipped on PRs), even though that
  # would save their runner time, because the merge rail refuses it:
  # `scripts/admin-merge.sh` (the mandated `--admin` path) requires the PR lane
  # to have EXECUTED every test shard main's push lane executed
  # (`ADMIN_MERGE_LANE_PARITY` defaults to `require`; tortoise #4263/#4457) — a
  # `skipped` shard is not coverage. Skipping these legs on PRs would make every
  # `--admin` merge refuse `NOT COMPARABLE` and force a permanent
  # `ADMIN_MERGE_LANE_PARITY=declared-off` override.
  #
  # `canary-streak` is deliberately NOT in `needs:`: it is push-only
  # (`if: always() && github.event_name == 'push'`), so on a pull request it
  # reports only `skipped` and carries no signal. It still runs on each push,
  # alongside the long legs it depends on.
  #
  # The pins that keep this shape honest live in tests/test_ci_selection.py —
  # `test_required_gate_covers_the_long_legs` (the legs ARE in the transitive
  # closure, and are DIRECT needs, which is the property that matters) and
  # `test_drift_gate_cannot_skip_the_test_matrix` (the aggregate really EXITS
  # NON-ZERO per red leg, a leg dropped from `needs:` fails closed instead of
  # vanishing, and a `skipped` leg is forgiven only when the selector declined
  # it).
  workflow-lint:
    # #6253: a malformed Actions expression makes GitHub refuse the WHOLE
    # workflow file — zero jobs, zero logs, and therefore ZERO check-runs. The
    # required aggregate below then does not exist on that head at all: not
    # red, ABSENT, and an absent required check cannot block a merge. Observed
    # on #6212, where the run reported `total_count: 0` with "This run likely
    # failed because of a workflow file issue".
    #
    # SCOPE LIMIT, stated because it bounds what this leg can claim: the leg
    # reads every workflow file it can LOAD, so it catches a malformed
    # expression in any workflow OTHER than this one. If this file
    # (`python-ci.yml`) is itself malformed, GitHub refuses it, this leg never
    # starts, `python-ci-gate` stays ABSENT, and nothing here changes.
    #
    # THE UNCOVERED CASE IS #6253'S ACTUAL CASE (#6212 was a malformed
    # `python-ci.yml`), and the blocker is NOT branch protection — an earlier
    # revision of this comment claimed that and it was wrong. No new required
    # check is needed: `ci.yml` is triggered on `pull_request`, so it still
    # runs when GitHub refuses this file, and its `docs`, `pricing-artifact`,
    # `test-isolation` and `license-surface` jobs are always-on (no `if:`/
    # `needs:`) and ALREADY enforced by `.mergify.yml` `queue_conditions` as
    # `check-success=…`. The same actionlint step placed in any of them would
    # lint this file and red an already-required check with no branch-
    # protection change at all.
    #
    # The real blocker is only the CHOICE to keep the lint inside
    # `python-ci.yml`. Closing the #6212 case therefore means relocating (or
    # duplicating) this step into an always-on required job in `ci.yml`; until
    # that is done, #6253 must NOT be closed as fixed, because the file it
    # reports remains uncovered.
    #
    # The expression is evaluated over the ENTIRE `run:` scalar, so a shell
    # comment is NOT exempt — that is how the #6212 instance slipped past
    # YAML-level parsers, which never evaluate expressions at all.
    #
    # The pinned actionlint image is invoked directly and deliberately NOT via
    # scripts/check-workflow-actionlint.sh: `scripts` is a MACHINE-LOCAL pointer,
    # gitignored and NOT tracked since #9475 (it is materialised per machine from
    # $AGENT_INFRA_PATH by tools/link_agent_infra_scripts.py — a git symlink blob
    # cannot hold a variable), so that file does not exist in a CI checkout, and its
    # default scope also names a templates/ tree this repository does not have (it
    # exits 3 at the glob).
    #
    # Both extensions are linted: GitHub loads either `.yml` or `.yaml`, so a
    # `*.yml`-only glob would silently skip a `.yaml` workflow.
    # Ungated on purpose: this leg has no diff selector, so its LEGS row is
    # `-` and it must therefore always resolve to SUCCESS — the aggregate fails
    # closed on a `skipped` row whose third field is not `false` (#5219). The
    # malformed-file class applies to EVERY diff, so gating it on a selector
    # would leave whole diff classes unguarded.
    #
    # Bounded like `manifest-integrity`: this job pulls a Docker image to feed
    # the REQUIRED aggregate, so a stalled registry must not hold
    # `python-ci-gate` pending for hours on every PR.
    timeout-minutes: 5
    # #7867: a VERSION-PINNED hosted label, NOT `ubuntu-latest`. On this repo
    # `ubuntu-latest` ALSO matches the self-hosted ARM64 pool — the repo says so
    # itself in finding-provenance.yml: "The self-hosted runners on this repo
    # also advertise ubuntu-latest (self-hosted,Linux,ARM64,ubuntu-latest) … the
    # routing is ambiguous, not fixed" — so `ubuntu-latest` does NOT mean
    # "GitHub-hosted with its own egress IP". That premise is load-bearing here:
    # this leg pulls its actionlint image with a single literal reference.
    # `ubuntu-24.04` is claimed by no self-hosted runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflow syntax + Actions-expression errors)
        run: |
          # `nullglob` makes an unmatched pattern expand to NOTHING rather than
          # to the literal pattern text, so the emptiness check below tests a
          # real empty set. An array (not a bare expansion) keeps the paths
          # intact through word splitting and shellcheck.
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no workflow files matched — refusing to certify an empty surface"
            exit 1
          fi
          # #7867: deliberately NOT routed through the GHCR/mirror resolver.
          # This leg is pinned to a HOSTED label (`runs-on: ubuntu-24.04`, see
          # the job header), so it has its own egress IP and never shares the
          # fleet's anonymous Docker Hub quota — there is nothing to fall back
          # FROM. Keeping the pin literal and unquoted in the `docker run` line
          # is also structural: tests/test_ci_selection.py reads it from there.
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12 \
            -shellcheck= "${files[@]}"

  test-record-postgres:
    # #9551 (epic #7879, doc 08 §B R3): the record's two Postgres legs
    # (`test_the_public_capture_path_writes_the_record` /
    # `..._the_epistemic_layer` in tests/test_9078_record_written_by_production_path.py)
    # SKIPPED on EVERY PR, twice over: `_record_db()` skips when
    # `TEST_RECORD_DB_URI` is unset AND `importorskip("psycopg2")` skips when the
    # optional `[postgres]` extra is absent — and no job set either. That is the
    # mechanism a NEW schema↔producer disagreement (#9264 class) hides behind:
    # the leg that would catch it never ran, so the loss was silent and the only
    # thing that ever saw it was an operator running the #9078 acceptance command
    # by hand. This job arms both halves and asserts the legs RAN.
    #
    # Runs on every PR and push (no diff gate, the `-` selector row in the
    # aggregate): the issue's required set — diffs touching `tortoise/`,
    # `supabase/` or `tests/` — is a SUBSET of that, and a diff-scoped selector
    # here would be new machinery for a ~2.5m job that already runs in parallel.
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    # Measured on the lane where this was built: 63 passed / 0 skipped in 70–73s
    # against a warm database, and ~100s when the container first applies the
    # record migrations. The arm-gate tests this PR adds (they run the gate over
    # fixture XMLs) take the collection to 70 — measured 2026-10-23 on a fresh
    # container: 70 passed / 0 skipped in ~194s, migrations included. 20m is a
    # runaway bound, not a measurement-thin one.
    timeout-minutes: 20
    env:
      # The record's database is POSTGRES, not a tortoise graph: this job exports
      # no `TORTOISE_DB_URI`, so `tests/conftest.py`'s epic #1647 P4 gate needs
      # the explicit URI-less opt-in. The zero-skip step below is what stops that
      # opt-in from being how the leg "passes".
      TORTOISE_TEST_CARVE_OUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip dependency caches (#7612)
        # Same key shape as the other pip-only sites, so it SHARES their cache
        # and a warm restore is a no-op. Coverage-neutral: pip's cache is
        # content-addressed, so it cannot substitute a different version.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install package + the postgres extra
        # `[postgres]` is one of the TWO skip causes (the other is the DSN).
        # `[embeddings]`/torch are deliberately absent: this file needs neither
        # (measured — same run, 71s against 204s with the embedder installed).
        run: pip install -e '.[test,postgres]'
      - name: Provision a throwaway Postgres on an ephemeral host port (#9551)
        # NOT a `services:` block: `tests/test_runner_ports_6673.py` forbids one
        # in this workflow, because a fixed host port is ONE global namespace on
        # the shared Docker daemon (a second overlapping job's `docker start`
        # fails and the runner aborts pre-step — a false red with zero tests
        # run). The action binds loopback (#7637) and exports
        # `TEST_RECORD_DB_URI`; paired with the teardown step below.
        uses: ./.github/actions/postgres-provision
      - name: Run the record's Postgres legs (armed — #9551)
        run: |
          set +e
          # Per-job scratch, NOT /tmp: the Python CI jobs on this repo write
          # hard-coded host-global paths (/tmp/junit.xml, /tmp/pytest.log) on a
          # shared self-hosted runner, and concurrent jobs clobber each other
          # (#7815 family). $RUNNER_TEMP is per-job.
          SCRATCH="${RUNNER_TEMP:-/tmp}/record-postgres"
          mkdir -p "$SCRATCH"
          # #3470: the log is captured through `tee`, so this leg gets the same
          # attribution every captured leg gets (`pytest-attribution.sh`).
          # #9555/R7: the record's narrative CARRIER and §9.4's VERBATIM
          # fetch — a Postgres-only pair, so it arms in this job like the
          # four-layer legs beside it. Its sibling
          # `tests/test_9555_narrative_cache_rebuild.py` is deliberately NOT
          # here: that leg destroys and rebuilds a FalkorDB cache, and this
          # job's leg gate FAILS on ANY skip (#9551) — a leg that cannot arm
          # here would red the job over a cache this job does not have.
          # #9567: the capstone is the one file whose SUBJECT is the seams
          # between the files above, and its record legs SKIP without this
          # job's DSN — so a lane that left it out of this list would report
          # the capstone green while it executed only its DB-free legs. Last
          # in the list on purpose: D10's policy drill re-applies the tenancy
          # migration, so nothing another file asserts on may run after it
          # without its own re-read.
          timeout -s INT -k 10 12m stdbuf -oL python -m pytest \
            tests/test_9078_record_written_by_production_path.py \
            tests/test_9555_narrative_carrier.py \
            tests/test_9664_capstone_connector_to_record.py \
            tests/test_9567_record_capstone.py \
            -v --timeout=300 -p no:cacheprovider -r fEs \
            --junitxml="$SCRATCH/junit.xml" -o junit_family=xunit1 \
            2>&1 | tee "$SCRATCH/pytest.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$SCRATCH/pytest-rc"
          bash .github/scripts/pytest-attribution.sh --log "$SCRATCH/pytest.log" --rc "$rc"
          exit $rc
      - name: The DB legs RAN, not skipped (#9551)
        # The target of the issue is "0 of the two DB legs skipped in the armed
        # job" — so this is asserted, not assumed. Without it the job is green
        # when the leg skips, which is the whole defect: an unarmed job and an
        # armed-but-skipping job are indistinguishable from the outside.
        # Read from the junit XML, not from the log text: a count in a summary
        # line is a rendering, an attribute is the result.
        #
        # The DECISION lives in `.github/scripts/record-postgres-leg-gate.py`,
        # not in this string (#9772 review P2). An inline heredoc is only
        # pinnable by substrings of its own text, and the substring pin this
        # step used to carry (`"skipped" in runs and "exit 1" in runs`) stayed
        # GREEN after the clause that fails the job on a real skip was deleted
        # — so the pin could not tell "asserts zero skips" from "prints a skip
        # count". As a script it is exercised against fixture XMLs
        # (`tests/test_9078_record_written_by_production_path.py` §8): a real
        # skip reds, a strict xfail does not, a green run passes.
        if: always()
        run: |
          SCRATCH="${RUNNER_TEMP:-/tmp}/record-postgres"
          python3 .github/scripts/record-postgres-leg-gate.py "$SCRATCH/junit.xml"
      - name: Upload record-postgres log (measurement artifact)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-record-postgres
          path: |
            ${{ runner.temp }}/record-postgres/pytest.log
            ${{ runner.temp }}/record-postgres/junit.xml
          if-no-files-found: ignore
      - name: Stop Postgres (#9551)
        if: always()
        uses: ./.github/actions/postgres-teardown

  # ── "DID THIS PR INTRODUCE A FAILURE?" (#9984) ──────────────────────────────
  # The required check used to ask "does anything fail anywhere?". Because it is ONE
  # check aggregating every shard, a single pre-existing trunk red red'd it for EVERY
  # PR — measured 2026-10-25: main green in 26 of its 27 Python CI jobs, the one red
  # (#9979) red'd all 11 open PRs including ones touching nothing near it, and the
  # repo-wide merge rate went to zero for ~8 hours on idle machines. The rail already
  # asks the right question and exempts a failure main itself is red for; this job asks
  # the same question of the same tree, with the same code.
  #
  # IT IS A SEPARATE JOB, NOT A STEP ON THE AGGREGATE, for two structural reasons:
  #   * the aggregate's whole design is that its `needs:`+LEGS table IS its claim, and
  #     it carries NO checkout and NO tooling — a step that runs repo code there would
  #     be the first, which is why its step list is digest-pinned by
  #     tests/test_capstone_preregistration_9075.py (a step in that job can export
  #     `BASH_ENV` and make the required check exit 0 over a red leg);
  #   * the verdict needs a checkout of THIS repo and of a PINNED agent-infra, and
  #     giving the aggregate those steps is exactly the surface that pin refuses.
  # So the aggregate consumes this job as one more need, and treats ITS result as the
  # one failure that can never be deferred (a verdict cannot ask itself).
  #
  # `needs:` MUST STAY EQUAL to the aggregate's DEFERRABLE_LEGS — the predicate can only
  # adjudicate a leg it waited for. The equality is pinned in both directions by
  # `tests/test_ci_new_failure_gate.py`, because a drift either excuses a leg the verdict
  # never looked at (a false PASS on the required check) or waits for a leg it can never
  # excuse (a no-op verdict).
  ci-introduced-failure:
    # `always()`: this must run when the legs FAILED — that is the only case it exists
    # for. Without it the default `success()` would skip it on exactly the red runs.
    if: always()
    # EXACTLY the arms that produce a TEST failure set — the only class #9984 lets the
    # predicate excuse. The gate's own deferrable set is this same list (pinned by
    # tests/test_ci_new_failure_gate.py), so a leg cannot be excused by a verdict that
    # never waited for it (which would pass a red leg), and a leg cannot be waited for
    # and never excused (which would make the verdict a no-op).
    #
    # ⛔ NOT `manifest-integrity`: a job on the path to the test matrix must not depend
    # on the drift gate, or a drift would SKIP the matrix instead of failing it
    # (#2656, pinned by test_drift_gate_cannot_skip_the_test_matrix).
    needs: [test, test-slow, test-carve-out, test-concurrency-falkor, packs-compile, test-track-b, test-d14-hosted-api, test-record-postgres]
    runs-on: ubuntu-latest
    # Bounded: this job feeds the REQUIRED aggregate, and it makes a handful of API
    # reads. A stalled GitHub must not hold `python-ci-gate` pending for hours.
    timeout-minutes: 15
    # Reading the run's jobs and their step logs is the whole requirement. Explicit, so
    # a repository-setting drift cannot silently widen the token this check uses.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # The rail's predicate, at a PIN. Unpinned, this job would track agent-infra
      # `main` and could go red on a change nobody in this repo reviewed — on the
      # surface every PR's merge depends on.
      - name: Check out the shared CI predicate (pinned, #9984)
        uses: actions/checkout@v4
        with:
          repository: daniel-ospina/agent-infra
          path: .ci-predicate
          ref: 0b8cfa37ea73c6b6b47db10c6bc32921d3b2d904

      # #9018: this job shells out to `gh`, which is simply ABSENT on the fallback
      # pool's minimal non-login PATH — where it reads as a test failure and is not
      # one. Provide the tool or fail NAMING it.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh

      # Only when a leg actually FAILED: on an all-green run there is nothing to
      # adjudicate, and on a `push` run the module refuses by design (see below). A
      # `cancelled` leg is not in this set — the aggregate reds on that class itself,
      # and a leg that never ran has no failure set to compare.
      #
      # ⛔ THE CONDITION MUST NAME EVERY CLASS THE AGGREGATE DELEGATES (#9984 review).
      # The aggregate delegates BOTH `failure` and `timed_out` for a deferrable leg, and
      # `contains()` is EXACT-ELEMENT membership over the joined array — so
      # `always() && contains(needs.*.result, 'failure')` left a `timed_out` delegation
      # with NO adjudicator: this job still RUNS (it is `always()`), its predicate step
      # is SKIPPED, every remaining step succeeds, and the aggregate reads that
      # job-level `success` as a certification — the required check goes GREEN on a PR
      # whose shard timed out, with no comparison against main at all. Joined to the
      # aggregate's own delegable set by
      # `tests/test_ci_new_failure_gate.py::test_the_verdict_step_is_gated_on_every_class_the_aggregate_delegates`.
      - name: Was a leg's failure introduced by this PR? (#9984)
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'timed_out')) }}
        env:
          # `GH_TOKEN` is what the jobs/logs API reads. `github.token` carries exactly
          # the `actions: read` this job declares — no wider.
          GH_TOKEN: ${{ github.token }}
          # The event payload, passed as ENV rather than inline: the values are only
          # meaningful on `pull_request`, and a `push` invocation is refused by the
          # module on purpose (below).
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          # ⛔ THE RED LEGS, FROM THE `needs` THIS JOB ALREADY WAITED FOR (#9984 review).
          # `--red-legs` is the ONLY switch that turns on the module's "a red leg with
          # NO failing job in the listing is unobservable" net, and nothing passed it:
          # with it empty, `failing_jobs()` scopes to EVERY job and a red leg whose
          # failed job is absent from the listing (or ended on a conclusion this module
          # does not map) left `failed == []`, so `evaluate` took its "nothing failed →
          # CLEAN" branch and this job's `success` certified a delegated red leg. That
          # is the precise false PASS the module's own docstring promises cannot happen
          # ("a listing that names no failing job for a red leg — each is 2, never 0").
          # Derived from `toJSON(needs)` rather than a hand-kept list, so there is no
          # second copy of the leg table to drift — the objection the `--red-legs`
          # docstring raises against a caller passing its own table.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -u
          # `scripts/` is a MACHINE-LOCAL pointer (#9475: gitignored, NOT tracked — a
          # git symlink cannot hold `$AGENT_INFRA_PATH`), so the runner has no copy of
          # the rail's `ci-failure-set.sh` / `ci_exemption.py`. They are checked out
          # from the pin above because the gate must ask the RAIL's question with the
          # RAIL's code: a second implementation of "NEW failure" here would drift from
          # the one the merge path enforces, and the drift would be discovered at 3
          # a.m. by a lane (#9984 constraint 7).
          #
          # ── THE DECLARED BOUNDARY: PR-only ────────────────────────────────
          # On `push`, "no new failure relative to main" is VACUOUS (the tree IS main)
          # and main's redness is the baseline every PR is compared against — so the
          # module REFUSES a push invocation and exits 2. That fails this job, which
          # reds the aggregate, which keeps the old push behaviour: any red leg still
          # reds the required check on main. Deliberate — the post-merge alarm must not
          # be the thing this predicate silences.
          #
          # FAIL CLOSED: every non-zero from the module fails this job, including its
          # "unmeasurable" exit — an unreadable baseline, an unreadable job log, a
          # missing checkout. A missing check is not a green check.
          rc=0
          RED_LEGS=$(python3 -c 'import json,os; needs=json.loads(os.environ["NEEDS_JSON"]); print(" ".join(k for k,v in sorted(needs.items()) if (v or {}).get("result") in ("failure","timed_out")))')
          python3 .github/scripts/new-failure-gate.py evaluate \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --head "$PR_HEAD" \
            --event "$EVENT_NAME" \
            --red-legs "$RED_LEGS" \
            --agent-infra .ci-predicate || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::#9984 the introduced-failure predicate did not certify this tree (exit $rc) — a NEW failure, or a failure set that could not be measured; merge blocked"
            exit 1
          fi

  python-ci-gate:
    if: always()
    needs: [changes, manifest-integrity, workflow-lint, test, test-slow, test-carve-out, test-concurrency-falkor, packs-compile, test-track-b, test-d14-hosted-api, test-record-postgres, surface-guard, ci-introduced-failure]
    runs-on: ubuntu-latest
    # #3239 shape, and the most expensive instance of it: this IS the required
    # check (`merge_conditions` in .mergify.yml), and it carried no cap at all.
    # The step is a shell loop over `needs.*.result` — no network, no `gh` — so
    # a hang here is pure wedge, and the 360m default would hold the merge queue
    # on it. Measured 2026-10-27 (60 newest completed runs): p50 0.00m,
    # p95 0.02m, max 0.02m over the 34 runs whose gate actually executed.
    # The cap bounds THIS job's step only — a leg that never reports is bounded
    # by that leg's own cap (the job table in docs/ops/ci-wall-clock.md).
    timeout-minutes: 15
    steps:
      - name: Aggregate matrix result
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "matrix results: $RESULTS"
          # #9984: the arms a failed TEST can be excused on, and the job that decides
          # it. Both are plain shell vars, deliberately: this script must stay
          # renderable by its own harness in tests/test_ci_selection.py, which refuses
          # a script carrying a GitHub expression it cannot substitute.
          # ⛔ THE TWO MUST AGREE (pinned by tests/test_ci_new_failure_gate.py): the
          # verdict job's `needs:` is exactly this list, so it waits for every arm it
          # can excuse and excuses nothing it did not wait for.
          PREDICATE_JOB="ci-introduced-failure"
          DEFERRABLE_LEGS="test test-slow test-carve-out test-concurrency-falkor packs-compile test-track-b test-d14-hosted-api test-record-postgres"

          #    `skipped` is NOT a pass by default. A docs-only diff legitimately
          #    skips the matrix, so a leg the SELECTOR declined may skip — but a
          #    shard the selector DID select that reports `skipped` is a lost
          #    shard, and this REQUIRED check must not certify it (#5219).
          #    `needs.<job>.result` also renders EMPTY when <job> is missing from
          #    `needs:`, so every row here fails closed on the #5219 shape too.
          #    Row form: <leg>|<result>|<the selector output that selects it>;
          #    `-` means the leg has no diff gate and must therefore always be
          #    SUCCESS (the surface guard's original explicit assertion, applied
          #    to every always-run leg).
          #
          #    THIS TABLE NOW RUNS FIRST. It used to be dead code for the red
          #    class that dominates: a bare `grep -qE 'failure|cancelled'` bail
          #    sat ABOVE it and exited first, so a `failure` or `cancelled` leg
          #    reported only "matrix leg failed or was cancelled — merge blocked"
          #    and never its name. Narrower than "on every red": the table's own
          #    line (in the form `::error::$leg reported ...`) was REACHED for a
          #    `skipped`-while-selected leg and for the empty (#5219) missing-leg
          #    row, because neither matches that sweep — so those two classes
          #    were already named pre-fix. The two above were not, and they are
          #    what an operator sees on a normal red (agent-infra#2148 sibling).
          #    Measured 2026-10-19: 11 open PRs red on this required check, every
          #    one reporting only the bare sentence while a red shard sat
          #    un-named.
          #
          #    Fail-closed is preserved and made explicit per class:
          #      failure          -> named, then handed to the INTRODUCED-FAILURE
          #                          PREDICATE (#9984); red unless every failing id is
          #                          main's own, and red CLOSED on any unmeasurable
          #      cancelled        -> red, named (a cancelled leg certifies nothing)
          #      empty (#5219)    -> red, named (a missing leg is not a pass)
          #      skipped+selected -> red, named (a lost shard is not a pass)
          #      skipped+declined -> pass (the selector declined this leg)
          #
          #    WHY `failure` IS THE ONE CLASS THAT IS HANDED ON (#9984). The gate used
          #    to ask "does anything fail anywhere?". Because it is ONE required check
          #    aggregating every shard, a single pre-existing trunk red red'd it for
          #    every PR in the repo — measured 2026-10-25: main green in 26 of its 27
          #    jobs, the one red (#9979) red'd all 11 open PRs including ones touching
          #    nothing near it, and the repo-wide merge rate went to zero for ~8 hours
          #    on idle machines. The rail already asks the right question and exempts a
          #    failure main itself has; this hands the same tree to the same code.
          #    What is NOT exemptible is unchanged and checked FIRST: a leg that never
          #    ran (cancelled / skipped-while-selected / no result) can never be
          #    excused as "pre-existing", because it produced no failure set at all.
          LEGS_FILE="$(mktemp)"
          cat > "$LEGS_FILE" <<'LEGS'
          changes|${{ needs.changes.result }}|-
          manifest-integrity|${{ needs.manifest-integrity.result }}|-
          workflow-lint|${{ needs.workflow-lint.result }}|-
          test|${{ needs.test.result }}|${{ needs.changes.outputs.python }}
          test-slow|${{ needs.test-slow.result }}|${{ needs.changes.outputs.slow_run }}
          test-carve-out|${{ needs.test-carve-out.result }}|${{ needs.changes.outputs.carve_out_run }}
          test-concurrency-falkor|${{ needs.test-concurrency-falkor.result }}|${{ needs.changes.outputs.python }}
          packs-compile|${{ needs.packs-compile.result }}|${{ needs.changes.outputs.python }}
          test-track-b|${{ needs.test-track-b.result }}|${{ needs.changes.outputs.python }}
          test-d14-hosted-api|${{ needs.test-d14-hosted-api.result }}|-
          test-record-postgres|${{ needs.test-record-postgres.result }}|-
          surface-guard|${{ needs.surface-guard.result }}|-
          ci-introduced-failure|${{ needs.ci-introduced-failure.result }}|-
          LEGS

          # Fail closed by construction, and NAME the leg while doing it: every
          # row class that is not a pass is recorded and reds the step, reported
          # as "leg 'X' reported '...'" rather than as a bare "merge blocked".
          # FAILED_LEGS accumulates NAMES (not a counter) so the summary counts a
          # leg once even if a copy-pasted duplicate row makes the loop inspect it
          # twice; the loop itself never skips a red row, so a duplicate cannot
          # mask one.
          FAILED_LEGS=""
          # #9984: the legs whose only complaint is "something failed". They are named
          # HERE (so an operator still sees which shard is red) and then adjudicated by
          # the predicate below. They are NOT in FAILED_LEGS: a red shard whose every
          # failing id is main's own is not this PR's problem.
          RED_LEGS=""
          while IFS='|' read -r leg result selected; do
            if [ -z "$leg" ]; then
              continue
            fi
            case "$result" in
              success)
                continue
                ;;
              skipped)
                if [ "$selected" = "false" ]; then
                  echo "  $leg: skipped by the selector (not selected for this diff)"
                  continue
                fi
                echo "::error::leg '$leg' is SKIPPED although the selector selected it (selected='$selected') — a lost shard is not a pass (#5219); merge blocked"
                FAILED_LEGS="$FAILED_LEGS$leg "
                ;;
              cancelled)
                echo "::error::leg '$leg' was CANCELLED (selector: selected='$selected') — a cancelled leg certifies nothing; merge blocked"
                FAILED_LEGS="$FAILED_LEGS$leg "
                ;;
              '')
                echo "::error::leg '$leg' reported NO RESULT (empty) — the #5219 missing-leg shape is not a pass; merge blocked"
                FAILED_LEGS="$FAILED_LEGS$leg "
                ;;
              failure|timed_out)
                # #9984: a failed TEST arm is adjudicated by `ci-introduced-failure`,
                # which asks the rail's question about this same tree. The deferrable set
                # is `$DEFERRABLE_LEGS` and nothing else: a non-test gate (surface,
                # manifest, workflow-lint, or the verdict job itself) can never be
                # excused as "pre-existing", and the verdict job in particular must not
                # be deferred — that would make the verdict ask itself.
                case " $DEFERRABLE_LEGS " in
                  *" $leg "*)
                    echo "  $leg: reported '$result' (selector: selected='$selected') — delegated to the introduced-failure predicate (#9984)"
                    RED_LEGS="$RED_LEGS$leg "
                    ;;
                  *)
                    echo "::error::leg '$leg' reported '$result' (selector: selected='$selected') — not a test arm, so it is not delegable; merge blocked"
                    FAILED_LEGS="$FAILED_LEGS$leg "
                    ;;
                esac
                ;;
              *)
                echo "::error::leg '$leg' reported '$result' (selector: selected='$selected') — merge blocked"
                FAILED_LEGS="$FAILED_LEGS$leg "
                ;;
            esac
          done < "$LEGS_FILE"

          if [ -n "$FAILED_LEGS" ]; then
            # $FAILED_LEGS is DELIBERATELY unquoted: the word-split is what puts
            # one leg per line for `sort -u`. `wc` pads its output, so strip the
            # spaces rather than printing them.
            FAILED=$(printf '%s\n' $FAILED_LEGS | sort -u | wc -l | tr -d ' ')
            echo "❌ $FAILED leg(s) did not pass — the ::error:: lines above name each one (GitHub shows at most 10 annotations per step; the log carries them all)"
            rm -f "$LEGS_FILE"
            exit 1
          fi

          # Defence in depth (#5219): the plain sweep over `needs.*.result` is
          # identity-BLIND — it cannot say WHICH leg — so it is the last resort for a
          # failing/cancelled result that reached `needs:` with NO row at all.
          # The invariant itself is owned by `.github/scripts/check-required-set.py
          # ::check_gate_legs` (run inside `manifest-integrity`, whose failure the
          # loop above already reports by name) and by
          # `tests/test_required_set_sync.py` at test time; this is the narrowest
          # third layer, and the only one still reachable if that guard is itself
          # what drifted (pinned by tests/test_ci_selection.py).
          # ⛔ `cancelled` IS SWEPT UNCONDITIONALLY (#9984 review). It can never be
          # delegated — the leg loop above reds on that class by name — so a
          # `cancelled` result still in `$RESULTS` without a row is drift, and gating
          # the WHOLE sweep on `RED_LEGS` being empty made a delegated `failure`
          # elsewhere blind this layer to a leg that never ran. Measured pre-fix: a
          # `cancelled` need whose row was deleted passed rc=0 as soon as one
          # deferrable leg was delegated.
          # ⛔ THE `failure` HALF IS GATED ON A COUNT, NOT ON `RED_LEGS` BEING EMPTY
          # (#9984 review). `RED_LEGS` is non-empty whenever ANY deferrable leg is
          # delegated — which is a different question from "did every `failure` in
          # `$RESULTS` reach this loop as a row?". Gating on emptiness therefore
          # blinded this layer in its OWN case: an un-rowed `failure` need, plus any
          # OTHER delegated leg, took the sweep to rc=0 and the check printed
          # "did not introduce it" over a leg the row table never looked at
          # (measured: `extra=('failure',)` + `test=failure` → rc=0 pre-fix).
          # Comparing counts closes that without re-redding the delegated class: the
          # sweep fires exactly when more failure/timed_out results arrived than rows
          # claim them, which is precisely "a result with no row".
          # Both halves stay LITERAL — `failure|cancelled` is pinned as a line of code
          # (#9240), so the literal survives here even though the gate moved.
          RESULT_FAILS=$(printf '%s\n' $RESULTS | grep -cxE 'failure|timed_out' || true)
          ROW_FAILS=$(awk -F'|' '$2 == "failure" || $2 == "timed_out" { n++ } END { print n+0 }' "$LEGS_FILE")
          if echo "$RESULTS" | grep -qE 'cancelled' \
             || { [ "$RESULT_FAILS" -gt "$ROW_FAILS" ] && echo "$RESULTS" | grep -qE 'failure|cancelled'; }; then
            echo "::error::a need reported failure-or-cancelled but no leg row named it — the leg table above has drifted from needs:; merge blocked"
            rm -f "$LEGS_FILE"
            exit 1
          fi

          # ── THE VERDICT (#9984) ─────────────────────────────────────────────
          # A failed shard is no longer this check's problem on its own: it delegated
          # to `ci-introduced-failure`, which asked the RAIL's question about the same
          # tree (the same `ci_exemption.py decide` the merge path enforces). If that
          # job did not SUCCEED, its own row above already put it in FAILED_LEGS and we
          # never reach here — so arriving with RED_LEGS means every failed shard was
          # certified as main's own pre-existing red.
          rm -f "$LEGS_FILE"
          if [ -n "$RED_LEGS" ]; then
            RED_COUNT=$(printf '%s\n' $RED_LEGS | sort -u | wc -l | tr -d ' ')
            echo "✅ $RED_COUNT leg(s) failed ($RED_LEGS), and $PREDICATE_JOB certified every failing id as main's own pre-existing red — this PR did not introduce it (#9984)"
          else
            echo "✅ every declared leg ran to success, or was declined by the selector"
          fi
