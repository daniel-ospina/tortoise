name: Python CI
# Reusable workflow — Python CI (pytest, ruff, mypy)
# Source: agent-infra/templates/.github/workflows/python-ci.yml
# Called via: uses: daniel-ospina/agent-infra/.github/workflows/python-ci.yml@<ref>
# Version contract (#303): consumers pin a semver tag (e.g. @v0.1.0). A
# workflow change lands in consumers by an explicit version bump — never @main.
# Materialized to .github/workflows/ by scripts/sync-ci-workflows.sh (real
# files only — GitHub Actions CANNOT parse symlinked workflow files, #555).
# Budget: PR-only (shared Actions budget under daniel-ospina account)
#
# Inputs:
#   test-command       pytest invocation. '' = skip the test job.
#   lint-command       ruff invocation. '' = skip the lint job.
#   typecheck-command  mypy invocation. '' = skip the typecheck job;
#                      'auto' = auto-detect the package dir (legacy behavior).
#   install-extras     pip install target for the test/typecheck jobs.
#   python-version     Python version for setup-python.

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.11'
      test-command:
        type: string
        default: 'python -m pytest tests/ -x --timeout=30 -q'
      lint-command:
        type: string
        default: 'ruff check .'
      typecheck-command:
        type: string
        default: ''
      install-extras:
        type: string
        default: '.'

jobs:
  test:
    runs-on: ubuntu-latest
    if: inputs.test-command != ''
    # #2055 — measured green p90 66s -> 10 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      # #383 — skip-empty guard: skip the extras install when install-extras
      # is '' (no package to install) or the repo has no packaging metadata.
      - run: pip install -e "${{ inputs.install-extras }}"
        if: inputs.install-extras != '' && (hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' || hashFiles('setup.cfg') != '')
      - run: pip install pytest pytest-timeout
      - run: ${{ inputs.test-command }}

  lint:
    runs-on: ubuntu-latest
    if: inputs.lint-command != ''
    # #2055 — measured green p90 8s -> 10 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      # #414 — ruff drift guard: the unpinned `pip install ruff` here made
      # consumers lint against whatever ruff is latest on PyPI, so a ruff
      # release (rule-surface drift) turned consumer PRs red with no code change
      # (tortoise #2150/#1685 class). Pinned to the current consumer pin
      # (tortoise dev group + lint-command prefix: ruff==0.16.4). Bump
      # ceremony: edit the pin here → semver tag bump (version contract
      # #303) → consumers repin the tag AND their own ruff pin in lockstep.
      - run: pip install ruff==0.16.4
      - run: ${{ inputs.lint-command }}

  typecheck:
    runs-on: ubuntu-latest
    if: inputs.typecheck-command != ''
    # #2055 — measured green p90 8s -> 10 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      # #383 — skip-empty guard: skip the extras install when install-extras
      # is '' (no package to install) or the repo has no packaging metadata.
      - run: pip install -e "${{ inputs.install-extras }}"
        if: inputs.install-extras != '' && (hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' || hashFiles('setup.cfg') != '')
      - run: pip install mypy
      - name: Set typecheck target
        run: |
          if [ "${{ inputs.typecheck-command }}" != "auto" ]; then
            echo "TYPECHECK_CMD=${{ inputs.typecheck-command }}" >> $GITHUB_ENV
          else
            PKG=$(python3 -c "
            import os
            for d in sorted(os.listdir('.')):
              if d.startswith('.') or d in ('tests','test','docs','scripts','dist','build','node_modules'):
                continue
              if os.path.isdir(d) and os.path.isfile(os.path.join(d,'__init__.py')):
                print(d)
                break
            " 2>/dev/null)
            echo "TYPECHECK_CMD=mypy ${PKG:-.} --ignore-missing-imports --check-untyped-defs" >> $GITHUB_ENV
          fi
      - run: ${{ env.TYPECHECK_CMD }}
