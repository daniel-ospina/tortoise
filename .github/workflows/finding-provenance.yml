# finding-provenance CI gate (#4290)
#
# Three lanes once reported a defect that was already fixed on origin/main —
# each measured against a stale worktree. A finding is TRUE OF THE TREE IT WAS
# MEASURED ON and may be FALSE OF THE PRODUCT, and nothing in the report said
# which tree that was.
#
# This gate runs tools/finding_provenance.py against an issue body AND against
# an issue/PR COMMENT. It fails when the finding carries no provenance ("unknown
# provenance is not a pass") or when the tree it names does NOT contain the
# current origin/main — i.e. the defect it reports may already be fixed. The
# test is ANCESTRY (git merge-base --is-ancestor), never SHA equality, so a
# finding measured on a branch that merely CONTAINS main is current, not stale.
#
# TRIGGER SCOPE — `issues: [opened]`, `issue_comment: [created]` (plus
# workflow_dispatch). This is a forward-looking rule: firing on
# `edited`/`labeled` would retroactively redden and stamp `provenance-stale` on
# the ~175 pre-existing `bug` issues that predate the convention, spending the
# gate on reports it was never written about. Re-check an existing finding by
# hand:
#     gh workflow run finding-provenance.yml -f issue_number=<N>
#
# ISSUE SCOPE — a `Measured at:` line is gated FIRST, whatever the labels: an
# issue that claims a measurement never escapes validation. An issue with NO
# line is then a finding only if it is `bug`-labeled. `beta-feedback` reports
# (external, about a released version, no checkout to emit from) are exempt
# from the REQUIRED case; features, epics and process issues are untouched.
#
# COMMENT SCOPE (#4732) — the issue body is written once, usually at filing,
# BEFORE the investigation that produces the findings; the findings arrive in
# comments. A comment is gated ONLY when it claims to be a finding — a
# provenance claim (`Measured at:`, in any form) or the explicit
# `<!-- finding -->` marker — so ordinary discussion comments pass untouched
# and unannotated. An over-eager comment gate becomes noise and is ignored,
# which is its own silent failure. The classifier is tools/finding_provenance.py
# `--is-finding` (exit 1 = ordinary discussion, skip). A comment's verdict
# annotates THAT comment (a reply carrying its `#issuecomment-<id>` link) and
# deliberately does NOT touch the issue-level `provenance-stale` label, which
# is the issue-body gate's state.
#
# COST — TWO JOBS, CHEAP FIRST (#9115). Every comment used to pay the
# full-history checkout before it could be classified, because the classifier
# IS the repo's own tool and the checkout is what provides it. Measured on this
# repo 2026-10-19: of the last 100 workflow runs it triggered, 29 were this
# workflow — the most of any workflow in the repo, 1.8x the next — and in
# 19 of 20 sampled runs the gate step was `skipped`: ordinary discussion
# comments that paid a full-history clone (14 s of an 18 s job) to be told
# "not a finding". Under the #9115 flood that turned ~50 lanes' chatter into
# 12+ concurrent runners and left the REQUIRED `python-ci-gate` with no slot.
#
# So the work is now split: `classify` checks out with `fetch-depth: 1` — the
# classifier is a PURE TEXT predicate that opens no git repo — and `provenance`
# (the only leg that needs history) runs on `needs:` only when the body IS a
# finding. Both jobs carry an explicit `timeout-minutes`, so a wedged clone can
# no longer hold a runner for the 360-minute default.
#
# ⛔ The classification is still the repo's OWN tool, never a shell `grep` in
# front of the checkout: a second copy of the predicate drifts, and then the
# cheap copy decides silently. The split saves the CONE, not the predicate.
#
# ⛔ There is deliberately NO `paths:`/`paths-ignore:` filter here. The triggers
# are `issues`/`issue_comment`, which carry no path, and a path-filtered GATE
# never runs — a skipped check reads as a pass to the rail. The same reason
# keeps this workflow's `concurrency:` keyed PER ISSUE (below) rather than
# collapsed to one global group.
#
# The job runs on a VERSION-PINNED hosted label, not `ubuntu-latest`. The
# self-hosted runners on this repo also advertise `ubuntu-latest`
# (`self-hosted,Linux,ARM64,ubuntu-latest`), so `ubuntu-latest` can resolve to
# either pool. Measured 2026-10-05: among the last 100 runs of this workflow,
# some landed on `pi-runner-vm-*` while the most recent were all on
# `GitHub Actions <N>` — i.e. the routing is ambiguous, not fixed.
#
# ⛔ `ubuntu-24.04` USED to settle that ambiguity by being unclaimable from the
# fleet. Since the 2026-10-29 mitigation (#6897 suspended;
# docs/ops/ci-runner-x64.md, "the label contract") the installer CAN emit
# `…,ubuntu-24.04` under `CI_RUNNER_OS_LABEL=on|auto`, so BOTH jobs below are
# POOL-ELIGIBLE while the mitigation is
# engaged — the premise this comment used to end on, "a version-pinned label no
# self-hosted runner claims", is FALSE. Re-measure it rather than trusting this
# text: `gh api repos/<owner>/<repo>/actions/runners`.
# ⛔ THE COST, STATED: the pool's service PATH is a minimal non-login one with no
# `gh`, so a pool-served run of these jobs used to red as `gh: command not
# found` / 127 — a red that reads as a product failure and is not (run
# 40141219586; 38 of the 39 `classify` failures measured on 2026-10-24 were on
# `pi-runner-vm-*` holding this same label). That gap is now closed by the
# `runner-tools.sh ensure gh` step in each job, which provides the tool or fails
# NAMING it (#9018) — not by the label.
# Do NOT change it back to `ubuntu-latest`, and never to `self-hosted`.
#
# WHAT THIS DOES NOT DO (#4732 hole 2): a body validated once is never
# RE-validated as the base moves, so a body that was CURRENT when it was
# written can go STALE silently. This remains open.
#
# INJECTION SAFETY (#4732) — `issue_comment` runs on text anyone can write.
# The comment body is NEVER interpolated into a `run:` block: only the NUMERIC
# `github.event.comment.id` and issue number cross the boundary, and they cross
# it as `env:` scalars; the body is fetched by id through `gh api` into a FILE
# and read from that file. `${{ github.event.comment.body }}` in `run:` would be
# a script-injection sink (`$(…)`, backticks and quotes in the comment would
# execute as shell). Note `issue_comment` fires for PULL-REQUEST comments too
# (a PR is an issue in GitHub's data model) — the workflow never checks out the
# PR head, so no untrusted code runs, and the only credential in scope is the
# auto-provisioned `secrets.GITHUB_TOKEN` (no repository secret is read).
#
# EXIT CODES ARE HONORED. The tool separates exit 1 (STALE / UNKNOWN /
# AMBIGUOUS / PREDATES_FIX — the finding is at fault) from exit 2 (could not
# measure — an environment fault). Only exit 1 annotates the finding; exit 2
# says so and leaves the label alone. The verdict is captured via an explicit
# `rc=$?`, never piped: a pipeline's status is `tee`'s, which is how a previous
# revision of this file made the whole gate a no-op.
name: finding-provenance

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to audit
        required: true

permissions:
  contents: read
  issues: write

# Collapse duplicate runs, keyed PER ISSUE, never per comment (#9577).
# `github.run_id` is the guaranteed-unique fallback for a dispatch with no
# issue_number.
#
# With ONE GLOBAL group (proposed and refused on #9115) a burst of comments
# cancels every run but the newest. That was the argument the OLD key was
# defended with, and it was wrong about what the old key did: the old key was
# `comment.id || issue.number || inputs.issue_number || run_id`, so on the
# COMMENT arm — the one that flooded — a comment id is unique per comment, every
# comment landed in its own group, and `cancel-in-progress` cancelled NOTHING.
# (Its other two arms did coalesce per issue: a dispatch resolved to the issue
# number, so re-running the recovery path for one issue already superseded
# itself. The flood was entirely the comment arm.) A key that is unique per
# event bounds nothing while reading like a bound (#9577: 38 of 133 queued runs,
# 0 of 28 PRs mergeable). The rejection of a global group still stands — but it
# is a different design, not a defence of the old key. What `cancel-in-progress`
# does now is fire, on the issue, which is the bound the `issues` and
# `workflow_dispatch` arms already had.
#
# THE TRADE, STATED — and it is a REAL LOSS (#9577 replaces #9115's opposite
# reasoning; the cost below is why #9115 reasoned the other way):
#   * a second comment on the SAME issue cancels the first one's run, and a
#     cancelled run posts nothing — that comment never gets a verdict. It is NOT
#     recoverable in place: `workflow_dispatch -f issue_number=<N>` re-gates the
#     issue BODY, it has no `comment_id` input, and `issue_comment` is
#     `types: [created]` only, so nothing re-checks that comment. What a lane can
#     do is post a NEW comment, which gets a verdict of its own — the original
#     one stays unreviewed. (The comment arm's own annotation is a step ahead of
#     this: it offers "replace its provenance line" as an option, which the
#     `created`-only trigger never re-checks — only its "post a corrected
#     comment" half is actionable.)
#   * the comment arm and the ISSUE-BODY arm now SHARE a group. Under the old key
#     `comment.id` was truthy on comment events, so the two arms never collided;
#     now a comment arriving mid-flight cancels the body gate, which owns the
#     issue-level `provenance-stale` label — and the documented recovery dispatch
#     itself shares the group, so chatter can cancel the recovery too.
# Accepted anyway: that loss is bounded to ONE issue's own comment stream, while
# per-comment keying was unbounded ACROSS THE FLEET and starved the REQUIRED
# `python-ci-gate` — 0 of 28 PRs mergeable is the worse failure. Do not read this
# as "visible": nothing alerts on a cancelled run's owed verdict (the only trace
# is a `cancelled` conclusion and an unannotated comment), so the loss is silent
# in exactly the way #9115 feared — it is ACCEPTED, not mitigated. Bounding the
# run COUNT across issues without dropping verdicts is #9595's separate change
# (batching/coalescing with a catch-up sweep); it is not smuggled in here. That
# residue USED to be cited as "#9115's separate change" — but #9115 is CLOSED as
# COMPLETED (2026-10-19, while its own last comment recorded the flood
# recurring), and a closed issue is not a tracking home, so the work had none.
#
# `comment.id` is still READ by this workflow (`COMMENT_ID` fetches that
# comment's body by id) — it just must never be part of the concurrency KEY.
# `tests/test_reporting_workflow_concurrency.py`
# `test_finding_provenance_concurrency_group_never_keys_on_a_comment` fails if it
# comes back, at run level or on any job.
#
# ⛔ STILL not a single global group: one issue must never cancel another's gate.
concurrency:
  group: finding-provenance-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: true

jobs:
  # THE CHEAP HALF. This job only ROUTES — it never annotates, never labels and
  # never posts, so its verdict cannot be lost by a supersede (the workflow's
  # per-issue `concurrency:` group covers both jobs of one run). It needs no
  # history, hence `fetch-depth: 1`: that is the whole point of the split (#9115).
  classify:
    # Version-pinned hosted label — see the COST note above. NOT `ubuntu-latest`
    # (the self-hosted pool advertises that too), and never `self-hosted`.
    runs-on: ubuntu-24.04
    # A shallow clone + one classification is seconds. The bound exists so a
    # wedged runner can never hold a check slot for the 360-minute default.
    timeout-minutes: 6
    outputs:
      is_finding: ${{ steps.decide.outputs.is_finding }}
      number: ${{ steps.issue.outputs.number }}
      kind: ${{ steps.issue.outputs.kind }}
      comment_id: ${{ steps.issue.outputs.comment_id }}
    steps:
      # fetch-depth 1: classification is a pure TEXT predicate. The ancestry
      # test — the only thing that needs full history — lives in `provenance`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # tools/finding_provenance.py carries the inline >=3.12 guard (#5128).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # `runs-on: ubuntu-24.04` WAS a HOSTED-ONLY pin — pool-eligible only under the
      # CI_RUNNER_OS_LABEL=on|auto mitigation (header above) — and there is job evidence:
      # 40141219586's `classify` was served by `runner_name: pi-runner-vm-3` with
      # `labels: [ubuntu-24.04]`, and 38 of the 39 `classify` failures measured on
      # 2026-10-24 held that same label on `pi-runner-vm-2/3/4/5/6`. (The drift arm
      # that should have noticed reads `scripts/ci_runner_gate.sh`'s TEXT, not the
      # live label set, so it could not fire — that is its own finding, not this
      # step's.) Those failures were `gh: command not found` / `exit code 127`: a
      # red that reads as a product failure and is not. This step provides the tool
      # or fails NAMING it.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh

      - name: Resolve the issue body + labels
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          # NUMERIC ONLY. `github.event.comment.body` must never appear in a
          # `run:` block — that is the script-injection sink the comment
          # trigger opens (#4732). The body is fetched by id, below.
          COMMENT_ID: ${{ github.event.comment.id }}
          INPUT: ${{ github.event.inputs.issue_number }}
        run: |
          N="${ISSUE:-$INPUT}"
          [ -n "$N" ] || { echo "no issue number resolved"; exit 2; }
          echo "number=$N" >> "$GITHUB_OUTPUT"
          if [ -n "$COMMENT_ID" ]; then
            # COMMENT PATH (#4732): the body is fetched by id through the API
            # and written to a FILE. It is data, never shell source — no
            # interpolation of comment text into this script.
            echo "kind=comment" >> "$GITHUB_OUTPUT"
            echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              --jq .body > "$RUNNER_TEMP/body.md"
          else
            echo "kind=issue" >> "$GITHUB_OUTPUT"
            gh issue view "$N" --json body -q .body > "$RUNNER_TEMP/body.md"
          fi
          gh issue view "$N" --json labels -q '.labels[].name' > "$RUNNER_TEMP/labels.txt"

      - name: Decide whether this issue is a finding
        id: decide
        env:
          KIND: ${{ steps.issue.outputs.kind }}
        run: |
          if [ "$KIND" = "comment" ]; then
            # A COMMENT is gated ONLY when it CLAIMS to be a finding — a
            # `Measured at:` provenance claim of any form, or the explicit
            # `<!-- finding -->` marker. Discussion comments pass untouched:
            # a comment gate that fires on everything is noise, and a gate
            # that is ignored is its own silent failure (#4732). The
            # classifier is a separate step-level rc from the gate's.
            rc=0
            python3 tools/finding_provenance.py --is-finding \
              "$RUNNER_TEMP/body.md" || rc=$?
            case "$rc" in
              0) echo "is_finding=true" >> "$GITHUB_OUTPUT" ;;
              1) echo "is_finding=false" >> "$GITHUB_OUTPUT"
                 echo "ordinary discussion comment (no finding claim) — skipping" ;;
              *) echo "finding-provenance: classifier failed (exit $rc)"
                 exit "$rc" ;;
            esac
          elif grep -qE '^Measured at:' "$RUNNER_TEMP/body.md"; then
            echo "is_finding=true" >> "$GITHUB_OUTPUT"
          elif grep -qx 'beta-feedback' "$RUNNER_TEMP/labels.txt"; then
            echo "is_finding=false" >> "$GITHUB_OUTPUT"
            echo "beta-feedback report with no measured commit — skipping"
          elif grep -qx 'bug' "$RUNNER_TEMP/labels.txt"; then
            echo "is_finding=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_finding=false" >> "$GITHUB_OUTPUT"
            echo "not a finding (no provenance line, not an internal bug) — skipping"
          fi

  # THE EXPENSIVE HALF — full history, and it only runs for a body that IS a
  # finding. Everything that posts (label, annotation, reply) lives here.
  #
  # WHAT A CANCEL LOSES — PER ARM, because the two arms differ (#9577 review).
  # With `cancel-in-progress` finally FIRING (#9577) a mid-flight cancel lands
  # in one of two windows, and only ONE of them leaves a visible trace:
  #   * ISSUE-BODY arm — the recoverable one. Only this arm applies the
  #     issue-level `provenance-stale` label (further down), so a comment
  #     arriving mid-flight can cancel the body gate BETWEEN the label edit and
  #     the reply, leaving the label applied with no annotation explaining it.
  #     That is a live state, not a scar: it fails CLOSED (a visible label), and
  #     the documented `workflow_dispatch -f issue_number=` re-run re-gates the
  #     body and clears it.
  #   * COMMENT arm — NOT visible and NOT recoverable in place. This arm has no
  #     label edit at all (#4732 keeps the issue-level label for the body gate),
  #     so a cancel anywhere before the reply posts nothing and labels nothing:
  #     that comment's verdict is silently dropped, and no dispatch can re-run
  #     it (there is no `comment_id` input and `issue_comment` is `created`-only).
  #     The lane's only recovery is to post a NEW comment — a new group member
  #     with a verdict of its own; the original stays unreviewed.
  # A cancel landing BEFORE the label step is therefore silent for BOTH arms.
  # Do not read the body arm's label as a general fail-closed guarantee for this
  # workflow: the run-level trade block at the top states the loss plainly, and
  # it is ACCEPTED, not mitigated.
  provenance:
    needs: classify
    if: needs.classify.outputs.is_finding == 'true'
    # Version-pinned hosted label — see the COST note above.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # fetch-depth 0: the base-ancestry test needs full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # Re-fetching the body below is two `gh` calls; `runs-on: ubuntu-24.04` is a
      # HOSTED label that the pool has also carried (measured 2026-10-24: every
      # failing `classify`/`provenance` job that ran on `pi-runner-vm-*` held it),
      # and such a runner's service PATH is a minimal non-login one with no `gh`.
      # Provide the tool or fail NAMING it instead of failing at 127.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh

      # The body is RE-FETCHED rather than handed over as an artifact: it is one
      # API call, and an artifact would put the untrusted text through a second
      # store for no benefit. Numeric-only env, exactly as in `classify` — the
      # body is data, never shell source (#4732).
      - name: Resolve the issue body
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.classify.outputs.number }}
          COMMENT_ID: ${{ needs.classify.outputs.comment_id }}
        run: |
          N="$ISSUE"
          [ -n "$N" ] || { echo "no issue number resolved"; exit 2; }
          echo "number=$N" >> "$GITHUB_OUTPUT"
          if [ -n "$COMMENT_ID" ]; then
            echo "kind=comment" >> "$GITHUB_OUTPUT"
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              --jq .body > "$RUNNER_TEMP/body.md"
          else
            echo "kind=issue" >> "$GITHUB_OUTPUT"
            gh issue view "$N" --json body -q .body > "$RUNNER_TEMP/body.md"
          fi

      - name: Gate the finding's provenance
        id: gate
        # Explicit rc capture, NOT a pipe: `cmd | tee` returns tee's status, so
        # a piped gate can never fail and the workflow becomes a no-op. The
        # tool's exit code is the gate; it is propagated here and branched on
        # below (1 = the finding is stale/undated, 2 = could not measure).
        shell: bash
        run: |
          rc=0
          python3 tools/finding_provenance.py --validate "$RUNNER_TEMP/body.md" \
            > "$RUNNER_TEMP/verdict.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/verdict.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Annotate a stale / undated finding
        # `always()` is REQUIRED: GitHub Actions wraps a bare `if:` in an
        # implicit `success()`, and the gate step above deliberately exits
        # non-zero — so without it this step would be skipped exactly when it
        # must fire, turning the whole gate into a silent no-op. Same trap and
        # same fix as e2e-live-reconcile.yml:79 (#2189). The rc compare still
        # gates: only the tool's exit 1 (the finding is at fault) annotates.
        if: always() && steps.gate.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.issue.outputs.number }}
          KIND: ${{ steps.issue.outputs.kind }}
          CID: ${{ needs.classify.outputs.comment_id }}
        run: |
          if [ "$KIND" = "comment" ]; then
            # Annotate THAT comment (#4732): a reply carrying its permanent
            # link. The issue-level label is the issue-BODY gate's state and
            # is deliberately left alone here — so a clean comment can never
            # clear the body's label, and a stale comment cannot plant a
            # label that no comment re-run would clear.
            SUBJECT="[this comment](https://github.com/${GITHUB_REPOSITORY}/issues/${N}#issuecomment-${CID})"
          else
            SUBJECT="this finding's issue body"
            gh label create provenance-stale --color B60205 \
              --description "Finding measured against a tree that may not contain the fix (#4290)" \
              2>/dev/null || true
            gh issue edit "$N" --add-label provenance-stale
          fi
          {
            echo "⚠️ **finding-provenance: the measurement in ${SUBJECT} is stale or undated (#4290).**"
            echo
            # 4-space INDENT, not a fence: the verdict echoes an untrusted ref
            # label out of the finding body, and a fence can be closed by it.
            sed 's/^/    /' "$RUNNER_TEMP/verdict.txt"
            echo
            echo "A finding is true of the tree it was measured on and may be false of the product."
            echo "Re-verify against \`origin/main\` — or a tree that contains the claimed fix — then replace the provenance line:"
            echo
            echo '```'
            echo '$ uv run python tools/finding_provenance.py --emit'
            echo '```'
            echo
            if [ "$KIND" = "comment" ]; then
              echo "_This comment is not re-checked in place — replace its provenance line, or post a corrected comment._"
            else
              echo "_Re-run this gate after fixing it:_ \`gh workflow run finding-provenance.yml -f issue_number=$N\`"
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$N" --body-file "$RUNNER_TEMP/comment.md"

      - name: Report an unmeasurable run (environment fault, not a stale finding)
        if: always() && steps.gate.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.issue.outputs.number }}
        run: |
          {
            echo "⚠️ **finding-provenance: could not measure this finding (#4290).**"
            echo
            echo "This is an infrastructure fault (exit 2), NOT a verdict on the finding — no label was applied."
            echo
            sed 's/^/    /' "$RUNNER_TEMP/verdict.txt"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$N" --body-file "$RUNNER_TEMP/comment.md"

      - name: Clear a stale annotation on a clean re-run
        # Issue bodies only: the label is the ISSUE-BODY gate's live state, and
        # a clean comment must not clear it (nor a stale comment set it) — the
        # two surfaces keep separate state (#4732).
        if: always() && steps.gate.outputs.rc == '0' && steps.issue.outputs.kind == 'issue'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.issue.outputs.number }}
        run: |
          # The label must be a LIVE state, not a scar: a re-run that passes
          # after the reporter fixed the line removes it.
          gh issue edit "$N" --remove-label provenance-stale 2>/dev/null || true
