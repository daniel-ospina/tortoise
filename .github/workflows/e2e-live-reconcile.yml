# Weekly e2e-live orphan reconciliation (#2189) — READ-ONLY detector.
#
# Closes the #2189 gap: the welcome-e2e-monitor's live signup smoke mints real
# prod rows on a red run, and the #2140 incident (222 orphan teams/api_keys +
# 12 auth users + 222 FalkorDB graphs over ~14 days, found only by a manual CI
# audit) proved nothing periodic verified the OUTPUT stays clean. #2144 stops
# the route drift that caused the bleed (the monitor now stubs the whole app
# origin with a fail-closed tripwire); this job counts `e2e-live-*` rows in
# prod weekly and auto-files an issue on detection with the counts. The #2146
# cleanup scripts + runbook (docs/runbook/2146-e2e-live-orphan-cleanup.md)
# stay the remediation — executed manually by an operator, never by this job.
#
# Runs graph-scripts/e2e_live_reconcile.py — read-only SELECTs via the
# Management API (SUPABASE_ACCESS_TOKEN). Exit codes: 0 = clean (every count
# <= threshold 0), 1 = bleed detected (JSON doc has the counts), 2 =
# could-not-determine (missing token / HTTP / transport error) — fail-closed:
# a dead check must never look green (#2140: "a deaf monitor is not a
# detection layer").
#
# NEVER gates merges: schedule + workflow_dispatch only (no push/PR trigger) —
# a red reconcile is an ops signal, not a CI gate (#2189 acceptance).
#
# #3907: the auto-file steps file ONE issue per FINDING, not one per run. The
# pre-fix title embedded `(run {run_id})`, so every weekly run opened a new issue
# (two such duplicates are open at the time of writing). The title is now the
# STABLE dedupe key, and .github/scripts/auto-file-issue.sh searches for it
# before filing: a repeat run records `Recurrence #N` on the open issue instead
# of opening another. The two states (bleed vs could-not-read) carry DISTINCT
# keys so they never adopt each other. Forward-looking only: the pre-existing
# duplicates carry the old run-id titles and are deliberately NOT adopted.
name: e2e-live-reconcile

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC — catches a recurrence within a week of onset (~1/10th the #2140 scale)
  workflow_dispatch:      # manual run (fault-injection / post-cleanup verification)

concurrency:
  group: e2e-live-reconcile
  # Read-only job — cancelling an overlap is safe and prevents double auto-file
  # issues when a manual dispatch races the weekly cron.
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #2144 pattern: the auto-file steps POST to the issues API with
    # GITHUB_TOKEN; the org's restricted default token has no write scope (the
    # #2140 403 deaf-monitor). Minimal scopes: contents: read for checkout,
    # issues: write for the auto-file curls.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile e2e-live-* rows in prod (read-only detector)
        id: reconcile
        # rc semantics (from the script): 0 = clean, 1 = bleed detected (some
        # count > threshold), 2 = could-not-determine. --json keeps stdout
        # machine-only (ONE JSON line = the doc); human diagnostics go to
        # stderr and are surfaced in the log below. The doc is stashed in
        # /tmp for the auto-file payload steps (same runner, same job).
        run: |
          set +e
          OUT="$(python3 graph-scripts/e2e_live_reconcile.py --json 2>/tmp/e2e_live_reconcile.err)"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -n "$OUT" ]; then
            printf '%s\n' "$OUT" > /tmp/e2e_live_reconcile.json
            printf 'reconcile-json: %s\n' "$OUT"
          fi
          if [ -s /tmp/e2e_live_reconcile.err ]; then
            cat /tmp/e2e_live_reconcile.err >&2
          fi
          exit "$rc"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: File or update the bleed issue (#2189 — #2144/#3907 stable key)
        # rc=1 only: counts exist, so the "orphaned prod rows" title is factual.
        # rc=2 (could-not-determine) files a DISTINCT issue below — no counts
        # exist, and a fake "N rows" title would be noise.
        # GitHub Actions implicitly wraps bare `if:` expressions in
        # success() — but this step only runs when the reconcile step
        # FAILED (rc=1/rc=2), so success() is false and the auto-file would
        # be skipped exactly when it must fire (#2189 review P0 — the
        # #2140 deaf-monitor class recreated at the issue layer). always()
        # overrides the implicit status check; the rc compare still gates.
        # Same pattern as post-merge-validation.yml (#1438).
        if: always() && steps.reconcile.outputs.rc == '1'
        # #4361: the token is bound in `env:` and read as a QUOTED shell
        # variable. `${{ secrets.X }}` must never appear in a `run:` body —
        # GitHub substitutes it into the shell SOURCE before bash parses it, so
        # a value containing `"` loses its quotes (the #4334 outage) and one
        # containing `$(…)`/backticks would EXECUTE. An expanded variable's
        # contents are data, never re-parsed.
        #
        # #3907: the TITLE is the dedupe key and must be STABLE across runs —
        # the pre-fix title embedded `(run {run_id})`, so every weekly run filed
        # a new issue (two such duplicates are open at the time of writing).
        # Everything that varies per occurrence lives in the BODY, and
        # `.github/scripts/auto-file-issue.sh` searches for this exact key
        # BEFORE filing: a second run COMMENTS `Recurrence #N` on the one open
        # issue instead of opening another one.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GH_TOKEN="$GITHUB_TOKEN"
          # The body JSON is built by python from the reconcile doc (counts),
          # never string-interpolated into shell.
          python3 - > /tmp/e2e_live_bleed_body.md <<'PY'
          import json
          import os

          with open("/tmp/e2e_live_reconcile.json") as fh:
              d = json.load(fh)
          run_id = os.environ["GITHUB_RUN_ID"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{run_id}"
          )
          order = ("teams", "users", "api_keys", "memberships", "invitations",
                   "abuse", "analytics", "audit")
          counts = d["counts"]
          summary = " ".join(f"{k}={counts.get(k, 0)}" for k in order)
          offenders = d.get("offenders") or {}
          lines = []
          for kind, o in offenders.items():
              line = f"- {kind}: {o['count']}"
              if o.get("emails"):
                  line += f" ({', '.join(o['emails'])})"
              lines.append(line)
          body = (
              f"Weekly read-only e2e-live reconciliation (#2189) found orphaned prod rows "
              f"left by a live-test path (welcome-e2e-monitor). This job only detects — it "
              f"never deletes.\n\n"
              f"Latest run: {run_url}\n\n"
              f"Highest orphan count this run: {d['max']}. "
              f"Counts (project `{d['project_ref']}`, threshold {d['threshold']}):\n"
              f"```\n{summary}\n```\n"
          )
          if lines:
              body += "\nOffenders above threshold:\n" + "\n".join(lines) + "\n"
          if not d.get("shape_clean", True):
              body += (
                  "\nNOTE: some rows deviate from the #2146 guard email shape "
                  "`^e2e-live-[0-9a-f]{8}@premise-labs.dev$` — review them before cleanup.\n"
              )
          body += (
              "\nRemediation (manual, operator-reviewed): docs/runbook/2146-e2e-live-orphan-"
              "cleanup.md — dry-run, then execute, via graph-scripts/2146_e2e_live_orphan_"
              "cleanup.py (read the runbook guards first). The cleanup script deletes; this "
              "job never does.\n"
          )
          print(body)
          PY
          # `--fail-with-body`-equivalent: the helper's `gh api` exits non-zero
          # on an HTTP 4xx/5xx and on a failed dedupe SEARCH, so a broken file
          # path fails the step loudly instead of silently skipping the file
          # (the #2140 deaf-monitor class).
          bash .github/scripts/auto-file-issue.sh file \
            --title 'e2e-live reconcile: orphaned prod rows detected' \
            --body-file /tmp/e2e_live_bleed_body.md \
            --label bug
      - name: File or update the could-not-read issue (#2189 — #2140 lesson/#3907)
        # rc=2 (guard/transport failure: missing token, HTTP/5xx, network,
        # response-shape drift) must NEVER be a silent red run — #2140's core
        # lesson was a monitor that failed for ~14 days with nobody hearing.
        # This is a distinct "check could not run" issue, NOT an "N orphaned
        # rows" one (no counts exist on exit 2), and it carries its own STABLE
        # #3907 dedupe key so it never collides with the bleed issue above.
        if: always() && steps.reconcile.outputs.rc == '2'
        # #4361: the token is bound in `env:` and read as a QUOTED shell
        # variable — never interpolated into the `run:` text (a value with `"`
        # loses its quotes; `$(…)`/backticks would execute).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GH_TOKEN="$GITHUB_TOKEN"
          python3 - > /tmp/e2e_live_couldnotread_body.md <<'PY'
          import os

          run_id = os.environ["GITHUB_RUN_ID"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{run_id}"
          )
          body = (
              f"The weekly e2e-live reconciliation (#2189) failed BEFORE it could read counts — "
              f"the check fails closed (exit 2) so a broken/dead check never looks green.\n\n"
              f"Latest run: {run_url}\n\n"
              f"Expected causes: SUPABASE_ACCESS_TOKEN secret missing/rotated, a Management API "
              f"HTTP/transport error, or an unexpected response shape. Inspect the run log, then "
              f"re-run via workflow_dispatch once resolved.\n"
          )
          print(body)
          PY
          # #2140: a failed create (403/429/etc.) or a failed dedupe search
          # fails the step loudly (never the deaf-monitor class).
          bash .github/scripts/auto-file-issue.sh file \
            --title 'e2e-live reconcile: check could not read prod counts' \
            --body-file /tmp/e2e_live_couldnotread_body.md \
            --label bug
