name: registry-backup-cron

# Per-team knowledge-graph backup driver (#596). External driver with an
# independent failure domain: an OOM crash-loop (#545) or a silently skipped
# workflow must not blind the pipeline — the driver's DIRECT R2 freshness
# check (aws CLI) covers the app-down leg, and the in-process staleness
# daemon (driver-disabled leg) covers this workflow being disabled.

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off top-of-hour (GH jitter absorbed by thresholds)
  workflow_dispatch:
    inputs:
      run_now:
        type: boolean
        description: Run the sweep now (staging/ops)
        default: false
      simulate_app_down:
        type: boolean
        description: Point the pre-flight at a dead URL (staging E2E)
        default: false

permissions:
  contents: read
  issues: write          # GITHUB_TOKEN files/closes APP_DOWN etc.; no PAT on GH

concurrency:
  group: registry-backup
  cancel-in-progress: false   # scheduled runs never overlap

jobs:
  drive:
    runs-on: ubuntu-latest
    # #10234: 45, not 30. The timing arithmetic that actually holds, worst case:
    # sweep 1500s (SWEEP_TIMEOUT_S) + purge 300s + reconcile 120s + status 20s
    # + listing 20s ≈ 1960s ≈ 33 min, plus checkout and runner overhead. The job
    # ceiling has to be ABOVE that or the runner kills the driver mid-leg and
    # the run reports a timeout for work the runner never let finish. NOTE the
    # ceiling does NOT remove `driver_timeout`: the server-side sweep takes
    # ≈19-34 min (a later run's `last_sweep_at` records the posting run's START, and
    # the delta between consecutive runs' stamps is one interval, so the duration is
    # inferred from the gap between a POST and the next stamped value), so a 1500s
    # client will still occasionally give up. That is WHY the script gates
    # a timeout on completion age instead of reding on it.
    timeout-minutes: 45
    env:
      INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
      FASTAPI_INTERNAL_KEY: ${{ secrets.FASTAPI_INTERNAL_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_REPO: daniel-ospina/tortoise
      # Review finding (Config/R2b): Actions does NOT export GITHUB_TOKEN into
      # step envs — the `permissions: issues: write` grant was dead because the
      # driver read an empty GH_TOKEN and every incident POST/close 401'd, so
      # the "loud" channel silently filed nothing.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKUP_STALE_THRESHOLD_MIN: "90"
      BACKUP_DRIVER_DOWN_THRESHOLD_MIN: "240"
      # #3146 review P2: Actions passes ONLY what is enumerated here, so the
      # recovery-window knobs the runbook documents were unreachable in
      # production (the driver's only caller is this job). Bind all three as
      # repository VARIABLES (Settings → Secrets and variables → Actions →
      # Variables, not Secrets) — an unset variable expands to the empty
      # string, which `recovery_streak_for` treats as "no override", so the
      # declared window stands until an operator deliberately sets one.
      #   ALERT_RECOVERY_STREAK=1     → the fleet-wide "clear now" lever
      #   ALERT_RECOVERY_STREAKS=…    → per-kind windows
      #   BACKUP_POOL_RESOLVE_STREAK  → the legacy POOL_STALE-only alias
      ALERT_RECOVERY_STREAK: ${{ vars.ALERT_RECOVERY_STREAK }}
      ALERT_RECOVERY_STREAKS: ${{ vars.ALERT_RECOVERY_STREAKS }}
      BACKUP_POOL_RESOLVE_STREAK: ${{ vars.BACKUP_POOL_RESOLVE_STREAK }}
      # #10234 review P2: bind the sweep ceiling, or the knob is unreachable from
      # its only caller (Actions passes ONLY what is enumerated here — the same
      # lesson as the recovery-window knobs above, #3146). An unset variable
      # expands to the empty string, which the script's `:-1500` default
      # handles, so leaving it unset keeps the derived value.
      SWEEP_TIMEOUT_S: ${{ vars.SWEEP_TIMEOUT_S }}
    steps:
      - uses: actions/checkout@v4
      - name: Run backup driver
        run: bash .github/scripts/registry-cron.sh
        env:
          SIMULATE_APP_DOWN: ${{ inputs.simulate_app_down }}
