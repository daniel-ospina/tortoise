name: registry-backup-cron

# Per-team knowledge-graph backup driver (#596). External driver with an
# independent failure domain: an OOM crash-loop (#545) or a silently skipped
# workflow must not blind the pipeline — the driver's DIRECT R2 freshness
# check (aws CLI) covers the app-down leg, and the in-process staleness
# daemon (driver-disabled leg) covers this workflow being disabled.

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off top-of-hour (GH jitter absorbed by thresholds)
  workflow_dispatch:
    inputs:
      run_now:
        type: boolean
        description: Run the sweep now (staging/ops)
        default: false
      simulate_app_down:
        type: boolean
        description: Point the pre-flight at a dead URL (staging E2E)
        default: false

permissions:
  contents: read
  issues: write          # GITHUB_TOKEN files/closes APP_DOWN etc.; no PAT on GH

concurrency:
  group: registry-backup
  cancel-in-progress: false   # scheduled runs never overlap

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
      FASTAPI_INTERNAL_KEY: ${{ secrets.FASTAPI_INTERNAL_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_REPO: daniel-ospina/tortoise
      BACKUP_STALE_THRESHOLD_MIN: "90"
      BACKUP_DRIVER_DOWN_THRESHOLD_MIN: "240"
    steps:
      - uses: actions/checkout@v4
      - name: Run backup driver
        run: bash .github/scripts/registry-cron.sh
        env:
          SIMULATE_APP_DOWN: ${{ inputs.simulate_app_down }}
