        run: bash .github/scripts/registry-cron.test.sh

  ai-review-gate-tests:
    needs: changes
    if: needs.changes.outputs.ai_review_gate == 'true'  # #2982: gate workflow/harness only
    # #2982: the ai-review-gate's evidence-validation shell logic runs inline
    # in the workflow (that workflow has no checkout step, so it cannot
    # reference a repo script). This
    # harness extracts that run block and drives it with fabricated signed
    # markers + a stubbed gh, covering sha-match, diff-match, backward compat,
    # fail-closed-on-API-failure, signature-over-diff, PR/repo binding, and the
    # PR-body source. It ALSO asserts the non-runtime invariants the required
    # job depends on: no if:/needs:/continue-on-error:, trigger stays
    # pull_request_target with no paths: filter, permissions keep
    # pull-requests: read, and GH_TOKEN is declared. Self-contained, no
    # network, no secrets.
    #
    # ⚠️ This job is NOT a required status check: a red harness does not block a
    # merge, so a regression here can land and then silently make the REQUIRED
    # `ai-review-gate` check pass without evaluating evidence. Tracked in #3091
    # (add this job to branch protection, or move the harness into an
    # always-run required job). The `if:` above is a complete per-surface guard:
    # it fires on any change to the gate workflow, this harness, or ci.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AI review gate shell harness (#2982)
        run: bash .github/scripts/ai-review-gate.test.sh

  availability-watchdog:
    needs: changes
    if: needs.changes.outputs.watchdog_scripts == 'true'  # #2850: monitor-script surfaces only
    # Monitor-script harnesses. Both are self-contained: stubs curl/gh/flyctl,
    # no network. Mirrors backup-driver-scripts (#2796).
    #   * the availability probe's state machine — verdict classification, issue
    #     dedupe (#2706 class), restart cooldown/velocity cap, drill disarm,
    #     public-body redaction (#2850);
    #   * the welcome-e2e auto-file monitor — machine-author dedupe and the
    #     forged-title hijack guard (#3064 review).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Availability watchdog state machine (#2850)
        run: bash .github/scripts/availability-watchdog.test.sh
      - name: Welcome-e2e auto-file monitor (#2706/#2850)
        run: bash .github/scripts/welcome-e2e-monitor.test.sh
      - name: Shared auto-file substrate (#3907)
        # One issue per finding, with every occurrence recorded on it: files
