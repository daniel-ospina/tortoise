name: CI
# Mixed CI: repo-local checks (self-contained, #555) + agent-infra reusable
# workflows pinned to semver tags (#303, #387). The `scripts/` symlink stays
# repo-local-independent (machine-local path, unverifiable on the runner) —
# the agent-infra node-ci script-validate/skill-lint gates are therefore
# skipped here (python-ci.yml carries the stack gates instead).

on:
  pull_request:

jobs:
  # #2149 (ci-audit F3): path-gate the NON-required jobs. `changes` is a
  # cheap changed-files selector (the python-ci.yml `changes` pattern) that
  # emits per-surface booleans; each gated job below adds
  # `needs: changes` + `if:` on its surface. The 5 branch-protection REQUIRED
  # checks (pricing-artifact, docs, test-isolation, license-surface,
  # legal-e2e) deliberately keep NO needs/if — a SKIPPED required job reports
  # as Success and would silently pass the required check (the ai-review-gate
  # trap, #2055). Fail-closed on detection: an empty/erroneous diff emits ALL
  # surfaces true so every gated job runs — never a silent coverage loss.
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.gate.outputs.migrations }}
      dashboard: ${{ steps.gate.outputs.dashboard }}
      uv_lock: ${{ steps.gate.outputs.uv_lock }}
      entrypoints: ${{ steps.gate.outputs.entrypoints }}
      client: ${{ steps.gate.outputs.client }}
      packaging: ${{ steps.gate.outputs.packaging }}
      website: ${{ steps.gate.outputs.website }}
      hosted: ${{ steps.gate.outputs.hosted }}
      flip: ${{ steps.gate.outputs.flip }}
      python: ${{ steps.gate.outputs.python }}
      drift: ${{ steps.gate.outputs.drift }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PR base SHA must be present for the diff
      - name: Compute per-surface path gates (#2149)
        id: gate
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="origin/main"
          CHANGED=$(git diff --name-only "$BASE...HEAD" 2>/dev/null || true)
          echo "changed files vs $BASE:"
          echo "$CHANGED"
          cat > /tmp/ci-gates.py <<'PY'
          import sys

          out = sys.argv[1]
          files = [ln.strip() for ln in sys.stdin if ln.strip()]

          def startswith(p):
              return lambda f: f.startswith(p)

          def isfile(*names):
              return lambda f: f in names

          def endswith(s):
              return lambda f: f.endswith(s)

          def any_file(*preds):
              return any(any(p(f) for p in preds) for f in files)

          # Surface -> predicates over changed paths. A key is true when ANY
          # changed file can affect the job(s) it gates (issue #2149 / audit
          # F3). Keep in sync with the per-job `if:`s below.
          gates = {
              # migration-unique-prefix / migration-append-only
              "migrations": any_file(
                  startswith("supabase/migrations/"),
                  startswith(".github/scripts/check-migration-"),
              ),
              # dashboard-js-tests (agent-infra node-ci in website/apps/dashboard)
              "dashboard": any_file(
                  startswith("website/apps/dashboard/"),
              ),
              # uv-lock-check
              "uv_lock": any_file(
                  isfile("pyproject.toml", "uv.lock"),
              ),
              # entrypoint-guards (runs entrypoint.sh via .ci-checks script)
              "entrypoints": any_file(
                  isfile("entrypoint.sh", ".ci-checks/check-entrypoint-guards.sh"),
              ),
              # client-build (wheel staged from client/ + the 3 canonical
              # shared modules build_client.sh copies into the wheel)
              "client": any_file(
                  startswith("client/"),
                  isfile("tortoise/mcp_client.py", "tortoise/config.py",
                         "tortoise/exceptions.py"),
              ),
              # packaging-smoke (wheel/sdist pack catalog + doc-consistency).
              # Pack SOURCE is the root packs/ tree (pyproject maps
              # tortoise.packs = packs); tortoise/packs/__init__.py is the
              # discovery stub the sdist gate checks. #2160 review P2-1:
              # was startswith("tortoise/packs/") only — a packs/** change
              # silently skipped the wheel gate that guards it.
              "packaging": any_file(
                  isfile("pyproject.toml", "MANIFEST.in",
                         "tortoise/pack_registry.py", "tortoise/pack_state.py",
                         "tests/sample_transcript.txt",
                         "docs/EXPANSION_PACKS.md",
                         "docs/quickstart-selfhosted.md",
                         "docs/quickstart-cloud.md"),
                  startswith("tortoise/packs/"),
                  startswith("packs/"),
              ),
              # welcome-e2e (wrangler preview of website/ + mocked playwright
              # + the two edge-function node harnesses). Separate-app changes
              # under website/apps/ do NOT trigger it — dashboard-js-tests
              # covers dashboard; blog-admin has no gated suite. (#2160 P3-1:
              # excluded website/apps/ wholesale, not dashboard only.)
              "website": any_file(
                  lambda f: f.startswith("website/")
                  and not f.startswith("website/apps/"),
                  isfile("tests/e2e/test_welcome_page.py", "tests/e2e/conftest.py",
                         "tests/test_waitlist_subscribe.mjs",
                         "tests/test_tenant_provision_cors.mjs"),
                  startswith("supabase/functions/waitlist-subscribe/"),
                  startswith("supabase/functions/tenant-provision/"),
                  startswith("supabase/functions/_shared/"),
              ),
              # hosted-e2e (boots uvicorn tortoise.hosted_api:app; engine
              # surface = the python-ci 'api' source set it exercises PLUS
              # hosted_api's module-load import graph — #2160 review P2-2:
              # hosted_api imports abuse/analytics/audit_events/auth/
              # hosted_backup/mcp_server/onboarding/projection/schemas/sdk/
              # security at import time (+ pricing.tier_limits in body), so a
              # change to any of those gets unit coverage but would never
              # boot the artifact if gated on the old 4-module list. Keep the
              # list in sync with hosted_api.py's imports; a miss only skips
              # the boot suite (unit coverage still runs).
              "hosted": any_file(
                  startswith("tests/e2e/hosted/"),
                  isfile("tortoise/hosted_api.py", "tortoise/session_auth.py",
                         "tortoise/quota.py", "tortoise/metering.py",
                         "tortoise/supabase_control.py", "tortoise/selfhost_api.py",
                         "tortoise/selfhost.py", "tortoise/mcp_auth.py",
                         "tortoise/transport.py",
                         "tortoise/abuse.py", "tortoise/analytics.py",
                         "tortoise/audit_events.py", "tortoise/auth.py",
                         "tortoise/hosted_backup.py", "tortoise/security.py",
                         "tortoise/pricing.py", "tortoise/billing.py",
                         "tortoise/onboarding.py", "tortoise/mcp_server.py",
                         "tortoise/projection.py", "tortoise/schemas.py",
                         "tortoise/sdk.py", "tests/e2e/conftest.py"),
              ),
              # flip-gate (.github/scripts/verify-cutover* + supabase surface
              # + the exact pytest legs the script runs)
              "flip": any_file(
                  startswith("supabase/"),
                  startswith(".github/scripts/verify-cutover"),
                  isfile("tests/test_writer_inventory.py", "tests/test_auth_flip.py",
                         "tests/test_supabase_control.py",
                         "tests/test_onboarding_health_flip.py",
                         "tests/test_agent_signup.py", "tests/test_backup_sweep.py",
                         "tests/test_backup_watcher.py", "tests/test_audit_events.py",
                         "tests/test_provisioning_edge_function.py",
                         "tests/test_flip_gate.py"),
              ),
              # agent-infra-ci (ruff check . + mypy tortoise/ — any .py
              # change, lint/typecheck config, or workflow/skills surface)
              "python": any_file(
                  endswith(".py"),
                  isfile("pyproject.toml"),
                  startswith("skills/"),
                  startswith(".github/workflows/"),
              ),
              # drift-check (agent-infra check --ci: version pin, workflow
              # refs, symlinks, templates, AGENTS.md/.mcp.json/.husky)
              "drift": any_file(
                  isfile(".agent-infra-version", "AGENTS.md", ".mcp.json", "scripts"),
                  startswith(".github/workflows/"),
                  startswith(".husky/"),
                  startswith("scripts/"),
              ),
          }

          if not files:
              # Undeterminable diff (git error / empty base) — fail-closed:
              # run every gated job rather than silently dropping coverage.
              print("changes: no diff computed — all gates true (run everything)")
              gates = {k: True for k in gates}

          with open(out, "a") as f:
              for key, val in gates.items():
                  print(f"  {key}={'true' if val else 'false'}")
                  f.write(f"{key}={'true' if val else 'false'}\n")
          PY
          printf '%s\n' "$CHANGED" | python3 /tmp/ci-gates.py "$GITHUB_OUTPUT"
  # Migration invariants (#1095) — secret-free, fork-safe:
  #   migration-unique-prefix  — duplicate version prefixes / non-conforming
  #                              filenames (the 0012x2/0015x2 class that aborted
  #                              `db push` entirely, #1001 root cause)
  #   migration-append-only    — edits/renames/deletions of already-merged
  #                              migrations are rejected (a change to an applied
  #                              migration must be a NEW timestamp file).
  #                              #1235: when SUPABASE_ACCESS_TOKEN is available
  #                              (same-repo PRs), a PURE PREFIX RENAME of a
  #                              provably-unapplied migration is exempt; fork
  #                              PRs (no token) keep the strict block (fail-closed).
  # Both drive the shared .github/scripts/check-migration-append-only script so
  # tests exercise the shipped logic. fetch-depth: 0 is required for the base
  # SHA to be available to `git diff` (default checkout is depth 1).
  migration-unique-prefix:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'  # #2149: migrations surface only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration prefix invariants
        run: bash .github/scripts/check-migration-append-only prefix
  migration-append-only:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'  # #2149: migrations surface only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migrations are append-only
        run: bash .github/scripts/check-migration-append-only diff
        env:
          DRIFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # #1235: enables the unapplied-rename exception (same-repo PRs);
          # forks don't get secrets → strict block preserved (fail-closed).
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  pricing-artifact:
    # #682: canonical pricing must exist on main and stay in sync with the
    # tier_limits() table — a missing/renamed product/pricing.json fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (parity check imports tortoise.pricing)
        run: pip install -e . --quiet
      - name: pricing.json present
        run: test -f product/pricing.json || { echo "product/pricing.json missing — canonical pricing artifact (#682)"; exit 1; }
      - name: parity (billing table == pricing.json)
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, '.')
          from tortoise.pricing import tier_limits, all_tiers
          pricing = json.load(open('product/pricing.json'))['tiers']
          problems = []
          for tier in all_tiers():
              lim = tier_limits(tier)
              spec = pricing.get(tier, {})
              if lim['included_write_ops_per_month'] != spec.get('included_write_ops_per_month'):
                  problems.append(f"{tier}: tier_limits={lim['included_write_ops_per_month']} vs pricing.json={spec.get('included_write_ops_per_month')}")
              if lim['max_api_keys'] != spec.get('max_api_keys'):
                  problems.append(f"{tier}: max_api_keys={lim['max_api_keys']} vs pricing.json={spec.get('max_api_keys')}")
          if problems:
              print('PRICING DRIFT:', *problems, sep='\n  ')
              sys.exit(1)
          print('pricing parity OK')
          EOF

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get changed markdown files
        id: changed
        run: |
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.md' || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Markdownlint (changed files)
        if: steps.changed.outputs.files != ''
        run: npx markdownlint-cli ${{ steps.changed.outputs.files }}
      - name: Link check (changed files)
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress ${{ steps.changed.outputs.files }}

  dashboard-js-tests:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'  # #2149: website/apps/dashboard/** only
    # #1894/#387: the dashboard's pure-derivation + CSS-rule test suite (node
    # --test, zero deps) now runs via the agent-infra reusable unit-test
    # capability (node-ci.yml@v0.1.2) — the migration target of #387.
    # script-validate/skill-lint skipped: tortoise's scripts/ symlink is
    # machine-local (broken on the runner) and there is no
    # scripts/check-skill-lint.mjs (un-bootstrapped) — the stack gates live
    # in python-ci.yml.
    uses: daniel-ospina/agent-infra/.github/workflows/node-ci.yml@v0.1.2
    with:
      node-version: '22'
      working-directory: website/apps/dashboard
      test-glob: 'src/*.test.js'
      script-validate: false
      skill-lint: false
    secrets: inherit

  uv-lock-check:
    needs: changes
    if: needs.changes.outputs.uv_lock == 'true'  # #2149: pyproject.toml / uv.lock only
    # #493: the committed uv.lock is the dev-environment source of truth —
    # gate on lockfile/pyproject drift. The suite itself runs in the
    # dedicated python-ci.yml workflow (pip); this job enforces the uv lock
    # contract so the lockfile never silently drifts again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          # Pin the uv version that generated uv.lock — a patch bump (e.g.
          # 0.12.2 → 0.12.3) can flag the lock as stale under --check.
          version: '0.12.3'
      - name: Lockfile coherence check (uv.lock vs pyproject.toml)
        # #1917 (CI unblock): stale workspace .venv on some ubuntu-latest
        # runner images makes uv fail with "failed to create directory
        # .venv: File exists" (uv #13986/#9423) — clear it so uv recreates.
        run: |
          rm -rf .venv
          uv lock --check
      - name: Frozen sync (dev group)
        run: uv sync --frozen --group dev
      - name: Dev-group collection check
        # Cheap (no servers): proves the dev group is sufficient for the
        # suite's imports, so `uv run pytest` cannot silently drift from
        # the pip CI path (#493).
        run: uv run pytest tests/ --collect-only -q --ignore=tests/e2e

  test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test isolation (repo-local lint)
        run: bash .ci-checks/check-test-isolation.sh

  entrypoint-guards:
    needs: changes
    if: needs.changes.outputs.entrypoints == 'true'  # #2149: entrypoint.sh / its .ci-checks script only
    # #1349 T11: the hosted entrypoint's guard contracts — env-reject of the
    # benchmark-only TORTOISE_EMBEDDER_OVERRIDE seam + missing-cache FATAL —
    # are shell-level and untestable from pytest. Matches the test-isolation
    # pattern: repo-local script, no setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check entrypoint guards (env-reject + missing-cache FATAL)
        run: bash .ci-checks/check-entrypoint-guards.sh

  license-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license surface consistency (BSL 1.1 + $5M AUG, 4 files)
        run: python3 validation/check-license-surface.py
      - name: Service-first gate — no consumer import instruction in README
        run: |
          if grep -nE "(from tortoise|import tortoise)" README.md; then
            echo "::error::README must not instruct importing tortoise — connect, don't import (service model)"
            exit 1
          fi
          echo "service-first gate OK"

  client-build:
    needs: changes
    if: needs.changes.outputs.client == 'true'  # #2149: client/ + the 3 shared modules in the wheel
    # #526: the thin-client boundary must hold on EVERY PR — build the
    # tortoise-client wheel, run the acceptance gate in a clean venv (driver
    # imports, engine modules raise ImportError, no engine deps installed),
    # and prove the wheel contains no engine modules. A future engine change
    # leaking into the client dist fails here, not at release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build
      - name: Build the client wheel + sdist (Prefect-pattern staging)
        run: bash client/build_client.sh
      - name: Wheel content check — whitelist (thin driver only)
        run: |
          # Whitelist (PR #1313 conf 88): ANY tortoise/ entry outside the
          # client module set is rejected — including package dirs (e.g.
          # tortoise/projection/__init__.py) and new engine modules. Must
          # stay in sync with verify_client.sh Gate 0.
          BAD="$(unzip -Z1 dist-client/*.whl | grep -E '^(tortoise|tortoise_client)/' | \
            grep -vE '^tortoise/(__init__|mcp_client|config|exceptions)\.py$' | \
            grep -vE '^tortoise_client/(__init__|__main__|cli)\.py$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::non-client entries leaked into the tortoise-client wheel:"
            echo "$BAD"
            exit 1
          fi
          unzip -Z1 dist-client/*.whl | grep -E '^(tortoise|tortoise_client)/'
          echo "wheel content OK — thin driver only"
      - name: Acceptance gate (clean venv, client only)
        run: bash client/verify_client.sh

  packaging-smoke:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'  # #2149: packaging / pack-catalog / pack-docs surfaces
    # #1929 (epic #1891 slice 1): per-PR G1 regression guard — the built
    # wheel must ship the pack catalog (surface 1) and a clean-venv install
    # must load the full starter set from the installed location. The
    # publish-time smokes (publish-pypi / publish-selfhost / deploy-hosted)
    # are the REQUIRED publish gates; this job gives fast PR feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build==1.6.0   # pinned (#1685 convention — a build-frontend
        # bump must not silently change the wheel content this job asserts on)
      - name: Build wheel + sdist
        run: python -m build
      - name: Wheel content check — tortoise/packs shipped
        run: |
          MANIFEST_COUNT="$(unzip -Z1 dist/*.whl | grep -cE '^tortoise/packs/[^/]+/manifest\.yaml$' || true)"
          [ "$MANIFEST_COUNT" -ge 1 ] || { echo "::error::wheel ships no pack manifests"; unzip -Z1 dist/*.whl | grep tortoise/packs || true; exit 1; }
          tar tzf dist/*.tar.gz | grep -q 'tortoise/packs/__init__.py' \
            || { echo "::error::sdist missing tortoise/packs/__init__.py (MANIFEST.in)"; exit 1; }
          echo "wheel/sdist pack content OK"
      - name: Clean-venv pack smoke (bound derived from installed constant)
        run: |
          python -m venv /tmp/packsmoke
          /tmp/packsmoke/bin/pip install dist/*.whl --quiet
          cd /tmp && /tmp/packsmoke/bin/python - <<'EOF'
          from pathlib import Path
          import tortoise
          from tortoise.pack_registry import PackRegistry
          from tortoise.pack_state import DEFAULT_STARTER_PACKS
          packaged = Path(tortoise.__file__).resolve().parent / "packs"
          reg = PackRegistry(packaged)
          n = reg.load_all()
          bound = len(DEFAULT_STARTER_PACKS)
          assert n >= bound, f"wheel ships {n} packs < starter {bound}"
          assert set(reg.packs) >= set(DEFAULT_STARTER_PACKS), "wrong pack set"
          t = Path(tortoise.__file__).resolve().parent.parent / "tests" / "sample_transcript.txt"
          assert t.exists(), "sample transcript missing"
          print(f"per-PR wheel pack smoke OK: {n} >= {bound}")
          EOF
      - name: Doc-consistency check (#1932 / epic #1891 R11)
        # Authoring docs must not drift from the manifest schema: the guide's
        # required sections exist, both quickstarts reference packs, and the
        # links resolve (dead link → fail). <2s, fail-closed.
        run: |
          for sec in "What is an expansion pack" "The enforcement ladder" "Chains" "Testing a pack"; do
            grep -q "$sec" docs/EXPANSION_PACKS.md || { echo "::error::EXPANSION_PACKS.md missing section: $sec"; exit 1; }
          done
          for qs in docs/quickstart-selfhosted.md docs/quickstart-cloud.md; do
            grep -q "EXPANSION_PACKS.md" "$qs" || { echo "::error::$qs missing pack reference"; exit 1; }
          done
          test -f docs/EXPANSION_PACKS.md || { echo "::error::EXPANSION_PACKS.md missing"; exit 1; }
          echo "doc-consistency OK"

  welcome-e2e:
    needs: changes
    if: needs.changes.outputs.website == 'true'  # #2149: website/ (minus dashboard app) + welcome/edge-fn tests
    runs-on: ubuntu-latest
    # Mocked welcome-page suite (#541) — secret-free per-PR coverage against
    # the LIVE page (Supabase calls mocked via Playwright routes). The #801
    # live signup smoke self-skips without SUPABASE secrets and runs in
    # welcome-e2e-monitor.yml (scheduled + on-merge). Restored per-PR after
    # #1189: the botched #1181 merge wrapped this job in conflict markers
    # (empty HEAD side); #1181's monitor move had dropped per-PR coverage of
    # the mocked welcome flows (the python matrix excludes tests/e2e/).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # --experimental-strip-types needs >= 22.6 (#373 harness)
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      # #1511: serve THIS branch's website/ (wrangler pages dev, mirroring the
      # legal-e2e job) instead of the LIVE page — the strict-validity gates,
      # the provision-401 clear→/auth path and the waitForSession validity
      # check land in this PR and only exist in the deployed page AFTER merge.
      - name: Start wrangler pages dev preview (website/ = Pages root)
        run: |
          cd website
          npx --yes wrangler@4 pages dev . --port 8788 --ip 127.0.0.1 \
            --compatibility-date=2024-09-23 \
            > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null 2>&1; then
              echo "wrangler dev ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::wrangler dev server failed to start"
          tail -50 /tmp/wrangler.log || true
          exit 1
      - name: Run welcome page E2E (mocked against the local preview) (#373/#1511)
        run: python -m pytest tests/e2e/test_welcome_page.py -q -rs -p no:cacheprovider
        env:
          WELCOME_URL: http://127.0.0.1:8788/welcome
          # Epic #1647 Task 10 (P4): this job runs pytest URI-less BY DESIGN
          # (the e2e surface needs no FalkorDB server) — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
      - name: Run waitlist edge-function behavioral harness (#373)
        run: node --experimental-strip-types tests/test_waitlist_subscribe.mjs
      - name: Run tenant-provision CORS runtime harness (#1110)
        run: node --experimental-strip-types tests/test_tenant_provision_cors.mjs

  legal-e2e:
    runs-on: ubuntu-latest
    # Full legal-page suite (#657) — ~1000 assertions across 10 plan checks
    # (privacy/tos/license/dpa content, consent + pricing content, mocked
    # signup/signin flows, mobile render, full link crawl). The suite is
    # opt-in via RUN_LEGAL_E2E=1 (module-level skip otherwise) and had NO
    # workflow setting it — this job is the automation (#747).
    #
    # Runs against a LOCAL `wrangler pages dev` preview of website/ — no
    # production URLs, no secrets. The harness's own canary
    # (_tortoise_emulated_locally) decides whether the Host-spoofed
    # tortoise.* checks actually run or defer (skip = green-with-annotation,
    # workers-sdk#165); TORTISE_HOST_CHECK=1 opts into that canary.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Install the package (pulls falkordblite/redislite needed by
      # tortoise/__init__) + the e2e test extras (playwright, pytest-playwright).
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Start wrangler pages dev preview (website/ = Pages root)
        run: |
          cd website
          # --compatibility-date pinned: wrangler defaults to "today", but the
          # bundled workerd lags a day behind (max date < today) → dev server
          # fails to start. Any stable date ≤ workerd's max works; the
          # middleware uses only stable APIs (next()/ASSETS.fetch).
          npx --yes wrangler@4 pages dev . --port 8788 --ip 127.0.0.1 \
            --compatibility-date=2024-09-23 \
            > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          # Wait for the dev server to accept connections (first start also
          # downloads workerd + bundles website/functions/_middleware.ts).
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null 2>&1; then
              echo "wrangler dev ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::wrangler dev server failed to start"
          tail -50 /tmp/wrangler.log || true
          exit 1
      - name: Run legal pages E2E suite (#657)
        # LEGAL_E2E_SKIP_EXTERNAL_CRAWL=1: the third-party external-link
        # crawl fetches unauthenticated production URLs (github.com/LICENSE,
        # …) that rate-limit shared CI runner IPs (429 outlives the test's
        # single retry) → nondeterministic gate. Skip-with-annotation, same
        # pattern as the tortoise-host deferral; full crawl runs locally.
        # test_signup_form_safety_e2e.py joined here (#801): same module-level
        # RUN_LEGAL_E2E gate, same wrangler dev server; it ran nowhere in CI
        # before (welcome-e2e collects it without RUN_LEGAL_E2E → self-skips).
        run: >
          RUN_LEGAL_E2E=1 BASE_URL=http://127.0.0.1:8788
          TORTISE_HOST=http://127.0.0.1:8788 TORTISE_HOST_CHECK=1
          LEGAL_E2E_SKIP_EXTERNAL_CRAWL=1
          python -m pytest tests/e2e/test_legal_pages.py tests/e2e/test_signup_form_safety_e2e.py
          -q -p no:cacheprovider
        env:
          # Epic #1647 Task 10 (P4): URI-less e2e surface — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
      - name: Stop wrangler dev server
        if: always()
        # kill npx + its wrangler/workerd children (each job gets its own
        # runner VM, so pkill can't touch other jobs)
        run: |
          kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
          pkill -f 'wrangler.*8788' 2>/dev/null || true
          pkill workerd 2>/dev/null || true
          true

  hosted-e2e:
    needs: changes
    if: needs.changes.outputs.hosted == 'true'  # #2149: tests/e2e/hosted/ + the hosted api-surface modules
    # #303: the 12-case hosted-platform E2E suite (tests/e2e/hosted/). Boots
    # the REAL deployment artifact (uvicorn tortoise.hosted_api:app) on
    # embedded FalkorDBLite inside the test session — zero secrets, no
    # Docker, no browser binaries (pytest-playwright APIRequestContext only,
    # so NO `playwright install` step — the suite is HTTP-level; a browser
    # leg would add ~4m of setup for zero current coverage).
    # Hermetic seams: TORTOISE_BACKUP_STORAGE=memory (backups), fixture
    # pricing via TORTOISE_PRICING_PATH, self-signed Stripe webhooks against
    # a local secret (tier bump without Stripe network), local JWKS mock +
    # minted ES256 JWTs (session-auth plane). Suite self-boots the server
    # (fixture), so the job is one pytest invocation — legal-e2e pattern
    # minus the external-server step. Measured locally: ~60-120s suite.
    runs-on: ubuntu-latest
    concurrency:
      # #2108: the former repo-global `group: hosted-e2e` +
      # cancel-in-progress: true killed in-flight hosted-e2e runs whenever a
      # DIFFERENT PR's run entered the group (observed 2026-09-01: three
      # cross-PR cancels in 7 min, each logged as a bogus "startup hang with
      # zero test output" — the victim was healthy, just cancelled mid-boot).
      # Key per event+ref (python-ci.yml precedent): on pull_request
      # github.ref is refs/pull/N/merge, so a new commit cancels only that
      # PR's stale run. ci.yml is pull_request-only today, so the group is
      # strictly per-PR; the event_name dimension + conditional cancel
      # mirror python-ci.yml and stay correct if a push/schedule trigger is
      # ever added.
      group: hosted-e2e-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Package + e2e extras (pytest-playwright, cryptography for the JWKS
      # mint). No chromium: APIRequestContext needs no browser binaries.
      - run: pip install -e '.[test]'
      - name: Run hosted platform E2E suite (#303)
        run: |
          set -o pipefail
          # #2108: --capture=sys (not the default fd capture) so the fixture's
          # boot-progress heartbeats (os.write(2, ...) — see conftest _live)
          # reach the job log live; PYTHONUNBUFFERED (step env below) so
          # pytest's -q dots stream instead of flushing at process exit.
          RUN_HOSTED_E2E=1 python -m pytest tests/e2e/hosted/ \
            -q -rs -p no:cacheprovider --durations=10 --capture=sys 2>&1 | tee /tmp/hosted-e2e.log
          # Loud-warning monitor (output-parse — NOT the #801 env-check
          # pattern, which is collect-only-safe; here we parse the run log):
          # this job ALWAYS sets the gate, so zero passed tests means the
          # suite skipped out or failed collection — surface it, don't certify.
          if ! grep -qE "[1-9][0-9]* passed" /tmp/hosted-e2e.log; then
            echo "::warning::hosted E2E certified NOTHING — no passed tests in the run"
          fi
        env:
          # Epic #1647 Task 10 (P4): the hosted-e2e lane runs pytest URI-less
          # BY DESIGN (it boots embedded selfhost daemons; the docker lane
          # redirect would void the parity assertions) — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
          # #2108: pytest -q progress dots sit in Python's block buffer when
          # stdout is a pipe (the tee below) — a healthy run emitted ZERO job
          # output for its whole ~2 min (boot + 54 tests), flushing only at
          # process exit. That reads as a hang and invited premature cancels.
          # Unbuffered → dots stream live as tests complete (the boot phase
          # is heartbeat-visible from the suite fixture — see conftest _live).
          PYTHONUNBUFFERED: "1"

  flip-gate:
    needs: changes
    if: needs.changes.outputs.flip == 'true'  # #2149: supabase/ + verify-cutover* + its pytest legs
    # #669 pre-deploy cutover gate (plan Task 10.1, issue #771) — the gate
    # that MUST PASS before the single-deploy flip. Runs the local/CI
    # equivalence of the operator's live gate: FalkorDBLite + the seam fakes
    # (zero network, no Docker — the plan's `local supabase start` leg maps
    # to the seam-fake + embedded-DB equivalence, documented in
    # .github/scripts/verify-cutover). The operator additionally runs
    # `bash .github/scripts/verify-cutover --live` with prod creds right
    # before dispatching the flip (sequence in supabase-deploy.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # tenant-provision TS-parse guard (#770)
      - run: pip install -e '.[test]'
      - name: Run the #669 pre-deploy flip gate
        env:
          # Epic #1647 P4: the flip-gate pytest legs run URI-less by design
          # (FalkorDBLite + seam fakes — the pre-flip local/CI equivalence,
          # documented in verify-cutover's header) — the P4 URI-required
          # enforcement opt-in, same as hosted-e2e.
          TORTOISE_TEST_CARVE_OUT: "1"
        run: bash .github/scripts/verify-cutover

  agent-infra-ci:
    needs: changes
    if: needs.changes.outputs.python == 'true'  # #2149: any .py / pyproject / skills / workflows
    # #303 — generic stack CI from agent-infra reusable workflows, pinned to a
    # semver tag (@v0.1.2). Bump = tag + manifest ci.ref edit; agent-infra
    # check blocks on a stale pin. GitHub Actions CANNOT parse symlinked
    # workflow files (#555), so the reusable workflow is a real committed file
    # in agent-infra/.github/workflows/python-ci.yml.
    #
    # Re-created after agent-infra went PUBLIC (was blocked: public repos
    # cannot call reusable workflows in private repos — #1494 revert). Now the
    # call resolves.
    #
    # Surface kept generic-only (D4): the heavy tiered test split stays local
    # in python-ci.yml (repo-specific strategy); migration guards, pricing,
    # client-build, e2e gates stay local siblings above.
    #   test-command: ''      — tests run in python-ci.yml (uv split)
    #   lint-command: full    — [tool.ruff] in pyproject.toml pins the rule
    #                           surface (E/F/B/UP/I/SIM/RUF, line-length 100);
    #                           the ~3.7k violation baseline is recorded as
    #                           per-line `# noqa` directives + the ignore list
    #                           (#1503, docs/lint-baseline-1503.md) so `ruff
    #                           check .` passes green and stays active for new
    #                           code. Previously narrowed to the syntax class
    #                           (E9/F63/F7) because no config existed.
    #   #1685: the baseline DRIFTED — the `pip install ruff` in the agent-infra
    #                           job is unpinned (drift vector); the baseline
    #                           never held at merge #1504 (369 violations hid
    #                           behind the narrowed lint), +104 drifted over 319
    #                           commits. Refreshed to 0 on 2026-08-25 (230 fixed
    #                           / 242 noqa'd under 0.16.4) AND pinned here:
    #                           the explicit-version pip install overrides the
    #                           unpinned job install in both directions.
    #   typecheck-command: full — [tool.mypy] in pyproject.toml (baseline via
    #                           disable_error_code, #1503); the command is
    #                           explicit because the workflow's package
    #                           auto-detect would pick `battery/` (first
    #                           top-level dir with __init__.py, sorted) — not
    #                           the engine. `mypy tortoise/` is what the
    #                           baseline was measured against.
    uses: daniel-ospina/agent-infra/.github/workflows/python-ci.yml@v0.1.2
    with:
      python-version: '3.12'
      test-command: ''
      lint-command: 'pip install ruff==0.16.4 && ruff check .'
      typecheck-command: 'mypy tortoise/'
    secrets: inherit

  drift-check:
    needs: changes
    if: needs.changes.outputs.drift == 'true'  # #2149: agent-infra pin surface (.agent-infra-version/workflows/symlinks)
    # #305/#387 — agent-infra drift gate: structural drift (version pin,
    # symlinks, missing templates, workflow refs vs manifest.check.ci.ref)
    # fails CI; content drift warns. Runs tiered via agent-infra check --ci.
    uses: daniel-ospina/agent-infra/.github/workflows/drift-check.yml@main
    secrets: inherit
