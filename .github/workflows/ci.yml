name: CI
# Self-contained CI (fix #555) — no reusable-workflow call (GitHub fails to
# parse agent-infra/docs-ci.yml@main: "error parsing called workflow") and no
# `scripts/` symlink (it resolves to a local agent-infra path, broken on the
# runner). All checks use repo-local scripts.

on:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get changed markdown files
        id: changed
        run: |
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.md' || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Markdownlint (changed files)
        if: steps.changed.outputs.files != ''
        run: npx markdownlint-cli ${{ steps.changed.outputs.files }}
      - name: Link check (changed files)
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress ${{ steps.changed.outputs.files }}

  python-tests:
    # Full Python suite, embedded FalkorDBLite (no Docker). uv is the
    # canonical dev package manager (#492): the committed uv.lock is the
    # enforcement loop, so `uv lock --check` + `uv sync --frozen` gate on
    # lockfile/pyproject drift and `uv run pytest` gates on the suite.
    # Self-contained (no reusable-workflow call — agent-infra@main calls
    # fail to parse on GitHub, fix #555). Replaces the dead python-ci.yml
    # symlink (agent-infra template is pip-based, Python 3.11 default;
    # tortoise requires >=3.12 — kept repo-local instead).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Lockfile coherence check (uv.lock vs pyproject.toml)
        run: uv lock --check
      - name: Install deps, frozen (dev group)
        run: uv sync --frozen --group dev
      - name: Run test suite (embedded FalkorDBLite)
        # E2E welcome/legal page tests run in the dedicated welcome-e2e job
        # (they need Playwright browsers); unit/integration suite here.
        run: uv run pytest tests/ --ignore=tests/e2e -x -q -p no:cacheprovider --timeout=120

  test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test isolation (repo-local lint)
        run: bash .ci-checks/check-test-isolation.sh

  license-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license surface consistency (BSL 1.1 + $5M AUG, 4 files)
        run: python3 validation/check-license-surface.py
      - name: Service-first gate — no consumer import instruction in README
        run: |
          if grep -nE "(from tortoise|import tortoise)" README.md; then
            echo "::error::README must not instruct importing tortoise — connect, don't import (service model)"
            exit 1
          fi
          echo "service-first gate OK"

  welcome-e2e:
    runs-on: ubuntu-latest
    # Playwright browser tests for the onboarding welcome page (#541).
    # Runs against the live prod page; Supabase-backed tests need
    # SUPABASE_URL/SUPABASE_SERVICE_KEY secrets (skipped without them).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Install the package (pulls falkordblite/redislite needed by tortoise/__init__)
      # + the e2e test extras.
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run welcome page E2E
        run: python -m pytest tests/e2e/ -q -p no:cacheprovider
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
