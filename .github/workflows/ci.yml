name: CI
# Self-contained CI (fix #555) — no reusable-workflow call (GitHub fails to
# parse agent-infra/docs-ci.yml@main: "error parsing called workflow") and no
# `scripts/` symlink (it resolves to a local agent-infra path, broken on the
# runner). All checks use repo-local scripts.

on:
  pull_request:

jobs:
  # Migration invariants (#1095) — secret-free, fork-safe:
  #   migration-unique-prefix  — duplicate version prefixes / non-conforming
  #                              filenames (the 0012x2/0015x2 class that aborted
  #                              `db push` entirely, #1001 root cause)
  #   migration-append-only    — edits/renames/deletions of already-merged
  #                              migrations are rejected (a change to an applied
  #                              migration must be a NEW timestamp file).
  #                              #1235: when SUPABASE_ACCESS_TOKEN is available
  #                              (same-repo PRs), a PURE PREFIX RENAME of a
  #                              provably-unapplied migration is exempt; fork
  #                              PRs (no token) keep the strict block (fail-closed).
  # Both drive the shared .github/scripts/check-migration-append-only script so
  # tests exercise the shipped logic. fetch-depth: 0 is required for the base
  # SHA to be available to `git diff` (default checkout is depth 1).
  migration-unique-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration prefix invariants
        run: bash .github/scripts/check-migration-append-only prefix
  migration-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migrations are append-only
        run: bash .github/scripts/check-migration-append-only diff
        env:
          DRIFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # #1235: enables the unapplied-rename exception (same-repo PRs);
          # forks don't get secrets → strict block preserved (fail-closed).
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  pricing-artifact:
    # #682: canonical pricing must exist on main and stay in sync with the
    # tier_limits() table — a missing/renamed product/pricing.json fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (parity check imports tortoise.pricing)
        run: pip install -e . --quiet
      - name: pricing.json present
        run: test -f product/pricing.json || { echo "product/pricing.json missing — canonical pricing artifact (#682)"; exit 1; }
      - name: parity (billing table == pricing.json)
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, '.')
          from tortoise.pricing import tier_limits, all_tiers
          pricing = json.load(open('product/pricing.json'))['tiers']
          problems = []
          for tier in all_tiers():
              lim = tier_limits(tier)
              spec = pricing.get(tier, {})
              if lim['included_write_ops_per_month'] != spec.get('included_write_ops_per_month'):
                  problems.append(f"{tier}: tier_limits={lim['included_write_ops_per_month']} vs pricing.json={spec.get('included_write_ops_per_month')}")
              if lim['max_api_keys'] != spec.get('max_api_keys'):
                  problems.append(f"{tier}: max_api_keys={lim['max_api_keys']} vs pricing.json={spec.get('max_api_keys')}")
          if problems:
              print('PRICING DRIFT:', *problems, sep='\n  ')
              sys.exit(1)
          print('pricing parity OK')
          EOF

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get changed markdown files
        id: changed
        run: |
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.md' || true)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Markdownlint (changed files)
        if: steps.changed.outputs.files != ''
        run: npx markdownlint-cli ${{ steps.changed.outputs.files }}
      - name: Link check (changed files)
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress ${{ steps.changed.outputs.files }}

  uv-lock-check:
    # #493: the committed uv.lock is the dev-environment source of truth —
    # gate on lockfile/pyproject drift. The suite itself runs in the
    # dedicated python-ci.yml workflow (pip); this job enforces the uv lock
    # contract so the lockfile never silently drifts again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          # Pin the uv version that generated uv.lock — a patch bump (e.g.
          # 0.12.2 → 0.12.3) can flag the lock as stale under --check.
          version: '0.12.3'
      - name: Lockfile coherence check (uv.lock vs pyproject.toml)
        run: uv lock --check
      - name: Frozen sync (dev group)
        run: uv sync --frozen --group dev
      - name: Dev-group collection check
        # Cheap (no servers): proves the dev group is sufficient for the
        # suite's imports, so `uv run pytest` cannot silently drift from
        # the pip CI path (#493).
        run: uv run pytest tests/ --collect-only -q --ignore=tests/e2e

  test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test isolation (repo-local lint)
        run: bash .ci-checks/check-test-isolation.sh

  license-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license surface consistency (BSL 1.1 + $5M AUG, 4 files)
        run: python3 validation/check-license-surface.py
      - name: Service-first gate — no consumer import instruction in README
        run: |
          if grep -nE "(from tortoise|import tortoise)" README.md; then
            echo "::error::README must not instruct importing tortoise — connect, don't import (service model)"
            exit 1
          fi
          echo "service-first gate OK"

  welcome-e2e:
    runs-on: ubuntu-latest
    # Mocked welcome-page suite (#541) — secret-free per-PR coverage against
    # the LIVE page (Supabase calls mocked via Playwright routes). The #801
    # live signup smoke self-skips without SUPABASE secrets and runs in
    # welcome-e2e-monitor.yml (scheduled + on-merge). Restored per-PR after
    # #1189: the botched #1181 merge wrapped this job in conflict markers
    # (empty HEAD side); #1181's monitor move had dropped per-PR coverage of
    # the mocked welcome flows (the python matrix excludes tests/e2e/).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # --experimental-strip-types needs >= 22.6 (#373 harness)
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run welcome page E2E (mocked; live smoke self-skips) (#373)
        run: python -m pytest tests/e2e/test_welcome_page.py -q -rs -p no:cacheprovider
      - name: Run waitlist edge-function behavioral harness (#373)
        run: node --experimental-strip-types tests/test_waitlist_subscribe.mjs
      - name: Run tenant-provision CORS runtime harness (#1110)
        run: node --experimental-strip-types tests/test_tenant_provision_cors.mjs

  legal-e2e:
    runs-on: ubuntu-latest
    # Full legal-page suite (#657) — ~1000 assertions across 10 plan checks
    # (privacy/tos/license/dpa content, consent + pricing content, mocked
    # signup/signin flows, mobile render, full link crawl). The suite is
    # opt-in via RUN_LEGAL_E2E=1 (module-level skip otherwise) and had NO
    # workflow setting it — this job is the automation (#747).
    #
    # Runs against a LOCAL `wrangler pages dev` preview of website/ — no
    # production URLs, no secrets. The harness's own canary
    # (_tortoise_emulated_locally) decides whether the Host-spoofed
    # tortoise.* checks actually run or defer (skip = green-with-annotation,
    # workers-sdk#165); TORTISE_HOST_CHECK=1 opts into that canary.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Install the package (pulls falkordblite/redislite needed by
      # tortoise/__init__) + the e2e test extras (playwright, pytest-playwright).
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Start wrangler pages dev preview (website/ = Pages root)
        run: |
          cd website
          # --compatibility-date pinned: wrangler defaults to "today", but the
          # bundled workerd lags a day behind (max date < today) → dev server
          # fails to start. Any stable date ≤ workerd's max works; the
          # middleware uses only stable APIs (next()/ASSETS.fetch).
          npx --yes wrangler@4 pages dev . --port 8788 --ip 127.0.0.1 \
            --compatibility-date=2024-09-23 \
            > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          # Wait for the dev server to accept connections (first start also
          # downloads workerd + bundles website/functions/_middleware.ts).
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null 2>&1; then
              echo "wrangler dev ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::wrangler dev server failed to start"
          tail -50 /tmp/wrangler.log || true
          exit 1
      - name: Run legal pages E2E suite (#657)
        # LEGAL_E2E_SKIP_EXTERNAL_CRAWL=1: the third-party external-link
        # crawl fetches unauthenticated production URLs (github.com/LICENSE,
        # …) that rate-limit shared CI runner IPs (429 outlives the test's
        # single retry) → nondeterministic gate. Skip-with-annotation, same
        # pattern as the tortoise-host deferral; full crawl runs locally.
        # test_signup_form_safety_e2e.py joined here (#801): same module-level
        # RUN_LEGAL_E2E gate, same wrangler dev server; it ran nowhere in CI
        # before (welcome-e2e collects it without RUN_LEGAL_E2E → self-skips).
        run: >
          RUN_LEGAL_E2E=1 BASE_URL=http://127.0.0.1:8788
          TORTISE_HOST=http://127.0.0.1:8788 TORTISE_HOST_CHECK=1
          LEGAL_E2E_SKIP_EXTERNAL_CRAWL=1
          python -m pytest tests/e2e/test_legal_pages.py tests/e2e/test_signup_form_safety_e2e.py
          -q -p no:cacheprovider
      - name: Stop wrangler dev server
        if: always()
        # kill npx + its wrangler/workerd children (each job gets its own
        # runner VM, so pkill can't touch other jobs)
        run: |
          kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
          pkill -f 'wrangler.*8788' 2>/dev/null || true
          pkill workerd 2>/dev/null || true
          true

  hosted-e2e:
    # #303: the 12-case hosted-platform E2E suite (tests/e2e/hosted/). Boots
    # the REAL deployment artifact (uvicorn tortoise.hosted_api:app) on
    # embedded FalkorDBLite inside the test session — zero secrets, no
    # Docker, no browser binaries (pytest-playwright APIRequestContext only,
    # so NO `playwright install` step — the suite is HTTP-level; a browser
    # leg would add ~4m of setup for zero current coverage).
    # Hermetic seams: TORTOISE_BACKUP_STORAGE=memory (backups), fixture
    # pricing via TORTOISE_PRICING_PATH, self-signed Stripe webhooks against
    # a local secret (tier bump without Stripe network), local JWKS mock +
    # minted RS256 JWTs (session-auth plane). Suite self-boots the server
    # (fixture), so the job is one pytest invocation — legal-e2e pattern
    # minus the external-server step. Measured locally: ~60-120s suite.
    runs-on: ubuntu-latest
    concurrency:
      group: hosted-e2e
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Package + e2e extras (pytest-playwright, cryptography for the JWKS
      # mint). No chromium: APIRequestContext needs no browser binaries.
      - run: pip install -e '.[test]'
      - name: Run hosted platform E2E suite (#303)
        run: |
          set -o pipefail
          RUN_HOSTED_E2E=1 python -m pytest tests/e2e/hosted/ \
            -q -rs -p no:cacheprovider --durations=10 2>&1 | tee /tmp/hosted-e2e.log
          # Loud-warning monitor (output-parse — NOT the #801 env-check
          # pattern, which is collect-only-safe; here we parse the run log):
          # this job ALWAYS sets the gate, so zero passed tests means the
          # suite skipped out or failed collection — surface it, don't certify.
          if ! grep -qE "[1-9][0-9]* passed" /tmp/hosted-e2e.log; then
            echo "::warning::hosted E2E certified NOTHING — no passed tests in the run"
          fi

  flip-gate:
    # #669 pre-deploy cutover gate (plan Task 10.1, issue #771) — the gate
    # that MUST PASS before the single-deploy flip. Runs the local/CI
    # equivalence of the operator's live gate: FalkorDBLite + the seam fakes
    # (zero network, no Docker — the plan's `local supabase start` leg maps
    # to the seam-fake + embedded-DB equivalence, documented in
    # .github/scripts/verify-cutover). The operator additionally runs
    # `bash .github/scripts/verify-cutover --live` with prod creds right
    # before dispatching the flip (sequence in supabase-deploy.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # tenant-provision TS-parse guard (#770)
      - run: pip install -e '.[test]'
      - name: Run the #669 pre-deploy flip gate
        run: bash .github/scripts/verify-cutover
