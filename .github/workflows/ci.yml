name: CI
# Mixed CI: repo-local checks (self-contained, #555) + agent-infra reusable
# workflows pinned to semver tags (#303, #387). The `scripts/` symlink stays
# repo-local-independent (machine-local path, unverifiable on the runner) —
# the agent-infra node-ci script-validate/skill-lint gates are therefore
# skipped here (python-ci.yml carries the stack gates instead).

on:
  pull_request:
  # #5215 D13 / Task 8: the cheap branch-protection required contexts EMITTED BY
  # THIS WORKFLOW (pricing-artifact, docs, test-isolation, license-surface, legal-e2e)
  # were `pull_request:`-only — so main had no
  # post-merge signal for them and a required context could sit red on main
  # with nothing reporting it. (Not the #5583 class: that was a retrieval
  # defect in `tortoise/search_engine.py`, whose suite `python-ci.yml` already
  # grades on `push: main`.) `main-health-nightly.yml` calls this workflow on a
  # schedule with
  # `main_health: true`, so the SAME jobs emit check-runs on main. It REPORTS;
  # it does not gate — a scheduled run is not a branch-protection context.
  # `workflow_call` does NOT inherit secrets by default, so the caller passes
  # `secrets: inherit`.
  workflow_call:
    inputs:
      main_health:
        description: >-
          Main-health nightly call (#5215 D13): force every path-gated surface
          false so only the five always-on required jobs run — never the
          empty-diff fallback, which on a schedule would re-run all ~20 gates.
        required: false
        type: boolean
        default: false

# #6590: ci.yml had no concurrency group, so each `pull_request` synchronize
# ADDED an uncancellable run to a saturated pool. Scoped exactly as
# python-ci.yml scopes it (its own comment records this reasoning; not
# re-invented here): on `pull_request` github.ref is refs/pull/N/merge, which is
# PER-PR, so a new commit cancels only that PR's stale run.
#
# This workflow is also reached via `workflow_call` (main-health-nightly), and
# the expression below yields FALSE for that event. Precise reading: false stops
# a RUNNING scheduled run being cancelled; a shared group still supersedes a
# merely PENDING one, so overlapping calls can cancel each other's not-yet-
# started runs. The newest always survives, which is the intended outcome.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # #2149 (ci-audit F3): path-gate the NON-required jobs. `changes` is a
  # cheap changed-files selector (the python-ci.yml `changes` pattern) that
  # emits per-surface booleans; each gated job below adds
  # `needs: changes` + `if:` on its surface. The 5 branch-protection REQUIRED
  # checks (pricing-artifact, docs, test-isolation, license-surface,
  # legal-e2e) deliberately keep NO needs/if — a SKIPPED required job reports
  # as Success and would silently pass a required check (the trap #2055 named).
  # Fail-closed on detection: an empty/erroneous diff emits ALL
  # surfaces true so every gated job runs — never a silent coverage loss.
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.gate.outputs.migrations }}
      dashboard: ${{ steps.gate.outputs.dashboard }}
      dashboard_e2e: ${{ steps.gate.outputs.dashboard_e2e }}
      uv_lock: ${{ steps.gate.outputs.uv_lock }}
      entrypoints: ${{ steps.gate.outputs.entrypoints }}
      client: ${{ steps.gate.outputs.client }}
      packaging: ${{ steps.gate.outputs.packaging }}
      website: ${{ steps.gate.outputs.website }}
      hosted: ${{ steps.gate.outputs.hosted }}
      flip: ${{ steps.gate.outputs.flip }}
      python: ${{ steps.gate.outputs.python }}
      drift: ${{ steps.gate.outputs.drift }}
      driver_scripts: ${{ steps.gate.outputs.driver_scripts }}
      ai_review_gate: ${{ steps.gate.outputs.ai_review_gate }}
      watchdog_scripts: ${{ steps.gate.outputs.watchdog_scripts }}
      orphan_bound_scripts: ${{ steps.gate.outputs.orphan_bound_scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # PR base SHA must be present for the diff
      - name: Compute per-surface path gates (#2149)
        id: gate
        run: |
          # #5215 Task 8 (D13): a `workflow_call` main-health run has no PR base,
          # so the empty-diff fallback below would set EVERY gate true and re-run
          # the whole ~20-gate matrix nightly. Under `main_health` only the five
          # always-on required jobs run, so every gated surface is explicitly
          # false. (`inputs.main_health` is empty on a `pull_request` event.)
          if [ "${{ inputs.main_health }}" = "true" ]; then
            for key in migrations dashboard dashboard_e2e uv_lock entrypoints \
                       client packaging website hosted flip python drift \
                       driver_scripts ai_review_gate watchdog_scripts \
                       orphan_bound_scripts; do
              echo "  $key=false"
              echo "$key=false" >> "$GITHUB_OUTPUT"
            done
            echo "changes: main_health call — all gated surfaces false; only the 5 required jobs run"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="origin/main"
          CHANGED=$(git diff --no-renames --name-only "$BASE...HEAD" 2>/dev/null || true)
          echo "changed files vs $BASE:"
          echo "$CHANGED"
          cat > /tmp/ci-gates.py <<'PY'
          import subprocess
          import sys

          out = sys.argv[1]
          files = [ln.strip() for ln in sys.stdin if ln.strip()]

          # The client wheel's shared-module set is DERIVED from the build
          # script via client/shared_modules.sh (#3805). A literal
          # enumeration here is what silently gated client-build OFF when
          # tortoise/status_vocabulary.py was staged into the wheel. Fail
          # closed: an underivable set must never silently skip the leg.
          _probe = subprocess.run(["bash", "client/shared_modules.sh"],
                                  capture_output=True, text=True)
          SHARED = _probe.stdout.split()
          if _probe.returncode != 0 or not SHARED:
              print("::error::cannot derive the client wheel's shared modules "
                    "from client/build_client.sh (client/shared_modules.sh)")
              sys.exit(1)

          def startswith(p):
              return lambda f: f.startswith(p)

          def isfile(*names):
              return lambda f: f in names

          def endswith(s):
              return lambda f: f.endswith(s)

          def any_file(*preds):
              return any(any(p(f) for p in preds) for f in files)

          # Surface -> predicates over changed paths. A key is true when ANY
          # changed file can affect the job(s) it gates (issue #2149 / audit
          # F3). Keep in sync with the per-job `if:`s below.
          gates = {
              # migration-unique-prefix / migration-append-only
              "migrations": any_file(
                  startswith("supabase/migrations/"),
                  startswith(".github/scripts/check-migration-"),
              ),
              # dashboard-js-tests (agent-infra node-ci in website/apps/dashboard).
              # #3775: the suite BUILDS the bundle before testing it, and
              # src/pricing.js imports product/pricing.json at build time — a
              # pricing-only change can break that build. It used to ride in via
              # the committed dist under website/apps/dashboard/; the artifact is
              # untracked now, so name the input explicitly.
              "dashboard": any_file(
                  startswith("website/apps/dashboard/"),
                  isfile("product/pricing.json"),
                  # #3485: the dashboard's node suite loads the shared
                  # website/assets/supabase-session.js bridge directly
                  # (supabaseSessionBridge.test.js). Without this entry a PR
                  # touching ONLY the bridge selects the `website` surface and
                  # skips dashboard-js-tests, so the behavioural tests for the
                  # very file under review would never run.
                  isfile("website/assets/supabase-session.js"),
                  # #3787: `website/consent.js` is copied into the dashboard's
                  # dist by `scripts/copy-shared-assets.mjs` as part of
                  # `npm run build`, and the shipped-artifact guard in
                  # src/distBundle.test.js reads that copy. Same rule as the
                  # bridge entry above: naming the input is what makes the
                  # guard run on the file it scans.
                  isfile("website/consent.js"),
                  # #3525: the dashboard's security-headers guard also pins the
                  # MARKETING project's CSP, and it SCANS both projects'
                  # `functions/` trees (cookie writers, `text/html` producers) —
                  # the same policy text has to exist in a second `_headers` and
                  # a second constant because a Pages project's `functions/`
                  # cannot import across project roots, and
                  # securityHeaders.test.js is what keeps the copies identical.
                  # Scope by PREFIX, not by a list of filenames: the guard reads
                  # the whole tree, so a file it scans but this predicate does
                  # not name (a new marketing Function, or any file the guard
                  # gains later) would skip dashboard-js-tests and let the guard
                  # fail only where it never runs. A literal list is also
                  # disarmed by a pure add: the new path matches nothing here
                  # even though the guard scans it. The prefix is a superset of
                  # the guard's input set by construction, which is the
                  # fail-closed direction. `website/_headers` is a sibling of
                  # `functions/`, so it is named explicitly.
                  startswith("website/functions/"),
                  isfile("website/_headers"),
              ),
              # uv-lock-check
              "uv_lock": any_file(
                  isfile("pyproject.toml", "uv.lock"),
              ),
              # entrypoint-guards (runs entrypoint.sh via .ci-checks script)
              "entrypoints": any_file(
                  isfile("entrypoint.sh", ".ci-checks/check-entrypoint-guards.sh"),
              ),
              # client-build (wheel staged from client/ + the canonical
              # shared modules build_client.sh copies into the wheel). The
              # module set is DERIVED from the build script (SHARED, above)
              # so a newly staged module cannot miss this gate again — the
              # PR #4044 review regression, where status_vocabulary.py
              # shipped in the wheel while this predicate named three.
              "client": any_file(
                  startswith("client/"),
                  isfile(*["tortoise/" + m for m in SHARED]),
              ),
              # packaging-smoke (wheel/sdist pack catalog + doc-consistency).
              # Pack SOURCE is the root packs/ tree (pyproject maps
              # tortoise.packs = packs); tortoise/packs/__init__.py is the
              # discovery stub the sdist gate checks. #2160 review P2-1:
              # was startswith("tortoise/packs/") only — a packs/** change
              # silently skipped the wheel gate that guards it.
              "packaging": any_file(
                  isfile("pyproject.toml", "MANIFEST.in",
                         "tortoise/pack_registry.py", "tortoise/pack_state.py",
                         "tests/sample_transcript.txt",
                         "docs/EXPANSION_PACKS.md",
                         "docs/quickstart-selfhosted.md",
                         "docs/quickstart-cloud.md"),
                  startswith("tortoise/packs/"),
                  startswith("packs/"),
              ),
              # welcome-e2e (wrangler preview of website/ + mocked playwright
              # + the two edge-function node harnesses). Separate-app changes
              # under website/apps/ do NOT trigger it — dashboard-js-tests
              # covers dashboard; blog-admin has no gated suite. (#2160 P3-1:
              # excluded website/apps/ wholesale, not dashboard only.)
              "website": any_file(
                  lambda f: f.startswith("website/")
                  and not f.startswith("website/apps/"),
                  isfile("tests/e2e/test_welcome_page.py", "tests/e2e/conftest.py",
                         "tests/test_waitlist_subscribe.mjs",
                         "tests/test_tenant_provision_cors.mjs",
                         # #4481: the blog SSR markdown renderer's harness. Its
                         # subject (website/functions/blog/_lib.ts) already
                         # matches the website/ prefix, but the harness itself
                         # needs a path entry or a test-only PR would not run it.
                         "tests/test_blog_markdown.mjs"),
                  # #3501: the BFF auth suites live here and had NO path entry,
                  # so a PR touching only them could not trigger the job that
                  # runs them — the job would be skipped, not failed.
                  startswith("tests/e2e/auth/"),
                  isfile("tests/test_no_legacy_token_path.py"),
                  isfile("tests/e2e/test_auth_bff_clickthrough.py",
                         "tests/e2e/test_auth_cross_origin_cookie.py"),
                  startswith("supabase/functions/waitlist-subscribe/"),
                  startswith("supabase/functions/tenant-provision/"),
                  startswith("supabase/functions/_shared/"),
              ),
              # hosted-e2e (boots uvicorn tortoise.hosted_api:app; engine
              # surface = the python-ci 'api' source set it exercises PLUS
              # hosted_api's module-load import graph — #2160 review P2-2:
              # hosted_api imports abuse/analytics/audit_events/auth/
              # hosted_backup/mcp_server/onboarding/projection/schemas/sdk/
              # security at import time (+ pricing.tier_limits in body), so a
              # change to any of those gets unit coverage but would never
              # boot the artifact if gated on the old 4-module list. Keep the
              # list in sync with hosted_api.py's imports; a miss only skips
              # the boot suite (unit coverage still runs).
              "hosted": any_file(
                  startswith("tests/e2e/hosted/"),
                  isfile("tortoise/hosted_api.py", "tortoise/session_auth.py",
                         "tortoise/quota.py", "tortoise/metering.py",
                         "tortoise/supabase_control.py", "tortoise/selfhost_api.py",
                         "tortoise/selfhost.py", "tortoise/mcp_auth.py",
                         "tortoise/transport.py",
                         "tortoise/abuse.py", "tortoise/analytics.py",
                         "tortoise/audit_events.py", "tortoise/auth.py",
                         "tortoise/hosted_backup.py", "tortoise/security.py",
                         "tortoise/pricing.py", "tortoise/billing.py",
                         "tortoise/onboarding.py", "tortoise/mcp_server.py",
                         "tortoise/projection.py", "tortoise/schemas.py",
                         "tortoise/sdk.py", "tests/e2e/conftest.py"),
              ),
              # flip-gate (.github/scripts/verify-cutover* + supabase surface
              # + the exact pytest legs the script runs)
              "flip": any_file(
                  startswith("supabase/"),
                  startswith(".github/scripts/verify-cutover"),
                  isfile("tests/test_writer_inventory.py", "tests/test_auth_flip.py",
                         "tests/test_supabase_control.py",
                         "tests/test_onboarding_health_flip.py",
                         "tests/test_agent_signup.py", "tests/test_backup_sweep.py",
                         "tests/test_backup_watcher.py", "tests/test_audit_events.py",
                         "tests/test_provisioning_edge_function.py",
                         "tests/test_flip_gate.py"),
              ),
              # agent-infra-ci (ruff check . + mypy tortoise/ — any .py
              # change, lint/typecheck config, or workflow/skills surface)
              "python": any_file(
                  endswith(".py"),
                  isfile("pyproject.toml"),
                  startswith("skills/"),
                  startswith(".github/workflows/"),
              ),
              # drift-check (agent-infra check --ci: version pin, workflow
              # refs, symlinks, templates, AGENTS.md/.mcp.json/.husky)
              "drift": any_file(
                  isfile(".agent-infra-version", "AGENTS.md", ".mcp.json", "scripts"),
                  startswith(".github/workflows/"),
                  startswith(".husky/"),
                  startswith("scripts/"),
              ),
              # backup-driver-scripts (#2796): the hourly backup driver's
              # state-classification harness. Gated on the driver surface so a
              # PR touching registry-cron.* (or the cron that runs it) re-runs
              # it — #2149 pattern, not an always-on job.
              "driver_scripts": any_file(
                  startswith(".github/scripts/registry-cron"),
                  isfile(".github/workflows/registry-backup-cron.yml"),
                  # a job-definition change re-runs its own suite (dashboard_e2e
                  # precedent) — review R12/Config.
                  isfile(".github/workflows/ci.yml"),
              ),
              # watchdog_scripts: the OUT-OF-BAND MONITORS' harnesses (the key
              # keeps its historical name so the required-check mapping does not
              # churn; it now covers BOTH monitor scripts).
              #   * availability-watchdog (#2850): the probe's state-machine
              #     harness (verdict classification, issue dedupe, restart
              #     cooldown/velocity cap, drill disarm, redaction).
              #   * welcome-e2e-monitor (#2706/#2850): the auto-file harness
              #     (machine-author dedupe, forged-title hijack guard).
              # Gated on the monitor surface so a PR touching a monitor (or the
              # workflow that runs it) re-runs its suite — #2149 pattern, not an
              # always-on job.
              "watchdog_scripts": any_file(
                  startswith(".github/scripts/availability-watchdog"),
                  # #4573: the INDEPENDENT liveness checker for the pager — its
                  # harness pins the dead-monitor alarm (a stale/absent
                  # heartbeat files a GitHub alert + reds the run), the
                  # fail-closed read side, and the constant parity with the
                  # watchdog that writes the heartbeat.
                  startswith(".github/scripts/availability-liveness"),
                  startswith(".github/scripts/welcome-e2e-monitor"),
                  # #3810: the record-only baseline recorder — its harness proves
                  # the record cannot silently lose the cadence factor that
                  # qualifies every availability figure.
                  startswith(".github/scripts/availability-record"),
                  # #4545: the post-deploy health gate's harness — extracted from
                  # deploy-hosted.yml so the gate that decides whether a deploy
                  # SUCCEEDED is testable. It pins the regression where the gate
                  # asserted /health/ready once after polling the strictly
                  # weaker db.ok, reddening healthy deploys.
                  startswith(".github/scripts/deploy-health-gate"),
                  # #3907: the SHARED auto-file substrate — its harness pins
                  # search-before-file, the recurrence count, the forged-title
                  # guard, and fail-closed search. TODO(#5019): the watchdog and
                  # the other monitors still POST inline, so it is not yet
                  # universal.
                  startswith(".github/scripts/auto-file-issue"),
                  # #4759: the bypass reporter / expiry helper and the scheduled
                  # check that ages every SKIP_* lane left set.
                  startswith(".github/scripts/deploy-bypass"),
                  # #2240/#4574: the deploy failure alert and its shared Telegram sender.
                  startswith(".github/scripts/deploy-api-alert"),
                  startswith(".github/scripts/telegram-send"),
                  isfile(".github/workflows/skip-bypass-expiry.yml"),
                  isfile(".github/workflows/availability-watchdog.yml"),
                  isfile(".github/workflows/availability-liveness.yml"),
                  isfile(".github/workflows/welcome-e2e-monitor.yml"),
                  isfile(".github/workflows/availability-record.yml"),
                  isfile(".github/workflows/deploy-hosted.yml"),
                  # #3907: the auto-file adopters — a change to the monitor that
                  # calls the substrate re-runs its harness.
                  isfile(".github/workflows/e2e-live-reconcile.yml"),
                  isfile(".github/workflows/tenant-provision-monitor.yml"),
                  # a job-definition change re-runs its own suite (dashboard_e2e
                  # precedent) — review R12/Config.
                  isfile(".github/workflows/ci.yml"),
              ),
              # orphan_bound_scripts (#4740): the redislite orphan gate's harness
              # — extracted from python-ci.yml so the bound it enforces (read
              # from the conftest session-end sweep's own report, never a
              # hand-picked constant) is testable. Gated on that gate's surface
              # only.
              "orphan_bound_scripts": any_file(
                  startswith(".github/scripts/orphan-bound"),
                  isfile(".github/workflows/python-ci.yml"),
                  isfile(".github/workflows/ci.yml"),
                  # #4740: tests/conftest.py defines the JSON contract the gate
                  # parses (the session-end sweep's report) — a conftest-only
                  # contract change must re-run the harness. The report field
                  # set and its builder live in tortoise/embedded_reaper.py
                  # (conftest imports them), so that module is a trigger too.
                  isfile("tests/conftest.py"),
                  isfile("tortoise/embedded_reaper.py"),
              ),
              # dashboard-e2e (#2166/#2178): the two-server keys-table suite
              # (mixed fixture — durable-only render regression). Triggers on
              # the suite + the harness module/fixtures it imports + every
              # input the served dashboard bundle is BUILT from + workflow edits
              # (a job-definition change re-runs its own suite).
              #
              # #3775: `dist/` was untracked, so it can no longer appear in a
              # diff — this entry used to catch the committed rebuild, which was
              # how a `public/`-only change (or a build-input change) became
              # visible at all. The filter now names the build INPUTS directly,
              # which is strictly more robust than the rebuild convention was:
              # a change to any of them changes the bundle the job serves.
              # (The pre-#3775 'known blind spot' — a src change that forgot its
              # dist rebuild ran against the previous bundle — is GONE: the job
              # builds before it boots.)
              "dashboard_e2e": any_file(
                  isfile("tests/e2e/test_keys_table_mixed.py"),
                  isfile("tests/e2e/test_graphs_management.py"),
                  # #4221: `test_session_login_flow.py` is the SHARED HARNESS
                  # for every migrated dashboard spec (the two CI specs, the
                  # ship-test guard, and the onboarding suite wired in below),
                  # so a change to it must re-run this job even though its own
                  # three tests are not part of the list. It was previously
                  # listed here while NOTHING ran it — which is the inversion
                  # #4221 flags; the entry is now load-bearing rather than idle.
                  isfile("tests/e2e/test_session_login_flow.py",
                         "tests/e2e/conftest.py"),
                  # #4221: the onboarding wizard spec (36 collected cases) was
                  # registered and green but never invoked. It is the one spec
                  # of the four that #4221 named as never-run that still passes
                  # end-to-end against the CURRENT app (see the issue's follow-up
                  # for the other three), so it joins the job's pytest list and
                  # needs this path entry — otherwise a PR touching ONLY it
                  # skips the job (skipped, not failed). Same #3501 rationale as
                  # the auth-suite entries under `website` above.
                  isfile("tests/e2e/test_dashboard_onboarding.py"),
                  # #3806: the ship-test guard's browser half (real clean-browser
                  # walk against the built bundle) + the instrument it guards.
                  isfile("tests/e2e/test_ship_test_onboarding.py",
                         "tests/test_ship_test_onboarding.py",
                         "tools/ship_test_onboarding.py"),
                  startswith("website/apps/dashboard/src/"),
                  # public/ is copied verbatim into dist/ by vite (default
                  # publicDir) and was previously only visible via the
                  # committed dist rebuild — a public-only change must still
                  # run the suite that serves that copy.
                  startswith("website/apps/dashboard/public/"),
                  # the vite entry document + build config + deps
                  isfile("website/apps/dashboard/index.html",
                         "website/apps/dashboard/vite.config.js",
                         "website/apps/dashboard/package.json",
                         "website/apps/dashboard/package-lock.json"),
                  # src/pricing.js imports product/pricing.json from the repo
                  # root (4 levels up) at build time, so a pricing change
                  # changes the served bundle — it too used to surface only
                  # through the committed dist rebuild.
                  isfile("product/pricing.json"),
                  # #3787: the same copied build input — a consent-only change
                  # changes the bundle this lane serves.
                  isfile("website/consent.js"),
                  isfile(".github/workflows/ci.yml"),
              ),
              # ai-review-gate-tests (#2982): the signed-review merge gate's
              # shell harness. Gated on the workflow, the harness, and ci.yml
              # itself so a change to either side of the gate always exercises
              # its evidence-acceptance logic. Security-relevant: a regression
              # here silently accepts unsigned/stale evidence.
              "ai_review_gate": any_file(
                  isfile(".github/workflows/ai-review-gate.yml"),
                  isfile(".github/scripts/ai-review-gate.test.sh"),
                  isfile(".github/workflows/ci.yml"),
              ),
          }

          if not files:
              # Undeterminable diff (git error / empty base) — fail-closed:
              # run every gated job rather than silently dropping coverage.
              print("changes: no diff computed — all gates true (run everything)")
              gates = {k: True for k in gates}

          with open(out, "a") as f:
              for key, val in gates.items():
                  print(f"  {key}={'true' if val else 'false'}")
                  f.write(f"{key}={'true' if val else 'false'}\n")
          PY
          printf '%s\n' "$CHANGED" | python3 /tmp/ci-gates.py "$GITHUB_OUTPUT"
  # Migration invariants (#1095) — secret-free, fork-safe:
  #   migration-unique-prefix  — duplicate version prefixes / non-conforming
  #                              filenames (the 0012x2/0015x2 class that aborted
  #                              `db push` entirely, #1001 root cause)
  #   migration-append-only    — edits/renames/deletions of already-merged
  #                              migrations are rejected (a change to an applied
  #                              migration must be a NEW timestamp file).
  #                              #1235/#2240: when SUPABASE_ACCESS_TOKEN is
  #                              available (same-repo PRs), the exemption covers
  #                              only a git-detected forward prefix rename (R*)
  #                              whose destination version sorts strictly AFTER
  #                              the newest applied version, with BOTH endpoints
  #                              provably unapplied — the remedy
  #                              check-migration-drift prescribes for an
  #                              out-of-order repo-ahead migration. An edit or a
  #                              deletion (M/T/D) carries no destination version,
  #                              so it is NEVER exempt. Fork PRs (no token) keep
  #                              the strict block (fail-closed).
  # Both drive the shared .github/scripts/check-migration-append-only script so
  # tests exercise the shipped logic. fetch-depth: 0 is required for the base
  # SHA to be available to `git diff` (default checkout is depth 1).
  migration-unique-prefix:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'  # #2149: migrations surface only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration prefix invariants
        run: bash .github/scripts/check-migration-append-only prefix
  # C8 #2117: the migration ROLLBACK DRILL — applies every migration on
  # PGlite, runs the assertion suites, then proves the R18 reversibility
  # round trip (apply → rollback → re-apply) for the multi-graph migration:
  # drop graphs + the api_keys graph columns restores the pre-C1 shape, and
  # re-applying migration 20260901000001 restores the invariants (verified
  # by re-running its assertion suite). Runs whenever a migration changes.
  schema-drill:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'  # #2149: migrations surface only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PGlite schema tests + rollback drill
        run: |
          cd supabase/tests/pglite
          npm ci --no-audit --no-fund
          npm run validate
  migration-append-only:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'  # #2149: migrations surface only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migrations are append-only
        run: bash .github/scripts/check-migration-append-only diff
        env:
          # #7628: this is the PR's MERGE-BASE, which is NOT what the `docs`
          # changed set uses any more (that now resolves the base branch TIP).
          # Whether THIS consumer shares the #7628 defect is unmeasured — its
          # policy only ever ADDS migrations, so the over-inclusion is narrower —
          # but two different meanings of "the base" for "the changed set" is the
          # inconsistency a future reader will trip over. Change it only with its
          # own measurement, not for symmetry.
          DRIFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # #1235: enables the unapplied-rename exception (same-repo PRs);
          # forks don't get secrets → strict block preserved (fail-closed).
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  pricing-artifact:
    # #682: canonical pricing must exist on main and stay in sync with the
    # tier_limits() table — a missing/renamed product/pricing.json fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (parity check imports tortoise.pricing)
        run: pip install -e . --quiet
      - name: pricing.json present
        run: test -f product/pricing.json || { echo "product/pricing.json missing — canonical pricing artifact (#682)"; exit 1; }
      - name: parity (billing table == pricing.json)
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, '.')
          from tortoise.pricing import tier_limits, all_tiers
          pricing = json.load(open('product/pricing.json'))['tiers']
          problems = []
          for tier in all_tiers():
              lim = tier_limits(tier)
              spec = pricing.get(tier, {})
              if lim['included_write_ops_per_month'] != spec.get('included_write_ops_per_month'):
                  problems.append(f"{tier}: tier_limits={lim['included_write_ops_per_month']} vs pricing.json={spec.get('included_write_ops_per_month')}")
              if lim['max_api_keys'] != spec.get('max_api_keys'):
                  problems.append(f"{tier}: max_api_keys={lim['max_api_keys']} vs pricing.json={spec.get('max_api_keys')}")
          if problems:
              print('PRICING DRIFT:', *problems, sep='\n  ')
              sys.exit(1)
          print('pricing parity OK')
          EOF

  docs:
    runs-on: ubuntu-latest
    steps:
      # #5215 Task 8 (D13): the main-health call has no PR base, so a scheduled
      # `git diff` against `pull_request.base.sha` is empty and markdownlint/
      # lychee would SKIP — the nightly would prove only that this job started,
      # not that its content checks ran. The main-health call therefore checks
      # out full history (the diff base is HEAD^).
      #
      # #2386: PR runs are full-depth too. The changed-markdown diff below is a
      # three-dot diff against `pull_request.base.sha`, so the base COMMIT must
      # be in the local object store. The default depth-1 checkout omits it and
      # the diff dies with `fatal: Invalid symmetric difference expression
      # <base>...HEAD`; that fatal was swallowed by a tolerance, the changed list
      # came out empty, both lint steps were skipped and the REQUIRED `docs` check
      # reported green without linting anything (job 100109903325). Full depth
      # makes the base resolvable, so the diff is a real function of the PR's
      # changes.
      - uses: actions/checkout@v4
        if: ${{ !inputs.main_health }}
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: ${{ inputs.main_health }}
        with:
          fetch-depth: 0
      - name: Conflict-marker check (#2802)
        # A whole-file unresolved conflict block was invisible to every gate and
        # shipped to main twice (#2802, merge b71aa1534). One of the two gaps is
        # now CLOSED: the `docs` job's markdownlint/lychee steps used to be
        # SKIPPED because the shallow checkout lacked
        # github.event.pull_request.base.sha, `git diff ... || true` swallowed the
        # failure and `files` came out empty (#2386 — the checkout is now
        # full-depth and the diff is fail-closed). The other gap remains:
        # check-doc-affiliation.cjs is not wired into any workflow (it only
        # validates frontmatter keys anyway). This step is checkout-depth
        # independent. Repo-wide, fail-closed. `=======` is deliberately NOT
        # matched:
        # 7 equals is a valid setext H1 underline, AND it is a routine line in the
        # repo TODAY: a 7+-rune rune line opens/closes pytest's captured-output
        # sections, so committed logs under docs/ and the longmem tools match it
        # live. (It was also a false positive at a vendored dependency README
        # until #3768 untracked that tree.) A real conflict block always carries
        # the <</>> markers anyway, which is why the rune can be dropped safely.
        run: |
          set +e
          git grep -nE '^(<{7,}|>{7,}|\|{7,})( |$)' -- .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::unresolved merge conflict marker(s) — resolve before merge"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::conflict-marker check failed to run (git grep exit $rc) — failing closed"
            exit 1
          fi
          echo "no conflict markers"
      - uses: actions/setup-python@v5
        with:
          # The generators carry the #5128 `>=3.12` runtime guard, which exits
          # EXIT_USAGE rather than silently running on an older interpreter.
          python-version: '3.12'
      - name: Generated-artifact drift check (#4454)
        # #4454: a PR that edits ONLY a generated DOCUMENT under `docs/` never
        # runs the matrix — `docs/` is in NON_PYTHON_PREFIXES and no
        # SOURCE_PATTERNS entry claims a `.md` path, so a docs-only change
        # selects `surfaces: []` and the guard test is skipped by the deliberate
        # docs-PR policy. (A `tools/`-only edit is NOT skipped: PR #4177 named
        # the generators in SOURCE_PATTERNS, which beats the non-python prefix.
        # `config/sdk-surface.json` also selects `core`.)
        #
        # It lives here, and runs unconditionally, because `docs` is a REQUIRED
        # context with no `paths:` filter (only the non-required jobs in this
        # file are path-gated, #2149) — so the check cannot inherit the very
        # skip it exists to close. A path-gated home would reproduce the #2802
        # shape, where a repo-wide gate was invisible to every gate and shipped
        # to main twice.
        #
        # `--check` is verify-only: it re-renders and exits non-zero on drift.
        # A bare invocation would REWRITE the artifact and always pass, which
        # looks present and never fires — worse than absent.
        #
        # The install is required, not incidental. The generators import
        # `tortoise.sdk`, which pulls the declared runtime set (numpy via
        # cross_lens, prometheus_client via monitoring, fastmcp via
        # tool_registry). Without it they abort at IMPORT time and exit 1 on
        # EVERY PR — a fail-always gate that reds this required context and
        # blocks all merges, the exact opposite of fail-on-drift. The sibling
        # required artifact job `pricing-artifact` installs the package for the
        # same reason (its parity check imports `tortoise.pricing`).
        #
        # Positive control, run in THIS environment — a developer venv that
        # already has the package installed cannot exhibit the failure mode:
        # inject a line into a listed artifact -> exit 1 naming the file;
        # restore -> exit 0.
        run: |
          pip install -e . --quiet
          python3 tools/bridge_table.py --check
          python3 tools/mcp_rename_table.py --check
          python3 tools/sdk_surface.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the base branch tip (#7628)
        id: base_tip
        # #7628: the base for the changed-set diff must be the base branch's
        # CURRENT TIP, not `github.event.pull_request.base.sha` (the PR's
        # merge-base). The checkout above is the MERGE ref (`refs/pull/N/merge`),
        # which GitHub builds on the base's current tip; so `merge-base...HEAD`
        # is "everything the base branch landed since the merge-base, PLUS this
        # PR's own changes", and a PR that is merely behind lints the base
        # branch's own new `.md` files WHOLE and is failed for findings it did not
        # author. Measured on #7542: base.sha == merge-base(16bb2ab12, main) ==
        # be01e05c0, while the evaluated tree sat on 3c1fc8086, whose #7611 added
        # the offending MD018. Resolving the tip makes the diff exactly this PR's
        # changes, because `merge-base(TIP, HEAD) == TIP` -- HEAD is the merge
        # commit.
        #
        # A SEPARATE step, not folded into the diff step: that step's body is
        # EXECUTED offline by tests/test_docs_lint_gate.py, so it must not fetch.
        if: ${{ !inputs.main_health }}
        env:
          # Same #2386 discipline as the diff step below: the value arrives through
          # the ENVIRONMENT, never as a `${{ }}` interpolation inside the shell.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Fail closed like the diff step: an empty ref makes the fetch a no-op
          # and leaves the output empty, which is the silent green this check
          # exists to prevent (#2386), one input over.
          if [ -z "${BASE_REF:-}" ]; then
            echo "::error::pull_request base ref is empty — cannot resolve the base branch tip; failing closed (#7628)"
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # Assign FIRST, never `echo "sha=$(git rev-parse …)"`. Under `set -e`
          # an ASSIGNMENT propagates the command substitution's exit status, so a
          # failed `rev-parse` fails THIS step; as a nested substitution that status
          # is discarded and the step would publish whatever the substitution
          # printed and still exit 0. Measured: assignment form aborts with exit 128
          # (macOS git 2.50.1 and Linux git 2.54.0, inside a repo).
          # The `-z` test below is defence in depth.
          SHA="$(git rev-parse "refs/remotes/origin/${BASE_REF}")"
          if [ -z "${SHA}" ]; then
            echo "::error::could not resolve refs/remotes/origin/${BASE_REF} (#7628)"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - name: Get changed markdown files
        id: changed
        # #5215 Task 8 (D13): a scheduled main-health call has no PR base, so
        # this PR path is inert there; the main-health path below supplies the
        # post-merge list. (The guard also keeps this step from running and
        # failing closed on an empty base once #2386's fail-closed check lands.)
        if: ${{ !inputs.main_health }}
        env:
          # #2386: the base SHA is passed through the ENVIRONMENT, not a `${{ }}`
          # interpolation inside the shell, so the run body below is pure bash and
          # is EXECUTED (not text-scanned) by tests/test_docs_lint_gate.py.
          #
          # #7628: bound to the base branch's TIP (resolved by the step above),
          # NOT to `github.event.pull_request.base.sha`. That field is the PR's
          # MERGE-BASE, and pairing it with the merge-ref checkout made this diff
          # swallow the base branch's own newly-landed commits. The run body is
          # unchanged: with the tip, `TIP...HEAD` is exactly this PR's changes.
          BASE_SHA: ${{ steps.base_tip.outputs.sha }}
        run: |
          # #4449: the list goes to a FILE and is consumed as DATA. A filename
          # is PR-author-controlled, so it must never reach a shell — a path
          # like `x $(curl evil)/a.md` would execute. markdownlint reads a NUL
          # list via `xargs -0`; lychee reads a file via `--files-from`. This is
          # the same pattern the main-health path below already uses, and the
          # pin in tests/test_merge_throughput.py is what keeps the safety a
          # CONTROL rather than an accident of the checkout depth: while the PR
          # checkout was shallow this PR path could not produce a list at all,
          # so its interpolation was unreachable rather than safe (#2802/#4449).
          #
          # `--no-renames` is deliberate here, though this is a lint-target list
          # rather than a changed-set SELECTION set (so the pin that enforces the
          # flag workflow-wide still applies to it). `--diff-filter ACMR` keeps
          # the list to paths that exist on disk: under `--no-renames` a rename
          # contributes its deleted source path, and a plain .md deletion names a
          # path lychee hard-errors on.
          # See tests/test_ci_selection.py::test_every_changed_set_diff_disables_rename_detection.
          # #2386, fail-closed, expressed in the main-health path's own shape
          # (full-depth checkout, `--diff-filter ACMR`, NUL list, cli2): the
          # required PR `docs` gate must LINT, so it may not swallow a failed
          # diff the way the shallow-checkout `|| true` form did.
          set -euo pipefail
          # An empty BASE_SHA would make the pathspec below read `...HEAD` — git's
          # shorthand for `HEAD...HEAD` — which resolves to an EMPTY diff with
          # exit 0: the exact silent green this step exists to prevent, one input
          # over.
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::error::pull_request base SHA is empty — cannot compute the changed markdown set; failing closed (#2386)"
            exit 1
          fi
          # No tolerance on the diff (#2386): the PR checkout is full-depth (see
          # the checkout step above), so the base resolves. If it does not, the
          # three-dot diff fails HERE and the REQUIRED check goes red instead of
          # skipping both lint steps and reporting green.
          #
          # #7534: the `:(exclude,glob)**/node_modules/**` pathspec removes VENDORED
          # markdown from the population. `glob` magic is required: without it git's
          # `**/` does NOT match zero directories, so a root-level `node_modules/`
          # survived while `_population` (a path-component match) and cli2's
          # micromatch `**/node_modules/**` both drop it. A re-install rewrites those
          # files, so a finding there cannot be fixed by hand, and the baseline
          # generator (`_population`) and the cli2 config `ignores` apply the SAME
          # glob. The differ's `Linting: N` == changed-set count check makes a
          # mismatch fail CLOSED, so the three must agree.
          git diff --no-renames --diff-filter ACMR -z --name-only \
            "${BASE_SHA}...HEAD" -- '*.md' ':(exclude,glob)**/node_modules/**' \
            > "$RUNNER_TEMP/pr-md.raw.nul"
          # `./`-prefix every entry so no path can be read as an OPTION by
          # xargs (argument injection) and lychee's --files-from never treats
          # it as a `#` comment. The prefix loop is `read -d ''` rather than
          # `sed -z`: tests/test_docs_lint_gate.py EXECUTES this body offline,
          # and BSD/macOS `sed` has no `-z`. The bytes written are identical to
          # the main-health path's `sed -z` form.
          : > "$RUNNER_TEMP/pr-md.nul"
          while IFS= read -r -d '' entry; do
            printf './%s\0' "$entry" >> "$RUNNER_TEMP/pr-md.nul"
          done < "$RUNNER_TEMP/pr-md.raw.nul"
          tr '\0' '\n' < "$RUNNER_TEMP/pr-md.nul" > "$RUNNER_TEMP/pr-md.txt"
          # A changed file that ADDS a markdownlint suppression directive hides the
          # very findings this check exists to catch: cli2 reports 0 issues, the
          # differ sees 0 new, and a suppressed new finding passes. A PRE-EXISTING
          # directive is part of the baselined debt; only an ADDED one is rejected
          # — and a MOVED one re-adds the line it removed, because git's patch
          # format has no line-move detection, so a pure reorder is refused too.
          # That is a deliberate false positive (fail closed); the remedy is to
          # leave a baselined directive where it is.
          # (A same-PR rule change in any .markdownlint* config, or in
          # .lycheeignore, is caught by the snapshot's linter-policy digest.)
          #
          # The grep reads a FILE, never a pipe: `grep -q` exits at its first
          # match, and under `set -o pipefail` the SIGPIPE that sends `git diff`
          # made the whole pipeline non-zero — so a LARGE markdown diff silently
          # skipped the guard (measured: a >64 KB diff exited 0 with a directive
          # present). It is CASE-INSENSITIVE because cli2's directive parser is
          # (`<!-- MARKDOWNLINT-DISABLE -->` suppresses just as the lowercase form
          # does, and a case-sensitive guard stayed silent on it), and anchored on
          # the HTML comment opener so ordinary prose that merely NAMES the
          # directive is not a false failure. `--find-renames`, not
          # `--no-renames`: with rename detection off a pure `git mv` of a file
          # that already carries a directive reads as the WHOLE file being added,
          # failing a change that added nothing. The gap class is
          # `[^[:alnum:]>-]*`, NOT `[[:space:]]*`: cli2's matcher is a JS regex
          # whose `\s` includes U+FEFF, so ONE zero-width BOM before
          # `markdownlint-` suppressed a finding while an ASCII-only whitespace
          # class missed it (measured in every locale, C included). The class
          # still excludes `>` (a closed comment), `-` (`<!---` is not a directive
          # to cli2 either) and alphanumerics (prose that NAMES the directive
          # stays a non-failure), and it matches zero characters, so the bare
          # form is unaffected.
          #
          # TWO greps, because cli2's directive regexes are not all line-scoped.
          # `disable`/`disable-line`/`disable-next-line` are matched line by line,
          # so the opener must sit on the same added line. `configure-file` is the
          # ONE directive matched against the WHOLE document joined with newlines
          # (cli2 passes `[lines.join("\n")]` to it alone), so
          # `<!--\nmarkdownlint-configure-file {...}\n-->` is honoured while a
          # same-line opener anchor never sees it — measured end-to-end before
          # this split: the guard exited 0, cli2 reported `0 issues`, and the
          # differ read `0 new` on a genuinely new finding.
          #
          # The second grep is deliberately NOT anchored, and carries
          # `capture`/`restore` beside `configure-file`. Those two are matched
          # per-line like `disable`, but they re-arm a CAPTURED suppression, so
          # they belong in the unanchored set as well. The cost is that prose
          # naming one of the three is a false positive — these are whole-file or
          # re-arming suppressions, so the guard fails CLOSED.
          #
          # `--text` because git treats a `.md` containing a NUL byte as BINARY
          # and prints `Binary files ... differ` with no `+` lines at all, while
          # cli2 still lints that file and honours a directive inside it
          # (measured): without this flag the guard was blind and the suppression
          # silent.
          if ! git diff --find-renames -U0 --text "${BASE_SHA}...HEAD" -- '*.md' \
              ':(exclude,glob)**/node_modules/**' \
              > "$RUNNER_TEMP/added-md.txt"; then
            echo "::error::could not read the changed-markdown diff to check for suppression directives"
            exit 1
          fi
          if grep -qiE '^\+.*<!--[^[:alnum:]>-]*markdownlint-(disable|disable-line|disable-next-line)' "$RUNNER_TEMP/added-md.txt" \
             || grep -qiE '^\+.*markdownlint-(configure-file|capture|restore)' "$RUNNER_TEMP/added-md.txt"; then
            echo "::error::this change ADDS a markdownlint suppression directive, which would hide the very findings the REQUIRED docs check exists to catch. Fix the finding instead of suppressing it."
            exit 1
          fi
          # cli2 treats every positional argument as a GLOBBY PATTERN, so a changed
          # path containing a glob metacharacter is EXPANDED to a different,
          # pre-existing file. The linter then truthfully reports `Linting: 1 file`
          # for a file it never read, the differ's cardinality check is satisfied,
          # and a genuinely new finding in the changed file passes the required
          # check silently (measured: `./docs/a[1].md` lints `./docs/a1.md`).
          # No cli2 flag disables this — `--no-globs` only ignores the CONFIG's
          # `globs` property.
          #
          # ALLOWLIST, not a metacharacter denylist. globby/micromatch also expand
          # extglob — `@(README).md`, `+(target).md`, `!(x).md` — and those contain
          # NONE of `* ? [ ] { }`, so an enumerated denylist misses them and the
          # differ was measured returning 0 on a changed file it never linted.
          # The set of glob metacharacters is micromatch's, not ours, so we accept
          # only the characters a tracked markdown path actually needs: letters,
          # digits, and `._@/-` (every one of the 772 tracked `*.md` paths matches;
          # `@` is required by node_modules/@scope names and is inert without a
          # following `(`). Anything else cannot be linted by this invocation, so
          # fail closed rather than lint the wrong file.
          if grep -qvE '^\./[A-Za-z0-9._@/-]+$' "$RUNNER_TEMP/pr-md.txt"; then
            echo "::error::a changed markdown path contains a character this linter invocation cannot treat literally (cli2 expands every positional arg as a glob, including extglob) — the docs check would report a DIFFERENT file's findings and could pass a real one. Rename the file to letters, digits, and . _ - / @."
            exit 1
          fi
          count="$(grep -c . "$RUNNER_TEMP/pr-md.txt" || :)"
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"
      - name: Markdownlint (changed files)
        if: ${{ !inputs.main_health && steps.changed.outputs.count != '0' }}
        run: |
          # NUL-delimited ARGV via xargs — a filename is data, never shell text (#4449).
          #
          # cli2, not v1 (#2386): `markdownlint-cli` cannot parse the repo's
          # .markdownlint-cli2.jsonc and silently fell back to DEFAULTS, so MD013
          # (line-length 80) fired on the long prose lines the repo config turns
          # off. This mirrors the main-health path above.
          #
          # #7435: the findings are CAPTURED here, not adjudicated. The step lints
          # each changed file WHOLE, so pre-existing debt in a file a change merely
          # touches used to red this required check (#5434: 9 findings in a file the
          # PR authored, ~24 s to reproduce locally but a full CI cycle to discover;
          # #7475: a link broken on main since the file existed). The snapshot differ
          # below decides pass/fail — new findings still fail, known ones do not.
          #
          # The exit code is deliberately NOT the verdict: GNU xargs (this runner)
          # rewrites a child's exit 1-125 to 123, so cli2's 1 (findings) and 2
          # (fatal) are indistinguishable here. The differ decides from the report
          # — `Linting: N` must equal the changed-set count, and the findings
          # parsed must equal the Summary count.
          set +e
          xargs -0 -a "$RUNNER_TEMP/pr-md.nul" npx --yes markdownlint-cli2@0.23.3 \
            > "$RUNNER_TEMP/mdlint-pr.txt" 2>&1
          md_rc=$?
          set -e
          cat "$RUNNER_TEMP/mdlint-pr.txt"
          echo "markdownlint exit=$md_rc (informational — xargs rewrites it; the differ reads the report)"
      - name: Link check (changed files)
        if: ${{ !inputs.main_health && steps.changed.outputs.count != '0' }}
        uses: lycheeverse/lychee-action@v2
        with:
          # `--files-from` reads the list from a FILE — no filename reaches a
          # shell command (#4449).
          args: --no-progress --files-from ${{ runner.temp }}/pr-md.txt
          # #7435: PIN the linter. `lychee-action@v2` defaults to a linter version
          # in ITS OWN action.yml, so without this the required check's lychee is a
          # number that changes under us while `tools/docs_lint_baseline.py`
          # asserts the snapshot was taken with a specific one — and the snapshot's
          # keys encode that version's status text. The markdownlint half is pinned
          # for the same reason (`markdownlint-cli2@0.23.3`).
          lycheeVersion: v0.24.2
          # #7435: report JSON and do NOT fail the step here — the snapshot differ
          # below decides, so inherited link debt in a touched file stops redding
          # the required check while a NEW dead link still fails it.
          format: json
          output: ${{ runner.temp }}/lychee-pr.json
          fail: false
          failIfEmpty: false
      - name: Docs lint baseline (changed files)
        if: ${{ !inputs.main_health && steps.changed.outputs.count != '0' }}
        env:
          # A COUNT, from this workflow's own `grep -c` — never a filename, so it
          # is safe to pass as a value (the #4449 rule covers paths, not integers).
          EXPECTED_MD_FILES: ${{ steps.changed.outputs.count }}
        run: |
          # #7435 (owner ruling, Option 1): fail only on findings that are NOT in
          # the committed snapshot. This does not weaken the check — a new finding
          # still fails it; it stops a change being charged for debt already on
          # main. The snapshot is a CEILING, not an amnesty: #7534 drains it to
          # zero. See the module docstring in tools/docs_lint_baseline.py.
          python3 tools/docs_lint_baseline.py check \
            --markdownlint-output "$RUNNER_TEMP/mdlint-pr.txt" \
            --markdownlint-expected-files "$EXPECTED_MD_FILES" \
            --lychee-output "$RUNNER_TEMP/lychee-pr.json" \
            --baseline config/docs-lint-baseline.json
      # ----- main-health path (#5215 Task 8 / D13) --------------------------
      # The PR path above cannot run on a schedule (there is no
      # `github.event.pull_request.base.sha`), so under `main_health` the
      # post-merge docs signal is the markdown the newest main commit put
      # there. The list is NEVER interpolated into a shell: a filename is
      # PR-author-controlled, and a path like `x $(curl evil)/a.md` would
      # execute (#4449). markdownlint consumes a NUL list via `xargs -0`;
      # lychee consumes it via `--files-from`, which reads a FILE.
      - name: Get changed markdown files (main health)
        id: changed_mh
        if: ${{ inputs.main_health }}
        run: |
          set -euo pipefail
          # `--diff-filter ACMR`: a DELETED (or, under `--no-renames`, a renamed
          # old) .md path does not exist on disk, and lychee hard-errors on a
          # nonexistent input — so the filter keeps the list to files that are
          # actually there to lint (main commit 1673f65c5 deleted two docs).
          # #7534: vendored `node_modules` markdown is excluded here too, matching
          # `_population` and the cli2 config's `ignores` (a re-install rewrites
          # it, so it cannot be fixed by hand). The differ requires
          # `Linting: N` == this count, so a mismatch fails closed.
          git diff --no-renames --diff-filter ACMR -z --name-only HEAD^ HEAD \
            -- '*.md' ':(exclude,glob)**/node_modules/**' \
            > "$RUNNER_TEMP/changed-md.raw.nul"
          # `./`-prefix every entry so no path can be read as an OPTION by
          # xargs (argument injection) and lychee's --files-from never treats
          # it as a `#` comment. NUL-delimited is exact for markdownlint; the
          # newline view is lychee's line format.
          sed -z 's|^|./|' "$RUNNER_TEMP/changed-md.raw.nul" \
            > "$RUNNER_TEMP/changed-md.nul"
          tr '\0' '\n' < "$RUNNER_TEMP/changed-md.nul" \
            > "$RUNNER_TEMP/changed-md.txt"
          # Same suppression-directive guard as the PR path (see its comment,
          # including why the gap class is `[^[:alnum:]>-]*` and not
          # `[[:space:]]*`): the grep reads a FILE, not a pipe, so a large diff
          # cannot skip it by SIGPIPE; it is case-insensitive like cli2's own
          # parser; `--find-renames` keeps a pure rename from reading as an
          # added file; and `--text` keeps a NUL-bearing `.md` from reading as a
          # binary diff with no `+` lines to grep.
          if ! git diff --find-renames -U0 --text HEAD^ HEAD -- '*.md' \
              ':(exclude,glob)**/node_modules/**' \
              > "$RUNNER_TEMP/added-md-mh.txt"; then
            echo "::error::could not read the changed-markdown diff to check for suppression directives"
            exit 1
          fi
          if grep -qiE '^\+.*<!--[^[:alnum:]>-]*markdownlint-(disable|disable-line|disable-next-line)' "$RUNNER_TEMP/added-md-mh.txt" \
             || grep -qiE '^\+.*markdownlint-(configure-file|capture|restore)' "$RUNNER_TEMP/added-md-mh.txt"; then
            echo "::error::this commit ADDS a markdownlint suppression directive, which would hide the very findings the REQUIRED docs check exists to catch. Fix the finding instead of suppressing it."
            exit 1
          fi
          # Same path-character guard as the PR path above (see its full comment):
          # cli2 (and lychee's --files-from) expand a positional argument as a
          # globby pattern INCLUDING extglob, so such a path would be linted as a
          # DIFFERENT file while the count still matches. Allowlist, not denylist.
          if grep -qvE '^\./[A-Za-z0-9._@/-]+$' "$RUNNER_TEMP/changed-md.txt"; then
            echo "::error::a changed markdown path contains a character this linter invocation cannot treat literally (cli2 expands every positional arg as a glob, including extglob) — the docs check would report a DIFFERENT file's findings and could pass a real one. Rename the file to letters, digits, and . _ - / @."
            exit 1
          fi
          count="$(grep -c . "$RUNNER_TEMP/changed-md.txt" || true)"
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"
      - name: Markdownlint (main health, changed files)
        if: ${{ inputs.main_health && steps.changed_mh.outputs.count != '0' }}
        run: |
          # cli2 reads the repo's .markdownlint-cli2.jsonc (MD013 off for prose);
          # the PR path above is aligned with this invocation (#2386/#5476).
          # NUL-delimited ARGV via xargs — a filename is data, never shell text.
          # #7435: captured, not adjudicated — the differ below decides. The exit
          # code is not the verdict (xargs rewrites it).
          set +e
          xargs -0 -a "$RUNNER_TEMP/changed-md.nul" \
            npx --yes markdownlint-cli2@0.23.3 > "$RUNNER_TEMP/mdlint-mh.txt" 2>&1
          md_rc=$?
          set -e
          cat "$RUNNER_TEMP/mdlint-mh.txt"
          echo "markdownlint exit=$md_rc (informational — xargs rewrites it; the differ reads the report)"
      - name: Link check (main health, changed files)
        if: ${{ inputs.main_health && steps.changed_mh.outputs.count != '0' }}
        uses: lycheeverse/lychee-action@v2
        with:
          # `--files-from` reads the list from a FILE — no filename reaches a
          # shell command (#4449). failIfEmpty: a link-free doc is legitimate
          # and must not red the nightly.
          args: --no-progress --files-from ${{ runner.temp }}/changed-md.txt
          # #7435: pinned to the same linter as the PR path (see its comment) — the
          # action's own default is not a contract.
          lycheeVersion: v0.24.2
          # #7435: captured for the snapshot differ (see the PR path above).
          format: json
          output: ${{ runner.temp }}/lychee-mh.json
          fail: false
          failIfEmpty: false
      - name: Docs lint baseline (main health)
        if: ${{ inputs.main_health && steps.changed_mh.outputs.count != '0' }}
        env:
          EXPECTED_MD_FILES: ${{ steps.changed_mh.outputs.count }}
        run: |
          python3 tools/docs_lint_baseline.py check \
            --markdownlint-output "$RUNNER_TEMP/mdlint-mh.txt" \
            --markdownlint-expected-files "$EXPECTED_MD_FILES" \
            --lychee-output "$RUNNER_TEMP/lychee-mh.json" \
            --baseline config/docs-lint-baseline.json

  dashboard-js-tests:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'  # #2149: dashboard surface (+ product/pricing.json, #3775)
    # #1894/#387: the dashboard's derivation + CSS-rule test suite (node --test)
    # runs via the agent-infra reusable unit-test capability
    # (node-ci.yml@v0.1.3) — the migration target of #387.
    #
    # #3775: it is no longer a zero-dep suite. `dist/` was untracked (it is a
    # build artifact), and two members of the glob read the SHIPPED bundle off
    # disk — `distBundle.test.js` (the #2865/#3428/#2937 artifact backstop,
    # which is the only scan that sees a writer living in a `public/`-copied
    # script) and the dist-copy case in `graphsBackupColumnTripwire.test.js`.
    # The suite therefore builds first (`npm ci && npm run build`) and asserts
    # against the fresh vite output — byte-identical to what deploy-pages
    # ships — instead of a committed bundle that can no longer exist. This is
    # the reusable workflow's documented `test-command` escape hatch (it
    # overrides `test-glob`). The old staleness premise ("src changed, dist
    # not rebuilt") is structurally gone: there is no committed bundle to go
    # stale.
    # script-validate/skill-lint skipped: tortoise's scripts/ symlink is
    # machine-local (broken on the runner) and there is no
    # scripts/check-skill-lint.mjs (un-bootstrapped) — the stack gates live
    # in python-ci.yml.
    uses: daniel-ospina/agent-infra/.github/workflows/node-ci.yml@v0.1.3
    with:
      node-version: '22'
      working-directory: website/apps/dashboard
      test-command: 'npm ci && npm run build && node --test src/*.test.js'
      script-validate: false
      skill-lint: false
    secrets: inherit

  uv-lock-check:
    needs: changes
    if: needs.changes.outputs.uv_lock == 'true'  # #2149: pyproject.toml / uv.lock only
    # #493: the committed uv.lock is the dev-environment source of truth —
    # gate on lockfile/pyproject drift. The suite itself runs in the
    # dedicated python-ci.yml workflow (pip); this job enforces the uv lock
    # contract so the lockfile never silently drifts again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          # Pin the uv version that generated uv.lock — a patch bump (e.g.
          # 0.12.2 → 0.12.3) can flag the lock as stale under --check.
          version: '0.12.3'
      - name: Lockfile coherence check (uv.lock vs pyproject.toml)
        # #1917 (CI unblock): stale workspace .venv on some ubuntu-latest
        # runner images makes uv fail with "failed to create directory
        # .venv: File exists" (uv #13986/#9423) — clear it so uv recreates.
        run: |
          rm -rf .venv
          uv lock --check
      - name: Frozen sync (dev group)
        run: uv sync --frozen --group dev
      - name: Dev-group collection check
        # Cheap (no servers): proves the dev group is sufficient for the
        # suite's imports, so `uv run pytest` cannot silently drift from
        # the pip CI path (#493).
        run: uv run pytest tests/ --collect-only -q --ignore=tests/e2e

  test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test isolation (repo-local lint)
        run: bash .ci-checks/check-test-isolation.sh

  backup-driver-scripts:
    needs: changes
    if: needs.changes.outputs.driver_scripts == 'true'  # #2149: driver surface only
    # #2796: the hourly backup driver's state-classification harness. Gated on
    # the driver surface (`.github/scripts/registry-cron*` + the cron workflow)
    # so a change to the driver exercises it in PRs — the driver is otherwise
    # only run by a schedule and its failures used to be silent. Self-contained:
    # stubs aws/curl/date, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup driver state taxonomy (#2796)
        run: bash .github/scripts/registry-cron.test.sh

  ai-review-gate-tests:
    needs: changes
    if: needs.changes.outputs.ai_review_gate == 'true'  # #2982: gate workflow/harness only
    # #2982: the ai-review-gate's evidence-validation shell logic runs inline
    # in the workflow (that workflow has no checkout step, so it cannot
    # reference a repo script). This
    # harness extracts that run block and drives it with fabricated signed
    # markers + a stubbed gh, covering sha-match, diff-match, backward compat,
    # fail-closed-on-API-failure, signature-over-diff, PR/repo binding, and the
    # PR-body source. It ALSO asserts the non-runtime invariants the gate
    # job depends on: no if:/needs:/continue-on-error:, trigger stays
    # pull_request_target with no paths: filter, permissions keep
    # pull-requests: read, and GH_TOKEN is declared. Self-contained, no
    # network, no secrets.
    #
    # ⚠️ This job is NOT a required status check: a red harness does not block a
    # merge, so a regression here can land and then silently let the
    # `ai-review-gate` check pass without evaluating evidence. `ai-review-gate`
    # IS a required check since #5433 (live branch protection + a Mergify entry
    # condition), so a red there does block — but this harness job still does not.
    # Tracked in #3091
    # (add this job to branch protection, or move the harness into an
    # always-run required job). The `if:` above is a complete per-surface guard:
    # it fires on any change to the gate workflow, this harness, or ci.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AI review gate shell harness (#2982)
        run: bash .github/scripts/ai-review-gate.test.sh

  availability-watchdog:
    needs: changes
    if: needs.changes.outputs.watchdog_scripts == 'true'  # #2850: monitor-script surfaces only
    # Monitor-script harnesses. Both are self-contained: stubs curl/gh/flyctl,
    # no network. Mirrors backup-driver-scripts (#2796).
    #   * the availability probe's state machine — verdict classification, issue
    #     dedupe (#2706 class), restart cooldown/velocity cap, drill disarm,
    #     public-body redaction (#2850);
    #   * the welcome-e2e auto-file monitor — machine-author dedupe and the
    #     forged-title hijack guard (#3064 review).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Availability watchdog state machine (#2850)
        run: bash .github/scripts/availability-watchdog.test.sh
      - name: Availability pager liveness check (#4573)
        # The INDEPENDENT dead-man switch: a stale or absent heartbeat files a
        # GitHub alert and reds the run, over a channel independent of the
        # Telegram leg it verifies. Also pins the heartbeat-constant parity with
        # the watchdog (a rename on one side would otherwise alarm forever).
        run: bash .github/scripts/availability-liveness.test.sh
      - name: Welcome-e2e auto-file monitor (#2706/#2850)
        run: bash .github/scripts/welcome-e2e-monitor.test.sh
      - name: Shared auto-file substrate (#3907)
        # One issue per finding, with every occurrence recorded on it: files
        # once, comments `Recurrence #N` after that, refuses to file on a failed
        # search, and never adopts a forged/exact-mismatched look-alike title.
        run: bash .github/scripts/auto-file-issue.test.sh
      - name: Deploy failure alert (#2240)
        # The out-of-band alert #2240 exists for: per-step attribution from the
        # workflow's step ids, ONE issue per failing step with `Recurrence #N` on
        # every later occurrence, the gate's OWN report carried into the body,
        # fail-closed on a failed search OR the PAT trap, and the nudge sent
        # only AFTER the record exists.
        run: bash .github/scripts/deploy-api-alert.test.sh
      - name: Shared shell Telegram sender (#4574 item 1)
        # The delivery contract — transport success AND the API's own `ok:true` —
        # plus the token redaction that keeps the bot token out of a PUBLIC log,
        # and the caller hooks the watchdog's own logger/redactor ride on.
        run: bash .github/scripts/telegram-send.test.sh

  availability-record:
    needs: changes
    if: needs.changes.outputs.watchdog_scripts == 'true'  # #3810: recorder surface only
    # #3810: the RECORD-ONLY baseline instrument's harness. Self-contained:
    # stubs gh, no network. It proves the record keeps the delivered/intended
    # cadence factor beside EVERY availability figure (the revert test — drop
    # it and this job goes red), that DEGRADED is never folded into DOWN, that
    # restarts= is read from the ledger, and that a low figure never fails the
    # run (record-only, not a gate). Mirrors availability-watchdog above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Availability record-only baseline (#3810)
        run: bash .github/scripts/availability-record.test.sh

  deploy-health-gate:
    needs: changes
    if: needs.changes.outputs.watchdog_scripts == 'true'  # #4545: deploy-gate surface only
    # #4545: the post-deploy health gate's harness. Self-contained: stubs curl,
    # no network. It pins the regression that reddened HEALTHY deploys — the
    # gate polled db.ok (the FalkorDB data plane) and then asserted
    # /health/ready ONCE, but readiness is an AND of the Supabase control plane
    # and the data plane, so db.ok does NOT imply ready. Case 3 fails against
    # the pre-fix single-shot assertion and passes only with the readiness
    # poll. #4771 extended the same invariant to the DECISION: cases 2 and 11 pin
    # that db.ok alone no longer fails the run (readiness 200 → pass with a
    # warning) while db.ok false + readiness never 200 still fails, so the gate
    # is not weakened. Mirrors availability-record above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy health gate poll (#4545)
        run: bash .github/scripts/deploy-health-gate.test.sh

  orphan-bound-gate:
    needs: changes
    if: needs.changes.outputs.orphan_bound_scripts == 'true'  # #4740: orphan-gate surface only
    # #4740: the redislite orphan gate's harness. Self-contained: writes hygiene
    # fixtures to a temp dir, no network, no CI runner. It pins that the gate's
    # bound is READ from the conftest session-end sweep's report (two different
    # `left` values both pass, so no fixed bound can satisfy both), that a
    # disagreement between the workflow's count and the sweep's own measurement
    # reds, that a violation of the sweep's accounting identity
    # (`reaped + exited + left < before`) reds, that `cleared: false` is keyed on the
    # measured COUNT (a zero count passes with a warning, a non-zero count
    # reds), that an 18+ digit number exits 2 as a usage error rather than
    # reaching the pass line, and that a red verdict never falls through to a
    # pass line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redislite orphan gate (#4740)
        run: bash .github/scripts/orphan-bound.test.sh

  deploy-bypass-report:
    needs: changes
    if: needs.changes.outputs.watchdog_scripts == 'true'  # #4759: any monitor/deploy-gate surface (shared watchdog_scripts group)
    # #4759: the bypass reporter / expiry helper's harness. Self-contained: no
    # network, no gh — every input is an argument or an env binding, exactly as
    # the workflow supplies them. It proves a bypass lands in
    # $GITHUB_STEP_SUMMARY naming the gate, the lane that fired and BYPASSED
    # (neuter the summary write and it goes red), that each job's end-of-job
    # audit states every gate as bypassed or not, and that the expiry check ages
    # a set lane, VIOLATES past the window, and treats a missing/invalid start
    # date as a violation rather than silence. Mirrors deploy-health-gate above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy bypass report + expiry check (#4759)
        run: bash .github/scripts/deploy-bypass.test.sh

  entrypoint-guards:
    needs: changes
    if: needs.changes.outputs.entrypoints == 'true'  # #2149: entrypoint.sh / its .ci-checks script only
    # #1349 T11: the hosted entrypoint's guard contracts — env-reject of the
    # benchmark-only TORTOISE_EMBEDDER_OVERRIDE seam + missing-cache FATAL —
    # are shell-level and untestable from pytest. Matches the test-isolation
    # pattern: repo-local script, no setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check entrypoint guards (env-reject + missing-cache FATAL)
        run: bash .ci-checks/check-entrypoint-guards.sh

  license-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license surface consistency (BSL 1.1 + $5M AUG, 4 files)
        run: python3 validation/check-license-surface.py
      - name: Service-first gate — no consumer import instruction in README
        run: |
          if grep -nE "(from tortoise|import tortoise)" README.md; then
            echo "::error::README must not instruct importing tortoise — connect, don't import (service model)"
            exit 1
          fi
          echo "service-first gate OK"

  client-build:
    needs: changes
    if: needs.changes.outputs.client == 'true'  # #2149: client/ + the shared modules the build script stages into the wheel (derived — client/shared_modules.sh)
    # #526: the thin-client boundary must hold on EVERY PR — build the
    # tortoise-client wheel, run the acceptance gate in a clean venv (driver
    # imports, engine modules raise ImportError, no engine deps installed),
    # and prove the wheel contains no engine modules. A future engine change
    # leaking into the client dist fails here, not at release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build
      - name: Build the client wheel + sdist (Prefect-pattern staging)
        run: bash client/build_client.sh
      - name: Wheel content check — whitelist (thin driver only)
        run: |
          # Whitelist (PR #1313 conf 88): ANY tortoise/ entry outside the
          # client module set is rejected — including package dirs (e.g.
          # tortoise/projection/__init__.py) and new engine modules. The
          # module set is DERIVED from the build script via
          # client/shared_modules.sh (#3805) — the same source
          # verify_client.sh Gate 0 reads, so the three cannot drift.
          SHARED_RE="$(bash client/shared_modules.sh | grep -oE '^[A-Za-z0-9_]+' | paste -sd'|' -)"
          if [ -z "$SHARED_RE" ]; then
            echo "::error::cannot derive the client wheel's shared modules"
            exit 1
          fi
          BAD="$(unzip -Z1 dist-client/*.whl | grep -E '^(tortoise|tortoise_client)/' | \
            grep -vE "^tortoise/(__init__|${SHARED_RE})\\.py$" | \
            grep -vE '^tortoise_client/(__init__|__main__|cli)\.py$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::non-client entries leaked into the tortoise-client wheel:"
            echo "$BAD"
            exit 1
          fi
          unzip -Z1 dist-client/*.whl | grep -E '^(tortoise|tortoise_client)/'
          echo "wheel content OK — thin driver only"
      - name: Acceptance gate (clean venv, client only)
        run: bash client/verify_client.sh

  packaging-smoke:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'  # #2149: packaging / pack-catalog / pack-docs surfaces
    # #1929 (epic #1891 slice 1): per-PR G1 regression guard — the built
    # wheel must ship the pack catalog (surface 1) and a clean-venv install
    # must load the full starter set from the installed location. The
    # publish-time smokes (publish-pypi / publish-selfhost / deploy-hosted)
    # are the REQUIRED publish gates; this job gives fast PR feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: pip install build==1.6.0   # pinned (#1685 convention — a build-frontend
        # bump must not silently change the wheel content this job asserts on)
      - name: Build wheel + sdist
        run: python -m build
      - name: Wheel content check — tortoise/packs shipped
        run: |
          MANIFEST_COUNT="$(unzip -Z1 dist/*.whl | grep -cE '^tortoise/packs/[^/]+/manifest\.yaml$' || true)"
          [ "$MANIFEST_COUNT" -ge 1 ] || { echo "::error::wheel ships no pack manifests"; unzip -Z1 dist/*.whl | grep tortoise/packs || true; exit 1; }
          tar tzf dist/*.tar.gz | grep -q 'tortoise/packs/__init__.py' \
            || { echo "::error::sdist missing tortoise/packs/__init__.py (MANIFEST.in)"; exit 1; }
          echo "wheel/sdist pack content OK"
      - name: Clean-venv pack smoke (bound derived from installed constant)
        run: |
          python -m venv /tmp/packsmoke
          /tmp/packsmoke/bin/pip install dist/*.whl --quiet
          cd /tmp && /tmp/packsmoke/bin/python - <<'EOF'
          from pathlib import Path
          import tortoise
          from tortoise.pack_registry import PackRegistry
          from tortoise.pack_state import DEFAULT_STARTER_PACKS
          packaged = Path(tortoise.__file__).resolve().parent / "packs"
          reg = PackRegistry(packaged)
          n = reg.load_all()
          bound = len(DEFAULT_STARTER_PACKS)
          assert n >= bound, f"wheel ships {n} packs < starter {bound}"
          assert set(reg.packs) >= set(DEFAULT_STARTER_PACKS), "wrong pack set"
          t = Path(tortoise.__file__).resolve().parent.parent / "tests" / "sample_transcript.txt"
          assert t.exists(), "sample transcript missing"
          print(f"per-PR wheel pack smoke OK: {n} >= {bound}")
          EOF
      - name: Doc-consistency check (#1932 / epic #1891 R11)
        # Authoring docs must not drift from the manifest schema: the guide's
        # required sections exist, both quickstarts reference packs, and the
        # links resolve (dead link → fail). <2s, fail-closed.
        run: |
          for sec in "What is an expansion pack" "The enforcement ladder" "Chains" "Testing a pack"; do
            grep -q "$sec" docs/EXPANSION_PACKS.md || { echo "::error::EXPANSION_PACKS.md missing section: $sec"; exit 1; }
          done
          for qs in docs/quickstart-selfhosted.md docs/quickstart-cloud.md; do
            grep -q "EXPANSION_PACKS.md" "$qs" || { echo "::error::$qs missing pack reference"; exit 1; }
          done
          test -f docs/EXPANSION_PACKS.md || { echo "::error::EXPANSION_PACKS.md missing"; exit 1; }
          echo "doc-consistency OK"

  welcome-e2e:
    needs: changes
    if: needs.changes.outputs.website == 'true'  # #2149: website/ (minus dashboard app) + welcome/edge-fn tests
    runs-on: ubuntu-latest
    # Mocked welcome-page suite (#541) — secret-free per-PR coverage against
    # the LIVE page (Supabase calls mocked via Playwright routes). The #801
    # live signup smoke self-skips without SUPABASE secrets and runs in
    # welcome-e2e-monitor.yml (scheduled + on-merge). Restored per-PR after
    # #1189: the botched #1181 merge wrapped this job in conflict markers
    # (empty HEAD side); #1181's monitor move had dropped per-PR coverage of
    # the mocked welcome flows (the python matrix excludes tests/e2e/).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # .ts type stripping + syntax detection is DEFAULT-ON from 22.18; the parity driver passes --experimental-strip-types (>= 22.7), test_pi_capture_hooks' `node --test` does not (#373 harness, #4714 parity test)
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      # #1511: serve THIS branch's website/ (wrangler pages dev, mirroring the
      # legal-e2e job) instead of the LIVE page — the strict-validity gates,
      # the provision-401 clear→/auth path and the waitForSession validity
      # check land in this PR and only exist in the deployed page AFTER merge.
      # #2178 (review P1): pre-warm the npx + wrangler caches BEFORE the boot
      # clock starts — a fresh runner's npx fetch was eating most of the 120s
      # boot budget (empty /tmp/wrangler.log = cold npx install never finished).
      - name: Pre-warm wrangler toolchain
        run: |
          npx --yes wrangler@4 --version
          npx --yes wrangler@4 pages dev --help >/dev/null
      # #3501: the auth suites resolve wrangler via `shutil.which("wrangler")`
      # and FAIL (not skip) when it is missing — `require_toolchain()` calls
      # `pytest.fail()`, so a missing toolchain reds this job instead of
      # reporting a green step that asserted nothing. An earlier draft of that
      # helper SKIPPED, which is exactly the silent no-op this step exists to
      # prevent: PATH had no wrangler, so the suite reported "33 skipped", exit
      # 0, and asserted nothing. Verified with a wrangler-less PATH. Skipping is
      # still reachable, but only via an explicit `AUTH_ALLOW_NO_TOOLCHAIN=1`
      # opt-in that no workflow sets.
      #
      # The npx pre-warm above does NOT put wrangler on PATH; this does. Removing
      # this step reds welcome-e2e — it is load-bearing, not belt-and-braces.
      - name: Install wrangler on PATH (required by the #3501 auth suites)
        run: npm install -g wrangler@4.127.0
      # #4054: the auth suites serve the dashboard's BUILT `dist/` root
      # (tests/e2e/auth/conftest.py -> ensure_dashboard_dist()). Without a
      # lockfile-pinned install here, that helper's `npm run build` has no local
      # vite and fails; it used to run `npx vite build`, which silently did an
      # AD-HOC install that omitted rollup's platform binary
      # (`@rollup/rollup-linux-x64-gnu`, the npm optional-dependency gap) and
      # errored the whole suite at fixture setup. `npm ci` is the same
      # lockfile-pinned install dashboard-e2e and dashboard-js-tests use, and it
      # is what provides the platform binary.
      - name: Install dashboard dependencies (lockfile-pinned, #4054)
        run: |
          cd website/apps/dashboard
          npm ci
      - name: Start wrangler pages dev preview (website/ = Pages root)
        run: |
          cd website
          for attempt in 1 2; do
            npx --yes wrangler@4.127.0 pages dev . --port 8788 --ip 127.0.0.1 \
              --compatibility-date=2024-09-23 \
              > /tmp/wrangler.log 2>&1 &
            echo $! > /tmp/wrangler.pid
            for i in $(seq 1 240); do
              if curl -fsS http://127.0.0.1:8788/ >/dev/null 2>&1; then
                echo "wrangler dev ready after ${i}s (attempt ${attempt})"
                exit 0
              fi
              sleep 1
            done
            echo "attempt ${attempt} timed out — retrying"
            kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
            pkill -f 'wrangler.*8788' 2>/dev/null || true
            pkill workerd 2>/dev/null || true
            # NO rm of /tmp/wrangler.log here: attempt 2's relaunch truncates
            # with > anyway, and deleting after the LAST attempt would remove
            # the only evidence before the final cat (review P1 — a double
            # failure must still surface wrangler's own diagnostics).
            sleep 3
          done
          # Final cleanup: flush the log + free :8788 before surfacing it
          # below — a future failure must NOT be a black box.
          kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
          pkill -f 'wrangler.*8788' 2>/dev/null || true
          pkill workerd 2>/dev/null || true
          sleep 2
          echo "::error::wrangler dev server failed to start (2 attempts)"
          echo "--- /tmp/wrangler.log ---"
          cat /tmp/wrangler.log || true
          echo "--- /tmp/wrangler.pid: $(cat /tmp/wrangler.pid 2>/dev/null || echo missing) ---"
          exit 1
      - name: Run welcome page E2E (mocked against the local preview) (#373/#1511)
        run: python -m pytest tests/e2e/test_welcome_page.py -q -rs -p no:cacheprovider
        env:
          WELCOME_URL: http://127.0.0.1:8788/welcome
          # Epic #1647 Task 10 (P4): this job runs pytest URI-less BY DESIGN
          # (the e2e surface needs no FalkorDB server) — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
      # --- #3501 BFF auth -------------------------------------------------
      # These four steps are the reason the suites exist in CI at all. Before
      # them, all 33 auth tests + the static gate were LOCAL-ONLY: they ran
      # green on a developer machine and nowhere else, which is the same class
      # of hole the static gate's own docstring warns about ("a gate that
      # scans nothing passes") — one level up.
      #
      # The static gate is first and needs no servers: it asserts the BFF
      # invariant repo-wide, so it fails fast and names the offending file.
      - name: BFF invariant gate — no client-held session token (#3501)
        run: python -m pytest tests/test_no_legacy_token_path.py -q -rs -p no:cacheprovider
        env:
          TORTOISE_TEST_CARVE_OUT: "1"
      # HTTP-level: real `wrangler pages dev` + a dependency-free mock Supabase,
      # real ES256 JWKS verification, real PKCE. Ports are claimed at runtime so
      # this can never silently no-op on a busy runner.
      - name: BFF auth flow + proxy suites (#3501)
        run: python -m pytest tests/e2e/auth/ -q -rs -p no:cacheprovider
        env:
          TORTOISE_TEST_CARVE_OUT: "1"
      # Browser-level: the ONLY place the security property is asserted as a
      # real browser sees it (HttpOnly unreadable from JS, no token in
      # localStorage/sessionStorage). Opt-in by env var, so it MUST be set here
      # or the assertion silently never runs.
      - name: BFF auth real-browser clickthrough (#3501)
        run: |
          python -m pytest \
            tests/e2e/test_auth_bff_clickthrough.py \
            tests/e2e/test_auth_cross_origin_cookie.py \
            -q -rs -p no:cacheprovider
        env:
          TORTOISE_TEST_CARVE_OUT: "1"
          AUTH_CLICKTHROUGH: "1"
      - name: Run waitlist edge-function behavioral harness (#373)
        run: node --experimental-strip-types tests/test_waitlist_subscribe.mjs
      - name: Run tenant-provision CORS runtime harness (#1110)
        run: node --experimental-strip-types tests/test_tenant_provision_cors.mjs
      - name: Run blog SSR markdown renderer harness (#4481)
        run: node --experimental-strip-types tests/test_blog_markdown.mjs

  legal-e2e:
    runs-on: ubuntu-latest
    # Full legal-page suite (#657) — ~1000 assertions across 10 plan checks
    # (privacy/tos/license/dpa content, consent + pricing content, mocked
    # signup/signin flows, mobile render, full link crawl). The suite is
    # opt-in via RUN_LEGAL_E2E=1 (module-level skip otherwise) and had NO
    # workflow setting it — this job is the automation (#747).
    #
    # Runs against a LOCAL `wrangler pages dev` preview of website/ — no
    # production URLs, no secrets. The harness's own canary
    # (_tortoise_emulated_locally) decides whether the Host-spoofed
    # tortoise.* checks actually run or defer (skip = green-with-annotation,
    # workers-sdk#165); TORTISE_HOST_CHECK=1 opts into that canary.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Install the package (pulls falkordblite/redislite needed by
      # tortoise/__init__) + the e2e test extras (playwright, pytest-playwright).
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      # #2178 (review P1): pre-warm the npx + wrangler caches BEFORE the boot
      # clock starts — a fresh runner's npx fetch was eating most of the 120s
      # boot budget (empty /tmp/wrangler.log = cold npx install never finished;
      # #2211 hit this 4x in a row 2026-09-04). --version is fast; the
      # readiness loop below retries twice at 240s each.
      - name: Pre-warm wrangler toolchain
        run: |
          npx --yes wrangler@4 --version
          npx --yes wrangler@4 pages dev --help >/dev/null
      - name: Start wrangler pages dev preview (website/ = Pages root)
        run: |
          cd website
          # wrangler pinned to 4.127.0 (@4 floats to latest each run — same
          # drift class as the ruff pin, agent-infra#414). 2026-09-04 ~04:00Z
          # a runner-fleet cold-npx stall broke this boot on EVERY PR (the
          # #2178/#2211 hardening class): /tmp/wrangler.log stayed EMPTY — the
          # cold npx install never finished inside the 120s budget. 4.127.0 is
          # the version verified to start (macOS in 5s, cold linux ~90s); the
          # retry's 2nd attempt reuses the warm npm cache.
          #
          # --compatibility-date pinned: wrangler defaults to "today", but the
          # bundled workerd lags a day behind (max date < today) → dev server
          # fails to start. Any stable date ≤ workerd's max works; the
          # middleware uses only stable APIs (next()/ASSETS.fetch).
          for attempt in 1 2; do
            npx --yes wrangler@4.127.0 pages dev . --port 8788 --ip 127.0.0.1 \
              --compatibility-date=2024-09-23 \
              > /tmp/wrangler.log 2>&1 &
            echo $! > /tmp/wrangler.pid
            # Wait for the dev server to accept connections (first start also
            # downloads workerd + bundles website/functions/_middleware.ts).
            for i in $(seq 1 240); do
              if curl -fsS http://127.0.0.1:8788/ >/dev/null 2>&1; then
                echo "wrangler dev ready after ${i}s (attempt ${attempt})"
                exit 0
              fi
              sleep 1
            done
            echo "attempt ${attempt} timed out — retrying"
            kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
            pkill -f 'wrangler.*8788' 2>/dev/null || true
            pkill workerd 2>/dev/null || true
            # NO rm of /tmp/wrangler.log here: attempt 2's relaunch truncates
            # with > anyway, and deleting after the LAST attempt would remove
            # the only evidence before the final cat (review P1 — a double
            # failure must still surface wrangler's own diagnostics).
            sleep 3
          done
          # Final cleanup: flush the log + free :8788 before surfacing it
          # below — a future failure must NOT be a black box.
          kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
          pkill -f 'wrangler.*8788' 2>/dev/null || true
          pkill workerd 2>/dev/null || true
          sleep 2
          echo "::error::wrangler dev server failed to start (2 attempts)"
          echo "--- /tmp/wrangler.log ---"
          cat /tmp/wrangler.log || true
          echo "--- /tmp/wrangler.pid: $(cat /tmp/wrangler.pid 2>/dev/null || echo missing) ---"
          exit 1
      # #4054: the auth surface (/auth, /signup, /welcome, /invite-accept) moved
      # to the `tortoise-dashboard` Pages project, so this suite needs a LOCAL
      # app origin too. Without it the app-surface tests followed the marketing
      # origin's 301 to DEPLOYED PRODUCTION and asserted against whatever main
      # had last shipped (they passed that way, which is the worst outcome).
      - name: Install + build the dashboard bundle (app origin, #4054)
        run: |
          cd website/apps/dashboard
          npm ci
          npm run build
      - name: Start wrangler pages dev preview (dashboard dist = app origin, :8790)
        run: |
          cd website/apps/dashboard
          # `--d1 SESSIONS`: the auth pages' session probe is `/api/session`,
          # which resolves the HttpOnly `__Host-session` cookie against the D1
          # `sessions` table. Without the binding a request carrying a cookie
          # answers 503 ("store unreachable") instead of 401/200.
          for attempt in 1 2; do
            npx --yes wrangler@4.127.0 pages dev dist --port 8790 --ip 127.0.0.1 \
              --compatibility-date=2024-09-23 --d1 SESSIONS \
              > /tmp/wrangler-app.log 2>&1 &
            echo $! > /tmp/wrangler-app.pid
            for i in $(seq 1 240); do
              if curl -fsS http://127.0.0.1:8790/ >/dev/null 2>&1; then
                echo "wrangler (app) ready after ${i}s (attempt ${attempt})"
                exit 0
              fi
              sleep 1
            done
            echo "attempt ${attempt} timed out — retrying"
            kill $(cat /tmp/wrangler-app.pid) 2>/dev/null || true
            pkill -f 'wrangler.*8790' 2>/dev/null || true
            sleep 3
          done
          echo "::error::wrangler (app) dev server failed to start (2 attempts)"
          tail -50 /tmp/wrangler-app.log || true
          exit 1
      - name: Run legal pages E2E suite (#657)
        # LEGAL_E2E_SKIP_EXTERNAL_CRAWL=1: the third-party external-link
        # crawl fetches unauthenticated production URLs (github.com/LICENSE,
        # …) that rate-limit shared CI runner IPs (429 outlives the test's
        # single retry) → nondeterministic gate. Skip-with-annotation, same
        # pattern as the tortoise-host deferral; full crawl runs locally.
        # test_signup_form_safety_e2e.py joined here (#801): same module-level
        # RUN_LEGAL_E2E gate, same wrangler dev server; it ran nowhere in CI
        # before (welcome-e2e collects it without RUN_LEGAL_E2E → self-skips).
        run: >
          RUN_LEGAL_E2E=1 BASE_URL=http://127.0.0.1:8788
          APP_BASE_URL=http://127.0.0.1:8790
          TORTISE_HOST=http://127.0.0.1:8788 TORTISE_HOST_CHECK=1
          LEGAL_E2E_SKIP_EXTERNAL_CRAWL=1
          python -m pytest tests/e2e/test_legal_pages.py tests/e2e/test_signup_form_safety_e2e.py
          -q -p no:cacheprovider
        env:
          # Epic #1647 Task 10 (P4): URI-less e2e surface — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
      - name: Stop wrangler dev server
        if: always()
        # kill npx + its wrangler/workerd children (each job gets its own
        # runner VM, so pkill can't touch other jobs)
        run: |
          kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
          kill $(cat /tmp/wrangler-app.pid) 2>/dev/null || true
          pkill -f 'wrangler.*8788' 2>/dev/null || true
          pkill -f 'wrangler.*8790' 2>/dev/null || true
          pkill workerd 2>/dev/null || true
          true

  dashboard-e2e:
    needs: changes
    if: needs.changes.outputs.dashboard_e2e == 'true'  # #2149: keys-table suite + harness + dashboard build inputs
    runs-on: ubuntu-latest
    # #2166/#2178: the mixed-fixture API Keys table suite — durable-only
    # render regression (bootstrap/session rows never render; truthful
    # revoked/disabled/active statuses; the held key's visible in-use note
    # with toggle/trash suppressed). First dashboard suite in CI — the scope
    # doc's S6 spec (no existing job boots the dashboard; the legal/welcome
    # e2e jobs serve website/ on :8788 only).
    #
    # TWO wrangler boots (the #1511/#2166 harness): website/ on :8788 (the
    # auth origin the gate redirects to) + the dashboard bundle on :8790.
    #
    # #3775: the job now BUILDS that bundle (step below). Before #3775 `dist/`
    # was tracked and CI had no build — the committed bundle was served and a
    # stale/missing dist commit red-failed the job. With `dist/` untracked
    # there is nothing to serve unless we build, and building is strictly
    # better for this suite's purpose: the fixtures assert against the exact
    # bundle THIS revision produces, instead of whatever was last committed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      # #3775: `dist/` is a build artifact (untracked). Build it before any
      # preview boots — `npm ci` is lockfile-pinned, so this is the same
      # vite output the deploy-dashboard job ships (byte-identical, verified
      # by a clean-build diff on #3775).
      - name: Build dashboard bundle (:8790 origin, #3775)
        run: |
          cd website/apps/dashboard
          npm ci
          npm run build
      # #2178 (review P1): pre-warm the npx + wrangler caches BEFORE the boot
      # clock starts — a fresh runner's npx fetch was eating most of the 120s
      # boot budget (first CI run died here with an empty log). --version is
      # fast; the readiness loops below now retry twice at 240s each.
      - name: Pre-warm wrangler toolchain
        run: |
          npx --yes wrangler@4 --version
          npx --yes wrangler@4 pages dev --help >/dev/null
      - name: Start wrangler pages dev preview (website/ = auth origin, :8788)
        run: |
          cd website
          for attempt in 1 2; do
            npx --yes wrangler@4 pages dev . --port 8788 --ip 127.0.0.1 \
              --compatibility-date=2024-09-23 \
              > /tmp/wrangler-auth.log 2>&1 &
            echo $! > /tmp/wrangler-auth.pid
            for i in $(seq 1 240); do
              if curl -fsS http://127.0.0.1:8788/ >/dev/null 2>&1; then
                echo "wrangler (auth) ready after ${i}s (attempt ${attempt})"
                exit 0
              fi
              sleep 1
            done
            echo "attempt ${attempt} timed out — retrying"
            kill $(cat /tmp/wrangler-auth.pid) 2>/dev/null || true
            pkill -f 'wrangler.*8788' 2>/dev/null || true
            sleep 3
          done
          echo "::error::wrangler (auth) dev server failed to start"
          tail -50 /tmp/wrangler-auth.log || true
          exit 1
      - name: Start wrangler pages dev preview (dashboard dist = app origin, :8790)
        run: |
          cd website/apps/dashboard
          for attempt in 1 2; do
            # #3501/#4054: `--d1 SESSIONS` is load-bearing. The dashboard's
            # session gate is `/api/session`, which resolves the HttpOnly
            # `__Host-session` cookie against the D1 `sessions` table; without
            # the binding a request carrying that cookie answers 503 ("store
            # unreachable") instead of 200, so the suite's seeded-session
            # fixtures can never render the shell. The harness seeds the row it
            # reads (tests/e2e/test_session_login_flow.py).
            npx --yes wrangler@4 pages dev dist --port 8790 --ip 127.0.0.1 \
              --compatibility-date=2024-09-23 --d1 SESSIONS \
              > /tmp/wrangler-dash.log 2>&1 &
            echo $! > /tmp/wrangler-dash.pid
            for i in $(seq 1 240); do
              if curl -fsS http://127.0.0.1:8790/ >/dev/null 2>&1; then
                echo "wrangler (dashboard) ready after ${i}s (attempt ${attempt})"
                exit 0
              fi
              sleep 1
            done
            echo "attempt ${attempt} timed out — retrying"
            kill $(cat /tmp/wrangler-dash.pid) 2>/dev/null || true
            pkill -f 'wrangler.*8790' 2>/dev/null || true
            sleep 3
          done
          echo "::error::wrangler (dashboard) dev server failed to start"
          tail -50 /tmp/wrangler-dash.log || true
          exit 1
      # #4221: this step used to run three of the seven `RUN_DASHBOARD_E2E`
      # specs, so the onboarding spec's 36 cases (plus 48 more across the three
      # stale specs and the flow module named below) were registered, reported
      # green, and never invoked. The onboarding spec joins the list here; the
      # others are NOT wired because they are stale against the #3501 BFF
      # session seam and the #4054 auth-origin move — wiring them would turn
      # this job red on every run. Evidence and the follow-up are on #4221.
      #   test_dashboard_identity.py    — 21/22 fail (seeds the retired
      #                                   `sb-tortoise-auth-token`; mocks only
      #                                   the legacy absolute api host)
      #   test_dashboard_gate.py        — 15/19 fail (asserts the pre-#4054
      #                                   prod-origin /auth redirect target)
      #   test_dashboard_billing.py     — 4/4 fail (drives the moved /auth page
      #                                   through the retired local :8788 origin)
      #   test_session_login_flow.py    — 3/3 fail (same class); the module
      #                                   itself is the shared harness, so it
      #                                   stays in the change detector above
      - name: Run dashboard e2e — keys-table (#2166/#2178), graphs, ship-test guard (#3806), onboarding (#4221)
        run: >
          RUN_DASHBOARD_E2E=1
          python -m pytest tests/e2e/test_keys_table_mixed.py tests/e2e/test_graphs_management.py
          tests/e2e/test_ship_test_onboarding.py tests/e2e/test_dashboard_onboarding.py
          -q -rs -p no:cacheprovider
        env:
          # Epic #1647 Task 10 (P4): URI-less e2e surface — the URI-required
          # enforcement opt-in (this suite needs no FalkorDB server).
          TORTOISE_TEST_CARVE_OUT: "1"
      - name: Stop wrangler dev servers
        if: always()
        # kill npx + its wrangler/workerd children (each job gets its own
        # runner VM, so pkill can't touch other jobs)
        run: |
          kill $(cat /tmp/wrangler-auth.pid) 2>/dev/null || true
          kill $(cat /tmp/wrangler-dash.pid) 2>/dev/null || true
          pkill -f 'wrangler.*8788' 2>/dev/null || true
          pkill -f 'wrangler.*8790' 2>/dev/null || true
          pkill workerd 2>/dev/null || true
          true

  hosted-e2e:
    needs: changes
    if: needs.changes.outputs.hosted == 'true'  # #2149: tests/e2e/hosted/ + the hosted api-surface modules
    # #303: the 12-case hosted-platform E2E suite (tests/e2e/hosted/). Boots
    # the REAL deployment artifact (uvicorn tortoise.hosted_api:app) on
    # embedded FalkorDBLite inside the test session — zero secrets, no
    # Docker, no browser binaries (pytest-playwright APIRequestContext only,
    # so NO `playwright install` step — the suite is HTTP-level; a browser
    # leg would add ~4m of setup for zero current coverage).
    # Hermetic seams: TORTOISE_BACKUP_STORAGE=memory (backups), fixture
    # pricing via TORTOISE_PRICING_PATH, self-signed Stripe webhooks against
    # a local secret (tier bump without Stripe network), local JWKS mock +
    # minted ES256 JWTs (session-auth plane). Suite self-boots the server
    # (fixture), so the job is one pytest invocation — legal-e2e pattern
    # minus the external-server step. Measured locally: ~60-120s suite.
    runs-on: ubuntu-latest
    concurrency:
      # #2108: the former repo-global `group: hosted-e2e` +
      # cancel-in-progress: true killed in-flight hosted-e2e runs whenever a
      # DIFFERENT PR's run entered the group (observed 2026-09-01: three
      # cross-PR cancels in 7 min, each logged as a bogus "startup hang with
      # zero test output" — the victim was healthy, just cancelled mid-boot).
      # Key per event+ref (python-ci.yml precedent): on pull_request
      # github.ref is refs/pull/N/merge, so a new commit cancels only that
      # PR's stale run. ci.yml is pull_request-only today, so the group is
      # strictly per-PR; the event_name dimension + conditional cancel
      # mirror python-ci.yml and stay correct if a push/schedule trigger is
      # ever added.
      group: hosted-e2e-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Package + e2e extras (pytest-playwright, cryptography for the JWKS
      # mint). No chromium: APIRequestContext needs no browser binaries.
      - run: pip install -e '.[test]'
      - name: Run hosted platform E2E suite (#303)
        run: |
          set -o pipefail
          # #2108: --capture=sys (not the default fd capture) so the fixture's
          # boot-progress heartbeats (os.write(2, ...) — see conftest _live)
          # reach the job log live; PYTHONUNBUFFERED (step env below) so
          # pytest's -q dots stream instead of flushing at process exit.
          RUN_HOSTED_E2E=1 python -m pytest tests/e2e/hosted/ \
            -q -rs -p no:cacheprovider --durations=10 --capture=sys 2>&1 | tee /tmp/hosted-e2e.log
          # Loud-warning monitor (output-parse — NOT the #801 env-check
          # pattern, which is collect-only-safe; here we parse the run log):
          # this job ALWAYS sets the gate, so zero passed tests means the
          # suite skipped out or failed collection — surface it, don't certify.
          if ! grep -qE "[1-9][0-9]* passed" /tmp/hosted-e2e.log; then
            echo "::warning::hosted E2E certified NOTHING — no passed tests in the run"
          fi
        env:
          # Epic #1647 Task 10 (P4): the hosted-e2e lane runs pytest URI-less
          # BY DESIGN (it boots embedded selfhost daemons; the docker lane
          # redirect would void the parity assertions) — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
          # #2108: pytest -q progress dots sit in Python's block buffer when
          # stdout is a pipe (the tee below) — a healthy run emitted ZERO job
          # output for its whole ~2 min (boot + 54 tests), flushing only at
          # process exit. That reads as a hang and invited premature cancels.
          # Unbuffered → dots stream live as tests complete (the boot phase
          # is heartbeat-visible from the suite fixture — see conftest _live).
          PYTHONUNBUFFERED: "1"

  flip-gate:
    needs: changes
    if: needs.changes.outputs.flip == 'true'  # #2149: supabase/ + verify-cutover* + its pytest legs
    # #669 pre-deploy cutover gate (plan Task 10.1, issue #771) — the gate
    # that MUST PASS before the single-deploy flip. Runs the local/CI
    # equivalence of the operator's live gate: FalkorDBLite + the seam fakes
    # (zero network, no Docker — the plan's `local supabase start` leg maps
    # to the seam-fake + embedded-DB equivalence, documented in
    # .github/scripts/verify-cutover). The operator additionally runs
    # `bash .github/scripts/verify-cutover --live` with prod creds right
    # before dispatching the flip (sequence in supabase-deploy.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # tenant-provision TS-parse guard (#770)
      - run: pip install -e '.[test]'
      - name: Run the #669 pre-deploy flip gate
        env:
          # Epic #1647 P4: the flip-gate pytest legs run URI-less by design
          # (FalkorDBLite + seam fakes — the pre-flip local/CI equivalence,
          # documented in verify-cutover's header) — the P4 URI-required
          # enforcement opt-in, same as hosted-e2e.
          TORTOISE_TEST_CARVE_OUT: "1"
        run: bash .github/scripts/verify-cutover

  agent-infra-ci:
    needs: changes
    if: needs.changes.outputs.python == 'true'  # #2149: any .py / pyproject / skills / workflows
    # #303 — generic stack CI from agent-infra reusable workflows, pinned to a
    # semver tag (@v0.1.2). Bump = tag + manifest ci.ref edit; agent-infra
    # check blocks on a stale pin. GitHub Actions CANNOT parse symlinked
    # workflow files (#555), so the reusable workflow is a real committed file
    # in agent-infra/.github/workflows/python-ci.yml.
    #
    # Re-created after agent-infra went PUBLIC (was blocked: public repos
    # cannot call reusable workflows in private repos — #1494 revert). Now the
    # call resolves.
    #
    # Surface kept generic-only (D4): the heavy tiered test split stays local
    # in python-ci.yml (repo-specific strategy); migration guards, pricing,
    # client-build, e2e gates stay local siblings above.
    #   test-command: ''      — tests run in python-ci.yml (uv split)
    #   lint-command: full    — [tool.ruff] in pyproject.toml pins the rule
    #                           surface (E/F/B/UP/I/SIM/RUF, line-length 100);
    #                           the ~3.7k violation baseline is recorded as
    #                           per-line `# noqa` directives + the ignore list
    #                           (#1503, docs/lint-baseline-1503.md) so `ruff
    #                           check .` passes green and stays active for new
    #                           code. Previously narrowed to the syntax class
    #                           (E9/F63/F7) because no config existed.
    #   #1685: the baseline DRIFTED — the `pip install ruff` in the agent-infra
    #                           job is unpinned (drift vector); the baseline
    #                           never held at merge #1504 (369 violations hid
    #                           behind the narrowed lint), +104 drifted over 319
    #                           commits. Refreshed to 0 on 2026-08-25 (230 fixed
    #                           / 242 noqa'd under 0.16.4) AND pinned here:
    #                           the explicit-version pip install overrides the
    #                           unpinned job install in both directions.
    #   typecheck-command: full — [tool.mypy] in pyproject.toml (baseline via
    #                           disable_error_code, #1503); the command is
    #                           explicit because the workflow's package
    #                           auto-detect would pick `battery/` (first
    #                           top-level dir with __init__.py, sorted) — not
    #                           the engine. `mypy tortoise/` is what the
    #                           baseline was measured against.
    uses: daniel-ospina/agent-infra/.github/workflows/python-ci.yml@v0.1.3
    with:
      python-version: '3.12'
      test-command: ''
      lint-command: 'pip install ruff==0.16.4 && ruff check .'
      typecheck-command: 'mypy tortoise/'
    secrets: inherit

  drift-check:
    needs: changes
    if: needs.changes.outputs.drift == 'true'  # #2149: agent-infra pin surface (.agent-infra-version/workflows/symlinks)
    # #305/#387 — agent-infra drift gate: structural drift (version pin,
    # symlinks, missing templates, workflow refs vs manifest.check.ci.ref)
    # fails CI; content drift warns. Runs tiered via agent-infra check --ci.
    uses: daniel-ospina/agent-infra/.github/workflows/drift-check.yml@main
    secrets: inherit
