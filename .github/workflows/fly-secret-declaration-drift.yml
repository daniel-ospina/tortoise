# fly-secret-declaration-drift (#14574) — an undeclared Fly secret is NAMED within
# the hour, instead of at the next deploy.
#
# THE COST THIS EXISTS FOR (measured 2026-11-21 → 2026-11-24)
# ----------------------------------------------------------
# The blocking half already works, and it is correct: `deploy-hosted.yml` runs
# `.github/scripts/check-fly-secret-drift.py` (fail-closed, #4126) before any
# propagation, and it refuses a deploy whose app carries a secret no declaration
# covers. What it cannot do is TELL ANYONE. So:
#
#   `TORTOISE_CAPTURE_IN_FLIGHT` was hand-set on `tortoise-y4mjjq` during the
#   #12992 429 investigation with no managing source → every deploy that reached
#   the gate failed → production stayed on `e74cf1d1` (Nov 21) while **75+ commits
#   landed**. Nothing was red anywhere else. The discovery was accidental, two
#   days later, and it surfaced as "the deploy is broken".
#   Then `TORTOISE_RECORD_VECTOR_LEG` failed the very next attempt (#14563), and
#   the discovery is SERIAL: one name per deploy attempt, ~10 min of CI plus a
#   hand dispatch each time.
#
# Deploys are hand-dispatched, so the detection window is "until someone tries to
# deploy" — two days, in the measured case. This workflow closes it to <= 1 h.
#
# ⛔ IT IS A REPORTER, NOT A GATE — and the gate is UNCHANGED.
#    Nothing here relaxes, excuses or bypasses anything: this workflow cannot
#    influence a deploy at all. The gate keeps failing closed on exactly the state
#    it fails on today; the only difference is that a human now hears about that
#    state within the hour instead of at the next deploy.
#
# ⛔ IT CANNOT MUTATE ANYTHING. Three independent bounds, none of them a promise:
#    * `tools/fly_secret_declaration_report.py` never invokes `gh` at all, and its
#      only external command is the provenance gate's own `read_fly_secret_names`
#      — default `flyctl secrets list --app <app> --json`, a READ that returns
#      names + digests and never a value. The tool has no code path that builds a
#      `secrets set`/`secrets unset`/`deploy` argv, and the test suite pins it
#      (`test_a_clean_run_files_nothing_it_has_no_credential_at_all`).
#    * the ONLY `flyctl` invocation in this file is that read. There is no deploy
#      step, no `gh pr` step, and no `issues` write anywhere except the filing
#      step below, which files a report and nothing else.
#    * the Fly credential is bound to one step, and the file grants `issues: write`
#      only — no `contents: write`, so it cannot push, tag, or create a release.
#
# ⛔ NO SECRET VALUE IS READ, PRINTED, STORED OR LOGGED. `flyctl secrets list`
#    returns names, digests and a status; the tool reads ONLY the `name` field
#    (through the gate's hardened reader, which refuses a payload with no usable
#    string name). A digest is not printed either — the finding is WHICH NAMES are
#    undeclared, which is all a human needs, and printing digests would be one
#    more surface for no benefit. `tests/test_fly_secret_declaration_report.py`
#    asserts a distinctive fixture digest never reaches stdout, stderr or the JSON.
#
# THE CREDENTIAL, NAMED WITH ITS SCOPE
# ------------------------------------
# `FLY_SECRET_READ_TOKEN` is preferred; `FLY_API_TOKEN_DEPLOY` is the fallback.
# Both are APP-SCOPED to `tortoise-y4mjjq` (`fly tokens create deploy -a …`), not
# org-scoped, because there is no reason for this job to see any other app. ⚠️ BE
# PRECISE ABOUT WHAT IS AND IS NOT ENFORCED: Fly scopes a token to an org or an
# app, not to a verb, so neither token is read-only at FLY's layer — the
# read-only property is enforced HERE, by the two bounds above (one allowlisted
# read, and a tool that cannot form any other command), and it is a reviewable
# property of this file rather than of the token's scope. The fallback exists so
# the first tick works with no owner action; minting `FLY_SECRET_READ_TOKEN` later
# narrows it further without touching this file.
# ✅ THE FALLBACK'S *READ* CAPABILITY IS EVIDENCED, NOT ASSUMED (the one item the
#    PR body asks a reviewer to check). Two independent sources, neither of them
#    this file's own optimism:
#      * Fly's access-token documentation: "App-scoped tokens are limited to
#        managing a single app and its resources" — `secrets` is one of those
#        resources (`list` is a strictly weaker verb on it than the `set` that
#        same scope is documented to cover), and the only thing an app-scoped
#        token provably CANNOT do is reach another app or the org.
#      * `docs/ops/fly-token-hardening.md` §"Scope reality (verified 2026-08-09)":
#        the app-scoped deploy token "CAN manage that app's own secrets
#        (`flyctl secrets set`)".
#    So the first tick reads. If a tick ever goes RED naming an auth refusal
#    instead, THAT is the signal to mint `FLY_SECRET_READ_TOKEN` — the `||` above
#    then prefers it with no edit here.
# ⛔ Deliberately NOT `secrets.FLY_API_TOKEN` (the org-wide token): nothing this
#    job does needs org scope, and an org token in a scheduled reporter would be
#    the widest credential in the repo doing the narrowest job.
#
# CADENCE — HOURLY (`23 * * * *`), and the arithmetic is the issue's target:
# #14574's indicator is "time from an undeclared name existing to someone being
# told", with a target of **<= 1 h**. Six-hourly would miss it by 6x and would
# have let the measured two-day window become two days of six ticks. The offset
# is off the hour boundary (GitHub documents scheduled events being delayed under
# load, "especially at the start of each hour") and clear of the sibling
# `consent-key-drift` ticks (:11/:41), so the two scheduled readers of the same
# registry do not contend. A dropped tick is not a loss: the condition is a steady
# STATE, not an event, so the next tick repeats the reading. Its own concurrency
# group with `cancel-in-progress: false` means a run is never superseded mid-flight.
#
# ⛔ RED MEANS ONE THING: THE INSTRUMENT COULD NOT READ. DRIFT IS THE ISSUE.
#    A drifting fleet keeps this run GREEN on purpose. The alternative — red on
#    every tick while a name stays undeclared — is 24 red runs a day for a
#    condition already filed, which is the "a monitor that fires constantly is a
#    monitor nobody reads" defect the shared substrate documents (#2706/#3907): it
#    makes the run list unreadable, so the day the reporter itself breaks looks
#    exactly like the 24 days before it. So:
#      CLEAN        → green, one summary line, nothing filed.
#      DRIFT        → green, one ISSUE per undeclared name (deduped), plus a step
#                     summary. The issue is the signal and it is durable.
#      UNREADABLE   → RED, naming the reason (flyctl absent, auth refused, a
#                     timeout, an empty/!shape list, an unparsable manifest or an
#                     unclassifiable payload). A read that did not happen is never
#                     an OK reading — the `spawn-gate` `UNREADABLE` verdict is the
#                     model — and it must never render as "no drift".
#
# ⛔ A SCHEDULED TICK CANNOT BLOCK A MERGE, AND A DISPATCH CAN. A `schedule` run is
#    a NON-CODE event — `schedule` is a MEMBER of the merge rail's `NON_CODE_EVENTS`
#    (`tools/merge_throughput.py`), which is what EXCLUDES it from the merge
#    decision — so a red tick never gates a PR. `workflow_dispatch` is NOT exempt:
#    its check suite attaches to the sha of the ref it was dispatched against, so
#    a dispatch at `main`'s HEAD enters the rail as a BLOCKING base red. The
#    dry-run input defaults to "do not file", and never dispatch this against
#    `main` (the same caution `consent-key-drift.yml` carries for the same reason).
#
# WHAT IT COMPARES (both lists are the provenance gate's own, not a copy)
# ----------------------------------------------------------------------
#   live    every name `flyctl secrets list` returns. An UNDECLARED live name is
#           the #4126 defect AND the thing that refuses the next deploy.
#   staged  every name `deploy-hosted.yml`'s payload CAN assign, read by the
#           gate's `extract_propagation_blocks` + `payload_partition` — the payload
#           is EXECUTED under a stubbed `flyctl`, so no shell spelling hides an
#           assignment. An UNDECLARED staged name is the same violation one step
#           earlier: the run that first creates it passes (the gate runs BEFORE the
#           propagation step) and every run after would hard-fail on it.
# ⛔ The `staged` sample is the ALL-GITHUB-SECRETS-PRESENT one — exactly the sample
#    the gate's own UNDECLARED check uses — so this reporter cannot form a second
#    opinion about a name's declaration status. `tests/…::
#    test_the_reporter_and_the_gate_agree_on_an_undeclared_name` pins it end to end.
#
# THE FIX IS IN THE ISSUE, NOT IN THE RUN LOG
#   Each issue names the variable, says which list it came from, and carries the
#   copy-paste declaration line for all four sources the gate accepts. One issue
#   per undeclared NAME (the title is the dedupe key: no run id, no timestamp, no
#   count), so a name that stays undeclared for a week is ONE thread with
#   recurrences, never seven issues. When the name is declared, the next clean
#   tick closes every open issue this workflow owns (`.github/scripts/auto-file-
#   issue.sh resolve`), so the ledger cannot outlive the fault.
name: fly-secret-declaration-drift

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      file_issues:
        description: 'File/refresh the per-name issues (default false = dry run)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: fly-secret-declaration-drift
  cancel-in-progress: false

# contents: read for actions/checkout; issues: write for the filing step (the
# monitor's signal). The repo's default token is restricted (#2140), so the scopes
# are granted explicitly — without them the reporter is deaf while looking green.
# ⛔ No `contents: write`: this workflow can never push, tag, or release.
permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # The alert is filed by `.github/scripts/auto-file-issue.sh`, which calls `gh`
      # AND `jq` (`af_have_gh` requires both). `runs-on: ubuntu-latest` normally has
      # both, but the fallback pool carries the same label on a bare runner whose
      # service PATH is a minimal non-login one, where the call dies `exit 127` —
      # reading as an instrument fault instead of a verdict. Provide them or fail
      # NAMING them, before any of this workflow's logic runs.
      - name: Runner tool contract — provide gh + jq (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh jq

      # `tools/fly_secret_declaration_report.py` is stdlib-only, but the payload
      # classification it delegates to (`extract_propagation_blocks`) PARSES the
      # deploy workflow, and a YAML `if:` is not part of the `run:` shell — so
      # PyYAML is hard-required (#4259). Pinned to the version `ci-timing.yml` pins,
      # and installed with pip rather than through a resolver: this step runs hourly
      # for one parse, so it must not depend on the repo's lock resolving at run
      # time (deploy-hosted provisions the same dependency through `uv`, which it
      # sets up explicitly — `uv` is NOT present on a bare runner).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision PyYAML (the payload classifier parses the deploy workflow)
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read the app's secret NAMES and diff them against the declarations
        id: read
        env:
          # ⛔ NAMED CREDENTIAL, APP-SCOPED — see the header. `||` selects the
          # dedicated token when the owner has minted it, else the app-scoped deploy
          # token that already exists, so the first tick works with no owner action.
          # Neither is read-only at Fly's layer; THIS FILE's single allowlisted read
          # is what makes the job read-only.
          FLY_API_TOKEN: ${{ secrets.FLY_SECRET_READ_TOKEN || secrets.FLY_API_TOKEN_DEPLOY }}
          FLY_APP: tortoise-y4mjjq
        run: |
          set +e
          python3 tools/fly_secret_declaration_report.py --json /tmp/fly-secret-declaration.json
          rc=$?
          set -e
          # ⛔ The exit code IS the verdict (0 CLEAN · 1 DRIFT · 2 UNREADABLE), so it
          # is passed through untouched and published as an output: a step that
          # swallowed it would be the false PASS this workflow exists to refuse. The
          # filing step branches on it; the JOB's colour is decided below.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo "## Fly secret declarations vs the app (#14574)"
            echo
            if [ -s /tmp/fly-secret-declaration.json ]; then
              echo '```json'
              cat /tmp/fly-secret-declaration.json
              echo '```'
            else
              echo '**No reading was produced** — the tool wrote nothing. See the step log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Report — one issue per undeclared NAME (never a gate, never a PR)
        # `always()` so the DRIFT path (rc=1, which failed the step above on purpose)
        # still files: the reading is the artifact. ⛔ `!cancelled()` is not a
        # formality — `steps.read.outcome` is one of success|failure|cancelled|
        # skipped, so a cancel landing inside the read yields `cancelled`, and
        # `always()` is precisely what runs a step on a cancelled run; the body would
        # then render an empty reading and file nothing meaningful.
        if: always() && !cancelled()
        env:
          # Actions exposes the token only as a CONTEXT, never as an env var (#3092),
          # and `auto-file-issue.sh` asserts the author from the write's own response
          # (a PAT files as its owner and never dedupes — #3907). STEP-level only, so
          # `actions/checkout` never sees it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.read.outputs.rc }}
          FILE_ISSUES: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.file_issues == 'true' }}
        run: |
          set -u
          REPORT=/tmp/fly-secret-declaration.json
          #: The label every monitor-filed issue carries; the resolve sweep below
          #: uses it to FIND our ledger, and the exact-title match makes sure it can
          #: only ever close this workflow's own issues (never a sibling monitor's).
          LABEL=auto-filed
          #: ⛔ THE TITLE GRAMMAR IS NOT SPELLED HERE. It is BOTH the dedupe key that
          #: `auto-file-issue.sh` searches on AND the discriminator this sweep uses to
          #: decide which open issues it OWNS — two roles, one grammar, and a grammar
          #: spelled in two languages drifts (filing duplicates on one side while
          #: closing nothing on the other). `--title` renders it and
          #: `--filter-owned-titles` recognises it, both from the tool, both pinned by
          #: a test that round-trips every name shape.

          if [ "${RC:-}" = "2" ] || [ -z "${RC:-}" ]; then
            # UNREADABLE. Do NOT touch the ledger: a sweep that resolves on a reading
            # that did not happen would close real findings on a broken instrument.
            if [ -z "${RC:-}" ]; then
              echo "::error::fly-secret-declaration-drift: the read step produced NO verdict, so this run measured nothing — that is NOT 'no drift'. The failing step above names why. Nothing was filed and no open issue was resolved."
            else
              echo "::error::fly-secret-declaration-drift: the secret inventory could NOT be read (rc=2) — this is NOT 'no drift'. The step log names the cause. Nothing was filed and no open issue was resolved."
            fi
            exit 1
          fi

          if [ "${RC:-}" = "0" ]; then
            # CLEAN. A silent green run is the correct output — one line, and the
            # ledger closes so an issue cannot outlive the fault (#8841). ⛔ A
            # bookkeeping failure must never redden a GREEN reading: say so and carry
            # on, because the reading is the artifact (the substrate's own rule).
            echo "CLEAN — every live and stageable Fly secret name is declared. Nothing to file."
            if ! gh api "repos/${GITHUB_REPOSITORY}/issues?labels=${LABEL}&state=open&per_page=100" \
                 --paginate --jq '.[] | .title' > /tmp/open-titles.txt 2>/tmp/open-titles.err; then
              echo "::warning::could not list the open ${LABEL} issues, so no ledger entry was resolved — the reading above is still CLEAN. ($(tail -c 400 /tmp/open-titles.err 2>/dev/null || true))"
              exit 0
            fi
            # Only titles this workflow OWNS — the exact grammar it files under.
            if ! python3 tools/fly_secret_declaration_report.py --filter-owned-titles \
                 < /tmp/open-titles.txt > /tmp/mine.txt; then
              echo "::warning::could not classify the open issues, so no ledger entry was resolved — the reading above is still CLEAN"
              exit 0
            fi
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              title="$(python3 tools/fly_secret_declaration_report.py --title "$name")"
              # `< /dev/null` on purpose: the loop's stdin IS /tmp/mine.txt, and a
              # child that reads stdin would swallow the remaining names.
              bash .github/scripts/auto-file-issue.sh resolve --title "$title" \
                --why "the next scheduled read found ${name} declared (or no longer on the app), so the condition this issue tracked is gone." \
                < /dev/null \
                || echo "::warning::could not resolve the open issue for ${name} — it stays OPEN and will be re-reported next tick"
            done < /tmp/mine.txt
            exit 0
          fi

          if [ ! -s "$REPORT" ]; then
            echo "::error::the reporter reported drift (rc=${RC}) but wrote no reading — refusing to file from an unreadable artifact"
            exit 1
          fi

          # ── DRIFT ────────────────────────────────────────────────────────
          # One issue per NAME. `jq` emits one `NAME<TAB>class+class` row per name;
          # the FIX text is fetched per name from the tool (`--explain`), which is the
          # one owner of that grammar, so the issue body cannot drift from the shapes
          # `read_manifest` accepts.
          count=$(jq '.remainder | length' "$REPORT")
          echo "DRIFT — ${count} undeclared Fly secret name(s)."
          echo "::warning::${count} undeclared Fly secret name(s) on the app — each one refuses the NEXT deploy. One issue per name has been filed/refreshed; this run is green because the issue is the signal (a red tick every hour would bury the one red that matters)."
          if [ "${FILE_ISSUES:-true}" != "true" ]; then
            echo "::notice::DRY RUN (workflow_dispatch with file_issues=false) — nothing was filed. The reading is in the step summary."
            jq -r '.remainder[] | "  - \(.name) [\(.classes | join("+"))]"' "$REPORT"
            exit 0
          fi

          failed=0
          while IFS=$'\t' read -r name classes; do
            [ -n "$name" ] || continue
            title="$(python3 tools/fly_secret_declaration_report.py --title "$name")"
            body="$(mktemp)"
            # The declaration help is MARKDOWN with newlines, so it cannot ride a
            # `@tsv` row (jq escapes \n and the body would render literally). It is
            # fetched per name from the one owner of that text.
            if ! fix="$(python3 tools/fly_secret_declaration_report.py --explain "$name")"; then
              echo "::error::could not render the fix for ${name} — refusing to file an issue without one"
              rm -f "$body"
              failed=1
              continue
            fi
            {
              echo '<!-- fly-secret-declaration-drift -->'
              echo "## Fly secret \`${name}\` has no declaration"
              echo
              if [ "$classes" = "live" ]; then
                echo "**It is live on the app** (the app's secret store returns it) and declared nowhere in"
                echo '`.github/scripts/fly-managed-secrets.txt`.'
                echo
                echo '⛔ **This refuses every `deploy-hosted` run that reaches the fail-closed provenance'
                echo 'gate (#4126).** Production is frozen at the last good deploy until one of the fixes'
                echo 'below lands — that is exactly what cost ~2 days and 75+ commits on 2026-11-24'
                echo '(`TORTOISE_CAPTURE_IN_FLIGHT`), and one more deploy cycle for'
                echo '`TORTOISE_RECORD_VECTOR_LEG` (#14563).'
              else
                echo '**`deploy-hosted.yml` can STAGE it** — the payload assigns it when its GitHub'
                echo "secret exists — and it is declared nowhere in \`.github/scripts/fly-managed-secrets.txt\`."
                echo
                echo '⛔ The run that first creates it passes (the gate runs BEFORE the propagation'
                echo 'step), and **every run after would hard-fail on it**. Declaring it now is the'
                echo 'difference between a one-line PR and another frozen-deploy window.'
              fi
              echo
              echo "Reported by the hourly \`fly-secret-declaration-drift\` workflow (#14574) — a"
              echo 'read-only reporter. It never blocks anything and never mutates Fly.'
              echo
              echo '### The one-line fix'
              echo
              echo "$fix"
              echo
              echo '⛔ The deploy gate is CORRECT and is NOT the thing to change: the state is the'
              echo 'defect, not the gate. Do not arm `skip-fly-secret-provenance` for this — that'
              echo 'bypass releases EVERY exit-1 violation in the run, silently.'
              echo
              echo "Reading: \`.github/scripts/check-fly-secret-drift.py\` (the gate) ·"
              echo "\`tools/fly_secret_declaration_report.py\` (this report)."
            } > "$body"
            # `< /dev/null`: the loop's stdin is the ROW SOURCE (one name per row), so a
            # child reading stdin would silently truncate the remaining names — the
            # classic `while read` + `ssh` defect, and here it would UNDER-report.
            if ! bash .github/scripts/auto-file-issue.sh file --title "$title" --body-file "$body" --label "$LABEL" < /dev/null; then
              echo "::error::could not file/refresh the issue for ${name} — the finding is UNFILED for that name"
              failed=1
            fi
            rm -f "$body"
          done < <(jq -r '.remainder[] | [.name, (.classes | join("+"))] | @tsv' "$REPORT")
          # A file that could not be filed must fail loudly: "reported" and "not
          # reported" cannot be the same colour (#2140).
          exit "$failed"
