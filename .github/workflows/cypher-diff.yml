# The differential harness, in CI (#13098).
#
# ⛔ WHY THIS JOB EXISTS AND WHY IT RUNS TWICE. A harness that has only ever
# printed "diff empty" has not been proven — the collision guard's vacuous test
# is the precedent (`#13098`'s acceptance). So the second step runs the SAME
# candidate with a deliberate porting defect injected and REQUIRES a non-empty
# diff. A run where the mutation also comes back empty fails the job, because
# that is the harness lying rather than the SQL being right.
#
# The two backends are named in the job output by the harness itself: a real
# FalkorDB service and a real record Postgres, bootstrapped from the product's
# own `supabase/migrations/*.sql` — not a stub schema.
name: cypher-diff

# Per-PR cancel only, the same key `python-ci.yml` uses and for the same reason:
# `github.ref` is `refs/pull/N/merge` on `pull_request`, so a new commit on PR N
# replaces PR N's stale run and only PR N's. `github.event_name` in the key keeps
# the PR and `workflow_dispatch` arms apart, so a manual dispatch can never cancel
# a PR run or the reverse.
#
# ⛔ WHY THE DISPATCH ARM IS NOT `cancel-in-progress: true`. A dispatch is a PERSON
# asking for one measurement of one tree; superseding it silently is the opposite
# of what they asked for, and cancelling mid-run would leave the job's own
# "the harness ran" evidence absent — the vacuous-pass shape this job exists to
# refuse. The PR arm is where the flood risk lives (#9115), and that is the arm
# that is bounded.
concurrency:
  group: cypher-diff-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "tortoise/**"
      - "supabase/migrations/**"
      - "tools/cypher_diff_harness.py"
      - "tools/cypher_inventory.py"
      - "docs/architecture/CYPHER-INVENTORY.md"
      - "tests/test_13098_cypher_inventory.py"
      - ".github/workflows/cypher-diff.yml"
  workflow_dispatch:

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ⛔ NO `services:` BLOCK — THE TWO STORES ARE PROVISIONED BY ACTION (#6673).
    # A `services:` block pins a FIXED host port, and every self-hosted runner on
    # this host shares ONE Docker daemon, so `6379:6379` / `5432:5432` is a single
    # global namespace: a second concurrent job's `docker start` dies with "Bind
    # for 0.0.0.0:6379 failed: port is already allocated", which aborts the
    # RUNNER in its `initialize_containers` pre-step and reds the job in ~9s with
    # ZERO tests (measured, `#6673`). The actions assign ephemeral loopback ports
    # and read them back, so nothing here names a port number.
    #
    # ⛔ AND THE GUARD THAT WOULD HAVE REFUSED THIS SHIPPED BLIND TO THIS FILE.
    # `tests/test_runner_ports_6673.py::test_no_fixed_port_service_mapping_anywhere`
    # was parametrised over a hard-coded `[python-ci.yml, post-merge-validation.yml]`
    # and `PROVISIONED_JOBS` was a literal list, so this workflow could be added
    # with a fixed-port `services:` block and stay green by ABSENCE of a check
    # that is green over the population it can see (`#13098` review P1). Both
    # populations are now derived from `.github/workflows/` and from the provision
    # calls found in it, so a new workflow is covered the moment it is added.
    steps:
      - uses: actions/checkout@v4
      # ⛔ PINNED, like every other FalkorDB job in this repo
      # (`.github/actions/falkordb-provision/action.yml`'s default is the same
      # tag, and `tools/test_lane.py` REFUSES a floating tag outright). A
      # floating app-image tag makes this gate's engine a function of the
      # calendar rather than of the commit: `falkordb/falkordb:latest` resolved
      # to engine 6.0.x on 2026-11-17 (module `graph` ver 60004) where the pin
      # is 4.20.x (ver 42006), and the 6.0 family is the one whose
      # `reply_compact` panics (`#13098` review). A gate whose engine can change
      # under it cannot attribute a red to a commit.
      #
      # `legacy: "false"` — this job replaced a ONE-service block (the passworded
      # service only), exactly like `test-track-b` / `test-concurrency-falkor`.
      # Starting the passwordless 16379 family here would be new surface this job
      # never had. `uri_graph` stays empty: the harness takes its graph from
      # `--graph-uri`, and the step below computes it from the ASSIGNED port.
      - name: Provision FalkorDB (ephemeral port, #6673)
        uses: ./.github/actions/falkordb-provision
        with:
          image: falkordb/falkordb-server:v4.20.6
          legacy: "false"
      # `pgvector/pgvector:pg16`, not `postgres:16`: `--bootstrap-record` applies
      # the product's own migrations, and `20261109000001_record_embedding_vector.sql`
      # (`CREATE EXTENSION vector`) reds on a server without pgvector (#11660).
      # `dsn_var: RECORD_DSN` keeps the name this workflow already used, so the
      # harness steps below read the DSN the provisioner exported.
      - name: Provision the record Postgres (ephemeral port, #9551)
        uses: ./.github/actions/postgres-provision
        with:
          image: pgvector/pgvector:pg16
          database: cypher_diff
          dsn_var: RECORD_DSN
      - uses: astral-sh/setup-uv@v7
      - name: Compute GRAPH_URI from the ASSIGNED port
        # The host port is Docker's, not a literal (see the job comment). The
        # `:?` guard makes a missing export a red step rather than a URI built
        # against `127.0.0.1:`, which would dial a closed port and report it as
        # a store that "could not run" — the same fail-loud form the `#6673`
        # consumers use in `python-ci.yml`.
        run: |
          echo "GRAPH_URI=docker://:falkordb@127.0.0.1:${TORTOISE_TEST_DOCKER_PORT:?the #6673 provision step did not export it}" >> "$GITHUB_ENV"
      - name: install (every extra named)
        run: uv sync --extra embeddings --extra parity --extra postgres --extra test
      # ⛔ THE HARNESS RUNS BEFORE THE CENSUS ON PURPOSE. The census pins are
      # ABSOLUTE counts over `tortoise/**`, so any product commit that lands
      # between this branch's merge-base and the merge commit moves them — and a
      # `pull_request` job checks out the MERGE commit. With the census first, a
      # base-drift pin stops the job before either harness step runs, so the
      # assertion this job EXISTS for ("the harness can fail") is never executed
      # and a census red masks whether the harness works at all. Ordered last, a
      # drifted pin still reds the job (it must — the doc's numbers are then
      # wrong) but it can no longer hide the differential evidence. The refresh
      # procedure is §7 of `docs/architecture/CYPHER-INVENTORY.md`.
      - name: install postgresql-client (the `psql` that `--bootstrap-record` drives)
        # ⛔ INSTALLING THE METAPACKAGE IS NOT PROVING THE BINARY EXISTS (measured, run
        # 44158572832 at `aff4eaef81`): `apt-get install postgresql-client` reported
        # `Setting up postgresql-client (16+257build1.1)` — nothing was even unpacked but
        # the metapackage, because the image already "satisfied" the dependency — and the
        # VERY NEXT step died with `cypher-diff: could not run — `psql` is not usable here:
        # FileNotFoundError: [Errno 2] No such file or directory: 'psql'`. A green install
        # step over a missing binary is exactly the no-op gate this workflow exists to
        # avoid, so the step now RESOLVES the binary, repairs PATH if the versioned client
        # landed outside it, and fails with the diagnostic rather than letting the harness
        # report it as "could not run" (exit 2) one step later.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client postgresql-client-common

          psql_bin="$(command -v psql || true)"
          if [ -z "$psql_bin" ]; then
            # Debian/Ubuntu put the versioned client under /usr/lib/postgresql/<n>/bin and
            # expose it through `postgresql-client-common`'s pg_wrapper at /usr/bin/psql.
            # A trimmed image can carry the former without the latter.
            dir="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)"
            if [ -n "$dir" ] && [ -x "$dir/psql" ]; then psql_bin="$dir/psql"; fi
          fi
          if [ -z "$psql_bin" ]; then
            # ⛔ SINGLE-QUOTED ON PURPOSE. Inside double quotes `psql` is COMMAND
            # SUBSTITUTION, not prose — and this line is reached only when the binary does
            # not resolve, so bash prints its own "command not found" into the middle of the
            # diagnostic and the substitution yields empty: the remedy text then reads "no
            # binary resolves", i.e. it loses the one word the operator needs (#13314 review).
            echo '::error::postgresql-client is installed but no `psql` binary resolves — checked PATH and /usr/lib/postgresql/*/bin. The harness drives `psql` directly, so this gate cannot run.'
            echo "--- diagnostics ---"
            dpkg -l 'postgresql-client*' 2>/dev/null | tail -5 || true
            ls -l /usr/bin/psql /usr/lib/postgresql/*/bin/psql 2>&1 || true
            exit 1
          fi
          # ⛔ A RESOLVABLE BINARY IS NOT A USABLE ONE, AND THE PROBE MUST BE A STATEMENT.
          # Two separate traps, both live on this runner:
          #   1. On Debian/Ubuntu /usr/bin/psql is `postgresql-client-common`'s pg_wrapper.
          #      It EXISTS and is EXECUTABLE with no versioned client installed, and then
          #      exits non-zero ("You must install at least one postgresql-client-<version>
          #      package"). `command -v` and `-x` are therefore both satisfied by a client
          #      that cannot run.
          #   2. A probe written as `echo "… $("$psql_bin" --version) …"` has its exit status
          #      DISCARDED: the substitution sits inside a word of `echo`, and under
          #      `set -euo pipefail` a failed substitution there does not abort, because the
          #      simple command's status is `echo`'s. The step would exit 0 over a broken
          #      client and the harness would report the identical exit 2 one step later,
          #      now misattributed to the DSN or the migrations — the outcome this step
          #      exists to prevent, with worse attribution (#13314 review P2).
          # Hence the probe is an `if` CONDITION, which a `set -e` script does observe.
          if ! psql_version="$("$psql_bin" --version 2>&1)"; then
            echo "::error::psql resolves at $psql_bin but cannot run: $psql_version"
            echo "--- diagnostics ---"
            dpkg -l 'postgresql-client*' 2>/dev/null | tail -5 || true
            ls -l "$psql_bin" /usr/lib/postgresql/*/bin/psql 2>&1 || true
            exit 1
          fi
          echo "psql: $psql_bin ($psql_version)"
          echo "$(dirname "$psql_bin")" >> "$GITHUB_PATH"
      - name: agreement run (must be EMPTY, exit 0)
        run: |
          for c in point-by-id point-listing point-by-absent-id; do
            uv run python tools/cypher_diff_harness.py \
              --graph-uri "$GRAPH_URI" --record-dsn "$RECORD_DSN" \
              --bootstrap-record --candidate "$c"
          done
      - name: mismatch run (must report a DIFFERENCE, exit 1)
        run: |
          set +e
          uv run python tools/cypher_diff_harness.py \
            --graph-uri "$GRAPH_URI" --record-dsn "$RECORD_DSN" \
            --candidate point-listing --mutate null-order
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::the mutated run returned $rc; the harness must report a difference (1). A 0 here means the harness cannot fail."
            exit 1
          fi
      - name: census doc-vs-tree pins (#2148/B1 — the ONLY place they gate)
        # ⛔ THIS STEP IS WHY THE PIN CAN BE DECOUPLED FROM THE MERGE GATE.
        # `tests/test_13098_cypher_inventory.py` is `core`-registered, so it rides
        # the REQUIRED `python-ci-gate` — and its doc-vs-tree arms compare
        # committed counts against the live tree, which ANY product commit can
        # move. #14296 reconciled nine open PRs / 115 files over that and still
        # failed. Those arms now skip unless this env is set, and this job — NOT
        # required, and path-filtered to `tortoise/**` + the census tool/doc — is
        # the one place that sets it. A genuinely wrong census therefore still
        # reds a job, on exactly the diffs that can make it wrong.
        #
        # The classifier/harness arms in the same file are NOT env-gated: they
        # pin behaviour, not a number that rots with the tree.
        env:
          TORTOISE_CYPHER_DOC_PIN: "1"
          # ⛔ THE SESSION FIXTURE FAILS WITHOUT THIS. `tests/conftest.py::
          # _p4_uri_required` REFUSES a URI-less session unless `TORTOISE_DB_URI`
          # or this flag is set, and this job exports no `TORTOISE_DB_URI` (its
          # stores reach the HARNESS through `--graph-uri`/`--record-dsn`, not
          # through the ambient env). MEASURED at this head: with the doc-pin env
          # set and this flag absent the file reports `90 errors, 0 skipped` —
          # every case, including the pin that asserts this step's own env, so
          # the step would gate NOTHING. (The `76 errors, 14 skipped` shape is a
          # DIFFERENT configuration: it is what you see when the doc pin is ALSO
          # unset, since the 14 skipped are exactly the `@requires_doc_pin` arms.)
          # `TORTOISE_TEST_CARVE_OUT` is the repo's URI-less-leg convention — the
          # same one `python-ci.yml` uses in `TORTOISE_TEST_CARVE_OUT: ${{
          # env.CARVE_OUT }}`.
          TORTOISE_TEST_CARVE_OUT: "1"
        run: uv run python -m pytest tests/test_13098_cypher_inventory.py -q -p no:cacheprovider
      - name: census pins match the doc (LAST of the checks — a base-drift pin must not mask the runs above)
        run: uv run python tools/cypher_inventory.py --check
      # ⛔ BOTH TEARDOWNS ARE UNCONDITIONAL (`if: always()`), and they are the
      # LAST steps: a failed or cancelled job must not leave a container holding
      # memory on a runner host shared by every other lane (#6673). They select
      # by the ownership label each provision step exported, so this job removes
      # exactly its own two containers and never a peer's.
      - name: Tear down the record Postgres (#9551)
        if: always()
        uses: ./.github/actions/postgres-teardown
      - name: Tear down FalkorDB (#6673)
        if: always()
        uses: ./.github/actions/falkordb-teardown
