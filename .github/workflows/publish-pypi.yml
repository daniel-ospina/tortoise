# Publish tortoise-graph + tortoise-client to PyPI (#258, #526)
#
# Uses PyPI Trusted Publishing (OIDC) — no password or long-lived token.
# One-time setup (whoever owns the PyPI account):
#   1. Create the project "tortoise-graph" on https://pypi.org
#   2. Add a "pending publisher" for GitHub repo daniel-ospina/tortoise,
#      workflow "publish-pypi.yml", environment "pypi" — see
#      https://docs.pypi.org/trusted-publishers/
#   3. Repeat for "tortoise-client" (environment "pypi-client") — the thin
#      driver dist built from client/ (#526).
# After that, every tagged release (v*) publishes both distributions
# automatically; the workflow can also be run manually from the Actions tab.

name: Publish to PyPI

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  id-token: write  # PyPI trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build==1.6.0
          python -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl --quiet
          cd /tmp && /tmp/wheelcheck/bin/python - <<'EOF'
          # #1929 pack shipping smoke (G1 gate, surface 1): the wheel must
          # ship the starter pack catalog + the sample transcript, and the
          # packaged default resolution must load it. Bound derived from the
          # INSTALLED constant (4 today, 5 once #1933 merges — never hardcoded).
          from pathlib import Path
          import tortoise
          from tortoise.pack_registry import PackRegistry, default_packs_dir
          from tortoise.pack_state import DEFAULT_STARTER_PACKS
          from tortoise.domain_loader import _get_registry

          packaged = Path(tortoise.__file__).resolve().parent / "packs"
          assert packaged.is_dir(), f"packaged packs dir missing: {packaged}"
          reg = PackRegistry(packaged)
          n = reg.load_all()
          bound = len(DEFAULT_STARTER_PACKS)
          assert n >= bound, f"wheel ships {n} packs < starter {bound}"
          assert set(reg.packs) >= set(DEFAULT_STARTER_PACKS), (
              f"wrong pack set: {sorted(reg.packs)} vs {sorted(DEFAULT_STARTER_PACKS)}")
          assert default_packs_dir() == packaged, f"resolver picked {default_packs_dir()}"
          r = _get_registry()
          assert r is not None and len(r.packs) >= bound, "domain_loader empty on wheel install"
          t = Path(tortoise.__file__).resolve().parent.parent / "tests" / "sample_transcript.txt"
          assert t.exists(), f"sample transcript missing: {t}"
          print(f"wheel pack smoke OK: {n} >= {bound}; transcript at {t}")
          EOF
          /tmp/wheelcheck/bin/tortoise --help >/dev/null 2>&1 \
            && echo "CLI entrypoint OK"
      - name: sdist presence check (#1929)
        # sdist must carry the catalog (MANIFEST.in stub include) — a wheel
        # rebuilt from it must still ship packs (verified by the slow suite;
        # here a cheap structural check).
        run: |
          tar tzf dist/*.tar.gz | grep -q 'tortoise/packs/__init__.py' \
            || { echo "::error::sdist missing tortoise/packs/__init__.py (MANIFEST.in regression)"; exit 1; }
          tar tzf dist/*.tar.gz | grep -qE 'packs/[^/]+/manifest\.yaml' \
            || { echo "::error::sdist missing pack manifests"; exit 1; }
          echo "sdist pack presence OK"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  build-client:
    # #526 — thin client dist: stage from client/ (Prefect pattern), build,
    # run the acceptance gate (clean venv, engine modules NOT importable,
    # no engine deps), upload as its own artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build the tortoise-client wheel + sdist
        run: bash client/build_client.sh
      - name: Acceptance gate (clean venv, client only)
        run: bash client/verify_client.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client
          path: dist-client/

  publish-client:
    needs: build-client
    runs-on: ubuntu-latest
    environment: pypi-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-client
          path: dist-client/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-client/
