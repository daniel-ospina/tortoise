name: Check CF Token
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== token verification ==="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -m json.tool
          echo "=== zone access test ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/e2f87d461a335b66235fcd11054baa7c" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | head -c 200
