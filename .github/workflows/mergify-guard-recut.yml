name: Mergify Guard Recut

# #5215 Task 4 / PR #6002 — the I10 freshness window's SELF-HEALING persister.
#
# WHY THIS EXISTS. I10's `verified_at` ages. The required `manifest-integrity`
# job's guard clause NO LONGER blocks on staleness (a timer that reds a required
# check freezes every PR in the repository while asserting nothing the digest
# does not already assert — see `tools/mergify_config_guard.py`, I10 FRESHNESS);
# it re-derives the digest and reports AUTO-REFRESHED. That removes the hazard
# but leaves the stored record aging, so this workflow is what keeps it fresh
# UNATTENDED: weekly it asks the guard whether the record is stale and, only if
# it is, re-cuts it from HEAD and opens a refresh PR.
#
# CHANGE-GATED AND DIGEST-AWARE: `--staleness` is a non-gating query (0 fresh /
# 1 stale with gate_digest == gate_digest(HEAD) / 2 unreadable or absent, i.e.
# UNKNOWN / 3 stale with gate_digest != gate_digest(HEAD)). A fresh record
# produces NO PR — zero weekly bot spam — and a DIVERGED record produces no
# re-cut either: state 3 means the gate DEFINITION changed, and overwriting the
# record's digest with HEAD's would launder a real, unreviewed gate change as a
# timestamp-only refresh. That path fails loudly instead and leaves the decision
# to a human. The pattern mirrors `ci-timing.yml`'s refresh job.
#
# NEVER A GATE: nothing here is in `python-ci-gate`'s `needs`, no step here can
# red a required check, and the refresh PR goes through the normal queue.

on:
  schedule:
    - cron: '10 5 * * 1' # Mondays 05:10 UTC — after ci-timing's 04:30 refresh
  workflow_dispatch:

# Read-only by default; the refresh job requests write at job level only.
permissions:
  contents: read

concurrency:
  group: mergify-guard-recut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        # Pinned: the guard parses YAML strictly; an unpinned dependency would
        # make an upstream release a silent change in what this workflow reads.
        run: pip install pyyaml==6.0.2

      - name: Re-cut the record only when it is stale AND its digest matches HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--staleness` is NON-GATING and DIGEST-AWARE: 0 fresh / 1 stale with
          # gate_digest == gate_digest(HEAD) / 2 unreadable or absent (UNKNOWN) /
          # 3 stale with gate_digest != gate_digest(HEAD). It is never run in the
          # required path, so it cannot red a pull request. Only status 1 may
          # reach the re-cut; every other non-zero status fails closed.
          status=0
          python3 tools/mergify_config_guard.py --staleness || status=$?
          case "$status" in
            0)
              echo "record is fresh — nothing to refresh"
              exit 0
              ;;
            1)
              echo "record is stale and its digest matches HEAD — only the timestamp moves"
              ;;
            2)
              echo "::error::the gate record is UNKNOWN (unreadable/absent digest) — refusing to re-cut from it"
              exit 1
              ;;
            3)
              echo "::error::the gate record's gate_digest DISAGREES with HEAD — the gate DEFINITION changed. The automatic re-cut is refused: it would rewrite the record's digest with HEAD's and launder a real, unreviewed gate change as a timestamp-only refresh. A human must review the gate diff and re-cut deliberately with 'python3 tools/mergify_config_guard.py --recut'."
              exit 1
              ;;
            *)
              echo "::error::--staleness returned an unrecognised status $status — refusing to re-cut"
              exit 1
              ;;
          esac
          # Prove from the record itself that the re-cut moves ONLY the
          # timestamp: capture the digest the record attests BEFORE the re-cut
          # and compare it to the digest AFTER. The PR body below reports the
          # result of THAT comparison instead of asserting it.
          before="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("gate_digest",""))' docs/ci/required-contexts.json)"
          head_digest="$(python3 tools/mergify_config_guard.py --print-digest)"
          if [ "$before" != "$head_digest" ]; then
            echo "::error::record digest ($before) != HEAD digest ($head_digest) despite the staleness gate — refusing to re-cut"
            exit 1
          fi
          echo "record is stale — re-cutting it from HEAD"
          python3 tools/mergify_config_guard.py --recut
          after="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("gate_digest",""))' docs/ci/required-contexts.json)"
          if [ "$after" != "$before" ]; then
            echo "::error::the re-cut MOVED the digest ($before -> $after) — the refresh is not timestamp-only; discarding it and failing loudly"
            git checkout -- docs/ci/required-contexts.json
            exit 1
          fi
          if git diff --quiet -- docs/ci/required-contexts.json; then
            echo "re-cut produced no change — no PR needed"
            exit 0
          fi
          BRANCH="chore/mergify-guard-recut-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "refresh branch $BRANCH already exists — skipping"
            exit 0
          fi
          echo "record refreshed — opening refresh PR"
          git switch -c "$BRANCH"
          git add docs/ci/required-contexts.json
          git -c user.name="tortoise-ci[bot]" -c user.email="actions@github.com" \
            commit -m "chore(ci): re-cut the mergify gate digest (#5215 Task 4)"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(ci): re-cut the mergify gate digest (#5215 Task 4)" \
            --body "Self-healing refresh of docs/ci/required-contexts.json: the record's verified_at had exceeded the I10 freshness window while its gate_digest still matched HEAD. That equality was CHECKED in this job before and after the re-cut (${after:0:12}...), so the digest is unchanged and only the attestation timestamp moves. No gate-definition change. Auto-merged per repo policy."
