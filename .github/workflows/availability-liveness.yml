# availability-liveness (#4573) — the INDEPENDENT liveness check for the
# availability pager.
#
# WHY A SEPARATE WORKFLOW. The watchdog it checks (availability-watchdog.yml)
# is fail-closed for a broken CHANNEL (#3887), but a dead MONITOR — the
# workflow disabled, GitHub dropping the schedule, a crash before the down path
# — produces NO RUN AT ALL. No run means no escalation and a silent log, so
# "the pager is dead" is indistinguishable from "all clear". This workflow is
# the external observer that closes that class. It MUST be a different workflow
# with its own schedule: a check that lives inside availability-watchdog.yml is
# silenced by `gh workflow disable availability-watchdog` — the very failure it
# is meant to catch.
#
# CHANNEL INDEPENDENCE (the load-bearing property). The heartbeat travels
# watchdog -> rolling GitHub issue body. This checker reads that body and
# alarms through a GitHub issue PLUS a failing run (GitHub's own failure
# notifications) — it never calls Telegram, and it does not read the incident
# issue the Telegram leg is keyed on. A dead Telegram bot therefore cannot
# silence the check on Telegram. (Residual: a GitHub Actions outage takes both
# halves out; closing that needs an endpoint external to GitHub, which is an
# external account + an owner decision, deliberately out of scope — stated in
# the runbook, not hidden.)
#
# CADENCE. Cron intent is irrelevant to a dead-man switch; the threshold is
# MEASURED. Run this every 30 min so the check itself is not the bottleneck;
# the staleness bound (HEARTBEAT_MAX_AGE_MIN, default 90 = 3x the measured p95
# inter-arrival of ~28.6 min) is in the script's header, with the 14.2-day
# population it was measured from.
name: availability-liveness

on:
  schedule:
    # Every 30 minutes. GitHub's scheduled delivery is best-effort, so treat
    # every timestamp as approximate — the script's threshold, not this cron,
    # is what tolerates that.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Never overlap: two runs would race on the same alert issue.
concurrency:
  group: availability-liveness
  cancel-in-progress: false

# contents: read for actions/checkout; issues: write for the alert issue;
# actions: read for the LIVENESS workflow's own created_at — the age of this
# feature, used to tell a fresh deploy (nothing to verify yet) from a monitor
# that should have run. Deliberately NOT the watchdog workflow's age: that would
# alarm from the first run (see availability-liveness.sh's header).
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    # ── HOSTED-ONLY PIN (deliberate, measured 2026-10-27) ─────────────
    # `ubuntu-latest` is served by BOTH GitHub-hosted runners AND this repo's
    # self-hosted pool — the pool advertises it WHILE the fallback is engaged
    # (`scripts/ci_runner_gate.sh`; docs/ops/ci-runner-x64.md:25), so that is a
    # CONDITIONAL property, not a standing one: measured again on 2026-10-27 with
    # the fallback disengaged, none of the nine runners carried it. Measured over
    # these four workflows' own SCHEDULED runs on 2026-10-27 (115 runs, 00:00-12:00
    # UTC, jobs classified by `runner_name`): 83 created a job - 72 served by a
    # GitHub-hosted runner, 11 by this repo's self-hosted runners (10 of them
    # `pi-runner-*`, 1 `cmux`) - and 32 never got a runner at all.
    # So the pin is not "escape a queue that is always the pool"; it removes
    # the arm that FAILS.
    #
    # The pool arm does not starve — it HANGS, and it also fails fast. Of those
    # 11 self-hosted jobs, TWO hung in `actions/checkout` and were killed at the
    # job's OWN `timeout-minutes`, with the measuring step SKIPPED, which reads
    # as a finished run that measured nothing; TWO failed in 9s/36s with the
    # payload step actually run; SEVEN completed normally (10-46s). So the pin
    # does not say "the pool never works" — it says the pool cannot be relied on
    # to MEASURE. Both cited runs are `ci-queue-health`'s, whose timeout is
    # `10`; this block is shared by four workflows with different timeouts
    # (`repair` is `15`), so it names no single job's number as its own:
    #     run 40456347720 → pi-runner-vm-2: checkout 8m40s, then cancelled
    #     run 40451686065 → pi-runner-vm-4: checkout 4m41s, then cancelled
    # (same day: 9/9 runners busy, 78 runs queued, and `ci-queue-health`
    # completed 1 of its last 8 scheduled runs — 6 cancelled, 1 pending.)
    #
    # ⛔ THE PIN IS NOT A COMPLETE FIX, and this comment must not read as one.
    # Hosted is queued too: 18 jobs were waiting on `ubuntu-24.04` with a max
    # wait of 56m, and one `ci-queue-health` job waited 65 minutes for a hosted
    # runner and then ran 15 seconds. GitHub keeps only ONE pending run per
    # concurrency group, so while a wait exceeds this workflow's cadence each
    # tick still cancels the previous PENDING tick. The pin removes the arm that
    # hangs and usually serves in minutes; the cadence/concurrency question stays
    # open and is tracked separately.
    #
    # `ubuntu-24.04` is HOSTED-ONLY for THIS job by choice, but NOT — any more —
    # because the pool cannot answer it. Since the 2026-10-29 mitigation (#6897
    # suspended; docs/ops/ci-runner-x64.md, "the label contract") the installer
    # CAN emit `…,ubuntu-24.04` under `CI_RUNNER_OS_LABEL=on|auto`
    # (tools/install-ci-runner-x64.sh; the flag defaults to `off`, so nothing
    # changes for a box that does not set it) and an ORPHANED re-registration
    # derives the same fact (tools/runner_autoscale.py) — so the premise this
    # comment was written on ("`ubuntu-24.04` is claimed by no self-hosted
    # runner") is FALSE. ⛔ WHAT DOES **NOT** HOLD IT: `_preserve_labels` still
    # DROPS a version pin on RE-registration and nothing in this tree
    # re-attaches it on that path, so a re-registered runner loses the label
    # until someone runs `--repair-labels` on a box whose OWN resolution
    # claims it (`on`, or `auto` on a host whose `/etc/os-release` reports
    # 24.04 — a DECLINING `auto` claims nothing and drops it with the rest of
    # the family) or reinstalls. `--status`' `label-coverage` exit 5 is what makes
    # that visible; re-measure rather than trusting this text:
    # `gh api repos/<owner>/<repo>/actions/runners`. The installer never hands
    # `config.sh` a version pin with the flag off — pinned at
    # `tests/test_ci_runner_x64_install.py:230`.
    # ⛔ THE COST, STATED: GitHub's label matching is cumulative and unscoped
    # (github/docs, "Using self-hosted runners in a workflow"), so while the
    # mitigation is engaged this observer is POOL-ELIGIBLE — and a guard whose
    # job is to report on a full pool can sit in `actions/checkout` behind that
    # very backlog, then die at its own `timeout-minutes` with the measuring step
    # SKIPPED: quiet precisely during the hosted outage it exists to surface.
    # `runs-on:` cannot scope that away, because the mitigation is label-wide and
    # not leg-scoped. Keep the pin for what it still buys — on a healthy day this
    # leg lands on hosted and spends no pool slot and no fleet quota — and if the
    # mitigation becomes permanent, re-scope this leg onto a label only hosted
    # answers. Public repo, so hosted minutes are free: this spends nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # persist-credentials: false — this job only reads a file; the workflow
      # token carries issues:write and must not be written into .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # The checker reads the heartbeat with `gh api search/issues`. Until #9018
      # that call was wrapped as `if ! out="$(gh … 2>/dev/null)"`, so a missing
      # binary — measured 2026-10-24 on `pi-runner-vm-3` — had its `command not
      # found` swallowed and surfaced as the checker's own FAIL-CLOSED verdict,
      # "heartbeat search failed". The verdict was right; the attribution was
      # fiction. The wrapper now keeps gh's words, and this step provides the
      # tool or fails NAMING it, before the checker's own logic runs.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh
      - name: Check the pager's heartbeat (#4573)
        env:
          # Actions does NOT export GITHUB_TOKEN itself, so GH_TOKEN must be
          # named explicitly or the checker is deaf (#2140). STEP-level only: a
          # job-level env is handed to actions/checkout too.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional operator override of the staleness bound. Unset expands to
          # EMPTY, which is the script's measured default (90 min). It must be a
          # PLAIN INTEGER; anything else (`2h`, `-1`, `0.5`) is rejected with a
          # warning and falls back to the default — digit-stripping such a value
          # would turn `2h` into a 2-minute (always-alerting) bound. Raising the
          # value trades detection latency for fewer false alarms; LOWERING it
          # below the measured p95 (~29 min) sits inside GitHub's own scheduling
          # jitter and WILL false-fire (measured max gap 63.5 min) — the script
          # warns but honours an explicit choice.
          HEARTBEAT_MAX_AGE_MIN: ${{ vars.HEARTBEAT_MAX_AGE_MIN }}
        run: bash .github/scripts/availability-liveness.sh
