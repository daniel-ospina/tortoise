# tenant-provision log monitor (#1133)
#
# The #1110 incident (browser signups blocked by missing CORS headers) was
# discovered by a USER, not by any signal. The function now logs its
# incident-class failures server-side (rejected origin, FASTAPI_URL
# misconfig, provision_team failure, uncaught handler errors) — this
# workflow is the consume side: hourly, it queries the project's unified
# logs stream for tenant-provision error markers and opens a DEDUPLICATED
# GitHub issue (with log evidence) when any appear, then fails visibly.
#
# Uses the Management API analytics endpoint (the old logs.all endpoint is
# removed 2026-09-23 — see supabase.com/changelog/48235):
#   GET /v1/projects/{ref}/analytics/endpoints/logs?sql=<ClickHouse>&
#       iso_timestamp_start=...&iso_timestamp_end=...
# Requires the repo's SUPABASE_ACCESS_TOKEN to carry analytics_logs_read
# (OAuth scope: analytics:read). A 403 on dispatch means the token lacks
# the scope — generate one with it in Supabase → Account → Access tokens.

name: Monitor tenant-provision logs

on:
  schedule:
    - cron: "17 * * * *" # hourly, :17 (staggered off the top of the hour)
  workflow_dispatch:

concurrency:
  group: tenant-provision-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ybetwichurajbfswfeqa
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan tenant-provision logs for incident markers
        run: |
          set -euo pipefail
          start="$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)"
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sql="select timestamp, event_message from logs where source = 'function_logs' and event_message like '%tenant-provision%' order by timestamp desc limit 500"
          out="$(curl -sS -G "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$sql" \
            --data-urlencode "iso_timestamp_start=$start" \
            --data-urlencode "iso_timestamp_end=$end")"
          err="$(printf '%s' "$out" | jq -r '.error // empty')"
          if [ -n "$err" ]; then
            echo "::error::log query failed: $err"
            exit 1
          fi
          # NOTE: "AUTH_HOOK_SECRET is not set" is deliberately EXCLUDED — it
          # fires on every unauthenticated 401 by design (fail-closed Path 2,
          # hook inert since #832). It becomes meaningful only if the hook is
          # re-enabled (#1120); re-add it to the marker list then.
          hits="$(printf '%s' "$out" | jq -r '.result[]? | select(.event_message != null) | .event_message' \
            | grep -F \
              -e "rejected origin not in allowlist" \
              -e "FASTAPI_URL is not set" \
              -e "Provisioning misconfigured" \
              -e "provision_team failed" \
              -e "tenant-provision error" \
            | sort -u | head -20 || true)"
          if [ -n "$hits" ]; then
            title="[monitor] incident-class errors in tenant-provision logs ($SUPABASE_PROJECT_REF)"
            existing="$(gh api "search/issues" \
              -f q="repo:$GITHUB_REPOSITORY is:issue is:open in:title \"$title\"" \
              --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "$existing" -eq 0 ]; then
              body="Automatic alert from the hourly tenant-provision log monitor (workflow: $GITHUB_WORKFLOW, run: $GITHUB_RUN_ID).

          Evidence (last 3h, deduplicated event_message lines):
          \`\`\`
          $hits
          \`\`\`

          Investigate Supabase function logs: https://supabase.com/dashboard/project/$SUPABASE_PROJECT_REF/logs/edge-functions"
              gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body="$body" >/dev/null
              echo "::notice::opened monitor issue for incident-class errors"
            else
              echo "::notice::monitor issue already open — not duplicating"
            fi
            echo "::error::incident-class markers found in tenant-provision logs:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "✅ no incident-class markers in the last 3h of tenant-provision logs"
