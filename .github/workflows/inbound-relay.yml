# Inbound GitHub relay (#2441) — close-and-queue external issues/PRs.
#
# On issues:opened / pull_request_target: label, comment, close, and relay
# the record to the canonical intake endpoint (#2439).
#
# Safety: runs on pull_request_target for fork PRs (NEVER checks out or
# executes the PR's code — REST-only: label/comment/close + metadata relay).
# Supply-chain-safe by construction.
#
# v1 = close-only for PRs (reopen-on-approval gated on #2437, now landed).
#
# Env secrets:
#   INBOUND_URL              — inbound-ingest edge function URL
#   INBOUND_SECRET_GITHUB    — per-source secret for the "github" source
#                              (set on the tortoise repo, not the swarm repo)

name: "Inbound relay — GitHub → intake"
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# Bookkeeping, not a merge gate — and the one per-event workflow here whose
# job-level `if:` already excludes the owner and the merge queue's own batch
# PRs (all internal traffic) at ZERO runner cost, so it cannot flood (#9115).
# The group still belongs here so a re-run of the SAME unit supersedes rather
# than racing itself: it is keyed PER UNIT and never cancelled in flight,
# because this relay
# CLOSES fork PRs and a cancel between the close and the intake POST would leave
# a closed PR with no intake record — a half-applied action no re-run repairs.
#
# ⛔ The per-unit key does NOT bound a burst across DIFFERENT units (N opened
# events are N groups and all N run). The bound here is the job-level `if:`, not
# the concurrency key — see PER_UNIT_GROUP_OK in
# tests/test_reporting_workflow_concurrency.py.
concurrency:
  group: inbound-relay-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    # Safety: events whose actor is the repository OWNER are never processed —
    # that traffic flows through normal development, not the intake relay.
    # Owner-installed automation belongs to that same class, and the merge
    # queue's own batch pull requests must be exempt (#3558, #5185).
    #
    # WHAT THIS GUARD IS FOR. `pull_request_target` + REST-only (label, comment,
    # close, relay — see the header): the relay never checks out or executes a
    # PR's code, so this is an INTAKE rule, not the CI trust boundary. Its
    # decision rule, stated once and with no "outside the repository" qualifier,
    # is: every `opened` issue/PR whose actor is not the owner AND which is not
    # the queue's own batch is labelled, commented, closed and relayed to
    # intake — same-repo collaborators INCLUDED (pinned by a test). Do not
    # re-read this as "fork PRs only": that misreading is how #5185 stayed
    # invisible while it was closing every queue batch.
    #
    # WHY IT BROKE (#3558, #5185). The gate used to be `github.actor !=
    # 'daniel-ospina'` — "the owner is the only legitimate author". Mergify
    # validates a queued PR on a DRAFT batch PR it opens from a queue branch,
    # authored by an app, so the relay closed the batch ~9 s after it opened and
    # Mergify dequeued the PR it was validating ("The batch pull request has
    # been closed"). Every queued merge was lost, fleet-wide. The first fix
    # (#5221) exempted the LITERAL `mergify[bot]`: it fixed that day's outage
    # and rotted — a renamed app, a different queue engine, or a reconfigured
    # branch prefix re-breaks it silently, and nothing goes red until the queue
    # stops merging again.
    #
    # WHAT IT KEYS ON NOW — evidence, never a list of names. Mergify's docs
    # ("Recognize a Queue Pull Request") name four markers and state that only
    # ONE holds for every queue pull request, "whoever opens it and whatever
    # state it is in": the head branch, `queue_branch_prefix` + 10 hex. The
    # other three have documented exceptions — `draft_bot_account` opens the
    # batch under a USER account, `merge-batch` marks the draft ready for review
    # before merging, and developers open drafts too. So:
    #
    #   belt 1 (primary, AUTHOR-AGNOSTIC): the head branch is a QUEUE-OWNED
    #     branch — this repository's own branch, under the queue's configured
    #     prefix. `.mergify.yml` sets no `queue_branch_prefix`, so the
    #     documented default applies; `tests/test_inbound_relay_guard.py` reads
    #     the prefix from that file and fails if this literal drifts from it.
    #
    #   belt 2 (redundancy, survives the prefix being reconfigured): author
    #     identity from GitHub's own `user.type` field — an installed GitHub App
    #     cannot be impersonated by a contributor — combined with a same-repo
    #     head and the queue's base branch (the repository's default branch).
    #     Deliberately NOT narrowed by `draft`: a ready-for-review batch is still
    #     a batch. Two assumptions are pinned by tests, so neither rots quietly:
    #     every queue rule's branch prefix is covered by belt 1, and every queue
    #     rule's `base=` is the SAME single base (belt 2 covers one base — a rule
    #     on a second base needs its own belt, and the test says so).
    #     Its cost is that a bot-authored same-repo PR to the default
    #     branch is not closed by intake; that is a recoverable triage miss,
    #     while closing a batch dequeues the whole queue — the asymmetry decides.
    #
    # FAIL CLOSED. Every EXEMPTION clause lives inside the `!( … )`, so an event
    # whose payload is missing or unreadable (no `pull_request`, a null
    # `head.repo`, an absent `user.type`, no `base.ref`, no `default_branch`)
    # makes the exemption false and the relay CLOSES the PR — the pre-existing
    # behaviour for anything it cannot classify as the queue's own batch. Note
    # the belt-2 base arm's `!= ''`: without it, TWO unreadable fields compare
    # equal (`null == null` is true in Actions' loose equality) and an all-absent
    # payload would read as a match (review B, cycle 2). The two clauses OUTSIDE
    # the negation (the event allow-list and the owner exclusion) have the
    # opposite polarity on purpose: false there suppresses the relay entirely,
    # and moving an exemption clause out there would invert it. Each fail-closed
    # case is pinned by a test.
    if: |
      (github.event_name == 'issues' || github.event_name == 'pull_request_target') &&
      github.actor != 'daniel-ospina' &&
      !(github.event_name == 'pull_request_target' && (
        (github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')) ||
        (github.event.pull_request.user.type == 'Bot' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.base.ref != '' &&
         github.event.pull_request.base.ref == github.event.repository.default_branch)
      ))
    steps:
      - name: "Comment and close — issue"
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const repoFull = context.payload.repository;
            const owner = repoFull.owner.login;
            const repo = repoFull.name;
            const issueNumber = context.issue.number;

            // Add label
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issueNumber,
              labels: ['queued-for-triage'],
            });

            // Comment
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: [
                '👋 Thanks for submitting!',
                '',
                'This has been **queued for triage** and will be processed by our intake agent.',
                'You\'ll be notified when an agent picks it up.',
                '',
                '— Premise Labs (automated relay)',
              ].join('\n'),
            });

            // Close
            await github.rest.issues.update({
              owner, repo, issue_number: issueNumber,
              state: 'closed',
              state_reason: 'not_planned',
            });

            // Return metadata for the relay POST step
            return {
              item_type: 'issue',
              title: issue.title,
              body: issue.body || '',
              reporter: issue.user.login,
              actor: {
                login: issue.user.login,
                type: issue.user.type,
              },
              labels: issue.labels.map(l => typeof l === 'string' ? l : l.name),
              url: issue.html_url,
              source_item_id: `issue-${issueNumber}`,
            };

      - name: "Comment and close — pull request"
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const repoFull = context.payload.repository;
            const owner = repoFull.owner.login;
            const repo = repoFull.name;
            const prNumber = context.payload.pull_request.number;

            // Add label
            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber,
              labels: ['queued-for-triage'],
            });

            // Comment
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                '👋 Thanks for the contribution!',
                '',
                'This PR has been **queued for review** and will be processed by our intake agent.',
                'You\'ll be notified when an agent picks it up.',
                '',
                '> ⚠️ **Note:** External PRs are close-only in v1. If your PR is selected for',
                '> review, it will be reopened for the review process.',
                '',
                '— Premise Labs (automated relay)',
              ].join('\n'),
            });

            // Close
            await github.rest.pulls.update({
              owner, repo, pull_number: prNumber,
              state: 'closed',
            });

            // Return metadata for the relay POST step
            const pr = context.payload.pull_request;
            return {
              item_type: 'pull_request',
              title: pr.title,
              body: pr.body || '',
              reporter: pr.user.login,
              actor: {
                login: pr.user.login,
                type: pr.user.type,
              },
              labels: pr.labels.map(l => l.name || l),
              url: pr.html_url,
              source_item_id: `pr-${prNumber}`,
              head_ref: pr.head.ref,
              head_repo: pr.head.repo ? pr.head.repo.full_name : 'unknown',
            };

      - name: "Relay to intake endpoint"
        id: relay
        uses: actions/github-script@v7
        env:
          INBOUND_URL: ${{ secrets.INBOUND_URL }}
          INBOUND_SECRET_GITHUB: ${{ secrets.INBOUND_SECRET_GITHUB }}
        with:
          script: |
            const inboundUrl = process.env.INBOUND_URL;
            const inboundSecret = process.env.INBOUND_SECRET_GITHUB;
            // `actions/github-script` already injects `core` (@actions/core)
            // into the script scope — redeclaring it here is a SyntaxError
            // ("Identifier 'core' has already been declared") that aborted
            // the whole step before the intake POST. Do not re-add (#5220).

            // Re-read the event to figure out what we're relaying
            const event = context.payload;
            let payload;

            if (context.eventName === 'issues') {
              const issue = event.issue;
              payload = {
                source: 'github',
                source_item_id: `issue-${issue.number}`,
                payload: {
                  subject: issue.title,
                  body: issue.body || '',
                  labels: (issue.labels || []).map(l => l.name || l),
                  url: issue.html_url,
                  number: issue.number,
                },
                context_ref: issue.html_url,
                reporter: issue.user.login,
                actor: {
                  login: issue.user.login,
                  type: issue.user.type,
                },
                severity: null,
              };
            } else {
              const pr = event.pull_request;
              payload = {
                source: 'github',
                source_item_id: `pr-${pr.number}`,
                payload: {
                  subject: pr.title,
                  body: pr.body || '',
                  labels: (pr.labels || []).map(l => l.name || l),
                  url: pr.html_url,
                  number: pr.number,
                  head_ref: pr.head.ref,
                  head_repo: pr.head.repo ? pr.head.repo.full_name : null,
                },
                context_ref: pr.html_url,
                reporter: pr.user.login,
                actor: {
                  login: pr.user.login,
                  type: pr.user.type,
                },
                severity: null,
              };
            }

            console.log(`Relaying ${payload.source_item_id} to ${inboundUrl}`);

            const response = await fetch(inboundUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-inbound-secret': inboundSecret,
              },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Intake relay failed (${response.status}): ${body}`);
            } else {
              const result = await response.json();
              console.log(`Intake relay OK: ${JSON.stringify(result)}`);
              core.setOutput('relay_status', result.status);
              core.setOutput('relay_id', result.id);
            }