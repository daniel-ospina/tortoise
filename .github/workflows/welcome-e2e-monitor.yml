# Live signup-funnel monitor (#801) — moved OFF the per-PR path (queue-health,
# #1008): the per-PR live runs competed with real traffic for shared prod rate
# buckets and flaked CI on unrelated PRs. Now runs on a schedule + after merges
# to main; failures auto-file an issue (the monitor's signal) instead of
# blocking the merge queue. The mocked welcome-page suite runs per-PR in
# ci.yml's welcome-e2e job (secret-free); this job's UNIQUE value is the
# live-prod browser run.
#
# The smoke targets the #801 server-first signup path AS IT IS SERVED AFTER
# #4054: the form POSTs SAME-ORIGIN to the app origin's `/auth/signup`, which
# proxies `POST {API_ORIGIN}/v1/signup/email` (hosted API → GoTrue Admin,
# email_confirm=true) — NO confirmation email is sent, so the smoke does NOT
# consume the SMTP email bucket (the pre-#801 "1 email-send per run" rationale
# is stale; the no-429 signal is the signup endpoint's own rate buckets).
#
# The assertion moved to the BFF boundary when the BFF moved to the app origin:
# the browser no longer calls Supabase for signup, and a Worker's outbound fetch
# is invisible to `page.on("response")`, so watching for `v1/signup/email`
# watched a URL the page never requests. See tests/e2e/test_welcome_page.py.
name: welcome-e2e-monitor

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours — smoke is cheap (no email send)
  # #9115: NOT every push to main. This monitor is a REPORT — it never gates a
  # merge — and it probes PRODUCTION, so the only thing a push can tell it is
  # "a file this smoke reads just changed". Under a merge flood (~50 lanes) the
  # unfiltered trigger started this job on every merge, where `cancel-in-progress`
  # then killed it on the NEXT merge: measured 2026-10-19, 13 run-minutes spent
  # to produce almost no completed reading — pure slot theft from `python-ci-gate`.
  # The 2-hourly schedule still catches prod drift that no push causes (the
  # live-funnel risk this workflow exists for).
  #
  # ⛔ `workflow_dispatch:` below is ADDED by this change (main had schedule +
  # push only). It shares the cancel-in-progress group with the schedule, so a
  # manual dispatch would kill an in-flight scheduled prod reading — on the one
  # workflow whose whole purpose is completing a reading. The group is keyed by
  # EVENT NAME so the two arms supersede only themselves.
  push:
    branches: [main]
    paths:
      # The signup path this smoke drives, served by the website + its BFF.
      - 'website/**'
      # The suites the job runs (pytest + the two node harnesses).
      - 'tests/e2e/test_welcome_page.py'
      - 'tests/test_waitlist_form.py'
      - 'tests/test_waitlist_subscribe.mjs'
      - 'tests/test_tenant_provision_cors.mjs'
      # `tests/test_waitlist_form.py` READS these: it derives the expected
      # endpoint from `supabase/config.toml`'s project_id and asserts against a
      # migration + a function definition. Without them a supabase-only push
      # can red the suite with no trigger here — the filter would be narrower
      # than what the suite actually reads.
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      # The job also INSTALLS the package (`pip install -e '.[test]'`) and runs
      # pytest, so it reads `pyproject.toml` and both conftests before a single
      # assertion executes. Same hazard as the supabase files above: a change
      # there can red this suite with no trigger.
      - 'pyproject.toml'
      - 'tests/conftest.py'
      - 'tests/e2e/conftest.py'
      # The auto-dedupe script the failure arm runs.
      - '.github/scripts/welcome-e2e-monitor.sh'
      # Self-trigger: an edit here takes effect on the merge that makes it,
      # rather than only on the next 2-hourly tick.
      - '.github/workflows/welcome-e2e-monitor.yml'
  workflow_dispatch:

concurrency:
  # Keyed by EVENT so a manual dispatch cannot cancel a scheduled prod reading
  # (and vice versa); `cancel-in-progress: true` still makes a newer run of the
  # SAME arm supersede the older one, which is what bounds this report.
  group: welcome-e2e-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  welcome-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #2140: the auto-file step POSTs to the issues API with GITHUB_TOKEN;
    # the org's restricted default token has no write scope, so the step was
    # 403ing ("Resource not accessible by integration") — the deaf monitor
    # never filed issues. Grant the job the minimal scopes: contents: read
    # for checkout, issues: write for the auto-file curl.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # --experimental-strip-types needs >= 22.6 (#373 harness)
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run welcome page E2E + waitlist static tests (#373)
        run: python -m pytest tests/e2e/test_welcome_page.py tests/test_waitlist_form.py -q -rs -p no:cacheprovider
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Epic #1647 Task 10 (P4): URI-less e2e surface — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
      - name: Warn if live signup smoke is skipping (no-429 monitor off)
        if: always()
        # The secrets must be passed to THIS step too — without an env block the
        # vars are always empty and the warning fires even when the live smoke
        # ran with creds (#1067; the monitor copy of the job lost this env block
        # when #1181 extracted it — restored 2026-08-14, #1189).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::live signup smoke is SKIPPED — SUPABASE_URL/SUPABASE_SERVICE_KEY secrets missing; the #801 no-429 monitor is OFF"
          else
            echo "secrets present — live signup smoke will run"
          fi
      - name: Run waitlist edge-function behavioral harness (#373)
        run: node --experimental-strip-types tests/test_waitlist_subscribe.mjs
      - name: Run tenant-provision CORS runtime harness (#1110)
        # Preserved from the old ci.yml welcome-e2e job when it moved here
        # (#1181/#1189) — this is its only runner.
        run: node --experimental-strip-types tests/test_tenant_provision_cors.mjs
      - name: Auto-file issue on failure (monitor signal — never blocks merges)
        if: failure()
        # #2706/#2850: ONE issue per failing streak, never one per run. The old
        # title embedded `run ${{ github.run_id }}`, so every failing run created a
        # NEW issue — 59 open near-identical duplicates at the 2026-09-11
        # census (#2231 → present, still accumulating until this lands — see
        # #3014, which re-measures at cleanup time). The title is now
        # STABLE and acts as the dedupe key: search for an open issue with it
        # and COMMENT (with the run link) instead of creating another one.
        # FORWARD-LOOKING ONLY: the pre-existing duplicates carry the OLD
        # title and are deliberately NOT adopted by this search (adopting one at
        # random would be worse than filing one clean tracker). They need a
        # one-time bulk cleanup — filed as #3014.
        # A failed search refuses to file (never duplicate) but fails the step
        # loudly, so the monitor can never go silently deaf.
        #
        # The logic lives in .github/scripts/welcome-e2e-monitor.sh so it can be
        # TESTED (.github/scripts/welcome-e2e-monitor.test.sh, run by the
        # availability-watchdog CI lane). The #3064 round-2 review found the
        # inline version deduped on TITLE ALONE — on this PUBLIC repo any
        # external account could open an issue with our title and be adopted as
        # the state carrier. The script carries the same author guard the
        # availability watchdog uses (`author:app/github-actions` + a
        # `user.type`/`user.login` re-check) and fails safe (a fresh machine
        # issue) on a non-machine match.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/welcome-e2e-monitor.sh
