# Live signup-funnel monitor (#801) — moved OFF the per-PR path (queue-health,
# #1008): the per-PR live runs competed with real traffic for shared prod rate
# buckets and flaked CI on unrelated PRs. Now runs on a schedule + after merges
# to main; failures auto-file an issue (the monitor's signal) instead of
# blocking the merge queue. The mocked welcome-page suite runs per-PR in
# ci.yml's welcome-e2e job (secret-free); this job's UNIQUE value is the
# live-prod browser run.
#
# The smoke targets the #801 server-first signup path: the form POSTs to
# /v1/signup/email (hosted API → GoTrue Admin, email_confirm=true) — NO
# confirmation email is sent, so the smoke does NOT consume the SMTP email
# bucket (the pre-#801 "1 email-send per run" rationale is stale; the no-429
# signal is the signup endpoint's own rate buckets).
name: welcome-e2e-monitor

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours — smoke is cheap (no email send)
  push:
    branches: [main]

concurrency:
  group: welcome-e2e
  cancel-in-progress: true

jobs:
  welcome-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # #2140: the auto-file step POSTs to the issues API with GITHUB_TOKEN;
    # the org's restricted default token has no write scope, so the step was
    # 403ing ("Resource not accessible by integration") — the deaf monitor
    # never filed issues. Grant the job the minimal scopes: contents: read
    # for checkout, issues: write for the auto-file curl.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # --experimental-strip-types needs >= 22.6 (#373 harness)
      - run: pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Run welcome page E2E + waitlist static tests (#373)
        run: python -m pytest tests/e2e/test_welcome_page.py tests/test_waitlist_form.py -q -rs -p no:cacheprovider
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Epic #1647 Task 10 (P4): URI-less e2e surface — the URI-required
          # enforcement opt-in.
          TORTOISE_TEST_CARVE_OUT: "1"
      - name: Warn if live signup smoke is skipping (no-429 monitor off)
        if: always()
        # The secrets must be passed to THIS step too — without an env block the
        # vars are always empty and the warning fires even when the live smoke
        # ran with creds (#1067; the monitor copy of the job lost this env block
        # when #1181 extracted it — restored 2026-08-14, #1189).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::live signup smoke is SKIPPED — SUPABASE_URL/SUPABASE_SERVICE_KEY secrets missing; the #801 no-429 monitor is OFF"
          else
            echo "secrets present — live signup smoke will run"
          fi
      - name: Run waitlist edge-function behavioral harness (#373)
        run: node --experimental-strip-types tests/test_waitlist_subscribe.mjs
      - name: Run tenant-provision CORS runtime harness (#1110)
        # Preserved from the old ci.yml welcome-e2e job when it moved here
        # (#1181/#1189) — this is its only runner.
        run: node --experimental-strip-types tests/test_tenant_provision_cors.mjs
      - name: Auto-file issue on failure (monitor signal — never blocks merges)
        if: failure()
        # #2706/#2850: ONE issue per failing streak, never one per run. The old
        # title embedded `run ${{ github.run_id }}`, so every failing run created a
        # NEW issue — 59 open near-identical duplicates at the 2026-09-11
        # census (#2231 → present, still accumulating until this lands — see
        # #3014, which re-measures at cleanup time). The title is now
        # STABLE and acts as the dedupe key: search for an open issue with it
        # and COMMENT (with the run link) instead of creating another one.
        # FORWARD-LOOKING ONLY: the pre-existing duplicates carry the OLD
        # title and are deliberately NOT adopted by this search (adopting one at
        # random would be worse than filing one clean tracker). They need a
        # one-time bulk cleanup — filed as #3014.
        # A failed search refuses to file (never duplicate) but fails the step
        # loudly, so the monitor can never go silently deaf.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="live-signup-monitor: welcome-e2e failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="Monitor failure — run: ${run_url}

          This is the #801 live signup funnel monitor (schedule + on-merge). The smoke asserts POST /v1/signup/email → 200 and the auto sign-in (auth/v1/token?grant_type=password) → 200; failures are typically a real signup-funnel regression, an API 429 (over_email_send_rate_limit / over_request_rate_limit / over_request_rate_limit_ip), or a stale test vs the deployed page. Investigate or re-run; it is NOT a PR regression gate.

          **One issue per failing streak (#2706):** later failures comment here instead of filing a new issue. The body is not machine-managed; close this issue when the streak ends."
          # The search query MUST go in the URL path — `gh api -f q=…` switches
          # the method to POST and 404s on search/issues (tenant-provision-monitor).
          q="repo:${GITHUB_REPOSITORY} is:issue is:open in:title \"${title}\""
          enc="$(printf '%s' "$q" | jq -sRr @uri)"
          if ! found="$(gh api "search/issues?q=${enc}&per_page=1" --jq '.items[0].number // empty')"; then
            echo "::error::issue search failed — refusing to file a possible duplicate; this failing run IS the alert"
            exit 1
          fi
          if [ -n "$found" ]; then
            # `gh api` exits non-zero on an HTTP 4xx/5xx, so a failed comment
            # fails the step loudly (the #2140 deaf-monitor class: a bare
            # `curl -s` would exit 0 on an HTTP error).
            gh api "repos/${GITHUB_REPOSITORY}/issues/${found}/comments" \
              --method POST -f body="🔁 Still failing — run: ${run_url}" >/dev/null
            echo "::notice::monitor issue #${found} is already open — commented instead of filing a duplicate (#2706)"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues" --method POST \
              -f title="${title}" -f body="${body}" -f 'labels[]=bug' >/dev/null
            echo "::notice::no open monitor issue — filed one (further failures will comment on it)"
          fi
