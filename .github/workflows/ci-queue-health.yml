name: ci-queue-health

# The REPO-LEVEL CI queue guard (#9115 acceptance 2 & 3).
#
# THE DEFECT THIS EXISTS FOR. On 2026-10-19 a reporting workflow
# (`finding-provenance`) created a run every ~30 seconds from ~50 lanes and held
# the repo's runner slots. 44-49 runs sat queued, 7 were executing, and TWELVE PR
# heads carried ZERO check-runs (#9043 #9069 #9070 #9071 #9073 #9074 #9085 #9088
# #9089 #9093 #9110 #9112) — `#9043 head d17d2664c5ab: check-runs 0 · workflow
# runs 0`. The required check `python-ci-gate` cannot start without a slot, so no
# check-run is ever created and every PR reads `WAITING-CI` for ever.
#
# No instrument noticed, and that is the half this workflow closes. A rail said
# `queued`; pr-doctor said `no idle lane`; the heartbeat said
# `ci_crit_med=21.6m`. All three are true and all three read as SLOW CI. The
# distinction the fleet was missing — `ABSENT` (no run at this sha), `QUEUED` (a
# run exists at this head with no slot) and `FLOOD` (the queue is held by one
# non-PR workflow while PR work starves) — lives one level UP from any per-commit
# reading, so `tools/ci_queue_health.py` measures it and this workflow runs it.
#
# WHY A POLL AND NOT AN EVENT. The condition is a STEADY STATE, not an event:
# whatever created it, the queue is still held minutes later, and only a poll
# sees that. Nothing fires when a queue stays deep.
#
# WHY IT ACTS (`--apply`). #9115 acceptance 2 asks for a guard that gives PR work
# priority when the queue is dominated by one workflow. The governor cancels the
# OLDEST excess QUEUED runs of a declared-trim-safe offender — never a
# pull-request-event run (that IS the priority), never a workflow that is not on
# the allow-list (a deploy, a publish, a post-merge validation or a backup has no
# re-derivable replacement, so it is REPORTED and not acted on), never more than
# `--max-cancel`, and never on an unreadable queue. It does NOT disable the
# offender: the issue offers "auto-paused" as the alternative arm, and pausing a
# REPORTING gate stops the gate from gating anything until something re-enables it
# — a silent fail-open if this workflow ever stops running. Only the COMMENT arm
# of a reporting workflow is trimmable: its annotation is re-created by the next
# comment on that issue, so the loss is one annotation. Its issue-BODY arm is
# never trimmed — that gate runs once per issue and a cancelled run posts nothing
# that a later comment re-creates — and neither is the `workflow_dispatch` run that
# is itself the documented recovery (`gh workflow run finding-provenance.yml -f
# issue_number=<N>`).
#
# THE RED IS THE ALARM, AND IT CANNOT BLOCK A MERGE. The exit code follows the
# tool's REPORTED (post-action) verdict, so a flood that still stands after the
# governor ran exits 1 and the run is red — a governor that issued cancellations
# has NOT made the queue healthy, and a green run for a held queue is exactly the
# silence this workflow exists to break. A flood this invocation CLEARED exits 0
# and prints `was CI: FLOOD(...) -> cleared N of M`. `PR-STARVED` (no PR run
# executing, a queued PR run past the age floor, and the dominance clause
# declined — the queue's largest non-PR share is below the dominance floor, or
# below the PR share) is an `::warning` at exit 0: the state is real, and the
# reading reaches no trim. A trim-safe offender CAN be present when the queue is
# merely PR-dominated, so its absence is NOT the bound.
# `PR-BACKLOGGED` (PR CI is COUNTED as executing — `pr_running > 0`, and that count
# may include runs whose jobs were never read, or whose read did not PROVE them idle,
# so it is not a proof — and a queued
# PR run has
# waited past the wait budget — the shape that used to print `CI: OK`, measured
# 2026-10-28 on #10237) is an `::warning` at exit 0 for the same reason, and the
# bound there is the CLAUSE ORDER, not the trim scope: the governor's block runs
# BELOW the `pr_running != 0` clause, so it is unreachable while any PR run is
# executing (a trim-safe OFFENDER leading that same queue does license trims once
# no PR run is executing — a queued PR run is never a candidate in any case).
# That no-action statement is about the READING, never the invocation: the tool
# cancels the pre-action flood and then reports a post-action re-read, so the arm
# below reads `cancelled` from the payload and says which case it is.
# `PR-UNWITNESSED` is also an `::warning` at exit 0: it names what was NOT measured
# instead of inferring health. Its THREE causes are different dimensions, and the
# annotation must not prescribe one cause's lever for another's: (a) the feed was
# cut at its page cap, so the oldest queued runs — the end the age clause needs —
# were never read (lever: --max-pages); (b) a WAITING PR-event run has no measurable
# current-attempt age, so the wait cannot be measured at all — it is NOT only an
# unreadable `created_at`: `QueuedRun.wait_age_seconds` abstains on THREE routes, and a
# readable stamp does not rule this cause out; (c) the RUNNING CENSUS is
# unwitnessed — every run counted in `pr_running` was unmeasured, which is #12037's
# own defect returned by the probe budget. That sub-cause has TWO forms with
# opposite levers (round 13), and the payload reports which applies:
# `pr_running_unmeasured_unprobed` is cleared by RAISING the budget, and
# `pr_running_unmeasured_unread` by RETRYING the reading (a bigger budget only
# probes more runs that fail the same way). NOT --max-pages for the CENSUS
# dimension — ⛔ but NOT unconditionally (round 14): `truncated` is an INDEPENDENT
# dimension and can be set in the SAME reading, in which case the cut feed still
# needs --max-pages and the annotation must not forbid it. The arm therefore reads
# `truncated` from the payload rather than hardcoding the refutation.
# ⛔ And NOT "repair the frozen runs": exclusion from `pr_running` requires TWO halves —
# every job `completed` AND the run's own `updated_at` still for JOB_SETTLE_SECONDS — AND
# only once the probe reached it and its jobs READ BACK all-`completed` (a failed read or an
# unprovable list abstains into `_unread` before the settle gate is consulted) — so
# an all-`completed` run whose last update just moved is COUNTED (unmeasured), not
# excluded. `repair` is not a lever either way, but ⛔ FOR TWO DIFFERENT REASONS and they
# must not be merged: the 409 evidence ("not in progress" / "has not been queued yet") is
# scoped to the FROZEN population, while a run whose stillness is merely UNPROVEN may still
# be working — the DYNAMIC matrix's pre-expansion window, a run that has just finished
# every job, or one whose stamp cannot be read or is future-dated (`_settled_still` answers
# False for ALL OF THEM — three routes, not four: the pre-expansion window and the
# just-finished run are the same "merely recent stamp" route) — and /cancel on THAT may be
# ACCEPTED (it may also still answer 409:
# the 409 evidence covers only a run whose stillness is PROVEN), so it is the one thing here
# an operator must not be told is a closed avenue.
# Neither can block a merge, because a
# `schedule`-event run is a NON-CODE event: the merge rail's own `NON_CODE_EVENTS`
# set excludes `schedule|issues|issue_comment` from the merge decision, so a red
# scheduled run never gates a PR.
#
# `schedule` / `workflow_dispatch` ONLY. The tool is the single implementation;
# run it by hand for a dry run:
#     uv run python tools/ci_queue_health.py            # measure only
#     uv run python tools/ci_queue_health.py --apply    # measure and unjam
on:
  schedule:
    # Every 10 minutes, offset off the hour boundary: GitHub documents that
    # scheduled events are delayed during high load, "especially at the start of
    # each hour", so minute 0 is the worst minute to ask for. A dropped fire is
    # not a loss — the next tick repeats the check.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Measure only (do not cancel any queued run)"
        type: boolean
        default: false

permissions:
  contents: read
  # Cancel a queued run (POST /actions/runs/{id}/cancel).
  actions: write

concurrency:
  # Serialise, never cancel: two governors running at once would each compute the
  # same excess set and cancel runs the other had kept.
  group: ci-queue-health
  cancel-in-progress: false

jobs:
  # NOT a branch-protection required context, and a non-code event, so a red here
  # cannot block a merge — see the header.
  queue-health:
    # ── HOSTED-ONLY PIN (deliberate, measured 2026-10-27) ─────────────
    # `ubuntu-latest` is served by BOTH GitHub-hosted runners AND this repo's
    # self-hosted pool — the pool advertises it WHILE the fallback is engaged
    # (`scripts/ci_runner_gate.sh`; docs/ops/ci-runner-x64.md:25), so that is a
    # CONDITIONAL property, not a standing one: measured again on 2026-10-27 with
    # the fallback disengaged, none of the nine runners carried it. Measured over
    # these four workflows' own SCHEDULED runs on 2026-10-27 (115 runs, 00:00-12:00
    # UTC, jobs classified by `runner_name`): 83 created a job - 72 served by a
    # GitHub-hosted runner, 11 by this repo's self-hosted runners (10 of them
    # `pi-runner-*`, 1 `cmux`) - and 32 never got a runner at all.
    # So the pin is not "escape a queue that is always the pool"; it removes
    # the arm that FAILS.
    #
    # The pool arm does not starve — it HANGS, and it also fails fast. Of those
    # 11 self-hosted jobs, TWO hung in `actions/checkout` and were killed at the
    # job's OWN `timeout-minutes`, with the measuring step SKIPPED, which reads
    # as a finished run that measured nothing; TWO failed in 9s/36s with the
    # payload step actually run; SEVEN completed normally (10-46s). So the pin
    # does not say "the pool never works" — it says the pool cannot be relied on
    # to MEASURE. Both cited runs are `ci-queue-health`'s, whose timeout is
    # `10`; this block is shared by four workflows with different timeouts
    # (`repair` is `15`), so it names no single job's number as its own:
    #     run 40456347720 → pi-runner-vm-2: checkout 8m40s, then cancelled
    #     run 40451686065 → pi-runner-vm-4: checkout 4m41s, then cancelled
    # (same day: 9/9 runners busy, 78 runs queued, and `ci-queue-health`
    # completed 1 of its last 8 scheduled runs — 6 cancelled, 1 pending.)
    #
    # ⛔ THE PIN IS NOT A COMPLETE FIX, and this comment must not read as one.
    # Hosted is queued too: 18 jobs were waiting on `ubuntu-24.04` with a max
    # wait of 56m, and one `ci-queue-health` job waited 65 minutes for a hosted
    # runner and then ran 15 seconds. GitHub keeps only ONE pending run per
    # concurrency group, so while a wait exceeds this workflow's cadence each
    # tick still cancels the previous PENDING tick. The pin removes the arm that
    # hangs and usually serves in minutes; the cadence/concurrency question stays
    # open and is tracked separately.
    #
    # `ubuntu-24.04` is HOSTED-ONLY for THIS job by choice, but NOT — any more —
    # because the pool cannot answer it. Since the 2026-10-29 mitigation (#6897
    # suspended; docs/ops/ci-runner-x64.md, "the label contract") the installer
    # CAN emit `…,ubuntu-24.04` under `CI_RUNNER_OS_LABEL=on|auto`
    # (tools/install-ci-runner-x64.sh; the flag defaults to `off`, so nothing
    # changes for a box that does not set it) and an ORPHANED re-registration
    # derives the same fact (tools/runner_autoscale.py) — so the premise this
    # comment was written on ("`ubuntu-24.04` is claimed by no self-hosted
    # runner") is FALSE. ⛔ WHAT DOES **NOT** HOLD IT: `_preserve_labels` still
    # DROPS a version pin on RE-registration and nothing in this tree
    # re-attaches it on that path, so a re-registered runner loses the label
    # until someone runs `--repair-labels` on a box whose OWN resolution
    # claims it (`on`, or `auto` on a host whose `/etc/os-release` reports
    # 24.04 — a DECLINING `auto` claims nothing and drops it with the rest of
    # the family) or reinstalls. `--status`' `label-coverage` exit 5 is what makes
    # that visible; re-measure rather than trusting this text:
    # `gh api repos/<owner>/<repo>/actions/runners`. The installer never hands
    # `config.sh` a version pin with the flag off — pinned at
    # `tests/test_ci_runner_x64_install.py:230`.
    # ⛔ THE COST, STATED: GitHub's label matching is cumulative and unscoped
    # (github/docs, "Using self-hosted runners in a workflow"), so while the
    # mitigation is engaged this observer is POOL-ELIGIBLE — and a guard whose
    # job is to report on a full pool can sit in `actions/checkout` behind that
    # very backlog, then die at its own `timeout-minutes` with the measuring step
    # SKIPPED: quiet precisely during the hosted outage it exists to surface.
    # `runs-on:` cannot scope that away, because the mitigation is label-wide and
    # not leg-scoped. Keep the pin for what it still buys — on a healthy day this
    # leg lands on hosted and spends no pool slot and no fleet quota — and if the
    # mitigation becomes permanent, re-scope this leg onto a label only hosted
    # answers. Public repo, so hosted minutes are free: this spends nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # tools/ci_queue_health.py measures the queue through `gh`. Without it the
      # run reports `CI: UNKNOWN (the tool produced no state line)` and exits 2
      # — measured 2026-10-24 on `pi-runner-vm-3`/`-6`. "I could not look" must
      # never be the last word on a queue. Provide the tool or fail NAMING it.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh
      # tools/ci_queue_health.py is stdlib-only; this pin supplies the >=3.12
      # interpreter every tool in `tools/` requires (#5128).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Measure the queue, and unjam a trim-safe flood
        env:
          # `gh` reads the token from the ENVIRONMENT; Actions exposes it only as
          # a context (#3092 — a `gh` call with no env binding fails every time).
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set +e
          if [ "${DRY_RUN}" = "true" ]; then
            python3 tools/ci_queue_health.py --json > /tmp/ci-queue-health.json 2>/tmp/ci-queue-health.err
            rc=$?
          else
            python3 tools/ci_queue_health.py --apply --json > /tmp/ci-queue-health.json 2>/tmp/ci-queue-health.err
            rc=$?
          fi
          set -e
          # The one-line state is the artifact the fleet reads. It is printed on
          # stdout AND into the step summary, so it survives the run page. A
          # one-liner on purpose: a heredoc inside a YAML block scalar is a
          # delimiter trap (the closing token must land at column 0).
          state="$(python3 -c "import json,sys; print(json.load(open('/tmp/ci-queue-health.json')).get('state_line','CI: UNKNOWN'))" 2>/dev/null \
                   || echo 'CI: UNKNOWN (the tool produced no state line)')"
          echo "$state"
          echo "$state" >> "$GITHUB_STEP_SUMMARY"
          # A CLEARED flood reports the POST-action reading (the tool re-measures
          # after it cancels), so the summary would otherwise read as though no
          # flood was ever seen. Print what it was: `was CI: FLOOD(...) -> cleared
          # N of M`, which keeps "the queue moved" distinct from "the queue was
          # healthy all along" — the ambiguity ISSUE 2 of the #9118 review named.
          transition="$(python3 -c "import json; d=json.load(open('/tmp/ci-queue-health.json')); print(f\"was {d['pre_action_state_line']} -> cleared {len(d['cancelled'])} of {d['candidates']}\" if d.get('cleared') else '')" 2>/dev/null || true)"
          if [ -n "$transition" ]; then
            echo "$transition"
            echo "$transition" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo '```json'
            cat /tmp/ci-queue-health.json
            echo '```'
            echo
            echo '```'
            cat /tmp/ci-queue-health.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # An annotation, so the state is visible in the run's annotations and not
          # only inside a summary nobody opens. The tool's exit code already follows
          # its REPORTED verdict (1 = a FLOOD still stands, 2 = could not measure),
          # so `rc` is a payload-derived alarm; the verdict is read as well for the
          # PR-STARVED / PR-BACKLOGGED / PR-UNWITNESSED warnings, which are real
          # states with no action available.
          #
          # ⛔ THE STATE LINE GOES IN THE MESSAGE, NEVER IN A `title=` PROPERTY.
          # GitHub parses a workflow command's property section as `key=value`
          # pairs separated by COMMAS, and every state line contains commas
          # (`queued=21, pr_running=0`). `title=${state}` therefore ended the title
          # at the first comma and silently dropped the rest: the rendered title was
          # `CI: FLOOD(finding-provenance` — exactly the `queued=N, pr_running=0`
          # spelling #9115 asks the fleet to see. Repo convention elsewhere is
          # `::error::<message>`; do not try to escape the commas (P2-1 of the
          # #9118 review).
          verdict="$(python3 -c "import json; print(json.load(open('/tmp/ci-queue-health.json')).get('verdict','UNKNOWN'))" 2>/dev/null || echo UNKNOWN)"
          cancelled_count="$(python3 -c "import json; print(len(json.load(open('/tmp/ci-queue-health.json')).get('cancelled') or []))" 2>/dev/null || echo 0)"
          cancelled_count="${cancelled_count:-0}"
          # "Nothing was cancelled" is a claim about THIS INVOCATION, and a reading
          # cannot support it: `classify_queue` is pure, and the tool cancels the
          # PRE-action FLOOD candidates and then reports a POST-action re-read — so
          # `cancelled` can be non-empty beside a no-action verdict in the very same
          # payload (#10264 review P3). Read it, and say what happened.
          #
          # BOTH no-action arms need this, not just `PR-BACKLOGGED` (#10264 review
          # P2): `PR-STARVED` is a legal POST-action verdict too. The runs this
          # invocation TRIMMED leave the queued feed while the ones it KEPT remain,
          # so the offender drops to the kept share — which can sit BELOW the PR
          # share, letting the `offender_queued < global_max` clause decline — and
          # the re-read is `PR-STARVED` while `cancelled` still names the trimmed
          # runs. The same run page then prints `cleared N of M` above a line
          # claiming nothing was cancelled.
          if [ "$cancelled_count" -gt 0 ]; then
            cancel_lead="This reading came AFTER this run cancelled ${cancelled_count} pre-action FLOOD candidate(s) (see the transition line above)"
          else
            cancel_lead="This run cancelled nothing"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::error::${state} — PR CI is NOT slow, it is NOT RUNNING, and it still is after this run's cancellations. See the step summary."
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::CI: UNKNOWN — the queue could not be measured, so nothing was changed and nothing is certified healthy."
          elif [ "$verdict" = "PR-STARVED" ]; then
            # The retired wording blamed the ABSENCE of a trim-safe offender and
            # claimed the governor had nothing it could cancel. Both were wrong on
            # a REACHABLE reading: the payload can carry trims this run made, and
            # PR-STARVED is also reached through `offender_queued < global_max`,
            # where a trim-safe offender IS present and blameable in principle (the
            # queue is merely PR-dominated). Name what the payload says; the reason
            # line inside the tool names the clause that actually declined.
            echo "::warning::${state} — PR CI is not running: no PR-event run is executing and a queued PR run has waited past the age floor. ${cancel_lead}, and this state reaches no trim — its reason line names the clause that declined to act. The lever is capacity."
          elif [ "$verdict" = "PR-BACKLOGGED" ]; then
            # #10237 ask 3 — "the job must fail loudly rather than hang". A queue
            # that IS serving PR work while the backlog behind it waits past the
            # measured budget is the shape that used to read `CI: OK` (measured
            # 2026-10-28T17:47Z: pr_running=2, pr_queued=32, oldest 527 min).
            # Nothing here is cancellable — and the bound is the CLAUSE ORDER, not
            # the trim scope: this state requires `pr_running > 0`, and the
            # governor's block sits BELOW the `pr_running != 0` clause, so it is
            # unreachable from here. (Quoting the trim scope as the bound would be
            # wrong: a trim-safe offender leading this same queue DOES license
            # trims once no PR run is executing.) The alarm is this annotation.
            # ... and the cancelled/none clause is read off the PAYLOAD, never
            # asserted: `cancelled` non-empty in a PR-BACKLOGGED reading means this
            # run trimmed the pre-action flood, so claiming nothing was cancelled
            # here would contradict the transition line printed three steps above.
            # `cancel_lead` is that payload-derived clause, shared with the
            # PR-STARVED arm for the same reason.
            # ⛔ THE BACKTICKS ARE ESCAPED, and that is load-bearing: this string is
            # DOUBLE-QUOTED, where a BARE backtick pair is still COMMAND
            # SUBSTITUTION — bash runs the text between them and substitutes its
            # stdout (bash manual §3.5.4: "the first backquote not preceded by a
            # backslash terminates the command substitution"). Written unescaped,
            # `pr_running > 0` rendered as "it requires , and the governor's block
            # sits below that clause" — the bound this arm exists to name, gone from
            # the alarm — executed a non-existent command into the step log, and
            # created a stray file named `0` from the `> 0` redirect. `set -e` does
            # not catch it (the substitution's status never reaches `echo`), so the
            # step stays green (#10264 review P1, measured; the repo's own
            # `::error::` diagnostics in ci-timing.yml escape the same way, and
            # tests/test_ci_queue_health.py pins the class over EVERY annotation).
            echo "::warning::${state} — PR CI IS executing (or is only REPORTED executing on an unmeasured census — see the reason line), but the backlog is past the wait budget: the REQUIRED checks cannot answer inside that wait. ${cancel_lead}; this state reaches no trim either — it requires \`pr_running > 0\`, and the governor's block sits below that clause, so THIS READING does not reach the governor. The lever is capacity, not the governor."
          elif [ "$verdict" = "PR-UNWITNESSED" ]; then
            # ⛔ THE CAUSE IS READ FROM THE PAYLOAD'S OWN FLAG, NOT RE-DERIVED FROM COUNTS.
            # `PR-UNWITNESSED` has three causes on different dimensions and they take
            # different levers. Round 4 keyed this on `pr_running == pr_running_unmeasured >
            # 0`, which is wrong on the OVERLAP: a reading whose WAIT was not witnessed (a
            # run with no measurable CURRENT-ATTEMPT age — not only one whose `created_at`
            # is unreadable) can ALSO have a fully unmeasured
            # census, and the numbers cannot tell which cause produced the verdict — so the
            # annotation prescribed the census lever (frozen runs / --max-job-probes) for a
            # wait defect, dropping the lever that fixes it (#12037 review round 5). The
            # tool emits `pr_running_census_unwitnessed`, set by the clause that degrades.
            census_n="$(python3 -c "import json; print(1 if json.load(open('/tmp/ci-queue-health.json')).get('pr_running_census_unwitnessed') else 0)" 2>/dev/null || echo 0)"
            if [ "${census_n:-0}" -eq 1 ]; then
              # ⛔ THE SPLIT IS READ FROM THE PAYLOAD, AND IT NAMES OPPOSITE REMEDIES (#12037
              # review rounds 11 and 13). The census is unmeasured for one of exactly TWO
              # reasons, and they are not interchangeable: a run the budget never REACHED is
              # reached by raising --max-job-probes, while a run whose read did not PROVE it
              # idle is fixed by RETRYING once it has settled — and "did not prove it idle"
              # covers a FAILED read, an EMPTY/partial/malformed/other-attempt list, and a run
              # that has not been still for JOB_SETTLE_SECONDS (a bigger budget only probes
              # more runs the same way). Emitting both remedies as alternatives would hand the
              # operator a coin flip, so the tool reports the split
              # (`pr_running_unmeasured_unprobed` / `_unread`) and this arm names only the
              # remedy that applies.
              #
              # ⛔ AND "a run GitHub has stopped driving (frozen, every job completed)" is NOT
              # a third cause: exclusion needs every job `completed` AND `updated_at` still
              # for JOB_SETTLE_SECONDS, so an all-completed run is unmeasured whenever its
              # stillness is unproven. ⛔ WHICH BUCKET IT LANDS IN DECIDES THE LEVER, so
              # this block must not answer for both (round 7 — an earlier revision said a
              # bigger budget "is NOT that lever" and "does not fix one", which is FALSE
              # for the slice the budget never read):
              #   * PROBED and not yet still → `_unread`, lever RETRY once it has settled
              #     (retrying immediately reproduces the downgrade);
              #   * NEVER REACHED by the budget → `_unprobed`, lever raise
              #     --max-job-probes. For the #12037 shape this IS the lever: a run still
              #     for 7 days resolves on the first probe, so raising the budget is what
              #     stops it being unmeasured at all.
              # Do NOT offer /cancel or /force-cancel as the lever: for a FROZEN run they
              # answer 409, while for a settle-downgraded one they may be ACCEPTED — and that
              # population is NOT proven to be "about to execute" either (`_settled_still`
              # also answers False for a run that has just finished every job, and for an
              # UNREADABLE or future-dated stamp), so cancelling one is unsafe for a reason
              # the 409 evidence does not cover. An "API-side repair" is therefore either
              # closed or unreliable, never right.
              unprobed_n="$(python3 -c "import json; print(json.load(open('/tmp/ci-queue-health.json')).get('pr_running_unmeasured_unprobed') or 0)" 2>/dev/null || echo 0)"
              unread_n="$(python3 -c "import json; print(json.load(open('/tmp/ci-queue-health.json')).get('pr_running_unmeasured_unread') or 0)" 2>/dev/null || echo 0)"
              if [ "${unread_n:-0}" -gt 0 ] && [ "${unprobed_n:-0}" -eq 0 ]; then
                census_lever="the jobs read did not PROVE them idle for any of the ${unread_n} — the read FAILED, or it returned nothing usable (an empty, partial, malformed or other-attempt job list), or the run had not been still long enough for an all-completed list to count as proof (300 s; a DYNAMIC matrix creates its shards only after its parent finishes). RETRY the reading once the runs have settled — a bigger probe budget only probes more runs the same way"
              elif [ "${unprobed_n:-0}" -gt 0 ] && [ "${unread_n:-0}" -eq 0 ]; then
                census_lever="the probe budget never REACHED all ${unprobed_n} of them, so raise --max-job-probes (oldest-first: the surplus is the NEWEST runs)"
              elif [ "${unprobed_n:-0}" -gt 0 ] && [ "${unread_n:-0}" -gt 0 ]; then
                census_lever="both causes are present — ${unprobed_n} run(s) the budget never REACHED (raise --max-job-probes) and ${unread_n} whose jobs read did not PROVE them idle (RETRY the reading first, once they have settled, since a retry also re-probes the unread ones); if the count then stops moving, raise the budget"
              else
                census_lever="the reading did not record which abstention it was (an older caller), so neither lever can be named from this payload"
              fi
              # ⛔ AND THE REFUTATION IS NOT UNCONDITIONAL (round 14). `truncated` is an
              # INDEPENDENT unwitnessed dimension and `classify_queue(…, truncated=True)`
              # reaches THIS branch: a reading can have an all-unmeasured census AND a cut
              # feed at once, and then --max-pages is the live lever for the cut leg while
              # the census needs its own. Emitting the flat "NOT --max-pages" there sent the
              # operator away from the only lever the cut leg has — the mirror of round 5.
              pages_tail="$(python3 -c "import json; d=json.load(open('/tmp/ci-queue-health.json')); print('the FEED IS ALSO CUT in this same reading (feed=truncated), so it has a second unwitnessed dimension whose lever is --max-pages — pull both' if d.get('truncated') else 'NOT --max-pages for THIS dimension; see the step summary for the dimension that was not measured')" 2>/dev/null || echo 'NOT --max-pages for THIS dimension; see the step summary for the dimension that was not measured')"
              echo "::warning::${state} — the RUNNING CENSUS was not witnessed: every run counted as executing was unmeasured, so the count is an UPPER BOUND on executing work rather than a census of it (for the surplus it is exactly the pre-#12037 status-string reading; for a run the probe DID read it is not), and PR starvation is neither witnessed nor disproved. Nothing is inferred healthy here. ${census_lever}. ${pages_tail}."
            else
              echo "::warning::${state} — the PR wait was not witnessed (a feed was cut at the page cap — the queued or the in-progress one, which share one flag — or the pending/requested leg was cut at its page cap, or a WAITING PR-event run — queued, pending or requested — has no measurable current-attempt age), so PR starvation is neither witnessed nor disproved. Nothing is inferred healthy here; for a truncated feed raise --max-pages to read further back, and see the step summary for the dimension that was not measured."
            fi
          fi
          echo "ci-queue-health exit=$rc (0 = OK, cleared, PR-STARVED, PR-BACKLOGGED or PR-UNWITNESSED (five exit-0 shapes, all but OK and cleared warned); 1 = FLOOD stands; 2 = could not measure)"
          exit "$rc"
