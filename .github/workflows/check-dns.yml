name: Check Tortoise DNS
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== zones ==="
          curl -s "https://api.cloudflare.com/client/v4/zones?name=premiselabs.co" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(z['id'], z['name'], z['status']) for z in d.get('result',[])]"
          echo "=== dns records ==="
          ZONE=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=premiselabs.co" -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')")
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=tortoise.premiselabs.co" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -m json.tool
