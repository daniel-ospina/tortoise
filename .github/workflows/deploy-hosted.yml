# Deploy Tortoise Hosted API to Fly.io
name: Deploy Hosted API

on:
  push:
    branches: [main]
    paths:
      - 'tortoise/**'
      - 'fly.toml'
      - 'Dockerfile.hosted'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.FASTAPI_INTERNAL_KEY }}" ] || [ -z "${{ secrets.TORTOISE_SECRET_PEPPER }}" ]; then
            echo "::error::FASTAPI_INTERNAL_KEY and TORTOISE_SECRET_PEPPER must be set in GitHub secrets"
            exit 1
          fi
      - name: Ensure data volume
        # Persistent volume for embedded redislite DB at /data.
        run: |
          if ! flyctl volumes list --app tortoise-y4mjjq | grep -q 'tortoise_api_data'; then
            flyctl volumes create tortoise_api_data --app tortoise-y4mjjq --region iad --size 1 || true
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --wait-timeout 300 --app tortoise-y4mjjq
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
