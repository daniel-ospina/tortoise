# Deploy Tortoise Hosted API to Fly.io
name: Deploy Hosted API

on:
  push:
    branches: [main]
    paths:
      - 'tortoise/**'
      - 'fly.toml'
      - 'Dockerfile.hosted'
      - 'entrypoint.sh'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: deploy-hosted
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.FASTAPI_INTERNAL_KEY }}" ] || [ -z "${{ secrets.TORTOISE_SECRET_PEPPER }}" ] || [ -z "${{ secrets.FALKORDB_CLOUD_URI }}" ] \
             || [ -z "${{ secrets.TORTOISE_BACKUP_KEY }}" ] || [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] || [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ] \
             || [ -z "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] || [ -z "${{ secrets.R2_BUCKET }}" ]; then
            echo "::error::FASTAPI_INTERNAL_KEY, TORTOISE_SECRET_PEPPER, FALKORDB_CLOUD_URI, TORTOISE_BACKUP_KEY, and R2_* must be set in GitHub secrets"
            exit 1
          fi
      - name: Set all app secrets on Fly.io (keeps in sync with GitHub/Supabase)
        run: |
          flyctl secrets set --stage \
            FASTAPI_INTERNAL_KEY="${{ secrets.FASTAPI_INTERNAL_KEY }}" \
            TORTOISE_SECRET_PEPPER="${{ secrets.TORTOISE_SECRET_PEPPER }}" \
            FALKORDB_CLOUD_URI="${{ secrets.FALKORDB_CLOUD_URI }}" \
            TORTOISE_BACKUP_KEY="${{ secrets.TORTOISE_BACKUP_KEY }}" \
            R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}" \
            R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
            R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            R2_BUCKET="${{ secrets.R2_BUCKET }}" \
            --app tortoise-y4mjjq
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy (retry through Fly lease/API races)
        run: |
          for attempt in 1 2 3 4 5; do
            if flyctl deploy --remote-only --wait-timeout 420 --app tortoise-y4mjjq; then
              exit 0
            fi
            echo "::warning::deploy attempt $attempt failed — waiting 45s before retry (Fly lease/API race)"
            sleep 45
          done
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
