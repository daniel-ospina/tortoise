# Deploy Tortoise Hosted API to Fly.io
name: Deploy Hosted API

on:
  push:
    branches: [main]
    paths:
      - 'tortoise/**'
      - 'fly.toml'
      - 'Dockerfile.hosted'
      - 'entrypoint.sh'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify secrets exist
        run: |
          if [ -z "${{ secrets.FASTAPI_INTERNAL_KEY }}" ] || [ -z "${{ secrets.TORTOISE_SECRET_PEPPER }}" ] || [ -z "${{ secrets.FALKORDB_CLOUD_URI }}" ]; then
            echo "::error::FASTAPI_INTERNAL_KEY, TORTOISE_SECRET_PEPPER, and FALKORDB_CLOUD_URI must be set in GitHub secrets"
            exit 1
          fi
      - name: Set all app secrets on Fly.io (keeps in sync with GitHub/Supabase)
        run: |
          flyctl secrets set \
            FASTAPI_INTERNAL_KEY="${{ secrets.FASTAPI_INTERNAL_KEY }}" \
            TORTOISE_SECRET_PEPPER="${{ secrets.TORTOISE_SECRET_PEPPER }}" \
            FALKORDB_CLOUD_URI="${{ secrets.FALKORDB_CLOUD_URI }}" \
            --app tortoise-y4mjjq
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --wait-timeout 300 --app tortoise-y4mjjq
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
