# Deploy Tortoise Hosted API to Fly.io
name: Deploy Hosted API

on:
  push:
    branches: [main]
    paths:
      - 'tortoise/**'
      - 'fly.toml'
      - 'Dockerfile.hosted'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Get Fly org
        id: fly-org
        run: |
          ORG=$(flyctl orgs list --json | python3 -c "import sys,json; orgs=json.load(sys.stdin); print(orgs[0]['slug'] if orgs else '')")
          echo "org=$ORG" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Create app if missing
        run: flyctl apps create tortoise-api --org ${{ steps.fly-org.outputs.org }} || echo "app exists"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --app tortoise-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
