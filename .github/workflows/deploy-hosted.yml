# Deploy Tortoise Hosted API to Fly.io
name: Deploy Hosted API

on:
  push:
    branches: [main]
    paths:
      - 'tortoise/**'
      - 'fly.toml'
      - 'Dockerfile.hosted'
      - 'entrypoint.sh'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: deploy-hosted
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify secrets exist
        run: |
          # Core secrets are mandatory — the API cannot boot without them.
          if [ -z "${{ secrets.FASTAPI_INTERNAL_KEY }}" ] || [ -z "${{ secrets.TORTOISE_SECRET_PEPPER }}" ] || [ -z "${{ secrets.FALKORDB_CLOUD_URI }}" ]; then
            echo "::error::FASTAPI_INTERNAL_KEY, TORTOISE_SECRET_PEPPER, and FALKORDB_CLOUD_URI must be set in GitHub secrets"
            exit 1
          fi
          # Backup (TORTOISE_BACKUP_KEY + R2_*) is env-gated at runtime and
          # Pro-tier-only — missing secrets degrade gracefully (backup
          # endpoints 402/503), so warn instead of blocking the deploy (#545).
          if [ -z "${{ secrets.TORTOISE_BACKUP_KEY }}" ]; then
            echo "::warning::TORTOISE_BACKUP_KEY not set — backups disabled until configured"
          fi
          if [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] || [ -z "${{ secrets.R2_BUCKET }}" ]; then
            echo "::warning::R2_* secrets not fully set — backup storage disabled until configured"
          fi
      - name: Set all app secrets on Fly.io (keeps in sync with GitHub/Supabase)
        run: |
          ARGS="FASTAPI_INTERNAL_KEY=${{ secrets.FASTAPI_INTERNAL_KEY }} TORTOISE_SECRET_PEPPER=${{ secrets.TORTOISE_SECRET_PEPPER }} FALKORDB_CLOUD_URI=${{ secrets.FALKORDB_CLOUD_URI }}"
          # Optional (env-gated at runtime): only pass when set, so unconfigured
          # backups / GitHub OAuth never fail the deploy.
          [ -n "${{ secrets.TORTOISE_BACKUP_KEY }}" ] && ARGS="$ARGS TORTOISE_BACKUP_KEY=${{ secrets.TORTOISE_BACKUP_KEY }}"
          [ -n "${{ secrets.R2_ACCOUNT_ID }}" ] && ARGS="$ARGS R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}"
          [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] && ARGS="$ARGS R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}"
          [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] && ARGS="$ARGS R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}"
          [ -n "${{ secrets.R2_BUCKET }}" ] && ARGS="$ARGS R2_BUCKET=${{ secrets.R2_BUCKET }}"
          # Backup sweep (#596): dual-channel alerting needs the Telegram pair +
          # the GitHub PAT; BACKUP_SWEEP_ENABLED=true only when ALL required
          # syncable secrets are present (fail-closed default — a missing
          # secret keeps the sweep off, never crashes the boot, #545).
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && ARGS="$ARGS TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
          [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && ARGS="$ARGS TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
          [ -n "${{ secrets.DR_ISSUES_PAT }}" ] && ARGS="$ARGS DR_ISSUES_PAT=${{ secrets.DR_ISSUES_PAT }}"
          [ -n "${{ secrets.BACKUP_ALERT_ASSIGNEE }}" ] && ARGS="$ARGS BACKUP_ALERT_ASSIGNEE=${{ secrets.BACKUP_ALERT_ASSIGNEE }}"
          [ -n "${{ secrets.BACKUP_SIMULATE_ENABLED }}" ] && ARGS="$ARGS BACKUP_SIMULATE_ENABLED=${{ secrets.BACKUP_SIMULATE_ENABLED }}"
          if [ -n "${{ secrets.TORTOISE_BACKUP_KEY }}" ] && [ -n "${{ secrets.R2_ACCOUNT_ID }}" ] && [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.R2_BUCKET }}" ] && [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ] && [ -n "${{ secrets.DR_ISSUES_PAT }}" ] && [ -n "${{ secrets.BACKUP_ALERT_ASSIGNEE }}" ]; then
            ARGS="$ARGS BACKUP_SWEEP_ENABLED=true"
            echo "::notice::BACKUP_SWEEP_ENABLED=true — all backup-sweep secrets present"
          else
            echo "::warning::backup sweep secrets incomplete — BACKUP_SWEEP_ENABLED left off (fail-closed)"
          fi
          # GitHub OAuth (#542): GITHUB_CLIENT_ID/SECRET + encryption key —
          # warn-only until the OAuth app is registered and secrets set.
          if [ -z "${{ secrets.GITHUB_CLIENT_ID }}" ] || [ -z "${{ secrets.GITHUB_CLIENT_SECRET }}" ]; then
            echo "::warning::GITHUB_CLIENT_ID/GITHUB_CLIENT_SECRET not set — GitHub OAuth disabled until configured (#542)"
          fi
          if [ -z "${{ secrets.TORTOISE_ENCRYPTION_KEY }}" ]; then
            echo "::warning::TORTOISE_ENCRYPTION_KEY not set — token encryption unavailable until configured (#542)"
          fi
          [ -n "${{ secrets.GITHUB_CLIENT_ID }}" ] && ARGS="$ARGS GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}"
          [ -n "${{ secrets.GITHUB_CLIENT_SECRET }}" ] && ARGS="$ARGS GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}"
          [ -n "${{ secrets.GITHUB_CALLBACK_URL }}" ] && ARGS="$ARGS GITHUB_CALLBACK_URL=${{ secrets.GITHUB_CALLBACK_URL }}"
          [ -n "${{ secrets.TORTOISE_ENCRYPTION_KEY }}" ] && ARGS="$ARGS TORTOISE_ENCRYPTION_KEY=${{ secrets.TORTOISE_ENCRYPTION_KEY }}"
          # #528 server analytics (PostHog) — absent key → analytics module no-ops.
          [ -n "${{ secrets.POSTHOG_API_KEY }}" ] && ARGS="$ARGS POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}"
          [ -n "${{ secrets.POSTHOG_HOST }}" ] && ARGS="$ARGS POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}"
          flyctl secrets set --stage $ARGS --app tortoise-y4mjjq
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy (retry through Fly lease/API races)
        run: |
          for attempt in 1 2 3 4 5; do
            if flyctl deploy --remote-only --wait-timeout 420 --app tortoise-y4mjjq; then
              exit 0
            fi
            echo "::warning::deploy attempt $attempt failed — waiting 45s before retry (Fly lease/API race)"
            sleep 45
          done
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
