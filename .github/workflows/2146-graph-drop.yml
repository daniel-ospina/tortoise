name: ops-2146-graph-drop (one-shot)

on:
  workflow_dispatch:
    # #2146: drop the 222 orphaned team_* knowledge graphs minted by the
    # welcome-e2e-monitor's live-signup runs (2026-08-11 -> 2026-09-02) from
    # the FalkorDB Cloud store. ONE-SHOT tool: the Supabase side is already
    # cleaned; the manifest (graph-scripts/2146-orphan-manifest.json) is the
    # permanent record of the 222 graphs. DELETE THIS WORKFLOW + MANIFEST
    # after the run (or repurpose as reusable ops tooling — owner decision).

permissions:
  contents: read

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (falkordb client + tortoise SDK)
        run: pip install -e '.[test]' build==1.6.0
      - name: Dry-run listing (GRAPH.LIST read-only)
        env:
          FALKORDB_CLOUD_URI: ${{ secrets.FALKORDB_CLOUD_URI }}
        run: python3 graph-scripts/2146_falkordb_graph_cleanup.py --manifest graph-scripts/2146-orphan-manifest.json
      - name: GRAPH.DELETE the 222 orphan graphs
        env:
          FALKORDB_CLOUD_URI: ${{ secrets.FALKORDB_CLOUD_URI }}
        run: python3 graph-scripts/2146_falkordb_graph_cleanup.py --manifest graph-scripts/2146-orphan-manifest.json --execute
