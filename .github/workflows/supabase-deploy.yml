# Deploy Supabase migrations + edge functions for the premise-labs project
# (ybetwichurajbfswfeqa) (#373).
#
# ⚠️ #669 FLIP GATING (issue #771, plan Task 10.2 — NO auth-blackout window):
# The deploy steps run ONLY on `workflow_dispatch`. A push to main touching
# supabase/** is recorded but never deploys. This is deliberate: the
# tenant-provision Edge Function writes Supabase ONLY (#770) while the app
# still reads the registry until the flip (#767) — if the Edge Function
# deployed BEFORE the app flipped, new signups' keys would be unreadable
# (auth blackout). Everything ships together at the flip instead.
#
# ══ THE FLIP SEQUENCE (operator-executed, owner informed) ════════════════════
#   1. Pre-deploy gate PASSES: .github/scripts/verify-cutover
#      (CI job `flip-gate` in ci.yml + the operator's live run with prod
#      creds: TORTOISE_DB_URI SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
#      bash .github/scripts/verify-cutover --live).
#   2. DISPATCH this workflow (migrations + waitlist-subscribe +
#      tenant-provision Edge Functions) — the Supabase side of the flip.
#   3. DISPATCH deploy-hosted (the app flip: reads Supabase, #767) —
#      same operator, immediately after step 2.
#   4. Post-flip verification incl. E2E-7 (#766 — the next issue).
#   5. Registry delete (point of no return, owner informed):
#      TORTOISE_DB_URI=... .github/scripts/delete-registry --confirm
#      (with TORTOISE_SUPPRESS_ENUM_DELTA=1 set on the app for the flip
#      window, per plan Task 10 P3-4).
# Steps 2+3 together are "the single deploy" — no interim state ships.
#
# Guarded: steps only run when BOTH secrets are set (if: env.X != '' — GitHub
# does not allow secrets in if: conditions). Without them, the job no-ops
# (manual fallback in supabase/README.md). This project also hosts the hosted
# Tortoise platform — destructive migrations stay under PR review discipline.
name: Deploy Supabase (migrations + functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  # Drift visibility on push (#1095): warn-only gate so a pure supabase/**
  # push (no app code) still reports pending migrations. The BLOCK lives in
  # deploy-hosted.yml where it gates actual app deploys. Repo-ahead on a
  # supabase/** push is the expected state (apply is dispatch-only #771), so
  # this is a warning + remediation banner, not a failure. Exit 2 (missing
  # token / API error) DOES fail red — that's a config problem, not drift.
  # Runs in its own job (no concurrency group) so it can't stall an
  # operator's dispatch apply.
  check-drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check migration drift (warn-only on push)
        run: |
          set +e
          bash .github/scripts/check-migration-drift
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::warning::Migrations pending — dispatch Deploy Supabase (migrations + functions) to apply before the next app deploy."
            exit 0
          fi
          exit "$rc"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    # Dispatch-only (#771 flip gating): a push records but never deploys. At
    # JOB level so a push-triggered run doesn't hold the shared concurrency
    # group and stall an operator's dispatch apply (#1095).
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ybetwichurajbfswfeqa
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Flip gating (#771): dispatch-only, so a routine supabase/** push can
      # never deploy the tenant-provision Edge Function ahead of the app
      # flip (auth-blackout window). See the flip sequence above.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify required edge-function secrets (#1121)
        # Fail fast BEFORE deploy: if any secret the tenant-provision success
        # path reads is missing, every signup 500s/502s at runtime with no
        # deploy-time signal (post-#1110 hardening — CORS was masking
        # missing-secret failures). AUTH_HOOK_SECRET is deliberately NOT
        # required (hook path inert since #832); SUPABASE_SERVICE_ROLE_KEY is
        # a platform-reserved secret auto-injected into edge functions, so it
        # is WARN-only here (secrets list may omit reserved names).
        # NOTE: current CLI (v2.x) prints `secrets list --output json` as a
        # JSON array — parse with jq, never grep for `NAME<TAB>` (old format).
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          required=(FASTAPI_URL FASTAPI_INTERNAL_KEY TORTOISE_SECRET_PEPPER)
          out="$(supabase secrets list --output json --project-ref "$SUPABASE_PROJECT_REF")" \
            || { echo "::error::supabase secrets list failed — cannot verify tenant-provision secrets"; exit 1; }
          # Recursive: handles BOTH the JSON array ([{name,value}]) and the
          # object wrapper ({"secrets":[...]}) output shapes.
          present() { printf '%s' "$out" | jq -e --arg n "$1" \
            '[.. | objects | select(has("name")) | .name] | any(. == $n)' >/dev/null; }
          missing=()
          for name in "${required[@]}"; do
            if ! present "$name"; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::MISSING Supabase secrets required by tenant-provision:"
            for name in "${missing[@]}"; do echo "::error::  $name"; done
            echo "::error::Set them with: supabase secrets set --project-ref $SUPABASE_PROJECT_REF <NAME>='...'"
            exit 1
          fi
          if present SUPABASE_SERVICE_ROLE_KEY; then
            echo "✅ Required secrets present: ${required[*]} SUPABASE_SERVICE_ROLE_KEY"
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not listed by secrets list (platform-reserved, auto-injected) — assuming present"
            echo "✅ Required secrets present: ${required[*]}"
          fi
      - name: Apply migrations
        # Token-based push (login role) — no DB password secret needed.
        # Proven 2026-08-10 against the premise-labs project.
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push --linked --include-all
      - name: Deploy waitlist-subscribe edge function
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy waitlist-subscribe \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy tenant-provision edge function
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        # --no-verify-jwt is REQUIRED: the after_user_created auth hook sends
        # no user JWT. Caller auth is enforced inside the function (#802) via
        # the hook's Standard-Webhooks signature (AUTH_HOOK_SECRET secret)
        # or a matching user JWT; anon-key calls get 401.
        run: |
          supabase functions deploy tenant-provision \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
