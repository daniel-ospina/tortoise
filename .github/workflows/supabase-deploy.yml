# Deploy Supabase migrations + edge functions for the premise-labs project
# (ybetwichurajbfswfeqa) (#373).
#
# ⚠️ #669 FLIP GATING (issue #771, plan Task 10.2 — NO auth-blackout window):
# The deploy steps run ONLY on `workflow_dispatch`. A push to main touching
# supabase/** is recorded but never deploys. This is deliberate: the
# tenant-provision Edge Function writes Supabase ONLY (#770) while the app
# still reads the registry until the flip (#767) — if the Edge Function
# deployed BEFORE the app flipped, new signups' keys would be unreadable
# (auth blackout). Everything ships together at the flip instead.
#
# ══ THE FLIP SEQUENCE (operator-executed, owner informed) ════════════════════
#   1. Pre-deploy gate PASSES: .github/scripts/verify-cutover
#      (CI job `flip-gate` in ci.yml + the operator's live run with prod
#      creds: TORTOISE_DB_URI SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
#      bash .github/scripts/verify-cutover --live).
#   2. DISPATCH this workflow (migrations + waitlist-subscribe +
#      tenant-provision + deck-view Edge Functions) — the Supabase side of the flip.
#   3. deploy-hosted (the app flip: reads Supabase, #767) — DISPATCHED BY THIS
#      RUN, as its final step (`Dispatch deploy-hosted (the app flip)`). Step 3
#      is no longer a second operator action: this file performs steps 2 and 3
#      in one run (#3627). It fires only after every step-2 deploy reached
#      success — an `if:` with no status function carries GitHub's implicit
#      `success()` — so a failed apply leaves the app untouched AND the run red.
#   4. Post-flip verification incl. E2E-7 (#766 — the next issue).
#   5. Registry delete (point of no return, owner informed):
#      TORTOISE_DB_URI=... .github/scripts/delete-registry --confirm
#      (with TORTOISE_SUPPRESS_ENUM_DELTA=1 set on the app for the flip
#      window, per plan Task 10 P3-4).
# Steps 2+3 together are "the single deploy" — no interim state ships. Since
# #3627 that is ENFORCED BY THIS FILE, not by operator discipline: the two
# halves share one run, so they cannot be split by a forgotten second dispatch.
#
# ⚠️ #3627 — WHY STEPS 2 AND 3 ARE ONE WINDOW. The tenancy rename
# (supabase/migrations/20260915000001_tenancy_team_to_org.sql, #3543) is a HARD
# CUT at the wire level: `provision_team` is dropped and recreated with
# `p_org_id`, and PostgREST resolves RPCs by PARAMETER NAME, so no single app
# revision is compatible with both the old and the new schema. Until #3627 this
# workflow stopped after the edge functions, so the schema ALWAYS landed alone
# and the Fly app was guaranteed stale for the whole window between the two
# runs — every tenant-scoped read returned 0 rows and every provisioning path
# failed closed. The `Dispatch deploy-hosted (the app flip)` step is that
# window's closure, and it FAILS CLOSED: a dispatch that silently no-ops would
# leave the app stale while the run looked closed, which is the exact defect
# #3627 exists to remove (see the step's own comments).
#
# Guarded: the DEPLOY steps (verify-secrets, apply, the three edge functions,
# and the app-flip dispatch) run only when the SUPABASE_ACCESS_TOKEN secret is set
# (if: env.SUPABASE_ACCESS_TOKEN != '' — GitHub does not allow secrets in if:
# conditions). Every step that WRITES or comes after one is gated, so without
# the secret no migration is applied and no app flip is dispatched; the ungated
# setup steps above them (checkout, setup-cli, `Link project`) still run. Manual
# fallback in supabase/README.md.
# The production flip path is main-only: a non-main run is refused before any
# migration is applied, because the app half is dispatched at main. This project
# also hosts the hosted Tortoise platform — destructive migrations stay under PR
# review discipline.
name: Deploy Supabase (migrations + functions)

# #3627 — THE DISPATCH'S CREDENTIAL. `Dispatch deploy-hosted (the app flip)`
# calls GitHub's `Create a workflow dispatch event`, which requires a token
# carrying "Actions" repository permissions (write). MEASURED, not assumed: this
# repo's default workflow permission is `read`
# (`repos/daniel-ospina/tortoise/actions/permissions/workflow` ->
# {"default_workflow_permissions":"read"}), and GitHub applies that default
# FIRST and only then adjusts it by this block ("The permissions for the
# GITHUB_TOKEN are initially set to the default setting ... The permissions are
# then adjusted based on any configuration within the workflow file"). So the
# `actions: write` below is what makes the step authenticate at all; drop it and
# the API answers 403 and the app never flips.
# `contents: read` must be spelled out: specifying ANY permission sets every
# unspecified one to `none`, which would strip the token `actions/checkout` uses.
# `gh secret set`/PAT alternatives are deliberately NOT used — a PAT here would
# be a second long-lived credential on the flip path for no added guarantee.
permissions:
  actions: write
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

# A DEPLOY must never be cancelled midway: a cancelled migration apply leaves
# the schema half-migrated, which no re-run repairs deterministically. So the
# run-level lock never cancels — a superseded run of the SAME event queues
# behind the in-flight one instead of aborting a half-applied schema. Runs of
# DIFFERENT events do not queue behind each other: as the note below spells
# out, the group is event-scoped, so a `push` drift run can never hold the lock
# a `workflow_dispatch` apply needs. Bookkeeping, not a merge gate (#9115).
#
# ⛔ The group is EVENT-SCOPED, and that is load-bearing twice over.
#
# 1. A run-level group is acquired by EVERY run of this workflow — including the
#    `push` arm that only runs `check-drift`. With a constant name, a push run
#    holds the deploy lock for as long as the runner queue starves it (measured
#    18m35s on run 39153770128), an operator's dispatch queues behind it, and a
#    THIRD arrival cancels the pending dispatch regardless of
#    `cancel-in-progress` (#9120's own finding). That is exactly what #1095's
#    reviewed decision forbids — `docs/plans/2026-08-13-1095-migration-drift-gate.md`:
#    "workflow-level concurrency is claimed per-run — a push run would still
#    hold the shared group".
# 2. A run-level group that equals the JOB-level group name deadlocks: the run
#    acquires it first, so the job can never acquire it, and GitHub fails the
#    job instantly with zero steps and no runner (#9120 x #1095, 2026-10-20).
#
# Event-scoping fixes (1); keeping the job's own distinct group fixes (2).
concurrency:
  group: supabase-deploy-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Drift visibility on push (#1095): warn-only gate so a pure supabase/**
  # push (no app code) still reports pending migrations. The BLOCK lives in
  # deploy-hosted.yml where it gates actual app deploys. Repo-ahead on a
  # supabase/** push is the expected state (apply is dispatch-only #771), so
  # this is a warning + remediation banner, not a failure. Exit 2 (missing
  # token / API error) DOES fail red — that's a config problem, not drift.
  # Runs in the `supabase-deploy-push` run-level group — its own group, so a
  # starved push run cannot stall an operator's dispatch apply (#1095). It
  # declares no JOB-level group, deliberately: it needs no apply lock.
  check-drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Check migration drift (warn-only on push)
        run: |
          set +e
          bash .github/scripts/check-migration-drift
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::warning::Migrations pending — read the check-migration-drift output above. Resolve any OUT OF ORDER versions FIRST (forward migration, or 'migration repair --linked --status applied <version>') and rename any duplicate-prefix pair; then dispatch Deploy Supabase (migrations + functions) to apply before the next app deploy."
            exit 0
          fi
          exit "$rc"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    # Dispatch-only (#771 flip gating): a push records but never deploys. TWO
    # separate facts keep a push run out of the CONSTANT apply lock, and both
    # are pinned in tests/test_reporting_workflow_concurrency.py: this `if:` (a
    # push run never reaches this job) and `check-drift` declaring no job-level
    # group (the only job a push run has, and it requests no apply lock).
    # SEPARATELY, the event-scoped run-level group keeps a push run out of a
    # dispatch's RUN lock — it does not touch this job's lock. The apply lock
    # below serialises APPLIES with each other, and its name is distinct from
    # the run-level group so the run/job deadlock cannot return (#1095).
    if: github.event_name == 'workflow_dispatch'
    # ⛔ This group name MUST differ from the run-level `concurrency.group`
    # above (#9120). When both were `supabase-deploy`, the RUN acquired the
    # group first and this job could never acquire it — the run cannot finish
    # until the job runs, and the job cannot run until the run releases the
    # group. GitHub resolves the deadlock by failing the job instantly with
    # ZERO steps and no runner, which reads as a mystery red rather than a
    # concurrency error. Measured 2026-10-20: the first dispatch after #9120
    # merged died this way (run 39488590083: `steps=0`, `runner=none`,
    # completed 1s BEFORE it started), so the only automated migration path was
    # dead. Keep this a CONSTANT: applies must serialise with each other.
    concurrency:
      group: supabase-deploy-apply
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ybetwichurajbfswfeqa
    steps:
      # ── #3627: the co-move is a MAIN-ONLY contract ────────────────────────
      # The schema applied here comes from THIS run's checked-out ref, while
      # the app half is dispatched at `main`. Those are the same revision only
      # when this run IS main. A branch dispatch would therefore apply branch
      # migrations to the linked PRODUCTION project and then flip main's app —
      # a mismatched pair, which is the failure #3627 is about.
      # Refusing here (FIRST step, before `supabase link` and before any
      # `db push`) is fail-closed: nothing is written. The branch path keeps its
      # documented manual fallback (supabase/README.md "Manual fallback") —
      # `supabase db push` + `supabase functions deploy` against the branch tree.
      - name: Refuse a non-main dispatch (the co-move is main-only)
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow applies migrations to the PRODUCTION Supabase project and dispatches deploy-hosted at main, so it must run FROM main: gh workflow run supabase-deploy.yml --ref main. Dispatched ref: $RUN_REF. Nothing was applied."
            exit 1
          fi
      - uses: actions/checkout@v4
      # ── THE RUNNER TOOL CONTRACT (#9018) ──────────────────────────────
      # This job dispatches deploy-hosted with `gh api --method POST` and then
      # `gh run watch`es it. On a pool runner without `gh` the dispatch dies with
      # `exit 127` AFTER the migrations have already been applied — a red that
      # describes the runner, not the deploy. Provide the tool or fail NAMING it.
      - name: Runner tool contract — provide gh (#9018)
        run: bash .github/scripts/runner-tools.sh ensure gh
      - uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Flip gating (#771): dispatch-only, so a routine supabase/** push can
      # never deploy the tenant-provision Edge Function ahead of the app
      # flip (auth-blackout window). See the flip sequence above.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify required edge-function secrets (#1121)
        # Fail fast BEFORE deploy: if any secret the tenant-provision success
        # path reads is missing, every signup 500s/502s at runtime with no
        # deploy-time signal (post-#1110 hardening — CORS was masking
        # missing-secret failures). AUTH_HOOK_SECRET is deliberately NOT
        # required (hook path inert since #832); SUPABASE_SERVICE_ROLE_KEY is
        # a platform-reserved secret auto-injected into edge functions, so it
        # is WARN-only here (secrets list may omit reserved names).
        # NOTE: current CLI (v2.x) prints `secrets list --output json` as a
        # JSON array — parse with jq, never grep for `NAME<TAB>` (old format).
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          required=(FASTAPI_URL FASTAPI_INTERNAL_KEY TORTOISE_SECRET_PEPPER)
          out="$(supabase secrets list --output json --project-ref "$SUPABASE_PROJECT_REF")" \
            || { echo "::error::supabase secrets list failed — cannot verify tenant-provision secrets"; exit 1; }
          # Recursive: handles BOTH the JSON array ([{name,value}]) and the
          # object wrapper ({"secrets":[...]}) output shapes.
          present() { printf '%s' "$out" | jq -e --arg n "$1" \
            '[.. | objects | select(has("name")) | .name] | any(. == $n)' >/dev/null; }
          missing=()
          for name in "${required[@]}"; do
            if ! present "$name"; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::MISSING Supabase secrets required by tenant-provision:"
            for name in "${missing[@]}"; do echo "::error::  $name"; done
            echo "::error::Set them with: supabase secrets set --project-ref $SUPABASE_PROJECT_REF <NAME>='...'"
            exit 1
          fi
          if present SUPABASE_SERVICE_ROLE_KEY; then
            echo "✅ Required secrets present: ${required[*]} SUPABASE_SERVICE_ROLE_KEY"
          else
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY not listed by secrets list (platform-reserved, auto-injected) — assuming present"
            echo "✅ Required secrets present: ${required[*]}"
          fi
      - name: Apply migrations
        # Token-based push (login role) — no DB password secret needed.
        # Proven 2026-08-10 against the premise-labs project.
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push --linked --include-all
      - name: Deploy waitlist-subscribe edge function
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy waitlist-subscribe \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy deck-view edge function
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        # --no-verify-jwt: the gated /investors page POSTs from the browser with
        # no user JWT (#8732), same as waitlist-subscribe above.
        run: |
          supabase functions deploy deck-view \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy tenant-provision edge function
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        # --no-verify-jwt is REQUIRED: the after_user_created auth hook sends
        # no user JWT. Caller auth is enforced inside the function (#802) via
        # the hook's Standard-Webhooks signature (AUTH_HOOK_SECRET secret)
        # or a matching user JWT; anon-key calls get 401.
        run: |
          supabase functions deploy tenant-provision \
            --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      # ══ #3627: THE CO-MOVE — step 3 of the flip sequence, IN THIS RUN ══════
      # The tenancy rename (20260915000001_tenancy_team_to_org.sql) is a hard
      # cut at the wire level (`provision_team` recreated with `p_org_id`;
      # PostgREST resolves RPCs by parameter NAME), so the app cannot be
      # compatible with both schemas. Before #3627 this workflow stopped after
      # the edge functions and the app flip was a SECOND operator dispatch:
      # the schema always landed alone, and every tenant-scoped read returned
      # 0 rows until that second dispatch arrived.
      #
      # ORDERING IS THE GUARANTEE, not the operator. This step is the LAST step
      # of the same job as the applies, and its `if:` carries no status check
      # function, so GitHub applies the implicit `success()` ("A default status
      # check of success() is applied unless you include one of these
      # functions"). A failed `db push` or edge-function deploy therefore
      # SKIPS this step and reddens the job — the app is never flipped onto a
      # half-applied schema.
      #
      # FAIL CLOSED. The dispatch API needs a token carrying `actions: write`
      # (the workflow-level `permissions:` block is what grants it; the repo
      # default is `read`). If that grant is ever lost the API answers 403 and
      # this step EXITS 1 — deliberately. A dispatch that silently no-ops would
      # leave the app stale while the run looked green, which is the exact
      # defect #3627 removes; so a body this step cannot read is refused too.
      #
      # WHAT COUNTS AS "DISPATCHED" (#3627 review): NOT `gh` exiting 0. The API
      # accepting the POST proves the request was received, not that the app
      # flipped — the dispatched run can still be CANCELLED before it flips (see
      # the watch below). `return_run_details=true` is a REQUEST PARAMETER, not
      # a temporal answer: the endpoint returns `200` + the run details only
      # when it is set, and `204` with no body when it is not. This step used to
      # send only `ref`, so the run id could never be learned and nothing could
      # observe the flip — the co-move reported a closed window on a POST alone.
      #
      # `-F`, NOT `-f`, for `return_run_details` (#7907). `gh api -f` ALWAYS
      # sends a STRING, so `-f "return_run_details=true"` posts `"true"` and the
      # endpoint rejects the body with HTTP 422 (`For 'properties/
      # return_run_details', "true" is not a boolean`) BEFORE a dispatch exists.
      # The flip is then never requested, and the step's own fail-closed error
      # misdirects the operator to the credential grant. `-F` coerces a bare
      # `true`/`false`/integer to the typed JSON value the schema requires;
      # `ref` above stays `-f` because it is genuinely a string.
      - name: Dispatch deploy-hosted (the app flip)
        if: github.event_name == 'workflow_dispatch' && env.SUPABASE_ACCESS_TOKEN != ''
        env:
          # Bound in env, never interpolated into the run text (#4334).
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          APP_REF: main
        run: |
          set -euo pipefail
          if ! resp="$(gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "repos/${REPO_SLUG}/actions/workflows/deploy-hosted.yml/dispatches" \
                -f "ref=${APP_REF}" \
                -F "return_run_details=true")"; then
            echo "::error::Could not dispatch deploy-hosted. The schema HAS been applied and the app has NOT flipped: every tenant-scoped read now returns 0 rows and provisioning fails closed (#3627). Fix the credential (the workflow-level 'permissions: actions: write' grant) and re-run, or flip the app by hand: gh workflow run deploy-hosted.yml --ref ${APP_REF}"
            exit 1
          fi
          # `|| true` is NOT used: an unparseable body must fail, and it must
          # fail with a message an operator can act on rather than jq's.
          if ! run_id="$(printf '%s' "$resp" | jq -r '(.workflow_run_id // empty)')"; then
            echo "::error::dispatch of deploy-hosted answered with an unreadable body (response: $resp) — the app flip is UNCONFIRMED. Check https://github.com/${REPO_SLUG}/actions/workflows/deploy-hosted.yml before treating the window as closed (#3627)"
            exit 1
          fi
          # A body we cannot read is not a success: this step must never report
          # a closed window on an answer it did not understand.
          case "$run_id" in
            ''|*[!0-9]*)
              # The API accepted the dispatch but did not name the run. Do NOT
              # guess one from `gh run list`: a guessed id has the right SHAPE
              # and may be the wrong RUN, and watching the wrong run would
              # report a flip that never happened. 'I do not know' is not
              # 'closed'.
              echo "::error::dispatch of deploy-hosted did not name a run (response: $resp) — the app flip is UNOBSERVED. Check https://github.com/${REPO_SLUG}/actions/workflows/deploy-hosted.yml before treating the window as closed (#3627)"
              exit 1
              ;;
          esac
          # The dispatch is not the flip. `deploy-hosted.yml` triggers on
          # `push: branches: [main]` for `tortoise/**` and friends, and every
          # run shares ONE constant `concurrency` group — so an ordinary merge
          # to main landing while the co-move flip is still PENDING supersedes
          # it AFTER the POST above returned 2xx, leaving the schema applied and
          # the app stale while this run reported success. `cancel-in-progress:
          # false` (#10155) removed the worse half: a RUNNING flip is no longer
          # killed mid-deploy. It cannot save a pending one — a shared group
          # holds one pending run and the newest push takes it. Only waiting on
          # the run distinguishes "the app flipped" from "the POST was
          # accepted".
          echo "✅ deploy-hosted dispatched (run ${run_id}) — waiting for the flip to complete (#3627)"
          echo "   https://github.com/${REPO_SLUG}/actions/runs/${run_id}"
          watch=(gh run watch "${run_id}" --repo "${REPO_SLUG}" --exit-status)
          # `timeout` is GNU coreutils — the ubuntu runner has it, macOS does not.
          # `-k 30s` makes the bound UNCONDITIONAL, for the same reason
          # `deploy-hosted.yml`'s retry loop carries it: `timeout` sends SIGTERM
          # and then WAITS, so without the grace a `gh` that traps TERM would
          # overrun the bound entirely and the `deploy` job's 360-minute default
          # would become the only bound (`docs/ops/ci-wall-clock.md` §1). The
          # `124` arm below keys on the expiry path, which is what a child that
          # honours TERM still produces WITH the grace (measured: `timeout -k 30s
          # 1s sleep 5` -> 124). Only a child that IGNORES TERM is SIGKILLed, and
          # that exits **137** — a non-zero, non-124 exit, which lands in the
          # state-read arm below and is therefore reported as UNKNOWN rather than
          # as a failed flip. Both paths fail closed; neither can assert "did NOT
          # flip" without a terminal conclusion.
          # ⛔ 330m, not the pre-#10155 45m, and the DERIVATION is honest about
          # what a `timeout-minutes` can and cannot bound:
          #   • what the caps CAN bound is EXECUTION — `timeout-minutes` is
          #     measured from when a runner picks the job up. A predecessor spends
          #     at most 55 + 65 + 25 = 145 min executing (the caps
          #     `deploy-hosted.yml` derives; re-derive this sum if they move), and
          #     this run the same.
          #   • what NO cap can bound is runner-QUEUE latency, and it is the
          #     larger term — measured on the newest SUCCESSFUL deploy-hosted run
          #     (40458809781, 2026-10-27): 167.3 min wall clock against 16.8 min of
          #     job execution, i.e. 42.5 + 66.2 + 41.8 min spent QUEUED, ~150 min
          #     of it INSIDE a run that already held the group. That single run's
          #     occupancy EXCEEDS 145, which is why the wait is not
          #     `2 × 145 + slack`: two such runs would be 334.6 min and expire a
          #     bound derived that way (`docs/ops/ci-wall-clock.md` §1 states the
          #     rule: a job that never gets a runner has no timeout at all).
          #     330 is instead the largest wait that fits inside the `deploy`
          #     job's ceiling (GitHub's 360-minute default, which this job does
          #     not override) with room for the apply steps that run before it —
          #     a POLICY bound against an unbounded term, not a computed one.
          # ⛔ COST OF THAT BOUND, stated because it is not paid here: this step
          # runs INSIDE the `deploy` job, which holds the constant
          # `supabase-deploy-apply` lock for the job's whole life
          # (`cancel-in-progress: false`). So an exhausted watch does not just
          # end one run — every later migration apply QUEUES behind this job for
          # up to the bound. That is the intended serialisation (schema and app
          # must land in one window) rather than a bug, but the remediation for a
          # flip that is genuinely stuck is to CANCEL this job, not to wait it
          # out and not to dispatch another apply.
          # ⛔ So 330 is a POLICY choice against an unbounded term, and the thing
          # that must be CORRECT is the verdict below, not the constant: only a
          # non-zero exit from a run that reached a terminal state is evidence
          # the flip failed. Exhausting the bound is NOT (see the branch below),
          # and neither is a FAILED POLL — `gh run watch` returns the same
          # non-zero exit for a transport/API error, so the arm below reads the
          # run's own `status`/`conclusion` before it claims anything.
          if command -v timeout >/dev/null 2>&1; then
            watch=(timeout -k 30s 330m "${watch[@]}")
          fi
          watch_rc=0
          "${watch[@]}" >/dev/null || watch_rc=$?
          # `timeout` exits 124 when the BOUND expired. That says nothing about
          # the flip: the run may still be QUEUED behind a predecessor or inside
          # a slow deploy, so reporting "did NOT flip" would be a false claim and
          # its remediation (re-dispatch / flip by hand) is now WRONG — both
          # queue behind the very run being given up on. Fail closed, but say
          # what is actually known (#10155 review round 2: a single healthy run
          # already measured 167 min of wall clock).
          if [ "${watch_rc}" -eq 124 ]; then
            echo "::error::deploy-hosted run ${run_id} did not FINISH within the 330-minute wait — the flip is UNKNOWN, NOT failed, and the schema IS applied. Do NOT re-dispatch and do NOT flip by hand: both queue behind this run and supersede its pending slot. Watch it instead: gh run watch ${run_id} --repo ${REPO_SLUG} (#3627)"
            exit 1
          fi
          if [ "${watch_rc}" -ne 0 ]; then
            # ⛔ A non-zero exit from `gh run watch` has TWO causes, and only ONE
            # of them is evidence about the flip: the run reached a non-success
            # CONCLUSION (`--exit-status`), or ANY poll failed — the CLI calls
            # `GetRun` every 3 s and returns `failed to get run: %w` on a
            # transport/5xx/auth error. Over a 330-minute window that is ~6,600
            # polls, so a single transient error is realistic, and its exit code
            # is indistinguishable from a failed deploy. Claiming "the app did
            # NOT flip" on it asserts a product conclusion that was never
            # observed, and its remediation (re-dispatch / flip by hand) is the
            # pair the 124 arm above exists to forbid — both queue behind the
            # run and supersede its pending slot.
            # So READ the run's own state before claiming anything. `status` +
            # `conclusion` is the terminal truth; only a COMPLETED run with a
            # non-success conclusion is evidence the flip failed.
            run_state=""
            run_conclusion=""
            if api_state="$(gh api "repos/${REPO_SLUG}/actions/runs/${run_id}" \
                  --jq '[.status, (.conclusion // "-")] | @tsv' 2>/dev/null)"; then
              run_state="${api_state%%$'\t'*}"
              run_conclusion="${api_state#*$'\t'}"
            fi
            if [ "${run_state}" = "completed" ] && [ "${run_conclusion}" = "success" ]; then
              # The watch exited non-zero because a POLL failed; the run itself
              # says it finished successfully. The conclusion is the stronger
              # signal (it is what `--exit-status` reads), so report it as what
              # it is — never as a failure, which would send an operator to
              # re-dispatch a deploy that already landed.
              echo "✅ app flip completed (run ${run_id}) — the run's own conclusion is success; the watch exited ${watch_rc}, which over a 330-minute window is a poll error and not the run: https://github.com/${REPO_SLUG}/actions/runs/${run_id}"
              exit 0
            fi
            if [ "${run_state}" != "completed" ] || [ -z "${run_conclusion}" ] || [ "${run_conclusion}" = "-" ]; then
              echo "::error::deploy-hosted run ${run_id} reported a non-zero exit (${watch_rc}) but its state is NOT terminal (status='${run_state:-unreadable}' conclusion='${run_conclusion:-none}') — the flip is UNKNOWN, NOT failed. The watch most likely lost the API on one of its polls. Do NOT re-dispatch and do NOT flip by hand: both queue behind this run and supersede its pending slot. Watch it instead: gh run watch ${run_id} --repo ${REPO_SLUG} (#3627)"
              exit 1
            fi
            echo "::error::deploy-hosted run ${run_id} did not reach success (status=${run_state}, conclusion=${run_conclusion}) — the app did NOT flip. The schema IS applied, so tenant-scoped reads return 0 rows and provisioning fails until the app is flipped (#3627). A merge to main landing while this flip was still PENDING supersedes it (deploy-hosted.yml's shared `concurrency` group holds one pending run; `cancel-in-progress: false` stops a RUNNING deploy being cancelled but cannot save a pending one); re-run this workflow, or flip by hand: gh workflow run deploy-hosted.yml --ref ${APP_REF}"
            exit 1
          fi
          echo "✅ app flip completed (run ${run_id}) — this schema's window is closed (#3627)"
