name: Bug report (beta)
description: File a bug or unexpected behavior you hit while beta testing Tortoise
title: "[bug]: "
labels: ["bug", "beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for beta testing Tortoise! A good bug report saves hours of back-and-forth.
        Please fill in the fields below — especially **Expected vs Actual** and, where relevant, the **Graph JSON**.
        See [docs/beta-feedback.md](https://github.com/daniel-ospina/tortoise/blob/main/docs/beta-feedback.md) for the full reporting guide.

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where did you hit the problem?
      options:
        - SDK (Python)
        - MCP server (agent connection)
        - CLI (tortoise ...)
        - REST API (api.premiselabs.co)
        - Hosted cloud
        - Self-hosted / Docker
        - Embedded (FalkorDBLite)
        - Onboarding flow
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "I expected the point to be created with kind='decision' and returned in the search results."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
      placeholder: "The call failed with HTTP 422 / the point was created but with the wrong kind / the agent's memory returned stale results."
    validations:
      required: true

  - type: textarea
    id: graph-json
    attributes:
      label: Graph JSON (if relevant)
      description: >-
        Paste the graph payload — the point/operator JSON you sent, the response you got,
        or the result of `tortoise_summarize_structure` (or a `tortoise backup --db <db-path>` export).
        If it's long, attach it as a `.json` file instead (drag & drop below).
      render: json
      placeholder: '{"kind": "decision", "content": "...", "props": {...}}'
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal numbered steps. Include the exact MCP tool call or CLI command if you have it.
      placeholder: |
        1. Start `tortoise serve --http --auth tenant`
        2. Call `tortoise_create_point(kind="decision", content="...")`
        3. Call `tortoise_search(query="...")`
        4. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tortoise version / commit
      description: "`pip show tortoise` version or the git SHA you're running."
      placeholder: "0.x.y / b535780f"
    validations:
      required: false

  # #4290: the provenance field the finding-provenance gate machine-validates.
  # NOT required: this form is the BETA path (`beta-feedback` exempts the issue
  # from the gate — an external report is about a released version, and a
  # hosted reporter has no checkout to emit from). Internal/agent findings,
  # filed with `gh issue create`, MUST include the line; the gate requires it
  # on any `bug` issue without `beta-feedback`.
  - type: input
    id: measured_at
    attributes:
      label: Measured at (if you have a checkout)
      description: >-
        The exact commit you measured against. In your checkout run
        `uv run python tools/finding_provenance.py --emit` and paste the single line
        it prints. The `finding-provenance` CI job uses this line to tell a
        stale measurement from a live defect (#4290). If you are reporting
        against a hosted/released version, leave this blank.
      placeholder: "Measured at: main@a0ea5e81fe915dc38f3b3ee91df3043733a86691 on 2026-09-20"
    validations:
      required: false

  - type: dropdown
    id: transport
    attributes:
      label: Connection mode
      description: How is your agent connected to Tortoise?
      options:
        - Hosted (streamable-http → api.premiselabs.co)
        - Local MCP over HTTP (tortoise serve --http)
        - Local MCP stdio
        - Docker compose (local daemon)
        - Embedded (FalkorDBLite, single-agent)
        - N/A
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output (optional)
      description: Paste the relevant stack trace or server log lines.
      render: shell
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### If you are an agent working this issue — record what you learn in the graph

        Before you close this, write what you found into the **Tortoise graph**
        (`TORTOISE_DB_URI='docker://:@127.0.0.1:16379/tortoise'`) as an `evidence` point, wired to the
        **objective it serves** — never to this issue. A finding left in a session dies with it, and the
        next lane re-derives it from scratch. This is the mechanism that keeps the map current as we work
        the chain of objectives and, ultimately, find the best path to **revenue**.

        | Objective | Node id |
        |---|---|
        | REVENUE (the ultimate goal) | `1a0f4c93565-8ba390705095` |
        | PILOTS / RECOMMENDATION / RETENTION | `1a0f4c9a91e-a956a099edb6` |
        | LAUNCH THE PRIVATE ALPHA | `1a0f4c9ae4b-70eda40b4c9f` |
        | COMPLETE P0/P1 (blocks the alpha) | `1a0f4c9af8a-8b24ff73d40b` |
        | TEST MARKETING ROUTES (design partners) | `1a0f4c9b189-5ec2d96fe89f` |
        | BE ABLE TO MERGE | `1a0f4c9b345-7014a92c0f00` |
        | DRAIN THE PR BACKLOG | `1a0f4c9b542-56f9e229dced` |

        A useful record has **four parts** — omit one and the next reader cannot use it:

        1. **The mechanism** — what actually happens, with `file:line` for the code that decides.
        2. **The measurement** — the command and its real output.
        3. **The bound** — what you did *not* verify, and your sample size.
        4. **The next move** — the exact file and line to start from, or why there is none.

        ⛔ **Do not file a peer issue for a known root.** If this is a symptom of an existing root cause,
        comment the evidence on the root — the same **root cause**, not the same words.

        ⛔ **Mark deliberate departures** with an `OVERRIDES:` line, so a later reader can tell an
        intentional ruling from an accident of history.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      description: A few quick checks that speed up triage.
      options:
        - label: I checked whether this is a symptom of an existing root cause
          required: false
        - label: I searched existing issues and Discussions for this problem first
          required: false
        - label: I've included graph JSON or a screenshot where the bug involves graph data
          required: false
