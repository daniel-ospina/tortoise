name: Agent finding (internal)
description: An internal finding from a lane — a measured result, a defect, or a routing decision
title: "[finding]: "
# ⛔ THE GATE'S KEY IS THE PROVENANCE FIELD'S LABEL, BELOW — and the two keys
# this header used to name were both DEAD IN PRODUCTION (#10146 F1, twice).
#
#   1. `labels: ["internal"]`. `internal` is NOT a label in this repo (measured
#      2026-11-05: `gh api repos/daniel-ospina/tortoise/labels?per_page=100`
#      → 78 labels, `.name | grep -x internal` → exit 1), and GitHub SILENTLY
#      DROPS a template label that does not exist. So a form-filed issue
#      arrived with NO label and a refusal keyed on it never fired.
#   2. `<!-- finding -->` inside a `type: markdown` element. GitHub's form
#      schema says of `markdown`: *“Markdown text that is displayed in the form
#      … but is not submitted”* — so the marker NEVER reaches the issue body,
#      and a gate keying on it saw nothing on any real filing either. Both
#      tests were green because the renderer wrote the marker in itself.
#
# A label is repo STATE that silently diverged; a `markdown` element is UI text
# the platform drops at filing. So the key is a SUBMITTED, REQUIRED field whose
# LABEL the gate's own claim parser selects — `### Measured at …`, which GitHub
# renders into the body for every filing (a field's `### <label>` heading is
# part of the submitted markdown; only `markdown` elements are not). That is
# the `measured_at` field below, and it is why its label begins `Measured at`:
# it is not decoration, it is the gate's trigger. Delete or rename it and a
# malformed filing goes back to being silently SKIPPED (#10146).
#
# The `title:` prefix above stays as a SECOND key: GitHub applies it at filing
# and never validates it against repo state. It is weaker than the field label
# — the filer can overwrite a pre-populated title — so the gate must never rest
# on it alone.
#
# Pinned against a body RENDERED THE WAY GITHUB RENDERS IT (markdown elements
# excluded) in `tests/test_finding_provenance.py`
# (`test_the_form_delivers_the_key_the_gate_keys_on`) and
# `tests/test_10146_agent_finding_form.py`, so dropping the claim from the
# field label reddens them.
body:
  - type: markdown
    attributes:
      value: |
        **Keep this short.** The owner's standing instruction is to reduce bureaucracy, so this form is
        deliberately four fields. A finding that reaches the graph is worth more than a well-formatted one
        that stays in a session.

  - type: markdown
    attributes:
      value: |
        **Provenance is the one field the gate refuses you for (#10146).** Paste the output of
        `uv run python tools/finding_provenance.py --emit`. It prints exactly one line, and that line has the shape `Measured at: <ref>@<40-hex-sha> on <YYYY-MM-DD>`. Do not hand-type a short sha.
        `tools/finding_provenance.py --validate` accepts the body you are about to file.

  - type: textarea
    id: measured_at
    attributes:
      # ⛔ THIS LABEL IS THE GATE'S TRIGGER — do not “tidy” it into `Provenance`.
      # Rendered as `### Measured at (paste the `--emit` line)` it is a provenance
      # CLAIM by the gate's own PROVENANCE_CLAIM_RE, so the body is gated (and
      # refused as UNKNOWN_PROVENANCE when the answer is not a parseable line)
      # instead of being skipped. See the file header.
      label: Measured at (paste the `--emit` line)
      description: The full `Measured at:` line from `uv run python tools/finding_provenance.py --emit` — a line beginning `Measured at` followed by `<ref>@<40-hex-sha> on <YYYY-MM-DD>`. Re-read the finding against the tree you name before you paste; an unmeasured guess is worse than none.
      placeholder: Run `uv run python tools/finding_provenance.py --emit` in the checkout you measured and paste its single output line here.
    validations:
      required: true

  - type: dropdown
    id: objective
    attributes:
      label: Objective this serves
      description: Wire the graph record to this objective — never to this issue.
      options:
        - REVENUE (the ultimate goal)
        - PILOTS / RECOMMENDATION / RETENTION
        - LAUNCH THE PRIVATE ALPHA
        - COMPLETE P0/P1 (blocks the alpha)
        - TEST MARKETING ROUTES (design partners)
        - BE ABLE TO MERGE
        - DRAIN THE PR BACKLOG
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: |
        Four parts — omit one and the next reader cannot use it:
        (1) the mechanism, with `file:line` for the code that decides;
        (2) the measurement, the command and its real output;
        (3) the bound, what you did NOT verify and your sample size;
        (4) the next move, the exact file and line to start from, or why there is none.
      placeholder: |
        Mechanism:
        Measurement:
        Bound:
        Next move:
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### Record it in the graph

        Write the finding into the **Tortoise graph**
        (`TORTOISE_DB_URI='docker://:@127.0.0.1:16379/tortoise'`) as an `evidence` point, wired to the
        **objective it serves** — never to this issue. A finding left in a session dies with it, and the
        next lane re-derives it from scratch.

        | Objective | Node id |
        |---|---|
        | REVENUE (the ultimate goal) | `1a0f4c93565-8ba390705095` |
        | PILOTS / RECOMMENDATION / RETENTION | `1a0f4c9a91e-a956a099edb6` |
        | LAUNCH THE PRIVATE ALPHA | `1a0f4c9ae4b-70eda40b4c9f` |
        | COMPLETE P0/P1 (blocks the alpha) | `1a0f4c9af8a-8b24ff73d40b` |
        | TEST MARKETING ROUTES (design partners) | `1a0f4c9b189-5ec2d96fe89f` |
        | BE ABLE TO MERGE | `1a0f4c9b345-7014a92c0f00` |
        | DRAIN THE PR BACKLOG | `1a0f4c9b542-56f9e229dced` |

        ⛔ **Do not file a peer issue for a known root.** If this is a symptom of an existing root cause,
        comment the evidence on the root — the same **root cause**, not the same words.

        ⛔ **Mark deliberate departures** with an `OVERRIDES:` line, so a later reader can tell an
        intentional ruling from an accident of history.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I checked whether this is a symptom of an existing root cause
          required: false
        - label: This finding is written to the graph, wired to its objective
          required: false
