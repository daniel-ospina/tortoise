# Branch protection via probot-settings (issue #176, Task 13)
# If probot-settings app is NOT installed, configure manually:
#   Settings -> Branches -> main -> Require status checks -> redis-guard
repository:
  branch-protection:
    - branch: main
      enforce_admins: false
      required_status_checks:
        strict: true
        contexts:
          - redis-guard
      required_pull_request_reviews: null
