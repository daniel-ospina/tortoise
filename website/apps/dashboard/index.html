    <!-- #4054: the Supabase JS UMD bundle is GONE from this page. It existed to
         provide `window.supabase` for client-side session auth (D5 #572), which
         is exactly what the BFF removed: the browser holds only the opaque
         HttpOnly `__Host-session` handle and never a token, so supabase-js has
         nothing to do here. Dropping it also removes a script that ran
         same-origin with access to cookies and the anon key.
         `main.jsx` must not reintroduce `createClient` — pinned by
         tests/test_no_legacy_token_path.py and the dashboard's sessionGate tests. -->
    <script type="module" src="/src/main.jsx"></script>
