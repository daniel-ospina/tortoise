<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tortoise — Welcome</title>
  <meta name="description" content="Session and recovery bridge for Tortoise: sign in to your dashboard or reset your password.">
  <meta name="theme-color" content="#060b14">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="/logo.png">
  <!-- #1225/#1511: shared session bridge + gate helpers — loaded FIRST so
       the gate's readValidSession is synchronous at gate time. -->
  <script src="/assets/supabase-session.js"></script>
  <!-- #1494/#1511: hard gate — /welcome is POST-auth. Without a VALID
       session (the shared readValidSession enforces strict expiry — the
       stale-session leak class) replace to /auth IMMEDIATELY, clearing the
       stale session first so no gate can re-bounce it (loop-safety by
       construction). location.replace keeps Back from returning here.
       Recovery links (#type=recovery) and confirmation/OAuth callbacks
       (#access_token=…) are exempt (their tokens are consumed below). -->
  <script>
    (function () {
      try {
        if (/#(access_token|error|type=)/.test(window.location.hash)) return;
        var s = (typeof window.readValidSession === "function") ? window.readValidSession() : null;
        if (!s) {
          // Stale/invalid session present → clear it (cookie + legacy keys)
          // so the /auth gate can't re-bounce it back here.
          if (typeof window.clearStoredSession === "function") window.clearStoredSession();
          if (typeof window.bounceToAuth === "function") window.bounceToAuth(window.location.search, window.location.hash);
          else window.location.replace("/auth" + window.location.search + window.location.hash);
        }
      } catch (e) { /* best-effort — the async session wait below still applies */ }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060b14;
      --surface: #0d1a2d;
      --surface-hover: #12223d;
      --text: #cbd5e1;
      --text-dim: #94a3b8;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --green: #4ade80;
      --green-dim: rgba(74, 222, 128, 0.15);
      --gold: #f59e0b;
      --red: #ef4444;
      --border: #1e293b;
      --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      --serif: 'Georgia', 'Times New Roman', serif;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 20px;
      padding: 14px 24px; background: rgba(6, 11, 20, 0.92);
      border-bottom: 1px solid var(--border, #1e293b);
      backdrop-filter: blur(8px);
    }
    .topbar .logo { display: flex; align-items: center; text-decoration: none; line-height: 1; margin: 0; }
    .topbar .logo img { height: 40px; width: auto; display: block; }
    .topbar nav { flex: 1; display: flex; gap: 16px; }
    .topbar nav a { color: var(--text-dim, #94a3b8); text-decoration: none; font-size: 14px; }
    .topbar nav a:hover, .topbar nav a.active { color: var(--accent, #06b6d4); }
    .topbar .login { background: var(--accent, #06b6d4); color: #04121a; padding: 6px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
    .topbar .login:hover { background: var(--accent-hover, #0891b2); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-top: 80px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      padding: 2rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo a {
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--text);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent);
    }

    .loading-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-dim);
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-state {
      text-align: center;
      padding: 2rem 1rem;
    }

    .error-state p {
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .error-state a {
      color: var(--accent);
      text-decoration: none;
    }

    .hidden {
      display: none;
    }

    /* #863: password-reset landing (recovery links redirect here). */
    #reset-panel {
      text-align: center;
      padding: 0.5rem 0;
    }

    #reset-panel h1 {
      font-family: var(--serif, Georgia, serif);
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--text, #cbd5e1);
      margin-bottom: 1.5rem;
    }

    #reset-panel .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    #reset-panel .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim, #94a3b8);
      margin-bottom: 0.375rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #reset-panel .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border, #1e293b);
      border-radius: 8px;
      background: var(--surface, #0d1a2d);
      color: var(--text, #cbd5e1);
      font-family: var(--mono, monospace);
      font-size: 14px;
    }

    #reset-panel .form-group input:focus {
      outline: none;
      border-color: var(--accent, #06b6d4);
    }

    #reset-panel .btn-submit {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: var(--accent, #06b6d4);
      color: var(--bg, #060b14);
      font-family: var(--mono, monospace);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    #reset-panel .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reset-error {
      text-align: center;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    #reset-error p {
      color: var(--red, #ef4444);
      margin: 0;
    }

    #reset-success {
      padding: 1rem 0;
    }

    #reset-success p {
      color: var(--green, #4ade80);
      margin-bottom: 0.75rem;
    }

    #reset-success a {
      color: var(--accent, #06b6d4);
      text-decoration: none;
    }
  
    /* Legal footer */
    .legal-footer {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      padding: 1.75rem 1.5rem 2.25rem;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-family: var(--mono);
    }
    .legal-footer a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .legal-footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/"><img src="/logo.png" alt="Premise Labs" onerror="this.style.display='none'"></a>
    <nav>
      <a href="https://tortoise.premiselabs.co/">Product</a>
      <a href="/docs">Docs</a>
    </nav>
    <a class="login" href="https://app.premiselabs.co">Login</a>
  </div>

  <div class="container">
    <div class="logo">
      <a href="/">Premise <span>Labs</span></a>
    </div>

    <!-- Loading state -->
    <div id="loading" class="loading-state" role="status" aria-live="polite">
      <div class="loading-spinner"></div>
      <p>Checking your session&hellip;</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="error-state hidden" role="alert">
      <p id="error-message">Welcome is temporarily unavailable.</p>
      <p><a href="https://app.premiselabs.co">Go to dashboard</a> · <a href="mailto:hello@premiselabs.co">Contact support</a></p>
    </div>

    <!-- #863: password-reset landing — recovery emails redirect here
         (origin + /welcome.html, the same allow-listed target the #801
         signup confirmation flow uses). Recovery mode short-circuits the
         session bridge: the reset panel is the only thing shown
         mid-password-reset. method=post + action per the #527 form-safety
         contract (no GET echo). -->
    <div id="reset-panel" class="hidden">
      <h1>Reset your password</h1>
      <div id="reset-error" class="error-state hidden" role="alert">
        <p id="reset-error-text"></p>
        <p><a href="/auth?mode=login">Back to sign in</a></p>
      </div>
      <div id="reset-success" class="hidden" role="status">
        <p id="reset-success-text"></p>
        <p><a href="/auth?mode=login">Sign in with your new password →</a></p>
      </div>
      <form id="reset-form" method="post" action="/welcome" onsubmit="resetPassword(event)">
        <div class="form-group">
          <label for="reset-password">New password</label>
          <input type="password" id="reset-password" name="reset-password" placeholder="••••••••" required autocomplete="new-password" minlength="8">
        </div>
        <div class="form-group">
          <label for="reset-confirm">Confirm new password</label>
          <input type="password" id="reset-confirm" name="reset-confirm" placeholder="••••••••" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn-submit" id="btn-reset">Update password</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- #1225: the session bridge loads in <head> (before the gate). -->
  <script>
    // ── Configuration ──────────────────────────────────────────────────────
    const SUPABASE_URL = "https://ybetwichurajbfswfeqa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliZXR3aWNodXJhamJmc3dmZXFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzgzNDYsImV4cCI6MjEwMDg1NDM0Nn0.YHysJAebPualDNDQTU5bnGBUHg5guLe8eBadm0LiEiY";
    // On the email-confirmation / OAuth callback, the session arrives via the
    // URL fragment a moment after createClient. Current supabase-js awaits
    // its async init inside getSession(), but older browser-cached builds
    // don't — give the session a bounded wait window before declaring
    // "no session" so a legitimate callback never bounces to a dead state
    // (#527).
    const SESSION_WAIT_MS = 5000;

    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const supabaseUrl = isLocal
      ? "http://127.0.0.1:54321"
      : SUPABASE_URL;
    const supabaseAnonKey = isLocal
      ? "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      : SUPABASE_ANON_KEY;
    // Guard: check if the anon key placeholder was replaced at deploy time
    const isConfigured = supabaseAnonKey && !supabaseAnonKey.includes("{{");

    // #863: recovery-mode detection. supabase-js consumes the URL fragment
    // during createClient init — snapshot the hash FIRST so a recovery-link
    // landing (type=recovery) is recognized even when PASSWORD_RECOVERY is
    // not emitted (supabase/auth#1948). Recovery mode short-circuits the
    // bridge below. The same early snapshot feeds the no-session
    // redirect (a confirmation/OAuth callback's #access_token=… fragment
    // must survive the hop to /auth — supabase-js strips it from the URL
    // during init, so reading location.hash later would read empty).
    const landingHash = window.location.hash;
    const recoveryLanding = /[?&#]type=recovery/.test(landingHash);
    let recoveryMode = recoveryLanding;

    let supabaseClient = null;
    if (isConfigured) {
      // #1225: cross-subdomain session bridge. The shared factory
      // (assets/supabase-session.js) persists the parsed session to the
      // .premiselabs.co cookie the dashboard reads, and is null-safe — it
      // returns null (never throws) when the CDN script is blocked or init
      // fails, so the start block below can degrade to a clear message.
      if (typeof window.createTortoiseSupabaseClient === "function") {
        supabaseClient = window.createTortoiseSupabaseClient(supabaseUrl, supabaseAnonKey);
      } else {
        console.warn("supabase-session.js shared script did not load — auth disabled");
      }
    } else {
      console.warn("SUPABASE_ANON_KEY not configured — page disabled");
    }

    // ── Session wait (#527) ───────────────────────────────────────────────
    // Resolve with the session as soon as it's available (SIGNED_IN event or
    // getSession), or null after the timeout. Non-throwing.
    function waitForSession(timeoutMs) {
      return new Promise((resolve) => {
        let settled = false;
        let authSub = null;
        let timer = null;
        const finish = (session) => {
          if (settled) return;
          settled = true;
          if (timer) clearTimeout(timer);
          if (authSub) authSub.unsubscribe();
          resolve(session);
        };
        timer = setTimeout(() => finish(null), timeoutMs);
        // #1511: only a STRICTLY VALID session resolves the wait (access_token
        // + expires_at present + future) — presence is not auth. A stale
        // session falls through to the timeout → the no-session redirect
        // instead of leaking into welcome.
        const isValid = (s) => s && s.access_token && s.expires_at &&
          s.expires_at * 1000 > Date.now();
        try {
          authSub = supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_IN" && isValid(session)) finish(session);
          }).data.subscription;
        } catch (e) { /* no auth subscription available — getSession poll only */ }
        supabaseClient.auth.getSession()
          .then(({ data: d }) => { if (isValid(d.session)) finish(d.session); })
          .catch(() => {});
      });
    }

    // ── Session/recovery bridge ───────────────────────────────────────────
    // #1566: provisioning moved INTO the app — this page is now a pure
    // session/recovery bridge (no polling, no team mint, no key reveal).
    // Recovery landings short-circuit to the reset panel; a signed-in
    // visitor goes to the app ROOT (the session is in the parent-domain
    // cookie; first-timers are provisioned in-app and see the welcome card,
    // returning users get the dashboard home); no session → the single /auth
    // page, preserving search + hash for OAuth/email-confirmation callbacks.
    // Do NOT restore the provisioning pipeline here — it would recreate the
    // double-provision surface #1082/#1566 guard against.
    async function runSessionBridge() {
      // #863: recovery-mode guard — a PASSWORD_RECOVERY event that arrives
      // before the wait must still stop the bridge and show the reset panel.
      if (recoveryMode) {
        showResetPanel();
        return;
      }
      const session = await waitForSession(SESSION_WAIT_MS);

      // #863 (review P2): re-check recoveryMode AFTER the await — the
      // PASSWORD_RECOVERY event fires asynchronously during supabase-js
      // init, i.e. while this wait is suspended. Without this second check
      // the event-driven fallback would miss the reset panel.
      if (recoveryMode) {
        showResetPanel();
        return;
      }

      if (session) {
        // #1566: signed-in visitor on this legacy page → app ROOT. A claim
        // in flight (tt_claim_pending marker cookie set by the dashboard
        // claim card) routes to the claim card. location.replace: Back must
        // not return.
        const claimInFlight = /(?:^|; )tt_claim_pending=/.test(document.cookie);
        window.location.replace(claimInFlight ? "https://app.premiselabs.co/?claim=1" : "https://app.premiselabs.co");
        return;
      }

      // No session → the one auth screen instead of dead-ending on this
      // post-auth page. PRESERVE search + hash: welcome.html is the
      // OAuth/email-confirmation callback target (#1224 state-expiry lands
      // as ?error=…, which the /auth banner renders; supabase-js consumes
      // #access_token=… on the destination to complete the session).
      // Recovery landings are handled earlier (recoveryMode).
      // location.replace: Back must not return to this page (#1494 hard
      // gate).
      window.location.replace("/auth" + window.location.search + landingHash);
    }

    // ── Password-reset landing (#863) ─────────────────────────────────────
    // Shown in recovery mode (hash type=recovery or PASSWORD_RECOVERY
    // event). All feedback renders in the panel-local #reset-error/
    // #reset-success elements — the page-level showError/showSuccess state
    // machine (loading/error/success) must never run in recovery mode.
    function showResetPanel() {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("error-state").classList.add("hidden");
      document.getElementById("reset-panel").classList.remove("hidden");
      const el = document.getElementById("reset-password");
      if (el) el.focus();
    }

    let resetInFlight = false;  // #863: double-submit guard

    function resetShowError(message) {
      const errText = document.getElementById("reset-error-text");
      if (errText) errText.textContent = message;
      document.getElementById("reset-error").classList.remove("hidden");
      document.getElementById("reset-success").classList.add("hidden");
    }

    async function resetPassword(event) {
      event.preventDefault();
      if (resetInFlight) return;
      resetInFlight = true;
      try {
        document.getElementById("reset-error").classList.add("hidden");
        const pw = document.getElementById("reset-password").value;
        const confirm = document.getElementById("reset-confirm").value;
        if (!pw) { resetShowError("Please choose a new password."); return; }
        if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw) || !/[^A-Za-z0-9]/.test(pw)) {
          resetShowError("Password is too weak. Use at least 8 characters with a mix of letters, numbers, and symbols.");
          return;
        }
        if (pw !== confirm) { resetShowError("Passwords don't match."); return; }
        const { error } = await supabaseClient.auth.updateUser({ password: pw });
        if (error) {
          const code = String(error.code || error.name || "").toLowerCase();
          const msg = String(error.message || "").toLowerCase();
          if (error.status === 401 || code.includes("invalid_jwt") || code.includes("auth_session_missing")
              || msg.includes("expired") || msg.includes("invalid jwt") || msg.includes("session")) {
            // Expired / invalid link, or the recovery session was dropped
            // client-side (auth_session_missing — supabase/auth#1948-era
            // builds) — either way the user must request a new link.
            resetShowError("This reset link has expired or is invalid. Request a new one.");
          } else if (code.includes("weak_password") || msg.includes("weak password")) {
            resetShowError("Password is too weak. Use at least 8 characters with a mix of letters, numbers, and symbols.");
          } else {
            resetShowError("Something went wrong. Please try again — or request a new reset link.");
          }
          return;
        }
        // Success: swap the form for the panel-local success state.
        document.getElementById("reset-form").classList.add("hidden");
        document.getElementById("reset-error").classList.add("hidden");
        document.getElementById("reset-success-text").textContent = "Password updated — sign in with your new password.";
        document.getElementById("reset-success").classList.remove("hidden");
      } catch (err) {
        // #863 (review P2): network failures throw out of updateUser — the
        // {error} contract only covers API responses. Never leave the user
        // with a silently re-enabled button and no feedback.
        console.error("resetPassword:", err);
        resetShowError("Something went wrong. Please try again — or request a new reset link.");
      } finally {
        resetInFlight = false;
      }
    }

    // ── Start ──────────────────────────────────────────────────────────────
    if (isConfigured && supabaseClient) {
      // #863: recovery-mode landing — short-circuit the bridge entirely.
      // The PASSWORD_RECOVERY event (own subscription — NOT inside
      // waitForSession, which unsubscribes on settle) also flips recoveryMode
      // for event-driven landings where the hash snapshot missed.
      supabaseClient.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryMode = true;
          showResetPanel();
        }
      });
      if (recoveryMode) {
        showResetPanel();
      } else {
        runSessionBridge();
      }
    } else if (!isConfigured) {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("error-state").classList.remove("hidden");
      document.getElementById("error-message").textContent = "This page is not configured yet. Please contact support.";
    } else {
      // #1225 (review V2-P2-2): configured but no client — the supabase CDN
      // (or the shared session bridge) was blocked. Distinct message from the
      // unconfigured case, mirroring the #527 fail-closed pattern on signup/signin.
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("error-state").classList.remove("hidden");
      document.getElementById("error-message").textContent = "Welcome is temporarily unavailable (script blocked). Please try again later.";
    }

</script>
