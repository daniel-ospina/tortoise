<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Tortoise</title>
  <meta name="description" content="Create your Tortoise account and start building your knowledge graph.">
  <meta name="theme-color" content="#060b14">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060b14;
      --surface: #0d1a2d;
      --text: #cbd5e1;
      --text-dim: #64748b;
      --accent: #06b6d4;
      --accent-hover: #0891b2;
      --green: #4ade80;
      --red: #ef4444;
      --gold: #f59e0b;
      --border: #1e293b;
      --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      --serif: 'Georgia', 'Times New Roman', serif;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 20px;
      padding: 14px 24px; background: rgba(6, 11, 20, 0.92);
      border-bottom: 1px solid var(--border, #1e293b);
      backdrop-filter: blur(8px);
    }
    .topbar .logo { font-family: var(--serif, Georgia, serif); font-size: 1.15rem; color: var(--text, #cbd5e1); text-decoration: none; }
    .topbar .logo span { color: var(--accent, #06b6d4); }
    .topbar nav { flex: 1; display: flex; gap: 16px; }
    .topbar nav a { color: var(--text-dim, #64748b); text-decoration: none; font-size: 14px; }
    .topbar nav a:hover, .topbar nav a.active { color: var(--accent, #06b6d4); }
    .topbar .login { background: var(--accent, #06b6d4); color: #04121a; padding: 6px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
    .topbar .login:hover { background: var(--accent-hover, #0891b2); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-top: 80px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo a {
      font-family: var(--serif);
      font-size: 1.5rem;
      color: var(--text);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent);
    }

    h1 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text);
      text-align: center;
      margin-bottom: 2rem;
    }

    .providers {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn-provider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-provider:hover {
      border-color: var(--accent);
      background: rgba(6, 182, 212, 0.08);
    }

    .btn-provider svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--text-dim);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 0.375rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--red);
      font-size: 13px;
      margin-bottom: 1rem;
      display: none;
    }

    .error.visible {
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 13px;
      color: var(--text-dim);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/">Tortoise<span>.</span></a>
    <nav>
      <a href="/product.html">Product</a>
      <a href="/docs">Docs</a>
    </nav>
    <a class="login" href="https://app.premiselabs.co">Login</a>
  </div>

  <div class="container">
    <div class="logo">
      <a href="/">Premise <span>Labs</span></a>
    </div>
    <h1>Create your account</h1>

    <div id="error" class="error"></div>

    <div class="providers">
      <button class="btn-provider" onclick="signInWithProvider('github')" id="btn-github">
        <!-- GitHub icon -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.01 12.01 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Continue with GitHub
      </button>
      <button class="btn-provider" onclick="signInWithProvider('google')" id="btn-google">
        <!-- Google icon -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <div class="divider">or</div>

    <form id="email-form" onsubmit="signUpWithEmail(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-submit" id="btn-submit">Create account</button>
    </form>

    <div class="footer">
      Already have an account? <a href="/signin.html">Sign in</a>
    </div>
  </div>

  <!-- Supabase JS client from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ── Configuration ──────────────────────────────────────────────────────
    const SUPABASE_URL = "https://ybetwichurajbfswfeqa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliZXR3aWNodXJhamJmc3dmZXFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzgzNDYsImV4cCI6MjEwMDg1NDM0Nn0.YHysJAebPualDNDQTU5bnGBUHg5guLe8eBadm0LiEiY";
    const WELCOME_URL = "/welcome.html";

    // In dev/local, fall back to local Supabase
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const supabaseUrl = isLocal
      ? "http://127.0.0.1:54321"
      : SUPABASE_URL;
    const supabaseAnonKey = isLocal
      // Local Supabase default anon key (public, safe to commit)
      ? "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      : SUPABASE_ANON_KEY;

    // Guard: check if the anon key placeholder was replaced at deploy time
    const isConfigured = supabaseAnonKey && !supabaseAnonKey.includes("{{");

    let supabaseClient = null;
    if (isConfigured) {
      supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
    } else {
      console.warn("SUPABASE_ANON_KEY not configured — auth disabled");
      document.querySelectorAll("button").forEach(function(btn) { btn.disabled = true; });
      var errorEl = document.getElementById("error");
      errorEl.textContent = "Signup is not configured yet. Please contact support.";
      errorEl.classList.add("visible");
    }

    // ── Error display ──────────────────────────────────────────────────────
    function showError(message) {
      const el = document.getElementById("error");
      el.textContent = message;
      el.classList.add("visible");
    }

    function clearError() {
      const el = document.getElementById("error");
      el.classList.remove("visible");
    }

    // ── Loading state ──────────────────────────────────────────────────────
    function setLoading(loading) {
      document.querySelectorAll("button").forEach((btn) => {
        btn.disabled = loading;
        if (loading) {
          btn.dataset.originalText = btn.textContent;
          btn.innerHTML = '<span class="loading-spinner"></span>';
        } else {
          btn.textContent = btn.dataset.originalText || btn.textContent;
        }
      });
    }

    // ── OAuth sign in ──────────────────────────────────────────────────────
    async function signInWithProvider(provider) {
      if (!supabaseClient) { showError("Auth not configured."); return; }
      clearError();
      setLoading(true);

      const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: provider,
        options: {
          redirectTo: window.location.origin + WELCOME_URL,
        },
      });

      if (error) {
        showError(error.message);
        setLoading(false);
        return;
      }

      // Supabase OAuth redirects the user, so we don't need to do anything else
      if (data?.url) {
        window.location.href = data.url;
      }
    }

    // ── Email/password sign up ─────────────────────────────────────────────
    async function signUpWithEmail(event) {
      event.preventDefault();
      if (!supabaseClient) { showError("Auth not configured."); return; }
      clearError();
      setLoading(true);

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        setLoading(false);
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: window.location.origin + WELCOME_URL,
        },
      });

      if (error) {
        if (error.message.includes("already registered") || error.message.includes("already exists")) {
          showError("An account with this email already exists. Please sign in instead.");
        } else {
          showError(error.message);
        }
        setLoading(false);
        return;
      }

      // If email confirmation is enabled, show a message
      if (data?.user?.identities?.length === 0) {
        showError("An account with this email already exists. Please sign in instead.");
        setLoading(false);
        return;
      }

      // Redirect to welcome page
      // For email/password signup without email confirmation, the user is already signed in
      window.location.href = WELCOME_URL;
    }
  </script>
</body>
</html>
