# Tortoise Hosted API — Fly.io configuration
# See: docs/epics/2026-08-03-tortoise-hosted-platform/04-plan.md §5

app = "tortoise-y4mjjq"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.hosted"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 200

  [[services.http_checks]]
    interval = "15s"
    timeout = "15s"
    grace_period = "180s"
    method = "get"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
  # memory_mb bumped 512→2048 for torch (sentence-transformers ~1.5GB loaded model).
  # cpus bumped 1→2 so vector encoding doesn't starve the API thread during
  # cold starts and backfill. Estimated cost impact: +$1-3/mo (Fly shared-cpu-2x).

[[mounts]]
  source = "tortoise_api_data"
  destination = "/data"

[env]
  TORTOISE_DB_URI = ""  # Constructed at runtime by entrypoint.sh from FALKORDB_CLOUD_URI → FalkorDB Cloud
  FASTAPI_INTERNAL_KEY = ""  # Set via fly secrets

[deploy]
  wait_timeout = "5m"
  strategy = "rolling"
  release_command = "python -c 'from tortoise.hosted_api import _make_sdk; s = _make_sdk(namespace=\"registry\"); s._get_proj(); print(\"registry OK\")'"
