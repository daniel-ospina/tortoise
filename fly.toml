# Tortoise Hosted API — Fly.io configuration
# See: docs/epics/2026-08-03-tortoise-hosted-platform/04-plan.md §5

app = "tortoise-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.hosted"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 200

  [[services.http_checks]]
    interval = "15s"
    timeout = "15s"
    grace_period = "120s"
    method = "get"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "tortoise_api_data"
  destination = "/data"

[env]
  TORTOISE_DB_URI = ""  # Constructed at runtime by entrypoint.sh from FALKORDB_PASSWORD → redis://:{pwd}@falkordb-tortoise.internal:6379/tortoise
  FASTAPI_INTERNAL_KEY = ""  # Set via fly secrets

[deploy]
  wait_timeout = "5m"
  strategy = "rolling"
  release_command = "python -c 'from tortoise.hosted_api import _make_sdk; s = _make_sdk(namespace=\"registry\"); s._get_proj(); print(\"registry OK\")'"
