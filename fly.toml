# Tortoise Hosted API — Fly.io configuration
# See: docs/infra-runbook.md §6 — availability & machine topology (#2850)

app = "tortoise-y4mjjq"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.hosted"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  # ── Machine lifecycle policy (#2850, P0) — explicit, not platform default ──
  # All three keys were previously ABSENT, so production ran on Fly's
  # undocumented-here defaults (auto_stop_machines="off",
  # auto_start_machines=true, min_machines_running=0) — invisible in review.
  # Full reasoning, cost math, and the 2-machine blocker: docs/infra-runbook.md §6.
  #
  # auto_stop_machines="off" — never stop. One machine + single-attach volume +
  #   ~85s cold boot (#545: torch + sentence-transformers, marginal 4GB) means a
  #   stopped machine = ZERO healthy instances = the #2850 outage signature
  #   ("[PR01] no known healthy instances found for route tcp/443"). This key
  #   matters precisely because a failing check only DE-REGISTERS a machine, it
  #   does not stop it: once the sole machine is out of routing, public load is
  #   zero by definition, and autostop is what would then decide to stop it.
  #   Fly's default when the key is absent is "off" (never stop). We state it
  #   explicitly so a de-registration can never cascade into a cold stop.
  #   Matches the previous effective default: intent recorded, no behavior/cost
  #   change (>=1 machine always warm, ~$21.40/mo; see COST below).
  # auto_start_machines=true — safety net. If a machine is ever stopped
  #   out-of-band (operator stop, host failure, crash-loop give-up), the next
  #   request starts it. Fly recommends both-on or both-off to avoid machines
  #   that never start *or* never stop; we deliberately take the never-stop
  #   side, which cannot strand a stopped machine.
  # min_machines_running=1 — availability floor: keep >=1 machine warm in iad.
  #   Fly documents this as inert while auto_stop_machines="off" (declarative
  #   today, load-bearing if autostop is enabled or a 2nd machine is added).
  #   Do NOT set this to 2 expecting redundancy: the proxy never creates
  #   machines (silent no-op), the volume is single-attach, and the app carries
  #   per-process state — see runbook §6 before attempting it.
  #
  # COST (iad list price, Fly pricing page 2026-09-10): shared-cpu-2x:4096MB =
  #   $21.40/mo running ($0.0297/hr; $17.50 of that is the 3.5GB above the
  #   512MB preset at the documented $5/GB/30-days). Keeping >=1 machine warm
  #   therefore costs ~$21.40/mo — already paid, since the app must serve
  #   continuously. A genuinely redundant 2-machine topology is ~$42.80/mo
  #   (+$21.40/mo, plus a 2nd volume at $0.15/GB/mo) and is blocked on the
  #   app-state work in runbook §6. Operator decides that spend; not taken here.
  #   ⚠️ LIST-PRICE ESTIMATE, NOT A QUOTE, AND DATED (snapshot 2026-09-10).
  #   Fly bills actual usage; live rates have since moved ~4% higher. Re-fetch
  #   Fly's pricing page before a spend decision. Full caveat: runbook §6.5.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    soft_limit = 100
    hard_limit = 200

  # ── Routing check: TCP, NOT HTTP (#2850, P0) ────────────────────────────────
  # A [[services.tcp_checks]] connect handshake is served by the KERNEL on the
  # listening socket, so the event loop and any thread pool cannot starve it.
  # It is NOT "cannot fail": a connect still has to be ACCEPTED, and an app that
  # never returns to accept() long enough to saturate the listening socket's
  # accept backlog will eventually have connections dropped/refused and fail
  # the check. TCP sheds application-level latency, DB stalls, and executor
  # saturation — not every failure mode. That converts "a slow moment becomes a
  # total outage" into "a slow moment is a slow response".
  #
  # The previous [[services.http_checks]] rode internal_port 8000 and hit
  # path = "/health". A failing *service* check does NOT restart or stop the
  # Machine (Fly: "a failing check won't cause the Machine to restart or stop")
  # — it only makes the proxy STOP ROUTING to it. On 2026-09-10 (#2850) the sole
  # machine's HTTP check flapped for 45 min and then failed; the machine was
  # de-registered and the site was unreachable for ~35 min while the process was
  # alive and answering on loopback. TCP removes that failure mode:
  # application-level latency alone can no longer de-register the machine (the
  # accept-backlog saturation above is the remaining, far narrower path).
  #
  # NOTE: [[services.*_checks]] has NO `port` key — a service check always rides
  # the service's internal_port (8000 here). It cannot be pointed at 9090. The
  # 9090/healthz signal is a top-level [checks] entry, which IS present in this
  # file ([checks.loop_liveness], reinstated 2026-09-17 below; the DEFERRED
  # placeholder it replaced is gone). A top-level
  # check never affects routing, but it DOES gate flyctl's deploy health wait.
  #
  # timeout=5s against a 15s interval (was 15s/15s — a 1:1 ratio with zero
  # headroom, so a hung probe consumed its whole period). A kernel accept is
  # effectively instant (Fly's tcp_checks default timeout is 2s); 5s is
  # generous headroom, not a latency budget. grace_period = 180s is a
  # deliberately generous carry-over from the HTTP era, NOT a requirement of the
  # TCP check: the app binds 0.0.0.0:8000 IMMEDIATELY on start (entrypoint.sh;
  # hosted_api._lifespan spawns the ~85s torch/model pre-warm as a daemon=True
  # thread that never blocks bind), so the listener exists within seconds and the
  # model load does not gate a TCP connect. See docs/infra-runbook.md §6.4.
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "180s"

# ── REINSTATED 2026-09-17: non-routing loop-liveness check (#3447, #2850) ────
# DECIDED here — this is a deployment-configuration judgement, NOT an owner
# decision (it is not ontology / EP model / product scope / price / promise).
# REINSTATE. The precondition this file deferred on is now VERIFIED on the live
# machine, and the standard converges: an application-level liveness probe
# alongside a transport check is how K8s / Cloud Run / Azure document catching
# a STALLED-BUT-RUNNING process, which a kernel-served TCP handshake cannot see.
#
# Precondition, executed 2026-09-17 against tortoise-y4mjjq:
#   fly ssh console -a tortoise-y4mjjq -C "grep ':2382' /proc/net/tcp"
#     → LOCAL address 00000000:2382 = 0.0.0.0:9090  ✅ (not 0100007F)
#   fly ssh console -a tortoise-y4mjjq -C "curl -s localhost:9090/healthz"
#     → http=200 {"status":"ok","loop_age_ms":67.7,"loop_stale":false}  ✅
# #3062 merged 2026-09-13T02:45:10Z and the machine has been redeployed since
# (last update 2026-09-16T18:49:30Z), so the listener is deployed, not merely
# present. Decision record and sources: issue #3447.
#
# This check does NOT affect request routing — the proxy ignores top-level
# checks when choosing where to send traffic. It exists so a stalled event loop
# can be surfaced to an operator even though a stall can no longer take the app
# offline (#3062). It points at the app's dedicated 9090 /healthz listener.
#
# ⚠️ The listener's predicate is `503 if (stale AND idle) else 200`
# (tortoise/monitoring.py) — a stale loop WITH a request in flight still
# reports 200, so this check does NOT reliably surface a true wedge; it errs
# toward 200, which is the safe direction for the deploy gate it feeds.
#
# ⚠️ DEPLOY-BLOCKING BY DESIGN: flyctl's deploy health wait counts top-level
# checks (WaitForHealthchecksToPass requires every reported check to pass — no
# informational/readiness filter) and .github/workflows/deploy-hosted.yml
# auto-deploys whenever fly.toml changes. If the 9090 listener ever fails to
# bind, EVERY deploy fails and the sole production machine is rolled repeatedly
# until it is fixed. grace_period = 180s is the documented mitigation (Fly:
# "give your app enough time to start up") and covers the ~85s boot with
# headroom — the same value the routing check above uses. Do not shorten it
# below the boot time. Top-level checks REQUIRE `port`, and the port must be
# bound on 0.0.0.0 — a loopback-only listener makes the check fail permanently.
# See docs/infra-runbook.md §6.0 (merge order) and §6.4 (this check).
[checks]
  [checks.loop_liveness]
    type = "http"
    method = "get"
    path = "/healthz"
    port = 9090
    interval = "15s"
    timeout = "5s"
    grace_period = "180s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 4096
  # memory_mb 512→2048→4096: torch + sentence-transformers + the 90MB model +
  # the app consistently OOM-crash-loops on 2GB cold boots (#545) — cold
  # machines died (deploy health-check timeout), warm machines survived,
  # which is the signature of a marginal-memory kill.
  # cpus bumped 1→2 so vector encoding doesn't starve the API thread during
  # cold starts and backfill. Estimated cost impact: +$1-3/mo (Fly shared-cpu-2x).

[[mounts]]
  source = "tortoise_api_data"
  destination = "/data"

[env]
  TORTOISE_DB_URI = ""  # Constructed at runtime by entrypoint.sh from FALKORDB_CLOUD_URI → FalkorDB Cloud
  FASTAPI_INTERNAL_KEY = ""  # Set via fly secrets
  # #1081/#985: only the Fly-proxied hosted deployment may trust forwarded
  # headers — Fly-Client-IP for per-IP limiters (#1081) and
  # Fly-Forwarded-Proto for redirect Location schemes (#985; proxy-set,
  # non-overridable, preferred over the client-overridable
  # X-Forwarded-Proto). Self-hosters behind nginx/Caddy set
  # TORTOISE_TRUST_X_FORWARDED_PROTO=1 instead. Fail-closed elsewhere —
  # a non-proxy ingress must never let a client set its own limiter key
  # or redirect scheme.
  TORTOISE_TRUST_FLY_CLIENT_IP = "1"
  # #1726 (Slice 1): the GitHub-docs ingest sandbox — server-owned staging
  # dir on the persistent volume (entrypoint.sh defaults to this too).
  # Fail-closed: /v1/index/docs refuses to run without it.
  TORTOISE_INGEST_BASE_DIR = "/data/ingest"
  # #4240: the hosted lane's per-graph JSONL rebuild journal (server-owned, on
  # the same persistent volume). With it set, every hosted data SDK carries an
  # `event_log_path`, so the capture's `(Session|Point)-[:aboutObject]->(Object)`
  # edges (and the rest of the write surface) are journal-backed and
  # `tortoise rebuild --dir` reconstructs them; unset, the lane journals
  # nothing (pre-#4240) and a rebuild silently loses the live-only edges.
  # NOT a durability claim — see docs/durability-posture.md.
  TORTOISE_EVENT_LOG_BASE_DIR = "/data/events"
  # Hosted backups (#305) — set via fly secrets (deploy workflow syncs from GitHub)
  TORTOISE_BACKUP_KEY = ""
  R2_ACCOUNT_ID = ""
  R2_ACCESS_KEY_ID = ""
  R2_SECRET_ACCESS_KEY = ""
  R2_BUCKET = ""
  # ── #4126 secret-provenance: non-secret CONFIG, version-controlled here ────
  # These three were Fly SECRETS with no managing source — the recorded debt in
  # `.github/scripts/fly-managed-secrets.txt`. A non-secret config value belongs
  # in version control, so it lives here and is declared `fly-toml-env` there.
  # The deploy then no longer needs a secret for any of them, and the provenance
  # gate fails a `fly-toml-env` declaration whose name is still a Fly secret
  # (a Fly secret SHADOWS `[env]`) — so the two states cannot come apart.
  #
  # ⛔ THE VALUES ARE CARRIED OVER FROM THE LIVE FLY SECRETS, NOT FROM
  # `.env.example`. TORTOISE_MANUAL_LINKING_ENABLED is `1` in production while
  # `.env.example` documents the `0` dev default — moving it is
  # behaviour-preserving, so the live value is what the app reads today and is
  # what is recorded here. The flag's VALUE is the owner's call (the 2026-08-26
  # ops runbook gates a flip on a Supabase `double_confirm_changes` check); this
  # entry only carries the current value across. Do NOT "fix" it to match
  # `.env.example`.
  TORTOISE_CONTROL_PLANE = "supabase"
  TORTOISE_REAUTH_WINDOW_SECONDS = "900"
  TORTOISE_MANUAL_LINKING_ENABLED = "1"

[deploy]
  wait_timeout = "5m"
  strategy = "rolling"
  release_command = "python -c 'import tortoise.hosted_api; print(\"import ok\")'"
