<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tortoise Dashboard</title>
  <style>
    :root {
      --bg: #060b14;
      --text: #cbd5e1;
      --text-dim: #64748b;
      --accent: #06b6d4;
      --mono: 'SF Mono', 'Cascadia Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .placeholder {
      text-align: center;
      padding: 2rem;
    }
    .placeholder h1 { color: var(--accent); font-size: 1.5rem; margin-bottom: 1rem; }
    .placeholder p { color: var(--text-dim); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="placeholder">
    <h1>Tortoise Dashboard</h1>
    <p>Coming soon — team management, graph explorer, API keys.</p>
  </div>
</body>
</html>
