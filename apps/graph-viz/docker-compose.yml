# Tortoise — one-command startup
# docker compose up -d  (starts FalkorDB)
# then: python3 server/main.py & npx vite --host --port 5173

services:
  falkordb:
    # PINNED, never `falkordb/falkordb:latest` (#8124): that floating tag now
    # resolves to engine 6.0.x, whose `reply.rs:655` `reply_compact` PANICS the
    # server on `OPTIONAL MATCH (s) RETURN count(s) AS n, s.harness AS h`
    # (aggregate + property in one projection) and exits it — the viz then just
    # cannot connect. Same engine as the CI gate (#6386).
    image: falkordb/falkordb-server:v4.20.6
    container_name: tortoise-falkordb
    ports:
      # Loopback only (#7637): the server (`python3 server/main.py`) dials
      # localhost:16379 from this host. A bare "16379:6379" publishes
      # 0.0.0.0:16379 — an unauthenticated FalkorDB on the LAN.
      - "127.0.0.1:16379:6379"
    environment:
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000
    volumes:
      - tortoise-data:/var/lib/falkordb/data
    # #7357: a KERNEL cap, on the same terms as every other FalkorDB container
    # this repo starts (root `docker-compose.yml`, `tools/test_lane.py`,
    # `tools/edge_census.py`, `graph-scripts/setup.py`,
    # `.github/actions/falkordb-provision`). This service publishes 16379, so an
    # over-consuming viz DB is a neighbour that can starve the canonical graph
    # instance on the same host — the measured outage. `docker compose up` DOES
    # apply `deploy.resources.limits` (verified, compose 2.40.3).
    #
    # `memswap_limit` EQUALS the cap on purpose: docker's default swap is 2x
    # memory, and a swapping FalkorDB is a minutes-long RDB reload instead of a
    # fast, isolated death (measured: memory-only -> Swap=2x; with this -> equal).
    deploy:
      resources:
        limits:
          memory: 2g
    memswap_limit: 2g
    # `unless-stopped`, NOT the bounded `on-failure:5` used for the long-lived dev
    # container in `graph-scripts/setup.py`: this one is a developer convenience
    # whose header promises `docker compose up -d` starts FalkorDB, and
    # `on-failure` does not restart a container when the DAEMON restarts (docker
    # documents it), so a bounded policy here would silently lose the DB after a
    # reboot. The cap above is what removes the host-starvation loop; the policy
    # choice is about coming back after a reboot.
    restart: unless-stopped

volumes:
  tortoise-data:
