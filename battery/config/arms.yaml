# Arms config (issue #1406) — schema locked here; adapters ship in #1408.
# Each entry: arm_id, adapter (battery.arms.<name>), config {}, and the
# per-arm cost constants the budget formula uses.
#
# model_pin / temperature (#2284 Task 6): protocol-hash inputs for the
# parity unchanged-check (seed/model_pin/temperature/event-schema/
# tool-surface). Values below are checked-in FLASH-CLASS PLACEHOLDERS —
# sibling #2292 re-locks each arm's measured pin before any real-run parity;
# until then the parity protocol leg stays placeholder + #1144-gated.
#
# expected_tokens_per_episode (#2284 Task 7): per-arm token-budget
# numbers, each annotated measured_after_exposure on its row (provisional —
# a per-arm single-value guess until exposure part 1, Task 8
# TBD(EXPOSURE), measures per-family tokens and sibling #2292 re-locks;
# no mid-run budget machinery reads them yet — Task 8 owns the
# accumulator). The corpus-level 800 tok/ep guess appears on a4's row
# (the only arm whose value IS 800); the other arms carry their own
# per-row value (a0=500, a1=600, a2/a2b=700, a3=400) — the 800 guess
# never annotates a row it does not match (PR #2341 review round 2, P2).
# mock's 64 is a lane cap, not a budget guess, and is exempt.
arms:
  - arm_id: mock
    adapter: battery.arms.mock
    config: {}
    price_per_1k_usd: 0.0
    expected_tokens_per_episode: 64
    model_pin: flash-class-placeholder
    temperature: 0.0
  - arm_id: a0
    adapter: battery.arms.a0_plain
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 500  # measured_after_exposure
    model_pin: flash-class-placeholder
    temperature: 0.0
  - arm_id: a1
    adapter: battery.arms.a1_longctx
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 600  # measured_after_exposure
    model_pin: flash-class-placeholder
    temperature: 0.0
  - arm_id: a2
    adapter: battery.arms.a2_mem0
    config: {}
    price_per_1k_usd: 1.0
    expected_tokens_per_episode: 700  # measured_after_exposure
    model_pin: flash-class-placeholder
    temperature: 0.0
  - arm_id: a2b
    adapter: battery.arms.a2b_zep
    config: {}
    price_per_1k_usd: 1.0
    expected_tokens_per_episode: 700  # measured_after_exposure
    model_pin: flash-class-placeholder
    temperature: 0.0
  - arm_id: a3
    adapter: battery.arms.a3_rag
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 400  # measured_after_exposure
    model_pin: flash-class-placeholder
    temperature: 0.0
  - arm_id: a4
    adapter: battery.arms.a4_tortoise
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 800  # measured_after_exposure (800 tok/ep guess)
    model_pin: flash-class-placeholder
    temperature: 0.0
