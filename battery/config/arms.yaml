# Arms config (issue #1406) — schema locked here; adapters ship in #1408.
# Each entry: arm_id, adapter (battery.arms.<name>), config {}, and the
# per-arm cost constants the budget formula uses.
#
# model_pin / temperature (#2284 Task 6): protocol-hash inputs for the
# parity unchanged-check (seed/model_pin/temperature/event-schema/
# tool-surface). #2292 re-locked the real-capable arms to the measured pin
# (decision (a): deepseek/deepseek-v4-flash UNCAPPED, temp 0, same model
# across arms — resolved via model_adapters.MODELS['deepseek-flash']); the
# mock row is exempt (lane cap, never real-scored). A real run refuses an
# unpinned/unresolvable pin or a class-level model_id='fixed' sentinel
# (run.py pin pre-flight).
#
# expected_tokens_per_episode (#2284 Task 7): per-arm token-budget
# numbers, each annotated measured_after_exposure on its row (provisional —
# a per-arm single-value guess until exposure part 1, Task 8
# TBD(EXPOSURE), measures per-family tokens and sibling #2292 re-locks;
# no mid-run budget machinery reads them yet — Task 8 owns the
# accumulator). The corpus-level 800 tok/ep guess appears on a4's row
# (the only arm whose value IS 800); the other arms carry their own
# per-row value (a0=500, a1=600, a2/a2b=700, a3=400) — the 800 guess
# never annotates a row it does not match (PR #2341 review round 2, P2).
# mock's 64 is a lane cap, not a budget guess, and is exempt.
arms:
  - arm_id: mock
    adapter: battery.arms.mock
    config: {}
    price_per_1k_usd: 0.0
    expected_tokens_per_episode: 64
    model_pin: mock-agent  # lane cap — mock is never real-scored (pin-exempt; decision a)
    temperature: 0.0
  - arm_id: a0
    adapter: battery.arms.a0_plain
    config: {}
    price_per_1k_usd: 0.0011  # #2602 measured meter basis (2026-09-08): pinned deepseek/deepseek-v4-flash real rates (0.27 in / 1.10 out per 1M); conservative all-tokens-as-output per-1k bound = 1.10/1000. Pre-#2602 0.5 ($500/1M) was a stale legacy guess that inflated estimates ~365-1850x and refused real runs at the pre-run guard. Mid-run dollar cap (#2603) is the hard stop.
    expected_tokens_per_episode: 26409  # MEASURED + EXPOSURE-FINALIZED (2026-09-08: #2292 probe p95 8803 x 3x headroom AND #2284 Task-8 exposure part-1 smoke n=8 (d-001/ct-001/cal-001/ret-001 x a0/a4) deliberation p95 7518 / mean 3821 — 26409 = 3x headroom over the LARGER measured p95 (7518 x 3 = 22554 <= 26409); deliberation-content only, arm retrieval context NOT included (Task-9 executor measures the full episode); SAME token_table_hash machinery)
    model_pin: deepseek/deepseek-v4-flash  # measured pin (decision a: UNCAPPED, temp 0)
    temperature: 0.0
  - arm_id: a1
    adapter: battery.arms.a1_longctx
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 600  # TBD(EXPOSURE): finalize from #2284 Task 8 exposure measurements over the same token_table_hash machinery — never a stale guess presented as measured
    model_pin: deepseek/deepseek-v4-flash  # measured pin (decision a: UNCAPPED, temp 0)
    temperature: 0.0
  - arm_id: a2
    adapter: battery.arms.a2_mem0
    config: {}
    price_per_1k_usd: 1.0
    expected_tokens_per_episode: 700  # TBD(EXPOSURE): finalize from #2284 Task 8 exposure measurements over the same token_table_hash machinery — never a stale guess presented as measured
    model_pin: deepseek/deepseek-v4-flash  # measured pin (decision a: UNCAPPED, temp 0)
    temperature: 0.0
  - arm_id: a2b
    adapter: battery.arms.a2b_zep
    config: {}
    price_per_1k_usd: 1.0
    expected_tokens_per_episode: 700  # TBD(EXPOSURE): finalize from #2284 Task 8 exposure measurements over the same token_table_hash machinery — never a stale guess presented as measured
    model_pin: deepseek/deepseek-v4-flash  # measured pin (decision a: UNCAPPED, temp 0)
    temperature: 0.0
  - arm_id: a3
    adapter: battery.arms.a3_rag
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 400  # TBD(EXPOSURE): finalize from #2284 Task 8 exposure measurements over the same token_table_hash machinery — never a stale guess presented as measured
    model_pin: deepseek/deepseek-v4-flash  # measured pin (decision a: UNCAPPED, temp 0)
    temperature: 0.0
  - arm_id: a4
    adapter: battery.arms.a4_tortoise
    config: {}
    price_per_1k_usd: 0.0011  # #2602 measured meter basis (2026-09-08): pinned deepseek/deepseek-v4-flash real rates (0.27 in / 1.10 out per 1M); conservative all-tokens-as-output per-1k bound = 1.10/1000. Pre-#2602 0.5 ($500/1M) was a stale legacy guess that inflated estimates ~365-1850x and refused real runs at the pre-run guard. Mid-run dollar cap (#2603) is the hard stop.
    expected_tokens_per_episode: 26409  # MEASURED + EXPOSURE-FINALIZED (2026-09-08: #2292 probe p95 8803 x 3x headroom AND #2284 Task-8 exposure part-1 smoke n=8 (d-001/ct-001/cal-001/ret-001 x a0/a4) deliberation p95 7518 / mean 3821 — 26409 = 3x headroom over the LARGER measured p95 (7518 x 3 = 22554 <= 26409); deliberation-content only, arm retrieval context NOT included (Task-9 executor measures the full episode); SAME token_table_hash machinery)
    model_pin: deepseek/deepseek-v4-flash  # measured pin (decision a: UNCAPPED, temp 0)
