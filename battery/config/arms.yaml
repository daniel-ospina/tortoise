    adapter: battery.arms.a0_plain
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 500
  - arm_id: a4
    adapter: battery.arms.a4_tortoise
    config: {}
    price_per_1k_usd: 0.5
    expected_tokens_per_episode: 800
