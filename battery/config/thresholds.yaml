# [cal]-locked thresholds (issue #1406). Top-level keys for this slice:
# determinism {epsilon, tolerances} + cal {rows}. Per-metric AC-gated
# epsilons are added by #1409. The cal-table hash (canonical serialization —
# cal rows + determinism tolerance rows, #2284 Task 7) is recorded in
# artifact provenance — the mechanical lock #1415's print-only re-tune reads.
determinism:
  # Transcript-locked E2E-7.1 floor (|Δ| ≤ 1e-6 on derived/objective fields
  # computed from a locked transcript — two identical runs, same seed).
  epsilon: 1e-6
  # Per-metric |Δ| tolerances (E2E-7.1 re-scope, #2284 Task 7). SEEDED from
  # the determinism-test measured deltas over the mock lane (two runs, seed
  # 7, 140 artifacts each): every derived/objective metric measured |Δ|=0.0
  # (≤ the epsilon floor, so each seeded row = determinism.epsilon — never a
  # test-local constant). Model-text/judged metrics measured on the real
  # path are re-locked by sibling #2292 OVER this seed (TBD(EXPOSURE) —
  # values stay until exposure part 1 lands); the per-run nondeterminism
  # fingerprint is recorded at run level for those fields.
  tolerances:
    n_tool_calls: 1e-6            # derived/objective — measured |Δ|=0.0
    n_turns: 1e-6                 # derived/objective — measured |Δ|=0.0
    outcome_failed: 1e-6          # derived/objective — measured |Δ|=0.0
    outcome_fallback_cached: 1e-6 # derived/objective — measured |Δ|=0.0
    outcome_ok: 1e-6              # derived/objective — measured |Δ|=0.0
    outcome_rate_limited: 1e-6    # derived/objective — measured |Δ|=0.0
    outcome_timeout: 1e-6         # derived/objective — measured |Δ|=0.0
    re_derivations: 1e-6          # derived/objective — measured |Δ|=0.0
    total_tokens: 1e-6            # derived/objective — measured |Δ|=0.0
    # PROVISIONAL real-path row (#2292 Task 7, Step 7.4 dedicated two-run
    # determinism probe 2026-09-08: 2 scenarios d-001/ct-001 x a0/a4, seed
    # 7, 4 episodes/run; receipts determinism_run{1,2}_tokens.json hold
    # per-run aggregates): probe-emittable usage/token rows are NOT
    # transcript-locked — the mock-lane 1e-6 seed never applies to real
    # usage. Measured two-run run-aggregate |Δ|: |Δmean| 127 (2392
    # vs 2519), |Δp95| 219 (2576 vs 2357). Tolerance 250 covers the
    # measured spread + margin; a true per-episode |Δ| re-lock needs the
    # per-episode series + happens at #2284 Task-8 exposure.
    probe_usage_tokens_episode: 250.0

cal:
  # metric -> {arm -> value}. Values are [cal]-locked; re-locking is a
  # reviewable table change (calibration mode prints, never silently tunes).
  # The differential classification margin (STRONG/WEAK vs best comparator)
  # is itself [cal]-locked (issue #1415 P2-3).
  # NOTE (PR #2341 round 4, deferred AT THAT TIME): the
  # false-positive-rate [cal] row was pending sibling B (#2292 cal
  # re-locks) — no row was added then. SUPERSEDED 2026-09-08 (#2292 Task
  # 7): the placeholder-locked false-positive-rate row below now carries
  # the lock; the FP gate path consumes profile.json control_records once
  # Task 9 (executor) emits bct control verdicts.
  classification-delta: 0.10
  # Post-I-1 seed-mode semantics (#2292 Task 7): the a4 expectation is the
  # MOCK-LANE MEASURED planted-population surfaced rate under the seed-mode
  # split (04-plan fixture matrix A4 0.92) — strictly above the no-store
  # comparator AND strictly above the verbatim E2E-1.1 90% AC nominal
  # (a row copied verbatim from the AC number is an undecidable boundary
  # lock). Consistent with the E2E-1.1 >= 90% gate target.
  surfaced-rate: {a4: 0.92, a0: 0.00}
  # R2 judged-subscore gate (decision (e), #2292 Task 7): ONE canonical
  # form — a4-expectation >= 1.5x a0-expectation WITH the a0=0 floor
  # (control == 0 => gate passes iff treatment > 0; the config
  # expectation assert and the runtime gate agree at the boundary).
  # a0 (no-store control) = 0.0 judged-subscore floor; a4 = 0.50
  # (judged subscore over validated-rubric deliberation renders;
  # the mock-era A4 0.51 | A0 0.50 PARITY row is STALE — superseded
  # 2026-09-08).
  coverage-subscore: {a4: 0.50, a0: 0.00}
  brier: {a4: 0.25, a0: 0.30}
  defeat-precision: {a4: 0.70, a0: 0.00}
  correct-direction-rate: {a4: 0.90, a0: 0.50}
  # [cal] ep-variance row (#2291 I-4): posterior-variance threshold above
  # which a claim reads CONTESTED (non-decisive BY CONSTRUCTION even when the
  # engine converged — mechanism convergence != decisiveness). Value 0.04 =
  # the product's own per-call default (ep.py get_contested_claims); VERIFIED
  # discriminating on the embedded lane: uncontested seed baselines
  # (medium Beta(3,1) variance 0.0375) stay below; a conflicting low-
  # credibility NAND write pushes the claim to ~0.05-0.06 (probe 2026-09-07).
  # Passed EXPLICITLY as variance_threshold by the arm (never a tortoise/
  # default edit, never an inline constant). READ-ONLY to #2284 Tasks 7/8.
  # placeholder-locked provisional rows (#2292 Task 7): measurement path is
  # #2284 Task 9 EXECUTOR-owned (bct control-verdict emission + the
  # flip/fp rate pools — fp denominator = bct benign twins pooled across
  # arms x runs, #2284 Task 3 corpus). Values trace to the AC nominal
  # UPPER-BOUND caps as placeholders (flip-flop <= 10%, fp <= 5%, E2E-1.1)
  # — placeholder-locked: NEVER presented as measured or stale-guess-as-locked.
  #   Extends the
  # PR #2341 round-4 deferral note (FP gate path consumes
  # profile.json control_records once Task 9 emits bct control verdicts).
  flip-flop-rate: {a4: 0.10}
  false-positive-rate: {a4: 0.05}
  ep-variance: {a4: 0.04}
