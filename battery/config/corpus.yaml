          content: "We are iterating on a cache policy. Each round gives you structured feedback and a harder repeat."
      question: "Improve the cache policy across the rounds."
    gold:
      expected: "apply each feedback round to the cache policy and show monotone improvement"
    feedback:
      iterations:
        - task: "Pick a TTL for product pages."
          feedback: "A single TTL is wrong for hot and cold products; split the tiers."
        - task: "Split hot and cold product TTLs."
          feedback: "Hotness drifts; recompute it from the traffic distribution."
        - task: "Recompute hotness from traffic each hour."
          feedback: "Recomputation storms the catalog; sample the distribution instead."
        - task: "Sample the distribution for hotness."
          feedback: "Sampling lags spikes; add a spike trigger."
        - task: "Add the spike trigger and defend the policy."
          feedback: "Final round — ship the best version."
  - id: fb-004
    tier: stream
    family: D3
    task_type: feedback_loop
