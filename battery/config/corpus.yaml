  # -------------------------------------------------------------------------
  - id: d-001
    tier: probe
    family: R2
    task_type: decision
    split: train
    matched_control_for: ct-001
    prompt:
      system: *decision_system
      turns:
        - role: user
          content: "We are choosing a database vendor for our new analytics product. Vendor A has a strong SQL story; Vendor B is cheaper and faster on our workload."
        - role: assistant
          content: "Both options are credible. Cost and team skill both matter."
        - role: user
          content: "Our team knows Postgres deeply, and Vendor A is Postgres-compatible. Vendor B is a custom engine with its own query language."
      question: "Which vendor should we choose, and what is the main risk of the choice?"
    gold:
      expected: "choose Vendor A for the Postgres compatibility and name the migration cost as the main risk"
