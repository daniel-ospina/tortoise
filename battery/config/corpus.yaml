  # -------------------------------------------------------------------------
  # FEEDBACK_LOOP pack (6) — D3, 5 authored iterations (task → feedback →
  # harder repeat), last hardest. E2E-3.4 monotone improvement.
  # -------------------------------------------------------------------------
  - id: fb-001
    tier: stream
    family: D3
    task_type: feedback_loop
    split: wave-3
    prompt:
      system: *stream_system
      turns:
        - role: user
          content: "We are iterating on a routing rule. Each round gives you structured feedback and a harder repeat."
      question: "Improve the routing rule across the rounds."
    gold:
      expected: "integrate each round of feedback into the next attempt and improve monotonically"
    feedback:
      iterations:
        - task: "Route support tickets by urgency."
          feedback: "Urgency alone misroutes high-value accounts; add an account-value signal."
        - task: "Route tickets by urgency and account value."
          feedback: "The value signal is too coarse; use the tier and the open-issue count."
        - task: "Route by urgency, tier, and open-issue count."
          feedback: "Conflicting signals need a priority score, not a rule chain."
        - task: "Build a priority score from the three signals."
          feedback: "The score must be explainable and monotone in each signal."
        - task: "Build an explainable monotone priority score and defend it."
          feedback: "Final round — ship the best version."
  - id: fb-002
    tier: stream
    family: D3
    task_type: feedback_loop
    split: wave-3
    prompt:
      system: *stream_system
      turns:
        - role: user
          content: "We are iterating on an alert threshold. Each round gives you structured feedback and a harder repeat."
      question: "Improve the alert threshold across the rounds."
    gold:
      expected: "fold each feedback round into the threshold and keep improving per round"
    feedback:
      iterations:
        - task: "Set an alert threshold for pager load."
          feedback: "The threshold misses correlated bursts; add a burst window."
        - task: "Threshold with a burst window."
          feedback: "Bursts during maintenance are noise; exclude maintenance windows."
        - task: "Threshold with bursts and maintenance exclusion."
          feedback: "The exclusion window is static; make it per-team."
        - task: "Per-team maintenance exclusion with bursts."
          feedback: "Per-team config drifts; derive it from the on-call schedule."
        - task: "Derive the exclusion from the schedule and defend the threshold."
          feedback: "Final round — ship the best version."
  - id: fb-003
    tier: stream
    family: D3
    task_type: feedback_loop
    split: wave-3
    prompt:
      system: *stream_system
      turns:
