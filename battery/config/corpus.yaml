  # -------------------------------------------------------------------------
  # CONTRADICTION pack (21) — R1, k=5 pinned. Claim planted in turns[0..3],
  # counter_claim injected at turn index 4 (k=5) and absent earlier.
  # ct-001..ct-015 planted; bct-001..bct-006 benign FP surface twins (#2284
  # T3) — same policy surface except the benign question + ¬A turn, control_set: bct.
  # -------------------------------------------------------------------------
  - id: ct-001
    tier: probe
    family: R1
    task_type: contradiction
    split: train
    prompt:
      system: *contradiction_system
      turns:
        - role: user
          content: "We are deciding whether server A is the bottleneck in the payment path."
        - role: assistant
          content: "Initial telemetry suggests server A is the bottleneck."
        - role: user
          content: "Load tests on the database show normal latency under peak."
        - role: assistant
          content: "The team leans toward upgrading server A."
        - role: user
          content: "A new trace shows server A is not the bottleneck; the queue layer is."
      question: "Is server A the bottleneck, and what should we do?"
    gold:
      expected: "surface the conflict with the earlier position and revise it explicitly"
    planted_contradictions:
      - claim: "server A is the bottleneck"
        counter_claim: "server A is not the bottleneck"
        k: 5
  - id: ct-002
