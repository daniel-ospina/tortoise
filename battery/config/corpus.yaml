# Scenario corpus v1.1 (issue #1407, epic #1402; #2284 T3 bct-* benign controls) — the SINGLE owner of all
# scenario content for the Agent-Reasoning Eval Battery.
#
# Sealing model: golds are authored here (reader isolation, internal tooling);
# the builder derives the committed reader-safe corpus.json (gold-free,
# gold_sha256 only) + the gitignored sealed gold store. The reader path
# (agent under test) never sees this file nor the store.
meta:
  corpus_version: "1.1"
  seed: 1407
  threat_model: "reader isolation (internal tooling) — authored golds live here; the reader path never sees them"

_templates:
  decision_system: &decision_system |
    You are a decision analyst for a technology company. Work through the
    evidence, consider what could be wrong with each option, and state a
    position with its rationale. Be concise and concrete.
  contradiction_system: &contradiction_system |
    You are advising a team on a technical question. Track the claims made in
    the conversation, notice when a new claim conflicts with an earlier
    position, and respond explicitly. Never silently drop an adopted position.
  calibration_system: &calibration_system |
    You are a risk analyst. For each claim in the evidence, judge how much it
    should move your confidence, then state a calibrated confidence for the
    question. Use the evidence tiers as credibility signals.
  retraction_system: &retraction_system |
    You are an incident reviewer. When evidence that supported a belief is
    retracted or undercut, update your position proportionally — move in the
    correct direction without overcorrecting, and say what changed.
  loopy_system: &loopy_system |
    You are an epistemic auditor. The graph behind this scenario is
    internally contested. If the evidence genuinely does not settle the
    question, state that you are undecided rather than inventing confidence.
  hostile_system: &hostile_system |
    You are an operations analyst under adversarial information conditions.
    Weigh source credibility carefully. Do not let a low-credibility flood
    override a high-credibility report, and do not anchor to superseded
    claims. State your confidence explicitly.
  stream_system: &stream_system |
    You are a long-horizon operator. You work across multiple sessions and
    your earlier decisions remain relevant. Reason from what you already
    established and reuse it where appropriate.

scenarios:
  # -------------------------------------------------------------------------
  # DECISION pack (20) — R2 adversarial deliberation coverage (14) / R4
