# Tortoise Self-Host — durable reference topology (#338 D2/T4.3)
#
# daemon + falkordb sidecar (AOF on, named volume, healthcheck). This is the
# RECOMMENDED durable path — the embedded-FalkorDBLite path (see
# docs/quickstart-selfhosted.md Option C) is single-writer eval only: durable
# for ONE process since #915, but concurrent writers LOSE data (2026-08-05
# incident #101 is the historical context: AOF-off + no backups).
#
# FalkorDB is intentionally NOT bundled inside the Tortoise image — its
# official image is SSPLv1 (license interaction) and the sidecar lets AOF +
# backups live with the database (incident-informed, see entrypoint.sh notes).
#
# Security (code-review P1, #338): the daemon requires TORTOISE_API_KEY —
# auth_mode=none on a non-loopback bind is refused at startup. The sidecar's
# requirepass + AOF are passed via REDIS_ARGS (the falkordb image entrypoint
# ignores `command:` — it expands $REDIS_ARGS; see build/docker/run.sh).
#
# Usage:  docker compose up -d
#         tortoise daemon → http://localhost:8000 (MCP at /mcp)
#         set TORTOISE_API_KEY below before exposing beyond localhost.
#         Host-side clients reach the sidecar at
#         TORTOISE_DB_URI=docker://:falkordb@localhost:6379/tortoise
#         (the falkordb service publishes 127.0.0.1:6379, loopback only).
services:
  tortoise:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    image: ghcr.io/daniel-ospina/tortoise-selfhost:local
    ports:
      - "127.0.0.1:8000:8000"   # loopback by default — expose deliberately
    environment:
      TORTOISE_DB_URI: "docker://:falkordb@falkordb:6379/tortoise"
      # ⚠️ Set a strong key before exposing beyond localhost (auth_mode=static);
      # unset + loopback bind → auth_mode=none (eval only).
      TORTOISE_API_KEY: ""
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  falkordb:
    # server-only image (no browser UI surface); honors REDIS_ARGS env
    # Pinned (issue #1146): :latest silently drifts engine versions between
    # runs — benchmark/performance parity needs a reproducible engine.
    image: falkordb/falkordb-server:v4.16.7
    ports:
      - "127.0.0.1:6379:6379"   # loopback only — host-side MCP configs reach the sidecar
    environment:
      # Entrypoint expands $REDIS_ARGS — `command:` is ignored by run.sh.
      REDIS_ARGS: "--requirepass falkordb --appendonly yes"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "falkordb", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Resource parity for reproducible benchmark runs (issue #1146): bounds
    # the sidecar so prod-like runs don't silently get more/fewer resources.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

volumes:
  falkordb-data:
