namespace: marketing
name: Marketing
version: 0.2.0
tier: free
description: Marketing concepts — campaigns, content, channels, audiences, keywords
ontology:
  extends: core
  objectKinds:
  - campaign
  - content
  - channel
  - audience
  - keyword
  - competitorContent
  subclassOf:
    content: WorkItem
  pointKinds:
  - contentBrief
  - contentPerformance
  documentKinds:
  - contentBrief
  - contentCalendar
  - performanceReport
  - brandGuide
  kindDefs:
    campaign:
      description: A coordinated marketing effort that produces content for an audience
      nearMisses:
      - content
    content:
      description: A piece of marketing material (post, article, video) produced by
        a campaign
      nearMisses:
      - competitorContent
    channel:
      description: The distribution surface through which content reaches an audience
      nearMisses:
      - audience
    audience:
      description: The group of people a campaign targets
      nearMisses:
      - customerSegment
  chains:
  - id: campaignToChannel
    name: Campaign-to-Channel Chain
    description: How marketing campaigns produce content distributed via channels
    steps:
    - campaign
    - content
    - channel
    enforcement: warn
  relations:
  - predicate: contains
    mechanism: IMPL
    semantics: hasPart
    fromKind: marketing:campaign
    toKind: marketing:content
    cardinality: one_to_many
  - predicate: distributesVia
    mechanism: IMPL
    semantics: addresses
    fromKind: marketing:content
    toKind: marketing:channel
  - predicate: targets
    mechanism: IMPL
    semantics: addresses
    fromKind: marketing:campaign
    toKind: marketing:audience
  - predicate: optimizedFor
    mechanism: IMPL
    semantics: addresses
    fromKind: marketing:content
    toKind: marketing:keyword
  hierarchies:
  - path: Campaign → Content
    type: hasPart
  memory_granularity: 'Durable: campaign strategy — which campaigns/channels/audiences
    are being pursued and why, the positioning decisions, the reasoning, the actual
    content pieces (they ARE the product), and the metric snapshots showing whether
    a strategy is working. Ephemeral: publishing mechanics, scheduling logistics.'
connectors: []
tools: []
depends_on: []
