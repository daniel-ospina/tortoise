# Project Management Domain Extension
# Sprints, Boards, Milestones — organizational layer for work items.
# PM does NOT define its own work unit. Uses dev:issue via equivalentTo.

namespace: pm
name: "Project Management"
version: "0.1.0"
tier: free
description: "Project management concepts — sprints, boards, milestones. Organizes dev:issue work items."

ontology:
  extends: core

  objectKinds:
    - task
    - sprint
    - kanbanBoard
    - milestone

  subclassOf:
    task: WorkItem

  equivalentTo:
    task: [dev:issue]

  pointKinds:
    - estimate
    - retrospective

  relations:
    - predicate: partOfSprint
      mechanism: IMPL
      semantics: addresses
      fromKind: pm:task
      toKind: pm:sprint
      cardinality: many_to_one

    - predicate: onBoard
      mechanism: IMPL
      semantics: addresses
      fromKind: pm:task
      toKind: pm:kanbanBoard

    - predicate: blocks
      mechanism: NAND
      semantics: opposes
      fromKind: pm:task
      toKind: pm:task
      cardinality: many_to_many

  hierarchies:
    - path: "Milestone → Task"
      type: hasPart

connectors:
  - source: github
    sourceKind: github_issue
    entrypoint: connector.py::GitHubConnector
    config:
      required: [GITHUB_TOKEN, GITHUB_REPO]

  - source: linear
    sourceKind: linear_card
    entrypoint: connector.py::LinearConnector
    config:
      required: [LINEAR_API_KEY]

tools:
  - name: pm_list_issues
    description: "List issues/cards with optional status filter"
    entrypoint: tools.py::list_issues
    params:
      source: { type: string, enum: [github, linear] }
      status: { type: string, optional: true }

  - name: pm_get_sprint
    description: "Get sprint details including assigned cards"
    entrypoint: tools.py::get_sprint
    params:
      sprintId: { type: string }

depends_on: [dev]
