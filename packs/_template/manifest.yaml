# Expansion Pack Manifest — Template
# Copy this file to start a new domain extension pack.
# All fields marked REQUIRED must be filled. Optional fields have defaults shown.
#
# Full example packs: packs/dev/, packs/product-strategy/, packs/pm/

# REQUIRED: Short prefix for kind namespacing (e.g., "pm", "mkt", "fin")
# All kind values registered by this pack are prefixed: {namespace}:{kind}
namespace:  # REQUIRED: set this (e.g., "myapp")

# REQUIRED: Human-readable name
name:  # REQUIRED: set this (e.g., "My Domain Pack")

# REQUIRED: Semantic version
version: "0.1.0"

# REQUIRED: Licensing tier
#   free    — full source, no gating. Templates and common integrations.
#   premium — runtime tool gating. Ontology + connector always accessible.
tier: free

# Optional: One-paragraph description
description: ""

# ── Layer 1: Ontology Extension ──────────────────────────────────────────
ontology:
  extends: core

  # New objectKind values (camelCase, prefixed: {namespace}:{value})
  objectKinds: []

  # New eventKind values (camelCase)
  eventKinds: []

  # New pointKind values (camelCase)
  pointKinds: []

  # New documentKind values (camelCase)
  documentKinds: []

  # Subclass declarations: {kind: parent_kind}
  #   kind = a camelCase kind declared in this pack's *Kinds above
  #   parent_kind = a PascalCase core entity type (Project, WorkItem, Document,
  #                 Subject, Object, Action, Event, Point, Source) or a core
  #                 objectKind from CANONICAL_OBJECT_KINDS
  # Example:
  #   subclassOf:
  #     epic: Project
  #     issue: WorkItem
  subclassOf: {}

  # ── Manifest v3 (epic #909 / research-r6 §3.1): per-kind extractor metadata ──
  # Map keyed by pack-local kind name. Keys must be declared in one of this
  # pack's *Kinds lists (or be a core kind this pack's chains reference, e.g.
  # `workflow`). All fields optional. Allowed keys: description, synonyms,
  # examples, nearMisses, extractable, storeAs, enforcement, statuses, folds.
  #   - description:  one line of what the kind IS (this is prompt material)
  #   - synonyms:     normalized aliases — deterministic near-miss catch
  #   - examples:     concrete instance examples for the classifier
  #   - nearMisses:   confusable kinds (own pack, `ns:kind`, or core) — the
  #                   post-extraction kind classifier's rerank input. The
  #                   ENGINE does not render them into the S2/S4 extraction
  #                   prompt (`tools/probe_extractor.py` does render them into
  #                   the offline calibration probe's EXTRACTION_SYSTEM)
  #   - extractable:  bool, default true — false = registered but never minted
  #                   by extraction
  #   - storeAs:      claim|decision|entity|tag|event — default inferred from
  #                   list placement (pointKinds → claim, with
  #                   decision/vision/strategy/plan/goal/target/humanApproval
  #                   → decision; objectKinds/subjectKinds/documentKinds →
  #                   entity; eventKinds → event) — review P2, PR #978
  #   - enforcement:  warn|retry|block — overrides the pack-wide default
  # Example:
  #     kindDefs:
  #       concept:
  #         description: "A reusable idea the domain cares about"
  #         synonyms: ["notion"]
  #         examples: ["..."]
  #         nearMisses: [otherKind]
  #         extractable: true
  #         storeAs: entity
  #         enforcement: retry
  #         # #2729 per-kind state lifecycle: the kind's closed status
  #         # vocabulary, plus the event kinds THAT THIS PACK declares which
  #         # fold the status. Only a kind listed in this pack's
  #         # `objectKinds` may declare these keys (the fold dispatches on
  #         # the namespaced kind, and a core/non-Object kind has none).
  #         # A kind with `statuses` owns its Object state:
  #         # the built-in connector fold no longer applies to it.
  #         statuses: [draft, active, retired]
  #         folds:
  #           - event: otherKindApproved   # bare or self-ns (`mydomain:...`);
  #             # must be an event kind THIS pack declares, and one fold per
  #             # event per kind (a duplicate event is a validation error —
  #             # `otherKindApproved` and `mydomain:otherKindApproved` are
  #             # the same event, and case variants too)
  #             status: active           # must be one of `statuses`
  kindDefs: {}

  # ── memory_granularity (epic #1891 #1931) ──────────────────────────────
  # REQUIRED-ish guidance: what the extractor should treat as DURABLE (keep)
  # vs EPHEMERAL (strip) for this domain. The value-brief compiler
  # (value_extractor.compile_value_brief) reads `ontology.memory_granularity`
  # and puts it in the S1 story-summarizer prompt. Place it UNDER `ontology:`
  # (NOT top-level — top-level is silently ignored).
  # Example:
  #   memory_granularity: 'Durable: the rule text and the reasoning behind it.
  #     Ephemeral: mechanics, logistics, tool workarounds.'

  # ── Manifest v3 (epic #909 / research-r6 §3.2): business-logic chains ──
  # Ordered kind sequences the extractor must respect. Steps may be this
  # pack's kinds (bare), other packs (`ns:kind`), or core kinds (bare, e.g.
  # `workflow`). Bare steps must resolve to a single namespace post-load.
  # Example:
  #   chains:
  #     - id: myChain
  #       name: "My Chain"
  #       description: "What the sequence captures"
  #       steps: [stepA, stepB, workflow]
  #       enforcement: warn        # warn|retry|block
  chains: []

  # Equivalence declarations: {kind: [other_ns:kind, ...]}
  # Declares this pack's kind is semantically equivalent to another pack's kind.
  # Bidirectional — the registry makes it symmetric at query time.
  # Example:
  #   equivalentTo:
  #     issue: [pm:issue]
  equivalentTo: {}

  # Hierarchies: visual/structural parent-child relationships for UIs
  # Documents compositional structure declared in relations (hasPart/contains).
  # Example:
  #   hierarchies:
  #     - path: "Epic → Issue"
  #       type: hasPart
  hierarchies: []

  # New predicates (edges between entities)
  # New format (preferred): { predicate, fromKind, toKind, mechanism, semantics?, nearMisses?, cardinality?, declarationOnly? }
  #   - predicate: domain verb — "addresses", "competesWith", "implements"
  #   - fromKind/toKind: prefixed pack kinds — "myapp:concept" or core PascalCase kinds
  #   - mechanism: IMPL (A supports B) or NAND (A contradicts B)
  #     ⤷ a declared `mechanism` is what BINDS this verb to the operator write
  #       path (#2766): it is the op_type a caller passes
  #       (`create_operator(op_type=mechanism, label=predicate)`, the path
  #       `sdk.ingest` uses). Without it, and without a structural predicate,
  #       the declaration binds no write path — reported as
  #       `predicate-not-in-allowlist`. ⛔ That is a DECLARATION gap, not a
  #       runtime refusal: `create_operator` accepts any label (warn-not-block,
  #       #1934); only `create_edge` is strict. See "Declaring a relation" in
  #       docs/EXPANSION_PACKS.md.
  #   - semantics: optional — the Layer-2 MEANING, from the closed core vocabulary
  #     (ONTOLOGY §8): "hasPart", "addresses", "supports", "mutuallySupportive",
  #     "mutuallyExclusive", "refutes", "causes", "dependsOn", "transacts", "related",
  #     "ownedBy", "managedBy"
  #   - nearMisses: optional — sibling predicates/semantics this relation is confused with
  #   - cardinality: optional (one_to_one, one_to_many, many_to_one, many_to_many)
  #   - declarationOnly: optional bool — "documentation-only, on purpose". A
  #     relation whose declaration binds no write path is otherwise reported as
  #     `predicate-not-in-allowlist` (#2766); set this to say the silence is intended.
  # Old format (compat): { predicate, from, to, cardinality? }
  #   - from/to: entity types — "Object", "Subject"
  #     ⤷ the old format declares NO mechanism, so the declaration binds only the
  #       structural path — and only when the predicate is a structural edge
  #       predicate (hasPart, dependsOn, ownedBy, related, ...). Otherwise mark
  #       it `declarationOnly: true`.
  # Example:
  #   relations:
  #     - predicate: contains
  #       mechanism: IMPL
  #       semantics: hasPart
  #       fromKind: myapp:concept
  #       toKind: myapp:subconcept
  #       cardinality: one_to_many
  #     - predicate: dependsOn
  #       mechanism: IMPL
  #       fromKind: myapp:concept
  #       toKind: myapp:subconcept
  #       extractable: true      # v3 (R6 §3.3): declared intent that the
  #                              # extractor may assert this edge. bool, default
  #                              # FALSE — opt-in only. ⚠️ DECLARATION-ONLY today:
  #                              # no runtime consumer reads it (#2787 → #4894),
  #                              # so it does not by itself change extraction.
  relations: []

# ── Manifest v3 (epic #909 / research-r6 §3.4): extraction activation + enforcement ──
#   active:       bool, default true — false = this pack's kinds never enter
#                 the extraction brief
#   sourceTypes:  list of sourceKind values (conversation, document,
#                 github_issue, slack_message, linear_card, ...) that activate
#                 this pack; empty = all source types
#   enforcement:
#     default:    pack-wide level — warn|retry|block
#     kinds:      per-kind override: { kind: level }
#     relations:  per-predicate override: { predicate: level }
#     chains:     per-chain override: { chainId: level }
#   Resolution order (kinds): kindDefs[].enforcement → enforcement.kinds
#   → enforcement.default → warn
# Example:
#   extraction:
#     active: true
#     sourceTypes: [conversation, document]
#     enforcement:
#       default: warn
#       kinds:
#         useCase: retry
#       relations: {}
#       chains: {}
extraction:
  active: true
  sourceTypes: []
  enforcement:
    default: warn
    kinds: {}
    relations: {}
    chains: {}

# ── Manifest v3.1 (epic #909 §1.4/§1.5, #1026): extraction behaviour slots ──
# Additive and backward compatible: a v3 manifest with none of these keys
# normalizes to the documented shape unchanged (all four default to empty).
#
# ⛔ These slots DECLARE; they never DROP. The design that motivated this
# section originally included `entityPatterns`/`excludePatterns` — name-pattern
# rules that discarded artefacts at mint. #1026 rules against them:
#
#     "keep the slot, as declared entity types only — the pack declares which
#      kinds its artefacts are; no name patterns; nothing is dropped at mint."
#
# Declaring either key is a validation ERROR carrying that reason, so an author
# arriving from a pattern-filtering design is told why at the point of adoption
# rather than being left to infer it from "unknown key".
#
#   entityCues:        {kind: [surface cue, ...]} — the surface forms YOUR
#                      domain writes this kind in (dev: "the .py module";
#                      product-strategy: "our pricing page"). The key must be a
#                      kind reference that RESOLVES: this pack's own kind, a
#                      core kind, a kind declared by exactly ONE other pack
#                      (bare), or `namespace:kind` of a loaded pack. That is
#                      what makes the slot declarative rather than a filter.
#                      A core kind is written BARE (`Project`) — that is the
#                      manifest convention. `core:Project`, the internal
#                      spelling the compiled brief emits, is accepted too, but
#                      prefer the bare form.
#                      ⚠️ NOTE — per-kind surface forms ALREADY have a home the
#                      classifier reads: `ontology.kindDefs.<kind>.synonyms`
#                      and `.examples`, which compile_kind_index_spec renders
#                      into the classification surface.
#                      ⛔ `entityCues` deliberately has NO consumer (#4894)
#                      and is NOT waiting for one: per-kind forms already have
#                      a READ home above, so rendering this block as well would
#                      create the second source of truth for one value that
#                      #4894's own review warns about. Declaring `entityCues`
#                      alone does not reach the classifier — put the forms in
#                      kindDefs.synonyms/examples. (The slot is kept — #1026's
#                      ruling — so a manifest declaring it still validates and
#                      round-trips rather than being refused as unknown.)
#   relationTemplates: pack-typical edge shapes, so the extractor recognizes
#                      the domain's IMPL/NAND phrasings.
#                      ⛔ Deliberately NO consumer (#4894), for the same
#                      reason: a predicate + mechanism pair is ALREADY declared
#                      and READ in `ontology.relations` (whose write-path
#                      verdict is enforced — #2766), so a second declared
#                      spelling of the same pair would be a second source of
#                      truth. It validates and round-trips; it does not render.
#                        predicate:        the domain verb
#                        mechanism:        IMPL | NAND — the same pair
#                                          `ontology.relations` accepts.
#                                          ⛔ NOT MITIGATES: it was RETIRED from
#                                          the operator menu by the F1 ruling
#                                          (#4937 / #2552) and
#                                          `sdk.create_operator` refuses it.
#                        fromKind/toKind:  kind references, resolved as above
#                        description:      one line of what the shape captures
#   valueGate:         {keep: [...], drop: [...]} — what a VALUABLE utterance
#                      looks like in this domain. It judges utterances and never
#                      removes an artefact.
#                      ⚠️ This is the STRUCTURED form of a decision the pack may
#                      already declare as `ontology.memory_granularity`
#                      (the same policy in prose). Both are READ (§ #4894):
#                      extractor_v2 renders `memory_granularity` into the S1
#                      prompt and these hints into the S1/S2/S4 value-brief
#                      slot (`_granularity_text` / `_s2s4_rules` via the brief's
#                      reserved `pack_hints` section), so keep/drop reach the
#                      mapper. That is their ONLY consumer by design — nothing
#                      turns a hint into a rule (see the ⛔ above). Note
#                      value_gate.py reads NO pack manifest — it is a
#                      stdlib-only leaf whose identifier
#                      rules keep their policy provenance declared elsewhere:
#                      issue/PR numbers and commit hashes by the dev pack's
#                      memory_granularity, paths and ids by extractor_v2's
#                      landed #2453 clause — so a hint can never remove an
#                      artefact at mint, and does not need to.
#   promptFragments:   ["..."] — pack-authored instruction snippets DECLARED
#                      for the value brief, and rendered there (§ #4894) into
#                      the same S1/S2/S4 slot as the `valueGate` hints.
#                      Capped on BOTH words and characters: ~120 words / 480
#                      chars each, ~600 words / 2400 chars in total. The word
#                      count is a proxy, not a tokenizer, which is why the
#                      character bound exists alongside it.
#
# Example (the kinds are CORE, so this snippet validates as written — a pack's
# own kinds must be declared in its *Kinds lists, and an `ns:kind` ref must
# resolve to a loaded pack):
#   extraction:
#     entityCues:
#       Project: ["the <domain> initiative", "our <domain> rollout"]
#       Document: ["the .py module", "the migration file"]
#     relationTemplates:
#       - predicate: addresses
#         mechanism: IMPL
#         fromKind: Project
#         toKind: Document
#         description: "an initiative served by an artefact"
#     valueGate:
#       keep: ["design rationale", "a trade-off stated with its reason"]
#       drop: ["logistics", "tool mechanics"]
#     promptFragments:
#       - "Prefer domain nouns over file paths when naming an entity."

# ── Layer 2: Connectors ──────────────────────────────────────────────────
connectors: []

# ── Layer 3: Tools ───────────────────────────────────────────────────────
# Tool params use JSON Schema conventions:
#   - type: string|integer|number|boolean|array|object
#   - Use a top-level 'required' array for required params (not per-param 'optional')
#   - Example: params: { status: { type: string }, limit: { type: integer, default: 50 } }
#     with: required: [status]
tools: []

# ── Dependencies ──────────────────────────────────────────────────────────
# Pack-level dependencies (#2781), by namespace. CONSUMED, not decorative:
#   * registry load — a declared pack that is not loaded is reported against
#     THIS pack (naming the missing one) and the pack still loads. The
#     declaration is also what explains an unresolvable BARE kind reference
#     (one that carries no `ns:` prefix): with a declared-but-absent
#     dependency the reference is a reported gap, without one it is treated
#     as a typo and the pack is isolated.
#   * hosted install (`validate_manifest`) — FAIL-CLOSED: an upload whose
#     declared dependency or cross-pack reference cannot be satisfied by the
#     tenant's installed set (starter catalog + the tenant's own packs) is
#     refused, naming the missing pack.
depends_on: []
# Example — a pack whose relations/nearMisses reach into two other packs:
# depends_on:
# - product-strategy
# - pm
