# Investment Portfolio Manager — an OVERLAY on `venture` (issue #9663)
#
# `packs/venture/manifest.yaml` already carries the portfolio position: its
# `investment` kind IS the fund's stake in a backed company (`prospective →
# invested → active → written-off`), with `program`/`asset` beneath it and the
# `venturePortfolioFlow` chain. Its own header states the rule this pack exists
# to honour: "Vertical vocabulary belongs in an overlay pack, never here."
#
# So this pack ADDS the portfolio-manager specifics and never renames what
# venture already models. The one outcome #9663 exists to prevent is an overlay
# that re-declares a concept it could reference: the position is
# `venture:investment` here, always referenced NAMESPACED, never as a second
# bare `investment`/`holding`. Ambiguity between the two packs' vocabulary is
# resolved by `synonyms`/`nearMisses` in this manifest (the classifier reads
# `synonyms`/`examples`; the rerank reads `nearMisses`), never by minting a
# competing kind.
#
# A pack cannot extend another pack's lifecycle: `statuses`/`folds` may only be
# declared for kinds in THIS pack's `objectKinds` (the fold dispatches on the
# namespaced kind, and `status_folds.validate_status_decl` refuses a lifecycle
# on a kind this pack does not own). This pack therefore declares a lifecycle
# only for its own two Objects and leaves `venture:investment`'s alone.
#
# ── The value test (issue #9663), applied to every candidate ────────────────
# A new kind is admitted only if it does at least one of:
#   (1) owns a closed `statuses` lifecycle, with a declared `folds`;
#   (2) declares a `values` shape (money / percent / multiple / duration /
#       quantity);
#   (3) is a step in a declared `chains` path;
#   (4) is an endpoint of a declared `relations` entry carrying a `mechanism`.
# Anything else belongs in a `synonyms` entry on an existing kind. Each kindDef
# below carries a `# value test:` line naming the bullets it passes, and the
# rejections are recorded at the bottom of this header — the test file
# re-derives the same verdict from this manifest, so the two cannot drift.
#
# ── REJECTED candidates (and what absorbed each) ────────────────────────────
#   investment / holding (as this pack's own kind)
#       The rename #9663 exists to prevent — one concept, two homes. Use
#       `venture:investment`; the "holding" wording is a `synonyms` entry on
#       `allocationTarget` only where it names a TARGET, never a position.
#   valuation (Object)
#       A second state carrier for what `venture:investment` already carries.
#       Rejected; the dated mark is the `valuationMark` EVENT (bullet 4), and
#       the position stays `venture:investment`.
#   thesis / view / hypothesis (Object)
#       A claim is a core POINT (`statement`) carried by `aboutObject` /
#       `aboutSubject`, never an Object: state lives on Objects only.
#   benchmark
#       Labels only — fails all four bullets. Absorbed as the `synonyms` entry
#       "benchmark weight" on `allocationTarget` (a benchmark is a target the
#       allocation is measured against, which is exactly `targetPct`).
#   rebalance (Object or event kind)
#       Labels only — fails all four bullets. A rebalance is a unit of work
#       with an owner and a date, which is `venture:actionItem`; absorbed
#       there (no new kind, no synonym on another pack's kind — a pack's
#       kindDefs may not extend a sibling's kind).
#   equivalentTo: investment → venture:investment
#       Only meaningful for the SAME bare name under two namespaces; this pack
#       declares no `investment`, so a twin declared only to be equated would be
#       the two-homes failure with extra steps.
#   A declared chain (e.g. `portfolioReviewFlow`)
#       Inert: `master["chains"]` is built from `extractor_v2.CHAINS` on every
#       path, so a pack chain outside that constant reaches no prompt. Boundary
#       (a chain belongs in `extractor_v2.CHAINS`, not in a pack manifest) is
#       pinned by `tests/test_investment_portfolio_manager_pack.py`. That is
#       why NO kind below claims bullet 3.

namespace: portfolio
name: Investment Portfolio Manager
version: 0.1.0
tier: free
description: >-
  Portfolio-manager vocabulary layered on the venture pack — the mandate a
  portfolio's holdings must respect, the target allocation per class/sector, and
  the dated valuation mark on a position. The position itself is
  `venture:investment`; this pack never renames it.

# #2781: this pack references `venture:investment` in relations and in
# kindDefs nearMisses, so the dependency is DECLARED. With `venture` absent the
# registry reports those references against this pack by name instead of
# isolating it (and instead of cascading) — and a TYPO in a reference to a
# present pack stays fatal, which is what keeps the declaration honest.
depends_on:
- venture

ontology:
  extends: core

  # ── State carriers (Objects) ─────────────────────────────────────────────
  # State lives on Objects. Each of these holds a current position that a later
  # claim must SUPERSEDE, never append to.
  objectKinds:
  - mandate
  - allocationTarget

  # ── Dated occurrences (Events) ───────────────────────────────────────────
  # Events carry NO state: a valuation mark records that the position was
  # marked, at a date, and for what value. The position keeps its own current
  # state on `venture:investment`.
  eventKinds:
  - valuationMark

  # NO `hierarchies` entry for mandate → allocationTarget: the pair is already
  # modelled by the `boundedBy` relation below, which is the one the runtime can
  # write. A `hierarchies` path is shape-validated only and consumed by nothing,
  # so declaring the same link twice would invite a later reader to pick the
  # inert copy. One link, one representation.

  kindDefs:
    mandate:
      # value test: (4) endpoint of `constrainedBy` (a `mechanism: IMPL`
      # relation) — and ONLY that bullet. The kind DOES own a closed lifecycle
      # (draft → adopted → breached → retired), but bullet (1) as written asks
      # for a declared `folds`, and there is none: a breach is a judgment the
      # manager records, and this pack declares no event that would FOLD it.
      # Inventing one to satisfy a bullet would be the mechanism-invention the
      # value test exists to stop — so the bullet is not claimed.
      description: >-
        The constraints a portfolio's holdings must respect — investment period,
        sector/geography limits, concentration caps and reserve policy. The
        mandate gates what may be held; the position records what IS held.
        Lifecycle: draft → adopted → breached → retired.
      statuses: [draft, adopted, breached, retired]
      synonyms:
      - investment mandate
      - fund mandate
      - investment policy
      - investment policy statement
      - IPS
      - mandate terms
      - mandato
      - política de investimento
      - restrições do mandato
      examples:
      - "Mandate M-1: no single position above 20% of committed capital"
      - "the fund's 2026 investment mandate"
      nearMisses:
      - allocationTarget
      - venture:condition

    allocationTarget:
      # value test: (2) declares `values: targetPct (percent)` — the shape
      # "is this within mandate?" needs — and (4) endpoint of `boundedBy`.
      description: >-
        The intended share of the portfolio a class, sector or geography should
        hold — a target, not a position. `targetPct` is the declared value shape
        (percent); the POSITION side of the comparison is
        `venture:investment`. Lifecycle: proposed → adopted → retired.
      statuses: [proposed, adopted, retired]
      values:
      - name: targetPct
        valueKind: percent
      synonyms:
      - target allocation
      - allocation target
      - target weight
      - policy weight
      - benchmark weight
      - alocação-alvo
      - meta de alocação
      - peso-alvo
      examples:
      - "Allocation Target AT-1: 15% in agritech"
      - "50% of the portfolio in core software"
      nearMisses:
      - venture:investment
      - mandate

    valuationMark:
      # value test: (4) endpoint of `marks` (a `mechanism: IMPL` relation). An
      # Event — it records a dated mark and carries no state, so it is not an
      # Object and needs no lifecycle.
      description: >-
        A dated valuation of a position — the mark the manager sets at a point
        in time (fair value, a multiple of cost, or a write-down). An Event: it
        records that the position was marked, when, and for how much; the
        current worth of the position lives on `venture:investment`, never here.
      synonyms:
      - mark
      - valuation mark
      - fair value mark
      - valuation
      - markup
      - markdown
      - write-down
      - marcação
      - avaliação
      - reavaliação
      examples:
      - "Valuation Mark VM-3: Alpha Holdings at 2.1x cost, 2026-06-30"
      - "Q2 mark: Delta Sciences written down 40%"
      nearMisses:
      - venture:investment
      - venture:disbursement

  # ── Relations ─────────────────────────────────────────────────────────────
  # Every endpoint is a kind of this pack or of `venture` (declared in
  # `depends_on`); no core structural predicate is re-invented. `semantics:`
  # names the Layer-2 meaning (ONTOLOGY §8, #7852) and `mechanism: IMPL` is what
  # makes the declaration bind a runtime write path (#2766).
  relations:
  - predicate: constrainedBy
    mechanism: IMPL
    semantics: dependsOn
    fromKind: venture:investment
    toKind: portfolio:mandate
    cardinality: many_to_one
    extractable: true
    # #7852: a relation may be confused with a SIBLING PREDICATE. `gatedBy` is
    # venture's own predicate for "this is held back by that" — the closest
    # confusion for a mandate constraint. It is declared BARE (predicates are
    # bare by contract, #2030), so with `venture` absent it is a named,
    # survivable gap against `depends_on` — never an isolation (#2781).
    nearMisses:
    - gatedBy
  - predicate: boundedBy
    mechanism: IMPL
    semantics: dependsOn
    fromKind: portfolio:allocationTarget
    toKind: portfolio:mandate
    cardinality: many_to_one
    extractable: true
    nearMisses:
    - constrainedBy
    - mutuallyExclusive
  - predicate: marks
    mechanism: IMPL
    semantics: related
    fromKind: portfolio:valuationMark
    toKind: venture:investment
    # many_to_one: a position is marked MANY times over its life (one mark per
    # period), which is the whole point of a dated mark. `one_to_one` would
    # assert at most one mark per position and be refuted by the second period.
    cardinality: many_to_one
    extractable: true
    nearMisses:
    - addresses
    # BARE: predicates are declared and matched bare by contract (#2030), so a
    # relation nearMisses target is bare too — `venture:holds` is not a
    # predicate reference and would be a typo, not a cross-pack gap.
    - holds

  memory_granularity: >-
    Durable: the mandate terms the portfolio is actually run under and whether
    it is currently breached, the adopted target allocation per class/sector and
    why it was chosen, and the dated valuation marks with their basis (a
    multiple of cost, a write-down reason). Ephemeral: the mechanics of a mark
    (spreadsheet, sign-off logistics), superseded allocations, and any
    restatement of a position that `venture:investment` already carries.

extraction:
  active: true
  # Empty = active for every source type — the same choice `venture` makes, and
  # for the same reason: a portfolio review is a meeting, a memo or a document,
  # so narrowing to the meeting source kinds would drop real captures.
  sourceTypes: []
  enforcement:
    default: warn
    # Per-kind retry stays on the kindDefs where the evidence justifies it, not
    # restated here (the kindDefs rung wins this map). No kind in this pack
    # declares one: `allocationTarget` vs `venture:investment` is a
    # `nearMisses` pair with distinct lifecycle words, which is the cheaper
    # disambiguation.
    kinds: {}
    relations: {}
    chains: {}

connectors: []
tools: []
