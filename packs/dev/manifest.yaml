# Development Domain Extension
# Software development concepts — epics, issues, code, APIs, infrastructure.
# Manifest v3 (epic #909, research-r6 §6.2) — epic→issue→code chain + kindDefs.

namespace: dev
name: "Development"
version: "0.2.0"          # bumped: extractor-readable business logic (R6)
tier: free
description: "Software development concepts — epics, issues, code, APIs, databases, deployments"

ontology:
  extends: core

  objectKinds:
    - epic
    - issue
    - code
    - api
    - database
    - software
    - infrastructure
    - deployment
    - indicator

  subclassOf:
    epic: Project
    issue: WorkItem

  equivalentTo:
    issue: [pm:issue]

  pointKinds:
    - requirement
    - bug
    - technicalDebt

  documentKinds:
    - architectureDoc
    - apiSpec
    - deployRunbook

  # ── NEW: per-kind extractor metadata ─────────────────────────────────────
  kindDefs:
    epic:
      description: "A large body of work decomposed into issues"
      nearMisses: [issue]
    issue:
      description: "A tracked unit of work (≡ pm:issue)"
      synonyms: ["ticket"]
      nearMisses: [code]
    code:
      description: "Source code that implements features"
      nearMisses: [api, software]
    requirement:
      description: "A stated need a feature must satisfy (≡ product-strategy:requirement)"
      nearMisses: [bug]
    architectureDoc:
      description: "Documentation of architecture decisions (link: the architecture artifact kind is product-strategy:architecture)"
      nearMisses: [architecture]

  # ── NEW: engineering delivery chain, first-class ────────────────────────
  chains:
    - id: epicToCode
      name: "Epic-to-Code Chain"
      description: "How planned work flows from epics through issues into shipped code"
      steps: [epic, issue, code]
      enforcement: warn

  relations:
    - predicate: decomposesInto
      mechanism: IMPL
      semantics: hasPart
      fromKind: dev:epic
      toKind: dev:issue
      cardinality: one_to_many

    - predicate: implements
      mechanism: IMPL
      semantics: addresses
      fromKind: dev:issue
      toKind: product-strategy:feature

    - predicate: deploysTo
      mechanism: IMPL
      semantics: addresses
      fromKind: dev:code
      toKind: dev:deployment

    - predicate: dependsOn
      mechanism: IMPL
      semantics: addresses
      fromKind: dev:api
      toKind: dev:database

  hierarchies:
    - path: "Epic → Issue"
      type: hasPart

connectors: []
tools: []
depends_on: []
