namespace: dev
name: Development
version: 0.3.0
tier: free
description: Software development concepts — epics, issues, code, APIs, databases,
  deployments, and the planning/reliability layer CTOs work with (themes,
  incidents, PRs, risks, runbooks)
ontology:
  extends: core
  objectKinds:
  - epic
  - issue
  - code
  - api
  - database
  - software
  - infrastructure
  - indicator
  - theme
  - pullRequest
  - bug
  - incident
  subclassOf:
    epic: Project
    issue: WorkItem
    pullRequest: WorkItem
    bug: Problem
    incident: Problem
  equivalentTo:
    issue:
    - pm:issue
  pointKinds:
  # `requirement` is NOT a point kind (#7848 owner ruling): it is an Object kind,
  # declared ONCE by product-strategy. A claim about a requirement is a separate
  # Point, linked to it — the Object carries the lifecycle/satisfaction state.
  - technicalDebt
  - risk
  documentKinds:
  - architectureDoc
  - apiSpec
  - deployRunbook
  - runbook
  kindDefs:
    epic:
      description: A large body of work decomposed into issues
      nearMisses:
      - issue
      - theme
    issue:
      description: A tracked unit of work (≡ pm:issue)
      synonyms:
      - ticket
      - task
      nearMisses:
      - code
      - bug
    theme:
      description: A strategic investment area that groups epics (e.g. scalability,
        reliability, developer friction)
      synonyms:
      - initiative
      - strategic theme
      - workstream
      - pillar
      nearMisses:
      - feature
      - goal
      - epic
    pullRequest:
      description: A proposed code change with a review lifecycle (GitHub PR / merge
        request)
      synonyms:
      - pr
      - merge request
      nearMisses:
      - issue
      - code
    code:
      description: Source code that implements features
      nearMisses:
      - api
      - software
      - pullRequest
    bug:
      description: A technical defect — code deviates from expected behavior (problem
        family)
      synonyms:
      - defect
      - fault
      nearMisses:
      - issue
      - incident
    incident:
      description: A production problem — service deviates from its SLO/standard (problem
        family)
      synonyms:
      - outage
      nearMisses:
      - friction
      - bug
      - deployment
    risk:
      description: A claim that a problem may occur — the potential form of the problem
        family
      synonyms:
      - threat
      - hazard
      nearMisses:
      - bug
      - standard
    indicator:
      description: A measured value of system behavior — DORA/DRIVE metrics (deploy
        frequency, change lead time, change fail rate, MTTR, SLO coverage, error budget
        burn, flaky build rate)
      synonyms:
      - metric
      - sli
      - dora metric
      nearMisses:
      - target
    technicalDebt:
      description: 'A known shortcut that costs future velocity (register item with
        cost-of-delay framing: velocity tax, incident risk, owner)'
      nearMisses:
      - risk
      - bug
    runbook:
      description: Operational instructions for responding to incidents or running a
        service
      synonyms:
      - playbook
      - sop
      nearMisses:
      - deployRunbook
      - handoff
    architectureDoc:
      description: 'Documentation of architecture decisions (link: the architecture
        artifact kind is product-strategy:architecture)'
      nearMisses:
      - architecture
  relations:
  - predicate: decomposesInto
    mechanism: IMPL
    semantics: hasPart
    fromKind: dev:epic
    toKind: dev:issue
    cardinality: one_to_many
  - predicate: hasPart
    mechanism: IMPL
    semantics: hasPart
    fromKind: dev:theme
    toKind: dev:epic
    cardinality: one_to_many
  - predicate: implements
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:issue
    toKind: product-strategy:feature
  - predicate: deploysTo
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:code
    # `deployment` is core's EVENT kind (#7848): a deployment HAPPENS at a
    # moment. The pack does not re-declare it; the relation names it through
    # the `core:` spelling the resolver accepts.
    toKind: core:deployment
  - predicate: dependsOn
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:api
    toKind: dev:database
  - predicate: causes
    mechanism: IMPL
    semantics: supports
    fromKind: dev:bug
    toKind: dev:incident
  - predicate: fixes
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:pullRequest
    toKind: dev:bug
  - predicate: addresses
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:issue
    toKind: dev:incident
  - predicate: addresses
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:pullRequest
    toKind: dev:issue
  # ── the commitment spine (KIN-2, approved 2026-11-05) ────────────────────
  # `06-pack-logic-decisions.md` §KIN-2 declared three connections that no
  # child owned, using ONLY words the canonical document already rules — no
  # new kinds, no new vocabulary. They are declared here because `dev` is the
  # pack that owns the delivery vocabulary (`epic`, `indicator`, `theme`) and
  # already points relations at core kinds (`deploysTo` → `core:deployment`).
  #
  # Measured before they existed (`docs/evidence/11083/pack-relation-census.json`,
  # `dangling`): `goal` is a core Object kind (§5's commitment-state family)
  # and 0 of the 42 declared connections named it as an endpoint, so the graph
  # could hold a goal and could not connect it to the work that serves it or
  # the person who owns it. `dev:indicator` was dangling for the same reason.
  #
  # ⚠️ `goal --ownedBy--> Subject` carries `mechanism: IMPL` only because a
  # new-format relation must declare one (pack_registry._validate). ONTOLOGY §8
  # gives `ownedBy` NO mechanism (`—`: structural/neutral), so neither spelling
  # contradicts it. `relation_write_verdict` answers the SET of bound paths —
  # `("operator", "structural")` for this row, operator FIRST — not a choice:
  # the PICK is `pack_hierarchy._binding`'s (`_VALID_EDGE_PREDICATES` ⇒ structural)
  # and `tools/pack_relation_census.py::_relation_row`'s (`"structural" in paths`),
  # and both resolve this row to the STRUCTURAL path, where the writer stamps
  # `:ownedBy` as a bare `(:Object)-[:ownedBy]->(:Subject)` edge.
  # §3.6 makes the target an Entity (Subject | Object); this row names the
  # Subject half — the accountable owner — and its `->` reads "the subject owns
  # the goal", which is RACI Accountable, not a stake.
  - predicate: ownedBy
    mechanism: IMPL
    semantics: ownedBy
    fromKind: core:goal
    toKind: Subject
    cardinality: many_to_one
  # A goal is served by the epics that pursue it and measured by the
  # indicators that track it. §8 gives `addresses` IMPL and `->`, so an epic
  # existing is weak evidence the goal is real — the same reading
  # `dev:fixes` (a PR addresses a bug) already carries.
  - predicate: addresses
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:epic
    toKind: core:goal
    cardinality: many_to_many
  - predicate: addresses
    mechanism: IMPL
    semantics: addresses
    fromKind: dev:indicator
    toKind: core:goal
    cardinality: many_to_one
  hierarchies:
  - path: Theme → Epic
    type: hasPart
  - path: Epic → Issue
    type: hasPart
  chains:
  - id: epicToCode
    name: Epic-to-Code Chain
    description: How planned work flows from epics through issues into shipped code
    steps:
    - epic
    - issue
    - code
    enforcement: warn
  eventKinds:
  - prOpened
  - prReviewed
  - prMerged
  - prClosed
  - incidentDeclared
  - incidentResolved
  memory_granularity: 'Durable: problem-family reasoning — incident root causes and
    the chosen vs rejected mitigations; debt items with cost-of-delay framing (velocity
    tax, incident risk, owner); theme/epic allocation decisions; the delivery flow
    shape (theme → epic → issue → PR → deployment). Ephemeral: issue/PR numbers, CI
    status, test counts, commit hashes, tool workarounds, sprint mechanics.'
extraction:
  active: true
  sourceTypes:
  - conversation
  - document
  enforcement:
    kinds:
      # incident is an OBJECT kind → index-reachable (extraction retry fires on
      # incident near-misses; #2030 decision note). risk stays a point kind — FIX P
      # keeps point kinds out of the index, so `risk: retry` would be dead config.
      incident: retry
connectors: []
tools: []
# #2781: the cross-pack references this manifest actually makes are DECLARED.
# `equivalentTo: issue -> pm:issue` makes `pm` a real dependency; the bare
# `nearMisses` targets `feature` / `architecture` belong to `product-strategy`.
# A declared dependency is consumed at registry load: when the named pack is
# absent the reference is reported against THIS pack and the pack still loads —
# before #2781, dropping `pm` also dropped `dev` and `product-strategy`.
depends_on:
- product-strategy
- pm
