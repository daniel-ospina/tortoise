[project]
name = "tortoise-graph"
version = "0.2.0"
requires-python = ">=3.12"
license = "BUSL-1.1"
readme = {file = "README.md", content-type = "text/markdown"}
description = "Tortoise — live epistemic-graph extraction from transcripts (SDK)"
authors = [{ name = "Premise Labs" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    # httpx floor matches the hosted API's explicit pin (#310 — direct dep of
    # hosted_api.py analytics + tortoise.billing StripeClient). requirements.txt
    # is generated from this file, so the floor must live HERE (#494).
    "httpx>=0.27",
    "uvicorn>=0.23.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "falkordb>=1.0",
    "falkordblite>=0.10",
    "pyyaml>=6.0",
    "fastmcp==3.4.6",
    "prometheus-client>=0.16",
    "posthog>=3.0",
    # Session-JWT verification (session_auth.py, #1460). Was transitive via
    # `mcp` — promoted to a direct dep so a future mcp bump can't drop it
    # silently. The [crypto] extra is required for ES256/RS256 JWKS verify
    # (cryptography is already pinned via joserfc/backups).
    "pyjwt[crypto]>=2.13,<3",
]

[project.scripts]
tortoise = "tortoise.__main__:main"
tortoise-ingest = "tortoise.ingest:main"
tortoise-serve = "tortoise.deployment:serve"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6", "scikit-learn>=1.0"]
quadrature = ["jax>=0.4"]
postgres = ["psycopg2-binary>=2.9"]
backups = ["boto3>=1.34", "cryptography>=42"]
test = ["pytest>=8", "pytest-timeout", "pytest-asyncio>=0.23", "playwright>=1.40", "pytest-playwright>=0.9", "cryptography>=42"]  # cryptography: hosted E2E JWKS/ES256 session mint (#303, #1460)

# Canonical dev/test tooling (#492, #493) — installed via `uv sync --group dev`.
# The `test` extra above is the CI/live E2E path (pip install -e '.[test]').
[dependency-groups]
dev = [
    # pytest + pytest-timeout pins merged with #746's dev group; the extra
    # deps are required by the suite (verified while wiring #493):
    #   pytest-asyncio  — tests/test_github_indexer.py (@pytest.mark.asyncio)
    #   scikit-learn    — tests/test_gmm_proofs.py (module-level sklearn import)
    #   requests        — integrations/crm/twenty/bridge.py (repo-local tooling)
    #   jax             — tortoise/svbp.py (lazily imported by the ingest EP path)
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio",
    "scikit-learn>=1.0",
    "requests>=2.31",
    "jax>=0.4",
    "playwright>=1.40",
    # #1940: pytest-playwright floor bumped 0.5 → 0.9 — the lock had
    # drifted from what CI's `pip install -e '.[test]'` resolves (0.9.0),
    # so local uv.lock and the CI install disagreed. The teardown error
    # tracked in #1940 was a harness bug (tests/e2e/* route handlers), fixed
    # separately; this floor just pins the plugin at the current release
    # alongside the 1.62 driver.
    "pytest-playwright>=0.9",
    "ruff==0.16.4",  # #1685: pin ruff (CI lint-command + local `uv run ruff`
    # align — the unpinned agent-infra job install was the drift vector).
    "tiktoken>=0.14.0",
]

# #1929 (epic #1891 slice 1 — packaging foundation): the expansion-pack
# catalog ships in every packaged artifact (wheel + both Docker images).
# `tortoise.packs` maps to the repo-root `packs/` dir (single source of
# truth — NO physical relocation) and ships its manifests via package-data.
# The physical stub `tortoise/packs/__init__.py` exists ONLY so
# `packages.find` discovers the mapped package (find cannot see a
# package_dir-mapped dir); it is a discovery marker, not importable content.
[tool.setuptools]
package-dir = {"tortoise.packs" = "packs"}

[tool.setuptools.packages.find]
include = ["tortoise*", "benchmarks*", "battery*"]

[tool.setuptools.package-data]
# #1395: ship the routing config with the wheel (packaged default for the
# GitHub connector; TORTOISE_ROUTING_CONFIG overrides it).
# #1929: `../tests/sample_transcript.txt` lands at the wheel root as
# `tests/sample_transcript.txt` → `site-packages/tests/sample_transcript.txt`
# on install — exactly where `tortoise.__main__._cmd_demo` resolves it.
tortoise = ["config/routing.yaml", "../tests/sample_transcript.txt",
          # #1932: the authoring guide ships in the wheel (E2E-3 artifact-
          # delivery assertion — a wheel install can read it at site-packages/docs/).
          "../docs/EXPANSION_PACKS.md"]
# Quoted key (TOML dot-key): ships every packs/<ns>/manifest.yaml as
# tortoise/packs/<ns>/manifest.yaml in the wheel (recursive glob — a pack
# added by a later slice, e.g. #1933 agent-ops, needs no pyproject change).
"tortoise.packs" = ["**/*.yaml"]

# --- Lint baseline (#1503) --------------------------------------------------
# The shared agent-infra python-ci lint (ci.yml `agent-infra-ci` job, #303)
# can now run the FULL ruff + mypy pass. Both tools are configured here so
# the rule surface is pinned (version-stable) and the ~19k-violation gap
# (ruff + mypy, measured pre-config) is recorded as a baseline instead of
# blocking CI.
#
# Measured 2026-08-20 with ruff 0.16.3 + mypy 2.3.1 on origin/main:
#   ruff  — 3,753 violations across 534 files (select below, line-length 100)
#   mypy  — 406 errors in 58 files (123 checked, per-code counts in
#           docs/lint-baseline-1503.md)
#
# #1685 (2026-08-25): the ruff baseline DRIFTED — verified root cause was NOT
# a 0.16.3→0.16.4 behavior change (both report byte-identical locations): the
# baseline NEVER held at merge #1504 (369 violations; hosted_api.py + ~20
# files uncovered; the CI lint was narrowed to the syntax class E9/F63/F7 so
# the red passed silently), and +104 more drifted over 319 commits. Refreshed
# to 0 errors on 2026-08-25 with ruff 0.16.4 (473 violations: 230 safe-fixed
# by `--fix`, 242 `# noqa` directives added) AND pinned: the CI lint-command
# prefixes `pip install ruff==0.16.4` (ci.yml) and the dev group carries
# ruff==0.16.4 (pyproject.toml) so the unpinned agent-infra job install
# cannot drift again. Counts: docs/lint-baseline-1503.md.
#
# The baseline makes the full pass run green WITHOUT a code refactor:
#   ruff — the 3,753 existing violations are recorded as per-line `# noqa`
#          directives (ruff check . --add-noqa); the rule surface stays ACTIVE
#          for new code.
#   mypy — the 406 existing errors are recorded as a config baseline
#          (disable_error_code) since mypy has no noqa-equivalent.
# Cleanup = fix a violation and delete its `# noqa` directive (ruff) / remove
# a code from disable_error_code (mypy), then re-measure (tracked in the
# follow-up issue; counts live in docs/lint-baseline-1503.md).

[tool.ruff]
# line-length 100 matches the codebase's actual distribution (812 tortoise/
# lines > 100 vs 1,830 > 88) and mirrors the historical tooling (flake8 config
# used max-line-length 100).
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, version-stable select: ruff 0.16 expanded its DEFAULT surface to
# 413 rules (up from the classic E4/E7/E9/F 59) — relying on the default would
# drift the baseline with every ruff bump. These 7 categories are the
# long-standing stable core (E, F, B, UP, I, SIM, RUF).
select = ["E", "F", "B", "UP", "I", "SIM", "RUF"]
# Deferred style rules (not part of the baseline — never enforced):
#   E501     line-too-long — redundant with `ruff format`'s line-length
#            handling; the codebase has 812 lines > 100 that are untouched.
#   RUF001/2/3  ambiguous-unicode — noisy on this repo's multi-language
#            comment/string surface (Latin-1 quotes); low signal.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
# Agent-infra python-ci convention (templates/.github/workflows/python-ci.yml):
# mypy <pkg> --ignore-missing-imports --check-untyped-defs — moved into the
# config so the caller's typecheck-command stays a bare `mypy tortoise/`.
ignore_missing_imports = true
check_untyped_defs = true
# Baseline (#1503): every error code present in the 406-error first pass is
# disabled so the full typecheck runs green. Per-code counts + cleanup order
# are documented in docs/lint-baseline-1503.md.
disable_error_code = [
    "attr-defined",      # 120
    "arg-type",          #  99
    "assignment",        #  50
    "name-defined",      #  31
    "return-value",      #  18
    "union-attr",        #  16
    "var-annotated",     #  15
    "index",             #  13
    "operator",          #   9
    "no-redef",          #   9
    "misc",              #   8
    "dict-item",         #   6
    "call-arg",          #   6
    "list-item",         #   2
    "call-overload",     #   2
    "override",          #   1
    "func-returns-value",#   1
]

[tool.pytest.ini_options]
markers = [
    "bench: issue #316 benchmark harness tests (benchmarks/ + tests/bench/)",
    "track_b: epic #902 Track B (post-#780) tests — inert under '-m not track_b' (A8 #1058)",
    "slow: network/venv acceptance tests (wheel build + verify_client.sh gate, PR #1313) — excluded from the default fast suite",
    "v4_conditional: post-baseline follow-up run assertions (E6 #1538, ⛔ G3) — window-indexed restore + recall measurement, skipped in V3",
    "embedded_only: epic #1647 (D-2) — embedded-only behavior (EmbeddedStoreBusyError); skips visibly when TORTOISE_DB_URI is set",
    "live: live-API probe tests (Task 1 #1787) — excluded from the deterministic suite with -m 'not live'",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
