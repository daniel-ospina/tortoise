[project]
name = "tortoise-graph"
version = "0.2.0"
requires-python = ">=3.12"
license = "BUSL-1.1"
readme = {file = "README.md", content-type = "text/markdown"}
description = "Tortoise — live epistemic-graph extraction from transcripts (SDK)"
authors = [{ name = "Premise Labs" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    # httpx floor matches the hosted API's explicit pin (#310 — direct dep of
    # hosted_api.py analytics + tortoise.billing StripeClient). requirements.txt
    # is generated from this file, so the floor must live HERE (#494).
    "httpx>=0.27",
    "uvicorn>=0.23.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "falkordb>=1.0",
    "falkordblite>=0.10",
    "pyyaml>=6.0",
    "fastmcp==3.4.6",
    "prometheus-client>=0.16",
    "posthog>=3.0",
]

[project.scripts]
tortoise = "tortoise.__main__:main"
tortoise-ingest = "tortoise.ingest:main"
tortoise-serve = "tortoise.deployment:serve"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6", "scikit-learn>=1.0"]
quadrature = ["jax>=0.4"]
postgres = ["psycopg2-binary>=2.9"]
backups = ["boto3>=1.34", "cryptography>=42"]
test = ["pytest>=8", "pytest-timeout", "pytest-asyncio>=0.23", "playwright>=1.40", "pytest-playwright>=0.5"]

[tool.setuptools.packages.find]
include = ["tortoise*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
# Ergonomic dev group so `uv run pytest` works with per-test timeouts in
# offline CI (complements the existing `test` extra; pytest-timeout caps
# infra-dependent tests that would otherwise hang when Redis/Docker are down).
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]
