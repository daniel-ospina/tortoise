[project]
name = "tortoise-graph"
version = "0.2.0"
requires-python = ">=3.12"
license = "BUSL-1.1"
readme = {file = "README.md", content-type = "text/markdown"}
description = "Tortoise — live epistemic-graph extraction from transcripts (SDK)"
authors = [{ name = "Premise Labs" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    # httpx floor matches the hosted API's explicit pin (#310 — direct dep of
    # hosted_api.py analytics + tortoise.billing StripeClient). requirements.txt
    # is generated from this file, so the floor must live HERE (#494).
    "httpx>=0.27",
    # httpcore is imported DIRECTLY by tortoise/cimd.py, which needs its
    # `network_backend` seam to pin the CIMD fetch socket to a vetted address
    # (#2847). Promoted from transitive (httpx's own dependency, same rule as
    # redis below) so a future httpx bump cannot drop it silently. The floor
    # matches httpx 0.28's resolved httpcore line, whose NetworkBackend / sync
    # ConnectionPool API the pin is written against.
    "httpcore>=1.0.9",
    "uvicorn>=0.23.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "falkordb>=1.0",
    "falkordblite>=0.10",
    # redis is declared DIRECTLY (it is otherwise transitive) because both
    # dependents' floors are open-ended — `falkordblite 0.10.0 -> redis>=4.5`,
    # `falkordb 1.6.2 -> redis>=7.1.0` — so a bare floor let a fresh resolve
    # silently move to falkordb 1.7.1 + redis 8.1.0, an unverified pairing.
    # This bounds redis to the newest line both verified dependents accept.
    #
    # Not a preference: the bound is what the declared constraints resolve to
    # (falkordb 1.7.1 is excluded only because it demands redis 8). What would
    # have to change to LIFT it is a constraint change — redis 8 verified
    # end-to-end here, or a dependent's floor moving — not taste.
    #
    # FLOOR only: dependency hygiene, NOT the fix for #3459. Durable owner
    # decision (2026-09-13). Full rationale: PR #3476.
    "redis>=7.1,<8",
    "pyyaml>=6.0",
    "fastmcp==3.4.6",
    "prometheus-client>=0.16",
    "posthog>=3.0",
    # Optional-but-declared Sentry integration for the hosted API (#2444): the
    # dependency is hard (declared) but activation is gated on SENTRY_DSN being
    # set — local SDK / self-host / tests never initialize it (tortoise/sentry.py).
    "sentry-sdk>=2.0",
    # Session-JWT verification (session_auth.py, #1460). Was transitive via
    # `mcp` — promoted to a direct dep so a future mcp bump can't drop it
    # silently. The [crypto] extra is required for ES256/RS256 JWKS verify
    # (cryptography is already pinned via joserfc/backups).
    "pyjwt[crypto]>=2.13,<3",
]

[project.scripts]
tortoise = "tortoise.__main__:main"
tortoise-ingest = "tortoise.ingest:main"
tortoise-serve = "tortoise.deployment:serve"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6", "scikit-learn>=1.0"]
quadrature = ["jax>=0.4"]
postgres = ["psycopg2-binary>=2.9"]
backups = ["boto3>=1.34", "cryptography>=42"]
# parity: released-benchmark executors (epic #1402 §5 parity/, #2800). pyarrow
# reads the published MemoryAgentBench parquet; the LongMemEval JSON leg needs
# nothing extra. Optional on purpose: without it the parity cell reports
# not-measured instead of failing (fail-closed, never a default number).
parity = ["pyarrow>=17"]
test = ["pytest>=8", "pytest-timeout>=2.4.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.6", "playwright>=1.40", "pytest-playwright>=0.9", "cryptography>=42", "markdown-it-py>=4"]  # cryptography: hosted E2E JWKS/ES256 session mint (#303, #1460). markdown-it-py: tests/test_blog_authoring_doc.py imports it directly (a real CommonMark parser); it was only transitive via fastmcp -> rich, so a rich bump could drop the new guard's import (#8379 finding 3). pytest-timeout floor (#5035): matches the dev group and uv.lock — every CI leg installs through this extra, and tests/test_ci_stall_identify.py asserts pytest-timeout's own failure string, so an unpinned resolution could drift it.

# Canonical dev/test tooling (#492, #493) — installed via `uv sync --group dev`.
# The `test` extra above is the CI/live E2E path (pip install -e '.[test]').
[dependency-groups]
dev = [
    # pytest + pytest-timeout pins merged with #746's dev group; the extra
    # deps are required by the suite (verified while wiring #493):
    #   pytest-asyncio  — tests/test_github_indexer.py (@pytest.mark.asyncio)
    #   scikit-learn    — tests/test_gmm_proofs.py (module-level sklearn import)
    #   requests        — integrations/crm/twenty/bridge.py (repo-local tooling)
    #   jax             — tortoise/svbp.py (lazily imported by the ingest EP path)
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio",
    # #6136 (epic #5215, owner decision D3): pytest-xdist for the ONE shard
    # D3 admits. Declared in BOTH the `test` extra (CI's
    # `pip install -e '.[test]'`) and this dev group so no install path can
    # resolve without it — a lane whose `-n` reaches pytest without the
    # plugin reds with "unrecognized arguments", while a lane that never
    # passes `-n` (D3's default) simply stays serial.
    "pytest-xdist>=3.6",
    "scikit-learn>=1.0",
    "requests>=2.31",
    "jax>=0.4",
    "playwright>=1.40",
    # #1940: pytest-playwright floor bumped 0.5 → 0.9 — the lock had
    # drifted from what CI's `pip install -e '.[test]'` resolves (0.9.0),
    # so local uv.lock and the CI install disagreed. The teardown error
    # tracked in #1940 was a harness bug (tests/e2e/* route handlers), fixed
    # separately; this floor just pins the plugin at the current release
    # alongside the 1.62 driver.
    "pytest-playwright>=0.9",
    "ruff==0.16.4",  # #1685: pin ruff (CI lint-command + local `uv run ruff`
    # align — the unpinned agent-infra job install was the drift vector).
    "tiktoken>=0.14.0",
    # #8379 (finding 3): tests/test_blog_authoring_doc.py imports `markdown_it`
    # directly (a real CommonMark parser, imported at the module level). It was
    # only transitive via fastmcp -> rich; declared HERE too so the canonical dev
    # install (`uv sync --extra embeddings --extra parity`, which does NOT
    # include the `test` extra) cannot lose it to a rich bump — the same
    # both-paths rule pytest-xdist follows above.
    "markdown-it-py>=4",
]

# #1929 (epic #1891 slice 1 — packaging foundation): the expansion-pack
# catalog ships in every packaged artifact (wheel + both Docker images).
# `tortoise.packs` maps to the repo-root `packs/` dir (single source of
# truth — NO physical relocation) and ships its manifests via package-data.
# The physical stub `tortoise/packs/__init__.py` exists ONLY so
# `packages.find` discovers the mapped package (find cannot see a
# package_dir-mapped dir); it is a discovery marker, not importable content.
[tool.setuptools]
package-dir = {"tortoise.packs" = "packs"}

[tool.setuptools.packages.find]
include = ["tortoise*", "benchmarks*", "battery*"]

[tool.setuptools.package-data]
# #1395: ship the routing config with the wheel (packaged default for the
# GitHub connector; TORTOISE_ROUTING_CONFIG overrides it).
# #1929: `../tests/sample_transcript.txt` lands at the wheel root as
# `tests/sample_transcript.txt` → `site-packages/tests/sample_transcript.txt`
# on install — exactly where `tortoise.__main__._cmd_demo` resolves it.
tortoise = ["config/routing.yaml", "../tests/sample_transcript.txt",
          # #1932: the authoring guide ships in the wheel (E2E-3 artifact-
          # delivery assertion — a wheel install can read it at site-packages/docs/).
          "../docs/EXPANSION_PACKS.md",
          # Epic #2080 seams wave-1: the per-harness hook scripts ship with
          # the wheel — `tortoise install` resolves volunteer-turn.sh from
          # package __file__, so site-package installs need the real script.
          "claude-hooks/*.sh", "claude-hooks/*.md",
          # #3818: the Codex capture seam ships too — `tortoise install codex`
          # copies the hook out of the PACKAGE into $CODEX_HOME/hooks, so a
          # wheel without it fails the install with "shipped capture hook not
          # found".
          "codex-hooks/*.sh",
          # #3819: the Cursor capture seam ships too — `tortoise install
          # cursor` copies the hook out of the PACKAGE into ~/.cursor/hooks,
          # so a wheel without it fails the install with "shipped capture hook
          # not found". (Cursor has NO config-dir env var: `CURSOR_HOME` does
          # not exist in Cursor 3.20.21.)
          "cursor-hooks/*.sh",
          # #3808: the same is true of the Pi capture seam — `tortoise install
          # pi` copies this extension out of the PACKAGE (not the repo), so a
          # wheel without it fails the install with "shipped capture extension
          # not found". Named exactly (not *.ts) so the behavioural test file is
          # NOT shipped to users.
          "pi-hooks/tortoise-capture.ts",
          # #2121: the Hermes seam ships as a directory PLUGIN (`tortoise
          # install hermes` copies plugin.yaml + __init__.py into
          # <dir>/.hermes/plugins/tortoise-volunteer/), so a wheel without it
          # fails the install with "shipped Hermes plugin not found".
          "hermes-plugin/*.py", "hermes-plugin/*.yaml",
          # #2120: the OpenClaw seam is a plugin DIRECTORY — `tortoise install
          # openclaw` copies every file out of the PACKAGE (the entry, the
          # manifest that makes OpenClaw load it, and package.json), so a wheel
          # missing any of them produces an install OpenClaw refuses. `*.mjs`
          # would also ship `index.test.mjs`; the three files are named
          # explicitly (pinned by tests/test_openclaw_seam.py against the
          # directory, so a NEW shipped file cannot be silently dropped).
          "openclaw-plugin/index.mjs",
          "openclaw-plugin/openclaw.plugin.json",
          "openclaw-plugin/package.json",
          "openclaw-plugin/README.md",
          # #3517: the capture disclosure's SINGLE SOURCE OF TRUTH ships in the
          # wheel beside `config/routing.yaml`. `tortoise session disclosure`
          # renders from it and the dashboard imports the same file — a wheel
          # without it would make the one surface that exists to be accurate
          # the one surface that cannot run.
          "config/capture_disclosure.json"]
# Quoted key (TOML dot-key): ships every packs/<ns>/manifest.yaml as
# tortoise/packs/<ns>/manifest.yaml in the wheel (recursive glob — a pack
# added by a later slice, e.g. #1933 agent-ops, needs no pyproject change).
"tortoise.packs" = ["**/*.yaml"]

# --- Lint baseline (#1503) --------------------------------------------------
# The shared agent-infra python-ci lint (ci.yml `agent-infra-ci` job, #303)
# can now run the FULL ruff + mypy pass. Both tools are configured here so
# the rule surface is pinned (version-stable) and the ~19k-violation gap
# (ruff + mypy, measured pre-config) is recorded as a baseline instead of
# blocking CI.
#
# Measured 2026-08-20 with ruff 0.16.3 + mypy 2.3.1 on origin/main:
#   ruff  — 3,753 violations across 534 files (select below, line-length 100)
#   mypy  — 406 errors in 58 files (123 checked, per-code counts in
#           docs/lint-baseline-1503.md)
#
# #1685 (2026-08-25): the ruff baseline DRIFTED — verified root cause was NOT
# a 0.16.3→0.16.4 behavior change (both report byte-identical locations): the
# baseline NEVER held at merge #1504 (369 violations; hosted_api.py + ~20
# files uncovered; the CI lint was narrowed to the syntax class E9/F63/F7 so
# the red passed silently), and +104 more drifted over 319 commits. Refreshed
# to 0 errors on 2026-08-25 with ruff 0.16.4 (473 violations: 230 safe-fixed
# by `--fix`, 242 `# noqa` directives added) AND pinned: the CI lint-command
# prefixes `pip install ruff==0.16.4` (ci.yml) and the dev group carries
# ruff==0.16.4 (pyproject.toml) so the unpinned agent-infra job install
# cannot drift again. Counts: docs/lint-baseline-1503.md.
#
# The baseline makes the full pass run green WITHOUT a code refactor:
#   ruff — the 3,753 existing violations are recorded as per-line `# noqa`
#          directives (ruff check . --add-noqa); the rule surface stays ACTIVE
#          for new code.
#   mypy — the 406 existing errors are recorded as a config baseline
#          (disable_error_code) since mypy has no noqa-equivalent.
# Cleanup = fix a violation and delete its `# noqa` directive (ruff) / remove
# a code from disable_error_code (mypy), then re-measure (tracked in the
# follow-up issue; counts live in docs/lint-baseline-1503.md).

[tool.ruff]
# line-length 100 matches the codebase's actual distribution (812 tortoise/
# lines > 100 vs 1,830 > 88) and mirrors the historical tooling (flake8 config
# used max-line-length 100).
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, version-stable select: ruff 0.16 expanded its DEFAULT surface to
# 413 rules (up from the classic E4/E7/E9/F 59) — relying on the default would
# drift the baseline with every ruff bump. These 7 categories are the
# long-standing stable core (E, F, B, UP, I, SIM, RUF).
select = ["E", "F", "B", "UP", "I", "SIM", "RUF"]
# Deferred style rules (not part of the baseline — never enforced):
#   E501     line-too-long — redundant with `ruff format`'s line-length
#            handling; the codebase has 812 lines > 100 that are untouched.
#   RUF001/2/3  ambiguous-unicode — noisy on this repo's multi-language
#            comment/string surface (Latin-1 quotes); low signal.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
# Agent-infra python-ci convention (templates/.github/workflows/python-ci.yml):
# mypy <pkg> --ignore-missing-imports --check-untyped-defs — moved into the
# config so the caller's typecheck-command stays a bare `mypy tortoise/`.
ignore_missing_imports = true
check_untyped_defs = true
# The Hermes plugin ships in a HYPHENATED directory: Hermes loads a plugin
# DIRECTORY by path, so the directory name is the install contract, not an
# import name. mypy walks `tortoise/` recursively and refuses a package dir
# whose name is not a valid identifier (`hermes-plugin contains __init__.py
# but is not a valid Python package name`); the plugin is loaded by the host
# interpreter and never as `tortoise.<sub>`, so it is not part of the typed
# package. Excluded at the config layer so the CI `mypy tortoise/` command
# stays a bare invocation (#2121).
exclude = ["tortoise/hermes-plugin/"]
# Baseline (#1503): every error code present in the 406-error first pass is
# disabled so the full typecheck runs green. Per-code counts + cleanup order
# are documented in docs/lint-baseline-1503.md.
disable_error_code = [
    "attr-defined",      # 120
    "arg-type",          #  99
    "assignment",        #  50
    "name-defined",      #  31
    "return-value",      #  18
    "union-attr",        #  16
    "var-annotated",     #  15
    "index",             #  13
    "operator",          #   9
    "no-redef",          #   9
    "misc",              #   8
    "dict-item",         #   6
    "call-arg",          #   6
    "list-item",         #   2
    "call-overload",     #   2
    "override",          #   1
    "func-returns-value",#   1
]

[tool.pytest.ini_options]
# #5035: the per-test budget belongs HERE, not on the CI command line. Before
# this line existed the only pytest-timeout budget configured for a REPO-WIDE
# run was the flag each CI leg passes (a test-local subprocess argv —
# `tests/test_tripwire.py` passes its own `--timeout=300` to a child — is not a
# config default), so a `pytest` a human or an agent ran by hand — which is
# exactly the command in the incident — armed NOTHING: it could not be killed,
# and the 43h48m run below was the result. (The host has no `timeout`/`gtimeout`
# binary either — verified absent from PATH, /opt/homebrew/bin and
# /usr/local/bin — so the shell convention the issue cites could not have bounded
# it.)
#
#   pid 64502, ppid 1, elapsed 01-19:48:27, cputime 3124:47 (~1.19 cores avg)
#   /Users/danielospina/Documents/GitHub/tortoise/.venv/bin/python -m pytest \
#       tests/test_cohort_cost_cap.py -q -p no:cacheprovider
#
# 300 is the budget the docker/PR CI legs already pass, and it is deliberately
# no LOOSER than that (see the test): where a leg needs more it declares more,
# and pytest-timeout gives an item's own `@pytest.mark.timeout(N)` marker
# priority over this value (`_get_item_settings`), so every existing 600/900/
# 1800s eval mark keeps its budget. `timeout_method` stays the default `signal`
# and `timeout_func_only` stays false — both PINNED by
# `tests/test_ci_stall_identify.py` (the only method that reaches a GIL-holding
# stall is `signal`; `thread` starves on the GIL — #7649).
#
# ⚠️ This is NOT a no-op on every leg: CI invocations that pass no `--timeout`
# and run a selection gain a bound here — that is the same defect this issue
# documents, on a runner instead of on this box. They are `.github/workflows/
# ci.yml`'s e2e legs (`test_welcome_page.py`, `test_no_legacy_token_path.py`,
# `tests/e2e/auth/`, the auth-clickthrough pair, the legal+signup pair, the
# keys/graphs pair, `tests/e2e/hosted/`), `welcome-e2e-monitor.yml`,
# `python-ci.yml`'s carve-out shard, `deploy-pages.yml`'s legal leg, and
# `evals-on-demand.yml` (whose lane is exactly one file,
# `tests/eval/retrieval/test_integration.py`, which declares
# `pytest.mark.timeout(600)`). This change also adds `pytest-timeout` to the two
# blog e2e install lines (`blog-write-e2e.yml`, `deploy-pages.yml`): they install
# pytest by hand (`pip install pytest requests playwright pytest-playwright`) and
# would otherwise leave this key INERT —
# `PytestConfigWarning: Unknown config option: timeout` — i.e. still unbounded.
#
# The bound is not tight for any of them. `config/ci-surfaces.yml` records a
# per-file duration for 848 files and the only one above 250s is
# `eval/retrieval/test_integration.py` (1523s) — and it carries
# `pytest.mark.timeout(600)`. Every other file's TOTAL is ≤235s, so no unmarked
# item can reach 300s. A leg that needs a longer single item must SAY so —
# `--timeout=N` in the workflow or `@pytest.mark.timeout(N)` on the test — and
# `--timeout=0` is the explicit opt-out for a deliberate unbounded run. Do NOT
# reach for the `PYTEST_TIMEOUT=0` env form for that: it is process-global, so a
# conftest setting it at import time disarms every run invisibly, and
# `tests/test_ci_stall_identify.py` deliberately does not accept it as an opt-out.
#
# Resolution order is CLI flag -> `addopts`/other CLI injections -> `PYTEST_TIMEOUT`
# env -> this ini value (`pytest_timeout.py::get_env_settings`), so this is the
# lowest-priority source: it only fills the hole a bare invocation leaves.
# The invariant (this key set, above `faulthandler_timeout`, and EQUAL to the main
# gate's `python-ci.yml` budget — the mode, which must repeat at least twice),
# the resolved value under a real config load, and a live reproduction are pinned
# by tests/test_ci_stall_identify.py.
timeout = 300
# #7649/#7655/#3719: make a stalled test dump its own frame. The cheap per-test
# guard above (pytest-timeout's default `signal` method) fires on
# SIGALRM, dumps every thread EXCEPT the stuck one, and is silently disarmed by
# any in-process `signal.alarm()` (shared ITIMER_REAL, #7655). This built-in
# pytest knob arms a thread-based faulthandler watchdog per item: it needs no
# signal and no ITIMER, so it survives both the GIL-holding C stall (#7649) and
# the alarm collision (#7655), and it names the stuck thread. It MUST fire
# strictly before `timeout` — `_pytest/faulthandler` cancels the timer in a
# `finally` when the item ends, so `faulthandler_timeout >= timeout` is a
# silent no-op. 280 sits 20s under the 300 above; a per-item
# `@pytest.mark.timeout(N)` override can raise an item's
# budget above it, in which case the watchdog dumps a healthy item's stack
# (a log line, never a failure — `faulthandler_exit_on_timeout` defaults false).
# The invariant + reproducer are pinned by tests/test_ci_stall_identify.py.
faulthandler_timeout = 280
markers = [
    "bench: issue #316 benchmark harness tests (benchmarks/ + tests/bench/)",
    "track_b: epic #902 Track B (post-#780) tests — inert under '-m not track_b' (A8 #1058)",
    "slow: network/venv acceptance tests (wheel build + verify_client.sh gate, PR #1313) — excluded from the default fast suite",
    "v4_conditional: post-baseline follow-up run assertions (E6 #1538, ⛔ G3) — window-indexed restore + recall measurement, skipped in V3",
    "embedded_only: epic #1647 (D-2) — embedded-only behavior (EmbeddedStoreBusyError); skips visibly when TORTOISE_DB_URI is set",
    "live: live-API probe tests (Task 1 #1787) — excluded from the deterministic suite with -m 'not live'",
    "integration: opt-in integration tests needing live credentials or production access (e.g. a real RESEND_API_KEY, ALLOW_PROD) — excluded from the deterministic lanes with -m 'not integration' (#4750)",
    "blog_write: blog E2E tests that WRITE to the target (create/publish/unpublish) — excluded from the every-deploy job with -m 'not blog_write' (#4220)",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
