[project]
name = "tortoise"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
readme = {file = "README.md", content-type = "text/markdown"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "falkordb>=1.0",
    "falkordblite>=0.10",
    "pyyaml>=6.0",
    "fastmcp==3.4.6",
    "prometheus-client>=0.16",
]

[project.scripts]
tortoise = "tortoise.__main__:main"
tortoise-ingest = "tortoise.ingest:main"
tortoise-serve = "tortoise.deployment:serve"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6", "scikit-learn>=1.0"]
quadrature = ["jax>=0.4"]
postgres = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
include = ["tortoise*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
