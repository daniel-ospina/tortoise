[project]
name = "tortoise-graph"
version = "0.2.0"
requires-python = ">=3.12"
license = "BUSL-1.1"
readme = {file = "README.md", content-type = "text/markdown"}
description = "Tortoise — live epistemic-graph extraction from transcripts (SDK)"
authors = [{ name = "Premise Labs" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    # httpx floor matches the hosted API's explicit pin (#310 — direct dep of
    # hosted_api.py analytics + tortoise.billing StripeClient). requirements.txt
    # is generated from this file, so the floor must live HERE (#494).
    "httpx>=0.27",
    "uvicorn>=0.23.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "falkordb>=1.0",
    "falkordblite>=0.10",
    "pyyaml>=6.0",
    "fastmcp==3.4.6",
    "prometheus-client>=0.16",
    "posthog>=3.0",
]

[project.scripts]
tortoise = "tortoise.__main__:main"
tortoise-ingest = "tortoise.ingest:main"
tortoise-serve = "tortoise.deployment:serve"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6", "scikit-learn>=1.0"]
quadrature = ["jax>=0.4"]
postgres = ["psycopg2-binary>=2.9"]
backups = ["boto3>=1.34", "cryptography>=42"]
test = ["pytest>=8", "pytest-timeout", "pytest-asyncio>=0.23", "playwright>=1.40", "pytest-playwright>=0.5", "cryptography>=42"]  # cryptography: hosted E2E JWKS/RS256 session mint (#303)

# Canonical dev/test tooling (#492, #493) — installed via `uv sync --group dev`.
# The `test` extra above is the CI/live E2E path (pip install -e '.[test]').
[dependency-groups]
dev = [
    # pytest + pytest-timeout pins merged with #746's dev group; the extra
    # deps are required by the suite (verified while wiring #493):
    #   pytest-asyncio  — tests/test_github_indexer.py (@pytest.mark.asyncio)
    #   scikit-learn    — tests/test_gmm_proofs.py (module-level sklearn import)
    #   requests        — integrations/crm/twenty/bridge.py (repo-local tooling)
    #   jax             — tortoise/svbp.py (lazily imported by the ingest EP path)
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio",
    "scikit-learn>=1.0",
    "requests>=2.31",
    "jax>=0.4",
    "playwright>=1.40",
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
include = ["tortoise*", "benchmarks*"]

[tool.pytest.ini_options]
markers = [
    "bench: issue #316 benchmark harness tests (benchmarks/ + tests/bench/)",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
