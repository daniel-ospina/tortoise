# Mergify configuration — the merge queue for `main`.
#
# WHY THIS FILE EXISTS
#   The queue validates the composition that will actually exist — `main ∪ the
#   queued PRs` — rather than trusting a green check on a head that may since
#   have moved. It also removes the author's obligation to update their branch.
#
#   `strict` is **false** today; restoring `true` is an open decision. Under
#   `strict: true` validation becomes a singleton lock — a green check certifies
#   exactly one composition, so each merge invalidates every other PR's
#   certification and N merges cost N full CI cycles — which is the base race
#   #3016 records. Do NOT describe `strict: true` as the current setting; read
#   the live value before quoting it. See #3016 and #4798.
#
#   #3016 (the base race) records Option 1: replace the lock with a queue and
#   stop requiring authors to update their branch. #4798 records the change of
#   route from GitHub's native queue (which needs an organization-owned repo) to
#   this queue (owner ruling 2026-09-24). The queue performs the update itself:
#   it merges the PR onto the current base inside a `mergify/merge-queue/main`
#   branch and runs CI there, so a merge is validated against the tree that will
#   actually exist — while the author does nothing.
#
#   Unlike GitHub's native merge queue, this needs **no workflow changes**: the
#   queue branch produces ordinary `push`/`pull_request` check runs, so no
#   workflow requires a `merge_group:` trigger.
#
# CONFIGURATION CONTRACT — read before editing
#   1. Every check named here MUST also be a *required* status check, and every
#      required status check MUST be named here. A required check that the queue
#      branch never reports on **deadlocks the queue** for every PR.
#   2. The live required set is the source of truth for the list below:
#        gh api repos/daniel-ospina/tortoise/branches/main/protection \
#          -q '.required_status_checks.contexts[]'
#      Re-read it when it changes; a stale list is a silent deadlock.
#   3. `check-success` is deliberate, never `check-pending` or `-check-failure`:
#      a skipped or neutral check must not read as a pass.
#
# Last reconciled with the live required set: 2026-09-24
#   pricing-artifact, docs, test-isolation, license-surface, legal-e2e,
#   python-ci-gate

# ── Parallel speculative checks — test several batches at once ────────────────
#
# The queue is otherwise SERIAL: one batch per full CI cycle, so throughput is
# capped at (batch_size / cycle_time) no matter what else is tuned. Measured
# 2026-09-26, that was ~3 merges/hour against a ~37 min cycle on 46 queued PRs.
#
# `max_parallel_checks` tests predicted merge states concurrently. Mergify's own
# worked example: with batch_size 3 and max_parallel_checks 2, six of seven
# queued PRs merge in ONE CI cycle instead of six cycles. The docs put the
# overall gain at 3-5x merge throughput.
#
# 3 is a deliberate starting point, not a ceiling. The limit that actually binds
# is CI capacity, not Mergify: this repo has already seen jobs fail to start
# because runners could not be acquired, so raising this multiplies CONCURRENT
# CI RUNS (~10 jobs each). Raise it only after watching the runner queue at 3.
#
# This is NOT "parallel mode". Parallel mode gives independent scopes their own
# queues; this speeds up the single ordered queue. They compose.
merge_queue:
  max_parallel_checks: 3

# ── Priority — let the changes that unblock others jump the queue ─────────────
#
# Mergify picks PRs for batching by PRIORITY FIRST, then by queue order, so a
# high-priority PR is never held behind lower-value work. Anything unmatched is
# `medium` (2000); this rule lifts a labelled PR to `high` (3000).
#
# `allow_checks_interruption: true` lets it interrupt checks already running.
# That is deliberate and it does spend CI time already paid for — the queue's
# own RCV trade (reliability + velocity, accepting wasted runs). Use the label
# only for changes that unblock others, never for preference.
priority_rules:
  - name: queue accelerator
    conditions:
      - label = queue-accelerator
    priority: high
    allow_checks_interruption: true

queue_rules:
  - name: main
    # Entry gate — evaluated against the PR, before it is queued.
    queue_conditions:
      - base=main
      - -draft
      - check-success=python-ci-gate
      - check-success=pricing-artifact
      - check-success=docs
      - check-success=test-isolation
      - check-success=license-surface
      - check-success=legal-e2e
    # Re-asserted against the *queue branch*, immediately before the merge.
    # This is the whole point of the queue: the check that gates the merge ran
    # on the tree being merged, not on a stale head.
    #
    # Only the critical-path check is named here, deliberately. A condition here
    # must be a check that actually *reports on the queue branch*; the remaining
    # five required checks are enforced by branch protection on the queue-branch
    # head instead. Adding a check that the queue branch never reports on would
    # block the merge forever — the deadlock this file's contract warns about.
    merge_conditions:
      - check-success=python-ci-gate
    merge_method: squash
    # Speculative batching: PRs that merge cleanly together are tested as one
    # group, so a single CI cycle can certify several merges. Deliberately
    # conservative at 2 until this repo's batch-failure behaviour is observed —
    # a failing batch is re-tested bisected, so a large batch is a slow failure.
    batch_size: 2
    batch_max_wait_time: 5 min

# ── Auto-queue: finished work enters the queue with no human click (#3016) ─────
#
# WHAT THIS SETS
#   `merge_protections_settings.auto_merge_conditions: true`. A PR matching
#   `queue_conditions` above is then queued automatically. Without it, Mergify
#   posts "Tick the box to add this pull request to the merge queue" and waits
#   for a human.
#
#   ⚠️ The `pull_request_rules` section of this file is NOT LOADED. Mergify
#   reports it unused — "The product Workflow Automation needs to be activated
#   to enable this feature" — so the `queue ready PRs onto main` rule below has
#   never run and CANNOT be a fill mechanism. Do not read it as one, and do not
#   add rules to that section expecting them to take effect: they are inert
#   until Workflow Automation is activated for this repository.
#
#   `merge_protections_settings` IS loaded — Mergify's own message says the rest
#   of the configuration will be used — which is why this setting, and not that
#   rule, is what actually queues finished work.
#
# WHY NOT `autoqueue: true`
#   `queue_rules[].autoqueue` is deprecated and maps to this setting. The two are
#   mutually exclusive BY SCHEMA — a config setting both is REJECTED. Never
#   restore `autoqueue` beside this.
#
# WHAT STILL GATES A MERGE
#   `queue_conditions` above still gate entry, and `merge_conditions` is
#   re-asserted against the queue branch before that branch is merged. This
#   setting removes the click. It removes no check.
#
# DO NOT RESTATE THE REASONING HERE
#   Reasoning belongs where it can be maintained and cited, not duplicated into a
#   comment that nothing re-reads:
#     · #3016 — the base race this queue exists to remove
#     · #5215 — merge throughput, and what the click actually cost
#     · #5426 — `ai-review-gate` is red whenever no valid recorded review marker
#       exists for the PR, and it is not a required context
#     · #5433 — the review record is enforced only by LOCAL tooling
#       (`review-enforcer` and `scripts/atomic-land.sh`); Mergify merges
#       server-side, so no step on that path reads it
#   ⛔ Never write "the review attestation is an enforced gate" here or anywhere
#   else. It is enforced on local land paths only, never on a queue merge.
merge_protections_settings:
  auto_merge_conditions: true

# NOTE: `batch_size` is deliberately NOT mutated here. Raising it and this
# change are separate levers and separate reviews; PR #5384 owns batch_size.
# Once both land, consider Mergify's DYNAMIC batch sizing
# (`batch_size: {min: 1, max: N}`), which spreads queued PRs across the
# available parallel checks — small batches when the queue is quiet, growing
# toward max only when it backs up.

pull_request_rules:
  - name: queue ready PRs onto main
    conditions:
      - base=main
      - -draft
    actions:
      queue:
        name: main
