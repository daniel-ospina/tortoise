# Mergify configuration — the merge queue for `main`.
#
# WHY THIS FILE EXISTS
#   The queue validates the composition that will actually exist — `main ∪ the
#   queued PRs` — rather than trusting a green check on a head that may since
#   have moved. It also removes the author's obligation to update their branch.
#
#   `strict` is **false** today; restoring `true` is an open decision. Under
#   `strict: true` validation becomes a singleton lock — a green check certifies
#   exactly one composition, so each merge invalidates every other PR's
#   certification and N merges cost N full CI cycles — which is the base race
#   #3016 records. Do NOT describe `strict: true` as the current setting; read
#   the live value before quoting it. See #3016 and #4798.
#
#   #3016 (the base race) records Option 1: replace the lock with a queue and
#   stop requiring authors to update their branch. #4798 records the change of
#   route from GitHub's native queue (which needs an organization-owned repo) to
#   this queue (owner ruling 2026-09-24). The queue performs the update itself:
#   it merges the PR onto the current base inside a `mergify/merge-queue/main`
#   branch and runs CI there, so a merge is validated against the tree that will
#   actually exist — while the author does nothing.
#
#   Unlike GitHub's native merge queue, this needs **no workflow changes**: the
#   queue branch produces ordinary `push`/`pull_request` check runs, so no
#   workflow requires a `merge_group:` trigger.
#
# CONFIGURATION CONTRACT — read before editing
#   1. The invariant is over BOTH condition lists, not one:
#        live required contexts == queue_conditions ∪ merge_conditions (checks),
#        each required check named in EXACTLY ONE of the two lists.
#      `queue_conditions` gates ENTRY (evaluated against the PR head);
#      `merge_conditions` gates the MERGE (evaluated against the queue branch).
#      A check named in `merge_conditions` that the queue branch never reports on
#      **deadlocks the queue** for every PR. A required check named in NEITHER
#      list is still known to Mergify — see point 4 — so naming it is not what
#      makes it enforced.
#   2. The live required set is the source of truth:
#        gh api repos/daniel-ospina/tortoise/branches/main/protection \
#          --jq '.required_status_checks.contexts[]'
#      Re-read it when it changes; a stale list is a silent deadlock.
#   3. `check-success` is deliberate, never `check-pending` or `-check-failure`:
#      a skipped or neutral check must not read as a pass. This holds for THESE
#      LISTS only — the conditions Mergify injects under `merge` (point 4) accept
#      neutral or skipped, so do not rely on injection to enforce them.
#   4. `branch_protection_injection_mode` DECIDES WHAT THE ENTRY GATE IS, and
#      this rule sets it to `merge` (see the queue rule below). Mergify injects
#      branch-protection rules as conditions itself, so the mode is load-bearing:
#        * `queue` (the DEFAULT, NOT used here) injects every required context for
#          QUEUING AND MERGING — under it, deleting a line from `queue_conditions`
#          is a no-op, because the context is re-injected for entry anyway;
#        * `merge` (SET HERE) injects them for the MERGE only — so here the entry
#          gate IS the `queue_conditions` list, and editing that list is exactly
#          how entry is changed.
#      Read the mode before reasoning about the list; the same list behaves
#      differently under the two modes.
#
# Last reconciled with the live required set: 2026-09-29
#   queue_conditions (entry) : pricing-artifact, docs, test-isolation,
#                              license-surface, legal-e2e, ai-review-gate
#   merge_conditions (merge) : python-ci-gate

# ── Parallel speculative checks — test several batches at once ────────────────
#
# The queue is otherwise SERIAL: one batch per full CI cycle, so throughput is
# capped at (batch_size / cycle_time) no matter what else is tuned. Measured
# 2026-09-26, that was ~3 merges/hour against a ~37 min cycle on 46 queued PRs.
#
# `max_parallel_checks` tests predicted merge states concurrently. Mergify's own
# worked example: with batch_size 3 and max_parallel_checks 2, six of seven
# queued PRs merge in ONE CI cycle instead of six cycles. The docs put the
# overall gain at 3-5x merge throughput.
#
# 3 is a deliberate starting point, not a ceiling. The limit that actually binds
# is CI capacity, not Mergify: this repo has already seen jobs fail to start
# because runners could not be acquired, so raising this multiplies CONCURRENT
# CI RUNS (~10 jobs each). Raise it only after watching the runner queue at 3.
#
# This is NOT "parallel mode". Parallel mode gives independent scopes their own
# queues; this speeds up the single ordered queue. They compose.
merge_queue:
  max_parallel_checks: 3

# ── Priority — let the changes that unblock others jump the queue ─────────────
#
# Mergify picks PRs for batching by PRIORITY FIRST, then by queue order, so a
# high-priority PR is never held behind lower-value work. Anything unmatched is
# `medium` (2000); this rule lifts a labelled PR to `high` (3000).
#
# `allow_checks_interruption: true` lets it interrupt checks already running.
# That is deliberate and it does spend CI time already paid for — the queue's
# own RCV trade (reliability + velocity, accepting wasted runs). Use the label
# only for changes that unblock others, never for preference.
priority_rules:
  - name: queue accelerator
    conditions:
      - label = queue-accelerator
    priority: high
    allow_checks_interruption: true

queue_rules:
  - name: main
    # Entry gate — evaluated against the PR head, before it is queued.
    #
    # The list below is cheap and repo-wide: the `ci.yml` checks run their own
    # workflow bodies there, and `tools/ci_selection.py` selects legs for the Python
    # suite, not for these (`ai-review-gate` is its own workflow, `ai-review-gate.yml`).
    # The heavy check is deliberately not listed here — per
    # contract point 4 it would be an entry condition anyway under the default
    # injection mode, which is the treadmill this change removes. It is named in
    # `merge_conditions` below, where it is re-run against the queue branch.
    #
    # ⛔ THE REVIEW RECORD IS AN ENTRY CONDITION (#5433), and this is the ONLY place the
    # queue can enforce it. The record is an author-PR property — bound to the author PR's
    # number and head — which is exactly why the synthetic queue batch deliberately PASSES
    # `ai-review-gate` instead of evaluating it (that gate's #5426 guard), so a merge-time
    # condition could never check it. Until this line existed, no step on the SERVER-SIDE
    # MERGE PATH enforced the record: the check ran on every PR and read the body, but it
    # was neither a required context nor named in any condition, so nothing acted on its
    # conclusion. The local `review-enforcer` gate guards `gh pr merge` run on a developer
    # machine; Mergify merged through the queue having consulted the record nowhere, so an
    # unreviewed or review-invalidated PR reached `main` by the routine route. Entry is
    # evaluated against the author PR head, where the run that verifies the record actually
    # reports.
    #
    # Cost: nothing extra — `ai-review-gate` already runs on every PR (it is a ~seconds job
    # reading the body and an HMAC), so naming it adds no workflow and no wall-clock. It
    # must ALSO be a live required context, and therefore present in the guard's record
    # `docs/ci/required-contexts.json`: clause (iv)'s agreement sub-check reds when the
    # config's check set and the record's `required_contexts` disagree (active under `merge`
    # injection; I1 itself is the LIVE comparison, read only by `--live`).
    #
    # Verified: every check listed below always REPORTS a conclusion (never `skipped`), so
    # `check-success` cannot deadlock entry. They are not all green on an unreviewed PR —
    # `ai-review-gate` is red by design until a review is recorded, which IS the enforcement;
    # the rest are green on any PR that builds.
    queue_conditions:
      - base=main
      - -draft
      - check-success=pricing-artifact
      - check-success=docs
      - check-success=test-isolation
      - check-success=license-surface
      - check-success=legal-e2e
      - check-success=ai-review-gate
    # Re-asserted against the *queue branch*, immediately before the merge.
    # This is the whole point of the queue: the check that gates the merge ran
    # on the tree being merged, not on a stale head.
    #
    # Only the critical-path check is named here, deliberately. A condition here
    # must be a check that actually *reports on the queue branch*; the cheap
    # checks are strictly enforced at ENTRY by `queue_conditions` above, and at
    # merge only weakly — by the injected branch-protection conditions, which
    # accept neutral/skipped (contract point 3). Adding a check that the queue
    # branch never reports on would block the merge forever — the deadlock this
    # file's contract warns about.
    #
    # ⛔ THE LINE THAT MAKES ENTRY CHEAP IS THIS ONE, NOT THE LIST ABOVE.
    # `queue` (the default) injects every required context as a condition for
    # QUEUING AND MERGING, so deleting a line from `queue_conditions` is a no-op —
    # the check is re-added for us. `merge` injects them for the merge only, so
    # they are checked on the batch, which is the tree that actually lands.
    # Verified live: queue PRs `mergify/merge-queue/<sha>` do report
    # `python-ci-gate`, so naming it here does not deadlock.
    branch_protection_injection_mode: merge
    merge_conditions:
      - check-success=python-ci-gate
    merge_method: squash
    # Speculative batching: PRs that merge cleanly together are tested as one
    # group, so a single CI cycle can certify several merges.
    #
    # Raised 2 -> 4 (2026-09-26), deliberately NOT higher. The two observed batch
    # failures (#5293, #5335) were each a batch of ONE, both for #4617:
    #   * #5335's base was fully green in main's own push run, yet the batch failed
    #     `test_dashboard_client_paths_resolve.py::…` and
    #     `test_oauth_token_fault.py::…` — a COMPOSITION failure, the thing a queue
    #     exists to catch;
    #   * #5293's base was ALSO red — main's push run at 6c48cf561 failed test (b)
    #     on `tests/test_kind_eval_set.py` (g-015 'core:document', the fixture
    #     #5308 later fixed) — yet its batch failed the SAME test-(a) dashboard
    #     case as #5335's, plus a different test-(b) case. That base had test (a)
    #     GREEN, so its test-(a) failure is base-unexplained too.
    # Both batches therefore carry a failure the base does NOT explain. Neither is
    # evidence that a larger batch is safe, which is why this stops at 4.
    #
    # Sizing: a full CI cycle is ~37 min measured on recent green runs (`test (a)`
    # 36.4 and 37.2 min; `python-ci-gate` ~36.8 min after `changes`), so batch 4
    # sustains ~6.5 merges/hour against batch 2's ~3.2. A failing batch is
    # re-tested bisected, so the COST of a failure grows with the size and that
    # cost is still unmeasured here. Do NOT raise this again until a genuine
    # multi-PR batch failure has been observed and the bisection cost measured.
    batch_size: 4
    batch_max_wait_time: 5 min

# ── Auto-queue: finished work enters the queue with no human click (#3016) ─────
#
# WHAT THIS SETS
#   `merge_protections_settings.auto_merge_conditions: true`. A PR matching
#   `queue_conditions` above is then queued automatically. Without it, Mergify
#   posts "Tick the box to add this pull request to the merge queue" and waits
#   for a human.
#
#   ⚠️ The `pull_request_rules` section of this file is NOT LOADED. Mergify
#   reports it unused — "The product Workflow Automation needs to be activated
#   to enable this feature" — so the `queue ready PRs onto main` rule below has
#   never run and CANNOT be a fill mechanism. Do not read it as one, and do not
#   add rules to that section expecting them to take effect: they are inert
#   until Workflow Automation is activated for this repository.
#
#   `merge_protections_settings` IS loaded — Mergify's own message says the rest
#   of the configuration will be used — which is why this setting, and not that
#   rule, is what actually queues finished work.
#
# WHY NOT `autoqueue: true`
#   `queue_rules[].autoqueue` is deprecated and maps to this setting. The two are
#   mutually exclusive BY SCHEMA — a config setting both is REJECTED. Never
#   restore `autoqueue` beside this.
#
# WHAT STILL GATES A MERGE
#   `queue_conditions` above still gate entry, and `merge_conditions` is
#   re-asserted against the queue branch before that branch is merged. This
#   setting removes the click. It removes no check.
#
# DO NOT RESTATE THE REASONING HERE
#   Reasoning belongs where it can be maintained and cited, not duplicated into a
#   comment that nothing re-reads:
#     · #3016 — the base race this queue exists to remove
#     · #5215 — merge throughput, and what the click actually cost
#     · #5426 — `ai-review-gate` is red whenever no valid recorded review marker
#       exists for the PR
#     · #5433 — the record was, until that change, enforced only by LOCAL tooling
#       (`review-enforcer`, `scripts/atomic-land.sh`, the rail); Mergify merges
#       server-side, so no step on that path ENFORCED it — the check itself ran
#       and read the body, but nothing acted on its conclusion. The entry
#       condition above is the enforcement that closes it.
#   ⛔ The `check-success=ai-review-gate` line in `queue_conditions` IS the
#   server-side enforcement of the review record — removing it silently restores
#   #5433, and the config guard's clause-(iv) agreement (config checks == the record's
#   `required_contexts`) is what keeps it from being removed quietly. Re-read the
#   live branch-protection API before restating whether the check is required.
#   ⚠️ #3091 qualifier: the check is required, its HARNESS
#   (`ai-review-gate-tests`) is not — a PR that weakens the gate is evaluated by
#   the base revision, so it can merge with that harness red-but-unrequired.
merge_protections_settings:
  auto_merge_conditions: true

# NOTE: `batch_size` is deliberately NOT mutated here. Raising it and this
# change are separate levers and separate reviews; PR #5384 owns batch_size.
# Once both land, consider Mergify's DYNAMIC batch sizing
# (`batch_size: {min: 1, max: N}`), which spreads queued PRs across the
# available parallel checks — small batches when the queue is quiet, growing
# toward max only when it backs up.

pull_request_rules:
  - name: queue ready PRs onto main
    conditions:
      - base=main
      - -draft
    actions:
      queue:
        name: main
