# Mergify configuration — the merge queue for `main`.
#
# WHY THIS FILE EXISTS
#   `strict: true` branch protection makes validation a **singleton lock** rather
#   than a property of a tree. A green check certifies exactly one composition —
#   `main ∪ this PR` — so every merge invalidates every other PR's certification,
#   a landed PR must be re-updated, and N merges cost N full CI cycles. Landing
#   becomes serialized at one PR per required-CI duration.
#
#   #3016 (the base race) records Option 1: replace the lock with a queue and
#   stop requiring authors to update their branch. #4798 records the change of
#   route from GitHub's native queue (which needs an organization-owned repo) to
#   this queue (owner ruling 2026-09-24). The queue performs the update itself:
#   it merges the PR onto the current base inside a `mergify/merge-queue/main`
#   branch and runs CI there, so a merge is validated against the tree that will
#   actually exist — while the author does nothing.
#
#   Unlike GitHub's native merge queue, this needs **no workflow changes**: the
#   queue branch produces ordinary `push`/`pull_request` check runs, so no
#   workflow requires a `merge_group:` trigger.
#
# CONFIGURATION CONTRACT — read before editing
#   1. The invariant is over BOTH condition lists, not one:
#        live required contexts == queue_conditions ∪ merge_conditions (checks),
#        each required check named in EXACTLY ONE of the two lists.
#      `queue_conditions` gates ENTRY (evaluated against the PR head);
#      `merge_conditions` gates the MERGE (evaluated against the queue branch).
#      A check named in `merge_conditions` that the queue branch never reports on
#      **deadlocks the queue** for every PR. A required check named in NEITHER
#      list is still known to Mergify — see point 4 — so naming it is not what
#      makes it enforced.
#   2. The live required set is the source of truth:
#        gh api repos/daniel-ospina/tortoise/branches/main/protection \
#          --jq '.required_status_checks.contexts[]'
#      Re-read it when it changes; a stale list is a silent deadlock.
#   3. `check-success` is deliberate, never `check-pending` or `-check-failure`:
#      a skipped or neutral check must not read as a pass.
#   4. ⛔ REMOVING A LINE FROM `queue_conditions` DOES NOT REMOVE IT FROM THE
#      ENTRY GATE. Mergify injects branch-protection rules as conditions itself,
#      and `branch_protection_injection_mode` defaults to `queue` — injected for
#      *queuing and merging*. A required context is therefore an entry condition
#      whether or not this file names it. The entry gate is changed ONLY by
#      `branch_protection_injection_mode` (set on the rule below), never by
#      editing the list.
#
# Last reconciled with the live required set: 2026-09-26
#   queue_conditions (entry) : pricing-artifact, docs, test-isolation,
#                              license-surface, legal-e2e
#   merge_conditions (merge) : python-ci-gate

queue_rules:
  - name: main
    # Entry gate — evaluated against the PR head, before it is queued.
    #
    # The five below are cheap and repo-wide: they run their own workflow bodies
    # in `ci.yml`, and `tools/ci_selection.py` selects legs for the Python suite,
    # not for these. The heavy check is deliberately not listed here — per
    # contract point 4 it would be an entry condition anyway under the default
    # injection mode, which is the treadmill this change removes. It is named in
    # `merge_conditions` below, where it is re-run against the queue branch.
    #
    # Verified: these five report `success` (never `skipped`) across every sampled
    # PR, so `check-success` cannot deadlock entry.
    queue_conditions:
      - base=main
      - -draft
      - check-success=pricing-artifact
      - check-success=docs
      - check-success=test-isolation
      - check-success=license-surface
      - check-success=legal-e2e
    # Re-asserted against the *queue branch*, immediately before the merge.
    # This is the whole point of the queue: the check that gates the merge ran
    # on the tree being merged, not on a stale head.
    #
    # Only the critical-path check is named here, deliberately. A condition here
    # must be a check that actually *reports on the queue branch*; the remaining
    # five required checks are enforced by branch protection on the queue-branch
    # head instead. Adding a check that the queue branch never reports on would
    # block the merge forever — the deadlock this file's contract warns about.
    #
    # ⛔ THE LINE THAT MAKES ENTRY CHEAP IS THIS ONE, NOT THE LIST ABOVE.
    # `queue` (the default) injects every required context as a condition for
    # QUEUING AND MERGING, so deleting a line from `queue_conditions` is a no-op —
    # the check is re-added for us. `merge` injects them for the merge only, so
    # they are checked on the batch, which is the tree that actually lands.
    # Verified live: queue PRs `mergify/merge-queue/<sha>` do report
    # `python-ci-gate`, so naming it here does not deadlock.
    branch_protection_injection_mode: merge
    merge_conditions:
      - check-success=python-ci-gate
    merge_method: squash
    # Speculative batching: PRs that merge cleanly together are tested as one
    # group, so a single CI cycle can certify several merges.
    #
    # Raised 2 -> 4 (2026-09-26). The two observed batch failures were both on a
    # batch of ONE and both caused by main's own red (`test (a)`/`test (b)`), so
    # they say nothing whatever about multi-PR batch size — they are NOT evidence
    # that a larger batch is safe, and an earlier draft of this comment read them
    # as if they were.
    #
    # Sizing: a full CI cycle is ~37 min measured on recent green runs (`test (a)`
    # 36.4 and 37.2 min; `python-ci-gate` ~36.8 min after `changes`), so batch 4
    # sustains ~6.5 merges/hour against batch 2's ~3.2. A failing batch is
    # re-tested bisected, so the COST of a failure grows with the size and that
    # cost is still unmeasured here. Do NOT raise this again until a genuine
    # multi-PR batch failure has been observed and the bisection cost measured.
    batch_size: 4
    batch_max_wait_time: 5 min

pull_request_rules:
  - name: queue ready PRs onto main
    conditions:
      - base=main
      - -draft
    actions:
      queue:
        name: main
