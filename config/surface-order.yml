# config/surface-order.yml — the ordering and keyword-derivation table for the
# agent-facing surface list (#3863).
#
# WHO READS THIS FILE
#   AC13's ordering lint reads it. The expansion gate (`surface-guard`) does NOT:
#   the gate reads `config/surface-manifest.yml` and the declaration.
#
# WHY IT IS A SEPARATE FILE
#   The lint's pass/fail must not be satisfiable by editing the rows it checks.
#   The keyword set, the keyword order and the family ranks live here; the rows
#   live in the manifest; the lint only compares them.
#
# keyword derivation (stated once, implemented in tools/surface_manifest.py):
#   split the tool name on "_", drop the leading "tortoise", take the LEFTMOST
#   token that appears under `tokens:` below; if no token appears, use the first
#   word of the description; else "operate".

# The ten job keywords, in emitted order. The value is the RANK used by the
# sort key — the RANK, not the string: a literal string comparison would sort
# `check` before `create` and place `fetch` fourth inside `memory`.
keywords:
  fetch: 1
  create: 2
  update: 3
  delete: 4
  list: 5
  find: 6
  trace: 7
  check: 8
  link: 9
  operate: 10

# tokens: which name tokens resolve to which keyword. The derivation takes the
# LEFTMOST token of the tool name that appears here. This table is the whole
# rule — a token that is absent from it is as if it were not there, so adding a
# tool whose name carries a new verb means adding a token here, in a reviewed
# change. It is kept separate from `keywords` above because the emitted order
# and the token vocabulary are different decisions: `fetch` sorts first, but the
# token that produces it is `get`.
tokens:
  fetch: [get, recall, search, query, traverse, overview, provenance, stale, belief]
  create: [create, index, ingest, backfill, write, seed, demo, record, capture]
  update: [update, set, promote, calibrate, refresh]
  delete: [delete, invalidate, supersede, retract, prune]
  list: [list, enumerate]
  find: [find, mine, dream, issue, ask, discover]
  trace: [events, timeline, history]
  check: [check, validate, compute, confidence, assess, review, summarize, verify, diagnose]
  link: [operator, mitigate, annotate, action, link, connect]

# family_rank: computed ONCE from the declared family sizes at the cut
# (largest first, ties broken alphabetically), then stored. It is never
# recomputed for recommendations — recomputing it would let a proposed family
# change silently reorder the list.
family_rank:
  memory: 1
  graph: 2
  reasoning: 3
  sessions: 4
  admin: 5
  onboarding: 6
  journal: 7
  sources: 8
  review: 9
  ask: 10
  mining: 11

# The baseline per-keyword distribution. AC13's `distribution agreement`
# property recomputes these counts from the declaration and REDS on any
# difference, so a registry or table edit that moves rows between keywords
# cannot pass silently. To change the surface you update this file and the
# manifest together, in a PR that carries the owner's approval.
#
# THE ONE VALUE THAT IS NOT DERIVED. Everything else in this file FEEDS the
# derivation (the keyword set, the ranks, the token table); this is a FROZEN
# EXPECTATION the derivation's output is compared against. The check REQUIRES it
# and requires one entry per keyword: an empty or partial `baseline_counts` used
# to short-circuit its own comparison (`if baseline and ...`), so deleting the
# table turned the distribution check OFF while every gate stayed green. A change
# to the keyword distribution therefore requires editing the registry AND
# recording the new expectation here.
# #3849: `find` 7 -> 6 — `tortoise_ask` was the removed row (its name token
# `ask` derives `find`), so the removal moves this count and nothing else.
# #3540 ruling B: two per-source switches retired and ONE consolidated tool
# added, so the ADVERTISED set moved by -1, 82 -> 81, while the SERVED set moved
# +1, 98 -> 99 (81 live + 18 retired shims, #3883). The two counts move in
# OPPOSITE directions because a retired name is still SERVED; `served` has a
# precise meaning here, and this table is the ADVERTISED distribution (every row
# is resolved through `TOOL_REGISTRY`, which no retired name is in). Three
# keyword counts moved with the retirement
# (create 18->17, operate 7->6, link 4->5 — `tortoise_manage_sources` derives
# `link`). Recorded deliberately, per the note above: a change to the
# distribution requires editing the registry AND recording the expectation here.
#
# #4282 (the `graph_overview` container, the first of the approved 27): FIVE advertised
# tools retired INTO one container, 81 live -> 77, and three keywords moved with them —
# `list` 9 -> 8 (`tortoise_audit` derives `list`), `check` 8 -> 6 (`summarize_structure`
# and `validate_domain` derive `check`; `tortoise_check_structure` stays live this batch
# and keeps its own row), `find` 6 -> 5 (`dream_health` derives `find`). `fetch` is UNCHANGED at 14: `tortoise_overview` (−1)
# and `tortoise_graph_overview` (+1) both derive it, so the container trades one row for
# another. Every number below is re-derived from the moved registry by
# `tools/surface_manifest.py check`, which reds on any disagreement.
# `tortoise_list_graphs` / `_namespaces` / `_topics` and `tortoise_issue_insight` are NOT
# in this move: `tools/bridge_table.py`'s authored Phase-0.1 map sends them to the
# tenancy block and to `list_knowledge` / `search_knowledge`, so they retire in the batch
# that lands those containers.
#
# #4282 Phase 3.2 (landed on main while this branch was open): FIVE of the seven
# `onboarding_*` tools left the ADVERTISED set, 81 -> 76 (`tortoise_onboarding_state`,
# `_seed`, `_demo_create`, `_github_connect`, `_github_status`) — owner ruling 2026-09-22,
# `run_onboarding` dropped for `check_connection`. They are DELETED rather than retired
# into nothing, so no shim exists to keep serving them (SERVED 99 -> 94); every one of
# their REST routes survives in `tortoise/hosted_api.py`. Moved on ITS base: create
# 17->15, check 8->7, operate 6->5; `list`/`find`/`fetch`/`link`/`update`/`delete`/`trace`
# unmoved.
#
# ⚠️ THE MERGE COMPOSES THE TWO MOVES — NEITHER SIDE'S OWN TABLE IS THE ANSWER. The name
# sets are disjoint, so the merged distribution is both applied to the 81-tool base:
# 72 live (81 − 4 from the container − 5 from Phase 3.2), with create 15 (Phase 3.2's),
# list 8 and find 5 (the container's), check 5 (8 − 2 absorbed by the container − 1 from
# Phase 3.2), operate 5 (Phase 3.2's), and fetch 14 / update 8 / delete 6 / link 4 /
# trace 2 unmoved. Every number below is re-derived from the merged registry by
# `tools/surface_manifest.py check`, which reds on any disagreement — and it is the
# authority here, not this prose.
#
# #11609 batch 1 (the four `REMOVED`-with-no-destination tools): `tortoise_analyze`,
# `tortoise_backfill_v25`, `tortoise_packs_list` and `tortoise_pack_install` left the
# ADVERTISED set, 72 -> 68. They are ARCHIVED, not retired-forward (owner ruling
# 2026-11-12, comment 6831894340: anything outside the approved 27 is removed and its code
# kept only in `archive/`), so no shim serves them and the SERVED set drops by the same
# four. Each removal moves exactly one keyword: create 15->14 (`pack_install`), list
# 8->7 (`packs_list`), find 5->4 (`analyze`), operate 5->4 (`backfill_v25`); fetch /
# update / delete / check / link / trace unmoved. Re-derived from the registry by
# `tools/surface_manifest.py check`, which reds on any disagreement.
baseline_counts:
  fetch: 14
  create: 14
  list: 7
  check: 5
  operate: 4
  update: 8
  find: 4
  delete: 6
  link: 4
  trace: 2
