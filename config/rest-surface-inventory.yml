# Declared inventory of the tenant REST surface (#3875).
#
# WHY THIS FILE EXISTS: the MCP tools and the SDK cannot be expanded without
# human approval (#3863), but the REST surface is a THIRD surface that rule
# never reached. `tortoise/hosted_api.py` imports neither TOOL_REGISTRY nor
# HTTP_ALLOWED, so a new `@app.*` route expands the product's public API while
# every #3863 check stays green. Measured: 7 routes were added between #3875
# being filed and being picked up, and nothing failed.
#
# The CHECK (tests/test_rest_surface_inventory.py) enumerates `@app.*` from
# `tortoise/hosted_api.py` and `tortoise/selfhost_api.py` and fails closed in BOTH
# directions: a live route absent here, and an entry here with no live route.
# It reads the SOURCE, so the check cannot drift from the code — only the
# declarations below are hand-maintained.
#
# classes:
#   tenant        — the public /v1 API. A new one MUST appear here.
#   control-plane — DELIBERATELY outside registry scope; exempt, with a reason.
#   protocol      — path fixed by an external contract (OAuth/RFC 8414/webhook).
