  - id: state_value_carve_out
    name: "verbatim state/operational values — the carve-out a filter MUST carry"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §7, the narrower-than-it-looks carve-out (#2453)
      - docs/architecture/STORAGE-ARCHITECTURE.md       # §7, the two-class retain table
    state: not-implemented
    tracking_issue: 10360
    note: >-
      The MECHANISM is the guarantee: a state value or a decision-relevant
      operational value (a measurement, deadline, threshold/TTL, version or
      count) survives extraction VERBATIM, so any mechanical filter must carry
      the carve-out rather than drop it. ⚠️ The state is `not-implemented` on
      purpose, and naming the halves is the whole point of the row:
      WHAT EXISTS — the prompt-side carve-out, on EVERY path that builds a
      prompt. `STATE_VALUE_CARVE_OUT` (`tortoise/extractor_v2.py`) is rendered
      into S1 (`_granularity_text`), S2/S4 (`_render_master_core_only`,
      `_render_master_verbose`) and — since `#9775` — S2/S4 compact
      (`_render_master_compact`), which appends it and the user-personal-state
      vocabulary it names UNCONDITIONALLY, OUTSIDE its `if story:` gate: the
      compaction rule may drop HINTS (the matched-domain granularity block, the
      story-selected pack sections), never the guarantee. That row used to record
      an ABSENCE here; it now records the rule that keeps the absence from coming
      back. `VALUE_FIDELITY_RULE` rides the S2/S4 `{anti_routine}` slot via
      `_s2s4_rules()` — never S1, never a master render. Pinned, in four places
      because each catches a different insertion: never-S1 by
      `tests/test_extractor_v4_citation_rot.py`; the core-only render
      byte-for-byte by `tests/test_extractor_v2.py`; the `VALUE_FIDELITY_RULE`
      text absent from all three renders by
      `tests/test_v4_declared_mechanisms.py::test_the_value_fidelity_rule_rides_the_s2s4_slot_and_no_master_render`
      (which also asserts the rule still rides `_s2s4_rules()`, so the absence
      cannot pass by vacancy — measured before that test: appending the rule to
      `_render_master_verbose`, the DEFAULT render, shipped a second copy of one
      instruction inside one prompt with every gate green); and — since `#9775` —
      the carve-out and its vocabulary PRESENT, whole, on every render path and
      through both dispatch entry points, by
      `tests/test_v4_declared_mechanisms.py::test_every_render_path_carries_the_carve_out_the_guarantee_requires`,
      exercised over three story shapes (matched, `None`, unmatched) precisely
      because a carve-out appended INSIDE the story gate passes the matched case
      — measured red before that test existed, and the mutation it is written to
      catch is the story-gated variant, not deletion alone.
      ⚠️ Pinned, and NOT read off a comment: the `SEAMS:` comment above
      `SHORT_SESSION_FACT_RULE` belongs to a different constant and names S1 as
      one of ITS seams, so citing it as authority for value-fidelity's never-S1
      would say the opposite of what the row claims.
      ⚠️ PRESENT-IN-A-PROMPT IS NOT THE GUARANTEE, and this row is where the
      distinction is kept. The FILTER side is mechanical
      (`tortoise/value_gate.py::identifier_only` is the SELECTION predicate that
      drops identifier-like residues, `#4899`, and the EMBED gate reuses the same
      rule set — row `embed_gate`), but nothing enforces RETENTION. VERBATIM
      SURVIVAL is prompt-only (`#2453`'s own closing records this; the enforcement
      half is `#10360`) and it is measured SHORT: 38/77 = 49.4% strict verbatim
      survival on the flags-on arm against a 49/90 = 54.4% committed baseline
      (`#5064` comment 2026-10-13, `#7949` E2). A row marked `implemented` would
      make the prompt text read as the guarantee — the exact
      declared-implies-present defect this registry exists to catch.

  - id: atomic_point_write
    name: "an ATOMIC point write — §4.2's FOURTH precondition for the against-store exact dedup"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.2 "The against-store exact dedup has FOUR preconditions"
    state: not-implemented
    tracking_issue: 9879
    note: >-
      The declared requirement, in §4.2's own words: *"`create_point(dedup=True)`
      is a check-then-CREATE, and there is no uniqueness constraint on `Point`.
      Two concurrent writers both see 'absent' and both create. Nothing in the
      current write path closes that window."*
      MEASURED in the code, not quoted from the design: the resolve is
      `SDK._resolve_dedup_hit` → `SDK._find_point_by_content` and the CREATE is a
      separate statement after it; the capture v2 seam does the same and says so
      in its own comment (*"graph-level content-hash resolution … run BEFORE the
      create"*). ⚠️ This is an absent USE, not an absent CAPABILITY in this
      repository: a UNIQUE graph constraint is already created for another label
      (`GRAPH.CONSTRAINT CREATE tortoise_ge_uid UNIQUE NODE GraphEvent`,
      `tortoise/event_store.py`).
      ⚠️ It had NO row and NO tracking issue before this one — the registry's own
      `near_dup_merge` note recorded it as untracked, which is the
      declared-and-absent-with-nobody-tracking shape #5064 exists to make
      visible. `test_the_atomic_write_absence_is_pinned_to_the_schema` reds the
      day a `Point` uniqueness constraint appears in the spellings this repo's
      DDL uses (`CONSTRAINT CREATE` or `CREATE CONSTRAINT`, scanning
      `tortoise/**/*.py`) — so the row cannot quietly outlive its own absence.
      ⚠️ That pin's scope is STATED, not universal: a constraint created outside
      `tortoise/**/*.py` (a script, a migration, a console session) would not be
      seen, a statement ASSEMBLED at runtime is REFUSED as unverifiable rather
      than read as absent — an f-string / `+` / `%` / `.format` / `.format_map` /
      `.join` / `+=`, a statement SPLIT across operands at ANY point — the
      keyword boundary included, since the operands are JOINED in source order
      before the statement is looked for (an `+=` ACCUMULATES: what the target
      already held is joined with the right-hand side, so the two halves of a
      keyword split across the two statements are re-joined rather than read as
      one half), and a half carried by a name is folded
      in too however many bindings it takes (no single literal holds it), with a
      class-body binding resolved under the SAME key the taint rule uses, so the
      two cannot disagree about how a binding is spelled — and a hop the join
      cannot follow at all (a repeated binding on a path, or a chain past its
      runaway cap) is REFUSED as unverifiable whenever a constraint word is
      reachable from it, never read as short; the same shape WITHOUT such a word
      is left alone, because an unresolvable cycle in ordinary string building
      (`url = url + "…"`) is not a constraint question — and any name, attribute,
      subscript or
      tuple target BOUND to an
      incomplete one (`AnnAssign`, walrus, `for` target, a CLASS-BODY binding used
      as `Cls.name` — including a tuple target, a subscript target and a NESTED
      class `Outer.Inner.name`, or a class body that GUARDS its binding with
      `if` / `for` / `try` / `with` — or a collection that mixes a complete
      statement with an incomplete fragment) wherever it is used. What no static
      scan reaches is stated as EXAMPLES rather than as a closed list — a fragment
      whose keyword lives entirely outside the scanned module (handed in by a
      helper or a default argument), a lookup resolved dynamically
      (`globals()["X"]`, `getattr(obj, name)`), and — for a MATCH — whether the
      string is a statement or an explanatory MENTION of the DDL spelling
      (docstrings are skipped; any other string that spells the statement out reds
      and must be reworded). It is the reachable surface the claim lives in, not
      the whole world.

  - id: failure_policy
    name: "per-step FAILURE POLICY (G3) — HOLD the unresolved identity, never assert `new`"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.4 (declared in §4.3 as G3)
    state: not-implemented
    tracking_issue: 5087
    note: >-
      §4.4 states its own status in its closing paragraph: it *"is a SPEC, not a
      description of what runs"*, and the load-bearing instance is S3. The
      declared mechanism is the `HOLD` disposition (invariant I1: an unresolved
      identity is NEVER asserted `new`), the run-level `HOLD` set carried to a
      later run, and the single S3-attach/S5-connect/S6-commit transaction (I3).
      ⚠️ What RUNS is the INVERTED policy, pinned to the code by
      `test_the_failure_policy_absence_is_pinned_to_the_inverted_render`: S3's
      lookup degrades instead of raising (correct, #3679) and the renderer then
      tells the model *"no existing items available; assume everything is new"* —
      the duplication-manufacturing direction G3 names. #5087 (E1) is the code
      half the design itself names, and this row is what makes the absence
      visible instead of assumed.
      ⚠️ NOT registered as one mechanism: §4.4 also gives each of the eight
      steps its own direction and transaction boundary. Those are per-step
      policies of THIS mechanism, not eight more mechanisms, and a row per step
      would turn the registry into a pipeline-step list — the scope line the
      design draws at the head of §4.3 (*"The step list is the SHAPE, not a
      complete specification"*).
