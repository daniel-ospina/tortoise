  - id: sufficiency_router
    name: "sufficiency router + escalation write-back"
    declared_in:
      - docs/architecture/STORAGE-ARCHITECTURE.md  # §12.4 the router, §12.5 the escalation write-back
    state: not-implemented
    tracking_issue: 5009
    pins:
      - tests/test_sufficiency_router.py::TestTheRemainingAbsence::test_nothing_outside_the_router_imports_it
    note: >-
      Escalate on measured INSUFFICIENCY of the assembled evidence, not on query
      type. The DECISION layer landed in `tortoise/sufficiency_router.py`
      (`tests/test_sufficiency_router.py`; §12.5a in
      docs/architecture/STORAGE-ARCHITECTURE.md): a three-state verdict with the
      residency precedence (§17.3), a bounded `serve`/`escalate-tier` trigger
      that takes no query class, and a write-back plan whose units carry their
      span, cannot promote a class and dedupe by identity. ⭐ The write-back's
      ATTRIBUTION LOOP now closes ACROSS calls (§12.5b):
      `plan_writeback(already_written=…)` reports what the cheap tier already
      holds (`already_persisted`) instead of re-minting it, and the STORE's class
      is part of the class-conflict guard. That is the module's side only —
      `unit_key` is what a repeat is recognised BY, and the plan performs no I/O,
      so LOADING that store and WRITING to it are the caller's. §12.5's
      persistence seam is therefore still outside this module, and it is still
      not a writer. ⚠️ The caller owns ONE thing the planner cannot
      check: `already_written` must be loaded FROM the store — a prior plan's
      `units` are not evidence of persistence, and passing them reports a closed
      loop over a unit that was never written. ⚠️ The state stays
      `not-implemented` on purpose: NOTHING ESCALATES YET — no tier walk, no
      Tier-1 store, no read-path caller, and #5009's premise measurement (are
      our queries actually answered badly by a cheap tier?) precedes that
      wiring. ⚠️ WHAT THE PIN COVERS, stated so the `pins:` contract is not read
      as wider than it is: the pin observes the READ-PATH CALLER only — an AST
      scan for a production module that reaches this one. The tier walk and the
      Tier-1 store stay THIS note's claim (a tier walk added inside
      `tortoise/sufficiency_router.py` reds nothing). §12.3's tier count is
      also OPEN (a design fold, not an owner
      ruling). A row marked `implemented` here would recreate the exact
