# Declared v4 write-path mechanisms — the declared set for issue #5064.
#
# WHY THIS FILE EXISTS
# --------------------
# #5064's root, in one sentence: **"The design documents a substrate the code
# does not have."** Extractor v4 declares selection, dedup, merge, span-linkage,
# an embedding gate, a sufficiency router and a fan-out cap as adopted
# decisions. Several had no implementation and no implementing issue, and
# **nothing compared the declared set against the code set — so a declared
# mechanism read exactly like a shipped one.**
#
# This file is the ONE PLACE the declared set lives (#5064 indicator 1). The
# gate is `tests/test_v4_declared_mechanisms.py`:
#
#   state: implemented      -> `code:`, `tests:` and `symbols:` are non-empty,
#                              EVERY declared path exists on disk, every declared
#                              `code:` source is READABLE and parsable (an
#                              unreadable source is a violation, never a silent
#                              skip), and every declared symbol is DEFINED at
#                              module level in the `code:` file(s) this same row
#                              names — where `__all__`/dunders do not count,
#                              because re-exporting a name is not defining it
#   state: not-implemented  -> `tracking_issue:` is present
#
# ⭐ `preconditions:` is the ORDERING (#5064's Verification Checklist: *"a
# mechanism whose precondition is unbuilt cannot be marked implemented"*). It
# names OTHER declared mechanism ids in this same file that must be in place
# first — #5064's refactor direction item 3, *"a precondition (the fan-out cap
# gates deduplication) is ordered in the registry rather than discovered at
# implementation time"*. The field is OPTIONAL (omit it when a mechanism is not
# ordered) and it is declarable on a `not-implemented` row on purpose: that is
# where the ordering matters most, because the absent mechanism records what it
# waits for instead of the next lane meeting a surprise. The gate fails closed
# on an unknown id, a self-reference, a cycle, and an `implemented` row on top
# of a precondition that is not implemented — so an ordering can neither be
# skipped nor satisfied by construction.
#
# ⭐ `symbols:` is the CODE ANCHOR (#5064 indicator (1), the "a code path with a
# test" half). `code:` alone proved a FILE existed, so a mechanism whose symbol
# had been renamed or removed still read as shipped while any `.py` sat at that
# path. Each `implemented` row therefore names the symbol that IS the mechanism.
#
# A row that is **neither** fails the gate (FAIL CLOSED). That is the root
# sentence made checkable: a declared-and-absent mechanism cannot be read as a
# shipped one.
#
# ⚠️ THE DECLARED SET IS NOT READ FROM ONE DESIGN DOCUMENT — and that is part of
# the finding. #4894 (the issue this one names as its dependency, "the v4
# write-path design of record") does **NOT** enumerate these mechanisms; it
# names the raw/narrative-out change and a salience gate, and no list. They are
# declared across a cross-referenced PAIR of documents, not one authority, and
# every row names at least one of them. Four of the original eight name BOTH
# (`near_dup_merge`, `span_link`, `fanout_cap`, `state_value_carve_out`); `vet`
# and `source_dedup` name `EXTRACTOR-V4-ARCHITECTURE.md` only; `embed_gate` names
# `STORAGE-ARCHITECTURE.md` only, plus its policy source in
# `packs/dev/manifest.yaml`; `sufficiency_router` names
# `STORAGE-ARCHITECTURE.md` at two declaration sites (§12.4, §12.5) — counted
# once, because the marker convention is per-document. Each row carries every
# declaring document it knows, and `membership_errors` requires a marker in EACH
# scanned one while refusing a marker in a document the row does not name.
# ⚠️ What it compares is MARKED declarations, and the residual follows from that
# rather than from a list of cases: an UNMARKED prose declaration is invisible in
# every shape — a mechanism declared with no row at all (this issue's own
# starting defect: the design documents it and the gate never sees it), and a
# restatement of a mechanism whose row exists, whether the document is named by
# the row or not. Marking is the convention that makes the comparison possible,
# so the enumeration is only as complete as the reader who writes it — the
# residual the gate's own docstring states.
#
# ⭐ WHAT "MARKED" ACTUALLY BUYS. The gate compares MARKERS, so what it
# enforces is: every declared mechanism the registry knows about carries its
# marker in EACH scanned document its row names, and no scanned document marks a
# mechanism its row omits. Position inside the document is a CONVENTION the gate
# cannot check — prose cannot be parsed for "this paragraph declares the
# mechanism" — so a marker moved away from its declaration while the passage is
# deleted keeps the gate green. Every cited section below carries its marker AT
# the site (re-checked when a row is added or a document is restructured); that
# is a discipline, not a verdict.
#
# ⭐ MEMBERSHIP IS A GATE, NOT A HAND-PINNED TUPLE. The first seven rows came
# from #5064's own O/I/T indicator (1); `state_value_carve_out` came from the
# enumeration #5064's Scope section names as its first deliverable ("enumerate
# every mechanism the v4 design declares") and is recorded on #5064's 2026-10-13
# E2 comment — *"mark the omission explicit in the registry this issue builds"*.
# The five rows after those eight are that enumeration's first real PASS over the
# design's own canonical lists (§4.1's step list, §4.2's four-dedup audit and its
# four-precondition paragraph, §4.4's failure policy) — see the block immediately
# above `mechanisms:`.
# ⚠️ That is the whole point of the exercise: a hand-written list cannot prove it
# is complete, which is how a declared mechanism (this one) stayed unregistered
# while the seven-entry gate stayed green. So every mechanism this registry knows
# about carries a `<!-- v4-mechanism: <id> -->` marker in each scanned document
# (`docs/architecture/**/*.md`, recursive) that its row names, and
# `membership_errors()` in the gate fails closed in BOTH directions — a marker
# with no row, and a row with no marker — AND holds each row to its OWN declared
# documents: every scanned document a row names must carry its marker (a marker
# elsewhere does not stand in for it), a marker in a document the row omits is
# refused, and a row that names NO SCANNED document is refused as unverifiable.
# ⚠️ A row that names no document AT ALL (`declared_in: []`) is a different
# verdict, and it is `gate_errors`' — the shape rule says "declares no declaring
# document" and this membership rule stays SILENT about it, so one defect draws
# one message. Placement INSIDE the
# document is the convention described above, which the gate cannot read. See the
# gate's docstring for the rule and its stated limits.
#
# ⚠️ ONE DECLARING SOURCE IS OUTSIDE THE GATE'S SCANNED SURFACE, and it is named
# here rather than assumed covered: `packs/dev/manifest.yaml` (`embed_gate`'s
# policy source) is YAML, and the marker convention is a markdown-comment
# convention over `docs/architecture/**/*.md`. A row that declares such a source
# must ALSO declare a scanned document carrying its marker — `membership_errors`
# refuses a row whose every declaring document is outside the surface, because
# an unfindable declaration must not read as a marked one. So the "every
# declaring source" claim covers the DOCUMENTS; the pack's own declaration site
# is checked by nobody and is listed here so that limit is legible.
#
# ⛔ NOT IN SCOPE — the substrate refactor, any change to the extraction/write
# path, and indicator (2)'s "generate the design document from the registry"
# (#5064's open question (a), registry-as-source vs registry-as-check). The full
# non-scope note is stated once, in the gate's own docstring —
# `tests/test_v4_declared_mechanisms.py` — so the two cannot drift.
#
# Mapping to #5064's own symptom table: #5005 vet · #5012 source dedup ·
# #5006 near-dup MERGE · #5007 span link · #5008 embed gate · #5009 sufficiency
# router · #5010 fan-out cap · #2453 the verbatim state-value carve-out
# (`state_value_carve_out`; #5064's Verification Checklist names it as one of
# the three write-path behaviours to verify, and its omission from the compact
# render is tracked at #9775).

version: 1

# The declared set is CLOSED, and it is in PIPELINE ORDER: the tuple below is
# pinned, so a mechanism can neither be silently dropped from nor reordered
# within the registry without the gate saying so.
#
# ⭐ IT GREW FROM EIGHT TO THIRTEEN BY READING THE DESIGN'S OWN ENUMERATIONS, and
# that is the enumeration deliverable (#5064 Scope: *"enumerate every mechanism
# the v4 design declares and classify each as built / unbuilt / descriptive —
# this enumeration does not exist and is the first deliverable of Scope"*). The
# eight came from the issue's O/I/T indicator (1) plus the carve-out; the five
# added here were declared by a canonical ENUMERATION in
# `EXTRACTOR-V4-ARCHITECTURE.md` and had no row:
#
#   - §4.1's step list / §4.2's "resulting order" block declare `S2.2a-α EXACT
#     DEDUP` and `S2.2a-β NEAR-DUP DETECT` as steps with a named rule; the
#     registry carried only the FUSION (`near_dup_merge`), so the DETECT half —
#     the one that runs BEFORE the gate — had no verdict at all;
#   - §4.2's FOUR-DEDUP AUDIT table (`D-a`..`D-d`) is a four-row enumeration of
#     mechanisms; only `D-a` (source) had a row. `D-b`/`D-c` are one mechanism at
#     two keys (`exact_dedup`), `D-d` is another (`against_priors_consolidation`),
#     and the gate now compares that table to the registry structurally
#     (`test_the_four_audited_dedups_each_have_a_row`) so a FIFTH audited dedup
#     cannot arrive without a row;
#   - §4.2's "the against-store exact dedup has FOUR preconditions" paragraph
#     declares the fourth — an ATOMIC write — and says it does not exist. It had
#     no row and no tracking issue anywhere; it is now `atomic_point_write`
#     (#9879);
#   - §4.3 G3 / §4.4 declare the per-step FAILURE POLICY, and §4.4 states its own
#     status (*"a SPEC, not a description of what runs"*): `failure_policy`,
#     `not-implemented`, pointing at the epic the design itself names.
#
# ⚠️ WHAT THIS ENUMERATION IS NOT: it is not a claim that these thirteen are
# every mechanism either document names. It is the set that carries a MARKER (see
# the limits above) plus the one structure this file can compare mechanically
# (§4.2's table). A mechanism declared only in unmarked prose is still invisible;
# the markers are the convention that makes the comparison possible, and adding a
# row is how a lane that FINDS such a declaration makes it visible from then on.
mechanisms:
  - id: vet
    name: "S2.2 VET — adversarial candidate review (validity + coverage)"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §S2.2; decision D5
    state: implemented
    code:
      - tortoise/vet_gate.py
      - tortoise/extractor_v2.py
    tests:
      - tests/test_vet_gate_5005.py
    symbols:
      - check_batch
    note: >-
      Flag-gated (`TORTOISE_VET`), off by default — the gate is off-path until
      the flag says otherwise.

  - id: source_dedup
    name: "S0a NORMALIZE + HASH → S0b SOURCE DEDUP"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.2
    state: implemented
    code:
      - tortoise/source_identity.py
    tests:
      - tests/test_source_dedup_registration.py
    symbols:
      - normalize_source_url
      - source_identity
    note: >-
      S0b resolves an inbound spelling to the `:Source` node that owns its
      identity; dedup was URL-keyed only before this.

  - id: exact_dedup
    name: "S2.2a-α EXACT DEDUP — within-batch/capture exact + against-store content hash"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.1 the step list; §4.2 D-b/D-c in the four-dedup audit
    state: implemented
    code:
      - tortoise/dedup_classify.py
    tests:
      - tests/test_capture_phase_d_dedup.py
    symbols:
      - exact_hit_id
    note: >-
      `D-b` (within-batch, and the capture seam's in-capture repeats) and `D-c`
      (against-store, raw content hash) are ONE declared mechanism at two keys —
      §4.2 audits them as two rows of its four-dedup table and lists them as one
      step, `S2.2a-α EXACT DEDUP … within-batch + against-store`.
      `exact_hit_id` is the in-capture leg: a byte-level `content_hash` dict
      lookup over the claims the run already accepted (its docstring records why
      it is deliberately NOT normalized-fuzzy — a fabricated hit is worse than a
      miss). The against-store leg is `sdk._find_point_by_content` via
      `_resolve_dedup_hit`, which is a METHOD, so it cannot be a `symbols:`
      anchor (the anchor resolves module-level names); the row names it here
      instead of leaving it implied.
      ⚠️ `implemented` does NOT mean the mechanism is CLOSED. §4.2 states the
      against-store exact dedup has FOUR preconditions and that the FOURTH — an
      ATOMIC write — does not exist. That precondition is its OWN row
      (`atomic_point_write`, `not-implemented`), and it is deliberately NOT a
      `preconditions:` edge on this one: the edge would force this row to
      `not-implemented` and so record `D-b`/`D-c` — which exist, with tests — as
      absent, which is the misreport this registry exists to prevent.
      ⚠️ The capture seam's paraphrase leg is scoped separately and is NOT read
      as closed here: it enforces the BOUNDARY half of D12/O4 only, and the seam
      that consumes a hit DETACH-DELETEs the folded node's `aboutObject` —
      measured, tracked at #9437.

  - id: near_dup_detect
    name: "S2.2a-β NEAR-DUP DETECT — the pair + the §16.4 never-across guard (NO fusion)"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.2 constraint 2's three-operation table; §4.1 the step list
    state: implemented
    code:
      - tortoise/extractor_v2.py
    tests:
      - tests/test_never_across_fold_5080.py
    symbols:
      - _boundary
    note: >-
      §4.2 splits ONE concern across THREE sites and says no operation has two
      homes: DETECT the pair and apply the never-across guard (`_boundary`,
      S2.2a-β, mechanical — this row) · record the VERDICT `MERGE` for a pair
      that survives it (`vet_gate.OUTCOMES`, S2.2b — row `vet`) · execute the
      FUSION (row `near_dup_merge`, S3).
      ⚠️ Before this row the registry carried only the FUSION, so the mechanical
      half had NO verdict in the checked set — and it is the half that runs
      BEFORE the gate, which is what makes "dedup before the gate" and "a fusion
      never precedes the gate" compatible rather than contradictory (§4.2
      constraint 2). A refused-merge mechanism whose DETECT step is unregistered
      reads as if the guard were part of the fusion.

  - id: near_dup_merge
    name: "near-duplicate MERGE (Jev-arbitrated, D12/O4)"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §16.4; decision D12
      - docs/architecture/STORAGE-ARCHITECTURE.md       # §14.1 O4, the owner ruling
    state: implemented
    code:
      - tortoise/near_dup_merge.py
      - tortoise/extractor_v2.py
    tests:
      - tests/test_near_dup_merge_5006.py
    symbols:
      - near_dup_merge
      - apply_merge_union
    # #5010 as #5064 summarises it: the adopted fan-out cap has no
    # implementation "and it is the precondition for ever deduplicating" —
    # and #5064's refactor direction names this same pair as the ordering
    # example, so it is declared rather than discovered when #5006 is picked up.
    preconditions:
      - fanout_cap
    note: >-
      The FUSION the design places at S3, after the gate. §4.2 splits the
      near-duplicate concern across three sites and says no operation has two
      homes: DETECT the pair (`_boundary`, S2.2a-β, mechanical), record the
      VERDICT (`vet_gate.OUTCOMES`' `MERGE`, S2.2b, the arbiter), execute the
      FUSION (`near_dup_merge` + `apply_merge_union`, S3). Before #5006 the
      third had no implementation and the verdict had no consumer.
      ⚠️ `implemented` does NOT mean "always on": the fusion fires only for a
      candidate S2.2b recorded a `MERGE` verdict for, so with no arbiter
      injected it is INERT — the same honest, injected-seam posture VET itself
      ships with. The mechanical ladder (the §16.4 never-across guard, the
      ~0.95 bar, a readable union) re-checks every pair inside the mechanism:
      the verdict is necessary and never sufficient, and a refused pair falls
      through to ADD with both claims surviving.
      ⚠️ The OTHER half of the ordering is still not a row here and is NOT
      silently assumed: the against-store exact dedup's fourth precondition —
      an ATOMIC write (`create_point(dedup=True)` is a check-then-CREATE with
      no uniqueness constraint on `Point`; EXTRACTOR-V4-ARCHITECTURE.md §4.2) —
      is unimplemented and has no registry row and no tracking issue in this
      closed set — it NOW HAS BOTH: row `atomic_point_write` (#9879).

  - id: against_priors_consolidation
    name: "S3 / D-d — the against-priors consolidation classifier (ADD · UPDATE · NOOP · DELETE)"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.2 D-d in the four-dedup audit; the classify_consolidation paragraphs
    state: implemented
    code:
      - tortoise/extractor_v2.py
    tests:
      - tests/test_consolidation_4way.py
    symbols:
      - classify_consolidation
    preconditions:
      - exact_dedup
    note: >-
      `D-d` is the FOURTH of §4.2's four audited dedups and the only one that
      needs the graph (constraint 5: against-priors consolidation needs the
      lookup), so it stays after S3 while `exact_dedup` may run first — which is
      exactly the order declared above, and why `exact_dedup` is this row's
      precondition rather than its successor.
      ⚠️ It is a DIFFERENT mechanism from `near_dup_merge`, not a second home for
      the same one: this classifier DECIDES a candidate's disposition against its
      priors (no LLM, no graph I/O, unit-testable in isolation); the fusion
      EXECUTES one `MERGE` verdict the VET arbiter recorded.

  - id: span_link
    name: "verbatim SPAN link on every Point (an address, not a payload)"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §2.4.1
      - docs/architecture/STORAGE-ARCHITECTURE.md       # §9.4
    state: implemented
    code:
      - tortoise/commit_schema.py
    tests:
      - tests/test_verbatim_span.py
    symbols:
      - validate_span
    note: >-
      `source_turn_id` + `span_start`/`span_end` character offsets into the
      `Source`; the span TEXT is never stored on the `Point`.

  - id: embed_gate
    name: "EMBED gate — which written rows earn a vector"
    declared_in:
      - packs/dev/manifest.yaml  # ontology.memory_granularity — the POLICY source
      - docs/architecture/STORAGE-ARCHITECTURE.md  # §12.2a — where the gate is specified
    state: implemented
    code:
      - tortoise/embed_gate.py       # the predicate — its rule set IS value_gate.RULES
      - tortoise/embeddings.py       # `encode_for_row` — the submission seam
      - tortoise/projection/entities.py  # the entity/Event/Document/Point writers
    tests:
      - tests/test_embed_gate_5008.py
    symbols:
      - embedding_verdict
    note: >-
      Two gates on one policy: the SELECTION sibling is the identifier-only
      DISCARD predicate (`tortoise/value_gate.py`, #4899); this is the
      EMBEDDING gate (EMBED / NO-EMBED on a written row), which reuses that same
      rule set rather than deriving a second one (§12.2a). Flag-gated
      (`TORTOISE_EMBED_GATE`), off by default — the graph is unchanged until the
      rate effect is measured, which is what #5008 asks for. A vector, once
      written, is paid for permanently — FalkorDB Cloud bills provisioned RAM,
      no eviction. NOT implemented here and named as such: §12.2a's per-kind
      override block (no pack slot; no caller at the submission step holds the
      brief) and reaping vectors already written (#4997).

  - id: sufficiency_router
    name: "sufficiency router + escalation write-back"
    declared_in:
      - docs/architecture/STORAGE-ARCHITECTURE.md  # §12.4 the router, §12.5 the escalation write-back
    state: not-implemented
    tracking_issue: 5009
    note: >-
      Escalate on measured INSUFFICIENCY of the assembled evidence, not on query
      type. The DECISION layer landed in `tortoise/sufficiency_router.py`
      (`tests/test_sufficiency_router.py`; §12.5a in
      docs/architecture/STORAGE-ARCHITECTURE.md): a three-state verdict with the
      residency precedence (§17.3), a bounded `serve`/`escalate-tier` trigger
      that takes no query class, and a write-back plan whose units carry their
      span, cannot promote a class and dedupe by identity. ⚠️ The state stays
      `not-implemented` on purpose: NOTHING ESCALATES YET — no tier walk, no
      Tier-1 store, no read-path caller, and #5009's premise measurement (are
      our queries actually answered badly by a cheap tier?) precedes that
      wiring. §12.3's tier count is also OPEN (a design fold, not an owner
      ruling). A row marked `implemented` here would recreate the exact
      declared-implies-present defect this registry exists to catch.

  - id: fanout_cap
    name: "connection fan-out cap (200)"
    declared_in:
      - docs/architecture/STORAGE-ARCHITECTURE.md       # §11.5, the hub measurement
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §13.8 "the cap is the design" (§15 restates the answer)
    state: implemented
    code:
      - tortoise/fanout.py
    tests:
      - tests/test_fanout_cap.py
    symbols:
      - PER_ENTITY_FANOUT_CAP
      - bounded_fanout
    note: >-
      `PER_ENTITY_FANOUT_CAP = 200` (owner, 2026-09-23), consumed by the
      assembly slices.

  - id: state_value_carve_out
    name: "verbatim state/operational values — the carve-out a filter MUST carry"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §7, the narrower-than-it-looks carve-out (#2453)
      - docs/architecture/STORAGE-ARCHITECTURE.md       # §7, the two-class retain table
    state: not-implemented
    tracking_issue: 9775
    note: >-
      The MECHANISM is the guarantee: a state value or a decision-relevant
      operational value (a measurement, deadline, threshold/TTL, version or
      count) survives extraction VERBATIM, so any mechanical filter must carry
      the carve-out rather than drop it. ⚠️ The state is `not-implemented` on
      purpose, and naming the halves is the whole point of the row:
      WHAT EXISTS — the prompt-side carve-out. `STATE_VALUE_CARVE_OUT`
      (`tortoise/extractor_v2.py`) is rendered into S1 (`_granularity_text`) and
      S2/S4 (`_render_master_core_only`, `_render_master_verbose`), and
      `VALUE_FIDELITY_RULE` rides the S2/S4 `{anti_routine}` slot via
      `_s2s4_rules()` — never S1, never the master render (a code fact the
      `SEAMS:` comment above `SHORT_SESSION_FACT_RULE` states;
      `tests/test_extractor_v4_citation_rot.py` pins the never-S1 half, and
      `tests/test_extractor_v2.py` pins the render). The FILTER side is
      mechanical and is NOT what this row records as absent:
      `tortoise/value_gate.py::identifier_only` is the SELECTION predicate
      that drops identifier-like residues (`#4899`), and the EMBED gate reuses
      the same rule set (row `embed_gate`). WHAT DOES NOT — (a) there is no
      mechanical enforcement of the GUARANTEE: VERBATIM SURVIVAL is prompt-only
      (#2453's own closing records this), and the strict-verbatim measurement is
      38/77 = 49.4% on the flags-on arm against a 49/90 = 54.4% committed
      baseline (#5064 comment 2026-10-13, #7949 E2);
      (b) `_render_master_compact` — selected by the documented
      `TORTOISE_EXTRACTOR_PROMPT=compact` opt-in — appends no
      `STATE_VALUE_CARVE_OUT` at all, so one render path silently drops the
      guarantee. ⚠️ The omission is MEASURED, not read off a comment: the
      comment above the compact render's hint blocks
      (`tortoise/extractor_v2.py:1162`) only excludes them from the SHUFFLE
      ("only the kind vocabulary randomizes") and then emits a FILTERED
      `MEMORY GRANULARITY` block, so it neither says nor implies that the
      carve-out is dropped —
      `test_the_compact_render_omits_the_carve_out_the_row_records` is the
      evidence, and the code comment that would say why does not exist yet. ⚠️ The row records the OMISSION,
      not a justification for it: whether the compact render is deliberately out
      of the carve-out's scope is #9775's decision, and the code-side comment
      that decision would need does not exist yet — do not read "deliberately"
      into this row. A row marked `implemented`
      would make the prompt text read as the guarantee — the exact
      declared-implies-present defect this registry exists to catch.

  - id: atomic_point_write
    name: "an ATOMIC point write — §4.2's FOURTH precondition for the against-store exact dedup"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.2 "The against-store exact dedup has FOUR preconditions"
    state: not-implemented
    tracking_issue: 9879
    note: >-
      The declared requirement, in §4.2's own words: *"`create_point(dedup=True)`
      is a check-then-CREATE, and there is no uniqueness constraint on `Point`.
      Two concurrent writers both see \"absent\" and both create. Nothing in the
      current write path closes that window."*
      MEASURED in the code, not quoted from the design: the resolve is
      `SDK._resolve_dedup_hit` → `SDK._find_point_by_content` and the CREATE is a
      separate statement after it; the capture v2 seam does the same and says so
      in its own comment (*"graph-level content-hash resolution … run BEFORE the
      create"*). ⚠️ This is an absent USE, not an absent CAPABILITY in this
      repository: a UNIQUE graph constraint is already created for another label
      (`GRAPH.CONSTRAINT CREATE tortoise_ge_uid UNIQUE NODE GraphEvent`,
      `tortoise/event_store.py`).
      ⚠️ It had NO row and NO tracking issue before this one — the registry's own
      `near_dup_merge` note recorded it as untracked, which is the
      declared-and-absent-with-nobody-tracking shape #5064 exists to make
      visible. `test_the_atomic_write_absence_is_pinned_to_the_schema` reds the
      day a `Point` uniqueness constraint is added, so the row cannot quietly
      outlive its own absence.

  - id: failure_policy
    name: "per-step FAILURE POLICY (G3) — HOLD the unresolved identity, never assert `new`"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.4 (declared in §4.3 as G3)
    state: not-implemented
    tracking_issue: 5087
    note: >-
      §4.4 states its own status in its closing paragraph: it *"is a SPEC, not a
      description of what runs"*, and the load-bearing instance is S3. The
      declared mechanism is the `HOLD` disposition (invariant I1: an unresolved
      identity is NEVER asserted `new`), the run-level `HOLD` set carried to a
      later run, and the single S3-attach/S5-connect/S6-commit transaction (I3).
      ⚠️ What RUNS is the INVERTED policy, pinned to the code by
      `test_the_failure_policy_absence_is_pinned_to_the_inverted_render`: S3's
      lookup degrades instead of raising (correct, #3679) and the renderer then
      tells the model *"no existing items available; assume everything is new"* —
      the duplication-manufacturing direction G3 names. #5087 (E1) is the code
      half the design itself names, and this row is what makes the absence
      visible instead of assumed.
      ⚠️ NOT registered as one mechanism: §4.4 also gives each of the eight
      steps its own direction and transaction boundary. Those are per-step
      policies of THIS mechanism, not eight more mechanisms, and a row per step
      would turn the registry into a pipeline-step list — the scope line the
      design draws in §4.0 (*"The step list is the SHAPE, not a complete
      specification"*).
