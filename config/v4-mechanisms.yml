      widening it would re-admit the real `20k`/`20mi` unit rewrite it exists to
      stop. The completion makes that pre-existing refusal SPELLING-UNIFORM for
      `mi`/`s`/`min`/`ms`; the census is blind to it (`\b\d+k\s+[A-Za-z]`
      → 0 hits), so `refused=0` says nothing about this class.
      Still NOT caught, and named rather than implied: `M`/`m`
      carries the same prefix-vs-unit collision one letter over while
      `_value_core` lowercases the suffix, so an uppercase `M`
      (millions) is read as metres — widening the set to `m` would cost the real
      `20m`/`20km` rewrite detection, so it is a residual with a stated trade,
      not a silent gap. Pinned by
      `tests/test_state_value_verbatim_10360.py::test_a_bare_magnitude_prefix_is_tolerated_only_against_a_DIFFERENT_unit`
      and by the battery's `magnitude prefix vs unit` / `magnitude prefix vs
      scaled` / `magnitude rewritten` / `magnitude number moved` / `magnitude
      number moved 2` / `magnitude sign dropped` rows.
      ⛔ **OVERRIDES (the recorded decision this row departs from, stated so the
      next reader does not tidy it away):** `tortoise/value_normalizer.py`'s
      #2817 ruling that NO magnitude table ships — `k`/`M`/`MM`/`mil`/`milhão`
      dropped as a class, on the ground that "a second interpretation of the same
      token is how a third opinion gets invented". This row reads `k` as x1000
      (`_MAGNITUDE_FACTORS`) IN THIS SEAM ONLY, because #2817 governs the money
      DERIVATION — a magnitude word must not silently scale an amount — while
      here `k` is already a unit identity in `_UNIT_EQUIV`, and without the
      factor the rule refuses `5k QPS` against `5000 QPS`: a truthful point
      withheld over a spelling, the false-accusation direction this rule must
      never take. `value_normalizer`'s money path is untouched and keeps its
      ruling pinned. Recorded as a comment on #10360 so the departure is
      findable where the decision lives, and reversible by the owner.
      (j) A VERSION'S TRAILING ZERO IS FORM, not value — `2.10`/`2.1` and
      `1.10.0`/`1.1.0` fold, because the same unconditional strip is what makes
      `4.20`/`4.2` one value, and splitting it by "does this look like a
      version" would re-open that false refusal on every two-group decimal. For
      a release number this is a real difference that passes, so it is stated
      rather than implied; a version's NON-zero groups are still judged
      (`2.10`/`2.11` refuses). Pinned by
      `test_a_version_trailing_zero_is_FORM_today_and_that_is_stated`.
      (k) A DASH **ATTACHED** TO THE NUMERAL IS A SIGN IN EVERY SPELLING, WHICH
      OVER-READS A BULLET GLYPH (#10513 review cycle-11 advisory, measured).
      ⚠️ This arm is NOT local to this rule: `_keeps_numeric_edge` feeds
      `_leading_symbol_run` -> `_strip_edges` -> `_guard_token_seq` ->
      `_value_bindings`, whose OTHER consumers are the against-store fold path
      (`distinguishing_difference` / `fold_allowed` / `supersede_allowed`,
      pinned by `tests/test_never_across_fold_5080.py`), so the dash family is
      now one minus there too. Direction is the safe one — `-5`/`–5`/`-5` agree,
      so a truthful point is no longer dropped over a typographic minus — with
      one measured over-read: an em dash written FLUSH against the numeral
      (`—5 minutes`, punctuation used as a bullet glyph) reads as minus, so a
      bulleted content line against an unbulleted quote diverges as a dropped
      sign and is REFUSED. A SPACED dash (`— 5 minutes`) and `• 5 minutes` are
      still decoration and agree. Named rather than fixed: telling a bullet from
      a minus means judging the glyph's context, the same form-vs-value guess
      that re-opened the `800millis`/`800ms` false refusal (cycle 3), and the
      direction here is safe (an over-read WITHHOLDS a point and reports it; it
      never writes a rewritten value). Pinned by
      `test_a_dash_attached_to_the_numeral_is_a_sign_and_the_bullet_glyph_shape_is_stated`,
      so a future lane that narrows it has to move this row.
      (l) A SEPARATOR-BEARING NUMERAL IS NEVER JUDGED, AND THAT IS A MEASURED
      PRECISION LOSS, not an oversight (#10513 review cycle 12 P1). (ii-bis)
      puts `1,200`/`4,2`/`1.234`/`1,234.56` outside the judged set because the
      reading needs a LOCALE, so a REAL thousands rewrite is unjudged too:
      `we saw 5,000 QPS` against `we saw 6,000 QPS` returns no divergence
      (pinned by `test_a_separator_bearing_number_is_outside_the_judged_set`, so
      a future lane that adds a separator rung has to move this row). ⛔ THAT CUTS
      BOTH WAYS AND COSTS THE (i) MAGNITUDE CASE TOO (review cycle-13 P2,
      measured): `5k` against `6,000` is unjudged as well, because only one side
      needs the separator to be read — so "a magnitude rewrite is always judged"
      is true only for an UNGROUPED spelling (`5k`/`6000`). The trade
      is deliberate and is the one #2817 point 1 already made: a separator rung
      has to GUESS the locale, and the guess the previous revision made refused
      truthful points written the other way round — withholding a durable memory
      over a spelling, the false-accusation direction this carve-out must never
      take. Precision over recall, in the direction that keeps memories. NAMED,
      not fixed: closing it means parsing with a declared locale, which is
      `value_normalizer`'s OWN territory and needs the owner's decision reopened
      there, never a rung bolted onto this seam.
      (m) A **SCALE WORD** IS NOT JUDGED (#10513 review cycle-13 P2, measured).
      `_value_bindings` fuses no magnitude word — `million`/`billion`/`thousand`
      are ignored — so both sides bind the SAME core and a 10^3..10^9 rewrite is
      written as verbatim: `we have 12 million events` against
      `we have 12 billion events` returns NO divergence, likewise `5 million`
      against `5 thousand` and `12 million` against `12` (pinned by
      `test_a_scale_WORD_rewrite_is_unjudged_because_the_engine_fuses_none`).
      ⛔ A DIFFERENT CLASS from (d): (d) is a RATE unit with no number adjacent
      (or a unit SPELLING the tables lack), this
      is a MAGNITUDE the engine never multiplies, so closing it belongs in
      `_value_bindings` and would be its own change; a second scale reading inside
      this seam is the parallel-classifier shape the review P2 rejected. Stated
      rather than absorbed, and pinned so closing it has to move this row.
      (m2) THE SCALE IS COMPARED ACROSS THE PAIR, SO A FORM-ONLY SCALE DIFFERENCE
      FAILS OPEN (#10513 review cycle-18 P2, measured). (m) above records that the
      engine fuses no magnitude word; the consequence runs in BOTH directions and
      only one was disclosed. `12 million` against `13 million` carries the SAME
      scale on both sides, so the scale cancels and the digits are still judged —
      a real rewrite, refused. `12 million` against `12000000` does NOT: the two
      sides bind different scales (`12` against `12000000`), so the pair is
      UNJUDGEABLE and fails OPEN. Before this the pair was REFUSED, withholding a
      truthful point — "we have 12000000 events" against "we have 12 million
      events" is ONE value in two forms, the same tolerance this seam applies to
      a unit it cannot read (`800millis` against `800ms`). Reading a scale is
      `value_normalizer`'s territory and
      #2817's "no magnitude table" ruling is NOT reopened here (the `OVERRIDES:`
      on #10360 covers the `k` unit identity only), so the class is outside the
      judged set rather than scaled. The scale is COMPARED, not dropped: a
      first attempt at this fix dropped every scale-bearing slot and silently
      lost the `12 million`/`13 million` rewrite, which
      `test_a_SCALE_word_is_compared_across_the_pair_rather_than_dropped` (and
      `test_a_scale_WORD_rewrite_is_unjudged_because_the_engine_fuses_none` from
      the other side) pins.
      (n2) THE SINGLE-TOKEN HARD FALLBACK STILL TRUNCATES, AND THE PAIR IS NOT
      JUDGED (#10513 review cycle-18 P1, measured). `_write_span` can only cut at
      a TOKEN boundary; when a side is ONE whitespace-free token longer than its
      cap (`_MAX_CONTENT`/`_MAX_QUOTE`) there is none, so it falls back to the
      hard `s[:cap]` prefix. Two consequences, both stated:
      (a) the WRITE PATH does NOT judge that pair. It did, and the module's own
      truncation then accused the model: measured, content
      `"z"*998 + "4.2 seconds"` against quote `"4.2 seconds"` — a TRUTHFUL point —
      was REFUSED with `point says '4', quote says '4.2'`, and the mirror refused
      `4.25` against a `4` read out of the quote. The fail-open is NAMED in the
      run's warnings, never silent (#9906). Pinned by
      `test_a_HARD_CUT_pair_is_not_judged_because_the_cut_can_read_a_value_short`,
      whose positive control is that an ordinary pair is still refused on a real
      rewrite.
      (b) the MINT and the WRITE keep storing the truncated prefix. That is
      deliberate and is the residual: `test_quote_capped_at_200` pins the cap for
      a single-token quote, dropping an over-cap single-token CONTENT would drop
      the whole point, and refusing the mint would LOSE the operator edge (#2552
      pins that an over-long ref still resolves). So a value inside such a token
      may be stored truncated; the alternative costs a durable memory or an edge,
      and both are worse.
      (o) A CURRENCY SYMBOL NO LONGER SWALLOWS THE SIGN, AND A PAREN-WRAPPED
      NUMERAL IS OUTSIDE THE JUDGED SET (#10513 review cycle-18 P2, measured).
      `_value_core` read the sign from `raw.lstrip()[0]`, so a leading `Sc`/`Sm`
      decoration ate it in BOTH directions: `_value_core("$-4")` returned
      `('', '4', None)`, which REFUSED `$-4` against `-4` (one value, two
      spellings) while WRITING `$-4` against `$4` (a sign the model dropped) with
      no warning. The sign is now read from the first sign-bearing character after
      that decoration run, in the ONE predicate `_reads_as_sign` that
      `_keeps_numeric_edge` already admitted the edge with. Separately, `($4)` is
      `-4` in accounting and a prose aside in a sentence, and WHICH ONE APPLIES IS
      A READER PROPERTY this path does not have — the same reason (l)'s
      separator is unjudged and the same doctrine (#2817 point 1: never invent a
      second reading of one token). Reading it as POSITIVE refused
      `"the shortfall was ($4)"` against `"the shortfall was -4"`; the raw text is
      now asked, and the exclusion is the accounting SHAPE only, so a prose
      `(see 2019)` keeps its slot and a rewrite in that text is still refused.
      ⛔ THE FIRST CUT OF THAT PATTERN WAS WIDER THAN THIS SENTENCE CLAIMED
      (#10513 review cycle-20 P2, measured): every element was optional, so it
      matched a BARE parenthetical numeral too and `the audit (2019) says 12
      events` became wholly unjudgeable — the `12` -> `13` rewrite in that text
      was NOT refused, in the DETECTION direction, while this row and the code's
      own note said "the accounting SHAPE only". The accounting reading has to be
      AVAILABLE before a token can be ambiguous, so the class now REQUIRES one of
      the three things that make it so — a currency symbol, an explicit sign, or
      an inner separator — and `_value_core`'s wrapped-token arm asks the SAME
      pattern instead of the wider `startswith("(")` it used, because two rules
      for one question is how the wider one survives. `(2019)`, `(1)` and
      `(see 2019)` keep their slots; `($4)`, `(-4)`, `(4.2)` and `(1,200)` do not.
      The cost, stated: a real rewrite between TWO accounting numerals
      (`($4)` against `($6)`) is unjudged, because either side alone takes the
      pair out of the judged set. Pinned both ways by
      `test_a_currency_symbol_does_not_swallow_the_SIGN`,
      `test_an_accounting_PAREN_numeral_is_outside_the_judged_set` and
      `test_a_BARE_parenthetical_numeral_is_still_judged`.
      (n) A NUMERAL SPLIT AT THE CAP MOVES THE STORED TEXT OFF THE LEGACY KEY
      (#10513 review cycle-18 P1, measured). The `_MAX_CONTENT` sites store
      `x[:1000]` — the identity key `_endpoint_keys`, `_merge_verdict_keys` and
      `classify_consolidation` all compute, and the spelling every point already
      in the graph carries — EXCEPT when that cut would truncate a NUMERAL, where
      the split token is dropped whole (`… p95 hit ` instead of `… p95 hit 4`)
      because a stored `4` where the source wrote `4.0` is a value the graph never
      stated. The cost, STATED rather than absorbed: a point stored BEFORE this
      change carries the hard-clipped spelling, so a re-extraction of that same
      over-cap claim whose cut splits a numeral keys apart from the legacy row and
      ADDs a near-duplicate instead of folding (the same trade `_endpoint_keys`
      states for prefix matching, tracked on #5069). Non-vacuous both ways:
      `test_the_stored_content_IS_the_identity_key_a_verdict_and_a_prior_key_on`
      pins the identity for every non-numeral cut AND the numeral exception, and
      the two `core` end-to-end pins that redded on the unconditional
      word-boundary cut
      (`test_a_verdict_on_a_candidate_over_the_cap_still_merges`,
      `test_content_only_closure_collision_does_not_over_prune`) are green.
      THE RENDER HALF is unchanged and stays pinned where #9775 left it.
      `STATE_VALUE_CARVE_OUT` (`tortoise/extractor_v2.py`) is rendered into S1
      (`_granularity_text`), S2/S4 (`_render_master_core_only`,
      `_render_master_verbose`) and S2/S4 compact (`_render_master_compact`),
      which appends it UNCONDITIONALLY, OUTSIDE its `if story:` gate: the
      compaction rule may drop HINTS (the matched-domain granularity block, the
      story-selected pack sections), never the guarantee. `VALUE_FIDELITY_RULE`
      rides the S2/S4 `{anti_routine}` slot via `_s2s4_rules()` — never S1,
      never a master render. Pinned, in five places because each catches a
      different insertion: never-S1 by
      `tests/test_extractor_v4_citation_rot.py`; the core-only render
      byte-for-byte by `tests/test_extractor_v2.py`; the `VALUE_FIDELITY_RULE`
      text absent from all three renders by
      `tests/test_v4_declared_mechanisms.py::test_the_value_fidelity_rule_rides_the_s2s4_slot_and_no_master_render`
      (which also asserts the rule still rides `_s2s4_rules()`, so the absence
      cannot pass by vacancy — measured before that pin: appending the rule to
      `_render_master_verbose`, the DEFAULT render, shipped a second copy of one
      instruction inside one prompt with every gate green); and the carve-out
      PRESENT, whole, on every render path, the vocabulary it
      names on all three master renders (S1 renders granularity, never the
      master list), and through both dispatch entry points, by
      `tests/test_v4_declared_mechanisms.py::test_every_render_path_carries_the_carve_out_the_guarantee_requires`
      together with
      `tests/test_v4_declared_mechanisms.py::test_the_dispatcher_prompts_carry_the_carve_out_once_and_compactly`
      — the render-path pin over three story shapes (matched, `None`, unmatched)
      precisely because a carve-out appended INSIDE the story gate passes the
      matched case, and the dispatcher pin because that one never reaches a
      dispatcher: it is the half that passes `core_only=False` EXPLICITLY (with
      `TORTOISE_CLASSIFY_LATER` on, that half contributed NOTHING — measured),
      that proves the COMPACT branch is the one rendered (`PACK KINDS` plus the
      compact master header), and that asserts `count(...) == 1` on the real
      S2/S4 path.
      ⚠️ Pinned, and NOT read off a comment: the `SEAMS:` comment above
      `SHORT_SESSION_FACT_RULE` belongs to a different constant and names S1 as
      one of ITS seams, so citing it as authority for value-fidelity's never-S1
      would say the opposite of what this row claims.
      ⚠️ PRESENT-IN-A-PROMPT IS STILL NOT THE GUARANTEE, which is why this row
      separates what the write path now REFUSES from what it cannot see. The
      prompt half makes the guarantee *uniformly declared*;
      `_refuse_rewritten_value` + the `_mint_endpoint` guard make a rewritten
      value *unreachable*; and the residual list above is STATED rather than
      absorbed.
      (p) THE ENFORCEMENT HAS ITS OWN OFF-SWITCH, AND WHAT IT RESTORES IS
      STATED (2026-11-07 `#10360`). `TORTOISE_STATE_VALUE_VERBATIM` — the
      module's ONE read of it, `_state_value_verbatim_enforced`, through the
      `env_truthy` contract — defaults to **ON**, so unset, blank or unparseable
      resolves ON and a typo can never silently disarm the guarantee. It is read
      once per POINT at the emit site and handed to the rule as `armed=` (so the
      hard-cut disclosure and the refusal cannot read two different answers for
      one point), and the rule reads it itself when a caller passes none — so a
      future second emit path inherits the switch rather than bypassing it. An
      explicit falsy spelling (`0`/`false`/`no`/`off`) makes the emit site take
      NO judgment: no refusal, no hard-cut disclosure, and no
      `refused_value_contents` / `refused_value_slots` entry, so
      `_mint_endpoint`'s resurrection guard cannot fire either — a rewritten
      value is WRITTEN and re-mintable, i.e. the pre-#10513 REFUSAL semantics,
      which is what a rollback has to mean (a switch that disarmed the refusal
      while leaving the mint guard armed would be half-armed: it would close one
      door and not the other). ⚠️ What OFF does NOT restore, so "rollback" is not
      read as "byte-identical to the old build": the #10513 MINT-site changes are
      not behind this switch — `_mint_endpoint`'s token-safe content cut and the
      S5 quote's ABSENT-on-hard-cut behaviour stay as `main` ships them. Neither
      withholds a memory. What the switch also does NOT move is the JUDGMENT —
      `_value_slot_divergence` / `_value_slots` keep their verdicts, so flipping
      it never re-derives a tolerance battery. It exists because this is the one
      rule in the module that WITHHOLDS a durable memory: an over-blocking
      refusal in production has to be reversible without a deploy. Pinned on both
      arms by
      `test_the_off_switch_defaults_ON_and_restores_the_pre_10513_write`,
      `test_the_off_switch_leaves_the_MINT_guard_off_too`,
      `test_the_off_switch_does_not_move_the_JUDGMENT`,
      `test_the_off_switch_is_read_at_ONE_site`,
      `test_the_off_switch_is_INTRINSIC_so_a_second_call_site_cannot_bypass_it` and
      `test_the_off_switch_is_declared_in_the_env_contract`. It is advertised to
      operators in `.env.example` (this repo's env contract) with its default,
      its revert trigger and what a revert does NOT undo.


  - id: atomic_point_write
    name: "an ATOMIC point write — §4.2's FOURTH precondition for the against-store exact dedup"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.2 "The against-store exact dedup has FOUR preconditions"
    state: not-implemented
    tracking_issue: 9879
    pins:
      - tests/test_v4_declared_mechanisms.py::test_the_atomic_write_absence_is_pinned_to_the_schema
    note: >-
      The declared requirement, in §4.2's own words: *"`create_point(dedup=True)`
      is a check-then-CREATE, and there is no uniqueness constraint on `Point`.
      Two concurrent writers both see 'absent' and both create. Nothing in the
      current write path closes that window."*
      MEASURED in the code, not quoted from the design: the resolve is
      `SDK._resolve_dedup_hit` → `SDK._find_point_by_content` and the CREATE is a
      separate statement after it; the capture v2 seam does the same and says so
      in its own comment (*"graph-level content-hash resolution … run BEFORE the
      create"*). ⚠️ This is an absent USE, not an absent CAPABILITY in this
      repository: a UNIQUE graph constraint is already created for another label
      (`GRAPH.CONSTRAINT CREATE tortoise_ge_uid UNIQUE NODE GraphEvent`,
      `tortoise/event_store.py`).
      ⚠️ It had NO row and NO tracking issue before this one — the registry's own
      `near_dup_merge` note recorded it as untracked, which is the
      declared-and-absent-with-nobody-tracking shape #5064 exists to make
      visible. `test_the_atomic_write_absence_is_pinned_to_the_schema` reds the
      day a `Point` uniqueness constraint appears in the spellings this repo's
      DDL uses (`CONSTRAINT CREATE` or `CREATE CONSTRAINT`, scanning
      `tortoise/**/*.py`) — so the row cannot quietly outlive its own absence.
      ⚠️ That pin's scope is STATED, not universal: a constraint created outside
      `tortoise/**/*.py` (a script, a migration, a console session) would not be
      seen, a statement ASSEMBLED at runtime is REFUSED as unverifiable rather
      than read as absent — an f-string / `+` / `%` / `.format` / `.format_map` /
      `.join` / `+=`, a statement SPLIT across operands at ANY point — the
      keyword boundary included, since the operands are JOINED in source order
      before the statement is looked for (an `+=` ACCUMULATES: what the target
      already held is joined with the right-hand side, so the two halves of a
      keyword split across the two statements are re-joined rather than read as
      one half), and a half carried by a name is folded
      in too however many bindings it takes (no single literal holds it), with a
      class-body binding resolved under the SAME key the taint rule uses, so the
      two cannot disagree about how a binding is spelled — and a hop the join
      cannot follow at all (a repeated binding on a path, or a chain past its
      runaway cap) is REFUSED as unverifiable whenever a constraint word is
      reachable from it, never read as short; the same shape WITHOUT such a word
      is left alone, because an unresolvable cycle in ordinary string building
      (`url = url + "…"`) is not a constraint question — and any name, attribute,
      subscript or
      tuple target BOUND to an
      incomplete one (`AnnAssign`, walrus, `for` target, a CLASS-BODY binding used
      as `Cls.name` — including a tuple target, a subscript target and a NESTED
      class `Outer.Inner.name`, or a class body that GUARDS its binding with
      `if` / `for` / `try` / `with` — or a collection that mixes a complete
      statement with an incomplete fragment) wherever it is used — ACROSS MODULES
      TOO, and not only along an import edge: the taint is the UNION of every scanned
      file's tainted spellings, so a fragment bound in one module and used in another
      is refused even when the two modules never import each other — with ONE shape
      excepted, which this pin does NOT reach: a SUBSCRIPT target (`D["k"] = …`)
      mints only a receiver-qualified `expr:` key, so `carrier.D["k"]` completed in
      another module is reported as neither found nor assembled (measured: `found`
      holds the binding, `assembled` is empty; identical on `main`, which makes it a
      DETECTOR gap and not a property of this pin — tracked, with two remedies, on
      #9901). Keying on the
      SPELLING is what makes that reach, and it is deliberately fail-CLOSED: a
      coincident name in an unrelated module refuses too (a false block on a name
      nobody assembled, never a false pass on one that was). A RENAME that hides the
      spelling — `from a import X as Y` re-exported and used as `Y` — is followed to a
      fixpoint over the import graph, with a RELATIVE import resolved through
      `node.level` (its dots live there and not in `node.module`, so a
      `module.startswith(".")` test never fires). An attribute target also mints its
      FINAL name FOR THE TAINT TEST, so `self._ddl` bound here and `OBJ._ddl` used
      there is refused too; the JOIN that names the completed statement keeps the
      receiver-qualified spelling only (a final name in the join's binding map made a
      colliding key `rebound` and took the keyword-split join with it — measured, and
      pinned). That join therefore stays per-module, so a cross-module fragment is
      reported as an unverifiable USE rather than classified — the refusal polarity,
      never a reading of absence. The JOIN is the one place that is per-module: a
      statement SPLIT across two modules, where the keyword half is not itself a
      fragment the scan recognises (`carrier.PREFIX = "CREATE "` joined with
      `"CONSTRAINT pt UNIQUE NODE Point"` in another module), is NOT joined and is
      therefore not reported — measured, identical on main before this change, and no
      such shape exists under `tortoise/`; it is a detector gap on #9901, not a
      property of the refusal. What no static
      scan reaches is stated as EXAMPLES rather than as a closed list — a fragment
      whose keyword lives entirely outside the scanned module (handed in by a
      helper or a default argument), a lookup resolved dynamically
      (`globals()["X"]`, `getattr(obj, name)`), and — for a MATCH — whether the
      string is a statement or an explanatory MENTION of the DDL spelling
      (docstrings are skipped; any other string that spells the statement out reds
      and must be reworded). It is the reachable surface the claim lives in, not
      the whole world.

  - id: failure_policy
    name: "per-step FAILURE POLICY (G3) — HOLD the unresolved identity, never assert `new`"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §4.4 (declared in §4.3 as G3)
    state: not-implemented
    tracking_issue: 5087
    pins:
      - tests/test_5095_s3_identity_policy.py::TestTheRemainingAbsence::test_an_unresolved_lookup_still_mints
      - tests/test_v4_declared_mechanisms.py::test_the_failure_policy_absence_is_pinned_to_the_mint_not_the_render
      - tests/test_10997_identity_hold.py::TestTheGate::test_an_unresolved_lookup_holds_the_endpoint_and_its_edge
      - tests/test_10997_identity_hold.py::TestTheHoldIsDrainable::test_run_1_holds_and_run_2_commits_it_exactly_once
    note: >-
      §4.4 states its own status in its closing paragraph: it *"is a SPEC, not a
      description of what runs"*, and the load-bearing instance is S3. The
      declared mechanism is the `HOLD` disposition (invariant I1: an unresolved
      identity is NEVER asserted `new`), the run-level `HOLD` set carried to a
      later run, and the single S3-attach/S5-connect/S6-commit transaction (I3).
      ⚠️ **WHAT EXISTS (#5095, the RECORD half — and it is deliberately NOT a
      state flip):** `tortoise/failure_policy.py` reads the lookup's state
      (`resolved` / `partial` / `unresolved`) off `search_graph`'s
      `query_coverage` + `query_results` — the queries that ACTUALLY ran, which
      `degraded` alone cannot express (a degraded lookup has zero priors; the
      swallowed `query 2..N` failure is the partial shape, and on a real S2
      output the shipped budget of 15 starves the 18th query in the POINT leg).
      The renderer no longer invites `new`, `execute_embed`'s
      `link_before_create` reports `found: null` for a candidate whose own query
      did not run (per candidate, not per run), and `extract_session_v2` carries
      an always-present `identity` block plus a warning that fires when a candidate's
      own identity query did not run (a budget cut that touches only non-candidate
      queries gets its own sentence, and a lookup that ran NOTHING at all with no
      candidate to check gets a third on any run that reaches the warning block —
      the empty-conversation early return precedes it, so it emits none — and the
      three are different facts).
      ⛔ **WHAT IS STILL ABSENT — and this is why the row stays
      `not-implemented`:** the gate covers the MINTED candidate only. `#10997`
      landed that half: `extractor_v2._mint_endpoint` no longer fabricates a
      `statement` Point from a ref on an `unresolved`/`partial` lookup — it HOLDS
      the edge WITH its endpoint (`#2552`) in `tortoise/identity_hold.py`, a
      durable per-graph store whose drain commits a held item exactly once on a
      later run whose lookup RESOLVED (`claim` before the mint, `confirm` binds
      the id, `hold` never re-arms a resolved key). ⛔ It is NOT the whole create
      gate: a Point/Entity the MODEL emitted is still created on an unresolved
      lookup, so duplicates remain mintable through that path (the S5-Job-2 half),
      and the S3-attach/S5-connect/S6-commit transaction boundary (I3) is
      untouched. ⛔ Nor is it `execute_embed({})`: that function is the sole
      carrier for retractions (whose same-session leg needs no graph lookup),
      supersessions and chain notes, so a wholesale suppression drops memory I2
      forbids dropping (#5095's PLAN-VERIFY round 1 measured it). Pinned in both
      directions: `tests/test_10997_identity_hold.py` proves the mint is HELD (and
      proves non-vacuity by flipping the predicate — a resolved lookup mints
      again), and
      `tests/test_5095_s3_identity_policy.py::TestTheRemainingAbsence` still
      asserts the REMAINING absence with a CALL (`execute_embed` commits a Point
      and an entity the MODEL emitted for an unresolved lookup — the day the
      model-emitted half is gated it reds and this row must flip), together with
      `test_the_failure_policy_absence_is_pinned_to_the_mint_not_the_render`,
      which pins the record half's presence and this row's state. #5087 (E1)
      remains the code-owner of the rest.
      ⚠️ NOT registered as one mechanism: §4.4 also gives each of the eight
      steps its own direction and transaction boundary. Those are per-step
      policies of THIS mechanism, not eight more mechanisms, and a row per step
      would turn the registry into a pipeline-step list — the scope line the
      design draws at the head of §4.3 (*"The step list is the SHAPE, not a
      complete specification"*).

  - id: mention_record
    name: "DM1 — the mention record is a property on the claim Point"
    declared_in:
      - docs/epics/2026-11-05-5087-extractor-v4/05-plan.md  # §4 DM1
    state: implemented
    code:
      - tortoise/commit_schema.py
      - tortoise/projection/entities.py
      - tortoise/projection/__init__.py
      - tortoise/sdk.py
      - tortoise/hosted_api.py
      - tortoise/api.py
      - tortoise/consistency.py
    tests:
      - tests/test_referentiality_11021.py
      - tests/test_mention_write_11239.py
      - tests/test_commit_endpoint.py
    symbols:
      - Mention
      - encode_json_record_props
    note: >-
      DM1 declares the mention as *"a property on the claim Point that carried
      it"* (`05-plan.md` §4, closed 2026-11-05 against the Postgres branch), and
      this row exists because that declaration lives in the EPIC PLAN rather than
      in `docs/architecture/` — one directory outside the surface this gate used
      to walk, which is how a declared-and-absent mechanism kept reading as
      shipped (#5064's root, with one directory of margin).
      ⚠️ WHAT IS BUILT (the PAYLOAD half): `commit_schema.Mention` carries
      `surface`, `span_start`/`span_end` and `kind_guess` and bounds the fields it
      DECLARES a bound on (`surface`, `quote`, `kind_guess`, the span offsets);
      `claim_ref` and `rule_id` carry NO schema bound — they are cut by the
      producer (`_mention_ref` / `_mention_rule`). It has no list-level validator,
      so it neither clamps nor dedupes the list either. The clamp and the dedupe
      live in the PRODUCER — `extractor_v2._clamped_mention` and
      `extractor_v2._dedupe_mentions` — reached from `_mentions_for_claim` (both),
      `execute_embed` (both — the `mentions_recorded` accounting the next
      paragraph is about) and `extract_session_v2` (both — the evidence block),
      and from `route_mentions`, which builds through `_mention_record` and then
      dedupes (`_clamped_mention` does NOT run on that path) — and the producer
      channel publishes the result (`result["embed_list"]["mentions"]` /
      `result["s2_embed"]["mentions"]`). A future write door that persists the
      payload VERBATIM therefore stores what it was handed; it must not assume
      the commit shape will have cleaned it.
      ⚠️ WHAT IS NOT BUILT IN THE PAYLOAD, AND IS NOW BUILT BESIDE IT (the
      PERSISTENCE half, landed by #11239): DM1's home is the claim Point, and the
      record now reaches it. `hosted_api._execute_commit_writes` sets
      `point_props["mentions"]` on both of its create legs — ONLY when the
      payload carries a record, because an explicit `None` would CLEAR the
      stored one — and forwards it through `**point_props`; the SDK capture seam
      carries it on its create branch exactly as it carries `validFrom` —
      stored, never advertised. ⛔ `mentions` is deliberately NOT in
      `sdk._CAPTURE_PASSTHROUGH_ORDER`: that set is the public capture RESPONSE
      surface (#2949 response parity), so widening it would advertise a field no
      client model declares. Neither REST `CreatePointRequest` (hosted or
      self-host) has the field: it is a writer-produced record, not a client
      field.
      On the node the value is ONE compact JSON scalar
      (`projection.entities.encode_json_record_props`, declared in
      `_POINT_JSON_RECORD_PROPS` and `_POINT_DECLARED_PROPS`), because an array
      containing a map never reaches the node: the projection denies it
      (`_is_persistable_prop_value`) and a raw `SET n += $p` gets it degraded to
      `null` by the driver before dispatch (#7369's `tags` mechanism), and
      `_POINT_LIST_PROPS` is deliberately empty. The SDK doors call that helper
      themselves (`create_point`, `update_point`, `_update_entity`) and emit a
      pure function of the payload, which is what makes the live write and every
      rebuild byte-identical (#330); the projection's replay writer
      (`_upsert_point_props`) calls it too, and that call is LOAD-BEARING for
      `EventAPI.add_point` — a live door that journals the payload's LIST
      spelling and calls no encoder of its own (neutering it stores nothing) —
      as well as the only arm that normalises a NON-canonical record, pinned
      behaviourally by
      `test_the_replay_door_normalises_a_non_canonical_record`.
      `consistency._uncarried` READS that declaration instead of
      re-listing it, so an armed capture no longer reports a `_UNCARRIED_LIST` it
      will never persist. Pinned by
      `test_the_mention_record_reaches_the_claim_point_and_says_so`, which asserts
      BOTH directions — the doors carry it, and nothing (the response surface, a
      REST model) over-advertises it.

  - id: declared_pack_relations
    name: "DM5 — the pack's DECLARED relations/hierarchies become replayable Object→Object edges"
    declared_in:
      - docs/epics/2026-11-05-5087-extractor-v4/05-plan.md  # §6 DM5 + §7 T7/T8
    state: implemented
    code:
      - tortoise/pack_hierarchy.py
      - tortoise/relation_write.py
    tests:
      - tests/test_pack_hierarchy_11001.py
      - tests/test_relation_write_11237.py
    symbols:
      - declared_hierarchy
      - plan_hierarchy_edges
      - plan_relation_edges
      - apply_relation_edges
    note: >-
      The mechanism is the ORACLE for the pairs a pack declares in
      `ontology.hierarchies[]`: nothing may emit a HIERARCHY pair the packs do
      not declare — so the graph can tell an asserted structure from an invented
      one. `ontology.relations[]` rows are the other half of the declaration: they
      contribute the declared `(from_kind, predicate, to_kind)` the census counts
      and the mechanism/write path `relation_write_paths()` resolves, but their
      pairs are NOT yet GATED at write time — that gate is `#11656`'s scope, not
      this row's. `declared_hierarchy`
      resolves each declaration to a namespaced `(from_kind, predicate, to_kind)`
      and binds it to a write path from `relation_write_paths()` (consumed, never
      re-derived); `plan_hierarchy_edges`/`plan_relation_edges` render the plan
      and drop every undeclared pair; `apply_relation_edges` is the PRODUCTION
      consumer, called from `sdk.py`'s capture commit path on
      `out["relations"]` (the S5 Job 1 remainder, #11237/#11548).
      ⚠️ This row exists because #11001 CLOSED without it, on a boundary comment
      that said the `implemented` row "belongs to THIS issue, because the
      registry contract requires `code:` + `symbols:` that only the producer can
      declare" (2026-11-05) — and #10984, which inherits the seam's evidence,
      ships at most `tracking_issue:` + `pins:`. A mechanism shipped and invisible
      to this registry is #5064's root in the exact direction the gate exists to
      catch.
      WHAT `written` MEANS HERE, and where it is measured: per ROW, by
      `tools/pack_relation_census.py --write-probe`
      (`docs/evidence/11083/pack-relation-census.json` — `direct` /
      `mediated` / `none`), because "declared and writable" is not "written".
      The REPLAY route is named per class rather than assumed: a structural row
      lands a bare `(:Object)-[:predicate]->(:Object|:Subject)` carried by
      `RECORD_CARRIED_STRUCTURAL_RELS` (every predicate the lane can write is
      asserted equal to it) and addressable through
      `RECORD_ADDRESSABLE_EDGE_LABELS`; an operator row lands the
      `[:INPUT]`/`[:IMPL]` bridge and replays through `OperatorAdded`. Pinned
      executably by
      `tests/test_pack_hierarchy_11001.py::TestTheShippedPacks::test_the_kin2_ownedBy_row_names_its_replay_path`,
      which reads those two constants so a predicate or label dropped from them
      reds rather than quietly making the edge live-only.
      ⛔ NOT a write-side cap: `PER_ENTITY_FANOUT_CAP` (200) is a QUERY-side
      working-set bound by owner ruling (`STORAGE-ARCHITECTURE.md` §11.5), so
      clamping the plan would drop stored connections — the planner
      deliberately does not, and `TestNoWriteSideCap` pins that a 205-edge hub
      keeps all 205.
