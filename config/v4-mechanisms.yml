  - id: state_value_carve_out
    name: "verbatim state/operational values — the carve-out a filter MUST carry"
    declared_in:
      - docs/architecture/EXTRACTOR-V4-ARCHITECTURE.md  # §7, the narrower-than-it-looks carve-out (#2453)
      - docs/architecture/STORAGE-ARCHITECTURE.md       # §7, the two-class retain table
    state: implemented
    tracking_issue: 10360
    code:
      - tortoise/extractor_v2.py
    tests:
      - tests/test_state_value_verbatim_10360.py
    symbols:
      - _value_slot_divergence
      - _refuse_rewritten_value
      - _value_slots
      - _state_value_verbatim_enforced
      - STATE_VALUE_VERBATIM_SWITCH
    note: >-
      WHAT IS NOW MECHANICAL (neither half is prompt text):
      (1) A NON-VERBATIM VALUE IS NOT SILENTLY WRITTEN. `_refuse_rewritten_value`
      runs on `execute_embed`'s S1/S2 model path — where the model authors the
      quote — and a point whose own verbatim `quote` holds a DIFFERENT value in
      the SAME slot is not written. That is the shape of a rewrite, which the
      carve-out forbids outright ("never round, paraphrase, or label them").
      The refusal is on the POINT, never on the offsets — withholding only the
      span leaves the rounded value in the graph with the corrected value one
      `find` away — and it is REPORTED with both values, so the rewrite is
      recoverable from the run. It also runs BEFORE `classify_consolidation`
      and before any supersede record is collected (a later refusal left
      supersessions naming a pid never written), on the pair the WRITE KEEPS —
      each side cut by `_write_span` to the text the write stores, and that text
      is the IDENTITY window `x[:_MAX_CONTENT]` itself EXCEPT where the cut would
      truncate a NUMERAL, in which case the split token is dropped whole so a
      value straddling the cap is never read short (the one direction in which
      value fidelity OUTRANKS byte identity — residual (n)), and it carries the
      refused point's `supersedes` ref
      into the same drop report the other doors use (#9906: no silent drop door).
      ⚠️ Judging the UNCLAMPED pair instead — the previous reading — also refused
      a point over a divergence in text the write DISCARDS: measured, a 1219-char
      content whose stored `content[:_MAX_CONTENT]` binds no value at all was
      REFUSED, withholding a durable memory over a tail that never reaches the
      graph (#10513 review cycle-13 P2). What is judged is now exactly what is
      written, and the NUMERAL-ONLY cut is what keeps the straddle direction
      closed — an unconditional word-boundary cut ALSO moved the stored text off
      the identity key, which cost a VET-authorised MERGE (review cycle-18 P1,
      measured: `merges == 0` and a duplicate Point).
      (1b) THE OPERATOR PATH IS GUARDED, AND ITS TWO RESIDUALS ARE STATED RATHER
      THAN IMPLIED. `_mint_endpoint`
      (mint-before-wire, #2552) builds a Point from the MODEL's text, so it reads
      `refused_value_contents` and refuses to mint a refused ref — measured: an
      operator naming a refused point used to re-materialise the rewritten value
      as an endpoint Point, undoing the refusal one step later. The key is the
      VALUE, not the byte string: `_norm` equality is exact, so re-naming the
      refused ref `the p95 hit 4.0 seconds.` re-minted it (measured), and the
      guard therefore also matches the refused point's own `_value_slots` — a
      variant stating the SAME value in the SAME slot is the same resurrection.
      An endpoint carrying no value has no slots and is unaffected.
      ⛔ That key is EXACT-tuple, so the guard stops the byte-exact case and the
      slot-exact variant, and NOT a wider one — residual (1b-ii) below says which
      and why it is disclosed instead of narrowed.
      ⚠️ (1b-i) THAT KEY IS COARSE, AND THE COST IS STATED RATHER THAN ABSORBED
      (#10513 review cycle-11 P3, measured): it keys the VALUE —
      `(anchor, sign, core, unit)` per slot — and carries NO identity for the
      CLAIM, so an endpoint that is a DIFFERENT claim sharing an anchor word and
      a value is suppressed as well. Refusing `the TTL is 20 minutes` (against a
      `20 hours` quote) also drops the operator endpoint `the cache TTL is 20
      minutes`; on `main` that endpoint is minted, so in this narrow shape an
      operator edge is lost — REPORTED, never silent, and under the variant
      wording rather than a false accusation of a rewrite. ⛔ Not narrowed, and
      the reason is the classifier rule: telling that endpoint apart from a
      variant means judging the claim's NON-value words, i.e. a second
      classifier beside `_value_bindings` — the P2 that killed the previous
      attempt at this issue — and the shape only arises in a batch that already
      contains a refusal (0 refusals on the committed census). Pinned by
      `test_a_DIFFERENT_claim_sharing_an_anchor_and_value_is_suppressed_too`, so
      a future lane that narrows the key has to move this row.
      ⚠️ (1b-ii) AND THE KEY IS EXACT-TUPLE, SO A **WIDER** VARIANT STILL MINTS
      (#10513 review cycle-13 P2, measured): a variant stating the same value in a
      SUBSET, a SUPERSET or a REORDERED slot layout does not equal the refused
      point's slot tuple and re-mints the rewritten value as an endpoint Point —
      `hit 4.0 seconds`, `the p95 hit 4.0 seconds and the p99 is 9 seconds` and
      `we saw 4.0 seconds on the p95 this time` all reached
      `payload["points"]` while the point itself was refused. ⛔ Not narrowed by a
      CONTAINMENT rule, because that buys nothing on the reordered shape (its
      slots are `(saw, 4)`/`(on, 95)`, which match no refused slot) and pays for
      the other two by expanding (1b-i)'s over-suppression to EVERY endpoint that
      merely mentions the same number in the same anchor slot. Closing it means
      identifying the CLAIM — the second-classifier shape the review P2 already
      rejected. It needs the model to emit an operator naming a WIDER variant of
      an already-refused ref, and the committed census produces no refusals at
      all. Pinned by
      `test_the_mint_guard_matches_the_SLOT_TUPLE_exactly_so_a_WIDER_variant_mints`,
      filed as a follow-up (#10542), so a lane that closes it has to move this row.
      ⚠️ THE MINT'S CUT IS THE SAME `_write_span` CUT (#10513 review cycle-15,
      measured), so the two strings cannot disagree about WHERE the cut is. A
      HARD `[:cap]` here stored `… p95 hit 4` out of `… p95 hit 4.0 seconds` — a
      value the model never wrote, minted as a quote-less endpoint Point, from a
      text whose kept span carries no complete value — and, because the stored
      content is what `n in point_ids` keys on, a byte-identical operator ref
      missed that dedup and minted a DUPLICATE point beside the one it named
      (measured: 3 points where the pre-cycle-14 tree produced 1).
      One truncation helper for both halves, so the two strings cannot disagree.
      ⛔ AND THE MINT STORES THE REF'S OWN IDENTITY WINDOW `ref[:_MAX_CONTENT]`
      (#10513 review cycle-18 P1, measured): `_endpoint_keys` keys the entity
      guard on `_norm(ref[:_MAX_CONTENT])`, and the closure/removal arms re-read a
      minted point's STORED text back, so a mint that stored a shorter
      word-boundary span lost most of a long ref (measured: 550 of 1000 chars for
      `"a"*500 + " "*50 + "b"*500 + "tail"`) and put those two keys out of step.
      `_write_span` now moves the span only for a truncated NUMERAL — residual
      (n) — so what the mint stores IS the key the guard compares.
      Pinned by `test_the_MINT_cuts_at_a_TOKEN_boundary_so_it_cannot_FABRICATE_a_value`
      and `test_a_ref_that_matches_the_stored_content_RESOLVES_instead_of_minting_a_DUPLICATE`.
      ⛔ ONE SHAPE IS STILL A TRUNCATION, and it is residual (n2): a ref that is
      a SINGLE whitespace-free token longer than the cap has no boundary to cut
      at, so `_write_span` can only return its prefix and a value inside it reads
      short. The mint is NOT refused there — an over-long ref must still RESOLVE
      (#2552, pinned), and refusing it would trade a disclosed truncation for a
      LOST operator edge.
      ⚠️ That is not RETENTION: a refused point loses its value entirely, so what
      is enforced is "the graph never records a rewritten value as verbatim",
      not "every value survives".
      (2) ONE classifier, the production one: `_value_slots` reads
      `_value_bindings` (the E5/E7 contradiction engine, live) and adds no second
      value CLASSIFIER — the P2 that killed the previous attempt at this row.
      THE DISCRIMINATOR — how the rule tells a droppable identifier from a
      retainable state value: it carries no identifier CLASSIFIER. What it judges
      is a token's trailing numeric CORE, whatever letters precede it (`x4` reads
      as `4`, so `x4`/`5` and `x4 ms`/`5000 ms` ARE judged). The identifier's own
      letters reach the identity through the SUFFIX, which is read as a UNIT with
      no identifier/unit distinction: a tail that SPELLS a known unit is compared
      AS that unit (`arr4ms` IS `4 ms`, so `arr4ms` against `4 seconds` REFUSES),
      and a tail that spells NOTHING in the table leaves the unit UNJUDGEABLE on
      equal cores — a FAIL-OPEN, so `arr4zz` against `4 hours` TOLERATES. Of those
      tails, ONLY the `k` one is ADDITIONALLY read as a SCALE, and that happens in
      TWO shapes: BARE, where the ×1000 is closed by arm (i) with no unit folded
      (`x4k` against `4000` TOLERATES, and `_composed_identity` DECLINES it
      because `k` is already a known unit), and over a KNOWN UNIT, which is
      residual (d2) below (`x4k`+`ms` → `4000 ms`).
      It judges
      VALUES over the engine's own bindings, in three tolerances (#10360 lane
      record): (i) value identity, not string identity — a numeric core with its
      SIGN and its UNIT kept, so ``4.20``/``4.2``,
      ``20%``/``20 percent``, ``.5``/``0.5`` and ``800ms``/``800 milliseconds``
      are one value while ``20 minutes``/``20 hours`` and ``20 km``/``20 mi`` are
      rewrites — and the minus may be spelled ASCII `-`, U+2212 `\u2212`, or a
      LEADING en/em dash (`-5`/`\u20135`/`\u20145` are one value; an INNER dash is
      a range, not a sign); (ii) clock forms (a CLOCK-VALID colon token — `HH:MM` with hours
      0-23, ending the token, plus a zone-prefixed one such as `UTC+03:00`, and
      the engine's own `clocka0300`/`meridiem-pm` placeholders) and ISO
      dates are OUTSIDE the judged set — a strict containment rule refuses 16 of
      the 101 truthful census spans and every one of the 16 is a normalised FORM,
      catching zero rewrites. ⛔ The exclusion is CLOCK-VALID, not "any colon":
      an any-colon arm put `27:12` — this carve-out's OWN worked example —
      outside the judged set (measured: `27:00` for `27:12` was written with no
      warning), and narrowing it changes the census result not at all (62 judged
      / 0 refused, re-derived). The clockable start is what keeps `27:12`
      judged (`27` is no hour); a BARE-shape-only arm judged `UTC+03:00`, whose
      core is the two colon runs joined, and so REFUSED `UTC+3` against
      `UTC+03:00` — one offset spelled two ways (measured, cycle 10); (ii-bis) a
      SEPARATOR-BEARING numeral is OUTSIDE the judged set — ``1,200``, ``4,2``,
      ``1.234``, ``1,234.56`` — because which character is the decimal point is a
      LOCALE property and this path has no locale (CLDR UTS #35 carries
      `decimal`/`group` per locale: `format_decimal(1.2345, locale='en_US')` is
      `'1.234'` while `format_decimal(12345, locale='de_DE')` is `'12.345'`).
      This one is a RECORDED DECISION complied with, not a tolerance invented
      here: `tortoise/value_normalizer.py`'s #2817 ruling, point 1 — "**No
      separator rule, at all** … deciding that ``R$ 1.234,56`` is ``1234.56``
      **is** the locale question the design excludes". An earlier revision of
