# Domain Manifest — registration schema for domain ontologies.
#
# Convention: lives at config/domain_manifest.yaml (tortoise project root).
# Loaded by tortoise.domain_loader to populate routing, kind, and Cypher registries.
#
# Schema:
#   version: int — manifest schema version (bump on breaking changes)
#   domains:
#     <domain-key>:
#       name: str — human-readable domain name
#       ontology_doc: str — path to ontology markdown document
#       active: bool — if false, loader skips this domain
#       version: str — domain ontology version
#       kind_values:
#         pointKind: [str]   — additional point kind values
#         subjectKind: [str] — additional subject kind values
#         objectKind: [str]  — additional object kind values
#         eventKind: [str]   — additional event kind values
#       event_types: [str]   — JSONL event types this domain handles (write-side routing)
#       query_patterns: [str] — NL query pattern keys this domain answers (read-side routing)
#       cypher_template: str  — base Cypher query template for this domain
#       relationship_types: [str] — custom relationship predicates
#       timeout: float        — per-domain dispatch timeout (default: 5.0)
#       priority: int         — merge priority (lower = preferred, default: 10)

version: 2

domains:
  product-strategy:
    name: "Product Strategy"
    ontology_doc: "docs/product-strategy-ontology.md"
    active: true
    version: "1.0"
    kind_values:
      pointKind:
        - useCase
        - jobToBeDone
        - userJourney
        - workflow
        - requirement
        - policy
        - concept
        - issue
    event_types:
      - PointAdded
      - OperatorAdded
      - PointRevised
      - StrategyDefined
      - RoadmapUpdated
    query_patterns:
      - productStrategy
      - jtbd
      - useCases
      - workflows
      - requirements
    cypher_template: >-
      MATCH (p:Point)
      WHERE p.pointKind IN ['useCase', 'jobToBeDone', 'userJourney', 'workflow', 'requirement', 'policy', 'concept', 'issue']
      RETURN p ORDER BY p.createdAt DESC LIMIT 50
    relationship_types:
      - composedOf
      - enables
      - covers
      - specifies
    timeout: 5.0
    priority: 10
