# The alternative — land the dispatchers only once the narrow
# methods they supersede are retired — would make this phase wait on Phase 3 and is
# why the pin is raised HERE, explicitly, rather than silently by a re-cut (which
# carries a pin forward by design and can never raise it).
#
# ⚠️ A re-cut emits ONLY this header, then the `yaml.safe_dump` of the derived document.
# YAML dumps no comments, so any comment below this block is SILENTLY DROPPED. Keep
# rationale here or in the docs, never in an ad-hoc comment in the body.
#
# LOWERED 82 → 76 on 2026-11-04 by PR #10906 (#4282 Phase 3.2, the first tool batch:
# the five `run_onboarding` tools deleted), then 76 → 72 by #10914 (the `graph_overview`
