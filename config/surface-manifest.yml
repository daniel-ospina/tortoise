#
# THE BASELINE BELOW IS A FREEZE OF WHAT EXISTS, NOT THE APPROVED TARGET. It exists so
# drift is visible (tools/surface-guard.py). The approved TARGET is recorded in
# docs/product/canonical-mcp-tools.md and docs/product/beta-sdk-surface.md; compliance
