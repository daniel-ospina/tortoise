response_fields:
- response: tortoise_search
  field: ep.informed_order
  emitted_when: 'a Point hit that carries an `ep` block also carries `informed_order` when the answer is knowable
    -- "consulted" when the ORDER read the belief layer (order_by=graph|confidence, or recall_state''s StateRanker)
    AND that read answered for THIS row; "not_consulted" when the order measured no belief at all -- the relevance
    path never reads the posterior, and a read that FAILED, or that answered none of the rows on this page, collapses
    to this same state because every score on it then came from a neutral default. The key is ABSENT in two cases
    -- the stage that produced the order cannot say (a caller-supplied ranker whose read is not observable), and
    a MIXED page where the read answered other rows but not this one (no persisted belief was supplied for it) --
    no claim is made rather than a guess. #10137.'
  unchanged_when_off: yes — no flag; the key is additive and the order, scores and every other field are byte-identical
    to the pre-#10137 response
- response: tortoise_recall
  field: ep.informed_order
  emitted_when: 'same contract as tortoise_search -- a returned hit''s `ep` block carries "consulted" when the StateRanker
    that produced the ORDER read the belief and the read answered for THAT row, "not_consulted" when the order measured
    no belief at all (a read that failed, or one that answered none of the rows on this page -- every score then
    came from a neutral default), and is ABSENT when the ranker''s read is unobservable or answered other rows but
    not this one. #10137.'
  unchanged_when_off: yes — additive; ordering and every other field unchanged
- response: tortoise_search
  field: ep.ep_state
  emitted_when: 'ALWAYS on a Point hit that carries an `ep` block — the #11702 state NAME for the belief beside
    it, one of "measured" (a READABLE belief this claim MEASURED — the α predicate `posterior_alpha IS NOT NULL
    OR (ep_alpha IS NOT NULL AND NOT baseline_set)` is true, spelled out because `baseline_set` gates the `ep_alpha`
    arm ONLY; a direct update_point(…) writes a `posterior_alpha` too, so the token is NOT proof of an EP pass),
    "baseline" (a READABLE belief EP has not measured: the belief comes from the `n.confidence` mirror, from a declared
    baseline, or from a terminal claim whose posterior decayed), or "absent" (NO readable belief — the value is
    null). The three tokens are decided by TWO RULES, never by a list of shapes: the VALUE rule (the `n.confidence`
    mirror when it is a readable probability, else α/(α+β) when both operands are readable, non-negative and sum
    to > 0, else null) decides absent-vs-present, then the α predicate decides measured-vs-baseline, and THEN the
    #2490 fold turns `measured` into `baseline` for a TERMINAL claim; so "absent" is exactly "the value is null"
    at the `ep` block. It is the key that makes `ep.confidence_mean` readable: the value is `null` if and only if
    the state is "absent", so a consumer never has to infer the state from the number. It is emitted from the same
    `EpBreakdown` the `ep` block is serialised from, with the SAME mirror-first precedence as every other surface
    (the `n.confidence` mirror leads, then posterior_alpha/beta, then ep_alpha/beta) and the SAME value rule (a
    half pair, a degenerate α+β of 0, a negative operand and an unreadable operand all carry no belief — unless
    a `n.confidence` mirror supplies one, because the mirror leads). The three tokens are shared with recall_ranking.ep_state,
    gaps_ranking.ep_state, graph_ranking.ep_state and the SubgraphExpander node payload, so all of them join on
    one vocabulary. #11702.'
  unchanged_when_off: 'NO — additive key on an existing `ep` block, so the key set grows by one on every Point hit
    that carries one (the values are the #11702 contract change; the field itself is additive). Not flag-gated'
- response: tortoise_recall
  field: ep.ep_state
  emitted_when: 'same contract as tortoise_search — a returned hit''s `ep` block carries the #11702 state NAME beside
    `confidence_mean` ("measured" / "baseline" / "absent"), and the value is `null` if and only if the state is
    "absent". Distinct from the `recall_ranking.ep_state` row: that one is the ranker''s OWN row, this one is the
    `ep` block that rides the hit payload. #11702.'
  unchanged_when_off: NO — additive key on an existing `ep` block (see tortoise_search / ep.ep_state). Not flag-gated
- response: sdk:recall_subgraph
  field: nodes[].ep_state
  emitted_when: 'ALWAYS on every `Point` node in `nodes[]` — the same #11702 three-token state as `ep.ep_state`
    ("measured" / "baseline" / "absent"), paired with `nodes[].confidence`, which is `null` if and only if the state
    is "absent". A non-Point node carries NEITHER key — not `ep_state` and not `confidence` — because a belief is
    not that surface''s to report (`SubgraphExpander._enrich` writes both inside one `if state:` gate, so an absent
    key set is the shape, not a `null` value; #2294 treats null-vs-absent as meaningful, so a consumer must read
