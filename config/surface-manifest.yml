# endpoints — but each one is recorded here so this manifest stays the single
# source of truth for what we tell agents we return. A field that is off by
# default and leaves the response unchanged when off does not gate; an
# unrecorded one has no approval behind it and the carve-out does not cover it.
response_fields:
