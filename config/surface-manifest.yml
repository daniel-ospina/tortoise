# APPROVAL is the per-row `approved` flag, cut from tortoise/__all__.py (40 names): a row
# with `approved: false` is migration backlog, not consent. `approved` is a DERIVED row
# key, so a re-cut over a grown surface writes `approved: false` for the new method and
# property 12 compares two identical derived values — green by construction. What reds an
# unapproved addition in required CI is the `high_water_counts` growth pin below, enforced
# INDEPENDENTLY by the BASE-REF-pinned `tools/surface-guard.py` (its step 7); the full
# `tools/sdk_surface_declaration.py check` names the addition too, but its gap half is
# report-only in the required job.
