# PARAMETER, which moved both of their cells: `served_from` is the `_code_digest` of the
# handler's code object (bytecode, names, constants — a docstring counts, it is a
# `co_const`; `co_firstlineno` is excluded on purpose, so a pure code move moves
# nothing, and only the edited tool's row moves), and `served_attributes` hashes
# `__defaults__`/`__annotations__`, which a new parameter changes (#4192). The values were
# re-stamped to what the code DERIVES — `tools/surface_manifest.py check` re-derives and
# compares, so the code is authoritative, not these digits. Precedent: #12547 re-stamped
# `served_from` for `tortoise_query` in the same way, and its own row comment was then
# erased by the next cut (2c67c0cf99) — which is why this note lives in the header.
# ⛔ A re-stamp is NOT an approval. The approval gate is the “add or remove a tool or a
# public SDK method” rule (AGENTS.md §MCP/SDK Surface Approval); a parameter on an
# existing door is neither, `counts:`/`high_water_counts:` are unchanged, and the tool
# and SDK name sets are unchanged. A green `surface-guard` run is a consistency result.
# ⛔ `tortoise_create_object` IS NOT IN THAT LIST ANY MORE, and this note said it was until
# the `origin/main` merge: `#13052` (`#4282` Phase 2) retired the door from the ADVERTISED
# surface, so it has no row here and the parameter is declared only on its Python alias
# (kept for in-repo callers). A note on the shard-layout input that names a retired tool is
# the same rot this header exists to stop.
#
# `cut_at_commit` IS a DEFAULT-BRANCH COMMIT, never a lane one (#11057 review F1). It names
# the `main` commit this baseline was cut AGAINST, so `cut --commit <sha-in-main>` — not the
# worktree HEAD it happened to run in. This repo squash-merges and deletes the source
# branch, so a lane SHA resolves in the PR's own CI (which fetches every head) and exists
# NOWHERE once it lands; a required provenance check that accepted one would red `main`
# permanently. `check` therefore requires the record to be an ANCESTOR of the default
# branch, not merely present in the clone.
#
# ⛔ ONE ROW ONLY. A forward merge can leave this key TWICE (the merge of `origin/main` did
# exactly that: this branch's line and #10914's sat adjacent) and a YAML loader SILENTLY
# last-wins — the file then reads as ONE value while the diff shows two. The value must be a
# commit of `main`: measured with `gh api repos/<owner>/<repo>/compare/<sha>...main`,
# `status=ahead, behind=0` is an ancestor and `status=diverged` is a lane commit that will
# exist nowhere once its branch is deleted (a lane SHA still RESOLVES today, so a check that
# only asks that question calls it fine — which is why this record also asks about ancestry).
