- response: sdk:get_organisation_account
  field: plan.limit
  emitted_when: 'PRESENCE is the contract, and it has three states because a missing key and a null one mean different
    things (#10015). A number = a bounded allowance. null = UNLIMITED — the encoding `quota.resolve_org_limits`
    documents for a key that is PRESENT with no value (`billing.apply_limits` writes NULL for exactly that). The
    key is ABSENT when the limit could not be read — the shape `enforce_org_limit` treats as fail-closed — because
    `null` would read as unlimited and tell a capped account it has no cap. A consumer must read the KEY, never
    only its value: `plan.limit` omitted is UNKNOWN, not unlimited, and not 0.'
  unchanged_when_off: n/a — not flag-gated. This is a NEW endpoint (approved SDK row 28), so there is no prior response
    body to keep byte-identical; the three states above are its initial contract.
