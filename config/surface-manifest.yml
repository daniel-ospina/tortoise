    defect one level down (Elasticsearch carries `hits.total.relation: eq|gte` for exactly this)'
  unchanged_when_off: n/a — not flag-gated; the key is absent on every complete or unprovable read
- response: tortoise_update_knowledge
  field: valid_to_shaped
  emitted_through: the container's PROPERTY/retract arm (#11609 lane B) — it delegates to the same handlers this
    row used to name, so the receipt is unchanged
  emitted_when: 'same field, same condition, on the UPDATE door (#9202): the caller''s validTo declared no date
    and was shaped into the canonical un-datable end. Emitted on every reply path of the door that WROTE the shaped
    end; a `status` that was already applied does not suppress it, because the props write still applies the shaping.
    The status-only and promote NO-OP replies write nothing and carry none. ⛔ ONE further exception, and it is the
    rule rather than a hole: a reply for an id that does not exist returns {} and carries NO receipt, because nothing
    was stored — the receipt reports an end that reached the record, and that path writes nothing (it is also the
    documented absent-id contract). A downstream lane may therefore index reply["valid_to_shaped"] only after confirming
    the reply is NON-EMPTY **and** that the call was not one whose reply is a no-op.'
  unchanged_when_off: not flag-gated — the key is ABSENT unless a shaping happened, and a write that shapes nothing
    returns byte-identical to before this field existed
- response: sdk:tortoise_fts_query
  field: successorId / successorName / allSuccessorIds / stage / endedAt / linkedEvents / the ended-row shape (the
    ended_scope read) — each a separate row key, never a wrapper object
  emitted_when: 'only for a call that passes ended_scope=True (#13302). Those rows are NOT match rows: they describe
    an ENDED record and say how it ended, from the record''s own fields — `status` (the lifecycle word: `deprecated`
    = nothing replaced it, `superseded` = see the successor), the successor as the TWO facts the model actually
    records (**`successorId`/`allSuccessorIds` from a Point''s CORRECTS edge, and `successorName` from the
    `supersededBy`/`superseded_by` carrier — that carrier holds a NAME by ONTOLOGY §4.2/§4.3, so it is never
    served under an `…Id` key and an Object/Subject row has `successorId: null` beside its `successorName`**),
    `stage` {id, slot, outcome, since} on a record ended on the POSITION axis, `isClosed`/`outdated`, `endedAt` plus
    the raw `validTo`/`expiredAt`/`supersededAt`/`pipelineStageSince`/`updatedAt` it was resolved from, and
    `linkedEvents` (the Events wired to the record — empty is the product''s own statement that no occurrence was
    ever recorded, which with stage.slot == "terminal" IS the "planned and never happened" answer). Selection is
    the shared currency predicate `live._terminal_expression` in the positive direction, so no status list, slot
    literal or visibility field is added anywhere.'
  unchanged_when_off: 'yes — ended_scope defaults to False and the branch returns before any retrieval runs, so with
    the flag off the read is byte-identical to pre-#13302: same rows, same keys, same order. ⛔ Deliberately NOT exposed
    on the MCP `tortoise_search` door yet: that is a served-declaration change needing owner approval (surface-guard),
    and the implementation plan marks read-tool scope parameters (S6) not-gated-yet.'
