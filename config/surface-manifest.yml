# `tools/surface_manifest.py::read_approval` and copied into this file by a re-cut.
# Do not hand-edit the four values: `check` compares them against the document, so a
# hand-edit that disagrees reds the lint. Edit the document, then re-cut.
#
# `high_water_counts` is a GROWTH PIN, not a derivation: `cut` carries it forward and
# `tools/surface-guard.py` reds when the live surface EXCEEDS it. Raising it is a
# deliberate, reviewable act in the approving PR — so a re-cut over a grown surface
# cannot be green by construction.
#
#
# LOWERED 110 → 94 (SDK methods) on 2026-11-16 by #12901 wave 2 — the
# control-plane partition (`N1`–`N6`): sixteen members left the public surface and
# every body was privatised. The tools pin is unchanged at 55 (wave 2 touches no MCP
# tool). The pin is lowered to the count THIS tree derives — 94, as `counts:` states —
# and not to any one wave's arithmetic: wave 2 branched before the READ/QUERY
# containers (#11609 family A / #12951) landed their own −8, so its own
# "118 → 102" is that PR's BEFORE/AFTER, not this tree's. Measured here: 110 → 94.
# Same reason as every line below — slack above the live surface is a false PASS
# waiting to happen, and leaving it at 110 would let a re-added retired control-plane
