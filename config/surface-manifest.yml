# batch produced. LOWERING, not raising, is what the pin needs here, and the reason is
# the pin's own: slack above the live surface is a false PASS waiting to happen — a
# re-added retired name (`tortoise_create_source`, `checkpoint`, `assess_source`, …)
# would land UNDER a 72/150 ceiling and `surface-guard` step 7 would stay green over a
# surface that grew back. The same lowering was done after each earlier batch
# (#10906 82 → 76, #10914 76 → 72); batch 1 (#11609's four no-destination
# removals) moved the advertised set 72 → 68 but left the pin at 72, which is the
# slack this removes. 124 is also the PLATEAU the three Phase-2 lanes converge on —
# each replaces members with fewer containers than it retires, so a peer lane lands at
# or below it; a lane that would exceed it has ADDED surface and must say so.
#
# RAISED 149 → 150 on 2026-10-26 by PR #10053 (#4282 Phase 2.2 — the four merges as
# dispatchers). The three NEW public methods are `link_entities`, `update_knowledge`
# and `delete_knowledge`, and every one of them is a row of the owner's 40
