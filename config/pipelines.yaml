version: 1
pipelines:
  github_issues:
    enabled: true
    source: github
    sourceKind: github_issue
    trigger: manual
    entity_mapping:
      repo_to_team: {}
      label_to_team: {}
      label_to_domain: {}
      milestone_to_epic: {}
      user_to_role: {}
    entity_kinds:
      issue_object: pm:issue
      pr_object: pm:card
      created_event: pm:cardCreated
      completed_event: pm:cardCompleted
    connector:
      module: tortoise.connectors.github
      class: GitHubConnector
      config:
        repo: "daniel-ospina/eldato"
        state: open
        limit: 100
        limit: 100
  docs:
    enabled: false
    source: filesystem
    trigger: manual
    strategy:
    - path-derive
    entity_mapping:
      path_to_team: {}
      path_to_domain: {}
