# ── #6137: relocate the slow tail out of the fast halves' critical path ───
#
# THE MEASUREMENT (leg-a/leg-b/slow-a/slow-b junit of full-selection run
# 36430905427, merge-queue, 2026-09-28). The fast pool carried 3,219s of test
# time over two halves (1,611 / 1,608s) and ran 31.3 / 31.9 min wall, while the
# two slow legs carried 169 / 192s and ran 5.7 / 5.4 min. A FOUR-way-parallel
# docker pool was split 5.5:1, so the critical path was the fast half for a
# reason that is pure PACKING, not coverage.
#
# WHY `slow_files` AND NOT THE `on_demand:` LANE. This is a RELOCATION, not a
# removal: a `slow_files` entry runs in the same docker lane the fast pool does
# — both falkordb services, the same
# `-m 'not track_b and not live and not integration'` marker, the same 300s
# per-test timeout, the same junit coverage manifest — so every nodeid still
# runs PRE-MERGE, one leg over. The `on_demand:` lane removes the pre-merge
# guarantee, and #6137 is explicitly gated on the rail-parity question for
# removals (agent-infra #1516): moving a merge-gate test off the gate is a
# reviewed-removal decision this lane does not hold. Relocation across the two
# pre-merge docker pools needs no such declaration and loses no coverage —
# which is why it is the instrument used here.
#
# WHICH FILES, AND WHY THIS CUT. The cut is the list below: the files under
# `slow_files` that the base cut did not already move (35 of them, 1,317.6s of
# committed `durations` weight at the time of writing). Both figures are
# recomputable from that list — quote the list, not this sentence, and note the
# leg-union check fails closed if the two diverge. Four exclusions, all
# load-bearing:
#   * test_capture_install.py and test_session_verify.py are NOT moved. Each is
#     registered under `api` while its own source's diff selects `core`, and
#     `classify_test_file` takes the FIRST match — so with a `slow_files` home
#     the `core` diff's `slow_selected` never contains them and the guard runs
#     on neither leg (`test_every_named_guard_runs_for_its_own_source`, the
#     #7076 class). They stay in the fast pool.
#   * the same rule excludes EIGHT MORE dual-registered files: eval/write_path/
#     test_write_path_benchmark.py, test_4314_inert_hooks.py,
#     test_capture_loop_responsiveness.py,
#     test_graph_write_loop_responsiveness.py, test_journal_embedding_5004.py,
#     test_probe_reset_inflight_4608.py, test_sdk_surface.py and
#     test_selfhost_health_probe_executor.py. Each is named by a SECOND surface
#     (core, and for the first also ep/eval), and a diff that selects that other
#     surface subtracts it from the fast pool (`files -= slow`) without ever
#     re-adding it to `slow_selected` (that set is keyed by the FIRST-match
#     classifier) — so it would run on NEITHER leg. The second surface's own
#     slow files usually keep `slow_run` True, which is what made this silent.
#     They stay in the fast pool too, and
#     tests/test_ci_selection.py::test_every_slow_file_a_second_surface_names_
#     runs_for_that_surface pins the class rather than these names.
#   * the `onboarding` surface is EXCLUDED. A `website/*` PR selects
#     `onboarding` and is pinned to `slow_run is False`
#     (test_ci_selection.py::test_public_site_surface_change_selects_onboarding_
#     and_skips_slow) — the #2147/#2148/#3332 cost gates. Putting an
#     onboarding-owned file here would make every `website/*` PR pay both slow
#     legs; that is a real cost regression on a common PR shape, not a
#     bookkeeping detail. (A docs-only diff is unaffected either way: it is
#     filtered to `changed == []` and takes the dedicated early return whose
#     result pins `slow_run` to False —
#     ::test_docs_only_skips_slow_and_carve_out — so it can never reach the
#     `slow_files` lookup at all.)
#   * the `tier1` files are EXCLUDED: `slow_file_issues` fails closed on
#     "slow file X is also in tier1 (fast gate leak)", because a file in both
#     lists is selected by BOTH the smoke gate and the slow leg. Two of the
#     heavier fast-pool rows (test_quota, test_writer_inventory) sit in tier1
#     and were dropped from the first cut for exactly this — the drift guard
#     caught it, which is the guard working.
#   * `test_battery_corpus.py` is NOT moved: it shells out to bare `uv run` and
#     only the fast job pre-warms uv.
# Everything below is otherwise lane-agnostic (verified: no `uv`, no
# TORTOISE_ASK_LLM_REGRESSION — the fast job sets it and the slow legs do not).
#
# THE RESIDUAL, NAMED. These legs are packed on the `durations` map, and the
# map's slow-pool rows are themselves only as fresh as the last sweep
# (`tools/ci_timing.py --refresh-durations`, run by `ci-timing.yml`), so a stale
# row mis-ranks the pack. The watchdog's headroom (recomputed from the
# committed leg weights by `test_slow_leg_bounds_clear_the_committed_work`) is
# what absorbs a ranking error; the durable fix is the scheduled refresh
# (`.github/workflows/ci-timing.yml` → `tools/ci_timing.py --refresh-durations`),
# which ships on its own and is NOT half-fixed here.
#
# There are NO committed file lists left to describe: `test-slow` carries a
# `${{ fromJSON(...slow_matrix) }}` matrix, and that job's own drift-guard step
# fails closed if the union of the EXPANDED legs stops matching
# `slow_gating_files()` (`slow_files` minus carve-out minus the non-gating lane,
# #10194) on this same `durations` map. The 40m in-step
# watchdog under the 60m outer cap are LITERALS #9539 deliberately left alone
# (5.3x / 7.9x the 7.58m heavier derived leg when they were chosen; 6.99x /
# 10.5x at today's 5.72m leg — the multipliers are DERIVED, so re-derive them
# rather than quoting these); deriving them from the leg
# weight is the per-leg `matrix.watchdog_minutes` follow-up. The floor that
# keeps the literals honest is
# tests/test_ci_selection.py::test_slow_leg_bounds_clear_the_committed_work.
