# #3395: per-file CI wall time (seconds), swept from the junit artifacts of four
# completed 2026-09-22 runs rather than entered by hand — two push-to-main runs
# (35770984825 at b8ded3646, 35779482728 at 45aa52f70) and two runs of branch
# fix/3671-onboarding-truth-surface (35755845755 attempt 2 at 8478de353 — attempt 1
# of that run was killed by the 55m watchdog; 35743868968 at 8116a93fc, whose
# `test (b)` leg finished with 5 failures — a test that fails still costs the time
# it took).
#
# Method: a file's weight is what it costs the leg that CARRIES it in the split —
# fast-pool files from `pytest-log-test-a` / `-test-b` — as the sum of
# `testcase/@time` over the file's own testcases, taking the LARGER value across
# the four runs, floored at 0.1s. Only fast-pool files are packed by the split, and
# only they are re-derived here. `duration_issues()` accepts a slow-file or carve-out
# key — a lane row carries that lane's cost as a declarative entry — but `fast_pool()`
# drops those files before packing, so such a row is never packed; a lane row this
# sweep cannot measure is carried forward with an `# unmeasured` marker.
# Legs that do not feed the split are excluded deliberately: `test-track-b` and
# `d14-hosted-api` select different marker sets than the halves
# (`-m 'not track_b and not live'`) and d14 emits `junit-d14.xml`, so summing them
# would double-count files that also run there (`test_ingest_safety.py` reads 4.2s
# across all legs where the carrying half spends ~1.0s).
#
# Why the larger across runs and not one run: a file's measured cost depends on how
# loaded its leg is, and the two contexts differ materially (the same file can read
# 4s in one and 59s in the other, while the two runs within one context agree
# closely). The split is a bound for a fixed watchdog, so the larger value wins.
# Known limitation of the method: a leg's once-per-leg import/collection cost is
# shared by the whole leg and is not attributed to any file.
#
# #3400: consumed by split_fast_gate (LPT) for BOTH the tier-2 `--split` path and
# the full-matrix push halves; duration_coverage_issues() floors coverage at 90%.
# A weight is a measured CI value wherever one exists: the sweep takes the CI junit
# wall time of the leg that CARRIES the file, not a local timing, because the CI wall
# is what the split must model. The exceptions are named below: the pinned equality
# (borrowed from a measured sibling), the row retained from main (a local embedded-lane
# timing from #4602, kept deliberately), any row marked `# unmeasured` (a file no leg
# of this sweep's four source runs collected; see the RETAINED paragraph), and a NEW
# file's first weight, which carries the flat default until a sweep collects it
# (`test_venture_pack.py`, #3419). That last one is deliberately NOT "just pick a
# number": a weight is a SHARD-LAYOUT input, so a number that does not model CI
# decides which files run together. A local 67.2 was tried there first and did
# exactly that — see that row. This is a list of
# CATEGORIES, not of every such row: further local-timing rows predate this note
# (search `locally measured`), and refreshing them all is #5215's job.
#
# ONE row borrows its value: test_mcp_rename_table.py is held equal to
# test_bridge_table.py's measurement because
# tests/test_mcp_rename_table.py::test_duration_weight_matches_the_sibling_generator_suite
# requires the two generator suites to carry one weight — the pin constrains
# equality, not the number. (The RETAINED row below shares the property that its value
# is not this sweep's measurement of the file, as do the two rows marked
# `# unmeasured` below; see there.)
#
# OVERRIDES: rows whose previous value was a recorded decision or a deliberate
# cost-model choice — a #4282 reserve, a load-range value, a #3895 loose middle,
# a #2517 pin, a #3501/#3718 high-variance sample — replaced here by the
# measurement, or (the pinned generator row) held equal to its measured sibling.
# The criterion is the note's INTENT, not its size: each of these rows was hand-set
# to steer the packer. A first cut entered only to clear the 90% coverage floor — a
# flat 2.0 default, or a local reading whose note says "refresh from junit once there
# is one" — states provenance rather than a weighing choice, so it is not a decision
# and is not listed; the four largest such re-derivations are named after the list so
# that a veto can reach them too. Each override is reopened on #3395 for a veto;
# none was changed silently:
#   test_bridge_table.py 240.0 -> measured. A documented reserve, recorded in the row
#     comment this sweep replaces (the #4282 banner workstream, PR #4519 — the wording
#     is on the row, not on #4282 itself: "CI-observed range 34s-537s depending on box
#     load"). Its sibling
#     test_mcp_rename_table.py 240.0 -> held equal to it (the pin below), not measured.
#   test_sdk_rename_table.py 60.0, test_sdk_surface.py 120.0 -> measured. The same
#     load-range convention as the replaced row comments ("measured 46s-553s /
#     88s-105s depending on box load").
#   test_pages_bindings.py 40.0 -> measured. Raised from 10.0 by the #3620 review
#     because local warm samples were 30-45s; the CI junit for this file is 5.5-7.3s.
#   test_no_legacy_token_path.py 60.0, test_dump_edge_asymmetry_3895.py 90.0,
#     test_read_routes_loop_responsiveness.py 30.0,
#     test_graph_write_loop_responsiveness.py 30.0 -> measured. Local/host samples
#     (#3501, #3895, #3718 — both halves of the #3718 pair) rather than CI wall time.
#     Each of these four notes frames its number as a weighing choice for a
#     high-variance file (a SINGLE SAMPLE, a loose middle, a FIRST ESTIMATE) rather
#     than a measurement of it, and all four err high (the measured replacement is
#     smaller in every case), which is the conservative side to keep in view for a
#     veto — but that is not why they are listed.
#   test_build_cohorts_2517.py, test_session_reinjection.py,
#     test_session_reinjection_rules.py, test_eval_reinjection_cap_resume.py,
#     test_guard_measured_revision.py -> measured, from a deliberate 0.0 (#2517: the
#     minimum weight, chosen so the re-derivation would NOT re-order the halves). A
#     re-derivation re-packs the pool by construction, so that pin no longer
#     preserves what it was there to preserve; #2517's concern (order-dependent
#     isolation failures) is what this branch's CI run tests.
#   Not decisions, but among the largest re-derivations and named so a veto can reach
#   them too (local readings whose notes asked for a refresh from junit):
#   test_fly_secret_drift.py 434.0 -> 8.5, test_4314_inert_hooks.py 170.0 -> 23.9,
#   test_from_uri_userinfo.py 55.6 -> 2.7, test_finding_provenance.py 30.0 -> 1.7.
#
# ONE row is RETAINED rather than re-derived: test_selfhost_health_probe_executor.py
# keeps main's 28.1 (#4602), whose own note asks for a re-measurement from the first
# POST-merge junit artifact. The discriminator is that NOTE, not the run dates: #4602
# also rewrote test_selfhost.py, test_monitoring.py and test_ci_selection.py, and those
# rows WERE re-derived from the same pre-#4602 runs. Only test_selfhost.py's
# re-derivation moves down (21.6 -> 6.2; the other two move up), and for a split bounded
# by a wall-clock watchdog the larger value is the safe side — but 15.4s is 0.6% of a
# half and no note asks for that file to be re-measured, so its measurement stands and
# the row is flagged here rather than retained. The PRE-sweep block's other 0.0 rows
# were measured-negligible values from the #3400 sweep, not pins: only the five #2517
# rows in the OVERRIDES list above were deliberate.
# A row's comment is kept only while the value AND its stated basis are unchanged:
# a provisional "re-measure from junit" note is dropped when the sweep re-derives the
# row (the re-derivation IS that refresh), and a note whose cited run is not in the
# basis is dropped as stale provenance even where the value survives — why
# test_onboarding_truth_surface.py keeps its 4.0 with no note (it cited run 35705184320
# and 3.6s; #3746 asks for a row, never for a value). (The retained row keeps its note
# because it was not re-derived at all.)
#
# Coverage rests on measurement: every row below is a measured value except the
# pinned row (test_mcp_rename_table.py, held equal to its measured sibling), the
# RETAINED row (test_selfhost_health_probe_executor.py), and any row marked
# `# unmeasured` (a file no source leg collected, whose value is carried forward
# and is not a measurement).
  test_fly_secret_drift.py: 8.5
  # #4071: four hermetic asserts (no DB, no network). The duration-coverage
  # floor counts it as a fast file, so it needs an entry like every other fast
  # file; its own testcase call time is sub-second (the file's wall time is
  # session setup, which the map does not price).
