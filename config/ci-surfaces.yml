isagree about the file's COST, not about what the invariant does.) The placement in `slow_files` is retained deliberately rather than reverted in the same diff: it costs ~36s on a 14.19m leg that runs on every full push anyway, and the LOADED cost is the uncertain quantity a fast shard's 15m watchdog would have to absorb. 45.0 is committed as the weight: it sits at the top of the range of healthy readings this note cites (35.6-48.0s; 45.0 is 3s under the slowest of them), which keeps the `test_slow_leg_bounds_clear_the_committed_work` bound close to honest. It is deliberately NOT inflated past the slowest reading — a weight chosen to make a sentence true is the same error this note exists to correct. Revisit the placement with `tools/ci_timing.py --refresh-durations`, whose CI measurement settles it.
