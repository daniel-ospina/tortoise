# ── THE NON-GATING LANE (`on_demand:`) ──
#
# A file listed here RUNS but does not GATE: it is excluded from every pre-merge
# leg (`fast_pool`, the slow legs, the tier-2 selection, the push matrix) by
# `tools/ci_selection.py`, and run by a manual workflow instead. Two entry forms:
#   - `path/to/test_x.py` — one file (`tests/`-relative)
#   - `dir/**`            — every `test_*.py` under that directory, expanded
#                           against DISK, so a NEW file in the subtree is off the
#                           gate without a second config edit (#10194)
# A runner must exist for every entry (`leg_coverage_issues` cannot see a runner,
# so this comment is the record): `test_perf_lane_volunteer_context.py` →
# `.github/workflows/perf-lane.yml`; `eval/retrieval/test_integration.py` →
# BOTH `.github/workflows/evals-on-demand.yml` (its own literal entry: blank
# dispatch, embedded shape) and `.github/workflows/eval-suite-manual.yml` (it is
# also inside `eval/**` below); the two eval subtrees → `eval-suite-manual.yml`.
# ⛔ Not `evals-on-demand.yml` for the subtrees: that workflow resolves
# `on_demand_literal_runner_files()` and runs 2 of these 43, so pointing a human
# at it for an `eval/**` file sends them to a green run over a file it never
# touched.
on_demand:
  # #4711: 24.9% of ALL measured test time in one file; its own docstring says it
  # asserts report SHAPE, never absolute quality. Also covered by `eval/**` below.
  - eval/retrieval/test_integration.py
  # #3992: the dedicated perf lane's file — a shared-runner p95 is a flake, not a
  # correctness signal.
  - test_perf_lane_volunteer_context.py
  # #10194 (owner decision A, 2026-10-27): the eval subtrees do not gate a merge.
  # Measured at f8970b53: 42 files / 1097 test functions (3% / 3.3% of the suite)
  # carrying 2604s of the committed `durations` map (20.8%) across ALL 9 fast
  # shards and the slow leg — the profile of three python-ci shards that were the
  # top CPU consumers on a self-hosted runner (205%/176%/34% of 8 cores).
  # Evals are downstream of the storage + MCP/SDK migrations by the owner's own
  # ordering; they run on demand (`eval-suite-manual.yml`), never on a merge.
  # This is a MEMBERSHIP change only — no check name changes, and the `eval`
  # entries in `surfaces:` above stay (they are module OWNERSHIP, `tortoise/*.py`).
  - eval/**
  - longmem_eval/**

# ── #6133: DECLARED SLEEP IS NOT GATE COST, AND NOT THE FLOOR ──
#
# DECLARED sleep is not gate cost, and ranking by it produces a wrong floor.
#    #6133 was filed on a census that summed the suite's literal `time.sleep`
#    arguments to ~16,000s ("4.5h the suite chose to wait"). The suite's
#    largest such file, tests/test_battery_real_deadline.py, declares 7,200.0s
#    of it in a hang SIMULATION — a 3600s sleep on a DAEMON thread
#    that a 2-3s deadline abandons; a paid-sleep probe measured 0.0s of it. The
#    600s values in test_monitoring.py / test_hosted_api.py are the same shape
#    (`_hang()` under a 0.05-0.3s monkeypatched bound). Read the floor from the
#    measured weights above; never from the sum of sleep() arguments.
#    Census: https://github.com/daniel-ospina/tortoise/issues/6133 (the
#    per-file census command and the paid-vs-declared probe are recorded there).
