version: 1

# #6135: how many parallel shards the fast pool (`test`) is split into. The PR
# gate's critical path IS `max(shard)`, so this single number decides it.
#
# WHY A REVIEWED LITERAL (and not derived from `durations` per diff): the shard
# set IS the required-check name set (`test (a)`, `test (b)`, …). The merge
# rail's lane-parity subtracts the PR's job names from main's, and branch
# protection / the Mergify queue name `python-ci-gate` — so a set that drifted
# per diff would change an unreviewed contract run to run. Raising S here is a
# one-line, reviewable change; the labels are positional letters so an S-adding
# diff stays a SUPERSET of main's names (a rename would refuse every merge).
#
# The value (recomputable from the committed `durations` map:
# `max(s['est_seconds'] for s in push_legs({**m, 'fast_shards': S})['shards'])`):
# S is chosen by that formula on the committed map, and the minutes it yields
# are deliberately NOT restated here — they move with every re-cut, which is
# how this block went stale twice. The authoritative pins are the balance-band
# test (`test_real_workflow_halves_are_consistent`) and the lane-parity
# superset test below, both of which recompute from the map.
#
# S=9 is also what the lane-parity contract requires: main publishes
# `test (a)`…`test (i)` and a PR may only ADD to that set, never remove from it
# (`test_shard_labels_are_a_superset_when_s_changes` pins the polarity; the
# merge rail refuses a removal).
#
# The 1.25x balance band is enforced by `test_real_workflow_halves_are_
# consistent`, which recomputes the ratio from the committed map. The old
# "single-file floor" argument is RETIRED: it rested on
# `test_onboarding_state_split.py` dominating max(shard), and #6133 split that
# file — so extra shards do keep reducing max(shard). S=9 is held by the
# lane-parity contract above, not by that argument.
#
# Raising this trades WALL CLOCK for AGGREGATE runner time (the same self-hosted
# capacity the epic is trying to enlarge), so it is a wall-clock lever, not a
# free win.
fast_shards: 9

# W37: the CARVE-OUT pool. `test-carve-out` was the CI critical path as ONE
# unsharded job — measured 2026-09-30 over 23 PR runs and 3 successful main
# runs: work p50 16.9m against a median run wall of 18.6m, i.e. 91% of the wall,
# while the fast band is already split nine ways. Sharding it is the demand
# reduction that has to land BEFORE any capacity argument, because the wall was
# `max(9 fast shards, 1 carve-out)` and the carve-out was the pole in every run
# examined.
#
# Absence means 1 — the unsharded job this repo ran until now — so deleting this
# key is a complete rollback (unlike `fast_shards`, where absence means 2).
# 3 is chosen from the measured distribution: the carve-out's work is BROAD —
# its slowest single test is a small share of the suite's total test time — so
# it packs evenly and each shard lands near a third of the suite's test time,
# level with the fast band instead of 16.9m above it. Raising this trades wall
# clock for aggregate runner-minutes, exactly like `fast_shards`.
carve_shards: 3

