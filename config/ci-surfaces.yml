version: 1

# #6135: how many parallel shards the fast pool (`test`) is split into. The PR
# gate's critical path IS `max(shard)`, so this single number decides it.
#
# WHY A REVIEWED LITERAL (and not derived from `durations` per diff): the shard
# set IS the required-check name set (`test (a)`, `test (b)`, …). The merge
# rail's lane-parity subtracts the PR's job names from main's, and branch
# protection / the Mergify queue name `python-ci-gate` — so a set that drifted
# per diff would change an unreviewed contract run to run. Raising S here is a
# one-line, reviewable change; the labels are positional letters so an S-adding
# diff stays a SUPERSET of main's names (a rename would refuse every merge).
#
# The value (recomputable from the committed `durations` map:
# `max(s['est_seconds'] for s in push_legs({**m, 'fast_shards': S})['shards'])`):
# S is chosen by that formula on the committed map, and the minutes it yields
# are deliberately NOT restated here — they move with every re-cut, which is
# how this block went stale twice. The authoritative pins are the balance-band
# test (`test_real_workflow_halves_are_consistent`) and the lane-parity
# superset test below, both of which recompute from the map.
#
# S=9 is also what the lane-parity contract requires: main publishes
# `test (a)`…`test (i)` and a PR may only ADD to that set, never remove from it
# (`test_shard_labels_are_a_superset_when_s_changes` pins the polarity; the
# merge rail refuses a removal).
#
# The 1.25x balance band is enforced by `test_real_workflow_halves_are_
# consistent`, which recomputes the ratio from the committed map. The old
# "single-file floor" argument is RETIRED: it rested on
# `test_onboarding_state_split.py` dominating max(shard), and #6133 split that
# file — so extra shards do keep reducing max(shard). S=9 is held by the
# lane-parity contract above, not by that argument.
#
# Raising this trades WALL CLOCK for AGGREGATE runner time (the same self-hosted
# capacity the epic is trying to enlarge), so it is a wall-clock lever, not a
# free win.
fast_shards: 9

# W37: the CARVE-OUT pool. `test-carve-out` was the CI critical path as ONE
# unsharded job — measured 2026-09-30 over 23 PR runs and 3 successful main
# runs: work p50 16.9m against a median run wall of 18.6m, i.e. 91% of the wall,
# while the fast band is already split nine ways. Sharding it is the demand
# reduction that has to land BEFORE any capacity argument, because the wall was
# `max(9 fast shards, 1 carve-out)` and the carve-out was the pole in every run
# examined.
#
# Absence means 1 — the unsharded job this repo ran until now — so deleting this
# key is a complete rollback (unlike `fast_shards`, where absence means 2).
# 3 is chosen from the measured distribution: the carve-out's work is BROAD —
# its slowest single test is a small share of the suite's total test time — so
# it packs evenly and each shard lands near a third of the suite's test time,
# level with the fast band instead of 16.9m above it. Raising this trades wall
# clock for aggregate runner-minutes, exactly like `fast_shards`.
carve_shards: 3

# #9539: the SLOW pool's leg count. `test-slow` is the merge ceiling: measured
# over the 5 newest completed main runs (jobs API + each leg's own junit.xml,
# 2026-10-21) the job is 14.2–23.0m while the pool it runs is 37.05m of
# measured test time (37.88m on the committed `durations` map) split two ways
# with no xdist — one serial pytest process per leg.
#
# The legs were ALREADY LPT-optimal (per-file medians pack to 18.52/18.52;
# observed medians 18.25/18.80, and the run-to-run imbalance flips sign), so
# rebalancing is not the lever and setup is only 1.9–2.1m of a ~20.5m leg. The
# remaining lever is the number of legs, and 5 is that arithmetic rather than a
# preference: `ceil(37.88 / (10m guideline − 2m setup)) = 5` → 7.58m of test
# time per leg, ~9.6m projected job wall. 2 legs cannot fit a 37.9m pool into
# 10m at any split, because the best a split can do is pool/2 = 18.9m.
#
# ⚠️ THE 37.88m / 7.58m ABOVE ARE THE 2026-10-21 MEASUREMENT, NOT TODAY'S POOL.
# #10194 took the non-gating lane out of the slow legs (5 eval files, 5.26m:
# the pool went 65 files / 33.8m / heavier leg 6.77m -> 60 / 28.56m / 5.72m), so
# the derived pool is 60 files / 28.56m of committed weight and the same formula
# now yields `ceil(28.56 / 8) = 4`. **5 IS DELIBERATELY KEPT**, and the reason is
# wall clock, not arithmetic: at 4 legs the pack lands ~7.14m of test time on the
# heavier leg → ~9.14m with the ~2m setup term, which still fits the 10m
# guideline; 5 legs lands 5.72m → ~7.72m. So keeping 5 buys ~1.4m of merge
# ceiling for one more runner — the same trade this key exists to make, and
# LOWERING it to 4 is its own decision that belongs with #9539's objective and a
# fresh measurement, not with a pool that shrank.
#
# The current derived shape (any date): `python3 tools/ci_selection.py
# --non-gating-report` prints every leg with its file count and estimated
# seconds. At this head: 5 legs, 11/12/11/13/13 files, 5.69–5.72m each.
#
# The legs are DERIVED (`tools/ci_selection.slow_shard_entries()` LPT-packs
# `slow_gating_files()` — `slow_files` minus the carve-out minus the non-gating
# lane, #10194 — from the same `durations` map the fast band uses) so
# no hand-maintained list can rot — the failure mode that made the two-leg
# lists drift to 6.4:1 before #9017. WHAT IT COSTS: aggregate runner-minutes
# scale with the leg count (~41 → ~48 for the setup term), the same trade
# `fast_shards`/`carve_shards` make; wall clock is the objective (#9539).
#
# Absence means 2 — the shape this repo ran until now — so deleting this key
# gives the leg count back. It is NOT, on its own, a complete rollback: the
# wall-target guard recomputes from the map, and 2 legs project ~20.9m against
# the 10m target, so removing the key reds it
# (`tests/test_ci_selection.py::test_slow_shards_are_duration_packed_and_meet_
# the_wall_target`). A real rollback therefore moves the target/guard too — which
# is what makes a growing slow file red HERE rather than silently restoring the
# ceiling.
slow_shards: 5

