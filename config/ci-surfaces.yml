# ── #9017 (2026-10-18): the slow pool's weights and its leg split are MEASURED
#
# WHY THIS BLOCK EXISTS. `test-slow (b)` was reported as the CI critical path
# (median 23.8 min) while `test-slow (a)` finished far earlier, so merges queued
# behind one shard. The hypothesis was that the WEIGHTS the legs are packed from
# were wrong — 28 of the 64 leg files carried an `# unmeasured` placeholder, and
# several CI-era rows had rotted. Half of that hypothesis held: the map WAS stale
# (see the measurement below). The other half did not. On the CI-measured weights
# the two legs were 17.98m / 19.90m — a 1.11:1 split, not a 1.76:1 one — so the
# packer was not the problem the reported median implied, and the shard's wall
# time is dominated by the POOL, not by how it is cut. This is #6137's lesson
# arriving from the other side: the packer was fine, part of its input was stale,
# and the reported symptom named a cause it could not distinguish from the pool's
# own size.
#
# An earlier revision of THIS BLOCK carried the opposite reading — 23.42m / 13.30m,
# a 1.76:1 imbalance — because it was computed from local per-file CPU. That
# instrument was invalid (contended host; see below), and the cut it justified
# made the critical leg WORSE (20.82m). Both halves are recorded rather than
# quietly deleted: the first because a stale map is a real defect that this
# change fixes, the second because it is the reason to trust the junit column.
#
# WHAT WAS MEASURED, HOW, AND WHEN — the SECOND measurement, and why the first
# one was thrown away. This block originally carried per-file CPU seconds taken
# locally on 2026-10-18. That instrument is INVALID here and the numbers derived
# from it were wrong, non-uniformly: this host runs a fleet at a 1-minute load
# average of 70-160, and CPU seconds inflate under cache/contention pressure by
# a factor that differs per file. The clearest case is `test_index_cli.py`:
# 338.0s of local CPU for 25.0s of CI test time (13.5x). A 13.5x over-estimate on
# one file moved it to the head of the LPT queue and produced a split that was
# WORSE than the one it replaced (CI-measured 20.82m vs the original 19.90m).
#
# The authoritative instrument was already in the repo: the junit artifacts the
# slow legs upload (that is what `tools/ci_timing.py` exists for, #5050). Every
# number below is now the sum of per-test `time` from the junit of ONE CI run of
# this branch's own legs — run 39165691659, 2026-10-18 — which covers all 65
# pool files (4,575 tests, 37.88m of test time). Local CPU is not quoted
# anywhere in this block, and the per-file `durations` rows for the pool were
# rewritten from that junit, each with `# #9017 CI-junit` and, where it moved by
# more than 0.1s,
# `; was <the value the map carried before>`.
#
# THE MEASUREMENT ITSELF, largest first. The bracketed figure is the value the map
# carried BEFORE #9035's local-CPU pass — the reading this table is correcting —
# not the CPU value #9035 left behind (that one is on each row, after `was`):
#
#   test_surface_manifest      199.1  [132.2]   — 1.5x understated
#   test_ci_selection          184.1  [ 39.9]   — 4.6x understated
#   test_battery_setup         177.7  [ 98.8]   — 1.8x
#   test_hosted_api            174.5  [114.6]   — 1.5x
#   eval/write_path/test_write_path_runner 146.2 [135.8] — 1.1x, and note it RAN:
#                                               the local pass could not finish it
#   test_capture_session        90.6  [ 53.9]   — 1.7x
#   test_platform_seams         85.8  [ 74.5]   — 1.2x
#   test_source_inheritance_own 68.9  [ 29.8]   — 2.3x
#   eval/why_suite/test_why_suite_benchmark 65.0 [73.3] — 0.9x
#   eval/retrieval/test_run     63.6  [ 25.9]   — 2.5x
# The single largest correction is `eval/harness/test_harness_benchmark` 9.7 -> 59.1
# (6.1x); the largest the OTHER way is `test_index_cli` 29.2 -> 25.0 — the row was
# near-right, and it was the LOCAL re-measurement that was wrong.
#
# THE SPLIT — HISTORICAL as of #9539: the 2-leg era's pack of that map, recorded
# because it is the measurement the leg count was argued from, NOT the shape the
# lane runs now. #9539 replaced the committed pair with legs DERIVED from this same
# map (`slow_gating_files()` — `slow_files` minus the carve-out minus the
# non-gating lane since #10194 — LPT-packed into `slow_shards` = 5; the 13-files-each
# / 7.56m–7.58m figures below are the PRE-#10194 shape of that pack, 5 eval files
# and 5.26m of it have since left the pool). What the 2-leg pack bought, stated
# against BOTH
# baselines because they answer different questions:
#   vs the legs this PR actually REPLACES (main's, i.e. #9035's cut):
#       17.06m / 20.82m  ->  18.95m / 18.93m   critical leg -1.88m, -9.0%
#   vs the legs that stood BEFORE #9035 (the pre#9017 pair):
#       17.98m / 19.90m  ->  18.95m / 18.93m   critical leg -0.96m, -4.8%
#   and #9035's cut had itself made that leg 0.92m WORSE than the pair it replaced.
# The ceiling those numbers show is arithmetic and is the real answer to "why not
# 25%": a perfectly balanced split of the 37.88m pool is 18.94m, and the pre#9017
# split was already within 0.97m of it. Re-balancing the two legs cannot cut the
# critical path much further — only removing WORK from the pool can, which is why
# #9017's two tooling fixes (a memoized AST parse in `tools/surface_manifest.py`,
# two pre-filtered whole-tree scans in `tests/test_markers.py`) are the part with
# the durable effect, and why the re-cut is the part that measures whether the map
# is right. Matching that arithmetic is also why #9539's lever is the LEG COUNT
# rather than a better cut of two: `slow_shards: 5` takes the critical leg from
# 18.95m to 7.58m.
# `test_slow_leg_bounds_clear_the_committed_work` re-derives the 40m watchdog's
# headroom from the DERIVED legs against the 2.0x `WATCHDOG_HEADROOM` floor (5.3x
# at the 7.58m heavier leg of the pre-#10194 pool; 6.99x at today's 5.72m — the
# ratio is DERIVED, so it moves with the pool and is not restated as a fixed
# number), and the workflow's drift guard pins the union of the EXPANDED legs to
# `slow_gating_files()`. Read the live shape with `python3
# tools/ci_selection.py --non-gating-report` rather than from a figure here.
# NOTHING was deleted, moved off the pre-merge gate, or
# re-marked: all 65 files still run on a PR, with the same nodeids.
# ⚠️ #10194 exception to that sentence: the FIVE eval files in this list are no
# longer pre-merge (they are the non-gating lane and run from
# `eval-suite-manual.yml`). The `slow_files:` declaration below is kept on
# purpose — the file still needs a `durations` weight and a classification, and
