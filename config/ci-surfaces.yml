# ── ON-DEMAND LANE: runs the pipeline, does not gate the merge ────────────
# A file here is excluded from EVERY pre-merge leg (fast halves, slow, carve-
# out). It runs from the on-demand RUNNERS: `.github/workflows/
# evals-on-demand.yml` for the lane's LITERAL entries,
# `.github/workflows/eval-suite-manual.yml` for the two `dir/**` eval subtrees
# (#10194), and `.github/workflows/perf-lane.yml` for the perf lane (all three
# `workflow_dispatch`; the perf lane is also nightly) — and that is the point.
#
# KNOWN AND DELIBERATE, recorded because it is a real surface: `post-merge-
# validation.yml` ignores only `slow_files` + `tests/e2e`, so it COLLECTS this
# lane on every merge to main (it provisions the embedder, so it is not the
# evals-lane dense-leg failure). That is accepted, not overlooked: post-merge is
# warn-only (no gate impact) and is the only place a lane file would otherwise
# never run without a human dispatch, while the dedicated perf lane stays the
# SLO's owner. The cost accepted: a shared-runner wall-clock red can appear on
# main-validation WITHOUT the perf lane's 2-attempt retry.
#
# WHY A LANE AND NOT JUST DELETING IT FROM slow_files: `fast_pool()` is
# defined as "everything not slow / env-broken / carve-out", so removing a
# file from `slow_files` moves it INTO the fast matrix — the opposite of what
# is wanted. There is no "runs nowhere on the pre-merge gate" state, so this
# key creates one, and `leg_coverage_issues()` is taught about it so a file
# cannot sit here unclassified and unnoticed either.
#
# WHAT IS HERE, AND WHY:
#   eval/retrieval/test_integration.py — 25.4 min, 24.9% of ALL measured
#   test time, and the single dominant cost of the `test-slow (b)` leg
#   (24.9 of its 27.4 min). Its own docstring says it is a WARN-ONLY harness
#   smoke: it asserts the eval runner's REPORT SHAPE (schema_version, the
#   strategy set, ndcg within [0,1], gate verdict membership) and states it is
#   "never asserted for absolute quality". It is a calibration instrument for
#   the retrieval pipeline, not a merge gate: a PR cannot break a customer by
#   changing whether a report contains its strategy keys, and the value it
#   provides at merge time does not justify 25 minutes of the critical path
#   for every PR in a 176-deep queue.
#
#   The genuinely cheap eval unit tests (schema / metrics / grading, all
#   sub-second) stay in the merge path — they are real contracts.
#
#   tests/test_perf_lane_volunteer_context.py — the DEDICATED PERF LANE (#3992).
#   The #2080 plan assigns the hard wall-clock SLO for POST /v1/context
#   ("assert <= 300 ms p95", median of 3 runs of 50) to a dedicated perf lane
#   and says in the same sentence that the lane is "generously margined,
