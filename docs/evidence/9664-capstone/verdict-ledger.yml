#           (1) a later RUNNER-HEADED segment (root 4 above);
#           (2) prose INSIDE the graded command's own segment;
#           (3) a `#` COMMENT;
#           (4) a TRUSTED HEAD's decorative ARGUMENT — `… && echo "I did not run this"`;
#               ⛔ ONLY FOR A PRINTER, and the reason is NOT that "bash executes
#               nothing here": bash executes `echo`/`printf` fine and they succeed,
#               which is exactly why that operand cannot short-circuit the `&&`.
#               The same carriage for a READER/SINK is a FALSE PASS, not inert data
#               — see carriage (6).
#           (5) `NAME=value` is the FIFTH carriage: the leading assignment is
#               stripped and nothing after the `=` is graded, so
#               `A="I did not run this" && uv run pytest …` yields a `verified` row
