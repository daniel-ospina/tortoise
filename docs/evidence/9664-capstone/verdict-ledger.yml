# #9664 — the capstone verdict ledger
#
# WHY THIS FILE EXISTS
# --------------------
# `#9664`'s second acceptance criterion is that "the not covered list is explicit
# (an empty uncovered list is the only clean exit)". Until this ledger existed,
# that list could only be obtained by re-reading the issue's comments and
# re-deciding what counts as a step: three passes produced three denominators for
# the same issue (14 run rows · "18 items" · "22 items"). A criterion whose
# answer changes with the reader is not a criterion.
#
# This file is the RECORD of verdicts a human/agent run reached. It is not a
# run, it drives nothing, and CI does not select it. `tools/capstone_ledger.py`
# validates it and COMPUTES the uncovered list (exit 2 while any row is not
# `verified`); the judgement in every `verdict:` below stays with the runner.
#
# RULES A ROW MUST SATISFY (enforced, fail-closed):
#   * `text` is the criterion QUOTED VERBATIM from the issue — never paraphrased,
#     so the ledger cannot silently drift from the thing being accepted.
#     For the issue's `The run` TABLE (rows S1-S10) the criterion is the ROW, whose
#     `Do` and `Observe` cells are joined with " — ": quoting `Do` alone would drop
#     the observable, and quoting `Observe` alone would drop the action. Both cells
#     appear in full. TWO stated exceptions, so the rule is checkable rather than a
#     claim of purity:
#       - step 5 (S5): its `Do` cell in the issue's table is the placeholder "—"
#         because the step is a server-side observation, so there is no action to
#         join and S5's row is the `Observe` cell alone;
#       - step 4 (S4): the row carries its SURFACE cell (`ChatGPT`) as a prefix,
#         `"ChatGPT: <Do> — <Observe>"`, because the step is the one that runs in a
#         different product and the row is unreadable without saying so. The `Do`
#         and `Observe` halves are still verbatim and complete.
#     `tests/test_9664_
#     capstone_verdict_ledger.py::EXPECTED_TEXT_NEEDLES` pins a distinctive fragment
#     of each row's source cell, so a truncated or rewritten cell fails the suite
#     (this is how the S2 row was caught dropping its `Observe` half).
#   * `verdict` is one of verified | failed | blocked | not-covered. There is no
#     `partial`: every pass that invented one measured the same rows differently.
#   * `verified` requires at least one evidence entry that is a file **TRACKED by
#     git** inside the tree. Described evidence does not count, and neither does a
#     file that exists only on the authoring box (a gitignored lane artifact).
#   * a `cmd:` entry is a RECORD of what was run and does NOT satisfy `verified` on
#     its own — the tool never executes it. It is kept for the reader.
#   * `criteria_expected` (top level, REQUIRED) pins the denominator, so dropping a
#     row without moving the count is a refusal.
#   * YAML merge keys (`<<`) are refused: every row states its own verdict, and a
#     merged anchor can carry a verdict the row does not say.
#   * every non-verified row requires `reason`. An unexplained uncovered row is
#     not an explicit uncovered list.
#   * `evidence_kind` is checked for membership in a closed vocabulary ONLY; no
#     kind grants a waiver. `server-observation` marks S5's shape for the reader,
#     and S5 still needs a tracked artifact to be `verified`.
#
# A MECHANICAL RE-RUN OF THE `cmd:` EVIDENCE:
#   uv run python tools/capstone_ledger.py check

